<script>
(async () => {
  const { t, esc, fmtDate, title, pct, kTokens, fmtStars, fmtDuration, loadIndex, Ratings, modeBanner } = AGF;
  I18N.apply();
  modeBanner(document.getElementById('banner'));
  const $ = (id) => document.getElementById(id);
  const index = await loadIndex();
  let scores = {};
  try { scores = await Ratings.summary(); } catch (e) { console.warn(e); }
  const games = index.games.map((g) => ({ ...g, s: scores[g.id] || null }));
  const avg = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
  const signed = (v) => (v == null ? '–' : `${v > 0 ? '+' : ''}${v.toFixed(1)}`);

  // ---------- 作品ごとの星の平均（横軸は制作日。点が大きいほど評価した人が多い） ----------
  const rated = games.filter((g) => g.s?.votes).sort((a, b) => (a.createdAt < b.createdAt ? -1 : 1));
  const W = 640, H = 260, P = { l: 36, r: 12, t: 12, b: 28 };
  const sy = (v) => H - P.b - ((v - 1) / 4) * (H - P.t - P.b);
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('stats.chart')}">`;
  for (const v of [1, 2, 3, 4, 5]) svg += `<line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${P.l - 6}" y="${sy(v) + 4}" text-anchor="end">★${v}</text>`;
  if (rated.length) {
    const t0 = Date.parse(rated[0].createdAt), t1 = Date.parse(rated[rated.length - 1].createdAt);
    const sx = (iso) => P.l + (t1 === t0 ? 0.5 : (Date.parse(iso) - t0) / (t1 - t0)) * (W - P.l - P.r);
    const maxVotes = Math.max(...rated.map((g) => g.s.votes));
    for (const g of rated) {
      const r = 3 + 5 * Math.sqrt(g.s.votes / maxVotes);
      svg += `<a href="game.html?id=${encodeURIComponent(g.id)}"><circle cx="${sx(g.createdAt)}" cy="${sy(g.s.avg)}" r="${r.toFixed(1)}" class="dot"><title>${esc(title(g))}: ★${fmtStars(g.s.avg)} (${t('votes', { n: g.s.votes })})</title></circle></a>`;
    }
    svg += `<text x="${P.l}" y="${H - 8}">${esc(fmtDate(rated[0].createdAt))}</text><text x="${W - P.r}" y="${H - 8}" text-anchor="end">${esc(fmtDate(rated[rated.length - 1].createdAt))}</text>`;
  } else svg += `<text x="${W / 2}" y="${H / 2}" text-anchor="middle">${t('stats.chart.empty')}</text>`;
  $('chart').innerHTML = svg + '</svg>';

  // ---------- AIごとの記録 ----------
  const byAi = new Map();
  for (const g of games) { const k = g.ai?.model || '?'; if (!byAi.has(k)) byAi.set(k, { ai: g.ai, games: [] }); byAi.get(k).games.push(g); }
  const rows = [...byAi.values()].map(({ ai, games: gs }) => {
    const sum = (f) => gs.reduce((a, g) => a + (f(g) || 0), 0);
    const votes = sum((g) => g.s?.votes);
    const voted = gs.filter((g) => g.s?.votes);
    const gaps = voted.filter((g) => g.aiStars != null).map((g) => g.aiStars - g.s.avg);
    const m = gs.filter((g) => g.metrics);
    const played = gs.filter((g) => g.s?.sessions);
    return {
      ai, n: gs.length, votes,
      stars: votes ? sum((g) => (g.s?.votes ? g.s.avg * g.s.votes : 0)) / votes : null,   // 評価1件ずつの平均
      gap: avg(gaps), broken: sum((g) => g.s?.broken),
      thinking: avg(m.map((g) => g.metrics.thinking).filter((v) => v != null)), turns: avg(m.map((g) => g.metrics.turns).filter((v) => v != null)), minutes: avg(m.map((g) => g.metrics.minutes).filter((v) => v != null)),
      playtime: avg(played.map((g) => g.s.avgSeconds).filter((v) => v != null)), total: sum((g) => g.s?.totalSeconds), replay: avg(played.map((g) => g.s.replayRate).filter((v) => v != null)),
    };
  });
  const cols = ['th.ai', 'th.games', 'th.votes', 'th.stars', 'th.aigap', 'th.broken', 'th.thinking', 'th.turns', 'th.minutes', 'th.playtime', 'th.totaltime', 'th.replay'];
  $('by-ai').innerHTML = `<thead><tr>${cols.map((k) => `<th>${t(k)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>
    <td>${esc(r.ai?.name || '?')}</td><td>${r.n}</td><td>${r.votes}</td><td class="c-fun">${r.stars == null ? '–' : `★${fmtStars(r.stars)}`}</td><td>${signed(r.gap)}</td><td>${r.broken}</td>
    <td>${kTokens(r.thinking)}</td><td>${r.turns == null ? '–' : Math.round(r.turns)}</td><td>${r.minutes == null ? '–' : t('m.min', { n: Math.round(r.minutes) })}</td>
    <td>${fmtDuration(r.playtime)}</td><td>${fmtDuration(r.total)}</td><td>${pct(r.replay)}</td></tr>`).join('') || `<tr><td colspan="${cols.length}" class="muted">${t('empty')}</td></tr>`}</tbody>`;
})();
</script>
