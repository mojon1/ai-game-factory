# サイトを GitHub Pages に公開する（main への push / 手動 / 他ワークフローからの呼び出し）
# 作品一覧 games/index.json はここで生成する（各AIはコミットしない）
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build game index
        run: node tools/build-index.mjs
      - name: Stamp asset versions (avoid stale browser cache)
        run: sed -i "s/__V__/${GITHUB_SHA::8}/g" *.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
