# サイトを GitHub Pages に公開する（main への push / 手動 / 他ワークフローからの呼び出し）
# 作品一覧 games/index.json はここで生成する（各AIはコミットしない）
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      # LINE 通知用: 公開中の作品一覧（公開前の状態）を取っておく
      - name: Fetch published game index
        run: curl -fsSL "${{ steps.pages.outputs.base_url }}/games/index.json?t=$(date +%s)" -o "$RUNNER_TEMP/prev-index.json" || echo "no published index"
      - name: Build game index
        run: node tools/build-index.mjs
      - name: Stamp asset versions (avoid stale browser cache)
        run: sed -i "s/__V__/${GITHUB_SHA::8}/g" *.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      # 新しく公開された作品を LINE に通知（Secrets 未設定なら何もしない）
      - name: Notify LINE about new games
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: node tools/notify-line.mjs "$RUNNER_TEMP/prev-index.json" games/index.json "${{ steps.deployment.outputs.page_url }}"
