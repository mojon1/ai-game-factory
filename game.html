<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI GAME FACTORY</title>
<meta name="theme-color" content="#0d0e12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c8f051'/><path d='M12 9l12 7-12 7z' fill='%23111'/></svg>">
<script src="assets/i18n.js"></script>
</head>
<body>
<header class="site-head">
  <div class="wrap">
    <a class="logo" href="./"><span class="logo-mark">▶</span><span>AI GAME FACTORY</span></a>
    <nav class="nav">
      <a href="stats.html" data-i18n="nav.stats">観測データ</a>
      <a href="about.html" class="nav-q" data-i18n-attr="aria-label:nav.about;title:nav.about">?</a>
      <span class="lang-slot"></span>
    </nav>
  </div>
</header>
<div class="banner" id="banner" hidden></div>
<main class="wrap narrow" id="main"><p class="empty" data-i18n="loading"></p></main>

<!-- 全画面プレイヤー -->
<div class="player" id="player" hidden>
  <div class="phone"><iframe id="frame" title="game" sandbox="allow-scripts allow-pointer-lock" allow="autoplay"></iframe></div>
  <button class="player-close" id="close" type="button"><span aria-hidden="true">✕</span> <span data-i18n="close"></span></button>
</div>

<!-- 遊んだ後の評価シート -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-q">
    <p id="sheet-q" class="sheet-q" data-i18n="rate.q"></p>
    <div class="vbtns" data-rate></div>
    <div class="sheet-foot"><button type="button" class="linkish" data-broken data-i18n="v.broken"></button><button type="button" class="linkish" id="later" data-i18n="rate.later"></button></div>
  </div>
</div>

<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
(async () => {
  const { t, lang, EN, esc, fmtDate, genre, kTokens, loadIndex, loadMeta, Ratings, verdictBar, modeBanner, VERDICT } = AGF;
  const tr = I18N.tr;
  I18N.apply();
  modeBanner(document.getElementById('banner'));
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  let meta;
  try { [meta] = await Promise.all([loadMeta(id), loadIndex()]); }
  catch (e) { $('main').innerHTML = `<p class="empty">${t('notfound')} <a href="./">${t('back')}</a></p>`; return; }
  const gTitle = tr(meta, 'title');
  document.title = `${gTitle} — AI GAME FACTORY`;
  const ai = meta.aiReview, x = meta.metrics, main = meta.credits?.find((c) => c.role === 'main') || {};
  const src = `games/${encodeURIComponent(meta.id)}/index.html?lang=${lang}`;
  const thumb = `games/${encodeURIComponent(meta.id)}/thumb.webp`;
  const vBtns = [2, 1, 0].map((v) => `<button type="button" class="vbtn v${v}" data-v="${v}">${t('v.' + v)}</button>`).join('');
  const aiV = ai ? VERDICT[ai.verdict] : null;

  $('main').innerHTML = `
  <a class="back" href="./">${t('back')}</a>
  <h1 class="gtitle">${esc(gTitle)}</h1>
  <p class="gmeta">${esc(genre(meta.genre))} · ${esc(t('by', { ai: main.name || '' }))} · ${esc(fmtDate(meta.createdAt))}</p>

  <button class="hero" id="hero" type="button" aria-label="${t('play')}">
    <img src="${thumb}" alt="" width="300" height="534">
    <span class="hero-play"><span aria-hidden="true">▶</span> ${t('play')}</span>
  </button>
  <p class="howto">${esc(tr(meta, 'howToPlay') || '')}</p>
  <p class="pc-note">${t('pc.note')}</p>

  <section class="rate-box" id="rate-box">
    <p class="sheet-q">${t('rate.q')}</p>
    <div class="vbtns" data-rate>${vBtns}</div>
    <div class="sheet-foot"><button type="button" class="linkish" data-broken>${t('v.broken')}</button></div>
  </section>

  <section class="result" id="result" hidden>
    <p class="result-thanks" id="thanks"></p>
    <h2>${t('result.title')}</h2>
    <div id="dist"></div>
    ${ai ? `<h2>${t('result.ai')}</h2>
    <div class="ai-verdict"><span class="vchip v${aiV}">${t('v.' + aiV)}</span><span class="muted">${t('works.' + ai.works)}</span></div>
    <p class="ai-comment">${esc(EN && ai.i18n?.en?.comment ? ai.i18n.en.comment : ai.comment)}</p>` : ''}
    <button type="button" class="linkish" id="change">${t('rate.change')}</button>
  </section>

  <details class="more">
    <summary>${t('sec.more')}</summary>
    ${tr(meta, 'concept') ? `<h3>${t('sec.concept')}</h3><p>${esc(tr(meta, 'concept'))}</p>` : ''}
    ${x ? `<h3>${t('sec.metrics')}</h3>
    <dl class="metrics">
      <div><dt>${t('m.model')}</dt><dd>${esc(main.name || '')}<small>${esc(main.model || '')}</small></dd></div>
      ${x.effort ? `<div><dt>${t('m.effort')}</dt><dd>${esc(x.effort)}</dd></div>` : ''}
      <div><dt>${t('m.thinking')}</dt><dd>${t('m.tokens', { n: kTokens(x.thinkingTokens) })}</dd></div>
      <div><dt>${t('m.output')}</dt><dd>${t('m.tokens', { n: kTokens(x.outputTokens) })}</dd></div>
      <div><dt>${t('m.turns')}</dt><dd>${t('m.times', { n: x.turns ?? '–' })}</dd></div>
      <div><dt>${t('m.tools')}</dt><dd>${t('m.times', { n: x.toolCalls ?? '–' })}</dd></div>
      ${x.validationRuns ? `<div><dt>${t('m.runs')}</dt><dd>${t('m.times', { n: x.validationRuns })}</dd></div>` : ''}
      <div><dt>${t('m.minutes')}</dt><dd>${t('m.min', { n: x.minutes })}</dd></div>
      ${meta.code ? `<div><dt>${t('m.code')}</dt><dd>${(meta.code.bytes / 1024).toFixed(1)} KB</dd></div>` : ''}
    </dl>
    <p class="muted small">${t('m.note')}</p>` : ''}
    ${ai?.similar ? `<h3>${t('sec.similar')}</h3>
    ${ai.similar.length ? `<ul class="similar">${ai.similar.map((s) => `<li><span class="sim">${t('sim.' + s.similarity)}</span> <b>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener nofollow">${esc(s.title)}</a>` : esc(s.title)}</b><br><span class="muted">${esc(EN && s.note_en ? s.note_en : s.note)}</span></li>`).join('')}</ul>` : `<p class="muted">${t('similar.none')}</p>`}` : ''}
    ${ai?.playLog?.length ? `<h3>${t('sec.playlog')}</h3>
    <div class="playlog">${ai.playLog.filter((s) => s.image).map((s) => `<figure><img src="games/${encodeURIComponent(meta.id)}/${esc(s.image)}" alt="" loading="lazy" width="240" height="427"><figcaption>${String(s.step).padStart(2, '0')} · ${esc(EN && s.noteEn ? s.noteEn : s.note || '')}</figcaption></figure>`).join('')}</div>` : ''}
  </details>`;
  document.querySelector('#sheet [data-rate]').innerHTML = vBtns;

  // ---------- 評価 ----------
  let session = { plays: 0, seconds: 0 };
  async function showResult(note) {
    let s = null;
    try { s = (await Ratings.summary())[id] || null; } catch (e) { console.warn(e); }
    $('dist').innerHTML = verdictBar(s);
    $('thanks').textContent = note || '';
    $('result').hidden = false;
    $('rate-box').hidden = true;
  }
  async function rate(verdict, broken) {
    try {
      await Ratings.submit(id, { verdict, broken, plays: session.plays, seconds: session.seconds });
      closeSheet();
      showResult(broken ? t('rate.broken.done') : t('rate.thanks'));
    } catch (e) { closeSheet(); $('thanks').textContent = t('rate.err'); }
  }
  document.addEventListener('click', (e) => {
    const v = e.target.closest('[data-rate] [data-v]');
    if (v) return rate(Number(v.dataset.v), false);
    if (e.target.closest('[data-broken]')) return rate(null, true);
  });
  $('change').onclick = () => { $('result').hidden = true; $('rate-box').hidden = false; };
  if (Ratings.mine(id)) showResult('');

  // ---------- 全画面プレイヤー ----------
  const player = $('player'), frame = $('frame');
  let openedAt = 0, pushed = false;
  addEventListener('message', (e) => {
    if (e.source !== frame.contentWindow || !e.data || !e.data.agf) return;
    if (e.data.agf === 'start') session.plays++;
  });
  function openPlayer() {
    session = { plays: 0, seconds: 0 };
    frame.src = src;
    player.hidden = false;
    document.body.classList.add('locked');
    openedAt = performance.now();
    history.pushState({ player: 1 }, ''); pushed = true;
    setTimeout(() => frame.focus(), 300);
  }
  function closePlayer() {
    if (player.hidden) return;
    session.seconds = (performance.now() - openedAt) / 1000;
    player.hidden = true;
    frame.src = 'about:blank';
    document.body.classList.remove('locked');
    Ratings.logPlay(id, session.plays, session.seconds);
    if (!Ratings.mine(id) && session.seconds > 3) openSheet();
  }
  function openSheet() { $('sheet').hidden = false; document.body.classList.add('locked'); }
  function closeSheet() { $('sheet').hidden = true; document.body.classList.remove('locked'); }
  $('hero').onclick = openPlayer;
  $('close').onclick = () => { if (pushed) { pushed = false; history.back(); } else closePlayer(); };
  addEventListener('popstate', () => { pushed = false; closePlayer(); });
  $('later').onclick = closeSheet;
  $('sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') closeSheet(); });
  addEventListener('pagehide', () => { if (!player.hidden) { session.seconds = (performance.now() - openedAt) / 1000; Ratings.logPlay(id, session.plays, session.seconds); } });

  // 一覧から来たときは、そのまま遊び始める
  if (params.get('play') === '1') {
    history.replaceState(null, '', `game.html?id=${encodeURIComponent(id)}`);
    openPlayer();
  }
})();
</script>
</body>
</html>
