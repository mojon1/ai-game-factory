'use strict';const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),D={ja:{title:'逆むきネコの帰り道',a:'青は指の向き、橙は逆へ一歩',b:'壁で片方を止めるのがコツ',c:'同じ色の家へ、2匹いっしょに',start:'タップでスタート',room:'庭',moves:'手',reset:'やり直す',undo:'一手戻す',hint:'スワイプか矢印で移動',tip:'青 → 指の向き ／ 橙 → 逆むき',clear:'2匹、おかえり！',all:'みんな家に帰れた！',next:'タップで次の庭へ',again:'タップでもう一度',mark:'同じ色の家にそろえよう'},en:{title:'Opposite Cats',a:'Blue follows; orange steps the other way',b:'Use a wall to stop just one cat',c:'Bring both to their matching homes',start:'Tap to start',room:'Garden',moves:'moves',reset:'Reset',undo:'Undo',hint:'Swipe or use the arrows',tip:'Blue follows / Orange goes opposite',clear:'Both cats are home!',all:'Everyone is home!',next:'Tap for the next garden',again:'Tap to play again',mark:'Reach both matching homes together'}},T=D[LANG]||D.en,c=document.querySelector('canvas'),g=c.getContext('2d'),L=[{walls:[8,14,20,26],start:[30,35],goal:[5,0]},{walls:[7,8,10,16,19,20,25,28],start:[30,5],goal:[4,31]},{walls:[2,8,10,13,16,19,22,25,27,28],start:[0,35],goal:[34,1]}],dirs=[[0,-1],[1,0],[0,1],[-1,0]],buttons=[[180,505,'↑',0],[242,567,'→',1],[180,567,'↓',2],[118,567,'←',3]];let sc=1,ox=0,oy=0,st='title',stage=0,pos=[30,35],old=pos.slice(),hist=[],moves=0,age=0,last=0,anim=1,ptr=null,ac=null;
const signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});
function resize(){const w=Math.max(1,innerWidth),h=Math.max(1,innerHeight),d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;sc=Math.min(w/360,h/640);ox=(w-360*sc)/2;oy=(h-640*sc)/2;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function audio(){try{ac||=new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch{}}function tone(f){if(!ac)return;try{const o=ac.createOscillator(),v=ac.createGain(),n=ac.currentTime;o.frequency.value=f;o.type='sine';v.gain.setValueAtTime(.06,n);v.gain.exponentialRampToValueAtTime(.001,n+.16);o.connect(v);v.connect(ac.destination);o.start(n);o.stop(n+.18)}catch{}}
function begin(){pos=L[stage].start.slice();old=pos.slice();hist=[];moves=0;anim=1;age=0;st='play';ptr=null;signal('start')}
function step(p,d){let x=p%6+d[0],y=Math.floor(p/6)+d[1],n=y*6+x;return x<0||y<0||x>5||y>5||L[stage].walls.includes(n)?p:n}
function move(i){if(st!=='play')return;const n=[step(pos[0],dirs[i]),step(pos[1],dirs[(i+2)%4])];if(n[0]===pos[0]&&n[1]===pos[1]){tone(130);return}hist.push(pos.slice());old=pos.slice();pos=n;moves++;anim=0;tone(250+i*50);if(pos.every((p,j)=>p===L[stage].goal[j])){st='result';age=0;signal('end');tone(650)}}
function point(e){return{x:(e.clientX-ox)/sc,y:(e.clientY-oy)/sc}}
c.addEventListener('pointerdown',e=>{e.preventDefault();audio();const p=point(e);if(st==='title'){stage=0;begin();return}if(st==='result'){if(age>.7){stage=stage<2?stage+1:0;begin()}return}if(ptr)return;if(p.y>76&&p.y<124){if(p.x<170){begin();return}else if(hist.length){old=pos.slice();pos=hist.pop();moves--;anim=0;tone(190);return}}for(const [x,y,s,i]of buttons)if(Math.abs(p.x-x)<27&&Math.abs(p.y-y)<27){move(i);return}if(p.y>=140&&p.y<=456){ptr={id:e.pointerId,...p};c.setPointerCapture(e.pointerId)}});
c.addEventListener('pointerup',e=>{if(!ptr||e.pointerId!==ptr.id)return;const p=point(e),dx=p.x-ptr.x,dy=p.y-ptr.y;ptr=null;if(Math.max(Math.abs(dx),Math.abs(dy))>22)move(Math.abs(dx)>Math.abs(dy)?dx>0?1:3:dy>0?2:0)});c.addEventListener('pointercancel',e=>{if(ptr?.id===e.pointerId)ptr=null});
function text(s,x,y,size=18,col='#ecf2e6',max=328){g.fillStyle=col;g.textAlign='center';g.textBaseline='middle';g.font=`500 ${size}px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif`;const w=g.measureText(s).width;if(w>max)g.font=`500 ${size*max/w}px system-ui,sans-serif`;g.fillText(s,x,y)}function box(x,y,w,h,col,r=12){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function cat(x,y,i,r=16){g.fillStyle=i?'#f7b777':'#7ed7e3';g.beginPath();g.moveTo(x-r,y);g.lineTo(x-r,y-r*1.25);g.lineTo(x-r*.2,y-r*.6);g.lineTo(x+r*.2,y-r*.6);g.lineTo(x+r,y-r*1.25);g.lineTo(x+r,y);g.ellipse(x,y,r,r*.8,0,0,Math.PI);g.fill();g.fillStyle='#1a3440';g.beginPath();g.arc(x-r*.4,y-r*.12,2,0,7);g.arc(x+r*.4,y-r*.12,2,0,7);g.fill();g.strokeStyle='#1a3440';g.lineWidth=1.5;g.beginPath();g.moveTo(x-3,y+4);g.lineTo(x,y+6);g.lineTo(x+3,y+4);g.stroke()}
function home(p,i){const x=55+p%6*50,y=175+Math.floor(p/6)*50;g.strokeStyle=i?'#f7b777':'#7ed7e3';g.lineWidth=3;g.beginPath();g.moveTo(x-19,y-4);g.lineTo(x,y-20);g.lineTo(x+19,y-4);g.lineTo(x+19,y+19);g.lineTo(x-19,y+19);g.closePath();g.stroke()}
function draw(dt){age+=dt;anim=Math.min(1,anim+dt*8);g.save();g.translate(ox,oy);g.scale(sc,sc);g.fillStyle='#172e37';g.fillRect(0,0,360,640);if(st==='title'){text(T.title,180,139,30);cat(125,222,0,30);cat(235,222,1,30);text('→    ←',180,268,29,'#b3d1c6');text(T.a,180,337,17);text(T.b,180,375,17);text(T.c,180,413,17);text(T.start,180,544,22)}else{text(T.room+' '+(stage+1)+'/3',80,37,23);text(moves+' '+T.moves,282,37,21);box(32,78,136,46,'#2a4b54');box(192,78,136,46,'#2a4b54');text(T.reset,100,101,16);text(T.undo,260,101,16);for(let p=0;p<36;p++){let x=30+p%6*50,y=150+Math.floor(p/6)*50,w=L[stage].walls.includes(p);box(x+2,y+2,46,46,w?'#71867e':'#24444a',7);if(w){g.strokeStyle='#526c65';g.lineWidth=2;g.beginPath();g.moveTo(x+8,y+15);g.lineTo(x+42,y+15);g.moveTo(x+24,y+15);g.lineTo(x+24,y+39);g.stroke()}}L[stage].goal.forEach(home);pos.forEach((p,i)=>{const u=old[i],k=1-(1-anim)**3,x=(u%6+(p%6-u%6)*k)*50+55,y=(Math.floor(u/6)+(Math.floor(p/6)-Math.floor(u/6))*k)*50+175;cat(x+(pos[0]===pos[1]?(i?7:-7):0),y,i)});for(const[x,y,s,i]of buttons){box(x-27,y-27,54,54,'#365b61');text(s,x,y,28)}text(age<5?T.hint:T.tip,180,625,14,'#bed4c8');if(st==='result'){g.fillStyle='#172e37ee';g.fillRect(0,0,360,640);cat(130,200,0,27);cat(230,200,1,27);text(stage<2?T.clear:T.all,180,288,29);text(moves+' '+T.moves,180,369,32,'#f7d69b');text(stage<2?T.next:T.again,180,541,22)}}g.restore()}
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;g.clearRect(0,0,c.width,c.height);draw(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
