<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overscroll-behavior:none;background:#263645;color:#fff3d4;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}main{position:relative;width:100vw;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 50% 25%,#596779,#202f3c)}header{position:absolute;top:3%;left:6%;right:6%;display:flex;justify-content:space-between;font-size:16px;font-weight:700}button{font:inherit;min-height:44px;min-width:44px;border-radius:12px;border:2px solid #b5c7b7;color:#203441;background:#e4e2c9}#deck{position:absolute;top:1%;left:39%;width:22%;font-size:12px;height:44px}#enemyhp{position:absolute;top:14%;width:100%;text-align:center;font-size:18px}#enemyname{position:absolute;top:21%;width:100%;text-align:center;font-size:20px;font-weight:700}#face{position:absolute;left:calc(50% - 38px);top:27%;width:76px;height:65px;border-radius:30% 30% 45% 45%;background:#d3a789;border:5px solid #f5ddba;text-align:center;font-size:32px;line-height:52px;color:#2e3543}#intent{position:absolute;top:37%;width:100%;text-align:center;font-size:14px;line-height:1.4;color:#f5c59c}#status{position:absolute;top:44%;width:100%;text-align:center;font-size:14px;padding:0 4%;height:32px}#energy{position:absolute;top:47%;width:100%;text-align:center;font-size:16px;color:#9ce0ca}#hand{position:absolute;top:54%;left:6%;right:6%;height:30%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px}.card{padding:6px;font-size:15px;font-weight:700}.card.attack{background:#edc4ac}.card.guard{background:#c4dce5}.card.insight{background:#efdfaa}.card.heal{background:#bcdcc1}.card.feint{background:#d9cbe6}.card small{display:block;font-size:13px;font-weight:500;line-height:1.4;margin-top:5px}.card:disabled{opacity:.4}.card.used{background:transparent;border-style:dashed;color:#d2ded2}#bar{position:absolute;top:18%;left:15%;width:70%;height:7px;background:#253a47;border-radius:9px;overflow:hidden}#bar i{display:block;height:100%;background:#e5ac85;transition:width .2s}#turn{position:absolute;top:88%;left:20%;width:60%;height:44px;font-weight:700}#hint{position:absolute;bottom:2%;width:100%;text-align:center;font-size:12px}#cover{position:absolute;inset:0;background:#213441f5;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px}#cover.hidden{display:none}#cover h1{font-size:29px;line-height:1.3;margin:0 0 18px}#cover p{font-size:15px;white-space:pre-line;line-height:1.7}#cover b{display:block;font-size:18px;color:#a3e4c6;margin-top:24px}#cover .choices{display:grid;gap:9px;margin-top:20px}#cover .choices button{width:280px;max-width:85vw;padding:10px;font-size:15px;min-height:58px}#cover .choices small{font-size:12px;display:block}
</style></head><body><main><header><span id="hp"></span><span id="stage"></span></header><button id="deck"></button><div id="enemyhp"></div><div id="bar"><i id="fill"></i></div><div id="enemyname"></div><div id="face">•ᴗ•</div><div id="intent"></div><div id="status"></div><div id="energy"></div><div id="hand"></div><button id="turn"></button><div id="hint"></div><div id="cover"></div></main><script>
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),T=({ja:{title:'五つの門の小さなデッキ',intro:'カードを使い、次の攻撃に備える。\n門を越えるたび、一枚足すか減らす。\n残る体力で、五つの門を抜けよう。',start:'タップでスタート',again:'タップでもう一度',hp:'体力',gate:'門',deck:'デッキ',enemyhp:'番人',attack:'次の攻撃',armor:'敵の盾',energy:'力',block:'守り',turn:'手番を終える',hint:'予告の攻撃より守りが少ない分だけ体力が減る。',choose:'カードを選ぼう',received:'受けた傷',reward:'門を越えた',pick:'一枚を選ぶ。体力は6回復。',remove:'斬撃を一枚減らす',removeDesc:'軽くして、欲しい札を引きやすく。',all:'五つの門を抜けた',lose:'ここでひと休み',close:'タップで閉じる',owned:'所持',used:'使用済み',hurt:'受ける傷',draw:'山札',discard:'捨札',names:['斬撃','守備','ひらめき','大振り','手当','けん制'],desc:['攻撃4','守り5','力+1・一枚引く','攻撃11','体力を5回復','攻撃3・守り4'],enemies:['木の番人','鉄の番人','霧の番人','鐘の番人','朝の番人']},en:{title:'A Small Deck, Five Gates',intro:'Play cards and prepare for the next attack.\nAt each gate, add a card or remove one.\nCarry your health through five gates.',start:'Tap to start',again:'Tap to play again',hp:'Health',gate:'Gate',deck:'Deck',enemyhp:'Keeper',attack:'Next attack',armor:'Enemy shield',energy:'Energy',block:'Block',turn:'End turn',hint:'Any announced attack beyond your block costs health.',choose:'Choose a card',received:'Damage taken',reward:'Beyond the gate',pick:'Choose one. Recover 6 health.',remove:'Remove one Strike',removeDesc:'A smaller deck draws its useful cards sooner.',all:'All five gates passed',lose:'Rest here for now',close:'Tap to close',owned:'Owned',used:'Played',hurt:'Health loss',draw:'Draw',discard:'Discard',names:['Strike','Guard','Insight','Heavy Blow','Mend','Feint'],desc:['Deal 4 damage','Gain 5 block','+1 energy; draw a card','Deal 11 damage','Recover 5 health','Deal 3; gain 4 block'],enemies:['Wood Keeper','Iron Keeper','Mist Keeper','Bell Keeper','Dawn Keeper']}})[LANG==='ja'?'ja':'en'];
const defs=[{cost:1,dmg:4},{cost:1,block:5},{cost:0,energy:1,draw:1},{cost:2,dmg:11},{cost:1,heal:5},{cost:1,dmg:3,block:4}],el=id=>document.getElementById(id),signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};
for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});
let deck=[],pile=[],discard=[],hand=[],hp=34,stage=0,enemy=12,armor=0,energy=2,block=0,turn=0,phase='title',guard=0,message='',started=0,ac;
function sound(f){try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(.04,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.16);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.16)}catch{}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(){if(!pile.length){pile=shuffle(discard);discard=[]}if(pile.length){const i=hand.indexOf(null);if(i<0)hand.push(pile.pop());else hand[i]=pile.pop()}}
function intent(){return [4,6,5][turn%3]+stage}
function render(){el('hp').textContent=T.hp+' '+hp+'/34';el('stage').textContent=T.gate+' '+(stage+1)+'/5';el('deck').textContent=T.deck+' '+deck.length;el('enemyhp').textContent=T.enemyhp+' '+enemy;el('enemyname').textContent=T.enemies[stage];el('fill').style.width=(100*enemy/[12,18,22,26,30][stage])+'%';el('intent').innerHTML=T.attack+' '+intent()+' / '+T.armor+' '+armor+'<br>'+T.hurt+' '+Math.max(0,intent()-block);el('status').textContent=message||T.choose;el('energy').innerHTML=T.energy+' '+energy+' / '+T.block+' '+block+'<small style="display:block;font-size:12px">'+T.draw+' '+pile.length+' / '+T.discard+' '+discard.length+'</small>';el('hand').innerHTML=hand.map((c,i)=>c===null?'<button class="card used" disabled>'+T.used+'</button>':'<button class="card '+['attack','guard','insight','attack','heal','feint'][c]+'" data-hand="'+i+'" '+(defs[c].cost>energy?'disabled':'')+'>'+T.names[c]+' · '+defs[c].cost+'<small>'+T.desc[c]+' / '+T.owned+' '+deck.filter(v=>v===c).length+'</small></button>').join('');el('turn').textContent=T.turn}
function cover(title,body,last){el('cover').className='';el('cover').innerHTML='<div><h1>'+title+'</h1><p>'+body+'</p><b>'+last+'</b></div>'}
function startRun(){deck=[0,0,0,0,0,1,1,1,1,2];hp=34;stage=0;battle()}
function battle(){pile=shuffle(deck);discard=[];hand=[];enemy=[12,18,22,26,30][stage];armor=0;energy=2;block=0;turn=0;message='';phase='battle';started=performance.now();for(let i=0;i<4;i++)draw();el('cover').className='hidden';el('hint').textContent=T.hint;render();signal('start')}
function win(){signal('end');guard=performance.now()+700;if(stage===4){phase='end';cover(T.all,T.hp+' '+hp+'/34',T.again);return}phase='reward';cover(T.reward,T.pick,'');el('cover').querySelector('div').insertAdjacentHTML('beforeend','<div class="choices">'+[3,4,5].map(c=>'<button data-reward="'+c+'">'+T.names[c]+' · '+defs[c].cost+'<small>'+T.desc[c]+' / '+T.owned+' '+deck.filter(v=>v===c).length+'</small></button>').join('')+'<button data-reward="-1" '+(deck.includes(0)?'':'disabled')+'>'+T.remove+' ('+deck.filter(v=>v===0).length+')'+'<small>'+T.removeDesc+'</small></button></div>')}
function play(i){if(phase!=='battle'||i<0||i>=hand.length||hand[i]===null)return;const c=hand[i],d=defs[c];if(d.cost>energy)return;hand[i]=null;discard.push(c);energy-=d.cost;energy+=d.energy||0;block+=d.block||0;hp=Math.min(34,hp+(d.heal||0));enemy=Math.max(0,enemy-Math.max(0,(d.dmg||0)-armor));if(d.dmg)el('face').animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:220});if(d.dmg)armor=Math.max(0,armor-d.dmg);if(d.draw)draw();message=T.names[c]+': '+T.desc[c];sound(d.dmg?440:300);render();if(!enemy)win()}
el('hand').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(b&&!b.disabled)play(+b.dataset.hand)});
el('turn').addEventListener('pointerdown',()=>{if(phase!=='battle')return;const damage=Math.max(0,intent()-block);hp-=damage;message=T.received+' '+damage;sound(damage?160:320);if(hp<=0){hp=0;render();phase='end';guard=performance.now()+700;signal('end');cover(T.lose,T.gate+' '+(stage+1)+'/5',T.again);return}discard.push(...hand.filter(c=>c!==null));hand=[];energy=2;block=0;turn++;armor=stage%2&&turn%2===0?3:0;for(let i=0;i<4;i++)draw();render()});
el('deck').addEventListener('pointerdown',()=>{if(phase!=='battle')return;phase='deck';const counts=defs.map((_,c)=>T.names[c]+' × '+deck.filter(v=>v===c).length).join('\n');cover(T.deck+' '+deck.length,counts+'\n'+T.draw+' '+pile.length+' / '+T.discard+' '+discard.length,T.close)});
el('cover').addEventListener('pointerdown',e=>{if(phase==='title'){sound(330);startRun()}else if(phase==='deck'){phase='battle';el('cover').className='hidden'}else if(phase==='end'&&performance.now()>=guard){sound(330);startRun()}else if(phase==='reward'&&performance.now()>=guard){const b=e.target.closest('[data-reward]');if(!b)return;const c=+b.dataset.reward;if(c<0){const i=deck.indexOf(0);if(i<0)return;deck.splice(i,1)}else deck.push(c);hp=Math.min(34,hp+6);stage++;sound(600);battle()}});
function tick(t){if(t-started>5500)el('hint').textContent='';requestAnimationFrame(tick)}requestAnimationFrame(tick);cover(T.title,T.intro,T.start);
</script></body></html>
