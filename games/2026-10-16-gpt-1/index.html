<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;overflow:hidden;overscroll-behavior:none;background:#172b3d;width:100%;height:100%}canvas{width:100vw;height:100dvh;display:block}</style></head><body><canvas id="c"></canvas><script>
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),T=LANG==='ja'?{title:'ふたりの星囲い',a:'二人で交互に、点の間をタップ',b:'囲うと星を獲得して、もう一手',c:'雲の部屋は−2点！',start:'タップでスタート',turn:'の番',player:'人目',remain:'残り',rooms:'部屋',hint:'点と点の間をタップ',again:'タップでもう一度',win:'の勝ち！',draw:'引き分け！',more:'囲んだ！ もう一手',cloud:'雲でも、もう一手',pass:'交代',rule:'星 +1/+2　雲 −2',result:'最終得点'}:{title:'Stars for Two',a:'Take turns tapping between dots',b:'Close a room to score and play again',c:'Cloud rooms cost two points!',start:'Tap to start',turn:' to play',player:'Player ',remain:'Left',rooms:'rooms',hint:'Tap between two dots',again:'Tap to play again',win:' wins!',draw:'A tie!',more:'Room claimed! Play again',cloud:'Cloud claimed. Play again',pass:'Next player',rule:'Stars +1/+2   Clouds −2',result:'Final scores'};for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});const c=document.getElementById('c'),g=c.getContext('2d'),colors=['#87d2cf','#efb778'];let w,h,s,ox,oy,state='title',turn=0,scores=[0,0],edges=[],rooms=[],values=[],age=0,delay=0,msg='',audio;const signal=(agf,data={})=>parent.postMessage({agf,...data},'*');const pname=i=>LANG==='ja'?(i+1)+T.player:T.player+(i+1);function resize(){w=innerWidth||360;h=innerHeight||640;const d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;s=Math.min(w/360,h/640);ox=(w-360*s)/2;oy=(h-640*s)/2;g.setTransform(d*s,0,0,d*s,ox*d,oy*d)}resize();addEventListener('resize',resize);function tone(f){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),v=audio.createGain();o.connect(v);v.connect(audio.destination);o.frequency.value=f;v.gain.setValueAtTime(.035,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.17);o.start();o.stop(audio.currentTime+.18)}catch{}}
function start(){scores=[0,0];turn=0;edges=[];rooms=[];for(let r=0;r<4;r++)for(let j=0;j<3;j++)edges.push({x:100+j*80,y:220+r*80,h:true,owner:-1});for(let r=0;r<3;r++)for(let j=0;j<4;j++)edges.push({x:60+j*80,y:260+r*80,h:false,owner:-1});values=[2,1,1,2,1,1,1,-2,-2];for(let i=8;i>0;i--){const j=Math.floor(Math.random()*(i+1));[values[i],values[j]]=[values[j],values[i]]}for(let r=0;r<3;r++)for(let j=0;j<3;j++)rooms.push({edges:[r*3+j,(r+1)*3+j,12+r*4+j,12+r*4+j+1],owner:-1});state='play';msg='';age=0;signal('start')}
c.addEventListener('pointerdown',e=>{tone(220);const x=(e.clientX-ox)/s,y=(e.clientY-oy)/s;if(state==='title'){start();return}if(state==='end'){if(delay>.7)start();return}let k=-1,d=27;edges.forEach((p,i)=>{const v=Math.hypot(x-p.x,y-p.y);if(p.owner<0&&v<d){d=v;k=i}});if(k<0)return;edges[k].owner=turn;let found=0,total=0;rooms.forEach((r,i)=>{if(r.owner<0&&r.edges.every(n=>edges[n].owner>=0)){r.owner=turn;scores[turn]+=values[i];found++;total+=values[i]}});if(!found){turn=1-turn;msg=T.pass;tone(turn?360:520)}else{msg=total<0?T.cloud:T.more;tone(total<0?150:800)}if(rooms.every(r=>r.owner>=0)){state='end';delay=0;signal('end',{score:Math.max(...scores),scores});tone(900)}});
function text(t,x,y,n=20,col='#f3e8d0',max=330){g.fillStyle=col;g.font='600 '+n+'px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif';g.textAlign='center';g.fillText(t,x,y,max)}function box(x,y,ww,hh,col){g.fillStyle=col;g.beginPath();g.roundRect(x,y,ww,hh,10);g.fill()}function draw(){g.fillStyle='#172b3d';g.fillRect(-ox/s,-oy/s,w/s,h/s);if(state==='title'){text(T.title,180,118,32);text('★  □  ★',180,300,65);text(T.a,180,474,18);text(T.b,180,509,18);text(T.c,180,544,18);text(T.start,180,605,21);return}text(pname(0)+'  '+scores[0],87,39,21,colors[0]);text(pname(1)+'  '+scores[1],274,39,21,colors[1]);text(pname(turn)+T.turn,180,101,27,colors[turn]);text(T.remain+' '+rooms.filter(r=>r.owner<0).length+' '+T.rooms,180,151,18);rooms.forEach((r,i)=>{let x=60+i%3*80,y=220+Math.floor(i/3)*80;if(r.owner>=0)box(x+6,y+6,68,68,r.owner===0?'#315a61':'#70563c');text(values[i]<0?'☁':values[i]===2?'★★':'★',x+40,y+45,values[i]===2?19:27,values[i]<0?'#c3b4ce':'#f2d09b');text(String(values[i]),x+40,y+65,14,r.owner<0?'#afbdc8':colors[r.owner])});edges.forEach(p=>{g.strokeStyle=p.owner<0?'#466173':colors[p.owner];g.lineWidth=p.owner<0?4:7;g.lineCap='round';g.beginPath();g.moveTo(p.x-(p.h?31:0),p.y-(p.h?0:31));g.lineTo(p.x+(p.h?31:0),p.y+(p.h?0:31));g.stroke()});for(let r=0;r<4;r++)for(let j=0;j<4;j++){g.fillStyle='#f4e8d2';g.beginPath();g.arc(60+j*80,220+r*80,7,0,Math.PI*2);g.fill()}text(msg,180,520,20);text(T.rule,180,570,17);if(age<4)text(T.hint,180,617,16);if(state==='end'){g.fillStyle='#172b3d';g.fillRect(5,70,350,120);text(scores[0]===scores[1]?T.draw:pname(scores[0]>scores[1]?0:1)+T.win,180,110,30);text(T.result+' '+scores[0]+' : '+scores[1],180,153,22);g.fillRect(5,490,350,145);text(T.again,180,560,22)}}let last;function loop(t){const dt=Math.min(.05,last?(t-last)/1000:0);last=t;age+=dt;delay+=dt;draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
