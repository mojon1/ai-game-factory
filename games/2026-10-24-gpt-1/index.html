function resize(){const w=Math.max(1,innerWidth),h=Math.max(1,innerHeight),d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;sc=Math.min(w/360,h/640);ox=(w-360*sc)/2;oy=(h-640*sc)/2;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function audio(){try{ac||=new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch{}}
function ping(i){const a=glasses[i];a.flash=1;count++;seen.add(a.n);rings.push({x:48+i*66,y:430-a.n/7*174,r:3,t:0,col:colors[i]});if(!ac)return;try{const now=ac.currentTime,f=hz[a.n],pan=ac.createStereoPanner();pan.pan.value=(i-2)*.3;pan.connect(ac.destination);for(const [ratio,amp,decay]of [[1,.075,1.2],[2.76,.019,.45],[5.4,.008,.18]]){const o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f*ratio;o.type='sine';v.gain.setValueAtTime(amp,now);v.gain.exponentialRampToValueAtTime(.0001,now+decay);o.connect(v);v.connect(pan);o.start(now);o.stop(now+decay+.02)}setTimeout(()=>pan.disconnect(),1400)}catch{}}
function begin(){state='play';age=0;rain=false;count=0;seen=new Set();rings=[];ptr=null;glasses=[0,2,3,4,6].map((n,i)=>({n,flash:0,next:.4+i*.17}));signal('start')}

function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/sc,y:(e.clientY-r.top-oy)/sc}}
c.addEventListener('pointerdown',e=>{e.preventDefault();audio();const p=point(e);if(state==='title'||state==='result'&&age>.7){begin();return}if(state!=='play'||ptr)return;if(p.y>465&&p.y<525){rain=!rain;return}if(p.y>548&&p.y<608){finish();return}const i=Math.floor((p.x-22)/66);if(i>=0&&i<5&&p.x<22+i*66+52&&p.y>210&&p.y<445){ptr={id:e.pointerId,i,start:p.y,n:glasses[i].n,moved:false};c.setPointerCapture(e.pointerId)}});
c.addEventListener('pointermove',e=>{if(!ptr||e.pointerId!==ptr.id)return;const p=point(e),delta=p.y-ptr.start;if(Math.abs(delta)>9)ptr.moved=true;if(ptr.moved){const a=glasses[ptr.i],n=Math.max(0,Math.min(7,Math.round(ptr.n+delta/24)));if(n!==a.n){a.n=n;ping(ptr.i)}}});
c.addEventListener('pointerup',e=>{if(ptr&&e.pointerId===ptr.id){if(!ptr.moved)ping(ptr.i);ptr=null}});c.addEventListener('pointercancel',e=>{if(ptr?.id===e.pointerId)ptr=null});
function text(s,x,y,size=18,col='#e5f4f1',max=326){g.fillStyle=col;g.textAlign='center';g.textBaseline='middle';g.font=`500 ${size}px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif`;const w=g.measureText(s).width;if(w>max)g.font=`500 ${size*max/w}px system-ui,sans-serif`;g.fillText(s,x,y)}

function render(dt){clock+=dt;age+=dt;g.save();g.translate(ox,oy);g.scale(sc,sc);g.fillStyle='#112a39';g.fillRect(0,0,360,640);for(let i=0;i<24;i++){g.fillStyle='#d9ffed12';g.beginPath();g.arc((i*79)%360,((i*103+clock*7)%680)-20,2+(i%3),0,Math.PI*2);g.fill()}
 if(state==='title'){text(T.title,180,152,36);text(T.a,180,252,18);text(T.b,180,288,18);text(T.c,180,324,18);for(let i=0;i<5;i++){box(42+i*58,384,44,65,colors[i]);text('♪',64+i*58,414,25,'#112a39')}text(T.start,180,535,22);}
 else{glasses.forEach((a,i)=>{a.flash=Math.max(0,a.flash-dt*2);if(state==='play'&&rain){a.next-=dt;if(a.next<0){ping(i);a.next+=.65+i*.17+a.n*.025}}const x=22+i*66,water=174-a.n/7*150;g.strokeStyle=a.flash>0?colors[i]:'#b5d6dd';g.lineWidth=2+a.flash*3;g.beginPath();g.roundRect(x,220,52,220,11);g.stroke();g.save();g.beginPath();g.roundRect(x+3,223,46,214,8);g.clip();g.fillStyle=colors[i];g.globalAlpha=.72;g.beginPath();g.moveTo(x,440);for(let j=0;j<=52;j+=2)g.lineTo(x+j,438-water+Math.sin(j/8+clock*5)*a.flash*6);g.lineTo(x+52,440);g.fill();g.restore();text(T.note[a.n],x+26,184,21,colors[i],55);text(String(i+1),x+26,405,16,'#17384c');if(rain&&state==='play'){g.fillStyle=colors[i];g.beginPath();g.arc(x+26,210+(1-Math.min(1,a.next/(.65+i*.17+a.n*.025)))*(225-water),3,0,7);g.fill()}});for(const r of rings){r.t+=dt;g.globalAlpha=Math.max(0,1-r.t);g.strokeStyle=r.col;g.lineWidth=2;g.beginPath();g.arc(r.x,r.y,5+r.t*38,0,7);g.stroke()}g.globalAlpha=1;rings=rings.filter(r=>r.t<1);
 if(state==='play'){text(T.title,180,40,25);text(T.tune,180,82,15);text(T.high+' ↑',180,125,14,'#b5d6dd');box(30,472,300,52,rain?'#568a81':'#254c5b');text(rain?T.stop:T.rain,180,498,19);box(60,553,240,49,'#25404e');text(T.finish,180,578,17);if(age<5)text(T.hint,180,624,14,'#f7d77b');else text(T.drop,180,624,13,'#aacbd0')}
 else{g.fillStyle='#112a39e8';g.fillRect(0,0,360,640);text(T.done,180,176,30);text(String(count),180,275,62,'#f7d77b');text(T.rings,180,330,18);text(seen.size+' '+T.notes,180,386,20);text(T.again,180,532,22)}}g.restore();}
