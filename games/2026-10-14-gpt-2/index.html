<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#142536}canvas{width:100vw;height:100dvh;display:block}</style></head><body><canvas id="c"></canvas><script>
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),T=LANG==='ja'?{title:'ほどける星の糸',a:'星を動かして、糸の交差をなくそう',b:'桃色の糸が交差しているよ',c:'星どうしは少し離して置こう',start:'タップでスタート',moves:'手',level:'星座',knots:'結び目',apart:'星を少し離そう',hint:'星をつかんで、糸の外へ動かそう',clear:'糸がほどけた！',finish:'三つの星座が完成！',next:'タップで次へ',again:'タップでもう一度'}:{title:'Star Threads',a:'Move stars to remove every crossing',b:'Pink threads are crossing',c:'Keep the stars spaced apart',start:'Tap to start',moves:'moves',level:'pattern',knots:'knots',apart:'Space the stars farther apart',hint:'Drag a star outside the threads',clear:'Threads untangled!',finish:'Three constellations complete!',next:'Tap to continue',again:'Tap to play again'};for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});const c=document.getElementById('c'),g=c.getContext('2d');let w,h,s,ox,oy,state='title',level=1,moves=0,stars=[],edges=[],knots=[],bad=new Set(),drag=null,before=0,moved=0,age=0,delay=0,audio;const signal=(agf,data={})=>parent.postMessage({agf,...data},'*');function resize(){w=innerWidth||360;h=innerHeight||640;let d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;s=Math.min(w/360,h/640);ox=(w-360*s)/2;oy=(h-640*s)/2;g.setTransform(d*s,0,0,d*s,ox*d,oy*d)}resize();addEventListener('resize',resize);function tone(f){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),v=audio.createGain();o.connect(v);v.connect(audio.destination);o.frequency.value=f;v.gain.setValueAtTime(.035,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.start();o.stop(audio.currentTime+.21)}catch{}}
function cross(a,b,c,d){const rx=b.x-a.x,ry=b.y-a.y,sx=d.x-c.x,sy=d.y-c.y,det=rx*sy-ry*sx;if(Math.abs(det)<.0001){const area=(c.x-a.x)*ry-(c.y-a.y)*rx;if(Math.abs(area)>.1)return null;const dot=rx*rx+ry*ry,t=((c.x-a.x)*rx+(c.y-a.y)*ry)/dot,u=((d.x-a.x)*rx+(d.y-a.y)*ry)/dot;if(Math.max(Math.min(t,u),0)<=Math.min(Math.max(t,u),1))return{x:(a.x+b.x+c.x+d.x)/4,y:(a.y+b.y+c.y+d.y)/4};return null}const t=((c.x-a.x)*sy-(c.y-a.y)*sx)/det,u=((c.x-a.x)*ry-(c.y-a.y)*rx)/det;return t>=0&&t<=1&&u>=0&&u<=1?{x:a.x+t*rx,y:a.y+t*ry}:null}function count(){knots=[];bad=new Set();for(let i=0;i<edges.length;i++)for(let j=i+1;j<edges.length;j++){const a=edges[i],b=edges[j];if(a.some(n=>b.includes(n)))continue;const p=cross(stars[a[0]],stars[a[1]],stars[b[0]],stars[b[1]]);if(p){knots.push(p);bad.add(i);bad.add(j)}}}function close(){for(let i=0;i<stars.length;i++)for(let j=i+1;j<stars.length;j++)if(Math.hypot(stars[i].x-stars[j].x,stars[i].y-stars[j].y)<49)return true;return false}
function setup(){const n=5+level;edges=[];for(let i=0;i<n;i++)edges.push([i,(i+1)%n]);for(let i=2;i<n-1;i++)edges.push([0,i]);do{const order=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}stars=order.map(k=>({x:180+125*Math.cos(k*2*Math.PI/n-Math.PI/2),y:350+155*Math.sin(k*2*Math.PI/n-Math.PI/2)}));count()}while(knots.length<2);age=0;state='play';drag=null;signal('start')}
c.addEventListener('pointerdown',e=>{tone(250);const x=(e.clientX-ox)/s,y=(e.clientY-oy)/s;if(state==='title'){level=1;moves=0;setup();return}if(state==='between'||state==='end'){if(delay>.7){if(state==='end'){level=1;moves=0}else level++;setup()}return}if(drag)return;let k=-1,dist=30;stars.forEach((p,i)=>{const d=Math.hypot(p.x-x,p.y-y);if(d<dist){dist=d;k=i}});if(k>=0){drag={id:e.pointerId,k};before=knots.length;moved=0;c.setPointerCapture(e.pointerId)}});c.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const p=stars[drag.k],x=Math.max(35,Math.min(325,(e.clientX-ox)/s)),y=Math.max(185,Math.min(525,(e.clientY-oy)/s));moved+=Math.hypot(p.x-x,p.y-y);p.x=x;p.y=y;count()});function release(e){if(!drag||drag.id!==e.pointerId)return;drag=null;if(moved>3)moves++;count();tone(knots.length<before?680:knots.length>before?180:340);if(knots.length===0&&!close()){state=level===3?'end':'between';delay=0;signal('end',{score:moves});tone(940)}}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',e=>{if(drag?.id===e.pointerId)drag=null});
function text(t,x,y,n=20,col='#f1e7cb'){g.fillStyle=col;g.font='600 '+n+'px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif';g.textAlign='center';g.fillText(t,x,y,330)}function draw(){g.fillStyle='#142536';g.fillRect(-ox/s,-oy/s,w/s,h/s);if(state==='title'){text(T.title,180,122,31);g.strokeStyle='#f0a3b4';g.lineWidth=3;g.beginPath();g.moveTo(65,260);g.lineTo(290,410);g.lineTo(85,410);g.lineTo(270,260);g.stroke();for(const p of [[65,260],[290,410],[85,410],[270,260]]){g.fillStyle='#f6ce82';g.beginPath();g.arc(...p,18,0,Math.PI*2);g.fill()}text(T.a,180,500,17);text(T.b,180,533,17);text(T.c,180,565,17);text(T.start,180,610,21);return}text(moves+' '+T.moves,70,38,19);text(level+'/3 '+T.level,278,38,19);text(T.knots+' '+knots.length,180,100,27,knots.length?'#f0a3b4':'#8cddd0');if(close())text(T.apart,180,143,17);edges.forEach((e,i)=>{const a=stars[e[0]],b=stars[e[1]];g.strokeStyle=bad.has(i)?'#c87594':'#77b6ba';g.lineWidth=bad.has(i)?3:2;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()});for(const p of knots){g.fillStyle='#ffc6d0';g.beginPath();g.arc(p.x,p.y,4,0,Math.PI*2);g.fill()}stars.forEach((p,i)=>{g.fillStyle=drag?.k===i?'#fff3b8':i===0?'#f0bd79':'#b7d9d5';g.beginPath();g.arc(p.x,p.y,i===0?24:22,0,Math.PI*2);g.fill();text(String(i+1),p.x,p.y+7,20,'#243544')});if(age<5)text(T.hint,180,611,16);if(state==='between'||state==='end'){g.fillStyle='#142536';g.fillRect(10,540,340,95);text(state==='end'?T.finish:T.clear,180,566,24);text(state==='end'?T.again:T.next,180,609,20)}}let last;function loop(t){const dt=Math.min(.05,last?(t-last)/1000:0);last=t;age+=dt;delay+=dt;draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
