<style>

<script>

// ---------- audio ----------

}
const SFX = {

  ready() { tone(880, 1320, 0.09, { type: 'triangle', gain: 0.05 }); },
  throwIt() { noise(0.2, { type: 'bandpass', f: 500, f2: 2400, q: 1.4, gain: 0.18 }); },
  hitKid(pan) { noise(0.18, { f: 700, f2: 200, gain: 0.55, pan }); tone(620, 1150, 0.13, { type: 'triangle', gain: 0.07, pan, delay: 0.03 }); tone(1150, 800, 0.12, { type: 'triangle', gain: 0.05, pan, delay: 0.15 }); },
  thud(pan, g = 0.35) { noise(0.14, { f: 420, f2: 120, gain: g, pan }); },

  clear() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, f, 0.35, { type: 'triangle', gain: 0.07, delay: i * 0.09 })); },

// ---------- three ----------
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const FOG = new THREE.Color(0xe9c8d6);
scene.fog = new THREE.Fog(FOG, 16, 46);
const camera = new THREE.PerspectiveCamera(52, 360 / 640, 0.05, 120);
scene.add(new THREE.HemisphereLight(0xc8dcff, 0xf3eef8, 1.7));
const sun = new THREE.DirectionalLight(0xffd2b0, 1.5); sun.position.set(-6, 7, 6); scene.add(sun);

// sky dome
{
  const g = new THREE.SphereGeometry(80, 24, 12);
  const c = []; const top = new THREE.Color(0x4d63ad), mid = new THREE.Color(0xb59ac8), hor = new THREE.Color(0xf6c9b8);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const y = p.getY(i) / 80; const col = y > 0.25 ? mid.clone().lerp(top, Math.min(1, (y - 0.25) / 0.6)) : hor.clone().lerp(mid, Math.max(0, y + 0.05) / 0.3); c.push(col.r, col.g, col.b); }

  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false })));
  const moon = new THREE.Mesh(new THREE.CircleGeometry(2.2, 32), new THREE.MeshBasicMaterial({ color: 0xfff6dc, fog: false }));
  moon.position.set(18, 30, -60); moon.lookAt(0, 0, 0); scene.add(moon);
}

function snowTex(rep) {

{
  const g = new THREE.PlaneGeometry(90, 90, 60, 60); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i); p.setY(i, Math.sin(x * 0.7) * Math.cos(z * 0.5) * 0.06 + Math.sin(x * 0.21 + z * 0.33) * 0.12 * Math.min(1, Math.abs(z) / 25)); }

}

scene.add(ground);
// trees & mounds
{
  const tg = new THREE.ConeGeometry(1, 2.6, 7), tm = new THREE.MeshLambertMaterial({ color: 0x2f5a5a }), cap = new THREE.ConeGeometry(0.55, 1.1, 7), cm = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const trunk = new THREE.CylinderGeometry(0.14, 0.18, 0.6, 6), trm = new THREE.MeshLambertMaterial({ color: 0x6b4a3a });
  let r = 7;
  const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 34; i++) {
    const side = i % 2 ? 1 : -1;
    const z = -21 - rnd() * 18, x = (rnd() * 26 - 13) + (i < 12 ? side * (8 + rnd() * 4) : 0);
    const s = 0.8 + rnd() * 1.1;
    const t = new THREE.Group();
    const a = new THREE.Mesh(tg, tm); a.position.y = 1.6; t.add(a);
    const b = new THREE.Mesh(cap, cm); b.position.y = 2.6; t.add(b);

}
const RBox = THREE_ADDONS.RoundedBoxGeometry;
const wallMat = new THREE.MeshLambertMaterial({ color: 0xeef3ff, map: snowTex(1) });
wallMat.map.repeat.set(3, 1.2);
function makeWall(w, h, d) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new RBox(w, h, d, 3, Math.min(0.14, h * 0.2)), wallMat); b.position.y = h / 2; g.add(b);

const white = new THREE.MeshLambertMaterial({ color: 0xffffff });
const G = {
  body: new THREE.CylinderGeometry(0.25, 0.33, 0.66, 12), head: new THREE.SphereGeometry(0.21, 16, 12),

  mitt: new THREE.SphereGeometry(0.075, 8, 6),

const TYPES = {
  normal: { coat: 0xe2524f, hat: 0xffc34a, scarf: 0x3f8f7a, hp: 1, scale: 1.3, react: 0.06, windup: 0.85, err: 0.62, pts: 100 },
  quick: { coat: 0x3f74d6, hat: 0xff6f91, scarf: 0xffd75a, hp: 1, scale: 1.2, react: 0.4, windup: 0.55, err: 0.55, pts: 150 },

function kidsForWave(w) {
  const list = [];

  if (w >= 2) list[0] = 'quick';
  if (w >= 4) list[1] = 'quick';

}
function diff() { const w = st.wave; return { hide: 1 / (1 + 0.13 * (w - 1)), fly: Math.max(0.85, 1.32 - 0.05 * (w - 1)), maxThrow: Math.min(3, 1 + Math.floor(w / 2)), err: Math.max(0.55, 1 - 0.07 * (w - 1)), wind: w >= 3 }; }

function startWave() {

  kids = [];
  const list = kidsForWave(st.wave);
  const slots = SLOTS.map((s, i) => i).sort(() => Math.random() - 0.5).slice(0, list.length).sort((a, b) => a - b);
  list.forEach((type, i) => {

// ---------- balls ----------
function spawnBall(p0, v, mine, owner) {
  const m = new THREE.Mesh(G.ball, ballMat); m.position.copy(p0); scene.add(m);
  const s = new THREE.Mesh(shadowGeo, shadowMat); scene.add(s);
  const b = { p: p0.clone(), v, mine, owner, m, s, alive: true, t: 0, safeChecked: false, dodgeChecked: new Set(), target: null };
  balls.push(b); return b;
}
function solveVel(p0, target, T) {
  const v = target.clone().sub(p0).divideScalar(T);
  v.y += 0.5 * GRAV * T; return v;
}
function kidY(k) { const e = 1 - Math.pow(1 - k.up, 3); return 0.32 * e - 0.9 * k.T.scale * (1 - e) + (k.state === 'out' ? -k.outT * 0.9 : 0); }
function killBall(b) { b.alive = false; scene.remove(b.m); scene.remove(b.s); }

function enemyThrow(k) {
  const d = diff();
  const s = k.T.scale;
  const p0 = new THREE.Vector3(k.x + 0.3 * s, kidY(k) + 1.25 * s, k.z + 0.15);
  const err = k.T.err * d.err;
  const tgt = new THREE.Vector3(gauss() * err * 2.0, STAND - 0.05 + gauss() * err * 1.25, 0.1);
  const T = d.fly * (k.type === 'quick' ? 0.85 : 1) * rand(0.95, 1.08);
  const v = solveVel(p0, tgt, T);
  v.x -= st.wind * 0.5 * T * 0.6; // kids half-correct for wind
  spawnBall(p0, v, false, k);
  SFX.throwIt();
}

function playerThrow(target) {
  if (st.ammo <= 0) { hint(D.noAmmo, 1.6); return; }
  st.ammo--;
  const p0 = new THREE.Vector3(0.18, st.camY - 0.12, -1.5);
  const dist = target.distanceTo(p0);
  const T = 0.3 + dist * 0.042;
  const v = solveVel(p0, target, T);
  const b = spawnBall(p0, v, true, null);
  b.T = T;
  SFX.throwIt();
  updateHud();
}

const tmpV = new THREE.Vector3(), headC = new THREE.Vector3(), bodyC = new THREE.Vector3();
function updateBalls(dt) {
  for (const b of balls) {
    if (!b.alive) continue;
    b.t += dt;
    const prevZ = b.p.z;
    b.v.y -= GRAV * dt; b.v.x += st.wind * dt * 0.6;
    b.p.addScaledVector(b.v, dt);
    b.m.position.copy(b.p);
    b.s.position.set(b.p.x, 0.02, b.p.z); const sh = Math.max(0.25, 1 - b.p.y / 5); b.s.scale.setScalar(sh);
    if (b.mine) {
      // enemies may duck when they see it coming
      for (const k of kids) {
        if (k.state === 'out' || b.dodgeChecked.has(k)) continue;
        const dz = k.z - b.p.z; if (dz > 0) continue;
        const remain = (b.p.z - k.z) / Math.max(0.1, -b.v.z);
        if (remain < 0.45 && Math.abs(b.p.x - k.x) < 1.2) {
          b.dodgeChecked.add(k);
          if ((k.state === 'up' || k.state === 'rising') && Math.random() < k.T.react + st.wave * 0.025) { k.state = 'lowering'; }
        }
      }
      let hitK = null;
      for (const k of kids) {
        if (k.state === 'out' || k.state === 'gone') continue;
        const s = k.T.scale, y = kidY(k);
        headC.set(k.x, y + 1.02 * s, k.z); bodyC.set(k.x, y + 0.55 * s, k.z);
        if (b.p.distanceTo(headC) < 0.21 * s + 0.11 + 0.07 || (b.p.distanceTo(bodyC) < 0.33 * s + 0.11 + 0.03 && b.p.y > 0.05)) { hitK = k; break; }
      }
      if (hitK) { hitKid(hitK, b); killBall(b); continue; }
      let blocked = false;
      for (let i = 0; i < SLOTS.length; i++) {
        const wx = enemyWalls[i].position.x, wz = enemyWalls[i].position.z;
        if (Math.abs(b.p.x - wx) < EW.w / 2 + 0.05 && Math.abs(b.p.z - wz) < EW.d / 2 + 0.08 && b.p.y < EW.h + 0.06) { blocked = true; break; }
      }
      if (blocked || b.p.y < 0.06 || b.p.z < -40) {

        SFX.thud(b.p.x / 4, 0.25);
        if (blocked) { const [sx, sy] = worldToScreen(b.p); popText(D.wall, sx, sy - 10, '#e8f2ff', 15, 0.6); }
        let near = false;
        for (const k of kids) if (k.state !== 'out' && k.state !== 'gone' && Math.hypot(b.p.x - k.x, b.p.z - k.z) < 1.1 && !blocked) near = true;
        if (near || (blocked && b.t > 0.3)) { const [sx, sy] = worldToScreen(b.p); if (near) popText(LANG === 'ja' ? 'おしい！' : 'Close!', sx, Math.min(sy, H * 0.7) - 16, '#e8f2ff', 17, 0.7); }
        if (st.combo > 0) { st.combo = 0; updateHud(); }
        killBall(b); continue;
      }
    } else {
      // incoming
      if (b.p.z > PW.z1 && b.p.z < PW.z2 + 0.05 && Math.abs(b.p.x) < PW.x && b.p.y < PW.top + 0.05) {
        puff(b.p, 26, 2, 1.2); SFX.thud(b.p.x / 2, 0.55); st.shake = Math.max(st.shake, 0.12);
        killBall(b); continue;

      if (!b.safeChecked && prevZ < -0.1 && b.p.z >= -0.1) {

function hitKid(k, b) {

  popText(counter ? D.counter : D.out, sx, sy - 18, counter ? '#ff8fa3' : '#fff', counter ? 26 : 24, 1.0);

// ---------- kids AI ----------
function updateKids(dt) {
  const d = diff();
  let throwers = 0; anyWindup = false;
  for (const k of kids) if (k.state === 'windup' || (k.state === 'rising' && k.plan === 'throw')) throwers++;
  let alive = 0;
  for (const k of kids) {
    if (k.state !== 'out') alive++;
    k.t -= dt;
    switch (k.state) {
      case 'hidden':
        if (k.t <= 0 && st.mode === 'play') {
          k.plan = throwers < d.maxThrow && Math.random() < 0.72 ? 'throw' : 'peek';
          if (k.plan === 'throw') throwers++;
          k.state = 'rising'; SFX.pop(k.x / 3);
        }
        break;
      case 'rising':
        k.up = Math.min(1, k.up + dt / 0.22);
        if (k.up >= 1) {
          if (k.plan === 'throw') { k.state = 'windup'; k.t = k.T.windup * Math.max(0.6, 1 - 0.04 * (st.wave - 1)); k.held.visible = true; SFX.warn(k.x / 3); }
          else { k.state = 'up'; k.t = rand(0.6, 1.2); }
        }
        break;
      case 'windup': {
        anyWindup = true;
        const p = 1 - k.t / k.T.windup;
        k.arm.rotation.x = Math.min(2.6, p * 3.4);
        if (k.t <= 0) { k.held.visible = false; k.arm.rotation.x = -1.1; enemyThrow(k); k.state = 'up'; k.t = rand(1.3, 2.0) * (k.type === 'quick' ? 0.7 : 1); }
        break;

        // a peeking kid who spots you may decide to throw

        if (k.t <= 0) k.state = 'lowering';
        break;
      case 'lowering':
        k.up = Math.max(0, k.up - dt / 0.18); k.held.visible = false;
        k.arm.rotation.x += (0 - k.arm.rotation.x) * Math.min(1, dt * 8);
        if (k.up <= 0) { k.state = 'hidden'; k.t = rand(1.3, 3.3) * d.hide; k.plan = null; }
        break;
      case 'out':
        k.outT += dt;
        k.inner.rotation.x = -Math.min(1.3, k.outT * 3.2);
        if (k.outT > 1.3) { k.state = 'gone'; k.g.visible = false; }
        break;
    }
    if (k.state !== 'gone') {
      k.g.position.set(k.x, kidY(k), k.z);
      // little bob while up
      if (k.state === 'up' || k.state === 'windup') k.inner.rotation.z = Math.sin(st.t * 6 + k.x) * 0.05;
    }
    // warning marker
    if (k.state === 'windup' && st.mode === 'play') {
      const [sx, sy, sz] = worldToScreen(new THREE.Vector3(k.x, kidY(k) + 1.55 * k.T.scale, k.z));
      if (sz < 1) { k.mk.style.display = 'block'; k.mk.style.left = sx + 'px'; k.mk.style.top = sy + 'px'; k.mk.style.transform = `scale(${1 + 0.15 * Math.sin(st.t * 20)})`; }
    } else k.mk.style.display = 'none';
    // presence marker seen "through" the wall while ducked
    const ducked = st.mode === 'play' && st.camY < 0.95 && k.state !== 'out' && k.state !== 'gone' && k.state !== 'windup';
    if (ducked) {
      const [sx, sy] = worldToScreen(new THREE.Vector3(k.x, 1.0 * k.T.scale + 1.0, k.z));
      const vis = k.state === 'hidden' ? 0 : k.up;
      k.kd.style.display = 'block'; k.kd.style.left = sx + 'px'; k.kd.style.top = sy + 'px';
      k.kd.style.opacity = 0.35 + vis * 0.65; k.kd.style.transform = `translateY(${-vis * 14}px) scale(${0.75 + vis * 0.35})`;
    } else k.kd.style.display = 'none';
  }
  const living = kids.filter((k) => k.state !== 'out' && k.state !== 'gone').length;
  if (st.mode === 'play' && living === 0 && st.waveT <= 0 && kids.length) {
    st.waveT = 2.0; center(D.clear, 1.6); SFX.clear();
    st.score += 200 * st.wave;
    if (st.wave % 2 === 0 && st.hearts < 3) st.hearts++;
    updateHud();
  }
}

// ---------- input ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const aimPoint = new THREE.Vector3();
let finger = { x: 0, y: 0 };
let ignoreUntilUp = false;
function reticlePos() { return [finger.x, Math.max(30, finger.y - 72)]; }
function computeAim() {
  const [rx, ry] = reticlePos();
  ndc.set(rx / W * 2 - 1, -(ry / H) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const objs = [ground, ...wallHitMeshes];
  for (const k of kids) if (k.state !== 'gone' && k.state !== 'out') objs.push(k.inner);
  const hits = ray.intersectObjects(objs, true);
  const h = hits.find((x) => x.distance > 1.6);
  if (h) aimPoint.copy(h.point); else aimPoint.copy(ray.ray.origin).addScaledVector(ray.ray.direction, 28);
  if (aimPoint.z < -30) aimPoint.multiplyScalar(30 / -aimPoint.z);
}
canvas.addEventListener('pointerdown', onDown);
$('ui').addEventListener('pointerdown', onDown);
function onDown(e) {
  e.preventDefault();
  initAudio();
  if (st.mode === 'title') { $('title').classList.remove('on'); newGame(); ignoreUntilUp = true; return; }
  if (st.mode === 'result') { if (performance.now() - st.resultAt > 700) { $('result').classList.remove('on'); newGame(); ignoreUntilUp = true; } return; }
  if (st.mode !== 'play' || st.finger !== null) return;
  if (ignoreUntilUp) return;
  st.finger = e.pointerId; finger.x = e.clientX; finger.y = e.clientY;
  if (!st.standing) SFX.rise();
  st.standing = true;
  $('reticle').style.display = 'block';
  hintTimer = Math.min(hintTimer, 0.6);
}
addEventListener('pointermove', (e) => { if (e.pointerId === st.finger) { finger.x = e.clientX; finger.y = e.clientY; } });
function onUp(e, cancel) {
  if (ignoreUntilUp) { ignoreUntilUp = false; return; }
  if (e.pointerId !== st.finger) return;
  st.finger = null; $('reticle').style.display = 'none';
  if (st.mode === 'play' && st.standing && !cancel) {
    if (finger.y < H * 0.86 && st.camY > 0.9) { computeAim(); playerThrow(aimPoint.clone()); st.follow = 0.18; return; }
  }
  st.standing = false;
}
addEventListener('pointerup', (e) => onUp(e, false));
addEventListener('pointercancel', (e) => onUp(e, true));

// ---------- loop ----------
let last = 0;
const lookTarget = new THREE.Vector3();
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (ts - (last || ts)) / 1000)); last = ts;
  st.t += dt;
  if (st.mode === 'play' || st.mode === 'ending') {
    // camera height
    const targetY = st.standing ? STAND : DUCK;
    const sp = st.standing ? 9 : 12;
    st.camY += (targetY - st.camY) * Math.min(1, dt * sp);
    st.inv = Math.max(0, st.inv - dt);
    if (st.follow > 0) { st.follow -= dt; if (st.follow <= 0 && st.finger === null) st.standing = false; }
    if (!st.standing && st.ammo < 3 && st.mode === 'play') {
      const was = st.pack;
      st.pack += dt / 0.85;
      if (st.pack >= 1) { st.pack = 0; st.ammo++; SFX.pack(); if (st.ammo === 3) SFX.ready(); updateHud(); }
      else if (Math.floor(was * 10) !== Math.floor(st.pack * 10)) updateHud();
    }
    updateKids(dt);
    updateBalls(dt);
    if (st.waveT > 0) { st.waveT -= dt; if (st.waveT <= 0 && st.mode === 'play') startWave(); }
    if (st.mode === 'ending') { st.endT -= dt; if (st.endT <= 0) showResult(); }
  } else {
    st.camY += (0.95 - st.camY) * Math.min(1, dt * 3);
    updateKids(dt); updateBalls(dt);
  }
  // camera
  const up = Math.max(0, Math.min(1, (st.camY - DUCK) / (STAND - DUCK)));
  st.shake = Math.max(0, st.shake - dt);
  const shk = st.shake * 0.25;
  camera.position.set(Math.sin(st.t * 61) * shk, st.camY + Math.cos(st.t * 53) * shk, 0.15);
  lookTarget.set(0, 5.4 - up * 4.6, -12);
  if (st.mode === 'play' && st.standing) {
    // slight look toward aim
    const [rx] = reticlePos();
    lookTarget.x = 0;
  }
  camera.lookAt(lookTarget);
  const packing = st.mode === 'play' && !st.standing && st.ammo < 3;
  handBall.position.set(packing ? 0.02 : 0.2, -0.24 + up * 0.06 + (st.follow > 0 ? 0.08 : 0) + (packing ? Math.abs(Math.sin(st.t * 9)) * 0.03 : 0), st.follow > 0 ? -0.9 : -0.5);
  handBall.scale.setScalar(packing ? 0.45 + st.pack * 0.35 : 1);
  handBall.visible = st.mode === 'play' && (st.ammo > 0 || packing) && !(st.follow > 0);
  // reticle
  if (st.finger !== null) {
    const [rx, ry] = reticlePos();
    const el = $('reticle'); el.style.left = rx + 'px'; el.style.top = ry + 'px';
    el.style.opacity = st.ammo > 0 ? (st.camY > 0.9 ? 1 : 0.4) : 0.3;
  }
  // puffs
  for (let i = 0; i < PUFF_N; i++) {
    if (puffLife[i] <= 0) continue;
    puffLife[i] -= dt;
    if (puffLife[i] <= 0) { puffPos[i * 3 + 1] = -100; continue; }
    puffVel[i * 3 + 1] -= 6 * dt;
    puffPos[i * 3] += puffVel[i * 3] * dt; puffPos[i * 3 + 1] += puffVel[i * 3 + 1] * dt; puffPos[i * 3 + 2] += puffVel[i * 3 + 2] * dt;
    if (puffPos[i * 3 + 1] < 0.02) { puffPos[i * 3 + 1] = 0.02; puffVel[i * 3] *= 0.5; puffVel[i * 3 + 2] *= 0.5; }
  }
  puffGeo.attributes.position.needsUpdate = true;
  // snow
  const wx = st.wind * 0.9;
  for (let i = 0; i < SNOW_N; i++) {
    snowPos[i * 3 + 1] -= dt * (0.55 + (i % 7) * 0.06);
    snowPos[i * 3] += dt * (wx + Math.sin(st.t * 0.8 + i) * 0.15);
    if (snowPos[i * 3 + 1] < 0) { snowPos[i * 3 + 1] = 9; snowPos[i * 3] = (Math.random() - 0.5) * 18; }
    if (snowPos[i * 3] > 9) snowPos[i * 3] -= 18; else if (snowPos[i * 3] < -9) snowPos[i * 3] += 18;
  }
  snowGeo.attributes.position.needsUpdate = true;
  if (windGain && AC) windGain.gain.setTargetAtTime(0.035 + Math.abs(st.wind) * 0.025, AC.currentTime, 0.5);
  // ui timers
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i]; p.t += dt;
    p.d.style.top = (p.y - p.t * 40) + 'px'; p.d.style.opacity = Math.max(0, 1 - Math.pow(p.t / p.life, 2));
    if (p.t >= p.life) { p.d.remove(); pops.splice(i, 1); }
  }
  if (hintTimer > 0) { hintTimer -= dt; if (hintTimer <= 0) $('hint').style.opacity = 0; }
  if (centerTimer > 0) { centerTimer -= dt; if (centerTimer <= 0) $('center').style.opacity = 0; }
  renderer.render(scene, camera);
  drawFx(dt);
}

function showResult() {
  st.mode = 'result'; st.resultAt = performance.now();
  st.standing = false; st.finger = null;
  const isNew = st.score > (saveData.best || 0);
  if (isNew) saveData.best = st.score;
  saveData.bestWave = Math.max(saveData.bestWave || 0, st.wave);
  try { parent.postMessage({ agf: 'save', data: saveData }, '*'); } catch (e) {}
  $('r-h').textContent = D.over;
  $('r-s').textContent = st.score;
  $('r-b').textContent = isNew ? D.newBest : D.best(saveData.best);
  $('r-b').className = 'rs-b' + (isNew ? ' new' : '');
  $('r-d').innerHTML = D.detail(st.wave, st.outs, st.counters);
  $('result').classList.add('on');
  $('hud').style.display = 'none'; $('ammo').style.display = 'none';
  for (const k of kids) { k.mk.style.display = 'none'; k.kd.style.display = 'none'; }
  signal('end', { score: st.score });
}

// title backdrop: a few kids playing in the background
(function titleScene() {
  st.wave = 1;
  ['normal', 'quick', 'normal'].forEach((type, i) => {
    const k = makeKid(type); const [x, z] = SLOTS[[0, 2, 4][i]];
    k.x = x; k.z = z; k.state = 'hidden'; k.t = 0.3 + i * 0.7; k.up = 0; k.outT = 0;
    k.mk = document.createElement('div'); k.mk.className = 'mk'; k.mk.textContent = '!'; ui.appendChild(k.mk);
    k.kd = document.createElement('div'); k.kd.className = 'kd'; ui.appendChild(k.kd);
    k.g.position.set(k.x, kidY(k), k.z); kids.push(k);
  });
  // let them peek on the title screen
  const orig = st.mode;
  for (const k of kids) { k.state = 'up'; k.up = 1; k.t = 999; }
  kids[1].arm.rotation.x = 2.2; kids[1].held.visible = true;
})();
requestAnimationFrame(frame);
</script>
