<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>カーブ前のひと呼吸</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overscroll-behavior:none;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:#173b46;color:#f5efd9}
#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(#244c59,#173b46)}
header{position:absolute;top:3%;left:6%;right:6%;display:flex;justify-content:space-between;font-size:16px}
#advice{position:absolute;top:18%;width:100%;text-align:center;font-size:15px;color:#ffe6a0}
#speed{position:absolute;top:9%;left:6%;font-size:30px;font-weight:800}
#next{position:absolute;top:10%;right:6%;font-size:16px;text-align:right;white-space:pre-line}
canvas{position:absolute;top:23%;left:4%;width:92%;height:47%}
#status{position:absolute;top:71%;width:100%;text-align:center;font-size:16px}
#brake{position:absolute;top:78%;left:17%;width:66%;height:13%;border-radius:22px;border:3px solid #e2e9d5;background:#db8667;color:#182e35;font:700 22px system-ui}
#brake.held{background:#ffcf80;transform:scale(.97)}
#hint{position:absolute;bottom:3%;width:100%;text-align:center;font-size:14px}
#cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7%;background:#173b46f5;text-align:center}
#cover.hidden{display:none}
h1{font-size:clamp(24px,7vw,34px);margin:8px 0}
p{font-size:17px;line-height:1.7;white-space:pre-line}
</style>
</head>
<body>
<div id="game">
<header><span id="clock"></span><span id="progress"></span></header>
<div id="advice"></div><div id="speed"></div><div id="next"></div><canvas id="road"></canvas>
<div id="status"></div><button id="brake"></button><div id="hint"></div><div id="cover"></div>
</div>
<script>
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en');
const words={
ja:{title:'カーブ前のひと呼吸',intro:'車は自動で加速。\nボタンを長押しして、カーブ前に減速。\n制限を超えるとスピンします。',start:'タップでスタート',again:'タップでもう一度',brake:'長押しでブレーキ',hint:'直線では離して加速',time:'タイム',next:'次のカーブ',finish:'ゴールまで',spin:'スピン！',clean:'抜けた！',ready:'25秒切りを目指そう',result:'一周完走',best:'ベスト',newBest:'ベスト更新！',spins:'スピン',seconds:'秒',limit:'以下',ghost:'白い影は自分のベスト',splits:'通過時刻',braking:'制動距離',brakeNow:'そろそろ減速',recover:'立て直し',goal:'ゴール',unit:'km/h'},
en:{title:'A Breath Before the Bend',intro:'The car accelerates automatically.\nHold the button to brake before bends.\nExceed the limit and you spin.',start:'Tap to start',again:'Tap to play again',brake:'Hold to brake',hint:'Release to accelerate on straights',time:'Time',next:'Next bend',finish:'To finish',spin:'Spin!',clean:'Through!',ready:'Aim for under 25 seconds',result:'Lap complete',best:'Best',newBest:'New best!',spins:'Spins',seconds:'s',limit:'or less',ghost:'White ghost: your best lap',splits:'Bend splits',braking:'Braking distance',brakeNow:'Brake soon',recover:'Recovering',goal:'Finish',unit:'km/h'}
};
const t=words[LANG==='ja'?'ja':'en'],$=id=>document.getElementById(id);
for(const type of ['contextmenu','selectstart','gesturestart'])addEventListener(type,e=>e.preventDefault(),{passive:false});
const signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};
const canvas=$('road'),ctx=canvas.getContext('2d');
const points=[[55,290],[55,55],[285,55],[285,290],[55,290]];
const lengths=points.slice(1).map((p,i)=>Math.hypot(p[0]-points[i][0],p[1]-points[i][1]));
const perimeter=lengths.reduce((a,b)=>a+b,0);
const bends=[];let sum=0;
for(let i=0;i<3;i++){sum+=lengths[i];bends.push({distance:sum/perimeter*600,limit:[60,80,50][i],point:points[i+1]})}
let trace=[],bestTrace=[],splits=[];
let mode='title',distance=0,speed=50,time=0,index=0,spins=0,spin=0,held=null,last=0,ended=0,best=null,notice=0,ac=null;
function tone(freq){
try{
ac??=new (window.AudioContext||window.webkitAudioContext)();ac.resume();
const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.045,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.13);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.14);
}catch{}
}
function cover(title,body,action){$('cover').innerHTML='<h1>'+title+'</h1><p>'+body+'</p><p>'+action+'</p>';$('cover').classList.remove('hidden')}
function start(){
trace=[];splits=[];distance=0;speed=50;time=0;index=0;spins=0;spin=0;held=null;notice=0;mode='play';
$('cover').classList.add('hidden');$('status').textContent=t.ready;$('hint').textContent=t.hint;$('brake').classList.remove('held');signal('start');tone(360);paint();
}
function end(){
mode='result';ended=performance.now();held=null;$('brake').classList.remove('held');
const improved=best===null||time<best;if(improved)bestTrace=trace.slice();best=Math.min(best??Infinity,time);
signal('end',{score:Math.round(time*10)});
cover(t.result,time.toFixed(2)+t.seconds+' · '+t.spins+' '+spins+'\n'+t.best+' '+best.toFixed(2)+t.seconds+'\n'+t.splits+' '+splits.map(s=>s.toFixed(1)).join(' / ')+(improved?'\n'+t.newBest:''),t.again);
tone(660);
}
function update(dt){
if(mode!=='play')return;
time+=dt;if(time>4.5)$('hint').textContent='';
if(spin>0){spin=Math.max(0,spin-dt);return}
speed=Math.max(25,Math.min(140,speed+(held!==null?-80:25)*dt));
distance=Math.min(600,distance+speed/3.6*dt);
if(index<bends.length&&distance>=bends[index].distance){
if(speed>bends[index].limit+.5){spin=1.8;spins++;speed=40;$('status').textContent=t.spin;tone(150)}
else{$('status').textContent=t.clean;tone(520)}
splits.push(time);notice=time+1.5;index++;
}
if(time>notice&&spin===0)$('status').textContent=bestTrace.length?t.ghost:t.ready;
trace.push({time,distance});if(distance>=600)end();
}
function carAt(meters){
let d=meters/600*perimeter;
for(let i=0;i<lengths.length;i++){
if(d<=lengths[i]){const f=d/lengths[i];return {x:points[i][0]+(points[i+1][0]-points[i][0])*f,y:points[i][1]+(points[i+1][1]-points[i][1])*f,angle:Math.atan2(points[i+1][1]-points[i][1],points[i+1][0]-points[i][0])}}
d-=lengths[i];
}
return {x:55,y:290,angle:Math.PI};
}
function paint(){
const rect=canvas.getBoundingClientRect();if(rect.width<=0||rect.height<=0)return;
const dpr=Math.min(2,devicePixelRatio||1);
if(canvas.width!==Math.round(rect.width*dpr)||canvas.height!==Math.round(rect.height*dpr)){canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr)}
ctx.setTransform(canvas.width/340,0,0,canvas.height/340,0,0);
ctx.clearRect(0,0,340,340);
ctx.fillStyle='#326962';ctx.fillRect(15,15,310,310);
ctx.strokeStyle='#aac59a';ctx.lineWidth=42;ctx.lineJoin='round';ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();
ctx.strokeStyle='#39474c';ctx.lineWidth=32;ctx.stroke();
ctx.strokeStyle='#9caaa6';ctx.lineWidth=1;ctx.setLineDash([7,7]);ctx.stroke();ctx.setLineDash([]);
ctx.fillStyle='#81a480';for(let i=0;i<8;i++){ctx.beginPath();ctx.arc(110+i%3*47,120+Math.floor(i/3)*43,10,0,Math.PI*2);ctx.fill()}
bends.forEach((bend,i)=>{
const [x,y]=bend.point;
ctx.fillStyle=i<index?'#769e91':'#ffe6a0';ctx.beginPath();ctx.arc(x,y,14,0,Math.PI*2);ctx.fill();
ctx.font='bold 13px system-ui';ctx.fillStyle='#173b46';ctx.textAlign='center';ctx.fillText(String(bend.limit),x,y+4);
});
if(index<bends.length){
const bend=bends[index],needed=Math.max(0,(speed*speed-bend.limit*bend.limit)/576);
ctx.strokeStyle='#ffd27c';ctx.lineWidth=5;ctx.beginPath();
for(let d=Math.max(distance,bend.distance-needed);d<=bend.distance;d+=1){const p=carAt(d);ctx.lineTo(p.x,p.y)}ctx.stroke();
$('advice').textContent=t.braking+' '+Math.ceil(needed)+' m'+(bend.distance-distance<needed+7?' · '+t.brakeNow:'');
}else $('advice').textContent='';
if(spin>0)$('status').textContent=t.spin+' '+t.recover+' '+spin.toFixed(1)+t.seconds;
else if(notice>time){
const p=carAt(distance);ctx.strokeStyle='#b8f4c4';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,19,0,Math.PI*2);ctx.stroke();
}
ctx.fillStyle='#f5efd9';for(let i=0;i<4;i++){ctx.fillRect(43+i*6,285,5,5);ctx.fillRect(43+i*6,295,5,5)}
if(mode==='play'&&bestTrace.length){
let j=bestTrace.findIndex(p=>p.time>=time);if(j<0)j=bestTrace.length-1;
const g=carAt(bestTrace[j].distance);ctx.save();ctx.translate(g.x,g.y);ctx.rotate(g.angle);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.setLineDash([3,2]);ctx.strokeRect(-12,-8,24,16);ctx.restore();
}
const car=carAt(distance);
ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.angle+(spin>0?time*9:0));ctx.fillStyle=held!==null?'#ffd686':'#ec9470';ctx.fillRect(-11,-7,22,14);ctx.fillStyle='#173b46';ctx.fillRect(1,-5,5,10);ctx.restore();
$('clock').textContent=t.time+' '+time.toFixed(1)+t.seconds;
$('progress').textContent=Math.floor(distance)+'/600 m';
$('speed').textContent=Math.round(speed)+' '+t.unit;
$('next').textContent=index<bends.length?t.next+' '+Math.ceil(Math.max(0,bends[index].distance-distance))+' m\n'+bends[index].limit+' '+t.unit+' '+t.limit:t.finish+' '+Math.ceil(600-distance)+' m';
}
$('brake').textContent=t.brake;
$('brake').addEventListener('pointerdown',e=>{
e.preventDefault();if(mode!=='play'||held!==null)return;
held=e.pointerId;e.currentTarget.setPointerCapture(e.pointerId);e.currentTarget.classList.add('held');
});
function release(e){if(e.pointerId===held){held=null;$('brake').classList.remove('held')}}
$('brake').addEventListener('pointerup',release);$('brake').addEventListener('pointercancel',release);
$('cover').addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='title'||(mode==='result'&&performance.now()-ended>=700))start()});
function loop(now){const dt=last?Math.min(.05,(now-last)/1000):0;last=now;update(dt);paint();requestAnimationFrame(loop)}
addEventListener('resize',paint);cover(t.title,t.intro,t.start);requestAnimationFrame(loop);
</script>
</body></html>
