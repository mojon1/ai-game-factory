<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Star Mobile</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overscroll-behavior:none;background:#101d35;color:#fcf3d2;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
canvas{display:block;width:100vw;height:100dvh}button{font:inherit;color:inherit;border:1px solid #b5ccdc;border-radius:24px;background:#25425a;min-height:48px;padding:8px 24px}
#hud{position:absolute;top:20px;left:22px;right:22px;display:flex;justify-content:space-between;font-size:16px}
#status{position:absolute;top:86px;width:100%;text-align:center;font-size:18px}
#done{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);white-space:nowrap}
 #undo{position:absolute;bottom:135px;left:50%;transform:translateX(-50%);white-space:nowrap}#hint{position:absolute;bottom:22px;width:100%;text-align:center;font-size:14px;pointer-events:none}
#cover{position:absolute;inset:0;background:#101d35e8;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px}
#cover h1{font-size:32px;margin:0 0 24px}#cover p{font-size:17px;line-height:1.8}#cover small{font-size:16px;color:#8ee4da}
</style>
<canvas id="view"></canvas><div id="hud"></div><div id="status"></div><button id="done"></button><button id="undo"></button><div id="hint"></div><div id="cover"></div>
<script>
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en');
const D={
 ja:{title:'星飾りのつりあい',help:'星をタップして、別の星と掛け替える。<br>重さと距離を合わせて、棒を水平に。',start:'タップでスタート',again:'タップでもう一度',next:'タップで次へ',stage:'飾り',moves:'掛け替え',force:'左の力 / 右の力',level:'水平です',lean:'傾きを見て掛け替えよう',seal:'飾る',hint:'星を選んで、入れ替える相手をタップ',complete:'夜空に飾れました',more:'まだ傾いています',undo:'一手戻す',partner:'入れ替える星を選ぼう'},
 en:{title:'Star Mobile',help:'Tap two stars to swap their hooks.<br>Balance weight and distance to level the beam.',start:'Tap to start',again:'Tap to play again',next:'Tap to continue',stage:'Mobile',moves:'Swaps',force:'Left / Right moment',level:'Level',lean:'Swap stars to level the beam',seal:'Hang it up',hint:'Tap a star, then tap its swap partner',complete:'A balanced night sky',more:'Still leaning',undo:'Undo swap',partner:'Choose a swap partner'}
};
const t=D[LANG]||D.en,canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const hud=document.querySelector('#hud'),status=document.querySelector('#status'),done=document.querySelector('#done'),hint=document.querySelector('#hint'),cover=document.querySelector('#cover');
const layouts=[[2,1,2,1],[1,1,2,3,2,3],[5,2,3,1,3,2]];
const undo=document.querySelector('#undo');let history=[];let mode='title',stage=0,weights=[],positions=[],selected=-1,moves=0,angle=0,velocity=0,w=360,h=640,started=0,guard=0,last=0,audio;
const signal=(agf,data={})=>{try{parent.postMessage({agf,...data},'*')}catch{}};
for(const event of ['contextmenu','selectstart','gesturestart'])addEventListener(event,e=>e.preventDefault(),{passive:false});
function sound(freq){
 try{audio??=new AudioContext();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.18)}catch{}
}
function torque(){return weights.reduce((sum,v,i)=>sum+v*positions[i],0)}
function balanced(){return torque()===0}
function update(){
 hud.innerHTML='<span>'+t.moves+' '+moves+'</span><span>'+t.stage+' '+(stage+1)+'/3</span>';
 status.textContent=selected>=0?t.partner:balanced()?t.level:t.lean;undo.textContent=t.undo;undo.style.opacity=history.length?'1':'.4';done.textContent=t.seal;done.style.background=balanced()?'#2c766d':'#25425a';done.style.opacity=balanced()?'1':'.5';hint.textContent=t.hint;
}
function begin(){
 weights=[...layouts[stage]];positions=weights.length===4?[-2,-1,1,2]:[-3,-2,-1,1,2,3];selected=-1;history=[];moves=0;angle=0;velocity=0;started=performance.now();mode='play';cover.style.display='none';signal('start');update();
}
function overlay(title,subtitle,footer){cover.innerHTML='<div><h1>'+title+'</h1><p>'+subtitle+'</p><small>'+footer+'</small></div>';cover.style.display='flex'}
overlay(t.title,t.help,t.start);
cover.addEventListener('pointerdown',e=>{
 e.preventDefault();sound(400);
 if(mode==='title')begin();else if(performance.now()>guard){stage=stage<2?stage+1:0;begin()}
});
done.addEventListener('pointerdown',e=>{
 e.preventDefault();if(mode!=='play')return;
 if(!balanced()){status.textContent=t.more;sound(160);return}
 mode='end';guard=performance.now()+700;signal('end',{score:moves});sound(660);
 overlay(stage===2?t.complete:t.level,t.moves+' '+moves,stage===2?t.again:t.next);
});
undo.addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='play'&&history.length){weights=history.pop();selected=-1;moves=Math.max(0,moves-1);sound(300);update()}});function center(){return {x:w/2,y:h*.40}}
function starPoint(i){
 const c=center(),unit=Math.min(w*.118,52),x=positions[i]*unit;
 return {x:c.x+x*Math.cos(angle),y:c.y+x*Math.sin(angle)+90};
}
canvas.addEventListener('pointerdown',e=>{
 if(mode!=='play')return;e.preventDefault();
 const i=weights.findIndex((v,i)=>{const p=starPoint(i);return Math.hypot(e.clientX-p.x,e.clientY-p.y)<27});
 if(i<0)return;
 if(selected<0){selected=i;sound(360)}
 else{if(i!==selected){history.push([...weights]);[weights[i],weights[selected]]=[weights[selected],weights[i]];moves++;sound(balanced()?600:440)}selected=-1}update();
});
function resize(){w=Math.max(1,innerWidth);h=Math.max(1,innerHeight);const d=Math.min(2,devicePixelRatio||1);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();
function star(x,y,r,color){
 ctx.fillStyle=color;ctx.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5-Math.PI/2,z=k%2?r*.48:r;ctx.lineTo(x+Math.cos(a)*z,y+Math.sin(a)*z)}ctx.closePath();ctx.fill();
}
function frame(now){
 const dt=Math.min(.04,(now-last)/1000||0);last=now;
 if(mode==='play'){const target=Math.max(-.26,Math.min(.26,torque()*.018));velocity+=((target-angle)*28-velocity*8)*dt;angle+=velocity*dt;hint.style.opacity=now-started<4500?'1':'0'}
 ctx.fillStyle='#101d35';ctx.fillRect(0,0,w,h);
 for(let i=0;i<30;i++)star((i*79+23)%w,130+(i*137)%(Math.max(1,h-180)),i%3===0?2:1,'#44677e');
 const c=center(),unit=Math.min(w*.118,52);
 ctx.strokeStyle='#69899b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(c.x,135);ctx.lineTo(c.x,c.y);ctx.stroke();
 ctx.save();ctx.translate(c.x,c.y);ctx.rotate(angle);ctx.strokeStyle='#dfc79d';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-unit*3.35,0);ctx.lineTo(unit*3.35,0);ctx.stroke();ctx.restore();
 ctx.fillStyle='#a7becd';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText(t.force+'  '+weights.reduce((s,v,i)=>s+(positions[i]<0?-positions[i]*v:0),0)+' / '+weights.reduce((s,v,i)=>s+(positions[i]>0?positions[i]*v:0),0),w/2,h*.68);ctx.fillStyle='#99dadb';ctx.beginPath();ctx.arc(c.x,c.y,8,0,Math.PI*2);ctx.fill();
 weights.forEach((v,i)=>{
  const p=starPoint(i),x=positions[i]*unit;ctx.fillStyle='#a7becd';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText(String(Math.abs(positions[i])),c.x+x*Math.cos(angle),c.y+x*Math.sin(angle)-18);
  ctx.strokeStyle='#8aafbf';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(c.x+x*Math.cos(angle),c.y+x*Math.sin(angle));ctx.lineTo(p.x,p.y);ctx.stroke();
  if(i===selected){ctx.strokeStyle='#a6fff0';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,29,0,Math.PI*2);ctx.stroke()}
  star(p.x,p.y,25,['','#8fe0d5','#f4c773','#f29591','#aab6ff','#c4a5f2'][v]);
  ctx.fillStyle='#17263c';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(v),p.x,p.y+1);
 });
 requestAnimationFrame(frame);
}requestAnimationFrame(frame);
</script></html>
