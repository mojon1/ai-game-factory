'use strict';const c=document.getElementById('c'),g=c.getContext('2d');for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});const lang=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),D={ja:{title:'ひと息の星渡り',sub:'離して考え、触れて渡る',r1:'押しながら指で星へ移動',r2:'離すと弾が止まる。赤線は予告',r3:'星6個で到着、3回当たると終了',start:'タップでスタート',stars:'星',life:'残り',frozen:'時間は止まっている',moving:'時間が流れている',hint:'押して動く、離してひと息',clear:'星の岸に着いた',fail:'旅はここまで',retry:'タップでもう一度',hit:'当たった'},en:{title:'Breathing Between Stars',sub:'Release to plan; touch to travel',r1:'Hold and drag toward each star',r2:'Release freezes bullets. Red lines warn',r3:'Collect 6 stars; 3 hits end the trip',start:'Tap to start',stars:'Stars',life:'Lives',frozen:'Time is frozen',moving:'Time is flowing',hint:'Hold to move; release to breathe',clear:'The star shore is reached',fail:'The journey ends here',retry:'Tap to play again',hit:'Hit'}};const T=D[lang]||D.en;let W,H,s,ox,oy,state='title',finger=null,ship={x:180,y:520},target={x:180,y:520},count=0,hp=3,bullets=[],warnings=[],trail=[],world=0,elapsed=0,ended=0,spawn=.6,serial=0,inv=0,ac,flash=0;const stars=[[90,420],[270,330],[90,230],[260,170],[180,350],[180,160]];const signal=(agf,data={})=>{try{parent.postMessage({agf,...data},'*')}catch(e){}};function audio(){try{ac||=new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}function tone(f,d=.08,type='sine'){try{if(!ac)return;const o=ac.createOscillator(),a=ac.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(.05,ac.currentTime);a.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(a).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}function resize(){W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);const d=Math.min(2,devicePixelRatio||1);c.width=W*d;c.height=H*d;s=Math.min(W/360,H/640);ox=(W-360*s)/2;oy=(H-640*s)/2}addEventListener('resize',resize);resize();function begin(){ship={x:180,y:520};target={...ship};finger=null;count=0;hp=3;bullets=[];warnings=[];trail=[];world=0;elapsed=0;spawn=.6;serial=0;inv=0;flash=0;state='play';signal('start')}function finish(ok){state=ok?'clear':'fail';ended=0;finger=null;signal('end',{score:count});tone(ok?800:130,.3)}function point(e){const r=c.getBoundingClientRect();return{x:Math.max(44,Math.min(316,(e.clientX-r.left-ox)/s)),y:Math.max(126,Math.min(548,(e.clientY-r.top-oy)/s))}}c.addEventListener('pointerdown',e=>{e.preventDefault();audio();if(state==='title'){begin();return}if(state==='clear'||state==='fail'){if(ended>=.7)begin();return}if(finger!==null)return;finger=e.pointerId;c.setPointerCapture(e.pointerId);target=point(e)});c.addEventListener('pointermove',e=>{if(e.pointerId===finger)target=point(e)});function release(e){if(e.pointerId===finger)finger=null}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);function update(dt){elapsed+=dt;if(state==='clear'||state==='fail'){ended+=dt;return}if(state!=='play'||finger===null)return;world+=dt;inv=Math.max(0,inv-dt);flash=Math.max(0,flash-dt);const dx=target.x-ship.x,dy=target.y-ship.y,dist=Math.hypot(dx,dy),k=Math.min(1,280*dt/Math.max(.01,dist));ship.x+=dx*k;ship.y+=dy*k;trail.push({...ship});if(trail.length>24)trail.shift();spawn-=dt;if(spawn<=0){spawn+=.85;const n=serial++,sources=[[60,100],[300,100],[24,250],[336,180],[180,100]],q=sources[n%sources.length],dx=ship.x-q[0],dy=ship.y-q[1],l=Math.hypot(dx,dy);warnings.push({x:q[0],y:q[1],vx:dx/l*110,vy:dy/l*110,age:0});tone(150,.045)}for(const w of warnings){w.age+=dt;if(w.age>=.65&&!w.sent){w.sent=true;bullets.push({x:w.x,y:w.y,vx:w.vx,vy:w.vy})}}warnings=warnings.filter(w=>!w.sent);for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;if(inv===0&&Math.hypot(b.x-ship.x,b.y-ship.y)<17){hp--;inv=1.2;flash=.25;tone(100,.16,'triangle');b.y=700;if(hp<=0){finish(false);return}}}bullets=bullets.filter(b=>b.x>-20&&b.x<380&&b.y>80&&b.y<620);if(count<6&&Math.hyp function text(str,x,y,size=18,color='#e0eee4'){g.fillStyle=color;g.textAlign='center';g.font=size+'px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif';const w=g.measureText(str).width;if(w>320)g.font=(size*320/w)+'px system-ui';g.fillText(str,x,y)}function star(x,y,r,color){g.fillStyle=color;g.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.46:r;i?g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):g.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath();g.fill()}function draw(){g.setTransform(c.width/W,0,0,c.height/H,0,0);g.clearRect(0,0,W,H);g.save();g.translate(ox,oy);g.scale(s,s);g.fillStyle=flash>0?'#482d42':'#112833';g.fillRect(0,0,360,640);for(let i=0;i<45;i++){const x=(i*97+23)%340+10,y=(i*131+54)%510+95;g.fillStyle='#31505c';g.fillRect(x,y,2,2)}if(state==='title'){text(T.title,180,174,29);text(T.sub,180,219,18,'#8dc9c6');star(180,280,25,'#e5c97b');text(T.r1,180,349,18);text(T.r2,180,383,17);text(T.r3,180,417,17);text(T.start,180,509,22);g.restore();return}text(T.stars+' '+count+'/6',76,35,19,'#e5c97b');text(T.life+' '+hp,284,35,19);text(finger===null?T.frozen:T.moving,180,82,18,'#8dc9c6');g.strokeStyle='#41626c';g.lineWidth=1;g.strokeRect(32,112,296,452);for(const w of warnings){g.strokeStyle='#da8793';g.lineWidth=2;g.setLineDash([5,8]);g.beginPath();g.moveTo(w.x,w.y);g.lineTo(w.x+w.vx*5,w.y+w.vy*5);g.stroke();g.setLineDash([]);g.fillStyle='#da8793';g.beginPath();g.arc(w.x,w.y,6+w.age*7,0,Math.PI*2);g.fill()}for(const b of bullets){g.fillStyle='#f1909d';g.beginPath();g.arc(b.x,b.y,7,0,Math.PI*2);g.fill();g.strokeStyle='#ffd5c9';g.lineWidth=2;g.beginPath();g.moveTo(b.x-b.vx*.07,b.y-b.vy*.07);g.lineTo(b.x,b.y);g.stroke()}if(count<6){const p=stars[count];g.strokeStyle='#817850';g.lineWidth=2;g.beginPath();g.arc(p[0],p[1],28,0,Math.PI*2);g.stroke();star(p[0],p[1],18,'#e5c97b');if(count<5){const q=stars[count+1];star(q[0],q[1],9,'#5c6253')}}g.strokeStyle='#619ba1';g.lineWidth=3;g.beginPath();trail.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.stroke();g.fillStyle=inv>0?'#f2e0da':'#b2e9dc';g.beginPath();g.arc(ship.x,ship.y,10,0,Math.PI*2);g.fill();g.strokeStyle=inv>0?'#e5909c':'#b2e9dc';g.lineWidth=2;g.beginPath();g.arc(ship.x,ship.y,inv>0?19:15,0,Math.PI*2);g.stroke();if(elapsed<6)text(T.hint,180,609,16);if(state==='clear'||state==='fail'){g.fillStyle='#112833ee';g.fillRect(25,235,310,215);text(state==='clear'?T.clear:T.fail,180,296,26);text(T.stars+' '+count+'/6',180,350,25,'#e5c97b');text(T.retry,180,416,20)}g.restore()}let prev;function frame(now){const dt=Math.min(.05,Math.max(0,(now-(prev??now))/1000));prev=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
