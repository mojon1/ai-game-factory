<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ころころ毛玉の庭</title><style>html,body{margin:0;width:100%;height:100dvh;overflow:hidden;background:#203e39;overscroll-behavior:none}*{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}canvas{display:block;width:100vw;height:100dvh}</style><canvas></canvas><script src="../../lib/matter-0.20.0.min.js"></script><script>
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),en=LANG==='en';
const T=en?{title:'Fluffball Garden',a:'Roll the ball. Your fluff will chase it.',b:'Stroke its fur, then tuck it in.',start:'Tap to start',hits:'Bops ',pets:'Strokes ',call:'Call ball',sleep:'Nap time',hint:'Drag the ball, or stroke the fluff',nap:'Sweet dreams',again:'Tap to play again',watch:'What shall we play?',play:'Again! Again!',purr:'Purrr…',rest:'A little garden memory'}:{title:'ころころ毛玉の庭',a:'ボールを転がすと、毛玉がおいかける。',b:'毛をなでたら、おひるねにしよう。',start:'タップでスタート',hits:'ころころ ',pets:'なでなで ',call:'ボールをよぶ',sleep:'おひるね',hint:'ボールを転がす・毛玉をなでる',nap:'すやすや',again:'タップでもう一度',watch:'なにしてあそぶ？',play:'もういっかい！',purr:'ごろごろ…',rest:'ちいさな庭のおもいで'};
const c=document.querySelector('canvas'),g=c.getContext('2d'),{Engine,Bodies,Body,Composite,Events}=Matter;
let scale=1,ox=0,oy=0;function resize(){const w=Math.max(1,innerWidth),h=Math.max(1,innerHeight),d=Math.min(2,devicePixelRatio||1);c.width=w*d;c.height=h*d;scale=Math.min(w/360,h/640);ox=(w-360*scale)/2;oy=(h-640*scale)/2;g.setTransform(d*scale,0,0,d*scale,d*ox,d*oy)}addEventListener('resize',resize);resize();
for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});
const signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};
let ac;function tone(f){try{ac??=new AudioContext();ac.resume();const o=ac.createOscillator(),v=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f,ac.currentTime);v.gain.setValueAtTime(.035,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.15);o.connect(v).connect(ac.destination);o.start();o.stop(ac.currentTime+.16)}catch{}}
let state='title',time=0,age=0,ended=0,hits=0,pets=0,purr=0,cool=0,engine,ball,cat,ptr=null,hearts=[];
function setup(){engine=Engine.create({gravity:{x:0,y:0}});ball=Bodies.circle(265,240,17,{restitution:.92,friction:0,frictionAir:.012});cat=Bodies.circle(130,400,29,{isStatic:true,restitution:.9});const walls=[Bodies.rectangle(10,330,30,370,{isStatic:true}),Bodies.rectangle(350,330,30,370,{isStatic:true}),Bodies.rectangle(180,140,360,30,{isStatic:true}),Bodies.rectangle(180,515,360,30,{isStatic:true})];Composite.add(engine.world,[ball,cat,...walls]);Events.on(engine,'collisionStart',ev=>{for(const p of ev.pairs)if((p.bodyA===ball&&p.bodyB===cat)||(p.bodyB===ball&&p.bodyA===cat)){if(cool>0)continue;cool=.7;hits++;tone(260+hits%5*45);const dx=ball.position.x-cat.position.x,dy=ball.position.y-cat.position.y,d=Math.hypot(dx,dy)||1;Body.setVelocity(ball,{x:dx/d*5,y:dy/d*5})}})}
setup();
function start(){state='play';age=0;hits=0;pets=0;purr=0;cool=0;ptr=null;hearts=[];setup();signal('start')}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function point(e){const r=c.getBoundingClientRect();return{x:((e.clientX-r.left)-ox)/scale,y:((e.clientY-r.top)-oy)/scale}}
c.addEventListener('pointerdown',e=>{if(ptr)return;tone(180);if(state==='title'){start();return}if(state==='end'){if(time-ended>.7)start();return}const p=point(e);if(p.y>535&&p.y<590){if(p.x<180){Body.setStatic(ball,false);Body.setPosition(ball,{x:265,y:240});Body.setVelocity(ball,{x:-4,y:3})}else{state='end';ended=time;signal('end')}return}const db=Math.hypot(p.x-ball.position.x,p.y-ball.position.y),dc=Math.hypot(p.x-cat.position.x,p.y-cat.position.y);if(db<34){ptr={id:e.pointerId,type:'ball',p,v:{x:0,y:0}};Body.setStatic(ball,true)}else if(dc<48){ptr={id:e.pointerId,type:'pet',p,len:0,earned:false}}if(ptr)c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(!ptr||ptr.id!==e.pointerId||state!=='play')return;const p=point(e);if(ptr.type==='ball'){ptr.v={x:clamp((p.x-ptr.p.x)*.6,-8,8),y:clamp((p.y-ptr.p.y)*.6,-8,8)};Body.setPosition(ball,{x:clamp(p.x,43,317),y:clamp(p.y,173,482)})}else if(Math.hypot(p.x-cat.position.x,p.y-cat.position.y)<55){ptr.len+=Math.hypot(p.x-ptr.p.x,p.y-ptr.p.y);if(ptr.len>45&&!ptr.earned){ptr.earned=true;pets++;purr=4;tone(460);for(let i=0;i<5;i++)hearts.push({x:cat.position.x+(i-2)*12,y:cat.position.y-25,a:1+i*.15})}}ptr.p=p});
function release(e){if(!ptr||ptr.id!==e.pointerId)return;if(ptr.type==='ball'){Body.setStatic(ball,false);Body.setVelocity(ball,e.type==='pointercancel'?{x:0,y:0}:ptr.v)}ptr=null}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);
function text(s,x,y,size=18,color='#23413b'){g.fillStyle=color;g.textAlign='center';g.font='600 '+size+'px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif';const w=g.measureText(s).width;g.save();g.translate(x,y);if(w>326)g.scale(326/w,1);g.fillText(s,0,0);g.restore()}
function circle(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function fluff(x,y,asleep=false){g.save();g.translate(x,y);const wob=Math.sin(time*3)*1.5;for(let i=0;i<12;i++){const a=i*Math.PI/6;circle(Math.cos(a)*23,Math.sin(a)*23,11+wob,'#f4dbaf')}circle(0,0,30,'#f4dbaf');circle(-14,26,9,'#dfbc8f');circle(14,26,9,'#dfbc8f');g.strokeStyle='#55483d';g.lineWidth=2.5;for(const ex of [-10,10]){if(asleep||purr>0){g.beginPath();g.arc(ex,-1,5,0,Math.PI);g.stroke()}else circle(ex,1,3,'#55483d')}circle(0,9,3,'#bc766b');g.restore()}
function button(x,s){g.fillStyle=x<100?'#c9dbca':'#dec3a2';g.beginPath();g.roundRect(x-72,537,144,52,15);g.fill();text(s,x,569,16)}
function draw(){g.clearRect(-ox/scale,-oy/scale,c.width/scale,c.height/scale);g.fillStyle='#eaf0d8';g.fillRect(0,0,360,640);
if(state==='title'){text(T.title,180,113,29);fluff(180,280);circle(250,330,17,'#de8d70');text(T.a,180,423,16);text(T.b,180,454,16);text(T.start,180,564,21);return}
text(T.hits+hits,85,36,17);text(T.pets+pets,270,36,17);
g.fillStyle='#bed3b0';g.beginPath();g.roundRect(25,155,310,345,28);g.fill();for(let i=0;i<16;i++){const x=43+(i*71)%275,y=180+(i*47)%290;g.strokeStyle='#aec59f';g.lineWidth=2;g.beginPath();g.moveTo(x,y);g.lineTo(x+3,y-5);g.stroke()}
if(state==='end'){fluff(180,330,true);text('z Z',233,300,20);text(T.nap,180,101,30);text(T.rest,180,548,17);text(T.again,180,592,21);return}
text(purr>0?T.purr:hits?T.play:T.watch,180,103,21);const p=ball.position;g.save();g.translate(p.x,p.y);g.rotate(ball.angle);circle(0,0,17,'#de8d70');g.strokeStyle='#fff0d1';g.lineWidth=4;g.beginPath();g.moveTo(-12,-8);g.lineTo(12,8);g.stroke();g.restore();fluff(cat.position.x,cat.position.y);
for(const h of hearts)text('♥',h.x,h.y,18,'#c57070');button(90,T.call);button(270,T.sleep);if(age<4)text(T.hint,180,629,13)}
let last=0;function frame(ts){const dt=Math.min(.033,Math.max(0,(ts-last)/1000));last=ts;time+=dt;if(state==='play'){age+=dt;cool=Math.max(0,cool-dt);purr=Math.max(0,purr-dt);if(!ptr&&purr===0){const p=cat.position,b=ball.position,dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy);if(d>46)Body.setPosition(cat,{x:clamp(p.x+dx/d*82*dt,60,300),y:clamp(p.y+dy/d*82*dt,205,465)})}if(dt>0)Engine.update(engine,dt*1000);hearts.forEach(h=>{h.y-=dt*25;h.a-=dt});hearts=hearts.filter(h=>h.a>0)}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
