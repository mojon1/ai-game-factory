'use strict';const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),D={ja:{title:'くるっと三つ星',a:'矢印で行・列をひとつ送る',b:'青を縦・横・斜めに三つ並べよう',c:'端から出た石は反対の端へ',start:'タップでスタート',your:'あなたの番',cpu:'相手が考え中…',turn:'手番',you:'青：あなた',other:'橙：相手',hint:'矢印をタップ。相手の石も一緒に動く',rule:'両色が並ぶと相打ち。24手で引き分け',win:'青の三つ星！',lose:'橙が三つ並んだ',both:'同時に三つ、相打ち',draw:'24手、引き分け',again:'タップでもう一度',last:'枠の光る矢印は直前の相手の手'},en:{title:'Rolling Three',a:'Tap an arrow to shift a row or column',b:'Align three blue stones in any direction',c:'Stones wrap around to the opposite edge',start:'Tap to start',your:'Your turn',cpu:'Opponent is thinking…',turn:'Move',you:'Blue: you',other:'Orange: opponent',hint:'Tap arrows. Both colors move together',rule:'Both lines: tie. Draw after 24 moves',win:'Three blue stars!',lose:'Orange made three',both:'Both made three: tie',draw:'24 moves: a draw',again:'Tap to play again',last:'Glowing arrows show the last opponent move'}},T=D[LANG]||D.en,c=document.querySelector('canvas'),g=c.getContext('2d'),starts=[[1,2,0,2,2,0,0,2,1,0,0,1,0,2,1,1],[2,1,0,1,1,0,2,0,2,0,0,0,1,1,2,2],[1,1,0,2,2,1,2,1,0,0,0,0,2,0,2,1]],lines=[],moves=[];for(let y=0;y<4;y++)for(let x=0;x<4;x++)for(const[dx,dy]of[[1,0],[0,1],[1,1],[-1,1]])if(x+2*dx>=0&&x+2*dx<4&&y+2*dy<4)lines.push([y*4+x,(y+dy)*4+x+dx,(y+2*dy)*4+x+2*dx]);for(let a=0;a<2;a++)for(let n=0;n<4;n++)for(const d of[-1,1])moves.push({a,n,d,x:a===0?d<0?28:332:87+62*n,y:a===0?227+62*n:d<0?168:472,s:a===0?d<0?'←':'→':d<0?'↑':'↓'});let sc=1,ox=0,oy=0,st='title',board=[],ply=0,run=0,age=0,last=0,clock=0,delay=0,outcome='',lastMove=-1,flash=0,winning=[],ac=null;

function text(s,x,y,size=18,col='#f0f0eb',max=326){g.fillStyle=col;g.textAlign='center';g.textBaseline='middle';g.font=`500 ${size}px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif`;const w=g.measureText(s).width;if(w>max)g.font=`500 ${size*max/w}px system-ui,sans-serif`;g.fillText(s,x,y)}function box(x,y,w,h,col,r=10){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
