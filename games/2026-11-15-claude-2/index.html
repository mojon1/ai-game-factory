// ---------- canvas ----------
const cv = document.getElementById('c');

  S = Math.max(0.1, Math.min(CW / WW, avail / WH));
  OX = (CW - WW * S) / 2; OY = HUD + (avail - WH * S) / 2;

// ---------- random (deterministic) ----------
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const R0 = rng(7);
const STARS = Array.from({ length: 140 }, () => ({ x: R0(), y: R0(), r: R0() * 1.3 + 0.3, p: R0() * 6.28, s: 0.5 + R0() * 2 }));

// ---------- holes ----------
const D2R = Math.PI / 180;
const TYPES = {

  rock: { c1: '#b8a58f', c2: '#5a4b3e', rim: '#d7c6b0', fr: 1.6, e: 0.35 },
  moon: { c1: '#d9dce8', c2: '#6c7083', rim: '#eef0fa', fr: 1.6, e: 0.35 },
  ice: { c1: '#eaf8ff', c2: '#6fb6dd', rim: '#ffffff', fr: 0.35, e: 0.3 },
  sand: { c1: '#f3d999', c2: '#a8813f', rim: '#ffe9b8', fr: 5.5, e: 0.2 },
  gas: { c1: '#f2c487', c2: '#a4532c', rim: '#ffd9a8', fr: 0.6, e: 0.78 },
  aster: { c1: '#a99a8a', c2: '#4a4038', rim: '#cbbcaa', fr: 1.4, e: 0.75 },
};
// gm in px^3/s^2
const HOLES = [
  { par: 2, pv: 1.5, tee: 0, tang: -90, bodies: [
    { x: 180, y: 505, r: 40, t: 'rock', gm: 1.1e6 },
    { x: 180, y: 145, r: 46, t: 'grass', gm: 1.6e6, cup: 128 },
  ] },
  { par: 2, pv: 1.4, tee: 0, tang: -70, bodies: [
    { x: 85, y: 520, r: 36, t: 'rock', gm: 1.0e6 },
    { x: 272, y: 122, r: 42, t: 'grass', gm: 1.4e6, cup: -165 },
    { x: 182, y: 318, r: 30, t: 'moon', gm: 0.9e6 },
  ] },
  { par: 3, pv: 1.1, tee: 0, tang: -90, bodies: [
    { x: 180, y: 545, r: 32, t: 'rock', gm: 0.9e6 },
    { x: 180, y: 305, r: 64, t: 'gas', gm: 4.2e6 },
    { x: 180, y: 72, r: 36, t: 'grass', gm: 1.1e6, cup: 90 },
  ] },
  { par: 3, pv: 1.0, tee: 0, tang: -60, bodies: [
    { x: 68, y: 540, r: 32, t: 'rock', gm: 0.9e6 },
    { x: 290, y: 92, r: 38, t: 'grass', gm: 1.2e6, cup: 165 },
    { orbit: { cx: 180, cy: 310, rad: 72, w: 0.55, ph: 0 }, r: 26, t: 'moon', gm: 0.9e6 },
    { orbit: { cx: 180, cy: 310, rad: 72, w: 0.55, ph: Math.PI }, r: 26, t: 'moon', gm: 0.9e6 },
  ] },
  { par: 3, pv: 0.9, tee: 0, tang: -55, bodies: [
    { x: 62, y: 525, r: 34, t: 'rock', gm: 0.9e6 },
    { x: 296, y: 92, r: 36, t: 'grass', gm: 1.1e6, cup: 180 },
    { x: 182, y: 300, r: 13, t: 'bh', gm: 2.6e6 },
  ] },
  { par: 3, pv: 0.9, tee: 0, tang: -90, bodies: [

    { x: 180, y: 185, r: 52, t: 'ice', gm: 1.9e6, cup: -90 },
    { orbit: { cx: 180, cy: 185, rad: 112, w: -0.7, ph: 0.5 }, r: 17, t: 'moon', gm: 0.35e6 },
  ] },
  { par: 3, pv: 0.85, tee: 0, tang: -110, bodies: [
    { x: 300, y: 535, r: 34, t: 'rock', gm: 0.9e6 },
    { x: 70, y: 95, r: 40, t: 'sand', gm: 1.2e6, cup: 30 },
    { x: 110, y: 330, r: 17, t: 'aster', gm: 0.18e6 },
    { x: 185, y: 285, r: 14, t: 'aster', gm: 0.15e6 },
    { x: 255, y: 340, r: 19, t: 'aster', gm: 0.2e6 },
    { x: 160, y: 400, r: 13, t: 'aster', gm: 0.14e6 },
    { x: 235, y: 210, r: 16, t: 'aster', gm: 0.16e6 },
    { x: 120, y: 225, r: 12, t: 'aster', gm: 0.12e6 },
    { x: 300, y: 270, r: 13, t: 'aster', gm: 0.13e6 },
  ] },
  { par: 3, pv: 0.85, tee: 0, tang: -60, portals: [{ x: 300, y: 420 }, { x: 70, y: 150 }], bodies: [
    { x: 75, y: 535, r: 34, t: 'rock', gm: 0.9e6 },
    { x: 290, y: 78, r: 34, t: 'grass', gm: 1.0e6, cup: 180 },
    { x: 180, y: 300, r: 70, t: 'gas', gm: 5.2e6 },
  ] },
  { par: 4, pv: 0.8, tee: 0, tang: -45, bodies: [
    { x: 60, y: 540, r: 32, t: 'rock', gm: 0.9e6 },
    { x: 100, y: 95, r: 36, t: 'grass', gm: 1.1e6, cup: 0 },
    { x: 262, y: 410, r: 12, t: 'bh', gm: 1.9e6 },
    { x: 238, y: 190, r: 46, t: 'gas', gm: 2.4e6 },
    { orbit: { cx: 100, cy: 95, rad: 84, w: 0.8, ph: 1.0 }, r: 15, t: 'moon', gm: 0.3e6 },
  ] },

const BR = 6, DRAG = 0.16, SINKV = 165, PORTAL_R = 15, FUNNEL = 0.6, WALL_E = 0.5;
let hole = null; // current hole object (runtime copy)
function buildHole(i) {
  const H = HOLES[i];
  const h = { i, par: H.par, pv: H.pv, portals: H.portals || null, bodies: H.bodies.map((b) => {
    const o = Object.assign({ x: 0, y: 0, vx: 0, vy: 0 }, b);
    if (b.t !== 'bh') Object.assign(o, { fr: TYPES[b.t].fr, e: TYPES[b.t].e });
    if (b.cup != null) o.cupA = b.cup * D2R;
    o.seed = (i * 31 + b.r * 7) | 0;
    return o;
  }) };
  h.tee = h.bodies[H.tee]; h.tang = H.tang * D2R;
  return h;
}
function placeBodies(h, t) {
  for (const b of h.bodies) {
    if (!b.orbit) continue;
    const o = b.orbit, a = o.w * t + o.ph;
    b.x = o.cx + Math.cos(a) * o.rad; b.y = o.cy + Math.sin(a) * o.rad;
    b.vx = -Math.sin(a) * o.rad * o.w; b.vy = Math.cos(a) * o.rad * o.w;
  }
}

// ---------- physics ----------
function stepSim(h, s, dt, ev) {
  placeBodies(h, s.t);
  let ax = 0, ay = 0;
  for (const b of h.bodies) {
    const dx = b.x - s.x, dy = b.y - s.y;
    const minD = b.t === 'bh' ? b.r : b.r + BR;
    const d2 = Math.max(dx * dx + dy * dy, minD * minD);
    const inv = b.gm / (d2 * Math.sqrt(d2));
    ax += dx * inv; ay += dy * inv;
  }
  s.vx += ax * dt; s.vy += ay * dt;
  const k = Math.exp(-DRAG * dt); s.vx *= k; s.vy *= k;
  s.x += s.vx * dt; s.y += s.vy * dt;
  s.t += dt;
  if (s.lipCd > 0) s.lipCd -= dt;
  if (s.pCd > 0) s.pCd -= dt;
  s.contact = null;
  for (const b of h.bodies) {
    const dx = s.x - b.x, dy = s.y - b.y, d = Math.hypot(dx, dy) || 0.001;
    if (b.t === 'bh') { if (d < b.r) return 'lost'; continue; }
    const R = b.r + BR;
    if (d < R) {
      const nx = dx / d, ny = dy / d;
      s.x = b.x + nx * R; s.y = b.y + ny * R;
      let rvx = s.vx - b.vx, rvy = s.vy - b.vy;
      const vn = rvx * nx + rvy * ny;
      let impK = 1;
      if (vn < 0) {
        const imp = -vn, e = imp > 45 ? b.e : 0;
        if (imp > 45 && b.t !== 'ice' && b.t !== 'gas') impK = 1 - Math.min(0.55, imp / 520);
        rvx -= (1 + e) * vn * nx; rvy -= (1 + e) * vn * ny;
        if (ev && imp > 45) ev.push({ k: 'hit', imp, x: s.x - nx * BR, y: s.y - ny * BR, b });
      }
      const vn2 = rvx * nx + rvy * ny;
      let tx = rvx - vn2 * nx, ty = rvy - vn2 * ny;
      const kf = Math.exp(-b.fr * dt) * impK; tx *= kf; ty *= kf;
      rvx = vn2 * nx + tx; rvy = vn2 * ny + ty;
      s.vx = rvx + b.vx; s.vy = rvy + b.vy;
      s.contact = b;
      if (b.cupA != null && b.t !== 'ice') {
        // the green slopes gently toward the cup
        const phi = Math.atan2(ny, nx);
        let df = b.cupA - phi; df = Math.atan2(Math.sin(df), Math.cos(df));
        if (Math.abs(df) < FUNNEL) {
          const acc = (90 + 110 * (1 - Math.abs(df) / FUNNEL)) * Math.sign(df);
          s.vx += -ny * acc * dt; s.vy += nx * acc * dt;
        }
      }
    }
    if (b.cupA != null) {
      const cx = b.x + Math.cos(b.cupA) * b.r, cy = b.y + Math.sin(b.cupA) * b.r;
      if (Math.hypot(s.x - cx, s.y - cy) < BR + 7.5) {
        const sp = Math.hypot(s.vx - b.vx, s.vy - b.vy);
        if (sp < (b.t === 'ice' ? 95 : SINKV)) { s.cupX = cx; s.cupY = cy; return 'sink'; }
        if (s.lipCd <= 0) {
          s.lipCd = 0.35;
          const nx = Math.cos(b.cupA), ny = Math.sin(b.cupA);
          s.vx += nx * 70; s.vy += ny * 70;
          if (ev) ev.push({ k: 'lip', x: cx, y: cy });
        }
      }
    }
  }
  if (h.portals && s.pCd <= 0) {
    for (let i = 0; i < 2; i++) {
      const p = h.portals[i], q = h.portals[1 - i];
      if (Math.hypot(s.x - p.x, s.y - p.y) < PORTAL_R) {
        const sp = Math.hypot(s.vx, s.vy) || 1;
        s.x = q.x + (s.vx / sp) * (PORTAL_R + 2); s.y = q.y + (s.vy / sp) * (PORTAL_R + 2);
        s.pCd = 0.6;
        if (ev) ev.push({ k: 'portal', x: p.x, y: p.y, x2: q.x, y2: q.y });
        break;
      }
    }
  }
  // fence at the edge of the course: bounces the ball back
  let wall = 0;
  if (s.x < BR) { s.x = BR; if (s.vx < 0) { wall = -s.vx; s.vx = -s.vx * WALL_E; s.vy *= 0.85; } }
  if (s.x > WW - BR) { s.x = WW - BR; if (s.vx > 0) { wall = s.vx; s.vx = -s.vx * WALL_E; s.vy *= 0.85; } }
  if (s.y < BR) { s.y = BR; if (s.vy < 0) { wall = -s.vy; s.vy = -s.vy * WALL_E; s.vx *= 0.85; } }
  if (s.y > WH - BR) { s.y = WH - BR; if (s.vy > 0) { wall = s.vy; s.vy = -s.vy * WALL_E; s.vx *= 0.85; } }
  if (wall > 30 && ev) ev.push({ k: 'wall', imp: wall, x: s.x, y: s.y });
  return null;
}
const DT = 1 / 120, TIME_SCALE = 1.3;
const MINV = 22, MAXV = 520;
function launchState(h, ball, ang, pow, t) {
  const v = MINV + Math.pow(pow, 1.25) * (MAXV - MINV);
  let bvx = 0, bvy = 0;
  if (ball.on) { placeBodies(h, t); bvx = ball.on.vx; bvy = ball.on.vy; }
  return { x: ball.x, y: ball.y, vx: Math.cos(ang) * v + bvx, vy: Math.sin(ang) * v + bvy, t, lipCd: 0, pCd: 0, contact: null };
}

// ---------- audio ----------
let hum = null;
function initAudio() {
  try {
    if (window.ZZFX && ZZFX.audioContext) {
      ZZFX.audioContext.resume && ZZFX.audioContext.resume();
      ZZFX.volume = 0.32;
      if (!hum) {
        const ac = ZZFX.audioContext;
        const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
        o.type = 'sine'; o2.type = 'triangle'; f.type = 'lowpass'; f.frequency.value = 700;
        o.connect(f); o2.connect(f); f.connect(g); g.connect(ac.destination); g.gain.value = 0;
        o.frequency.value = 120; o2.frequency.value = 180; o.start(); o2.start();
        hum = { o, o2, g, ac };
      }
    }
  } catch (e) {}
}
function setHum(speed, on) {
  if (!hum) return;
  try {
    const t = hum.ac.currentTime;
    hum.g.gain.setTargetAtTime(on ? Math.min(0.045, 0.01 + speed / 14000) : 0, t, 0.06);
    const f = 90 + speed * 0.75;
    hum.o.frequency.setTargetAtTime(f, t, 0.05); hum.o2.frequency.setTargetAtTime(f * 1.5, t, 0.05);
  } catch (e) {}
}
const sfx = (arr) => { try { if (window.zzfx) zzfx(...arr); } catch (e) {} };
const SND = {
  shot: (p) => { sfx([0.7, 0.03, 240 + p * 80, 0, 0.01, 0.07, 1, 1.6, -3, , , , , , , , , 0.6, 0.02]); sfx([0.25 + p * 0.3, 0.1, 500, 0.03, 0.05, 0.2, 4, , -6, , , , , 2.5]); },
  hit: (imp) => sfx([Math.min(0.7, imp / 400), 0.1, 85 + Math.random() * 20, 0, 0.01, 0.09, 0, 1.8, -2, , , , , 1.2]),
  cup: () => { sfx([0.6, 0, 1046, 0, 0.03, 0.35, 0, 1, , , 523, 0.06]); },
  wall: (imp) => sfx([Math.min(0.5, imp / 600), 0.05, 320, 0, 0.01, 0.06, 2, 1, , , , , , , , , , 0.4]),
  lip: () => sfx([0.5, 0, 1600, 0, 0.01, 0.06, 2, , , , , , , , , , , 0.5]),
  lost: () => sfx([0.5, 0, 420, 0.02, 0.2, 0.55, 0, 1, -7, , , , , , , , , 0.8]),
  portal: () => sfx([0.4, 0, 300, 0.04, 0.1, 0.3, 0, 1, 9, , , , , , 4]),
  aim: () => sfx([0.12, 0, 900, 0, 0.005, 0.02, 0, 1]),
  fan: (n) => { const notes = [523, 659, 784, 1046, 1318]; for (let i = 0; i < n; i++) setTimeout(() => sfx([0.35, 0, notes[i], 0.01, 0.06, 0.25, 0, 1, , , , , , , , , , 0.7]), i * 110); },
};

// ---------- game state ----------
let state = 'title';
let holeIdx = 0, strokes = 0, cards = [], holeT = 0, shotT = 0, restT = 0;
let ball = { x: 0, y: 0, on: null, ang: 0 };
let fly = null, lastRest = null;
let trail = [], parts = [], rings = [], msg = null, banner = 0, hintT = 0, overT = 0, sinkAnim = 0;
let aim = null; // {sx,sy,x,y,ang,pow}
let resultText = '', resultDiff = 0, newBest = false, roundTotal = 0;

function restBallOn(b, ang) { ball.on = b; ball.ang = ang; syncBall(); }
function syncBall() { if (ball.on) { const b = ball.on; ball.x = b.x + Math.cos(ball.ang) * (b.r + BR); ball.y = b.y + Math.sin(ball.ang) * (b.r + BR); } }
function startHole(i) {
  holeIdx = i; hole = buildHole(i); strokes = 0; holeT = 0; trail = []; parts = []; rings = []; fly = null; aim = null;
  placeBodies(hole, 0);
  restBallOn(hole.tee, hole.tang);
  lastRest = { on: ball.on, ang: ball.ang, x: ball.x, y: ball.y };
  banner = 2.2; state = 'aim';
}
function startRound() {
  cards = []; startHole(0); hintT = 4; signal('start');
}
function parDiffStr(d) { return d === 0 ? 'E' : (d > 0 ? '+' + d : '' + d); }
function totalDiff() { let d = 0; for (const c of cards) d += c.s - c.p; return d; }

function shoot() {
  if (!aim || aim.pow <= 0) return;
  fly = launchState(hole, ball, aim.ang, aim.pow, holeT);
  SND.shot(aim.pow);
  strokes++; shotT = 0; restT = 0; trail = [];
  lastRest = { on: ball.on, ang: ball.ang, x: ball.x, y: ball.y, t: holeT };
  ball.on = null; aim = null; state = 'fly';
}
function finishHole(sunk) {
  const s = sunk ? strokes : hole.par + 4;
  cards.push({ p: hole.par, s, give: !sunk });
  const d = s - hole.par;
  resultDiff = d;
  resultText = !sunk ? T.giveup : (s === 1 ? T.res.ace : (T.res[String(d)] || ('+' + d)));
  if (sunk) { const n = (d <= -2 || s === 1) ? 5 : d === -1 ? 4 : d === 0 ? 3 : 0; if (n) setTimeout(() => SND.fan(n), 250); }
  state = 'holeEnd'; overT = 0;
}
function endRound() {
  let tot = 0; for (const c of cards) tot += c.s;
  roundTotal = tot;
  newBest = save.best == null || tot < save.best;
  if (newBest) save.best = tot;
  writeSave();
  signal('end', { score: tot });
  state = 'roundEnd'; overT = 0;
}
function penalty(kind) {
  strokes++;
  msg = { text: kind === 'ob' ? T.ob : T.lost, t: 1.6, bad: true };
  SND.lost();
  ball.on = lastRest.on; ball.ang = lastRest.ang; ball.x = lastRest.x; ball.y = lastRest.y;
  syncBall(); fly = null; trail = [];

    ctx.beginPath(); ctx.arc(CW - 70 - (lim - 1 - i) * 9, 40, 2.6, 0, 7); ctx.fill();
  }
}
function drawBanner() {
  setScreen();
  if (banner > 0 && state === 'aim') {
    const a = Math.min(1, banner * 2, (2.2 - banner) * 4);
    ctx.globalAlpha = Math.max(0, a);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.font = `600 14px ${FONT}`; ctx.fillStyle = 'rgba(200,210,255,0.9)';
    ctx.fillText(`${T.hole} ${holeIdx + 1} · ${T.par} ${hole.par}`, CW / 2, OY + WH * S * 0.5 - 14);
    const sz = fitText(T.names[holeIdx], CW - 40, 28, '800');
    ctx.fillStyle = '#fff'; ctx.fillText(T.names[holeIdx], CW / 2, OY + WH * S * 0.5 + 18);
    ctx.globalAlpha = 1;
  }
  if (hintT > 0 && state === 'aim' && holeIdx === 0) {
    ctx.globalAlpha = Math.min(1, hintT);
    ctx.textAlign = 'center'; fitText(T.hint, CW - 30, 15, '600');
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, CH - 52, CW, 34);
    ctx.fillStyle = '#fff'; ctx.fillText(T.hint, CW / 2, CH - 30);
    ctx.globalAlpha = 1;
  }
  if (msg) {
    ctx.globalAlpha = Math.min(1, msg.t * 2);
    ctx.textAlign = 'center'; fitText(msg.text, CW - 30, 20, '800');
    ctx.fillStyle = msg.bad ? '#ff9a7a' : '#fff';
    ctx.fillText(msg.text, CW / 2, HUD + 34);
    ctx.globalAlpha = 1;
  }
}
function panel(y0, h) {
  ctx.fillStyle = 'rgba(8,10,30,0.82)';
  const x = 16, w = CW - 32;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y0, w, h, 16) : ctx.rect(x, y0, w, h); ctx.fill();
  ctx.strokeStyle = 'rgba(160,180,255,0.35)'; ctx.lineWidth = 1; ctx.stroke();
}
function drawHoleEnd() {
  setScreen();
  const k = Math.min(1, overT * 4);
  ctx.globalAlpha = k;
  const cy = CH * 0.42;
  panel(cy - 90, 190);
  ctx.textAlign = 'center';
  const good = resultDiff < 0 || (cards[cards.length - 1]?.s === 1);
  const sz = fitText(resultText, CW - 60, 36, '900');
  ctx.fillStyle = good ? '#fff08a' : resultDiff === 0 ? '#ffffff' : '#ffc0a0';
  ctx.fillText(resultText, CW / 2, cy - 30);
  ctx.font = `700 17px ${FONT}`; ctx.fillStyle = '#dfe6ff';
  const c = cards[cards.length - 1];
  ctx.fillText(`${T.hole} ${holeIdx + 1}: ${c.s}${LANG === 'ja' ? '打' : ' shots'} (${T.par}${c.p})`, CW / 2, cy + 6);
  ctx.font = `600 15px ${FONT}`; ctx.fillStyle = 'rgba(200,210,255,0.85)';
  ctx.fillText(`${T.total} ${parDiffStr(totalDiff())}`, CW / 2, cy + 34);
  if (overT > 0.7) { ctx.font = `700 16px ${FONT}`; ctx.fillStyle = '#fff'; ctx.globalAlpha = k * (0.6 + 0.4 * Math.sin(gtime * 4)); ctx.fillText(holeIdx + 1 < HOLES.length ? T.next : T.next, CW / 2, cy + 76); }
  ctx.globalAlpha = 1;
}
function drawRoundEnd() {
  setScreen();
  ctx.fillStyle = 'rgba(3,4,12,0.6)'; ctx.fillRect(0, 0, CW, CH);
  const cy = CH * 0.44;
  panel(cy - 150, 300);
  ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(200,210,255,0.9)'; ctx.font = `700 15px ${FONT}`;
  ctx.fillText(T.roundEnd, CW / 2, cy - 118);
  const d = totalDiff();
  ctx.fillStyle = '#fff'; ctx.font = `900 46px ${FONT}`;
  ctx.fillText(`${roundTotal}`, CW / 2, cy - 66);
  ctx.font = `800 20px ${FONT}`; ctx.fillStyle = d < 0 ? '#9ff0a0' : d > 0 ? '#ffb38a' : '#fff';
  ctx.fillText(`(${parDiffStr(d)})`, CW / 2, cy - 38);
  ctx.font = `700 15px ${FONT}`;
  if (newBest) { ctx.fillStyle = '#fff08a'; ctx.fillText(T.newBest, CW / 2, cy - 12); }
  else { ctx.fillStyle = 'rgba(220,230,255,0.85)'; ctx.fillText(`${T.best} ${save.best}`, CW / 2, cy - 12); }
  // scorecard
  const w = Math.min(CW - 50, 320), cw = w / 9, x0 = (CW - w) / 2, y0 = cy + 6;
  for (let i = 0; i < 9; i++) {
    const c = cards[i]; const x = x0 + i * cw + cw / 2;
    ctx.fillStyle = 'rgba(200,210,255,0.6)'; ctx.font = `600 12px ${FONT}`; ctx.fillText(String(i + 1), x, y0 + 14);
    ctx.fillText(String(HOLES[i].par), x, y0 + 32);
    if (c) {
      const dd = c.s - c.p;
      ctx.fillStyle = c.give ? '#ff8a8a' : dd < 0 ? '#9ff0a0' : dd > 0 ? '#ffb38a' : '#fff';
      ctx.font = `800 16px ${FONT}`; ctx.fillText(String(c.s), x, y0 + 56);
      if (dd < 0) { ctx.strokeStyle = '#9ff0a0'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(x, y0 + 50, 10, 0, 7); ctx.stroke(); }
    }
  }
  ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(200,210,255,0.6)'; ctx.font = `600 12px ${FONT}`;
  if (overT > 0.7) {
    ctx.textAlign = 'center'; ctx.font = `700 17px ${FONT}`; ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(gtime * 4); ctx.fillText(T.again, CW / 2, cy + 120); ctx.globalAlpha = 1;
  }
}
function drawTitle() {
  drawBg();
  setScreen();
  // demo orbit
  const cx = CW / 2, cy = CH * 0.6, pr = Math.min(CW, CH) * 0.12;
  const demo = { x: cx, y: cy, r: pr, t: 'grass', seed: 3 };
  ctx.save(); ctx.translate(0, 0);
  drawPlanet(demo);
  ctx.restore();
  const or = pr * 2.1, a = gtime * 1.3;
  for (let i = 0; i < 24; i++) {
    const aa = a - i * 0.05;
    ctx.fillStyle = `rgba(150,210,255,${0.5 * (1 - i / 24)})`;
    ctx.beginPath(); ctx.arc(cx + Math.cos(aa) * or, cy + Math.sin(aa) * or * 0.55, 4 * (1 - i / 24) + 1, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * or, cy + Math.sin(a) * or * 0.55, 5, 0, 7); ctx.fill();
  ctx.textAlign = 'center';
  fitText(T.title, CW - 30, 38, '900');
  ctx.fillStyle = '#fff'; ctx.fillText(T.title, CW / 2, CH * 0.2);
  ctx.fillStyle = 'rgba(210,220,255,0.92)';
  for (const [i, s] of [T.how1, T.how2, T.how3].entries()) { fitText(s, CW - 40, 16, '600'); ctx.fillStyle = 'rgba(210,220,255,0.92)'; ctx.fillText(s, CW / 2, CH * 0.2 + 42 + i * 26); }
  if (save.best != null) { ctx.font = `700 15px ${FONT}`; ctx.fillStyle = '#fff08a'; ctx.fillText(`${T.best} ${save.best}`, CW / 2, CH * 0.2 + 130); }
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(gtime * 4);
  ctx.font = `800 20px ${FONT}`; ctx.fillStyle = '#fff'; ctx.fillText(T.start, CW / 2, CH * 0.86);
  ctx.globalAlpha = 1;
}
function draw() {
  if (state === 'title') { drawTitle(); return; }
  drawBg();
  drawGrid(hole);
  setWorld();
  drawPortals(hole);
  for (const b of hole.bodies) drawPlanet(b);
  drawAim();
  drawBall();
  drawFx();
  drawHud();
  drawBanner();
  if (state === 'holeEnd') drawHoleEnd();
  if (state === 'roundEnd') drawRoundEnd();
}
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016);
  last = ts; gtime += dt;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

</script>
