// 地形の多角形を作る
function cliffL(depth, wallX, wallTop) {
  if (wallX === undefined) return [[-40, 0], [0, 0], [0, -depth], [-40, -depth]];
  return [[-40, wallTop], [wallX, wallTop], [wallX, 0], [0, 0], [0, -depth], [-40, -depth]];
}
function cliffR(W, depth, wallX, wallTop) {

  return [[W, 0], [wallX, 0], [wallX, wallTop], [W + 40, wallTop], [W + 40, -depth], [W, -depth]];

function pillar(x, top, bottom) { return [[x - 0.7, top], [x + 0.7, top], [x + 1.5, bottom], [x - 1.5, bottom]]; }
const LEVELS = [

// 組んだ橋（design = 置いた部材の両端座標の一覧）から、つなぎ目と部材の一覧を作る
function buildGraph(L, design) {
  const J = [], B = [], key = new Map();
  const add = (x, y, kind) => { const k = x + ',' + y; if (key.has(k)) return key.get(k); J.push({ x, y, kind }); key.set(k, J.length - 1); return J.length - 1; };
  add(0, 0, 'anchor'); add(L.W, 0, 'anchor');
  for (const a of L.anchors) add(a[0], a[1], 'anchor');
  const seg = L.W / L.n; const deck = [];
  for (let k = 1; k < L.n; k++) add(k * seg, 0, 'deck');
  for (let k = 0; k < L.n; k++) {
    const a = key.get((k * seg) + ',0'), b = key.get(((k + 1) * seg) + ',0');
    B.push({ a, b, m: 'road', deck: k }); deck.push(B.length - 1);
  }
  for (const d of design) {
    const a = add(d[0], d[1], 'user'), b = add(d[2], d[3], 'user');
    B.push({ a, b, m: d[4], deck: -1, d });
  }
  return { J, B, deck, key };
}
function makeSim(L, design) {
  const g = buildGraph(L, design);
  const N = g.J.map((j) => ({ x: j.x, y: j.y, px: j.x, py: j.y, vx: 0, vy: 0, m: 0.6, fix: j.kind === 'anchor', fx: 0, fy: 0 }));
  const E = g.B.map((b) => {
    const A = N[b.a], C = N[b.b], r = Math.hypot(C.x - A.x, C.y - A.y), M = MAT[b.m];
    A.m += M.rho * r / 2; C.m += M.rho * r / 2;
    return { a: b.a, b: b.b, m: b.m, r, EA: M.EA, F: M.F, st: 0, load: 0, peak: 0, broken: false, deck: b.deck, d: b.d };
  });
  return { N, E, deck: g.deck, t: 0, breaks: [], L };
}
function stepSim(S, dt, sub) {
  const h = dt / sub, damp = Math.exp(-1.2 * h);
  for (let k = 0; k < sub; k++) {
    const g = G * Math.min(1, 0.2 + S.t / 0.8);
    for (const n of S.N) {
      if (n.fix) continue;
      n.vx += n.fx / n.m * h; n.vy += (n.fy / n.m - g) * h;
      n.px = n.x; n.py = n.y; n.x += n.vx * h; n.y += n.vy * h;
    }
    for (const e of S.E) {
      if (e.broken) continue;
      const A = S.N[e.a], C = S.N[e.b];
      const wA = A.fix ? 0 : 1 / A.m, wC = C.fix ? 0 : 1 / C.m, w = wA + wC;
      if (!w) continue;
      const dx = C.x - A.x, dy = C.y - A.y, len = Math.hypot(dx, dy) || 1e-9;
      const dl = -(len - e.r) / (w + e.r / e.EA / (h * h));
      const nx = dx / len * dl, ny = dy / len * dl;
      A.x -= nx * wA; A.y -= ny * wA; C.x += nx * wC; C.y += ny * wC;
    }
    for (const n of S.N) {
      if (n.fix) continue;
      n.vx = (n.x - n.px) / h * damp; n.vy = (n.y - n.py) / h * damp;
    }
    // 部材ごとの減衰（伸び縮みの振動だけを止める）
    for (const e of S.E) {
      if (e.broken) continue;
      const A = S.N[e.a], C = S.N[e.b];
      const wA = A.fix ? 0 : 1 / A.m, wC = C.fix ? 0 : 1 / C.m, w = wA + wC;
      if (!w) continue;
      const dx = C.x - A.x, dy = C.y - A.y, len = Math.hypot(dx, dy) || 1e-9, nx = dx / len, ny = dy / len;
      const rv = (C.vx - A.vx) * nx + (C.vy - A.vy) * ny, imp = rv * BEAM_DAMP / w;
      A.vx += nx * imp * wA; A.vy += ny * imp * wA; C.vx -= nx * imp * wC; C.vy -= ny * imp * wC;
    }
    S.t += h;
  }
  let maxLoad = 0;
  for (const e of S.E) {
    if (e.broken) continue;
    const A = S.N[e.a], C = S.N[e.b];
    e.st = (Math.hypot(C.x - A.x, C.y - A.y) - e.r) / e.r;
    e.load = Math.abs(e.st) * e.EA / e.F;
    if (e.load > e.peak) e.peak = e.load;
    if (e.load > maxLoad) maxLoad = e.load;
    if (e.load > 1) { e.broken = true; S.breaks.push(e); }
  }
  S.maxLoad = maxLoad;
}
// 車：前輪の位置 s（道板にそった長さ）で進む。重さは乗っている道板の両端のつなぎ目にかかる
function makeCar(L) { return { s: -1.2, v: 0, state: 'drive', x: -1.2, y: 0, ang: 0, vx: 0, vy: 0, va: 0, t: 0, wheel: 0 }; }
function carPoint(S, s) {
  const L = S.L, seg = L.W / L.n;
  if (s <= 0) return { ok: true, x: s, y: 0 };
  if (s >= L.W) return { ok: true, x: s, y: 0 };
  const k = Math.min(L.n - 1, Math.floor(s / seg)), t = s / seg - k, e = S.E[S.deck[k]];
  if (e.broken) return { ok: false };
  const A = S.N[e.a], C = S.N[e.b];
  return { ok: true, x: A.x + (C.x - A.x) * t, y: A.y + (C.y - A.y) * t, A, C, t };
}
function stepCar(S, car, dt) {
  const L = S.L, V = L.veh;
  for (const n of S.N) { n.fx = 0; n.fy = 0; }
  car.t += dt;
  if (car.state === 'drive') {
    const f = carPoint(S, car.s), r = carPoint(S, car.s - V.wb);
    if (!f.ok || !r.ok) {
      car.state = 'fall'; car.vx = car.v * Math.cos(car.ang); car.vy = car.v * Math.sin(car.ang) - 0.5; car.va = f.ok ? 1.2 : -1.6;
      return;
    }
    const ramp = Math.min(1, car.t / 0.4);
    for (const p of [f, r]) if (p.A) {
      const F = V.mass * G * 0.5 * ramp;
      p.A.fy -= F * (1 - p.t); p.C.fy -= F * p.t;

    car.ang = Math.atan2(f.y - r.y, f.x - r.x);

    if (car.v < 0.35) car.v = 0.35;
    car.s += car.v * dt; car.wheel += car.v * dt;
    if (car.s - V.wb > L.W + 0.6) { car.state = 'done'; car.arrived = true; }
  } else if (car.state === 'fall') {
    car.vy -= G * dt; car.x += car.vx * dt; car.y += car.vy * dt; car.ang += car.va * dt;
    if (car.y < L.water + 0.3) { car.state = 'sunk'; }
  } else if (car.state === 'done') {
    car.v = Math.max(0, car.v - 2 * dt); car.s += car.v * dt; car.x = car.s - V.wb / 2; car.y = 0; car.ang = 0; car.wheel += car.v * dt;
  }
}
function designCost(design) {
  let c = 0;
  for (const d of design) c += Math.hypot(d[2] - d[0], d[3] - d[1]) * MAT[d[4]].cost;
  return Math.round(c / 10) * 10;
}

const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';

function fitText(txt, px, maxW, w = 700) {

function layoutView() {

}

// ===== 音 =====
let AC = null, master = null, river = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
      // 川のせせらぎ（とても小さく）
      const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), ch = buf.getChannelData(0);
      for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
      const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      const lp = AC.createBiquadFilter(); lp.type = 'bandpass'; lp.frequency.value = 700; lp.Q.value = 0.6;
      river = AC.createGain(); river.gain.value = 0.018;
      src.connect(lp); lp.connect(river); river.connect(master); src.start();
    } catch (e) { AC = null; }
  }

}
let noiseBuf = null;
function noise(dur, f, q, gain, type = 'bandpass', when = 0) {

    const t = AC.currentTime + when, s = AC.createBufferSource(); s.buffer = noiseBuf;

    const g = AC.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0005, t + dur);

  } catch (e) {}
}
function tone(f, dur, gain, type = 'sine', when = 0, f2 = 0) {
  if (!AC) return;
  try {
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(gain, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0005, t + dur);

}
const sKnock = (m) => { if (m === 'steel') { tone(880, 0.25, 0.08, 'triangle'); tone(1320, 0.18, 0.04, 'sine'); noise(0.03, 3000, 2, 0.08); } else { tone(210, 0.09, 0.22, 'sine', 0, 140); noise(0.035, 1400, 3, 0.2); } };

const sCreak = (v) => { noise(0.05 + Math.random() * 0.05, 300 + Math.random() * 500, 8, 0.05 + 0.1 * v); };

let engine = null;
function engineOn(kind) {

  } else { stars.p0 = stars.p1 = stars.p2 = 0; }
  for (const c of confetti) { cx.save(); cx.translate(c.x, c.y); cx.rotate(c.a); cx.fillStyle = c.c; cx.fillRect(-4, -2.5, 8, 5); cx.restore(); }
  if (mode === 'all') {
    panel(CH * 0.25, 210);
    const tot = save.st.reduce((a, b) => a + (b || 0), 0);
    centerText(T.all, CH * 0.25 + 44, 22, '#fff');
    centerText(`★ ${tot} / ${LEVELS.length * 3}`, CH * 0.25 + 96, 32, '#ffd23f');
    centerText(T.allSub, CH * 0.25 + 144, 14, '#ffe7b0', 600);
    if (modeT > 0.7) centerText(T.again, CH * 0.25 + 182, 15, '#fff', 600);
  }
}
function frame(ts) {
  const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016); last = ts;
  try { update(dt); draw(ts / 1000); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
resize();
setLevel(0, false);
requestAnimationFrame(frame);
</script>
