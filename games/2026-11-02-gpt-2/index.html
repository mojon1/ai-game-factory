const en=(new URLSearchParams(location.search).get('lang')||navigator.language).startsWith('en'),T=(a,b)=>en?b:a,$=s=>document.querySelector(s),c=$('#c'),g=c.getContext('2d'),ov=$('#ov'),msg=$('#msg'),order=$('#order'),list=$('#list'),hud=$('#hud'),hint=$('#hint'),next=$('#next'),retry=$('#retry');document.documentElement.lang=en?'en':'ja';for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});
const signal=(agf,data={})=>{try{parent.postMessage({agf,...data},'*')}catch{}};let audio;function tone(f){try{audio||=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),v=audio.createGain();o.type='triangle';o.frequency.value=f;v.gain.setValueAtTime(.045,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+.21)}catch{}}
const shapes=[[[0,-1.05],[.72,-.78],[1.05,-.1],[.68,.83],[-.12,1.02],[-.93,.54],[-.96,-.5]],[[-.95,-.8],[.55,-1.04],[1.02,-.4],[.82,.8],[-.48,1.05],[-1.08,.15]],[[-.52,-1.02],[.62,-.98],[1.02,-.2],[.66,.92],[-.74,.75],[-1.03,-.3]]],recipes=[[25,25,25,25],[20,30,15,35],[10,20,30,40]];
let W=360,H=640,cx=180,cy=320,R=130,state='title',stage=0,customer=0,total=0,best=0,poly=[],whole=1,drag=null,tip=null,pid=null,served=null,locked=false,until=0,last=null,results=[],pending=false,snapshot=null;
const area=p=>Math.abs(p.reduce((a,v,i)=>{const n=p[(i+1)%p.length];return a+v[0]*n[1]-v[1]*n[0]},0))/2;
function clip(p,a,b,sign){const out=[],side=v=>((b[0]-a[0])*(v[1]-a[1])-(b[1]-a[1])*(v[0]-a[0]))*sign;for(let i=0;i<p.length;i++){const v=p[i],u=p[(i+1)%p.length],d=side(v),e=side(u);if(d>=-1e-8)out.push(v);if((d>0&&e<0)||(d<0&&e>0)){const f=d/(d-e);out.push([v[0]+(u[0]-v[0])*f,v[1]+(u[1]-v[1])*f])}}return out}
function spans(p,a,b){const vx=b[0]-a[0],vy=b[1]-a[1],len=vx*vx+vy*vy;if(len<.04)return false;const hits=[];for(let i=0;i<p.length;i++){const v=p[i],u=p[(i+1)%p.length],d=vx*(v[1]-a[1])-vy*(v[0]-a[0]),e=vx*(u[1]-a[1])-vy*(u[0]-a[0]);if(d*e<=0&&Math.abs(d-e)>1e-9){const f=d/(d-e),x=v[0]+(u[0]-v[0])*f,y=v[1]+(u[1]-v[1])*f;hits.push(((x-a[0])*vx+(y-a[1])*vy)/len)}}return hits.length>=2&&Math.min(...hits)>=-.02&&Math.max(...hits)<=1.02}function path(p,dx=0,dy=0){g.beginPath();p.forEach((v,i)=>g[i?'lineTo':'moveTo'](cx+v[0]*R+dx,cy+v[1]*R+dy));g.closePath()}
function cake(p,dx=0,alpha=1){g.save();g.globalAlpha=alpha;path(p,dx,12);g.fillStyle='#815842';g.fill();path(p,dx,6);g.fillStyle='#f4d6aa';g.fill();path(p,dx);g.fillStyle=['#edb3b2','#b9d0b1','#eac283'][stage];g.fill();g.strokeStyle='#fff1d8';g.lineWidth=3;g.stroke();g.save();path(p,dx);g.clip();for(let y=-1;y<1.2;y+=.45)for(let x=-1.1;x<1.2;x+=.45){g.fillStyle='#fff5d6';g.beginPath();g.arc(cx+x*R+dx,cy+y*R,5,0,7);g.fill();g.fillStyle='#b45e68';g.beginPath();g.arc(cx+(x+.1)*R+dx,cy+(y+.1)*R,3,0,7);g.fill()}g.restore();g.restore()}
function draw(){g.fillStyle='#303449';g.fillRect(0,0,W,H);g.fillStyle='#ded2bf';g.beginPath();g.ellipse(cx,cy+10,R*1.25,R*1.25,0,0,7);g.fill();g.strokeStyle='#b9ad9d';g.lineWidth=2;g.beginPath();g.ellipse(cx,cy+10,R*1.16,R*1.16,0,0,7);g.stroke();g.save();g.setLineDash([5,5]);g.strokeStyle='#9d8c8a';path(shapes[stage]);g.stroke();g.restore();if(poly.length)cake(poly);if(served)cake(served.p,served.x,served.alpha);if(drag&&tip){const p=clip(poly,drag,tip,1),q=clip(poly,drag,tip,-1),target=recipes[stage][customer];if(spans(poly,drag,tip)&&area(p)>whole*.01&&area(q)>whole*.01){const take=Math.abs(area(p)/whole*100-target)<=Math.abs(area(q)/whole*100-target)?p:q;path(take);g.fillStyle='#fff5b955';g.fill()}g.strokeStyle='#fffbe7';g.setLineDash([7,5]);g.lineWidth=3;g.beginPath();g.moveTo(cx+drag[0]*R,cy+drag[1]*R);g.lineTo(cx+tip[0]*R,cy+tip[1]*R);g.stroke();g.setLineDash([])}}
function resize(){W=$('#app').clientWidth||360;H=$('#app').clientHeight||640;cx=W/2;cy=H*.49;R=Math.min(W*.34,H*.21);const d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',resize);
function update(){hud.innerHTML=`<span>${T('得点','Score')} ${total}</span><span>${stage+1}/3　${T('ベスト','Best')} ${best}</span>`;order.textContent=T('注文','Order')+` ${recipes[stage][customer]}%`;list.textContent=recipes[stage].map((n,i)=>(i<customer?'✓ ':i===customer?'▶ ':'')+n+'%').join('　');}

function start(){state='play';stage=0;total=0;ov.style.display='none';signal('start');loadCake()}

function summary(){state=stage===2?'end':'stage';until=performance.now()+700;next.style.display='none';hint.textContent='';if(state==='end'){if(total>best){best=total;signal('save',{data:{best}})}signal('end',{score:total})}ov.style.display='flex';ov.innerHTML=`<div><h1>${T(stage===2?'三台、お届け！':'切り分けできた！',stage===2?'Three cakes delivered!':'Cake delivered!')}</h1><div class="big">${total}</div><p>${results.map(r=>`${r.target}% → ${r.actual}% · ${r.points}${T('点',' pts')}`).join('<br>')}</p><p>${T('ベスト','Best')} ${best}</p><p>${T(stage===2?'タップでもう一度':'タップで次のケーキ',stage===2?'Tap to play again':'Tap for the next cake')}</p></div>`;tone(700)}
function cut(a,b){if(locked||pending||state!=='play')return;const p=clip(poly,a,b,1),q=clip(poly,a,b,-1);if(!spans(poly,a,b)||area(p)<whole*.01||area(q)<whole*.01){msg.textContent=T('両端まで横切る線で切ろう','Cut across the whole piece');tone(120);draw();return}snapshot={poly:poly.map(v=>[...v]),total,results:results.map(r=>({...r}))};const target=recipes[stage][customer],dp=Math.abs(area(p)/whole*100-target),dq=Math.abs(area(q)/whole*100-target),take=dp<=dq?p:q;poly=dp<=dq?q:p;const r=award(take,target);msg.textContent=`${target}% → ${r.actual.toFixed(1)}% · ${r.points}${T('点',' pts')} / ${T(Math.abs(r.actual-target)<=2?'いい見当！':'少しずつ近づけよう',Math.abs(r.actual-target)<=2?'Nice estimate!':'Try a little closer')}`;update();locked=true;served={p:take,x:0,alpha:1};tone(r.points>=85?750:330);anime.animate(served,{x:W*.9,alpha:0,duration:650,ease:'inOutQuad',onUpdate:draw,onComplete:()=>{served=null;locked=false;pending=true;next.textContent=T('確認して次へ','Continue');next.style.display=retry.style.display='block';retry.textContent=T('切り直す','Retry slice');hint.textContent='';draw()}});}

addEventListener('pointerdown',e=>{e.preventDefault();tone(210);if(state==='title'){start();return}if(state==='stage'||state==='end'){if(performance.now()<until)return;if(state==='end')start();else{stage++;state='play';ov.style.display='none';loadCake()}return}if(pending){if(e.target===retry&&snapshot){poly=snapshot.poly;total=snapshot.total;results=snapshot.results;pending=false;last=null;next.style.display=retry.style.display='none';msg.textContent=T('もう一度、同じ注文を切ろう','Try the same order again');update();draw();return}if(e.target===next){pending=false;next.style.display=retry.style.display='none';customer++;if(customer===3){award(poly,recipes[stage][3]);summary()}else{update();msg.textContent=T('元のケーキの輪郭を目安に切ろう','Use the original outline to judge area');draw()}}return}if(locked||pid!==null)return;pid=e.pointerId;drag=pos(e);tip=drag;try{c.setPointerCapture(pid)}catch{}draw()},{passive:false});addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;e.preventDefault();tip=pos(e);draw()},{passive:false});addEventListener('pointerup',e=>{if(e.pointerId!==pid)return;const a=drag,b=pos(e);pid=null;drag=tip=null;if(a&&Math.hypot(a[0]-b[0],a[1]-b[1])>.2)cut(a,b);else draw()});addEventListener('pointercancel',e=>{if(e.pointerId===pid){pid=null;drag=tip=null;draw()}});
addEventListener('message',e=>{if(e.data?.agf==='loaded'){best=Math.max(best,Number(e.data.data?.best)||0);if(state==='play')update()}});signal('load');poly=shapes[0];ov.innerHTML=`<div><div class="big">◇</div><h1>${T('ひと切れケーキ便','A Slice to Order')}</h1><p>${T('注文は、元のケーキの何％？<br>指で線を引いて、近い方の一切れをお届け。','What percent of the original cake?<br>Draw a cut; the closer piece is served.')}</p><p>${T('タップでスタート','Tap to start')}</p></div>`;resize();
