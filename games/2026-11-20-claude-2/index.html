  { wind: [[0, 90, 1], [20, 0, 1]], base: .3, ember: .55, regen: 6.5, fires: [[7, 4]], houses: [[9, 57], [27, 58], [39, 20], [39, 41]], need: 2, tree: .66, seed: 37,

function randomStage() {

}

// ---------- state ----------
let state = 'title', stageI = 0, cur = null, houses = [], bl = [], embers = [], parts = [], streaks = [];

function houseIgnite(h) {

function tick(dt) {

// ---------- player actions ----------
let ptr = null, lastCutS = 0, lastBuzz = 0, lastTouch = 0;
function cutAt(fx, fy) {

    if (x < 0 || y < 0 || x >= GW || y >= GH) continue;
    if ((x + .5 - fx) ** 2 + (y + .5 - fy) ** 2 > 1.35) continue;
    const k = y * GW + x, t = type[k]; if ((t !== 1 && t !== 2) || burn[k] > 0) continue;

    if (x < 0 || y < 0 || x >= GW || y >= GH) continue; if ((x + .5 - fx) ** 2 + (y + .5 - fy) ** 2 > 1.7) continue;
    const k = y * GW + x; if ((type[k] === 1 || type[k] === 2) && burn[k] <= 0) list.push(k); }

function onDown(e) {

  drawField(dt, time);
  if (flash > 0) { ctx.fillStyle = `rgba(255,250,230,${flash * .7})`; ctx.fillRect(ox, oy, GW * cs, GH * cs); flash = Math.max(0, flash - dt * 2.2); }
  drawHUD(time);
  if (state === 'play') {
    if (hintT < 7) { const a = clamp(Math.min(hintT * 3, 7 - hintT), 0, 1), s = cur.rnd ? T.hintR : T.hints[stageI]; ctx.globalAlpha = a; setFont(15); const w = Math.min(W - 20, ctx.measureText(s).width + 28);
      ctx.fillStyle = 'rgba(20,16,12,.82)'; rr(W / 2 - w / 2, H - BOT - 50, w, 36, 18); ctx.fill(); text(s, W / 2, H - BOT - 32, 15, '#fff3d0', 'center', w - 20); ctx.globalAlpha = 1; }
    if (hintT < 4.5 && hintT > .3) { ctx.globalAlpha = clamp(4.5 - hintT, 0, 1); text(T.need(cur.need), W / 2, oy + 22, 15, '#fff', 'center', W - 30, 700, 'rgba(0,0,0,.7)'); ctx.globalAlpha = 1; }
    if (banner) { banner.t += dt; const a = clamp(1.5 - banner.t, 0, 1); if (a <= 0) banner = null; else { ctx.globalAlpha = a;
      if (banner.small) text(banner.text, clamp(ox + banner.x * cs, 60, W - 60), oy + banner.y * cs - 34 - banner.t * 14, 16, '#ffd24a', 'center', 200, 800, 'rgba(60,20,0,.85)');
      else text(banner.text, W / 2, oy + GH * cs * .3, 26, '#fff', 'center', W - 40, 800, 'rgba(0,0,0,.75)'); ctx.globalAlpha = 1; } }
  }
  if (state === 'title') {
    ctx.fillStyle = 'rgba(18,12,8,.72)'; ctx.fillRect(0, 0, W, H);
    const fy = H * .2, fl = 1 + .08 * Math.sin(time * 9); ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(flameSp, W / 2 - 70 * fl, fy - 80 * fl, 140 * fl, 150 * fl); ctx.drawImage(flameSp, W / 2 - 40, fy - 30 - 10 * fl, 80, 80); ctx.globalCompositeOperation = 'source-over';
    text(T.title, W / 2, H * .34, 40, '#fff3d0', 'center', W - 36, 800, '#5a1c00');
    T.how.forEach((s, i) => text(s, W / 2, H * .47 + i * 30, 16, '#f0e4cc', 'center', W - 30, 600));
    const u = Math.min(saveData.u, 99); if (u > 0) text(`${T.mt} ${u + 1}`, W / 2, H * .68, 18, '#ffd24a', 'center');
    ctx.globalAlpha = .6 + .4 * Math.sin(time * 4); text(T.tap, W / 2, H * .78, 22, '#fff', 'center', W - 40, 800); ctx.globalAlpha = 1;
  }
  if (state === 'result') {
    const R = result, a = clamp(resT * 3, 0, 1); ctx.fillStyle = `rgba(18,12,8,${a * .66})`; ctx.fillRect(0, TOP, W, H - TOP);
    ctx.globalAlpha = a; const cy = H * .36;
    text(R.win ? T.win : T.lose, W / 2, cy - 70, 34, R.win ? '#fff3d0' : '#ffb39a', 'center', W - 36, 800, R.win ? '#5a1c00' : '#3a0a00');
    const sh = Math.floor((resT - .4) / .3) + 1; if (R.win && sh > R.shown && R.shown < R.stars) { R.shown++; tone(880 * Math.pow(1.19, R.shown), .25, 'triangle', .14); }
    drawStars(W / 2, cy - 8, R.stars, R.shown, 40);
    text(`${T.houses}  ${R.saved}/${R.tot}`, W / 2, cy + 52, 22, '#fff', 'center', W - 40);
    text(`${T.green}  ${R.g}%`, W / 2, cy + 86, 18, '#bfe89a', 'center', W - 40, 600);
    if (R.win && stageI < STAGES.length) text(R.nb ? T.newbest : `${T.best}  ${Math.floor(R.best / 100)}/${R.tot} · ${R.best % 100}%`, W / 2, cy + 116, 15, R.nb ? '#ffd24a' : '#c9bca6', 'center', W - 40, 600);
    if (!R.win) text(T.need(cur.need), W / 2, cy + 116, 15, '#c9bca6', 'center', W - 40, 600);
    if (resT > .7) { ctx.globalAlpha = .6 + .4 * Math.sin(time * 4); text(R.win ? T.cont : T.again, W / 2, cy + 170, 21, '#fff', 'center', W - 40, 800); }
    ctx.globalAlpha = 1;
  }
  audioFrame();
}
addEventListener('message', (e) => { if (e.data && e.data.agf === 'loaded' && e.data.data && typeof e.data.data.u === 'number') { saveData = { u: e.data.data.u | 0, b: Array.isArray(e.data.data.b) ? e.data.data.b : [] }; if (state === 'title') build(Math.min(saveData.u, 99)); } });
resize(); build(0);
try { parent.postMessage({ agf: 'load' }, '*'); } catch (e) {}
requestAnimationFrame(frame);
</script>
