const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),T=LANG==='ja'?{title:'夜汽車の連席係',a:'客を選んで、連席の左端をタップ',b:'窓希望の客には端の席を含めよう',c:'一度予約した席は動かせない',start:'タップでスタート',sales:'売上',round:'回',people:'人',window:'窓',any:'自由席',next:'次の人数',last:'最後の予約',choose:'AかBの客を選ぼう',place:'席の左端をタップ',no:'そこには連席がない',need:'窓の席が必要',booked:'予約できた！',pass:'見送る',passed:'客を見送った',hint:'客を選ぶ → 席の左端',result:'夜汽車、出発！',seats:'席',again:'タップでもう一度',edge:'窓側'}:{title:'Night Train Seat Keeper',a:'Choose a party, then tap its leftmost seat',b:'Window parties need an edge seat',c:'Booked seats cannot move',start:'Tap to start',sales:'Revenue',round:'round',people:' guests',window:'Window',any:'Any seat',next:'Next sizes',last:'Final booking',choose:'Choose party A or B',place:'Tap the leftmost seat',no:'No contiguous seats there',need:'Needs a window seat',booked:'Booked!',pass:'Pass',passed:'Party passed',hint:'Choose party → leftmost seat',result:'All aboard!',seats:'seats',again:'Tap to play again',edge:'Window'};for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});const c=document.getElementById('c'),g=c.getContext('2d');let w,h,s,ox,oy,state='title',round=0,score=0,board=[],orders=[],selected=-1,msg='',age=0,delay=0,busy=0,audio;const colors=['#79bdb6','#daaf76','#bd94c7','#88a9d2','#d98d8b','#b7bf76','#91b7c9','#c1a891'];const letters=['A','B'];const signal=(agf,data={})=>parent.postMessage({agf,...data},'*');function resize(){w=innerWidth||360;h=innerHeight||640;const d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;s=Math.min(w/360,h/640);ox=(w-360*s)/2;oy=(h-640*s)/2;g.setTransform(d*s,0,0,d*s,ox*d,oy*d)}resize();addEventListener('resize',resize);function tone(f){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),v=audio.createGain();o.connect(v);v.connect(audio.destination);o.frequency.value=f;v.gain.setValueAtTime(.0
