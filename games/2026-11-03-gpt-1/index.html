<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ひとつ遅れのベル</title><style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#131f31;color:#fff1d4;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}#app{position:relative;width:100vw;height:100dvh;max-width:520px;margin:auto;background:radial-gradient(ellipse at 50% 38%,#314a59,#111d30 75%)}#hud{position:absolute;top:3%;left:5%;right:5%;display:flex;justify-content:space-between;font-size:16px;font-weight:700}#rule{position:absolute;top:13%;width:100%;text-align:center;font-size:17px}#bell{position:absolute;top:24%;left:24%;width:52%;aspect-ratio:1;border:5px double #bba478;border-radius:48% 48% 25% 25%;display:flex;align-items:center;justify-content:center;font-size:84px;background:#1b2937;box-shadow:0 12px 0 #081322,0 0 45px #dbb75e15}#lampname{position:absolute;top:57%;width:100%;text-align:center;color:#dbcaa9;font-size:16px}#bar{position:absolute;top:64%;left:10%;width:80%;height:8px;border-radius:9px;background:#d6aa61;transform-origin:left}#msg{position:absolute;top:68%;left:5%;width:90%;text-align:center;font-size:16px;min-height:22px}#buttons{position:absolute;bottom:12%;display:flex;width:100%;justify-content:space-evenly}button{width:27%;height:68px;border:2px solid #ae9f81;border-radius:17px;background:#263b4b;color:#fff1d4;font:700 18px system-ui;box-shadow:0 5px 0 #091623}#hint{position:absolute;bottom:4%;width:100%;text-align:center;font-size:13px;color:#bdbba9}#ov{position:absolute;inset:0;background:#111d30f5;display:flex;align-items:center;justify-content:center;text-align:center;padding:26px}h1{font-size:clamp(25px,7.4vw,36px);line-height:1.4}p{font-size:15px;line-height:1.8}.big{font-size:48px;color:#e4c17c}
</style><div id="app"><div id="hud"></div><div id="rule"></div><div id="bell"></div><div id="lampname"></div><div id="bar"></div><div id="msg"></div><div id="buttons"></div><div id="hint"></div><div id="ov"></div></div><script src="../../lib/anime-4.5.0.min.js"></script><script>
const en=(new URLSearchParams(location.search).get('lang')||navigator.language).startsWith('en'),T=(j,e)=>en?e:j,$=s=>document.querySelector(s),ov=$('#ov'),bell=$('#bell'),msg=$('#msg'),bar=$('#bar'),rule=$('#rule');document.documentElement.lang=en?'en':'ja';for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});const signal=(agf,data={})=>{try{parent.postMessage({agf,...data},'*')}catch{}};
const marks=['★','◆','●'],names=[T('星','Star'),T('ひし形','Diamond'),T('まる','Circle')],colors=['#f1cb74','#9adbcf','#eaa9be'];let audio;function tone(f){try{audio||=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),v=audio.createGain();o.frequency.value=f;v.gain.setValueAtTime(.045,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.22);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+.23)}catch{}}
let state='title',phase='',current=0,previous=0,round=0,score=0,best=0,hits=0,deadline=0,span=3000,until=0,startTime=0,sequence=[];$('#buttons').innerHTML=marks.map((s,i)=>`<button data-i="${i}" style="color:${colors[i]}">${s}<br><small>${names[i]}</small></button>`).join('');
function hud(){$('#hud').innerHTML=`<span>${T('得点','Score')} ${score}</span><span>${round}/12　${T('ベスト','Best')} ${best}</span>`}function show(){bell.textContent=marks[current];bell.style.color=colors[current];$('#lampname').textContent=T('いまの印：','Current: ')+names[current];anime.animate(bell,{rotate:[-9,9,0],duration:380,ease:'out(3)'})}
function next(){if(round===12){finish();return}previous=current;current=sequence[++round];span=round<=4?3200:round<=8?2700:2200;phase='answer';deadline=performance.now()+span;rule.textContent=T('一つ前を押す · ','Tap PREVIOUS · ')+(span/1000).toFixed(1)+T('秒','s');msg.textContent=round===5||round===9?T('ここから少し速くなる','A little faster now'):'';document.querySelectorAll('button').forEach(b=>b.style.borderColor='#ae9f81');show();hud()}
function start(){state='play';round=score=hits=0;sequence=Array.from({length:13},()=>Math.floor(Math.random()*3));current=sequence[0];phase='remember';startTime=performance.now();span=2200;deadline=startTime+2200;ov.style.display='none';rule.textContent=T('最初の印を覚えよう','Remember the first symbol');$('#hint').textContent=T('いまの印は覚える。押すのは一つ前','Remember this one. Tap the previous one.');msg.textContent='';show();hud();signal('start')}
function answer(i){if(state!=='play'||phase!=='answer')return;const correct=i===previous;if(correct){hits++;const gain=100+Math.round(Math.max(0,deadline-performance.now())/span*50);score+=gain;msg.textContent=T('正解！','Correct!')+' +'+gain;tone(660)}else{msg.textContent=i===-1?T('時間切れ','Time up'):T('ちがった','Miss');tone(150)}msg.textContent+=T(' ／ 正解：',' / Answer: ')+marks[previous];const b=document.querySelector(`[data-i="${i}"]`);if(b){b.style.borderColor=correct?'#f6db92':'#eaa9be';anime.animate(b,{translateY:[4,-3,0],duration:300})}phase='feedback';deadline=performance.now()+(correct?650:1100);hud()}
function finish(){state='end';until=performance.now()+700;const isNew=score>best;if(isNew){best=score;signal('save',{data:{best}})}signal('end',{score});bar.style.transform='scaleX(0)';ov.style.display='flex';ov.innerHTML=`<div><h1>${T('夜のベル、ひと休み','The bells rest')}</h1><div class="big">${score}</div><p>${hits}/12 ${T('正解','correct')}<br>${T('ベスト','Best')} ${best}${isNew?'<br>'+T('ベスト更新！','New best!'):''}</p><p>${T('タップでもう一度','Tap to play again')}</p></div>`;tone(880)}
addEventListener('pointerdown',e=>{e.preventDefault();if(state==='title'){tone(440);start();return}if(state==='end'){if(performance.now()>=until)start();return}const i=e.target.closest('button')?.dataset.i;if(i!==undefined){tone(260);answer(Number(i))}},{passive:false});
addEventListener('message',e=>{if(e.data?.agf==='loaded'){best=Math.max(best,Number(e.data.data?.best)||0);hud()}});signal('load');ov.innerHTML=`<div><div class="big">★ ◆ ●</div><h1>${T('ひとつ遅れのベル','One Bell Behind')}</h1><p>${T('いま光った印は覚える。<br>一つ前に光った印のボタンを押そう。','Remember the symbol that lights up.<br>Tap the button for the one before it.')}</p><p>${T('タップでスタート','Tap to start')}</p></div>`;hud();function frame(){if(state==='play'){const now=performance.now();bar.style.background=phase==='answer'&&deadline-now<700?'#eaa9be':'#d6aa61';bar.style.transform=`scaleX(${(phase==='answer'||phase==='remember')?Math.max(0,(deadline-now)/span):0})`;if(now>=deadline){if(phase==='remember'||phase==='feedback')next();else answer(-1)}if(now-startTime>7000)$('#hint').textContent=''}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
