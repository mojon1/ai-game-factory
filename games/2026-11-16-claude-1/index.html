<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>金魚すくい 三枚のポイ</title>
<style>
html, body, canvas, * { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1020; }
canvas { display: block; width: 100vw; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
for (const t of ['contextmenu', 'selectstart', 'gesturestart']) addEventListener(t, (e) => e.preventDefault(), { passive: false });
const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };
const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const DICT = {
  ja: {
    title: '金魚すくい', sub: '三枚のポイ',
    how1: '指を置くとポイが水に入り、はなすとすくう',
    how2: '速く動かすと紙が破れ、金魚も逃げる',
    how3: '紙は水に入れるほど ふやけて弱くなる',
    tap: 'タップでスタート', again: 'タップでもう一度',
    score: '得点', best: 'ベスト', poi: 'ポイ', wet: '紙のぬれ',
    hint: 'そっと沈めて、金魚の下へ。はなしてすくう',
    hint2: 'ふちに近いほど紙は丈夫',
    torn: 'ポイが破れた！', next: '次のポイ', last: '最後のポイ',
    over: 'おしまい', newBest: 'ベスト更新！', caught: '匹', fell: 'ポトン…', escape: '逃げた！',
    combo: (n) => n + '匹いっぺん！', pour: '金魚が追加された', wavePour: '金魚が追加された',
    names: { red: '小赤', sarasa: '更紗', black: '出目金', ryu: '大きな琉金', gold: '金色の金魚' },
    result: (n) => '金魚 ' + n + ' 匹',
  },
  en: {
    title: 'Goldfish Scoop', sub: 'Three Paper Nets',
    how1: 'Touch to dip the net, lift your finger to scoop',
    how2: 'Fast moves tear the paper and scare the fish',
    how3: 'The longer it is wet, the weaker the paper',
    tap: 'Tap to start', again: 'Tap to play again',
    score: 'Score', best: 'Best', poi: 'Nets', wet: 'Wet',
    hint: 'Dip gently, slide under a fish, lift to scoop',
    hint2: 'Paper near the rim is stronger',
    torn: 'The net tore!', next: 'Next net', last: 'Last net',
    over: 'Finished', newBest: 'New best!', caught: '', fell: 'Plop…', escape: 'Escaped!',
    combo: (n) => n + ' at once!', pour: 'More goldfish!', wavePour: 'More goldfish!',
    names: { red: 'Red', sarasa: 'Sarasa', black: 'Black moor', ryu: 'Big ryukin', gold: 'Golden' },
    result: (n) => n + ' goldfish',
  },
};
const L = DICT[LANG === 'ja' ? 'ja' : 'en'];
const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';

// ---------- canvas ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 360, H = 640, U = 1, DPR = 1;
let tank = { x: 10, y: 60, w: 340, h: 440 }, bowl = { x: 180, y: 580, rx: 70, ry: 30 };
function resize() {
  W = Math.max(1, innerWidth || 360); H = Math.max(1, innerHeight || 640);
  DPR = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  U = Math.max(0.5, Math.min(W / 360, H / 640));
  const top = 66 * U, bottom = H - 118 * U;
  tank = { x: 8 * U, y: top, w: W - 16 * U, h: Math.max(100, bottom - top) };
  bowl = { x: W / 2, y: H - 56 * U, rx: Math.min(W * 0.36, 120 * U), ry: 34 * U };
}
addEventListener('resize', resize);
resize();

// ---------- audio ----------
let AC = null, master = null, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state !== 'running') AC.resume().catch(() => {}); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
    const len = AC.sampleRate * 2; noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    startAmbience();
    if (AC.state !== 'running') AC.resume().catch(() => {});
  } catch (e) { AC = null; }
}
function noise(dur, type, freq, q, vol, when = 0, rampTo = null) {
  if (!AC) return;
  try {
    const t = AC.currentTime + when;
    const s = AC.createBufferSource(); s.buffer = noiseBuf; s.playbackRate.value = 0.8 + Math.random() * 0.4;
    const f = AC.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (rampTo) f.frequency.exponentialRampToValueAtTime(rampTo, t + dur);
    const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  } catch (e) {}
}
function tone(f0, f1, dur, vol, type = 'sine', when = 0) {
  if (!AC) return;
  try {
    const t = AC.currentTime + when;
    const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
const sfx = {
  dip(v) { noise(0.16, 'lowpass', 900, 0.7, 0.18 + v * 0.2, 0, 300); tone(260, 120, 0.12, 0.06); },
  lift(n) { noise(0.28, 'bandpass', 1400, 0.8, 0.16 + n * 0.04, 0, 500); for (let i = 0; i < 3 + n; i++) tone(500 + Math.random() * 700, 900 + Math.random() * 900, 0.05, 0.03, 'sine', 0.05 + i * 0.04); },
  tear() { for (let i = 0; i < 3; i++) noise(0.035, 'highpass', 2600 + Math.random() * 1500, 0.6, 0.12, i * 0.025); },
  bigTear() { for (let i = 0; i < 7; i++) noise(0.05, 'highpass', 2000 + Math.random() * 2000, 0.5, 0.16, i * 0.03); tone(300, 90, 0.4, 0.05, 'triangle'); },
  fall() { noise(0.2, 'lowpass', 1200, 1, 0.2, 0, 250); tone(420, 160, 0.18, 0.06); },
  bowl(i) { const p = [523, 587, 659, 784, 880, 1047, 1175, 1319][Math.min(7, i)]; tone(p * 1.5, p, 0.18, 0.08); noise(0.09, 'bandpass', 2200, 2, 0.06); },
  chime() { [1568, 2093, 2637].forEach((f, i) => tone(f, f, 0.9, 0.035, 'sine', i * 0.07)); },
  rare() { [1047, 1319, 1568, 2093, 2637].forEach((f, i) => tone(f, f * 1.002, 0.7, 0.05, 'triangle', i * 0.06)); },
};
function startAmbience() {
  try {
    // distant festival crowd: low filtered noise, slowly breathing
    const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 420; f.Q.value = 0.6;
    const g = AC.createGain(); g.gain.value = 0.035;
    const lfo = AC.createOscillator(); lfo.frequency.value = 0.13; const lg = AC.createGain(); lg.gain.value = 0.012;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    s.connect(f); f.connect(g); g.connect(master); s.start();
    // water trickle
    const s2 = AC.createBufferSource(); s2.buffer = noiseBuf; s2.loop = true; s2.playbackRate.value = 0.6;
    const f2 = AC.createBiquadFilter(); f2.type = 'highpass'; f2.frequency.value = 3800;
    const g2 = AC.createGain(); g2.gain.value = 0.008;
    s2.connect(f2); f2.connect(g2); g2.connect(master); s2.start();
  } catch (e) {}
}
let furinT = 3;
function furin(dt) {
  if (!AC) return;
  furinT -= dt;
  if (furinT <= 0) {
    furinT = 7 + Math.random() * 9;
    const base = [2093, 2349, 2637, 3136][Math.floor(Math.random() * 4)];
    tone(base, base, 1.8, 0.018); tone(base * 2.76, base * 2.76, 0.9, 0.006);
  }
}

// ---------- save ----------
let best = 0;
addEventListener('message', (e) => { if (e.data && e.data.agf === 'loaded' && e.data.data) { best = Math.max(best, e.data.data.best || 0); } });
try { parent.postMessage({ agf: 'load' }, '*'); } catch (e) {}
function saveBest() { try { parent.postMessage({ agf: 'save', data: { best } }, '*'); } catch (e) {} }

// ---------- fish ----------
const TYPES = {
  red:    { len: 24, w: 1.0, pts: 10, base: 34, flee: 150, skit: 1.0, col: ['#ff5a2e', '#d8321a'] },
  sarasa: { len: 29, w: 1.6, pts: 20, base: 30, flee: 170, skit: 0.9, col: ['#ff6a3a', '#ffffff'] },
  black:  { len: 31, w: 2.6, pts: 40, base: 22, flee: 210, skit: 0.6, col: ['#2a2430', '#0d0a12'] },
  ryu:    { len: 42, w: 4.6, pts: 80, base: 18, flee: 240, skit: 0.5, col: ['#ff7b2a', '#fff1e0'] },
  gold:   { len: 23, w: 0.9, pts: 150, base: 52, flee: 110, skit: 1.8, col: ['#ffd84a', '#ffb000'] },
};
let fish = [];
function makeFish(type, x, y) {
  const T = TYPES[type];
  return {
    type, T, x, y, a: Math.random() * Math.PI * 2, v: T.base * (0.7 + Math.random() * 0.6), len: T.len * (0.9 + Math.random() * 0.2),
    ph: Math.random() * 6, turn: 0, burst: 0, wander: Math.random() * 100, patch: Math.random(), dropT: 0, curious: 0.4 + Math.random() * 0.8,
  };
}
function spawnFish(type, edge = false) {
  const x = tank.x + tank.w * (0.15 + Math.random() * 0.7);
  const y = edge ? tank.y + 20 * U : tank.y + tank.h * (0.12 + Math.random() * 0.76);
  const f = makeFish(type, x, y);
  if (edge) { f.a = Math.PI / 2 + (Math.random() - 0.5); f.burst = 0.8; }
  fish.push(f);
  return f;
}
function initialTank() {
  fish = [];
  const list = ['red', 'red', 'red', 'red', 'red', 'red', 'red', 'red', 'red', 'red', 'red', 'sarasa', 'sarasa', 'sarasa', 'sarasa', 'black', 'black', 'black', 'ryu'];
  for (const t of list) spawnFish(t);
}

// ---------- poi ----------
const POI_R = 38;
function newPoi() {
  const R = POI_R * U, g = R / 5.2, cells = [];
  for (let gy = -R; gy <= R; gy += g) for (let gx = -R; gx <= R; gx += g) {
    const cx = gx + g / 2, cy = gy + g / 2, d = Math.hypot(cx, cy);
    if (d > R - g * 0.25) continue;
    const rr = d / R;
    const max = (1 + 1.1 * rr * rr * rr) * (0.8 + Math.random() * 0.4);
    cells.push({ x: cx, y: cy, d: rr, hp: max, max, hole: false });
  }
  return { R, g, cells, wet: 0, inWater: false, x: 0, y: 0, px: 0, py: 0, speed: 0, still: 0, total: cells.length, holes: 0, broken: false, tearCD: 0 };
}
const OFFSET_Y = -64; // poi floats above the finger so the finger does not hide the fish
function factor(w) { return 0.22 + 1.2 * Math.pow(w, 1.6); }
function damageCell(c, amt) {
  if (c.hole) return false;
  c.hp -= amt;
  if (c.hp <= 0) { c.hole = true; poi.holes++; return true; }
  return false;
}
function nearestCell(lx, ly) {
  let best = null, bd = 1e9;
  for (const c of poi.cells) { const d = (c.x - lx) ** 2 + (c.y - ly) ** 2; if (d < bd) { bd = d; best = c; } }
  return best;
}
function cellsNear(lx, ly, r) { return poi.cells.filter((c) => (c.x - lx) ** 2 + (c.y - ly) ** 2 < r * r); }

// ---------- game state ----------
let state = 'title', poi = newPoi(), score = 0, poiLeft = 3, caught = [], lifting = null, flying = [], ripples = [], bits = [], pops = [];
let msg = null, hintT = 0, overT = 0, nextPoiT = 0, newBest = false, pointerId = null, combo = 0, gameT = 0, pourCount = 0, timeAll = 0;
let finger = { x: 0, y: 0 };
function startGame() {
  state = 'play'; score = 0; poiLeft = 3; caught = []; lifting = null; flying = []; pops = []; bits = []; msg = null; newBest = false; gameT = 0; pourCount = 0;
  poi = newPoi(); initialTank(); hintT = 5;
  signal('start');
}
function showMsg(text, col = '#fff', dur = 1.4, big = false) { msg = { text, col, t: dur, dur, big }; }
function addRipple(x, y, r0, r1, a = 0.6, dur = 0.8) { ripples.push({ x, y, r0, r1, a, t: 0, dur }); }

function dipAt(x, y) {
  if (poi.broken || lifting) return;
  const p = clampPoi(x, y + OFFSET_Y * U);
  poi.inWater = true; poi.x = p.x; poi.y = p.y; poi.px = p.x; poi.py = p.y; poi.speed = 0; poi.still = 0;
  addRipple(p.x, p.y, poi.R * 0.6, poi.R * 1.8, 0.7, 0.7);
  sfx.dip(poi.wet);
  for (const f of fish) { const d = Math.hypot(f.x - p.x, f.y - p.y); if (d < poi.R * 1.05 && Math.random() < 0.35) startle(f, p.x, p.y, 0.35); }
}
function clampPoi(x, y) {
  const R = poi.R;
  return { x: Math.max(tank.x + R * 0.6, Math.min(tank.x + tank.w - R * 0.6, x)), y: Math.max(tank.y + R * 0.6, Math.min(tank.y + tank.h - R * 0.6, y)) };
}
function startle(f, x, y, s) {
  f.a = Math.atan2(f.y - y, f.x - x) + (Math.random() - 0.5) * 0.8;
  f.burst = Math.max(f.burst, s * f.T.skit + 0.2);
}

function liftPoi() {
  if (!poi.inWater) return;
  poi.inWater = false;
  const F = factor(poi.wet);
  const got = [];
  for (const f of fish) {
    const lx = f.x - poi.x, ly = f.y - poi.y;
    if (Math.hypot(lx, ly) > poi.R * 1.12) continue;
    const c = nearestCell(lx, ly);
    if (!c || c.hole) { startle(f, poi.x, poi.y, 0.6); continue; }
    got.push({ f, lx, ly });
  }
  // the weight of each fish presses on the paper under it
  let tore = false;
  const kept = [];
  const totalW = got.reduce((a, g) => a + g.f.T.w, 0);
  for (const g of got) {
    const r = g.f.len * 0.45 * U;
    // the whole catch bends the paper: the more weight on it, the more every fish presses through
    const load = 1 + 0.4 * (totalW - g.f.T.w);
    for (const c of cellsNear(g.lx, g.ly, r)) if (damageCell(c, g.f.T.w * 0.36 * F * load * (0.75 + Math.random() * 0.5))) tore = true;
    const c = nearestCell(g.lx, g.ly);
    if (c.hole) { dropFish(g.f, true); } else kept.push(g);
  }
  if (tore) { sfx.tear(); tearBits(poi.x, poi.y, 6); }
  addRipple(poi.x, poi.y, poi.R * 0.8, poi.R * 2.4, 0.8, 0.9);
  sfx.lift(kept.length);
  for (const f of fish) { const d = Math.hypot(f.x - poi.x, f.y - poi.y); if (d < poi.R * 2.4 && !kept.find((k) => k.f === f)) startle(f, poi.x, poi.y, 0.4); }
  fish = fish.filter((f) => !kept.find((k) => k.f === f));
  lifting = { x: poi.x, y: poi.y, t: 0, fish: kept.map((k) => ({ ...k, wig: 0 })), wigT: 0.1 };
  checkBroken();
}
function dropFish(f, wasLifted) {
  f.burst = 1.2; f.a = Math.random() * Math.PI * 2; f.dropT = 0.4;
  addRipple(f.x, f.y, 4 * U, 30 * U, 0.8, 0.6);
  sfx.fall();
  pops.push({ x: f.x, y: f.y - 14 * U, text: L.fell, col: '#bfe6ff', t: 0, dur: 1.1, size: 15 });
  if (wasLifted && !fish.includes(f)) fish.push(f);
}
function tearBits(x, y, n) {
  for (let i = 0; i < n; i++) bits.push({ x: x + (Math.random() - 0.5) * poi.R, y: y + (Math.random() - 0.5) * poi.R, vx: (Math.random() - 0.5) * 40, vy: (Math.random() - 0.5) * 40, t: 0, dur: 0.9 + Math.random() * 0.6, s: (2 + Math.random() * 3) * U, r: Math.random() * 6 });
}
function checkBroken() {
  if (poi.broken) return;
  if (poi.holes / poi.total >= 0.42) {
    poi.broken = true; poi.inWater = false;
    sfx.bigTear(); tearBits(poi.x, poi.y, 18);
    poiLeft--;
    if (poiLeft > 0) { showMsg(L.torn, '#ffd0c0', 1.5, true); nextPoiT = 1.5; }
    else { nextPoiT = 1.6; showMsg(L.torn, '#ffd0c0', 1.5, true); }
  }
}
function catchFish(f, idx, n) {
  const mult = 1 + 0.5 * (n - 1);
  const pts = Math.round(f.T.pts * mult);
  score += pts; caught.push(f.type);
  pops.push({ x: bowl.x + (Math.random() - 0.5) * bowl.rx, y: bowl.y - 30 * U, text: '+' + pts, col: f.type === 'gold' ? '#ffe36a' : '#fff', t: 0, dur: 1.2, size: 18 + Math.min(10, pts / 20) });
  sfx.bowl(caught.length % 8);
  if (f.type === 'gold') sfx.rare();
  bowlFish.push({ type: f.type, T: f.T, len: f.len * 0.85, a: Math.random() * 6, ph: Math.random() * 6, r: Math.random(), th: Math.random() * 6 });
}
let bowlFish = [];

function maybePour() {
  if (fish.length >= 13) return;
  pourCount++;
  const pool = ['red', 'red', 'red', 'sarasa', 'sarasa', 'black'];
  if (pourCount >= 2) pool.push('ryu', 'black');
  const n = 6;
  for (let i = 0; i < n; i++) spawnFish(pool[Math.floor(Math.random() * pool.length)], true);
  if (score >= 80 && Math.random() < 0.6) spawnFish('gold', true);
  showMsg(L.pour, '#c8f0ff', 1.3);
  sfx.chime();
}

// ---------- input ----------
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  finger.x = e.clientX; finger.y = e.clientY;
  if (state === 'title') { startGame(); return; }
  if (state === 'over') { if (overT > 0.7) startGame(); return; }
  if (pointerId !== null) return;
  pointerId = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  dipAt(e.clientX, e.clientY);
});
cv.addEventListener('pointermove', (e) => {
  if (e.pointerId !== pointerId) return;
  finger.x = e.clientX; finger.y = e.clientY;
});
function up(e) {
  if (e.pointerId !== pointerId) return;
  pointerId = null;
  if (state === 'play') liftPoi();
}
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);

// ---------- update ----------
function update(dt) {
  timeAll += dt;
  furin(dt);
  updateFish(dt);
  for (const r of ripples) r.t += dt;
  ripples = ripples.filter((r) => r.t < r.dur);
  for (const b of bits) { b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt; b.vx *= 0.97; b.vy *= 0.97; }
  bits = bits.filter((b) => b.t < b.dur);
  for (const p of pops) p.t += dt;
  pops = pops.filter((p) => p.t < p.dur);
  if (msg) { msg.t -= dt; if (msg.t <= 0) msg = null; }
  for (const b of bowlFish) { b.ph += dt * 6; b.th += dt * (0.4 + b.r * 0.4); }
  if (state === 'over') { overT += dt; return; }
  if (state !== 'play') return;
  gameT += dt;
  if (hintT > 0) hintT -= dt;
  // poi
  if (poi.inWater && !poi.broken) {
    const p = clampPoi(finger.x, finger.y + OFFSET_Y * U);
    const dx = p.x - poi.x, dy = p.y - poi.y;
    poi.x = p.x; poi.y = p.y;
    const v = Math.hypot(dx, dy) / Math.max(dt, 1e-3);
    poi.speed = poi.speed * 0.6 + v * 0.4;
    poi.still = poi.speed < 25 * U ? poi.still + dt : 0;
    poi.wet = Math.min(1, poi.wet + dt / 7.5);
    const F = factor(poi.wet);
    const over = Math.max(0, poi.speed / U - 210);
    if (over > 0) {
      const dps = Math.pow(over, 1.5) * 0.0009 * F;
      let tore = false;
      for (const c of poi.cells) if (damageCell(c, dps * dt * (1.35 - 0.7 * c.d) * (0.6 + Math.random() * 0.8))) tore = true;
      if (tore && poi.tearCD <= 0) { sfx.tear(); tearBits(poi.x, poi.y, 3); poi.tearCD = 0.15; }
      if (Math.random() < dt * 20) addRipple(poi.x - dx * 0.5, poi.y - dy * 0.5, poi.R * 0.5, poi.R * 1.3, 0.35, 0.5);
    }
    // soaked paper slowly gives way on its own while it stays in the water
    if (poi.wet > 0.7) {
      let tore = false;
      for (const c of poi.cells) if (Math.random() < 0.3 && damageCell(c, (poi.wet - 0.6) * 0.5 * dt * (1.3 - 0.6 * c.d) * (0.4 + Math.random() * 1.2))) tore = true;

    const k = b.t / b.dur;
    ctx.fillStyle = `rgba(250,250,245,${0.85 * (1 - k)})`;
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r + b.t * 3); ctx.fillRect(-b.s / 2, -b.s / 2, b.s, b.s * 0.7); ctx.restore();
  }
  ctx.restore();
}
function fitText(text, maxW, size, weight = 'bold') {
  let s = size;
  ctx.font = `${weight} ${s}px ${FONT}`;
  while (ctx.measureText(text).width > maxW && s > 12) { s -= 1; ctx.font = `${weight} ${s}px ${FONT}`; }
  return s;
}
function outlined(text, x, y, col, lw = 4) {
  ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(20,8,24,0.85)'; ctx.lineWidth = lw; ctx.strokeText(text, x, y);
  ctx.fillStyle = col; ctx.fillText(text, x, y);
}
function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'middle';
  ctx.font = `bold ${15 * U}px ${FONT}`; ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,230,210,0.8)'; ctx.fillText(L.score, 12 * U, 18 * U);
  ctx.font = `bold ${26 * U}px ${FONT}`; ctx.fillStyle = '#fff'; ctx.fillText(String(score), 12 * U, 42 * U);
  // nets
  ctx.textAlign = 'right';
  ctx.font = `bold ${14 * U}px ${FONT}`; ctx.fillStyle = 'rgba(255,230,210,0.8)';
  ctx.fillText(L.best + ' ' + best, W - 12 * U, 18 * U);
  const nx = W - 12 * U;
  for (let i = 0; i < 3; i++) {
    const cx = nx - 9 * U - i * 22 * U, cy = 42 * U;
    const alive = i < poiLeft;
    ctx.strokeStyle = alive ? '#ff5a62' : 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2.5 * U;
    ctx.beginPath(); ctx.arc(cx, cy, 8 * U, 0, Math.PI * 2); ctx.stroke();
    if (alive) {
      const isCur = i === poiLeft - 1 && !poi.broken;
      ctx.fillStyle = isCur ? `rgba(255,255,250,${0.9 - poi.wet * 0.5})` : 'rgba(255,255,250,0.9)'; ctx.beginPath(); ctx.arc(cx, cy, 6.5 * U, 0, Math.PI * 2); ctx.fill();
    }
  }
  // wetness / paper health meter in the middle
  const mw = Math.min(110 * U, W * 0.3), mx = W / 2 - mw / 2, my = 36 * U;
  ctx.textAlign = 'center'; ctx.font = `bold ${13 * U}px ${FONT}`; ctx.fillStyle = 'rgba(200,230,255,0.85)';
  ctx.fillText(L.wet, W / 2, 20 * U);
  rr(mx, my, mw, 10 * U, 5 * U); ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fill();
  const wv = poi.broken ? 1 : poi.wet;
  if (wv > 0.01) {
    rr(mx, my, Math.max(10 * U, mw * wv), 10 * U, 5 * U);
    ctx.fillStyle = wv < 0.4 ? '#8fd8ff' : wv < 0.7 ? '#4aa0ff' : '#3a60ff'; ctx.fill();
  }
  // holes indicator
  const hf = poi.holes / poi.total / 0.42;
  if (hf > 0.02 && !poi.broken) {
    ctx.fillStyle = '#ff7a6a';
    ctx.fillRect(mx, my + 13 * U, mw * Math.min(1, hf), 3 * U);
  }
  ctx.restore();
}
function drawMsgs() {
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of pops) {
    const k = p.t / p.dur;
    ctx.globalAlpha = 1 - k * k;
    ctx.font = `bold ${p.size * U}px ${FONT}`;
    outlined(p.text, p.x, p.y - k * 26 * U, p.col, 4 * U);
  }
  ctx.globalAlpha = 1;
  if (msg) {
    const k = 1 - msg.t / msg.dur;
    ctx.globalAlpha = Math.min(1, msg.t * 3);
    const size = fitText(msg.text, W * 0.86, (msg.big ? 32 : 22) * U);
    outlined(msg.text, W / 2, tank.y + tank.h * 0.42 - k * 10 * U, msg.col, 5 * U);
  }
  ctx.globalAlpha = 1;
  if (state === 'play' && hintT > 0) {
    ctx.globalAlpha = Math.min(1, hintT);
    const t1 = L.hint;
    fitText(t1, W * 0.92, 15 * U, '600');
    outlined(t1, W / 2, tank.y + tank.h - 36 * U, '#fff', 4 * U);
    fitText(L.hint2, W * 0.92, 13 * U, '600');
    outlined(L.hint2, W / 2, tank.y + tank.h - 15 * U, '#ffe0a0', 4 * U);
  }
  ctx.restore();
}
function drawTitle() {
  ctx.save();
  ctx.fillStyle = 'rgba(16,6,24,0.55)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let s = fitText(L.title, W * 0.86, 46 * U);
  outlined(L.title, W / 2, H * 0.26, '#ffefe0', 6 * U);
  fitText(L.sub, W * 0.8, 22 * U);
  outlined(L.sub, W / 2, H * 0.26 + 44 * U, '#ff8a7a', 4 * U);
  const lines = [L.how1, L.how2, L.how3];
  lines.forEach((t, i) => { fitText(t, W * 0.9, 15 * U, '600'); outlined(t, W / 2, H * 0.46 + i * 28 * U, '#e8f4ff', 4 * U); });
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(timeAll * 4);
  fitText(L.tap, W * 0.8, 22 * U);
  outlined(L.tap, W / 2, H * 0.68, '#fff', 5 * U);
  ctx.restore();
}
function drawOver() {
  ctx.save();
  ctx.fillStyle = 'rgba(16,6,24,' + Math.min(0.6, overT * 1.5) + ')'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  fitText(L.over, W * 0.8, 26 * U); outlined(L.over, W / 2, H * 0.18, '#ffd8c8', 5 * U);
  fitText(String(score), W * 0.8, 64 * U); outlined(String(score), W / 2, H * 0.3, '#fff', 7 * U);
  fitText(L.best + ' ' + best, W * 0.8, 18 * U); outlined(L.best + ' ' + best, W / 2, H * 0.3 + 46 * U, '#ffe0b0', 4 * U);
  if (newBest) { fitText(L.newBest, W * 0.8, 22 * U); outlined(L.newBest, W / 2, H * 0.3 + 76 * U, '#ffe36a', 5 * U); }
  // breakdown
  const counts = {};
  for (const t of caught) counts[t] = (counts[t] || 0) + 1;
  fitText(L.result(caught.length), W * 0.8, 20 * U); outlined(L.result(caught.length), W / 2, H * 0.5, '#e8f4ff', 4 * U);
  let row = 0;
  for (const t of ['gold', 'ryu', 'black', 'sarasa', 'red']) {
    if (!counts[t]) continue;
    const yy = H * 0.5 + 30 * U + row * 26 * U;
    ctx.save(); ctx.translate(W / 2 - 70 * U, yy); drawFishShape(t, TYPES[t], 22, 0, timeAll * 6, 0); ctx.restore();
    ctx.textAlign = 'left';
    fitText(L.names[t] + ' × ' + counts[t], W * 0.5, 15 * U, '600');
    outlined(L.names[t] + ' × ' + counts[t], W / 2 - 50 * U, yy, '#fff', 4 * U);
    ctx.textAlign = 'center';
    row++;
  }
  if (overT > 0.7) {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(timeAll * 4);
    fitText(L.again, W * 0.8, 22 * U); outlined(L.again, W / 2, H * 0.86, '#fff', 5 * U);
  }
  ctx.restore();
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground();
  drawTank();
  ctx.save(); rr(tank.x, tank.y, tank.w, tank.h, 11 * U); ctx.clip();
  drawPoiInWater();
  drawFish();
  ctx.restore();
  drawRipples();
  drawPoiHandleOver();
  drawBowl();
  drawLifting();
  drawFlying();
  drawBits();
  if (state !== 'title') drawHUD();
  drawMsgs();
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
}

// ---------- loop ----------
initialTank();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (W < 2 || H < 2) resize();
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
