const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),T=LANG==='ja'?{title:'うそつきランプ箱',a:'正しい札は3枚、うそは1枚',b:'3つのランプを切り替えて箱を開こう',c:'3箱の秘密を解こう',start:'タップでスタート',tries:'試行',stage:'箱',rule:'うそは、ちょうど1枚',on:'は点灯',off:'は消灯',same:'は同じ状態',different:'は違う状態',and:'と',total:'点灯は',lights:'個',open:'開ける',no:'まだ開かない…',hint:'丸いランプを押して切り替えよう',solved:'箱が開いた！',all:'3箱の秘密を解いた！',lie:'うそは札',next:'タップで次へ',again:'タップでもう一度'}:{title:'The Lying Lamp Box',a:'Three clues are true; one is a lie',b:'Toggle three lamps to open the box',c:'Solve three boxes',start:'Tap to start',tries:'Tries',stage:'box',rule:'Exactly one clue is false',on:' is on',off:' is off',same:' have the same state',different:' have different states',and:' and ',total:'Lit lamps: ',lights:'',open:'Open',no:'Still locked…',hint:'Tap the round lamps to toggle them',solved:'Box unlocked!',all:'Three secrets solved!',lie:'The lie is clue ',next:'Tap to continue',again:'Tap to play again'};for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});const c=document.getElementById('c'),g=c.getContext('2d');let w,h,s,ox,oy,state='title',stage=1,tries=0,mask=0,hints=[],answer=0,age=0,delay=0,wrong=0,liar=0,audio;const names=['A','B','C'],colors=['#8bd6ce','#f2bb77','#c9abe0'];const signal=(agf,data={})=>parent.postMessage({agf,...data},'*');function resize(){w=innerWidth||360;h=innerHeight||640;let d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;s=Math.min(w/360,h/640);ox=(w-360*s)/2;oy=(h-640*s)/2;g.setTransform(d*s,0,0,d*s,ox*d,oy*d)}resize();addEventListener('resize',resize);function tone(f){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),v=audio.createGain();o.connect(v);v.connect(audio.destination);o.frequency.value=f;v.gain.setValueAtTime(.035,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.start();o.stop(audio.cu
