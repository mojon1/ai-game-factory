<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Eight Hills Sprint</title>
<style>
*{box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow:hidden;overscroll-behavior:none;background:#18273d;color:#fff3cf;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{width:100vw;height:100dvh;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:16px}
header{display:flex;justify-content:space-between;font-size:16px;font-weight:bold}
#terrain{text-align:center;font-size:27px;margin:0}#next,#log,#hint{text-align:center;font-size:14px;min-height:20px}
#course{transition:background-color .2s;width:100%;height:110px;position:relative;background:#263c54;border-radius:15px;padding:16px}
.road{position:relative;height:31px;margin-bottom:14px;border-bottom:2px dashed #849bab}
.road-label{position:absolute;left:0;top:-6px;font-size:12px;color:#fff3cf}.dot{transition:left .25s ease-out;position:absolute;bottom:-2px;transform:translateX(-50%);font-size:20px;line-height:1}
#gears{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
button{font:inherit;color:#17283a;background:#b2e8d7;border:0;border-radius:12px;min-height:90px;padding:6px 3px}
button b,button small{display:block}button small{font-size:13px;margin-top:6px}
#cover{position:absolute;inset:0;background:#18273df5;display:grid;place-items:center;text-align:center;padding:24px}
h1{font-size:clamp(25px,8vw,36px)}p{line-height:1.65}#cover small{font-size:16px;color:#a6e5cf}
</style>
<main><header><span id="distance"></span><span id="turn"></span></header><h2 id="terrain"></h2><div id="next"></div><div id="course"><div class="road"><span class="road-label" id="you-label"></span><span class="dot" id="you">◆</span></div><div class="road"><span class="road-label" id="rival-label"></span><span class="dot" id="rival">●</span></div></div><div id="log"></div><div id="gears"></div><div id="hint"></div></main><div id="cover"></div>
<script>
const lang=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en');
const words={
 ja:{title:'坂道の残り脚',help:'坂に合わせてギアを選び、8区間で競走。<br>軽いギアで脚をため、下りで踏み込もう。',start:'タップでスタート',again:'タップでもう一度',you:'自分',rival:'相手',stage:'区間',next:'次',up:'上り',flat:'平地',down:'下り',finish:'ゴール',low:'軽い',mid:'中間',high:'重い',power:'脚',move:'進む',hint:'ギアの札に進む距離と脚の増減が出ます',tired:'脚が足りません',win:'先着！',draw:'同着',lose:'相手が先着',gap:'差',route:'残り'},
 en:{title:'Eight Hills Sprint',help:'Choose gears across eight racing segments.<br>Recover in low gear, then push on descents.',start:'Tap to start',again:'Tap to play again',you:'You',rival:'Rival',stage:'Leg',next:'Next',up:'Climb',flat:'Flat',down:'Descent',finish:'Finish',low:'Low',mid:'Middle',high:'High',power:'Energy',move:'Move',hint:'Each gear shows distance and energy change',tired:'Not enough energy',win:'You win!',draw:'Dead heat',lose:'Rival wins',gap:'Gap',route:'Ahead'}
};
const t=words[lang]||words.en;
const byId=id=>document.getElementById(id);
const terrain=['flat','up','down','up','flat','down','up','down'];
const speed={flat:[2,4,6],up:[3,4,2],down:[3,4,8]};
const energyChange=[1,-1,-3];
const rivalSpeed=[4,3,5,3,4,6,3,6];
const gears=['low','mid','high'];
const arrows={up:'↗',flat:'→',down:'↘'};
const courseColors={up:'#4b4057',flat:'#263c54',down:'#235953'};
let mode='title',leg=0,distance=0,rival=0,energy=4,guard=0,hintTimer;
const signal=(agf,data={})=>parent.postMessage({agf,...data},'*');
for(const event of ['contextmenu','selectstart','gesturestart'])addEventListener(event,e=>e.preventDefault(),{passive:false});
function overlay(title,body,footer){
 const cover=byId('cover');
 cover.innerHTML='<div><h1>'+title+'</h1><p>'+body+'</p><small>'+footer+'</small></div>';
 cover.style.display='grid';
}
function begin(){
 mode='play';leg=0;distance=0;rival=0;energy=4;
 byId('cover').style.display='none';byId('log').textContent='';byId('hint').textContent=t.hint;
 clearTimeout(hintTimer);hintTimer=setTimeout(()=>byId('hint').textContent='',5000);
 signal('start');draw();
}
function draw(){
 byId('distance').textContent=t.you+' '+distance+' / '+t.rival+' '+rival;
 byId('turn').textContent=t.stage+' '+(leg+1)+'/8';
 byId('terrain').textContent=({up:'↗ ',flat:'→ ',down:'↘ '}[terrain[leg]])+t[terrain[leg]];
 byId('next').textContent=t.power+' '+energy+'/6　·　'+t.route+' '+(terrain.slice(leg+1).map(section=>arrows[section]).join(' ')||t.finish);
 byId('course').style.backgroundColor=courseColors[terrain[leg]];byId('you-label').textContent=t.you;byId('rival-label').textContent=t.rival;
 byId('you').style.cssText='left:'+Math.min(97,4+distance*2.25)+'%;color:#b2e8d7';
 byId('rival').style.cssText='left:'+Math.min(97,4+rival*2.25)+'%;color:#ffb085';
 const buttons=byId('gears');
 buttons.replaceChildren();
 gears.forEach((gear,i)=>{
  const delta=Math.min(6-energy,energyChange[i]);
  const button=document.createElement('button');button.style.opacity=energy+energyChange[i]<0?'.48':'1';
  button.innerHTML='<b>'+t[gear]+'</b><small>'+t.move+' +'+speed[terrain[leg]][i]+'<br>'+t.power+' '+(delta>=0?'+':'')+delta+'</small>';
  button.addEventListener('pointerdown',e=>{e.preventDefault();ride(i)});
  buttons.append(button);
 });
}
function ride(i){
 if(mode!=='play')return;
 if(energy+energyChange[i]<0){byId('log').textContent=t.tired;return}
 const gain=speed[terrain[leg]][i];
 distance+=gain;rival+=rivalSpeed[leg];energy=Math.min(6,energy+energyChange[i]);
 const gap=distance-rival;
 byId('log').textContent=t.move+' +'+gain+'　·　'+t.gap+' '+(gap>0?'+':'')+gap;
 if(leg===7){
  mode='end';guard=performance.now()+700;signal('end',{score:distance});
  overlay(distance>rival?t.win:distance===rival?t.draw:t.lose,t.you+' '+distance+' · '+t.rival+' '+rival,t.again);
  return;
 }
 leg++;draw();
}
byId('cover').addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(mode==='title'||(mode==='end'&&performance.now()>=guard))begin();
});
overlay(t.title,t.help,t.start);
</script></html>
