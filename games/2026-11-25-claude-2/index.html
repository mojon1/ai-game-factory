<title>まわせ！コロコロ迷宮</title>
<style>

canvas { display: block; width: 100vw; height: 100dvh; }
</style>

<body>
<canvas id="c"></canvas>
<script>
'use strict';
for (const t of ['contextmenu', 'selectstart', 'gesturestart']) addEventListener(t, (e) => e.preventDefault(), { passive: false });
const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const T = {
  ja: {
    title: 'まわせ！コロコロ迷宮', sub: '迷路の箱をまわすと、中のものが下へ落ちる',
    how1: '指で左右にひっぱると箱がかたむき、落ちる先が見える', how2: '離すと箱が90°まわる。コロを ◎ の穴へ落とそう', how3: '木箱もいっしょに落ちる。トゲのフタや足場にしよう',
    tap: 'タップでスタート', stage: 'ステージ', moves: '手数', par: '最短', gems: '宝石',
    hint: 'ひっぱると落ちる先が見える。離すとまわる', clear: 'ゴール！', next: 'タップで次へ', again: 'タップでもう一度',
    s1: 'ゴール', s2: '宝石ぜんぶ', s3: '最短手数', ouch: 'いたっ！', ouch2: 'タップで1手もどす',
    undo: 'もどす', reset: 'はじめから', all: 'ぜんぶクリア！', total: '星', best: 'ベスト更新！', cont: 'タップでタイトルへ（星を集めなおせる）', sel: 'ステージをえらぶ',
    hintCrate: '木箱も落ちる。トゲのフタや足場になる', hintSpike: 'トゲ（赤）にふれるとアウト', hintGem: '宝石はおまけ。全部とると★',
  },
  en: {
    title: 'Roll & Turn Maze', sub: 'Turn the maze box and everything inside falls',
    how1: 'Drag left/right to tilt the box and preview the fall', how2: 'Release to turn it 90°. Drop Koro into the ◎ hole', how3: 'Crates fall too — use them as spike lids and ledges',
    tap: 'Tap to start', stage: 'Stage', moves: 'Moves', par: 'Par', gems: 'Gems',
    hint: 'Drag to preview the fall, release to turn', clear: 'Goal!', next: 'Tap to continue', again: 'Tap to play again',
    s1: 'Goal', s2: 'All gems', s3: 'Par moves', ouch: 'Ouch!', ouch2: 'Tap to undo one move',
    undo: 'Undo', reset: 'Restart', all: 'All stages clear!', total: 'Stars', best: 'New best!', cont: 'Tap for the title (replay for stars)', sel: 'Select stage',
    hintCrate: 'Crates fall too — lids for spikes, ledges for Koro', hintSpike: 'Red spikes pop Koro', hintGem: 'Gems are a bonus — get all for a ★',
  },
}[LANG === 'ja' ? 'ja' : 'en'];
const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };

// ---------- levels (generated & verified by BFS solver) ----------
const LEVELS = [{"rows":["#######","#.o#G.#","#.....#","#.....#","#.#..##","#...*.#","#######"],"par":3},{"rows":["#######","#^.#.G#","#.....#","#...#.#","#o*...#","#....##","#######"],"par":4},{"rows":["########","#..#.^.#","#...#.^#","##.G..##","##.#...#","#*.#...#","#*o#..##","########"],"par":6},{"rows":["########","#..*...#","#..#o#.#","#..x.G.#","#......#","##.#...#","#......#","########"],"par":6},{"rows":["########","#.#.G#.#","#...##.#","#..xo..#","#.^...##","####...#","#...#**#","########"],"par":7},{"rows":["#########","#.....*.#","#.G#..#.#","#..*..^.#","#......##","#...^...#","#....o..#","###..x..#","#########"],"par":8},{"rows":["#########","##.....x#","#....#..#","#.^...#.#","#G..*x..#","#.......#","#..#o..*#","#.#...#.#","#########"],"par":9},{"rows":["#########","#......^#","#...^#..#","#.#.G.#.#","#.....x.#","#.#..*..#","#.o.#...#","#.#*.^.##","#########"],"par":11},{"rows":["#########","#......^#","##......#","#x..o...#","##G#..*##","#..#..*.#","#^.#.##*#","#.#x#...#","#########"],"par":10},{"rows":["#########","#.x#x#.##","#....#..#","#.*.....#","#^o.#*.^#","#...#.#.#","#..*G...#","#^..#.#.#","#########"],"par":11},{"rows":["##########","##^.....##","#^....#..#","#.#.#o.x##","#...#..G.#","##*#..#..#","#*..#*...#","#.#.#.##.#","#..x...^##","##########"],"par":12},{"rows":["##########","#..^.###.#","#..#..G.##","##.x*....#","#..#.x.#.#","#^#..##.##","#*.*.....#","#..ox..^.#","##.....#.#","##########"],"par":15}];
const GV = [[0, 1], [1, 0], [0, -1], [-1, 0]]; // gravity in maze coords for orientation r

function parse(rows) {
  const H = rows.length, W = rows[0].length;
  const L = { W, H, wall: [], spike: [], coin: [], ball: 0, goal: 0, crates: [] };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = rows[y][x], i = y * W + x;
    L.wall[i] = c === '#'; L.spike[i] = c === '^';
    if (c === 'o') L.ball = i; if (c === 'G') L.goal = i; if (c === 'x') L.crates.push(i); if (c === '*') L.coin.push(i);
  }
  return L;
}
// simulate a fall; returns moves for animation
function fall(L, s) {
  const [gx, gy] = GV[s.r], W = L.W, step = gx + gy * W;
  const objs = [{ k: 'b', id: -1, p: s.ball }, ...s.crates.map((p, i) => ({ k: 'c', id: i, p }))];
  const proj = (p) => (p % W) * gx + Math.floor(p / W) * gy;
  objs.sort((a, b) => proj(b.p) - proj(a.p));
  const occ = new Set(); let coins = s.coins, result = null, ball = s.ball; const crates = s.crates.slice(); const anim = []; const coinAt = [];
  for (const o of objs) {
    let p = o.p, d = 0;
    if (!(o.k === 'b' && !s.alive)) for (;;) {
      const n = p + step;
      if (L.wall[n] || occ.has(n)) break;
      p = n; d++;
      if (o.k === 'b') {
        const ci = L.coin.indexOf(p); if (ci >= 0 && !(coins & (1 << ci))) { coins |= 1 << ci; coinAt.push({ ci, d }); }
        if (p === L.goal) { result = 'win'; break; }
        if (L.spike[p]) { result = 'dead'; break; }
      }
    }
    if (o.k === 'b') ball = p; else crates[o.id] = p;
    if (!(o.k === 'b' && result)) occ.add(p);
    anim.push({ k: o.k, id: o.id, from: o.p, to: p, d });
  }
  return { state: { r: s.r, ball, crates, coins, alive: result !== 'dead' }, result, anim, coinAt };
}

// ---------- canvas ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let VW = 360, VH = 640, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = Math.max(1, innerWidth || 360); VH = Math.max(1, innerHeight || 640);
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
}
addEventListener('resize', resize); resize();
const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';
function fitText(txt, maxW, size, weight = '700') {
  let s = size; ctx.font = `${weight} ${s}px ${FONT}`;
  while (s > 12 && ctx.measureText(txt).width > maxW) { s -= 1; ctx.font = `${weight} ${s}px ${FONT}`; }
  return s;
}

// ---------- audio ----------
let AC = null, master = null, noiseBuf = null;
function initAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.6, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state !== 'running') AC.resume();
  } catch (e) {}
}
function tone(f, dur, type = 'sine', vol = 0.2, when = 0, f2 = null) {
  if (!AC) return;
  try {
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
function noise(dur, freq, q = 1, vol = 0.2, when = 0, f2 = null, type = 'bandpass') {
  if (!AC) return;
  try {
    const t = AC.currentTime + when, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.setValueAtTime(freq, t); if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur); f.Q.value = q;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
  } catch (e) {}
}
const SND = {
  rot() { noise(0.32, 260, 3, 0.16, 0, 140); tone(70, 0.3, 'triangle', 0.08, 0, 55); },
  ball(d) { const v = Math.min(0.22, 0.06 + d * 0.025); tone(1500 - Math.min(d, 8) * 60, 0.09, 'sine', v); tone(620, 0.06, 'triangle', v * 0.5); },
  crate(d) { const v = Math.min(0.3, 0.08 + d * 0.035); tone(120, 0.18, 'triangle', v, 0, 70); noise(0.08, 900, 1.5, v * 0.7); },
  coin() { tone(1319, 0.1, 'square', 0.05); tone(1760, 0.22, 'square', 0.05, 0.07); tone(2637, 0.25, 'sine', 0.06, 0.07); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.3, 'triangle', 0.13, i * 0.08)); tone(262, 0.6, 'sine', 0.12, 0.05); },
  dead() { noise(0.12, 2500, 1, 0.25); tone(700, 0.4, 'square', 0.06, 0.03, 120); },
  star(i) { tone([1047, 1319, 1568][i], 0.25, 'triangle', 0.12); tone([2093, 2637, 3136][i], 0.2, 'sine', 0.05); },
  click() { tone(900, 0.05, 'sine', 0.08); },
  undo() { tone(500, 0.08, 'sine', 0.08, 0, 800); },
};

// ---------- game state ----------
let scene = 'title'; // title | play | clear | all | select
let lvIdx = 0, L = null, st = null, hist = [], moves = 0, dispAngle = 0, targetAngle = 0;
let anim = null, queued = 0, sceneT = 0, hintT = 0, hintText = '', dead = false, deadT = 0, winT = 0, clearInfo = null;
let progress = { stars: LEVELS.map(() => [0, 0, 0]), best: LEVELS.map(() => 0), unlocked: 1 };
const particles = [], popups = [];
let save = null;
addEventListener('message', (e) => {
  if (e.data && e.data.agf === 'loaded' && e.data.data && Array.isArray(e.data.data.stars)) {
    const d = e.data.data;
    LEVELS.forEach((_, i) => { if (Array.isArray(d.stars[i])) progress.stars[i] = d.stars[i].map((v) => (v ? 1 : 0)).slice(0, 3); });
    progress.unlocked = Math.max(1, Math.min(LEVELS.length, d.unlocked | 0));
    if (scene === 'title') { lvIdx = Math.min(LEVELS.length - 1, progress.unlocked - 1); L = null; }
  }
});
try { parent.postMessage({ agf: 'load' }, '*'); } catch (e) {}
function persist() { try { parent.postMessage({ agf: 'save', data: { stars: progress.stars, unlocked: progress.unlocked } }, '*'); } catch (e) {} }

function loadLevel(i) {
  lvIdx = i; L = parse(LEVELS[i].rows);
  st = { r: 0, ball: L.ball, crates: L.crates.slice(), coins: 0, alive: true };
  hist = []; moves = 0; dispAngle = targetAngle = 0; dead = false; queued = 0; winT = 0; clearInfo = null;
  particles.length = 0; popups.length = 0;
  startFall(0);
  const hasC = L.crates.length > 0, hasS = L.spike.some(Boolean);
  hintText = i === 0 ? T.hint : (hasC && !LEVELS.slice(0, i).some((l) => l.rows.join('').includes('x'))) ? T.hintCrate : (hasS && !LEVELS.slice(0, i).some((l) => l.rows.join('').includes('^'))) ? T.hintSpike : i === 1 ? T.hintGem : '';
  hintT = hintText ? 4.5 : 0;
}

function rotate(dir) { // dir: +1 CW, -1 CCW
  if (scene !== 'play' || dead || winT) return;
  if (anim) { queued = dir; return; }
  hist.push(JSON.stringify(st)); moves++;
  st = { ...st, r: (st.r + (dir > 0 ? 1 : 3)) % 4 };
  tilt = 0; preview = null;
  anim = { phase: 'rot', t: 0, from: dispAngle, to: targetAngle + dir * Math.PI / 2 };
  targetAngle = anim.to;
  SND.rot();
}
function startFall(delay) {
  const res = fall(L, st);
  const items = res.anim.filter((a) => a.d > 0).map((a) => ({ ...a, dur: Math.sqrt((2 * a.d) / 70) + 0.02, landed: false }));
  anim = { phase: 'fall', t: -delay, items, res, coinsDone: new Set(), maxDur: items.reduce((m, a) => Math.max(m, a.dur), 0) };
  if (!items.length) { finishFall(); }
}
function finishFall() {
  const res = anim.res; st = res.state; anim = null;
  if (res.result === 'win') { winT = 0.0001; SND.win(); burst(cellPos(L.goal), '#ffe27a', 30); }
  else if (res.result === 'dead') { dead = true; deadT = 0; SND.dead(); burst(cellPos(st.ball), '#ff6b8a', 24); vibe(40); }
  else if (queued) { const q = queued; queued = 0; rotate(q); }
}
function undo() {
  if (scene !== 'play' || anim || winT || !hist.length) return;
  st = JSON.parse(hist.pop()); moves = Math.max(0, moves - 1); dead = false;
  targetAngle = st.r * Math.PI / 2 + Math.round((dispAngle - st.r * Math.PI / 2) / (Math.PI * 2)) * Math.PI * 2;
  anim = { phase: 'rot', t: 0, from: dispAngle, to: targetAngle, undo: true };
  SND.undo();
}
function vibe(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// ---------- layout ----------
function layout() {
  const top = 64, bottom = 118;
  const N = L ? Math.max(L.W, L.H) : 9;
  const avail = Math.min(VW * 0.94, VH - top - bottom - 10);
  const fitK = 1 / (Math.abs(Math.cos(dispAngle)) + Math.abs(Math.sin(dispAngle)));
  const cs = Math.max(8, Math.floor(avail / N) * fitK);
  return { cx: VW / 2, cy: top + (VH - top - bottom) / 2, cs, N, top, bottom };
}
function cellPos(i) { const lay = layout(); return mazeToScreen((i % L.W) + 0.5, Math.floor(i / L.W) + 0.5, lay); }
function mazeToScreen(mx, my, lay = layout()) {
  const x = (mx - L.W / 2) * lay.cs, y = (my - L.H / 2) * lay.cs, a = dispAngle;
  return [lay.cx + x * Math.cos(a) - y * Math.sin(a), lay.cy + x * Math.sin(a) + y * Math.cos(a)];
}
function buttons() {
  const y = VH - 62, r = 34;
  return {
    ccw: { x: VW * 0.16, y, r }, cw: { x: VW * 0.84, y, r },
    undo: { x: VW * 0.39, y, r: 26 }, reset: { x: VW * 0.61, y, r: 26 },
  };
}
function burst([x, y], col, n) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = 60 + Math.random() * 200; particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 0.6 + Math.random() * 0.5, t: 0, col, s: 2 + Math.random() * 3 }); }
}
function dust([x, y], n, s) {
  for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6; const v = 30 + Math.random() * 70 * s; particles.push({ x: x + (Math.random() - 0.5) * 14, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.6, life: 0.35 + Math.random() * 0.3, t: 0, col: 'rgba(230,215,255,0.8)', s: 1.5 + Math.random() * 2, g: 0 }); }
}

// ---------- input ----------
let down = null, tilt = 0, preview = null, idleT = 0, ghosts = null;
function canAct() { return scene === 'play' && !anim && !dead && !winT; }
function setPreview(dir) {
  if (!dir || !canAct()) { preview = null; return; }
  if (preview && preview.dir === dir) return;
  preview = { dir, res: fall(L, { ...st, r: (st.r + (dir > 0 ? 1 : 3)) % 4 }), t: 0 };
  tone(dir > 0 ? 660 : 560, 0.05, 'sine', 0.05);
}
function hitButton(x, y) { const B = buttons(); for (const k in B) { const b = B[k]; if (Math.hypot(x - b.x, y - b.y) < b.r + 10) return k; } return null; }
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault(); initAudio();
  if (down) return;
  down = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId, btn: null }; idleT = 0;
  if (scene === 'play') {
    down.btn = hitButton(e.clientX, e.clientY);
    if ((down.btn === 'cw' || down.btn === 'ccw') && canAct()) { const d = down.btn === 'cw' ? 1 : -1; tilt = d * 0.2; setPreview(d); }
  }
});
cv.addEventListener('pointermove', (e) => {
  if (!down || down.id !== e.pointerId || scene !== 'play' || down.btn) return;
  if (!canAct()) { tilt = 0; preview = null; return; }
  const dx = e.clientX - down.x;
  tilt = Math.max(-1, Math.min(1, dx / (VW * 0.55))) * 0.8;
  setPreview(Math.abs(dx) > 28 ? Math.sign(dx) : 0);
});
cv.addEventListener('pointerup', (e) => {
  if (!down || down.id !== e.pointerId) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y; const d0 = down; down = null;
  const wasTilt = tilt; tilt = 0; preview = null;
  if (scene === 'play' && d0.btn) {
    if (hitButton(e.clientX, e.clientY) === d0.btn) press(d0.btn);
    return;
  }
  if (scene === 'title') { if (sceneT > 0.3) { const ch = titleChips().find((c) => Math.abs(e.clientX - c.x) < c.w / 2 + 3 && Math.abs(e.clientY - c.y) < c.h / 2 + 3); if (ch) lvIdx = ch.i; SND.click(); scene = 'play'; loadLevel(lvIdx); signal('start'); } return; }
  if (scene === 'clear') { if (sceneT > 0.7) { SND.click(); if (lvIdx + 1 < LEVELS.length) { loadLevel(lvIdx + 1); scene = 'play'; signal('start'); } else { scene = 'all'; sceneT = 0; } } return; }
  if (scene === 'all') { if (sceneT > 0.7) { SND.click(); lvIdx = 0; L = null; scene = 'title'; sceneT = 0; } return; }
  if (scene !== 'play') return;
  if (Math.abs(dx) > 28) { rotate(dx > 0 ? 1 : -1); return; }
  if (Math.hypot(dx, dy) < 20 && dead) { undo(); return; }
});
cv.addEventListener('pointercancel', (e) => { if (down && down.id === e.pointerId) { down = null; tilt = 0; preview = null; } });
function press(k) {
  if (k === 'cw') rotate(1); else if (k === 'ccw') rotate(-1);
  else if (k === 'undo') undo();
  else if (k === 'reset') { if (!anim && !winT) { SND.undo(); loadLevel(lvIdx); } }
}

// ---------- update ----------
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016); last = ts;
  update(dt); draw(); requestAnimationFrame(frame);
}
function update(dt) {
  sceneT += dt; if (hintT > 0) hintT -= dt;
  if (scene === 'play') {
    if (anim) {
      anim.t += dt;
      if (anim.phase === 'rot') {
        const D = anim.undo ? 0.18 : 0.26, k = Math.min(1, anim.t / D), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
        dispAngle = anim.from + (anim.to - anim.from) * e;
        if (k >= 1) { dispAngle = anim.to; if (anim.undo) anim = null; else startFall(0.02); }
      } else if (anim.phase === 'fall') {
        for (const it of anim.items) {
          if (!it.landed && anim.t >= it.dur) {
            it.landed = true;
            const p = cellPos(it.to);
            if (!(it.k === 'b' && anim.res.result)) {
              if (it.k === 'b') SND.ball(it.d); else SND.crate(it.d);
              dust([p[0], p[1] + layout().cs * 0.45], 4 + it.d, it.k === 'c' ? 1.4 : 0.8);
              it.squash = 1;
              if (it.k === 'c' && it.d >= 2) shake = Math.min(6, it.d * 1.2);
            }
          }
          if (it.squash) it.squash = Math.max(0, it.squash - dt * 5);
        }
        for (const c of anim.res.coinAt) {
          const b = anim.items.find((x) => x.k === 'b');
          if (!anim.coinsDone.has(c.ci) && b && anim.t >= Math.sqrt((2 * c.d) / 70)) { anim.coinsDone.add(c.ci); SND.coin(); const p = cellPos(L.coin[c.ci]); burst(p, '#7ff0ff', 14); popups.push({ x: p[0], y: p[1], t: 0, txt: '◆' }); }
        }
        if (anim.t >= anim.maxDur + 0.05) { lastSquash = anim.items.filter((i) => i.squash).map((i) => ({ k: i.k, id: i.id, s: i.squash })); finishFall(); }
      }
    }
    if (!anim) dispAngle += (targetAngle + tilt * Math.PI / 2 - dispAngle) * Math.min(1, dt * 16);
    if (preview) preview.t += dt;
    if (canAct() && !down) idleT += dt; else { idleT = 0; ghosts = null; }
    if (canAct() && !ghosts) ghosts = [1, -1].map((d) => ({ d, res: fall(L, { ...st, r: (st.r + (d > 0 ? 1 : 3)) % 4 }) }));

function drawClear() {
  const lay = layout(); drawBoard(lay, 0.4);
  ctx.fillStyle = 'rgba(18,13,36,0.7)'; ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffd34d'; fitText(T.clear, VW * 0.8, 44, '900'); ctx.fillText(T.clear, VW / 2, VH * 0.24);
  ctx.fillStyle = '#fff'; fitText(`${T.stage} ${lvIdx + 1}`, VW * 0.8, 18); ctx.fillText(`${T.stage} ${lvIdx + 1}`, VW / 2, VH * 0.31);
  const labels = [T.s1, T.s2, T.s3];
  for (let i = 0; i < 3; i++) {
    const k = Math.max(0, Math.min(1, (sceneT - 0.25 - i * 0.3) * 4));
    if (k > 0 && !clearInfo['s' + i]) { clearInfo['s' + i] = 1; if (clearInfo.got[i]) SND.star(i); }
    const x = VW / 2 + (i - 1) * VW * 0.28, y = VH * 0.43;
    ctx.save(); ctx.translate(x, y); const sc = clearInfo.got[i] ? (k < 1 ? 0.5 + k * 0.8 : 1.1 - 0.1 * Math.min(1, (sceneT - 0.5 - i * 0.3) * 4)) : 1; ctx.scale(sc, sc);
    ctx.fillStyle = clearInfo.got[i] && k > 0 ? '#ffd34d' : progress.stars[lvIdx][i] ? 'rgba(255,211,77,0.35)' : 'rgba(255,255,255,0.18)';
    ctx.font = `900 52px ${FONT}`; ctx.fillText('★', 0, 0); ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; fitText(labels[i], VW * 0.27, 13, '600'); ctx.fillText(labels[i], x, y + 40);
  }
  ctx.fillStyle = '#fff'; const ml = `${T.moves} ${clearInfo.moves}  (${T.par} ${clearInfo.par})`; fitText(ml, VW * 0.8, 18); ctx.fillText(ml, VW / 2, VH * 0.56);
  ctx.fillStyle = '#ffd34d'; const tl = `${T.total} ${clearInfo.total}/${LEVELS.length * 3}`; fitText(tl, VW * 0.8, 20, '800'); ctx.fillText(tl, VW / 2, VH * 0.62);
  if (clearInfo.newStar) { ctx.fillStyle = '#8ff0a4'; fitText(T.best, VW * 0.8, 16, '800'); ctx.fillText(T.best, VW / 2, VH * 0.67); }
  if (sceneT > 0.7) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(sceneT * 4); ctx.fillStyle = '#fff'; fitText(T.next, VW * 0.8, 20, '800'); ctx.fillText(T.next, VW / 2, VH * 0.8); ctx.globalAlpha = 1; }
  for (const p of particles) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 6.283); ctx.fill(); }
  ctx.globalAlpha = 1;
}
function drawAll() {
  drawBg();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffd34d'; fitText(T.all, VW * 0.9, 34, '900'); ctx.fillText(T.all, VW / 2, VH * 0.3);
  const total = progress.stars.reduce((s, a) => s + a[0] + a[1] + a[2], 0);
  ctx.fillStyle = '#fff'; fitText(`★ ${total}/${LEVELS.length * 3}`, VW * 0.8, 40, '900'); ctx.fillText(`★ ${total}/${LEVELS.length * 3}`, VW / 2, VH * 0.45);
  if (sceneT > 0.7) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(sceneT * 4); fitText(T.cont, VW * 0.85, 18, '800'); ctx.fillText(T.cont, VW / 2, VH * 0.75); ctx.globalAlpha = 1; }
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBg();
  if (scene === 'title') drawTitle();
  else if (scene === 'play') drawPlay();
  else if (scene === 'clear') drawClear();
  else if (scene === 'all') drawAll();
}
requestAnimationFrame(frame);
</script>
