<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>三皿の苺ケーキ</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overscroll-behavior:none;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:#f3e7dc;color:#674d4a}
#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(#f6e6db,#eed3c9)}
header{position:absolute;top:4%;left:6%;right:6%;display:flex;justify-content:space-between;font-size:17px;font-weight:700}
#summary{position:absolute;top:17%;left:3%;width:94%;text-align:center;font-size:13px}
#message{position:absolute;top:11%;left:5%;width:90%;text-align:center;font-size:16px;white-space:pre-line}
canvas{position:absolute;top:20%;left:0;width:100%;height:55%}
#actions{position:absolute;top:80%;left:7%;width:86%;display:flex;justify-content:center;gap:12px}
button{min-width:120px;min-height:50px;border:2px solid #a17464;border-radius:15px;background:#fff7dc;color:#674d4a;font:17px system-ui}
button:disabled{opacity:.4}
#hint{position:absolute;bottom:5%;width:100%;text-align:center;font-size:14px}
#cover{position:absolute;inset:0;background:#f3e7dcf5;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:7%;text-align:center}
#cover.hidden{display:none}
#cover.result{background:transparent;justify-content:flex-end;padding:0 3% 2%}#cover.result h1{font-size:23px;background:#f3e7dc;margin:2px}#cover.result p{font-size:14px;background:#f3e7dc;margin:2px}
h1{font-size:clamp(25px,7vw,35px);margin:8px 0}p{font-size:17px;line-height:1.7;white-space:pre-line}
</style>
</head>
<body><div id="game">
<header><span id="score"></span><span id="stage"></span></header>
<div id="message"></div><div id="summary"></div><canvas id="cake"></canvas>
<div id="actions"><button id="undo"></button><button id="serve"></button></div>
<div id="hint"></div><div id="cover"></div>
</div>
<script>
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en');
const words={
ja:{title:'三皿の苺ケーキ',intro:'切る部分をタップし、線で二つに。\n三皿それぞれに苺2粒。\n大きさもそろえよう。',start:'タップでスタート',again:'タップでもう一度',next:'タップで次へ',score:'合計',stage:'ケーキ',undo:'一手戻す',serve:'盛りつけ',hint:'引いた線は、まっすぐ端まで伸びる',selected:'選択中の苺',berries:'粒',pieces:'皿',invalid:'切る部分を選び、横切る線を引こう',ready:'三皿できたら、盛りつけよう',result:'三皿のできあがり',all:'三つのケーキを分けた',points:'点',plates:'各皿の苺',sizes:'大きさ'},
en:{title:'Three Plates of Strawberry Cake',intro:'Tap a piece, then draw a line to split it.\nGive each of three plates two berries.\nMatch their sizes too.',start:'Tap to start',again:'Tap to play again',next:'Tap to continue',score:'Total',stage:'Cake',undo:'Undo',serve:'Serve',hint:'Your line extends straight to the edges',selected:'Selected berries',berries:'',pieces:'plates',invalid:'Select a piece and draw across it',ready:'Serve when you have three plates',result:'Three plates are ready',all:'Three cakes shared',points:'points',plates:'Berries per plate',sizes:'Sizes'}
};
const t=words[LANG==='ja'?'ja':'en'],$=id=>document.getElementById(id),canvas=$('cake'),ctx=canvas.getContext('2d');
for(const type of ['contextmenu','selectstart','gesturestart'])addEventListener(type,e=>e.preventDefault(),{passive:false});
const signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};
const cakes=[
{poly:[[40,60],[320,60],[320,340],[40,340]],berries:[[95,130],[95,270],[210,110],[280,150],[210,250],[280,300]]},
{poly:Array.from({length:48},(_,i)=>[180+140*Math.cos(i/48*Math.PI*2),200+140*Math.sin(i/48*Math.PI*2)]),berries:[[95,160],[100,240],[190,110],[250,165],[200,265],[265,235]]},
{poly:[[40,120],[110,60],[250,60],[320,120],[290,340],[70,340]],berries:[[100,160],[110,280],[180,110],[180,270],[265,160],[255,280]]}
];
let mode='title',level=0,parts=[],selected=0,history=[],pointer=null,from=null,to=null,moved=0,total=0,ended=0,started=0;
function area(poly){return Math.abs(poly.reduce((sum,p,i)=>sum+p[0]*poly[(i+1)%poly.length][1]-poly[(i+1)%poly.length][0]*p[1],0))/2}
function inside(p,poly){
for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],dx=b[0]-a[0],dy=b[1]-a[1],cross=(p[0]-a[0])*dy-(p[1]-a[1])*dx,dot=(p[0]-a[0])*dx+(p[1]-a[1])*dy;if(dx*dx+dy*dy>.0000001&&Math.abs(cross)<.0001&&dot>=-.0001&&dot<=dx*dx+dy*dy+.0001)return true}
let result=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){
const a=poly[i],b=poly[j];
if((a[1]>p[1])!==(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])result=!result;
}return result;
}
function berryCounts(){const counts=parts.map(()=>0);for(const berry of cakes[level].berries){const owner=parts.findIndex(poly=>inside(berry,poly));if(owner>=0)counts[owner]++}return counts}
function assess(){const full=area(cakes[level].poly),sizes=parts.map(p=>area(p)/full),counts=berryCounts();
const points=Math.max(0,Math.round(100-sizes.reduce((sum,n)=>sum+Math.abs(n-1/3),0)*120-counts.reduce((sum,n)=>sum+Math.abs(n-2),0)*12));return {sizes,counts,points}}
function clip(poly,a,b,side){
const distance=p=>side*((b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]));
const out=[];
for(let i=0;i<poly.length;i++){
const p=poly[i],q=poly[(i+1)%poly.length],dp=distance(p),dq=distance(q);
if(dp>=0)out.push(p);
if((dp>=0)!==(dq>=0)){const f=dp/(dp-dq);out.push([p[0]+(q[0]-p[0])*f,p[1]+(q[1]-p[1])*f])}
}
return out;
}
function cover(title,body,action){$('cover').innerHTML='<h1>'+title+'</h1><p>'+body+'</p><p>'+action+'</p>';$('cover').classList.toggle('result',mode==='result');$('cover').classList.remove('hidden')}
function begin(){
parts=[cakes[level].poly.map(p=>p.slice())];selected=0;history=[];pointer=null;from=null;to=null;mode='play';started=performance.now();$('cover').classList.add('hidden');$('actions').style.visibility='visible';$('hint').textContent=t.hint;signal('start');update();
}
function update(){
$('score').textContent=t.score+' '+total;
$('stage').textContent=t.stage+' '+(level+1)+'/3';
$('message').textContent=t.selected+' '+berryCounts()[selected]+t.berries+' · '+t.sizes+' '+Math.round(area(parts[selected])/area(cakes[level].poly)*100)+'%\n'+parts.length+'/3 '+t.pieces;
$('summary').textContent=berryCounts().map((n,i)=>n+t.berries+' · '+Math.round(area(parts[i])/area(cakes[level].poly)*100)+'%').join(' | ');
$('undo').textContent=t.undo;$('serve').textContent=t.serve+(parts.length===3?' '+assess().points:'');$('undo').disabled=!history.length;$('serve').disabled=parts.length!==3;
}
function split(a,b){
if(parts.length>=3){$('message').textContent=t.ready;return}
const poly=parts[selected],left=clip(poly,a,b,1),right=clip(poly,a,b,-1);
if(left.length<3||right.length<3||area(left)<400||area(right)<400){$('message').textContent=t.invalid;return}
history.push(parts.map(poly=>poly.map(p=>p.slice())));parts.splice(selected,1,left,right);
selected=parts.reduce((best,p,i)=>area(p)>area(parts[best])?i:best,0);update();
}
function point(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)/Math.max(1,r.width)*360,(e.clientY-r.top)/Math.max(1,r.height)*400]}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(mode!=='play'||pointer!==null)return;pointer=e.pointerId;canvas.setPointerCapture(pointer);from=point(e);to=from;moved=0});
canvas.addEventListener('pointermove',e=>{if(e.pointerId!==pointer)return;to=point(e);moved=Math.max(moved,Math.hypot(to[0]-from[0],to[1]-from[1]))});
canvas.addEventListener('pointerup',e=>{
if(e.pointerId!==pointer)return;pointer=null;to=point(e);
if(moved<15){const index=parts.findIndex(p=>inside(to,p));if(index>=0){selected=index;update()}}
else split(from,to);
from=null;to=null;
});
canvas.addEventListener('pointercancel',e=>{if(e.pointerId===pointer){pointer=null;from=null;to=null}});
$('undo').addEventListener('pointerdown',e=>{e.preventDefault();if(mode!=='play'||!history.length)return;parts=history.pop();selected=parts.reduce((best,p,i)=>area(p)>area(parts[best])?i:best,0);update()});
$('serve').addEventListener('pointerdown',e=>{
e.preventDefault();if(mode!=='play'||parts.length!==3)return;
const {sizes,counts,points}=assess();
$('actions').style.visibility='hidden';total+=points;mode='result';ended=performance.now();$('hint').textContent='';update();signal('end',{score:points});
cover(level===2?t.all:t.result,(level===2?t.score+' '+total+'/300\n':points+' '+t.points+'\n')+t.plates+' '+counts.join(' / ')+'\n'+t.sizes+' '+sizes.map(n=>Math.round(n*100)+'%').join(' / '),level===2?t.again:t.next);
});
$('cover').addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='title'){begin();return}if(mode==='result'&&performance.now()-ended>=700){if(level===2){level=0;total=0}else level++;begin()}});
function paint(){
const r=canvas.getBoundingClientRect();if(r.width<=0||r.height<=0)return;
const dpr=Math.min(2,devicePixelRatio||1);
if(canvas.width!==Math.round(r.width*dpr)||canvas.height!==Math.round(r.height*dpr)){canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr)}
ctx.setTransform(canvas.width/360,0,0,canvas.height/400,0,0);ctx.clearRect(0,0,360,400);
parts.forEach((poly,i)=>{
ctx.beginPath();poly.forEach(([x,y],j)=>j?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=['#fff1b6','#ead2b1','#e5c1a9'][i];ctx.fill();ctx.strokeStyle='#b18c73';ctx.lineWidth=2;ctx.stroke();if(i===selected&&mode==='play'){ctx.strokeStyle='#6b4e4b';ctx.lineWidth=4;ctx.setLineDash([7,5]);ctx.stroke();ctx.setLineDash([])}
});
for(const [x,y] of cakes[level].berries){
ctx.fillStyle='#a55355';ctx.beginPath();ctx.moveTo(x,y+12);ctx.bezierCurveTo(x-25,y-3,x-12,y-20,x,y-10);ctx.bezierCurveTo(x+12,y-20,x+25,y-3,x,y+12);ctx.fill();ctx.fillStyle='#6d9470';ctx.beginPath();ctx.moveTo(x-10,y-9);ctx.lineTo(x,y-14);ctx.lineTo(x+10,y-9);ctx.fill();
ctx.fillStyle='#f8dda2';for(const [dx,dy] of [[-5,-2],[5,-2],[0,5]])ctx.fillRect(x+dx-1,y+dy-1,2,2);
}
if(from&&to){ctx.strokeStyle='#a65050';ctx.lineWidth=3;ctx.setLineDash([6,5]);ctx.beginPath();const dx=to[0]-from[0],dy=to[1]-from[1],d=Math.hypot(dx,dy)||1;ctx.moveTo(from[0]-dx/d*600,from[1]-dy/d*600);ctx.lineTo(to[0]+dx/d*600,to[1]+dy/d*600);ctx.stroke();ctx.setLineDash([])}
}
function loop(){if(mode==='play'&&performance.now()-started>5000)$('hint').textContent='';paint();requestAnimationFrame(loop)}
parts=[cakes[0].poly];update();cover(t.title,t.intro,t.start);requestAnimationFrame(loop);
</script>
</body></html>
