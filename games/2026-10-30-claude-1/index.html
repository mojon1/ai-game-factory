addEventListener('message', (e) => { if (e.data && e.data.agf === 'loaded' && e.data.data) { best = e.data.data.best || 0; updHud(); } });

// ---------- audio ----------
let AC = null, master = null, noiseBuf = null, amb = null;
function initAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); let b = 0;
      for (let i = 0; i < d.length; i++) { d[i] = Math.random() * 2 - 1; }
      // festival murmur: slow brown noise through a band-pass
      const bb = AC.createBuffer(1, AC.sampleRate * 4, AC.sampleRate), bd = bb.getChannelData(0);
      for (let i = 0; i < bd.length; i++) { b = (b + 0.02 * (Math.random() * 2 - 1)) / 1.02; bd[i] = b * 3.2; }
      const src = AC.createBufferSource(); src.buffer = bb; src.loop = true;
      const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = 0.6;
      amb = AC.createGain(); amb.gain.value = 0.0;
      src.connect(bp); bp.connect(amb); amb.connect(master); src.start();
      amb.gain.setTargetAtTime(0.18, AC.currentTime, 1.5);
    }
    if (AC.state !== 'running') AC.resume();
  } catch (e) { AC = null; }
}
function noise(t, dur, f, q, vol, type = 'bandpass', f2) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur); fl.Q.value = q;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + dur + 0.02);
}
function tone(t, f, dur, vol, type = 'sine', f2) {
  const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0006, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
const SND = {
  pop() { if (!AC) return; const t = AC.currentTime; tone(t, 760, 0.07, 0.5, 'sine', 210); noise(t, 0.05, 1600, 1.2, 0.5); noise(t + 0.01, 0.12, 500, 0.8, 0.12, 'lowpass'); },
  click() { if (!AC) return; const t = AC.currentTime; noise(t, 0.025, 3500, 4, 0.18); tone(t + 0.03, 2400, 0.03, 0.06, 'square'); },
  hit(m) { if (!AC) return; const t = AC.currentTime; const f = 2300 - Math.min(1, m / 0.32) * 1500; tone(t, f, 0.06, 0.35, 'triangle', f * 0.7); noise(t, 0.04, f * 1.4, 3, 0.3); },
  thud() { if (!AC) return; const t = AC.currentTime; noise(t, 0.08, 900, 1, 0.12); },
  fall(m) { if (!AC) return; const t = AC.currentTime + 0.12; tone(t, 120 + 60 * (1 - Math.min(1, m / 0.32)), 0.18, 0.4, 'sine', 60); noise(t, 0.16, 300, 0.7, 0.35, 'lowpass'); },
  bell(big) {
    if (!AC) return; const t0 = AC.currentTime + 0.05; const n = big ? 7 : 3;
    for (let i = 0; i < n; i++) { const t = t0 + i * 0.13; const f = 1480 + (i % 2) * 160; tone(t, f, 0.5, 0.16, 'sine'); tone(t, f * 2.76, 0.25, 0.05, 'sine'); tone(t, f * 0.5, 0.4, 0.05, 'triangle'); }
    if (big) for (let i = 0; i < 4; i++) tone(t0 + 0.95 + i * 0.09, [784, 988, 1175, 1568][i], 0.45, 0.13, 'triangle');
  },
  dry() { if (!AC) return; const t = AC.currentTime; noise(t, 0.02, 2500, 3, 0.08); },
  creak() { if (!AC) return; const t = AC.currentTime; tone(t, 190, 0.22, 0.07, 'sawtooth', 150); },
  bonus() { if (!AC) return; const t = AC.currentTime + 0.4; [988, 1319, 1760].forEach((f, i) => tone(t + i * 0.08, f, 0.25, 0.12, 'triangle')); },
};

const CAM = new THREE.Vector3(0, 1.16, 1.6), LOOK = new THREE.Vector3(0, 1.12, 0);

function ctex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const std = (o) => new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.75, metalness: 0 }, o));

// stall: curtain, shelf, counter, lanterns
const curtainTex = ctex(256, 64, (g, w, h) => { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#f4eadc' : '#c8322e'; g.fillRect(i * 32, 0, 32, h); } });

  for (let i = 0; i < 16; i++) { g.beginPath(); g.arc(i * 32 + 16, h * 0.55, 16, 0, Math.PI); g.fill(); }
  g.fillStyle = '#f2d27a'; for (let i = 0; i < 16; i++) { g.beginPath(); g.arc(i * 32 + 16, h * 0.3, 3, 0, 7); g.fill(); }
});

valance.position.set(0, 1.95, 0.35); scene.add(valance);

});

{

{ const g = new CANNON.Body({ mass: 0 }); g.addShape(new CANNON.Plane()); g.quaternion.setFromEuler(-Math.PI / 2, 0, 0); world.addBody(g); }

  const mesh = new THREE.Mesh(corkGeo, corkMat); mesh.castShadow = true; mesh.position.copy(m0); scene.add(mesh);
  corkFlights.push({ mesh, pos: m0.clone(), vel: dir.multiplyScalar(CORK_SPEED), hit: false, t: 0, spin: new THREE.Vector3() });
  S.corks--; S.shot++; S.lastShot = S.t; S.reload = RELOAD; S.recoil = 1;
  loaded.visible = false; SND.pop(); updHud();
  return true;
}
function hitPrize(p, point, vel) {
  // push horizontally only: how high you hit decides how much it tips
  const dir = vel.clone().setY(0).normalize();
  const j = J * (0.92 + Math.random() * 0.16);
  const b = p.body; b.wakeUp();
  b.applyImpulse(new CANNON.Vec3(dir.x * j, dir.y * j, dir.z * j), new CANNON.Vec3(point.x - b.position.x, point.y - b.position.y, point.z - b.position.z));
  p.hitAt = S.t; p.wob = false; p.maxTilt = 0; p.shot = S.shot; p.checked = false;
  SND.hit(p.k.m);
  burst(point);
}
const sparks = [];
const sparkGeo = new THREE.SphereGeometry(0.004, 5, 4);
const sparkMat = new THREE.MeshBasicMaterial({ color: 0xfff1b0 });
function burst(pt) {
  for (let i = 0; i < 7; i++) {
    const m = new THREE.Mesh(sparkGeo, sparkMat); m.position.copy(pt); scene.add(m);
    sparks.push({ m, v: new THREE.Vector3((Math.random() - 0.5) * 1.2, Math.random() * 1.0 + 0.2, Math.random() * 0.8), t: 0 });
  }
}
const trailMat = new THREE.MeshBasicMaterial({ color: 0xfff4d8, transparent: true, opacity: 0.7, depthWrite: false });
const trailGeo = new THREE.SphereGeometry(0.0045, 5, 4);
const trails = [];
const ringGeo = new THREE.RingGeometry(0.012, 0.018, 20);
const rings = [];
function impactRing(pt, color) {
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color, transparent: true, depthTest: false, side: THREE.DoubleSide }));
  m.position.copy(pt); m.lookAt(camera.position); m.renderOrder = 5; scene.add(m); rings.push({ m, t: 0 });
}
const confGeo = new THREE.PlaneGeometry(0.014, 0.009);
const confMats = [0xff5a4a, 0xffd23a, 0x6ad1ff, 0x8cf07a, 0xff8ad8, 0xffffff].map((c) => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
const confs = [];
function confetti(at, n) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(confGeo, confMats[i % confMats.length]);
    m.position.set(at.x + (Math.random() - 0.5) * 0.1, at.y + 0.1, at.z + 0.15); scene.add(m);
    confs.push({ m, v: new THREE.Vector3((Math.random() - 0.5) * 1.4, 0.6 + Math.random() * 1.2, 0.2 + Math.random() * 0.6), r: new THREE.Vector3(Math.random() * 12, Math.random() * 12, Math.random() * 12), t: 0 });
  }
}
function updateConfetti(dt) {
  for (let i = confs.length - 1; i >= 0; i--) {
    const c = confs[i]; c.t += dt; c.v.y -= 2.2 * dt; c.v.multiplyScalar(1 - 1.6 * dt);
    c.m.position.addScaledVector(c.v, dt); c.m.rotation.x += c.r.x * dt; c.m.rotation.y += c.r.y * dt; c.m.rotation.z += c.r.z * dt;
    if (c.t > 2.4 || c.m.position.y < 0.3) { scene.remove(c.m); confs.splice(i, 1); }
  }
}
function updateCorks(dt) {
  updateConfetti(dt);
  for (let i = trails.length - 1; i >= 0; i--) { const q = trails[i]; q.t += dt; q.m.scale.setScalar(Math.max(0.01, 1 - q.t / 0.3)); if (q.t > 0.3) { scene.remove(q.m); trails.splice(i, 1); } }
  for (let i = rings.length - 1; i >= 0; i--) { const q = rings[i]; q.t += dt; q.m.scale.setScalar(1 + q.t * 9); q.m.material.opacity = Math.max(0, 1 - q.t / 0.4); if (q.t > 0.4) { scene.remove(q.m); q.m.material.dispose(); rings.splice(i, 1); } }
  for (let i = corkFlights.length - 1; i >= 0; i--) {
    const f = corkFlights[i]; f.t += dt;
    const p0 = f.pos.clone();
    f.vel.y -= (f.hit ? 9.8 : CORK_G) * dt;
    f.pos.addScaledVector(f.vel, dt);
    if (!f.hit) {
      for (let k = 1; k <= 3; k++) { const m = new THREE.Mesh(trailGeo, trailMat); m.position.lerpVectors(p0, f.pos, k / 3); scene.add(m); trails.push({ m, t: (3 - k) * 0.02 }); }
      const seg = tmpV.copy(f.pos).sub(p0); const len = seg.length();
      ray.set(p0, seg.normalize()); ray.far = len;
      const hits = ray.intersectObjects([...hitTargets, ...shelfMeshes], false);
      if (hits.length) {
        const h = hits[0]; f.pos.copy(h.point);
        const pz = h.object.userData.prize;
        if (pz && !pz.got) { hitPrize(pz, h.point, f.vel); impactRing(h.point, 0xffe066); } else { SND.thud(); impactRing(h.point, 0xbbbbbb); }
        f.hit = true;
        f.vel.set((Math.random() - 0.5) * 0.6, 0.4 + Math.random() * 0.4, Math.abs(f.vel.z) * 0.15);
        f.spin.set(Math.random() * 20, Math.random() * 20, 0);
      }
    }
    f.mesh.position.copy(f.pos);
    if (f.hit) { f.mesh.rotation.x += f.spin.x * dt; f.mesh.rotation.z += f.spin.y * dt; }
    else f.mesh.lookAt(tmpV2.copy(f.pos).add(f.vel)), f.mesh.rotateX(Math.PI / 2);
    if (f.t > 1.6 || f.pos.y < 0.1) { scene.remove(f.mesh); corkFlights.splice(i, 1); }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.t += dt; s.v.y -= 4 * dt; s.m.position.addScaledVector(s.v, dt); s.m.scale.setScalar(Math.max(0.01, 1 - s.t / 0.35));
    if (s.t > 0.35) { scene.remove(s.m); sparks.splice(i, 1); }
  }
}

// ---------- prizes update ----------
const UP = new CANNON.Vec3(0, 1, 0), upW = new CANNON.Vec3();
function updatePrizes(dt) {
  for (const p of prizes) {
    const b = p.body;
    p.mesh.position.set(b.position.x, b.position.y, b.position.z);
    p.mesh.quaternion.set(b.quaternion.x, b.quaternion.y, b.quaternion.z, b.quaternion.w);
    if (p.gone) {
      p.gone += dt;
      if (p.gone > 1.2) { const s = Math.max(0.001, 1 - (p.gone - 1.2) / 0.3); p.mesh.scale.setScalar(s); if (s <= 0.001 && p.body.world) { world.removeBody(p.body); p.mesh.visible = false; } }
      continue;
    }
    if (S.mode !== 'play') continue;
    b.quaternion.vmult(UP, upW);
    const tilt = Math.acos(Math.min(1, Math.max(-1, upW.y))) * 57.3;
    if (S.t - p.hitAt < 1.2) {
      p.maxTilt = Math.max(p.maxTilt, tilt);
      if (!p.checked && S.t - p.hitAt > 0.45) {
        p.checked = true;
        if (p.maxTilt < 6 && p.k.m >= 0.2) popup(D.higher, b.position.x, b.position.y + 0.15, b.position.z, '#ffb0a0', 15, 1.3);
      }
      if (!p.wob && tilt > 11 && tilt < 70 && p.k.m >= 0.13) {
        p.wob = true; popup(D.wobble, b.position.x, b.position.y + 0.13, b.position.z, '#ffd6a0', 16, 0.9); SND.creak();
        if (!S.hint2 && p.k.m >= 0.2) { S.hint2 = true; }
      }
    }
    if (b.position.y < TIERS[p.tier] - 0.06) {
      p.got = true; p.gone = 0.001;
      S.score += p.k.pts; S.gotList.push(p.kind);
      const shot = p.shot > 0 ? p.shot : S.shot;
      S.shotGets[shot] = (S.shotGets[shot] || 0) + 1;
      popup(`+${p.k.pts} ${D.names[p.kind]}`, b.position.x, TIERS[p.tier] + 0.12, b.position.z + 0.1, p.kind === 'toku' ? '#ffd23a' : '#fff1b0', p.k.pts >= 100 ? 26 : 20, 1.6);
      SND.fall(p.k.m); SND.bell(p.k.pts >= 100);
      if (p.k.pts >= 100) confetti(b.position, p.k.pts >= 300 ? 70 : 34);
      if (S.shotGets[shot] === 2) { S.corks++; S.bonusCorks++; SND.bonus(); screenPopup(D.bonus, W / 2, H * 0.2, '#9cf0ff', 20, 1.8); }
      for (const q of prizes) if (!q.got && q.body.sleepState) q.body.wakeUp();
      updHud();
    }
  }
}

// ---------- loop ----------
let last = 0, acc = 0;
const STEP = 1 / 120;
function frame(ts) {
  requestAnimationFrame(frame);
  const now = ts / 1000; let dt = last ? now - last : 0; last = now; dt = Math.min(dt, 0.05);
  S.t += dt;
  if (S.mode === 'play') {
    if (S.reload > 0) { S.reload -= dt; if (S.reload <= 0) { S.reload = 0; if (S.corks > 0) { loaded.visible = true; SND.click(); } } }
    if (S.wantFire) { if (S.corks > 0 && S.reload <= 0) { fire(); S.wantFire = false; } else if (S.corks <= 0) S.wantFire = false; }
    if (S.hintT > 0) { S.hintT -= dt; if (S.hintT <= 0) $('hint').style.opacity = 0; }
    const remaining = prizes.filter((p) => !p.got).length;
    if (remaining === 0 && !S.endAt) S.endAt = S.t + 1.6;
    if (S.corks <= 0 && !corkFlights.some((f) => !f.hit) && !S.endAt) {
      const moving = prizes.some((p) => !p.got && p.body.velocity.length() + p.body.angularVelocity.length() * 0.05 > 0.02);
      if (S.t - S.lastShot > 1.8 && !moving) S.endAt = S.t + 0.6;
      if (S.t - S.lastShot > 6) S.endAt = S.t;
    }
    if (S.endAt && S.t >= S.endAt) endGame(remaining === 0);
    if (S.hint2 && S.hintT <= 0 && !S.hint2Shown) { S.hint2Shown = true; showHint(D.hint2, 4); }
  }
  acc += dt; let n = 0;
  while (acc >= STEP && n < 8) { world.step(STEP); acc -= STEP; n++; }
  if (n >= 8) acc = 0;
  updateCorks(dt); updatePrizes(dt);
  // gun aim
  const target = aimPoint(tmpV2);
  S.recoil = Math.max(0, (S.recoil || 0) - dt * 6);
  gun.position.copy(GUN_BASE);
  if (S.mode !== 'play') gun.position.y -= 0.25;
  gun.lookAt(target); gun.translateZ(-S.recoil * 0.03);
  gun.updateMatrixWorld();
  // crosshair
  if (S.mode === 'play') { const [sx, sy] = swayOffset(S.t); const c = $('cross'); c.style.transform = `translate(${cross.x + sx}px, ${cross.y + sy}px)`; c.style.opacity = S.reload > 0 || S.corks <= 0 ? 0.45 : 1; }
  // lanterns flicker
  const fl = 1.5 + Math.sin(S.t * 7.1) * 0.06 + Math.sin(S.t * 13.3) * 0.04; lampLight.intensity = fl;
  lanterns.forEach((l, i) => { l.rotation.z = Math.sin(S.t * 0.9 + i) * 0.05; });
  // camera idle drift on title
  if (S.mode === 'title') { camera.position.set(CAM.x + Math.sin(S.t * 0.25) * 0.06, CAM.y, CAM.z); camera.lookAt(LOOK); }
  else { camera.position.lerp(CAM, Math.min(1, dt * 3)); camera.lookAt(LOOK); }
  // popups
  for (let i = popups.length - 1; i >= 0; i--) {
    const q = popups[i]; q.t += dt; let x, y;
    if (q.p) { tmpV.copy(q.p).project(camera); x = (tmpV.x + 1) / 2 * W; y = (1 - tmpV.y) / 2 * H; } else { x = q.sx; y = q.sy; }
    y -= q.t * 40; const a = q.t < q.life * 0.7 ? 1 : 1 - (q.t - q.life * 0.7) / (q.life * 0.3);
    q.el.style.left = Math.min(W - 60, Math.max(60, x)) + 'px'; q.el.style.top = y + 'px'; q.el.style.opacity = Math.max(0, a);
    if (q.t >= q.life) { q.el.remove(); popups.splice(i, 1); }
  }
  renderer.render(scene, camera);
}
layout();
updHud();
requestAnimationFrame(frame);
</script>
