<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>まぜまぜ絵の具 / Paint Drops</title>
<style>
html, body, canvas, * { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #efe7d6; color: #3a3128;
  font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
#cv { position: fixed; left: 0; top: 0; width: 100vw; height: 100dvh; display: block; }
.layer { position: fixed; left: 0; top: 0; width: 100vw; height: 100dvh; pointer-events: none; }
#hud { display: none; }
#hudL { position: absolute; left: 12px; top: 8px; font-size: 26px; font-weight: 800; line-height: 1.1; }
#hudL small { display: block; font-size: 13px; font-weight: 600; opacity: .7; }
#hudR { position: absolute; right: 12px; top: 10px; font-size: 14px; text-align: right; line-height: 1.4; font-weight: 600; }
#hint { position: absolute; left: 0; right: 0; bottom: 1.2%; text-align: center; font-size: 15px; font-weight: 600; opacity: 0; transition: opacity .6s; padding: 0 12px; }
.panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(88vw, 380px); box-sizing: border-box;
  background: rgba(255,251,242,.93); border-radius: 18px; padding: 22px 18px; text-align: center; box-shadow: 0 6px 26px rgba(80,60,30,.25); }
#title h1 { margin: 0 0 10px; font-size: clamp(30px, 10.5vw, 42px); letter-spacing: .03em; white-space: nowrap; }
#title h1 span { display: inline-block; }
#title p { margin: 6px 0; font-size: 15px; line-height: 1.55; }
.tap { margin-top: 14px; font-size: 16px; font-weight: 800; animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .4; } }
#result { display: none; }
#rHead { font-size: 18px; font-weight: 700; opacity: .75; }
#rBig { font-size: 60px; font-weight: 800; line-height: 1.1; margin-top: 4px; }
#rBest { font-size: 15px; margin-top: 6px; opacity: .85; }
#rNew { font-size: 18px; margin-top: 8px; color: #d4452e; font-weight: 800; }
#rStats { font-size: 14px; margin-top: 10px; line-height: 1.6; }
#rTap { visibility: hidden; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="layer" id="hud">
  <div id="hudL"><span id="score">0</span><small id="lvl"></small></div>
  <div id="hudR"><div id="best"></div><div id="maxc"></div></div>
  <div id="hint"></div>
</div>
<div class="layer" id="title">
  <div class="panel">
    <h1 id="tName"></h1>
    <p id="t1"></p>
    <p id="t2"></p>
    <p id="t3"></p>
    <div class="tap" id="tTap"></div>
  </div>
</div>
<div class="layer" id="result">
  <div class="panel">
    <div id="rHead"></div>
    <div id="rBig">0</div>
    <div id="rBest"></div>
    <div id="rNew"></div>
    <div id="rStats"></div>
    <div class="tap" id="rTap"></div>
  </div>
</div>
<script>
'use strict';
for (const t of ['contextmenu', 'selectstart', 'gesturestart']) addEventListener(t, (e) => e.preventDefault(), { passive: false });
const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const T = {
  ja: {
    name: 'まぜまぜ絵の具',
    t1: '絵の具のしずくを落とすと、下の色とまざる。',
    t2: '<b>まぜてできた色</b>が3つつながると消える。',
    t3: '<b>赤＋黄＝橙</b>　<b>黄＋青＝緑</b>　<b>青＋赤＝紫</b><br>まぜすぎると茶色のにごりに。',
    tap: 'タップでスタート',
    hint: '指を左右に動かして、はなすと落ちる',
    lv: 'レベル', best: 'ベスト', chain: 'れんさ', over: 'あふれた！',
    newBest: 'ベスト更新！', again: 'タップでもう一度',
    stDrops: 'しずく', stMix: 'まぜた', stMax: '最大れんさ',
    mud: 'にごり…', water: '水', wash: 'あらった！',
    lvUp: 'レベル', faster: 'はやくなる！',
    mixed: 'まざった！', seep: '下から絵の具がしみてきた', seepIn: 'しみだしまで',
  },
  en: {
    name: 'Paint Drops',
    t1: 'Drop paint — it mixes with the color below.',
    t2: 'Connect 3 <b>mixed</b> colors of a kind to clear them.',
    t3: '<b>Red+Yellow=Orange</b><br><b>Yellow+Blue=Green</b>　<b>Blue+Red=Purple</b><br>Mix too much and it turns to brown mud.',
    tap: 'Tap to start',
    hint: 'Slide left/right, let go to drop',
    lv: 'Level', best: 'Best', chain: 'chain', over: 'Overflow!',
    newBest: 'New best!', again: 'Tap to play again',
    stDrops: 'Drops', stMix: 'Mixes', stMax: 'Max chain',
    mud: 'Mud…', water: 'Water', wash: 'Washed!',
    lvUp: 'Level', faster: 'Faster!',
    mixed: 'Mixed!', seep: 'Paint seeps up from below', seepIn: 'Seep in',
  },
}[LANG === 'ja' ? 'ja' : 'en'];
document.documentElement.lang = LANG === 'ja' ? 'ja' : 'en';
const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };
const $ = (id) => document.getElementById(id);
$('tName').textContent = T.name; $('t1').textContent = T.t1; $('t2').innerHTML = T.t2; $('t3').innerHTML = T.t3; $('tTap').textContent = T.tap;
$('rTap').textContent = T.again;

// ---------- save ----------
let best = 0;
addEventListener('message', (e) => { if (e.data && e.data.agf === 'loaded' && e.data.data) { best = e.data.data.best || 0; updHud(); } });
try { parent.postMessage({ agf: 'load' }, '*'); } catch (e) {}
const saveBest = () => { try { parent.postMessage({ agf: 'save', data: { best } }, '*'); } catch (e) {} };

// ---------- colors ----------
const COL = {
  R: { f: '#e5484d', d: '#a82430' }, Y: { f: '#f4c22b', d: '#b98a05' }, B: { f: '#3a7bd8', d: '#1f4f9a' },
  O: { f: '#f08427', d: '#b2560b' }, G: { f: '#49a84a', d: '#2a6e2c' }, P: { f: '#8f58c9', d: '#5a3290' },
  M: { f: '#8b7763', d: '#5a4a3b' }, W: { f: '#bfe6f5', d: '#6fb5d3' },
};
const PRIM = ['R', 'Y', 'B'];
const isPrim = (k) => k === 'R' || k === 'Y' || k === 'B';
const SEC = { O: 'RY', G: 'YB', P: 'RB' };
function mixOf(a, b) { const s = [a, b].sort().join(''); return s === 'RY' ? 'O' : s === 'BY' ? 'G' : s === 'BR' ? 'P' : 'M'; }
// what happens when primary/water x lands on cell k
function react(x, k) {
  if (!k) return { t: 'stack' };
  if (x === 'W') return { t: 'wash' };
  if (k === x) return { t: 'stack' };
  if (isPrim(k)) return { t: 'mix', k: mixOf(x, k) };
  if (k === 'M') return { t: 'stack' };
  if (SEC[k].includes(x)) return { t: 'stack' };
  return { t: 'mud', k: 'M' };
}

// ---------- canvas ----------
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 360, H = 640, DPR = 1;
const COLS = 6, ROWS = 9;
let cell = 40, bx = 0, by = 0, topUI = 96; // by = y of board top
let paper = null;
function resize() {
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
  DPR = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  topUI = 92;
  const avail = H - topUI - 30;
  cell = Math.max(8, Math.floor(Math.min((W - 20) / COLS, avail / (ROWS + 1.7))));
  const used = cell * (ROWS + 1.7);
  bx = Math.floor((W - cell * COLS) / 2);
  by = Math.floor(topUI + Math.max(0, (avail - used) / 2) + cell * 1.7);
  makePaper();
}
function makePaper() {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(W * DPR / 2)); c.height = Math.max(1, Math.round(H * DPR / 2));
  const g = c.getContext('2d');
  g.fillStyle = '#efe7d6'; g.fillRect(0, 0, c.width, c.height);
  let s = 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < c.width * c.height / 30; i++) {
    const v = rnd();
    g.fillStyle = v < 0.5 ? 'rgba(120,95,60,0.05)' : 'rgba(255,255,255,0.18)';
    g.fillRect(rnd() * c.width, rnd() * c.height, 1 + rnd() * 2, 1 + rnd() * 2);
  }
  paper = c;
}
addEventListener('resize', () => { resize(); if (stains) makeStains(); });
resize();

// ---------- audio ----------
let ac = null, master = null;
function audioInit() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.32; master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
  } catch (e) { ac = null; }
}
function tone(f, dur, type = 'sine', vol = 0.3, f2 = 0, delay = 0) {
  if (!ac) return;
  try {
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
function noise(dur, vol, freq, delay = 0) {
  if (!ac) return;
  try {
    const t = ac.currentTime + delay;
    const n = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource(); s.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = ac.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start(t);
  } catch (e) {}
}
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28];
const note = (i) => 392 * Math.pow(2, PENTA[Math.min(PENTA.length - 1, i)] / 12);
const sfx = {
  land(c) { tone(520 + c * 40, 0.12, 'sine', 0.22, 300 + c * 25); },
  mix() { tone(330, 0.28, 'sine', 0.22, 520); tone(415, 0.26, 'triangle', 0.12, 660, 0.03); },
  mud() { noise(0.25, 0.35, 500); tone(150, 0.25, 'sine', 0.2, 90); },
  wash() { noise(0.35, 0.3, 2400); tone(900, 0.2, 'sine', 0.08, 1400); },
  clear(chain, n) { const base = (chain - 1) * 2; for (let i = 0; i < 3; i++) tone(note(base + i), 0.32, 'triangle', 0.2, 0, i * 0.06); if (n > 3) tone(note(base + 4), 0.4, 'sine', 0.15, 0, 0.2); },
  over() { for (let i = 0; i < 4; i++) tone(392 / Math.pow(1.19, i), 0.4, 'triangle', 0.18, 0, i * 0.14); },
  lv() { for (let i = 0; i < 4; i++) tone(note(4 + i), 0.18, 'sine', 0.15, 0, i * 0.07); },
  seep() { tone(110, 0.5, 'sine', 0.25, 160); noise(0.4, 0.12, 300); },
  tick() { tone(1200, 0.04, 'square', 0.04); },
};

// ---------- game state ----------
let grid; // grid[c][r] bottom r=0 -> {k, id, vy, flash, pop}
let uid = 1;
let phase = 'title'; // title, aim, fall, settle, clear, over
let cur = null, queue = [], aimCol = 2, hang = 0, hangMax = 6;
let score = 0, dropsN = 0, mixes = 0, maxChain = 0, chain = 0, level = 1;
let falling = null; // {k, c, y, vy, target}
let ghosts = [], parts = [], floats = [], ripples = [];
let phaseT = 0, overT = 0, startT = 0, hintShown = false, lastTick = 0;
let bag = [], riseIn = 6, fallMax = 0, shake = 0, stains = null;
function nextKind() {
  if (dropsN > 8 && Math.random() < 0.06 && !queue.includes('W')) return 'W';
  if (!bag.length) { bag = ['R', 'Y', 'B', 'R', 'Y', 'B']; for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; } }
  return bag.pop();
}
function mkCell(k) { return { k, id: uid++, vy: 0, flash: 0, pop: 0, wob: Math.random() * 6.28 }; }
function colH(c) { return grid[c].length; }

function newGame() {
  grid = Array.from({ length: COLS }, () => []);
  // starter paint: a full bottom row and a few on top (primaries only, so nothing reacts or clears)
  for (let c = 0; c < COLS; c++) grid[c].push(mkCell(PRIM[Math.floor(Math.random() * 3)]));
  for (const c of pickCols(3)) grid[c].push(mkCell(PRIM[Math.floor(Math.random() * 3)]));
  for (let c = 0; c < COLS; c++) grid[c].forEach((cl, r) => (cl.vy = r));
  score = 0; dropsN = 0; mixes = 0; maxChain = 0; chain = 0; level = 1; riseIn = riseEvery();
  bag = []; queue = [nextKind(), nextKind()];
  ghosts = []; parts = []; floats = []; ripples = []; makeStains();
  aimCol = 2; spawn();
  startT = now; hintShown = true;
  $('hint').textContent = T.hint; $('hint').style.opacity = 1;
  updHud();
  signal('start');
}
function pickCols(n) {
  const a = [...Array(COLS).keys()];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, n);
}
function riseEvery() { return Math.max(4, 9 - level); }
// paint seeps up from the bottom of a few columns; returns true on overflow
function seep() {
  const cols = [...Array(COLS).keys()];
  for (const c of cols) {
    const cl = mkCell(PRIM[Math.floor(Math.random() * 3)]);
    cl.vy = -1; grid[c].unshift(cl);
    splash(bx + (c + 0.5) * cell, by + ROWS * cell, COL[cl.k].f, 5);
  }
  sfx.seep();
  floatText(W / 2, by + ROWS * cell - cell * 0.8, T.seep, '#7a5a3a', 1.1);
  if (cols.some((c) => grid[c].length > ROWS)) { gameOver(); return true; }
  return false;
}
function hangTime() { return Math.max(2.4, 6 - (level - 1) * 0.5); }
function spawn() {
  cur = queue.shift(); queue.push(nextKind());
  hangMax = hangTime(); hang = hangMax; phase = 'aim';
}
function updHud() {
  $('score').textContent = score;
  $('lvl').textContent = `${T.lv} ${level}`;
  $('best').textContent = `${T.best} ${Math.max(best, score)}`;
  $('maxc').textContent = `${T.seepIn} ${Math.max(0, riseIn)}`;
}

function drop() {
  if (phase !== 'aim') return;
  const c = aimCol;
  const h = colH(c);
  falling = { k: cur, c, y: ROWS + 0.6, vy: 6, target: Math.max(0, h) };
  phase = 'fall'; dropsN++; riseIn--;
  if (hintShown && dropsN >= 2) { $('hint').style.opacity = 0; hintShown = false; }
}
function landFalling() {
  const f = falling; falling = null;
  const col = grid[f.c];
  const top = col[col.length - 1];
  const r = react(f.k, top && top.k);
  const cx = bx + (f.c + 0.5) * cell, cy = rowY(col.length - (top ? 1 : 0));
  chain = 0;
  if (r.t === 'stack') {
    if (f.k === 'W') { splash(cx, rowY(0), COL.W.f, 10); sfx.wash(); }
    else {
      if (col.length >= ROWS) { const cl = mkCell(f.k); cl.vy = col.length; col.push(cl); return gameOver(); }
      const cl = mkCell(f.k); cl.vy = col.length; cl.pop = 1; col.push(cl); sfx.land(f.c);
      splash(cx, rowY(col.length - 1), COL[f.k].f, 5);
    }
  } else if (r.t === 'wash') {
    col.pop(); sfx.wash(); score += 5;
    splash(cx, cy, COL[top.k].f, 14); splash(cx, cy, COL.W.f, 10);
    floatText(cx, cy, T.wash, '#3a8db5');
  } else if (r.t === 'mix') {
    top.k = r.k; top.flash = 1; top.pop = 1; mixes++; score += 2; sfx.mix();
    ripples.push({ x: cx, y: cy, r: cell * 0.3, a: 1, col: COL[r.k].f });
    splash(cx, cy, COL[r.k].f, 8);
  } else if (r.t === 'mud') {
    top.k = 'M'; top.flash = 1; top.pop = 1; sfx.mud();
    splash(cx, cy, COL.M.f, 10); floatText(cx, cy, T.mud, '#6b5a48');
  }
  afterChange();
}
function afterChange() {
  phase = 'settle'; phaseT = 0.12;
}
// gravity with reactions: cells that fall onto a different cell react like a drop
function gravity() {
  let moved = false;
  fallMax = 0;
  for (let c = 0; c < COLS; c++) {
    const col = grid[c];
    // cells are stored compact already (we use arrays) except where flagged "gone"
    if (!col.some((x) => x.gone)) continue;
    const orig = col.slice();
    const out = [];
    for (let i = 0; i < orig.length; i++) {
      const cl = orig[i];
      if (cl.gone) continue;
      const belowBefore = i === 0 ? 'floor' : orig[i - 1];
      const belowNow = out.length ? out[out.length - 1] : 'floor';
      if (belowNow !== belowBefore && belowNow !== 'floor' && isPrim(cl.k)) {
        const r = react(cl.k, belowNow.k);
        if (r.t === 'mix' || r.t === 'mud') {
          // falling cell merges into below
          const ty = out.length - 1 + 0.2;
          ghosts.push({ k: cl.k, c, y: cl.vy, ty, t: 0 });
          // logic changes now; the color shows when the falling drop arrives
          belowNow.showK = belowNow.k; belowNow.k = r.k; belowNow.react = r.t;
          belowNow.pendT = Math.max(0.05, (cl.vy - ty) / 14);
          fallMax = Math.max(fallMax, belowNow.pendT);
          if (r.t === 'mix') { mixes++; score += 2; }
          moved = true;
          continue;
        }
      }
      out.push(cl);
    }
    grid[c] = out;
    moved = true;
  }
  return moved;
}
function findGroups() {
  const seen = new Set(), groups = [];
  const at = (c, r) => (c >= 0 && c < COLS && r >= 0 && r < grid[c].length ? grid[c][r] : null);
  for (let c = 0; c < COLS; c++) for (let r = 0; r < grid[c].length; r++) {
    const s = grid[c][r];
    if (!s || !SEC[s.k] || seen.has(s)) continue; // only mixed colors clear
    const g = [], st = [[c, r]]; seen.add(s);
    while (st.length) {
      const [x, y] = st.pop(); g.push([x, y]);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const n = at(x + dx, y + dy);
        if (n && !seen.has(n) && n.k === s.k) { seen.add(n); st.push([x + dx, y + dy]); }
      }
    }
    if (g.length >= 3) groups.push({ k: s.k, cells: g });
  }
  return groups;
}
function doClear(groups) {
  chain++;
  maxChain = Math.max(maxChain, chain);
  let n = 0, pts = 0, sx = 0, sy = 0;
  const at = (c, r) => (c >= 0 && c < COLS && r >= 0 && r < grid[c].length ? grid[c][r] : null);
  for (const g of groups) {
    const per = 30;
    pts += per * g.cells.length + (g.cells.length - 3) * per;
    for (const [c, r] of g.cells) {
      const cl = grid[c][r]; cl.gone = true; n++;
      const x = bx + (c + 0.5) * cell, y = rowY(r); sx += x; sy += y;
      splash(x, y, COL[cl.k].f, 7); stain(x, y, COL[cl.k].f);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const m = at(c + dx, r + dy);
        if (m && m.k === 'M' && !m.gone) { m.gone = true; pts += 15; splash(bx + (c + dx + 0.5) * cell, rowY(r + dy), COL.M.f, 8); }
      }
    }
  }
  pts *= chain;
  score += pts;
  sfx.clear(chain, n);
  if (chain >= 2) shake = Math.min(0.5, 0.12 * chain);
  const cx = sx / n, cy = sy / n;
  floatText(cx, cy, chain >= 2 ? `${chain}${T.chain}! +${pts}` : `+${pts}`, chain >= 2 ? '#d4452e' : '#3a3128', chain >= 2 ? 1.5 : 1.25);
  for (let c = 0; c < COLS; c++) for (const cl of grid[c]) if (cl.gone) cl.dying = 1;
}
function rowY(r) { return by + (ROWS - r - 0.5) * cell; }

function stepLogic(dt) {
  if (phase === 'aim') {
    hang -= dt;
    if (hang < 1.5 && Math.floor(hang * 4) !== lastTick) { lastTick = Math.floor(hang * 4); if (hang > 0) sfx.tick(); }
    if (hang <= 0) drop();
  } else if (phase === 'fall') {
    const f = falling;
    f.vy += 60 * dt; f.y -= f.vy * dt;
    const stopY = f.target;
    if (f.y <= stopY) { f.y = stopY; landFalling(); }
  } else if (phase === 'settle') {
    phaseT -= dt;
    if (phaseT <= 0) {
      const g = findGroups();
      if (g.length) { doClear(g); phase = 'clear'; phaseT = 0.38; }
      else {
        // done: next drop
        chain = 0;
        const nl = 1 + Math.floor(dropsN / 14);
        if (nl > level) { level = nl; sfx.lv(); floatText(W / 2, by + cell * 2, `${T.lvUp} ${level}  ${T.faster}`, '#3a7bd8', 1.2); }
        if (riseIn <= 0) { riseIn = riseEvery(); if (seep()) return; }
        updHud();
        spawn();
      }
      updHud();
    }
  } else if (phase === 'clear') {
    phaseT -= dt;
    if (phaseT <= 0) {
      gravity();
      phase = 'settle'; phaseT = 0.26 + fallMax;
    }
  }
}
function gameOver() {
  phase = 'over'; overT = 0;
  sfx.over();
  const nb = score > best;
  if (nb) { best = score; saveBest(); }
  signal('end', { score });
  $('rHead').textContent = T.over;
  $('rBig').textContent = score;
  $('rBest').textContent = `${T.best} ${best}`;
  $('rNew').textContent = nb && score > 0 ? T.newBest : '';
  $('rStats').innerHTML = `${T.stDrops} ${dropsN}　${T.stMix} ${mixes}<br>${T.stMax} ${maxChain}　${T.lv} ${level}`;
  $('rTap').style.visibility = 'hidden';
  $('hint').style.opacity = 0;
  setTimeout(() => { $('result').style.display = 'block'; }, 600);
  updHud();
}

// ---------- effects ----------
function splash(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (40 + Math.random() * 140) * (cell / 40);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, r: (2 + Math.random() * 4) * (cell / 40), t: 0, life: 0.4 + Math.random() * 0.4, col });
  }
}
// watercolor stains left on the paper by every clear
function makeStains() {
  stains = document.createElement('canvas');
  stains.width = Math.max(1, Math.round(W * DPR / 2)); stains.height = Math.max(1, Math.round(H * DPR / 2));
}
function stain(x, y, col) {
  if (!stains) return;
  const g = stains.getContext('2d'), k = stains.width / W;
  for (let i = 0; i < 3; i++) {
    const px = (x + (Math.random() - 0.5) * cell * 1.6) * k, py = (y + (Math.random() - 0.5) * cell * 1.6) * k, r = cell * (0.5 + Math.random() * 0.7) * k;
    const gr = g.createRadialGradient(px, py, 0, px, py, r);
    gr.addColorStop(0, col + '18'); gr.addColorStop(0.75, col + '24'); gr.addColorStop(1, col + '00');
    g.fillStyle = gr; g.beginPath(); g.arc(px, py, r, 0, 7); g.fill();
  }
}
function floatText(x, y, s, col, sc = 1) { floats.push({ x, y, s, col, t: 0, sc }); }

// ---------- input ----------
let pid = null;
function colFromX(x) { return Math.max(0, Math.min(COLS - 1, Math.floor((x - bx) / cell))); }
cv.addEventListener('pointerdown', (e) => {
  audioInit();
  if (phase === 'title') { $('title').style.display = 'none'; $('hud').style.display = 'block'; newGame(); return; }
  if (phase === 'over') {
    if (overT < 1.3) return; // 0.6s delay + 0.7s guard
    $('result').style.display = 'none'; newGame(); return;
  }
  pid = e.pointerId;
  aimCol = colFromX(e.clientX);
});
cv.addEventListener('pointermove', (e) => {
  if (e.pointerId !== pid) return;
  aimCol = colFromX(e.clientX);
});
const up = (e) => {
  if (e.pointerId !== pid) return;
  pid = null;
  if (e.type === 'pointercancel') return;
  aimCol = colFromX(e.clientX);
  drop();
};
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);

// ---------- drawing ----------
function blob(x, y, r, k, a = 1, wob = 0, scale = 1) {
  const c = COL[k];
  r = Math.max(0.5, r * scale);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.beginPath();
  const N = 14;
  for (let i = 0; i <= N; i++) {
    const t = (i / N) * Math.PI * 2;
    const rr = r * (1 + 0.045 * Math.sin(t * 3 + wob) + 0.03 * Math.sin(t * 5 + wob * 2));
    const px = x + Math.cos(t) * rr, py = y + Math.sin(t) * rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, 'rgba(255,255,255,0.55)');
  g.addColorStop(0.35, c.f);
  g.addColorStop(1, c.f);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = Math.max(1.5, r * 0.09); ctx.strokeStyle = c.d; ctx.globalAlpha = a * 0.75; ctx.stroke();
  if (k === 'M') {
    ctx.globalAlpha = a * 0.5; ctx.fillStyle = c.d;
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(x + Math.cos(wob + i * 1.7) * r * 0.45, y + Math.sin(wob + i * 2.3) * r * 0.4, r * 0.09, 0, 7); ctx.fill(); }
  }
  if (k === 'W') {
    ctx.globalAlpha = a; ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.12;
    ctx.beginPath(); ctx.arc(x, y, r * 0.5, 3.6, 4.6); ctx.stroke();
  }
  ctx.restore();
}
function bridge(x1, y1, x2, y2, k, a) {
  ctx.save(); ctx.globalAlpha = a * 0.9; ctx.strokeStyle = COL[k].f; ctx.lineCap = 'round';
  ctx.lineWidth = cell * 0.5; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
}
function drawBoard(time) {
  // board paper card
  ctx.save();
  ctx.fillStyle = 'rgba(255,253,247,0.75)';
  ctx.strokeStyle = 'rgba(120,95,60,0.25)'; ctx.lineWidth = 2;
  roundRect(bx - 6, by - 4, cell * COLS + 12, cell * ROWS + 10, 12); ctx.fill(); ctx.stroke();
  // overflow line
  ctx.strokeStyle = 'rgba(200,70,60,0.35)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + cell * COLS, by); ctx.stroke(); ctx.setLineDash([]);
  // column guides
  ctx.strokeStyle = 'rgba(120,95,60,0.07)'; ctx.lineWidth = 1;
  for (let c = 1; c < COLS; c++) { ctx.beginPath(); ctx.moveTo(bx + c * cell, by); ctx.lineTo(bx + c * cell, by + ROWS * cell); ctx.stroke(); }
  ctx.restore();
  // aim column highlight
  if (phase === 'aim' || phase === 'fall') {
    const c = phase === 'aim' ? aimCol : falling.c;
    ctx.fillStyle = 'rgba(255,230,160,0.35)';
    ctx.fillRect(bx + c * cell + 2, by, cell - 4, ROWS * cell);
  }
}
const dk = (a) => (a.pendT > 0 ? a.showK : a.k);
// a drop that fell after a clear reaches the cell below and mixes into it
function arrive(a, x, y) {
  a.flash = 1.4; a.pop = 1;
  if (a.react === 'mix') { sfx.mix(); ripples.push({ x, y, r: cell * 0.3, a: 1, col: COL[a.k].f }); splash(x, y, COL[a.k].f, 8); floatText(x, y - cell * 0.5, T.mixed, COL[a.k].d, 0.9); }
  else { sfx.mud(); splash(x, y, COL.M.f, 10); floatText(x, y - cell * 0.5, T.mud, '#6b5a48', 0.9); }
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function drawCells(dt, time) {
  // bridges first
  for (let c = 0; c < COLS; c++) for (let r = 0; r < grid[c].length; r++) {
    const a = grid[c][r];
    const ax = bx + (c + 0.5) * cell, ay = by + (ROWS - a.vy - 0.5) * cell;
    const right = c + 1 < COLS ? grid[c + 1][r] : null, upc = grid[c][r + 1];
    const al = a.dying ? a.dying : 1;
    const ak = dk(a);
    if (right && dk(right) === ak && SEC[ak]) bridge(ax, ay, ax + cell, by + (ROWS - right.vy - 0.5) * cell, ak, al);
    if (upc && dk(upc) === ak && SEC[ak]) bridge(ax, ay, ax, by + (ROWS - upc.vy - 0.5) * cell, ak, al);
  }
  for (let c = 0; c < COLS; c++) for (let r = 0; r < grid[c].length; r++) {
    const a = grid[c][r];
    // animate vy toward r
    if (a.vy > r) a.vy = Math.max(r, a.vy - dt * 14);
    else if (a.vy < r) a.vy = Math.min(r, a.vy + dt * 5);
    a.flash = Math.max(0, a.flash - dt * 2.5); a.pop = Math.max(0, a.pop - dt * 4);
    let sc = 1 + Math.sin(a.pop * Math.PI) * 0.18, al = 1;
    if (a.dying) { a.dying = Math.max(0, a.dying - dt * 2.8); sc = 1 + (1 - a.dying) * 0.4; al = a.dying; }
    const x = bx + (c + 0.5) * cell, y = by + (ROWS - a.vy - 0.5) * cell;
    if (a.pendT > 0) { a.pendT -= dt; if (a.pendT <= 0) arrive(a, x, y); }
    blob(x, y, cell * 0.43, dk(a), al, a.wob + time * 0.6, sc);
    if (a.flash > 0) { ctx.save(); ctx.globalAlpha = Math.min(1, a.flash) * 0.6; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, cell * 0.43 * sc, 0, 7); ctx.fill(); ctx.restore(); }
  }
  // ghosts (cells that fell and merged)
  for (const g of ghosts) {
    g.y = Math.max(g.ty, g.y - dt * 14); if (g.y <= g.ty) g.t += dt;
    const x = bx + (g.c + 0.5) * cell, y = by + (ROWS - g.y - 0.5) * cell;
    blob(x, y, cell * 0.4, g.k, Math.max(0, 1 - g.t * 6), 0, 1 - g.t * 2);
  }
  ghosts = ghosts.filter((g) => g.t < 0.18);
}
function drawDropper(time) {
  if (!(phase === 'aim' || phase === 'fall')) return;
  const hy = by - cell * 0.95;
  if (phase === 'aim') {
    const x = bx + (aimCol + 0.5) * cell;
    // pipette
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.strokeStyle = 'rgba(90,70,50,0.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - cell * 0.13, hy - cell * 0.75); ctx.lineTo(x + cell * 0.13, hy - cell * 0.75); ctx.lineTo(x + cell * 0.06, hy - cell * 0.3); ctx.lineTo(x - cell * 0.06, hy - cell * 0.3); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    const sw = Math.sin(time * 5) * 0.04;
    blob(x, hy + cell * 0.08, cell * 0.36, cur, 1, time, 1 + sw);
    // timer ring
    const fr = Math.max(0, hang / hangMax);
    ctx.save(); ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.strokeStyle = fr < 0.3 ? '#d4452e' : 'rgba(90,70,50,0.55)';
    ctx.beginPath(); ctx.arc(x, hy + cell * 0.08, cell * 0.47, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * fr); ctx.stroke(); ctx.restore();
    drawPreview();
  } else {
    const f = falling;
    blob(bx + (f.c + 0.5) * cell, by + (ROWS - f.y - 0.5) * cell, cell * 0.36, f.k, 1, time);
  }
}
// what will happen in the aimed column
function drawPreview() {
  const col = grid[aimCol], top = col[col.length - 1];
  const r = react(cur, top && top.k);
  const x = bx + (aimCol + 0.5) * cell;
  ctx.save();
  if (r.t === 'stack' && cur !== 'W') {
    const ry = rowY(col.length);
    if (col.length < ROWS) { ctx.globalAlpha = 0.35; ctx.setLineDash([4, 4]); ctx.strokeStyle = COL[cur].d; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, ry, cell * 0.36, 0, 7); ctx.stroke(); }
    else { ctx.fillStyle = '#d4452e'; ctx.font = `800 ${Math.round(cell * 0.6)}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('!', x, by - cell * 0.15 + cell * 0.6); }
  } else if (r.t === 'mix' || r.t === 'mud') {
    const ry = rowY(col.length - 1);
    const pul = 0.6 + 0.4 * Math.sin(now * 8);
    ctx.globalAlpha = pul; ctx.lineWidth = Math.max(3, cell * 0.1); ctx.strokeStyle = COL[r.k].f;
    ctx.beginPath(); ctx.arc(x, ry, cell * 0.5, 0, 7); ctx.stroke();
    if (r.t === 'mud') {
      ctx.strokeStyle = '#5a4a3b'; ctx.lineWidth = 3; const d = cell * 0.18;
      ctx.beginPath(); ctx.moveTo(x - d, ry - d); ctx.lineTo(x + d, ry + d); ctx.moveTo(x + d, ry - d); ctx.lineTo(x - d, ry + d); ctx.stroke();
    }
  } else if (r.t === 'wash') {
    const ry = rowY(col.length - 1);
    ctx.globalAlpha = 0.5 + 0.4 * Math.sin(now * 8); ctx.strokeStyle = COL.W.d; ctx.lineWidth = 3; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.arc(x, ry, cell * 0.5, 0, 7); ctx.stroke();
  }
  ctx.restore();
}
function drawTopUI(time) {
  // legend (left) and next (right), between HUD and board
  const y = topUI - 22;
  const r = 8;
  ctx.save();
  ctx.font = `700 13px system-ui, -apple-system, sans-serif`; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(60,50,40,0.75)';
  let x = 14;
  const eqs = [['R', 'Y', 'O'], ['Y', 'B', 'G'], ['B', 'R', 'P']];
  const avail = W - 120;
  const unit = Math.max(30, Math.min(74, avail / 3));
  for (const [a, b, c] of eqs) {
    const s = unit / 74;
    blob(x + r * s, y, r * s, a, 1, 0); ctx.fillText('+', x + 22 * s, y);
    blob(x + 34 * s, y, r * s, b, 1, 0); ctx.fillText('=', x + 47 * s, y);
    blob(x + 60 * s, y, r * s * 1.1, c, 1, 0);
    x += unit;
  }
  // next
  const nx = W - 14;
  blob(nx - 10, y, 9, queue[1] || 'R', 0.55, 0);
  blob(nx - 36, y, 11, queue[0] || 'R', 1, 0);
  ctx.textAlign = 'right'; ctx.font = `700 12px system-ui, sans-serif`;
  ctx.fillText('NEXT', nx - 52, y);
  ctx.restore();
}
function drawFX(dt) {
  for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.vx *= 0.96; }
  parts = parts.filter((p) => p.t < p.life);
  for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life) * 0.85; ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const q of ripples) { q.r += dt * cell * 2.2; q.a -= dt * 2; }
  ripples = ripples.filter((q) => q.a > 0);
  for (const q of ripples) { ctx.globalAlpha = q.a; ctx.strokeStyle = q.col; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.stroke(); }
  ctx.globalAlpha = 1;
  for (const f of floats) f.t += dt;
  floats = floats.filter((f) => f.t < 1.1);
  for (const f of floats) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, (1.1 - f.t) * 2.5);
    const fs = Math.round(18 * f.sc);
    ctx.font = `800 ${fs}px system-ui, -apple-system, "Hiragino Sans", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let x = f.x; const w = ctx.measureText(f.s).width;
    x = Math.max(w / 2 + 6, Math.min(W - w / 2 - 6, x));
    const y = f.y - f.t * 40;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,252,244,0.9)'; ctx.strokeText(f.s, x, y);
    ctx.fillStyle = f.col; ctx.fillText(f.s, x, y);
    ctx.restore();
  }
}

let now = 0, lastTs = 0;
function frame(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - (lastTs || ts)) / 1000));
  lastTs = ts; now += dt;
  if (phase !== 'title' && phase !== 'over') stepLogic(dt);
  if (phase === 'over') { overT += dt; if (overT > 1.3) $('rTap').style.visibility = 'visible'; }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (paper) ctx.drawImage(paper, 0, 0, W, H); else { ctx.fillStyle = '#efe7d6'; ctx.fillRect(0, 0, W, H); }
  if (shake > 0) { shake = Math.max(0, shake - dt); const m = shake * 14; ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }
  if (grid) {
    drawBoard(now);
    if (stains) ctx.drawImage(stains, 0, 0, W, H);
    drawCells(dt, now);
    drawDropper(now);
    drawTopUI(now);
  } else {
    // title backdrop: some drifting drops
    for (let i = 0; i < 9; i++) {
      const k = ['R', 'Y', 'B', 'O', 'G', 'P'][i % 6];
      blob(W * ((i * 0.37 + 0.1) % 1), ((now * 30 + i * 97) % (H + 60)) - 30, 18 + (i % 3) * 6, k, 0.5, i);
    }
  }
  drawFX(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
