<!doctype html>
<html lang="ja">

<style>

<script>
(() => {
'use strict';
for (const t of ['contextmenu', 'selectstart', 'gesturestart']) addEventListener(t, (e) => e.preventDefault(), { passive: false });
const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };
const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const JA = LANG === 'ja';
const T = JA ? {

  pts: '点', best: 'ベスト', newBest: 'ベスト更新！',

} : {
  title: 'Roll It! Takoyaki Stand',
  how1: 'Swipe across empty wells to pour batter',
  how2: 'Swipe a ball to roll it — brown every side',
  how3: 'Tap when golden (✦) to serve. Red ! = burning',
  start: 'Tap to start', again: 'Tap to play again',
  pts: 'pts', best: 'Best', newBest: 'New best!',
  order: (n, m) => `Tray ${n}/${m}`,
  h0: 'Swipe across the empty wells to pour batter',
  h1: 'Ring glows yellow? Swipe toward the pale side to roll it',
  h2: 'Meter full and golden (✦)? Tap it to serve',
  hot: 'The heat is up!',
  hHot: 'Glowing red wells are hot spots — they cook faster!',
  soft: 'Still runny',
  g: ['Burnt…', 'Undercooked…', 'OK', 'Nice!', 'Perfect!'],
  boat: 'Order up!', boatAll: 'All good ones! +100',

};
document.title = T.title;
const $ = (id) => document.getElementById(id);
const hud = $('hud'), scEl = $('sc'), tmEl = $('tm'), odEl = $('od'), hintEl = $('hint'), popEl = $('pop'), ov = $('ov');

// ---------- save ----------
let best = 0;
addEventListener('message', (e) => {
  if (e.data && e.data.agf === 'loaded' && e.data.data && typeof e.data.data === 'object') {
    best = Math.max(best, +e.data.data.best || 0);
    if (state === 'title') showTitle();
  }
});
try { parent.postMessage({ agf: 'load' }, '*'); } catch (e) {}
const persist = () => { try { parent.postMessage({ agf: 'save', data: { best } }, '*'); } catch (e) {} };

// ---------- audio ----------
let AC = null, master = null, sizzleGain = null, noiseBuf = null;
function initAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.8; master.connect(AC.destination);
      const len = AC.sampleRate * 2;
      noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      // sizzle loop: hiss + crackles
      const sb = AC.createBuffer(1, len, AC.sampleRate), s = sb.getChannelData(0);
      for (let i = 0; i < len; i++) s[i] = (Math.random() * 2 - 1) * 0.35;
      for (let k = 0; k < 260; k++) { const p = (Math.random() * (len - 400)) | 0, a = 0.4 + Math.random() * 0.6; for (let j = 0; j < 120; j++) s[p + j] += (Math.random() * 2 - 1) * a * Math.exp(-j / 25); }
      const src = AC.createBufferSource(); src.buffer = sb; src.loop = true;
      const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2200;
      const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 9000;
      sizzleGain = AC.createGain(); sizzleGain.gain.value = 0;
      src.connect(hp); hp.connect(lp); lp.connect(sizzleGain); sizzleGain.connect(master); src.start();
    }
    if (AC.state !== 'running') AC.resume();
  } catch (e) { AC = null; }
}
function noiseHit(t0, dur, f, q, vol, type = 'bandpass') {
  if (!AC) return;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.playbackRate.value = 0.8 + Math.random() * 0.4;
  const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t0, Math.random()); s.stop(t0 + dur + 0.05);
}
function tone(t0, f0, f1, dur, vol, type = 'sine') {
  if (!AC) return;
  const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
}
const sfx = {
  pour() { if (!AC) return; const t = AC.currentTime; noiseHit(t, 0.5, 3500, 0.7, 0.32); tone(t, 260, 120, 0.12, 0.12); },
  roll(i) { if (!AC) return; const t = AC.currentTime; const f = 340 + (i % 4) * 30 + Math.random() * 30; tone(t, f, f * 0.55, 0.09, 0.22, 'triangle'); noiseHit(t, 0.05, 1800, 2, 0.08); },
  serve(g) { if (!AC) return; const t = AC.currentTime; tone(t, 900, 600, 0.06, 0.18, 'square'); tone(t, 220, 160, 0.08, 0.2);
    if (g >= 4) { tone(t + 0.05, 1320, 1320, 0.25, 0.12); tone(t + 0.12, 1760, 1760, 0.35, 0.1); }
    else if (g === 3) tone(t + 0.05, 1100, 1100, 0.2, 0.1);
    else if (g <= 1) tone(t + 0.04, 300, 180, 0.25, 0.12, 'sawtooth'); },
  soft() { if (!AC) return; const t = AC.currentTime; tone(t, 200, 260, 0.12, 0.12); tone(t + 0.1, 200, 260, 0.12, 0.1); },
  boat() { if (!AC) return; const t = AC.currentTime; [523, 659, 784, 1047].forEach((f, i) => tone(t + i * 0.08, f, f, 0.3, 0.12, 'triangle')); },
  tick() { if (!AC) return; tone(AC.currentTime, 1500, 1500, 0.04, 0.07, 'square'); },
  hot() { if (!AC) return; const t = AC.currentTime; noiseHit(t, 0.9, 1200, 0.5, 0.3, 'lowpass'); tone(t, 120, 60, 0.5, 0.15); },
  end() { if (!AC) return; const t = AC.currentTime; [784, 659, 523].forEach((f, i) => tone(t + i * 0.12, f, f, 0.4, 0.12, 'triangle')); },
};

// ---------- three ----------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 0.56, 0.1, 100);
scene.add(new THREE.HemisphereLight(0xfff6ea, 0x4a3020, 1.25));
const sun = new THREE.DirectionalLight(0xfff0d0, 1.9); sun.position.set(-3, 9, 6); scene.add(sun);


const COLS = 3, ROWS = 4, SP = 1.25, R = 0.5;
const PLATE_Z0 = -2.6; // row 0 z
const wellPos = [];
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) wellPos.push(new THREE.Vector3((c - 1) * SP, 0, PLATE_Z0 + r * SP));

function canvasTex(w, h, draw) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h); const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t; }
// plate
const plateTex = canvasTex(256, 320, (g, w, h) => {
  g.fillStyle = '#2b2622'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(${Math.random() < 0.5 ? '0,0,0' : '120,100,80'},${Math.random() * 0.12})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
});
const plate = new THREE.Mesh(new THREE.BoxGeometry(COLS * SP + 0.5, 0.5, ROWS * SP + 0.5), new THREE.MeshStandardMaterial({ map: plateTex, roughness: 0.75, metalness: 0.35 }));
plate.position.set(0, -0.25, PLATE_Z0 + (ROWS - 1) * SP / 2); scene.add(plate);
const wellTex = canvasTex(128, 128, (g, w) => {
  const gr = g.createRadialGradient(w / 2, w / 2, 4, w / 2, w / 2, w / 2);
  gr.addColorStop(0, '#060403'); gr.addColorStop(0.7, '#14100d'); gr.addColorStop(0.92, '#3c342e'); gr.addColorStop(1, 'rgba(60,52,46,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, w);
});
const wellGeo = new THREE.PlaneGeometry(1.18, 1.18);
const wellMat = new THREE.MeshBasicMaterial({ map: wellTex, transparent: true, depthWrite: false });
// glow ring (state of the hidden bottom)
const glowTex = canvasTex(128, 128, (g, w) => {
  const gr = g.createRadialGradient(w / 2, w / 2, w * 0.28, w / 2, w / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.45, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, w);
});
const glows = [];
for (const p of wellPos) {
  const gm = new THREE.Mesh(new THREE.PlaneGeometry(1.45, 1.45), new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xff5a10, opacity: 0 }));
  gm.rotation.x = -Math.PI / 2; gm.position.set(p.x, 0.012, p.z); scene.add(gm); glows.push(gm);
  const m = new THREE.Mesh(wellGeo, wellMat); m.rotation.x = -Math.PI / 2; m.position.set(p.x, 0.002, p.z); scene.add(m);
}
// counter (wood)
const woodTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#8a5a30'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 2) { g.fillStyle = `rgba(60,30,10,${0.08 + 0.08 * Math.sin(y * 0.21) ** 2})`; g.fillRect(0, y, w, 1); }
});
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping; woodTex.repeat.set(2, 3);
const counter = new THREE.Mesh(new THREE.PlaneGeometry(14, 22), new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.8 }));
counter.rotation.x = -Math.PI / 2; counter.position.set(0, -0.5, 1); scene.add(counter);

// ball geometry with per-vertex doneness
const BALL_GEO = new THREE.SphereGeometry(R, 22, 16);
const NV = BALL_GEO.attributes.position.count;
const NRM = BALL_GEO.attributes.normal.array;
const WGT = new Float32Array(NV); let WSUM = 0;
for (let i = 0; i < NV; i++) { const ny = NRM[i * 3 + 1]; WGT[i] = Math.sqrt(Math.max(0, 1 - ny * ny)) + 0.04; WSUM += WGT[i]; }
const GOLD_LO = 0.7, GOLD_HI = 2.4, WARN = GOLD_HI - 0.6;
const CSTOPS = [[0, 0xfaf3dc], [0.4, 0xf3e0a8], [0.7, 0xeaa844], [1.3, 0xd5831f], [2.0, 0xb0601a], [GOLD_HI - 0.05, 0x8a4214], [GOLD_HI + 0.15, 0x301608], [3.2, 0x120806]].map(([d, c]) => [d, new THREE.Color(c)]);
const _c = new THREE.Color();
function doneColor(d, out, i) {
  let k = 0; while (k < CSTOPS.length - 2 && d > CSTOPS[k + 1][0]) k++;
  const a = CSTOPS[k], b = CSTOPS[k + 1]; const t = Math.min(1, Math.max(0, (d - a[0]) / (b[0] - a[0])));
  _c.copy(a[1]).lerp(b[1], t);
  out[i] = _c.r; out[i + 1] = _c.g; out[i + 2] = _c.b;
}
// sparkle sprite
const sparkTex = canvasTex(64, 64, (g, w) => { g.translate(32, 32); g.fillStyle = '#fff6c0'; g.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? 7 : 28, a = i * Math.PI / 4; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.fill(); });
const puffTex = canvasTex(64, 64, (g, w) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,.9)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); });

// puffs (steam / smoke)
const puffs = [];
for (let i = 0; i < 60; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTex, transparent: true, depthWrite: false, opacity: 0 })); s.visible = false; scene.add(s); puffs.push({ s, life: 0, max: 1, vy: 0, vx: 0 }); }
let puffI = 0;
function puff(x, y, z, dark, big) {
  const p = puffs[puffI++ % puffs.length];
  p.s.visible = true; p.s.position.set(x + (Math.random() - 0.5) * 0.5, y, z + (Math.random() - 0.5) * 0.5);
  p.life = 0; p.max = 0.9 + Math.random() * 0.6; p.vy = 0.8 + Math.random() * 0.5; p.vx = (Math.random() - 0.5) * 0.2;
  p.s.material.color.set(dark ? 0x2a2420 : 0xffffff); p.base = dark ? 0.5 : 0.3; p.sz = (big ? 0.7 : 0.5) + Math.random() * 0.3;
}

// wells state
const wells = wellPos.map((p, i) => ({ i, p, ball: null, heat: 1 }));
function shuffleHeat() {
  const idx = wells.map((w) => w.i).sort(() => Math.random() - 0.5);
  wells.forEach((w) => w.heat = 1);
  wells[idx[0]].heat = 1.45; wells[idx[1]].heat = 1.45; wells[idx[2]].heat = 0.75; wells[idx[3]].heat = 0.75;
}
const balls = [];
function makeBall(well) {
  const geo = BALL_GEO.clone();
  const col = new Float32Array(NV * 3); geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.5, metalness: 0 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(well.p.x, 0.12, well.p.z);
  mesh.quaternion.setFromEuler(new THREE.Euler(Math.random() * 6, Math.random() * 6, 0));
  scene.add(mesh);
  const d = new Float32Array(NV); for (let i = 0; i < NV; i++) d[i] = Math.random() * 0.04;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: sparkTex, transparent: true, depthWrite: false, opacity: 0 }));
  sp.scale.set(0.45, 0.45, 1); sp.position.set(well.p.x + 0.32, 0.85, well.p.z - 0.1); scene.add(sp);
  const b = { well, mesh, geo, col, d, age: 0, rollT: 1, q0: new THREE.Quaternion(), q1: new THREE.Quaternion(), bottom: 0, quality: 0, burnt: 0, raw: 1, spark: sp, smokeT: 0, steamT: Math.random() * 0.3, served: false, dirty: true };
  // octopus bit falling in
  const tako = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 6), new THREE.MeshStandardMaterial({ color: 0xc83a3a, roughness: 0.5 }));
  tako.position.set(well.p.x, 1.4, well.p.z); scene.add(tako); b.tako = tako; b.takoT = 0;
  well.ball = b; balls.push(b); paintBall(b);
  return b;
}
const _q = new THREE.Quaternion(), _v = new THREE.Vector3(), DOWN = new THREE.Vector3(0, -1, 0);
function paintBall(b) {
  const c = b.col, d = b.d;
  for (let i = 0; i < NV; i++) doneColor(d[i], c, i * 3);
  b.geo.attributes.color.needsUpdate = true;
}
function evalBall(b) {
  let g = 0, bu = 0, rw = 0;
  for (let i = 0; i < NV; i++) { const w = WGT[i], x = b.d[i]; if (x >= GOLD_HI) bu += w; else if (x >= GOLD_LO) g += w; else rw += w; }
  b.quality = g / WSUM; b.burnt = bu / WSUM; b.raw = rw / WSUM;
}
function grade(b) {
  evalBall(b);
  const q = b.quality - b.burnt * 0.6;
  if (b.burnt > 0.25) return 0;
  if (q >= 0.86) return 4;
  if (q >= 0.7) return 3;
  if (q >= 0.45) return 2;
  return b.burnt > 0.12 ? 0 : 1;
}
const GPTS = [5, 10, 30, 60, 100];

// boat
const boatMat = new THREE.MeshStandardMaterial({ color: 0xe8d2a0, roughness: 0.85 });
const BOAT_N = 6, BOAT_Z = 3.15;
function makeBoat() {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.08, 1.7), boatMat); base.position.y = -0.36; g.add(base);
  const sideL = new THREE.Mesh(new THREE.BoxGeometry(3.3, 0.36, 0.08), boatMat);
  for (const z of [-0.88, 0.88]) { const s = sideL.clone(); s.position.set(0, -0.22, z); s.rotation.x = z < 0 ? 0.35 : -0.35; g.add(s); }
  for (const x of [-1.58, 1.58]) { const s = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.3, 1.8), boatMat); s.position.set(x, -0.24, 0); s.rotation.z = x < 0 ? -0.4 : 0.4; g.add(s); }
  g.position.set(-8, 0, BOAT_Z); scene.add(g);
  return { g, items: [], x: -8, tx: 0, leaving: false, done: false };
}
const SLOT = (k) => new THREE.Vector3((k % 3 - 1) * 0.92, -0.02, (Math.floor(k / 3) - 0.5) * 0.78);
let boat = null, oldBoats = [], flyers = [];
const sauceMat = new THREE.MeshStandardMaterial({ color: 0x3a1a0c, roughness: 0.25 });
const mayoMat = new THREE.MeshStandardMaterial({ color: 0xfff4d8, roughness: 0.4 });
const aonoriMat = new THREE.MeshBasicMaterial({ color: 0x3f7a2a });
const flakeMat = new THREE.MeshStandardMaterial({ color: 0xe8b090, roughness: 0.9, side: THREE.DoubleSide });
const sauceGeo = new THREE.SphereGeometry(R * 1.015, 18, 8, 0, Math.PI * 2, 0, 1.05);
const flakeGeo = new THREE.PlaneGeometry(0.2, 0.14);
const dotGeo = new THREE.BoxGeometry(0.04, 0.02, 0.04);
const flakes = [];
function dressBoat(bt) {
  for (const it of bt.items) {
    const s = new THREE.Mesh(sauceGeo, sauceMat); s.position.copy(it.mesh.position); s.scale.setScalar(0.001); bt.g.add(s); it.sauce = s;
    const m = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.025, 4, 14), mayoMat); m.rotation.x = -Math.PI / 2; m.position.copy(it.mesh.position); m.position.y += R * 0.78 * 0.95; m.scale.setScalar(0.001); bt.g.add(m); it.mayo = m;
    for (let k = 0; k < 6; k++) { const dd = new THREE.Mesh(dotGeo, aonoriMat); const a = Math.random() * 6.28, rr = Math.random() * 0.25; dd.position.set(it.mesh.position.x + Math.cos(a) * rr, it.mesh.position.y + R * 0.76, it.mesh.position.z + Math.sin(a) * rr); dd.visible = false; bt.g.add(dd); (it.dots ||= []).push(dd); }
    for (let k = 0; k < 2; k++) { const f = new THREE.Mesh(flakeGeo, flakeMat); f.position.set(it.mesh.position.x + (Math.random() - 0.5) * 0.3, it.mesh.position.y + R * 0.82, it.mesh.position.z + (Math.random() - 0.5) * 0.3); f.rotation.set(-1.2, Math.random() * 6, 0); f.visible = false; bt.g.add(f); flakes.push({ f, ph: Math.random() * 6, base: f.rotation.x }); (it.flk ||= []).push(f); }
  }
  bt.dressT = 0;
}

// ---------- camera fit ----------
let W = 1, H = 1, cellPx = 60;
function resize() {
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), tanH = tanV * camera.aspect;
  const needW = 2.75, needH = 3.9;
  const D = Math.max(needW / tanH, needH / tanV) * 1.02;
  const tilt = 0.55; // radians from vertical
  const cz = 0.45;
  camera.position.set(0, D * Math.cos(tilt), cz + D * Math.sin(tilt));
  camera.lookAt(0, -0.2, cz - 0.1);
  camera.updateProjectionMatrix();
  const a = toScreen(wellPos[0]), b = toScreen(wellPos[1]);
  cellPx = Math.max(30, Math.hypot(a.x - b.x, a.y - b.y));
}
const _p = new THREE.Vector3();
function toScreen(v) { _p.copy(v); _p.y += 0.2; _p.project(camera); return { x: (_p.x + 1) / 2 * W, y: (1 - _p.y) / 2 * H }; }
addEventListener('resize', resize);
resize();

// ---------- game state ----------
const ROUND = 90;
let state = 'title', score = 0, timeLeft = ROUND, served = 0, perfects = 0, boatsDone = 0, hot = false, overAt = 0, lastTick = -1;
let hotHinted = false, hintStage = 0, hintTimer = 0, popTimer = 0, streak = 0;
function showHint(s, dur = 3.5) { hintEl.textContent = s; hintEl.style.opacity = 1; hintTimer = dur; }
function showPop(s, color = '#ffe27a') { popEl.textContent = s; popEl.style.color = color; popEl.style.opacity = 1; popEl.style.transform = 'scale(1.15)'; setTimeout(() => popEl.style.transform = 'scale(1)', 90); popTimer = 1.1; }
function fmt(t) { t = Math.max(0, Math.ceil(t)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; }
function updHud() {
  scEl.innerHTML = `${score}<small>${T.pts}</small>`;
  tmEl.textContent = fmt(timeLeft); tmEl.classList.toggle('warn', timeLeft <= 10);
  odEl.textContent = `${T.order(boat ? boat.items.length : 0, BOAT_N)}  ·  ${T.best} ${best}`;
}
function showTitle() {
  ov.innerHTML = `<div class="card"><h1>${T.title}</h1><p>${T.how1}</p><p>${T.how2}</p><p>${T.how3}</p>${best ? `<p class="dim">${T.best} ${best}${T.pts}</p>` : ''}<p class="tap">${T.start}</p></div>`;
  ov.classList.remove('hide'); hud.classList.add('hide');
}
function clearBalls() {
  for (const b of balls) { scene.remove(b.mesh); scene.remove(b.spark); scene.remove(b.tako); b.geo.dispose(); }
  balls.length = 0; for (const w of wells) w.ball = null;
  for (const bt of [boat, ...oldBoats]) if (bt) scene.remove(bt.g);
  oldBoats = []; flyers = []; flakes.length = 0;
}
function startGame() {
  clearBalls();
  score = 0; timeLeft = ROUND; served = 0; perfects = 0; boatsDone = 0; hot = false; lastTick = -1; streak = 0;
  boat = makeBoat(); boat.tx = 0; shuffleHeat();
  state = 'play'; ov.classList.add('hide'); hud.classList.remove('hide');
  hintStage = 0; hotHinted = false; showHint(T.h0, 5);
  updHud(); signal('start');
}
function endGame() {
  state = 'over'; overAt = performance.now();
  hintEl.style.opacity = 0; hintTimer = 0;
  sfx.end();
  const nb = score > best; if (nb) { best = score; persist(); }
  signal('end', { score });
  ov.innerHTML = `<div class="card"><p class="rec" style="color:#fff">${T.timeUp}</p><div class="big">${score}<small>${T.pts}</small></div>${nb ? `<p class="rec">${T.newBest}</p>` : `<p class="dim">${T.best} ${best}${T.pts}</p>`}<div class="row"><span>${T.served(served)}</span><span>${T.perfect(perfects)}</span><span>${T.boats(boatsDone)}</span></div><p class="tap">${T.again}</p></div>`;
  ov.classList.remove('hide');
}

// ---------- actions ----------
function pour(w) {
  if (w.ball || state !== 'play') return;
  makeBall(w); sfx.pour();
  for (let k = 0; k < 3; k++) puff(w.p.x, 0.5, w.p.z, false, true);
  if (hintStage === 0) { hintStage = 1; setTimeout(() => { if (state === 'play' && hintStage === 1) showHint(T.h1, 4.5); }, 1600); }
}
function roll(b, dx, dy) {
  if (b.rollT < 1) { b.mesh.quaternion.copy(b.q1); }
  const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
  // screen right = +x, screen down = +z
  const ax = Math.abs(dx) > Math.abs(dy) ? new THREE.Vector3(0, 0, -Math.sign(dx)) : new THREE.Vector3(Math.sign(dy), 0, 0);
  _q.setFromAxisAngle(ax, Math.PI / 2);
  b.q0.copy(b.mesh.quaternion); b.q1.copy(_q).multiply(b.q0); b.rollT = 0;
  sfx.roll(b.well.i);
  if (b.bottom < 0.3) { b.mushy = (b.mushy || 0) + 1; }
}
function serve(b) {
  if (b.bottom < 0.4) { sfx.soft(); showPop(T.soft, '#fff'); b.wob = 0.4; return; }
  const g = grade(b);
  b.served = true; b.well.ball = null; balls.splice(balls.indexOf(b), 1);
  scene.remove(b.spark); scene.remove(b.tako);
  if (b.rollT < 1) b.mesh.quaternion.copy(b.q1);
  let pts = GPTS[g];
  if (g === 4) { streak++; pts += Math.min(100, (streak - 1) * 10); perfects++; } else streak = 0;
  score += pts; served++;
  sfx.serve(g);
  const colors = ['#ff7a5a', '#ffd0a0', '#fff', '#ffe27a', '#ffe27a'];
  showPop(`${T.g[g]} +${pts}${g === 4 && streak > 1 ? ` ×${streak}` : ''}`, colors[g]);
  scEl.classList.add('pop'); setTimeout(() => scEl.classList.remove('pop'), 120);
  // fly to boat
  const k = boat.items.length;
  const it = { mesh: b.mesh, grade: g };
  boat.items.push(it);
  const target = SLOT(k);
  const from = b.mesh.position.clone();
  boat.g.attach(b.mesh);
  flyers.push({ mesh: b.mesh, from: boat.g.worldToLocal(from.clone()), to: target, t: 0 });
  if (hintStage < 3) hintStage = 3;
  if (boat.items.length >= BOAT_N) finishBoat();
  updHud();
}
function finishBoat() {
  const bt = boat; bt.done = true; boatsDone++;
  const allGood = bt.items.every((it) => it.grade >= 3);
  setTimeout(() => { sfx.boat(); dressBoat(bt); showPop(allGood ? T.boatAll : T.boat, '#9fff9a'); if (allGood) { score += 100; updHud(); } }, 380);
  setTimeout(() => { bt.leaving = true; bt.tx = 9; }, 1250);
  oldBoats.push(bt);
  boat = makeBoat(); boat.x = -8; boat.g.position.x = -8; boat.tx = 0;
  boat.delay = 1.35;
}

// ---------- input ----------
const ptrs = new Map();
function hitWell(x, y) {
  let bi = -1, bd = cellPx * 0.58;
  for (const w of wells) { const s = toScreen(w.p); const d = Math.hypot(s.x - x, s.y - y); if (d < bd) { bd = d; bi = w.i; } }
  return bi;
}
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  if (state === 'title') { startGame(); return; }
  if (state === 'over') { if (performance.now() - overAt > 700) startGame(); return; }
  try { canvas.setPointerCapture(e.pointerId); } catch (er) {}
  const wi = hitWell(e.clientX, e.clientY);
  const p = { sx: e.clientX, sy: e.clientY, t: performance.now(), cur: wi, ex: e.clientX, ey: e.clientY, rolled: false, moved: 0, startWell: wi, pouredStart: false };
  if (wi >= 0 && !wells[wi].ball) { pour(wells[wi]); p.pouredStart = true; }
  ptrs.set(e.pointerId, p);
});
canvas.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId); if (!p || state !== 'play') return;
  const x = e.clientX, y = e.clientY;
  p.moved = Math.max(p.moved, Math.hypot(x - p.sx, y - p.sy));
  const thr = Math.max(14, cellPx * 0.2);
  const wi = hitWell(x, y);
  if (p.cur >= 0 && !p.rolled) {
    const b = wells[p.cur].ball;
    const dx = x - p.ex, dy = y - p.ey;
    if (b && !b.fresh && Math.hypot(dx, dy) > thr) { roll(b, dx, dy); p.rolled = true; }
  }
  if (wi !== p.cur) {
    p.cur = wi; p.ex = x; p.ey = y; p.rolled = false;
    if (wi >= 0 && !wells[wi].ball) { pour(wells[wi]); p.rolled = true; }
  }
});
function endPtr(e) {
  const p = ptrs.get(e.pointerId); if (!p) return; ptrs.delete(e.pointerId);
  if (state !== 'play') return;
  if (e.type === 'pointerup' && p.moved < 12 && performance.now() - p.t < 450 && p.startWell >= 0 && !p.pouredStart) {
    const b = wells[p.startWell].ball; if (b) serve(b);
  }
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);

// ---------- overlay (meters) ----------
const ui = $('ui'), ux = ui.getContext('2d');
let UDPR = 1;
function resizeUI() { UDPR = Math.min(devicePixelRatio || 1, 2); ui.width = Math.max(1, W * UDPR | 0); ui.height = Math.max(1, H * UDPR | 0); }
addEventListener('resize', resizeUI); resizeUI();
function drawUI(now) {
  ux.setTransform(UDPR, 0, 0, UDPR, 0, 0); ux.clearRect(0, 0, W, H);
  if (state !== 'play') return;
  const rr = cellPx * 0.43, lw = Math.max(4, cellPx * 0.08);
  ux.lineCap = 'round'; ux.textAlign = 'center'; ux.textBaseline = 'middle';
  for (const b of balls) {
    if (b.fresh) continue;
    const s = toScreen(b.well.p); const cx = s.x, cy = s.y + cellPx * 0.03;
    const burning = b.bottom > WARN, turn = !burning && b.bottom >= GOLD_LO;
    // ring background = state of the hidden bottom
    ux.lineWidth = lw;
    if (burning) ux.strokeStyle = `rgba(255,40,20,${0.55 + 0.45 * Math.sin(now / 60)})`;
    else if (turn) ux.strokeStyle = `rgba(255,236,150,${0.35 + 0.3 * Math.sin(now / 150)})`;
    else ux.strokeStyle = 'rgba(0,0,0,.45)';
    ux.beginPath(); ux.arc(cx, cy, rr, 0, Math.PI * 2); ux.stroke();
    const a0 = -Math.PI / 2, g = b.quality, bu = b.burnt;
    ux.lineWidth = lw * 0.62;
    if (g > 0.01) { ux.strokeStyle = g >= 0.86 && bu < 0.05 ? '#fff27a' : '#f0a63a'; ux.beginPath(); ux.arc(cx, cy, rr, a0, a0 + g * Math.PI * 2); ux.stroke(); }
    if (bu > 0.01) { ux.strokeStyle = '#3a0c06'; ux.beginPath(); ux.arc(cx, cy, rr, a0 - bu * Math.PI * 2, a0); ux.stroke(); }
    if (burning) {
      const bx = cx + rr * 0.72, by = cy - rr * 0.72, br = Math.max(11, cellPx * 0.15);
      ux.fillStyle = '#e8281a'; ux.beginPath(); ux.arc(bx, by, br, 0, Math.PI * 2); ux.fill();
      ux.fillStyle = '#fff'; ux.font = `900 ${Math.round(br * 1.5)}px system-ui, sans-serif`; ux.fillText('!', bx, by + 1);
    }
  }
}

// ---------- loop ----------
let last = performance.now();
const _lv = new THREE.Vector3(), _iq = new THREE.Quaternion();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  const playing = state === 'play';
  if (playing) {
    timeLeft -= dt;
    if (!hot && timeLeft <= ROUND / 2) { hot = true; showPop(T.hot, '#ff9a6a'); sfx.hot(); }
    const sec = Math.ceil(timeLeft);
    if (sec <= 10 && sec !== lastTick && sec > 0) { lastTick = sec; sfx.tick(); }
    if (timeLeft <= 0) { timeLeft = 0; updHud(); endGame(); }
    else tmEl.textContent = fmt(timeLeft), tmEl.classList.toggle('warn', timeLeft <= 10);
  }
  const heat = (hot ? 1.25 : 1.0) * 0.4;
  let cooking = 0, burning = 0, anyReady = false;
  for (const b of balls) {
    b.age += dt;
    // tako drop
    if (b.tako.visible) { b.takoT += dt; b.tako.position.y = 1.4 - b.takoT * b.takoT * 9; if (b.tako.position.y < 0.3) b.tako.visible = false; }
    const s = Math.min(1, b.age / 0.28); b.fresh = b.age < 0.3;
    // roll anim
    let hop = 0;
    if (b.rollT < 1) { b.rollT = Math.min(1, b.rollT + dt / 0.17); const t = 1 - (1 - b.rollT) ** 2; b.mesh.quaternion.slerpQuaternions(b.q0, b.q1, t); hop = Math.sin(b.rollT * Math.PI) * 0.16; }
    let wob = 0; if (b.wob > 0) { b.wob -= dt; wob = Math.sin(b.wob * 50) * 0.05; }
    b.mesh.position.y = 0.12 + hop;
    b.mesh.scale.set(s * (1 + wob), s * (0.92 + 0.08 * Math.min(1, b.bottom * 2) - wob), s * (1 + wob));
    if (playing) {
      // cook: local down vector
      _iq.copy(b.mesh.quaternion).invert(); _lv.copy(DOWN).applyQuaternion(_iq);
      const lx = _lv.x, ly = _lv.y, lz = _lv.z, d = b.d;
      let bsum = 0, bw = 0;
      const k = heat * b.well.heat * dt;
      for (let i = 0; i < NV; i++) {
        const dot = NRM[i * 3] * lx + NRM[i * 3 + 1] * ly + NRM[i * 3 + 2] * lz;
        if (dot > 0.05) { d[i] += k * dot * Math.sqrt(dot); if (dot > 0.8) { bsum += d[i]; bw++; } }
      }
      b.bottom = bw ? bsum / bw : 0;
      paintBall(b);
      cooking++;
      if (b.bottom > WARN) burning++;
    }
    // glow ring: orange when bottom golden, red when burning
    // sparkle when ready
    evalBall(b);
    const ready = b.quality >= 0.86 && b.burnt < 0.05;
    if (ready) anyReady = true;
    b.spark.material.opacity += ((ready ? 1 : 0) - b.spark.material.opacity) * Math.min(1, dt * 10);
    b.spark.material.rotation = now / 400;
    b.spark.position.y = 0.85 + Math.sin(now / 200 + b.well.i) * 0.06;
    // steam / smoke
    if (playing) {
      b.steamT -= dt; if (b.steamT <= 0) { b.steamT = 0.35 + Math.random() * 0.4; puff(b.mesh.position.x, 0.5, b.mesh.position.z, false, false); }
      if (b.bottom > WARN) { b.smokeT -= dt; if (b.smokeT <= 0) { b.smokeT = 0.12; puff(b.mesh.position.x, 0.4, b.mesh.position.z, true, true); } }
    }
  }
  if (playing && hintStage === 1 && balls.some((b) => b.quality > 0.6)) { hintStage = 2; showHint(T.h2, 4); }
  if (playing && hintStage === 2 && anyReady && hintTimer <= 0) { showHint(T.h2, 3); hintStage = 2.5; }
  if (playing && !hotHinted && hintTimer <= 0 && balls.some((b) => b.well.heat > 1.2 && b.bottom > GOLD_LO)) { hotHinted = true; showHint(T.hHot, 4); }
  // sizzle
  if (sizzleGain && AC) { const tgt = playing ? Math.min(0.5, 0.05 + cooking * 0.035 + burning * 0.05) : 0; sizzleGain.gain.setTargetAtTime(tgt, AC.currentTime, 0.15); }
  for (const w of wells) { const tgt = w.heat > 1.2 ? 0.75 + 0.2 * Math.sin(now / 240 + w.i) : w.heat < 0.9 ? 0 : 0.12; glows[w.i].material.opacity += (tgt - glows[w.i].material.opacity) * Math.min(1, dt * 4); glows[w.i].material.color.setHex(w.heat > 1.2 ? 0xff4a08 : 0xff8a30); }
  // puffs
  for (const p of puffs) {
    if (!p.s.visible) continue;
    p.life += dt; const t = p.life / p.max;
    if (t >= 1) { p.s.visible = false; continue; }
    p.s.position.y += p.vy * dt; p.s.position.x += p.vx * dt;
    p.s.material.opacity = p.base * Math.sin(t * Math.PI);
    const sc = p.sz * (0.6 + t); p.s.scale.set(sc, sc, 1);
  }
  // flyers
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i]; f.t = Math.min(1, f.t + dt / 0.42);
    const t = f.t, e = 1 - (1 - t) ** 2;
    f.mesh.position.lerpVectors(f.from, f.to, e); f.mesh.position.y += Math.sin(t * Math.PI) * 1.6;
    f.mesh.scale.setScalar(1 - 0.16 * e);
    if (t >= 1) flyers.splice(i, 1);
  }
  // boats
  for (const bt of [boat, ...oldBoats]) {
    if (!bt) continue;
    if (bt.delay > 0) { bt.delay -= dt; continue; }
    bt.x += (bt.tx - bt.x) * Math.min(1, dt * (bt.leaving ? 4 : 7));
    bt.g.position.x = bt.x;
    if (bt.dressT !== undefined && bt.dressT < 1) {
      bt.dressT = Math.min(1, bt.dressT + dt / 0.6);
      bt.items.forEach((it, k) => {
        const t = Math.min(1, Math.max(0, bt.dressT * 1.6 - k * 0.1));
        if (it.sauce) { it.sauce.scale.setScalar(Math.max(0.001, t * 0.84)); it.sauce.position.copy(it.mesh.position); it.sauce.position.y += 0.0; }
        if (it.mayo) it.mayo.scale.setScalar(Math.max(0.001, t));
        if (t > 0.6) { it.dots.forEach((d) => d.visible = true); it.flk.forEach((f) => f.visible = true); }
      });
    }
  }
  for (const f of flakes) { f.ph += dt * 6; f.f.rotation.x = f.base + Math.sin(f.ph) * 0.35; }
  for (let i = oldBoats.length - 1; i >= 0; i--) { const bt = oldBoats[i]; if (bt.leaving && bt.x > 8.5) { scene.remove(bt.g); oldBoats.splice(i, 1); } }
  // hint/pop timers
  if (hintTimer > 0) { hintTimer -= dt; if (hintTimer <= 0) hintEl.style.opacity = 0; }
  if (popTimer > 0) { popTimer -= dt; if (popTimer <= 0) popEl.style.opacity = 0; }
  if (playing) odEl.textContent = `${T.order(boat.items.length, BOAT_N)}  ·  ${T.best} ${best}`;
  renderer.render(scene, camera);
  drawUI(now);
}
showTitle();
// demo balls on title for atmosphere
(function demo() { [1, 4, 6, 10].forEach((i, k) => { const b = makeBall(wells[i]); b.tako.visible = false; b.age = 1; for (let j = 0; j < NV; j++) b.d[j] = 0.6 + Math.random() * 0.15 + (k * 0.1) + (NRM[j * 3 + 1] > 0.3 ? -0.3 : 0.3); paintBall(b); }); })();
requestAnimationFrame(frame);
})();
</script>
</body>
