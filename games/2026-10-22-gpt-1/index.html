const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),en=LANG==='en',T=en?{title:'Windpost Deck',a:'Play up to two cards, then face the wind.',b:'Walk 12 steps before turn 9 ends.',c:'Add a new card at each rest stop.',start:'Tap to start',progress:'Steps ',turn:'Turn ',hp:'Stamina ',block:'Cover ',energy:'Plays ',wind:'Wind coming: ',next:'Next wind: ',end:'Face the wind',deck:'Draw ',discard:'Discard ',hint:'Tap cards, then face the wind',reward:'Choose one card to add',rhelp:'It enters your discard pile, then reshuffles.',used:'Played',move:'Move ',guard:'Cover ',won:'Delivered!',lost:'The wind stopped you',again:'Tap to play again',damage:'Lost stamina: ',safe:'Covered from the wind',names:['Footstep','Umbrella','Breeze','Dash','Big canopy','Tailwind']}:{title:'風待ち郵便デッキ',a:'札を2枚まで使い、風を受ける。',b:'9手番までに12歩先の灯台へ。',c:'休憩所では、新しい札を1枚加える。',start:'タップでスタート',progress:'進み ',turn:'手番 ',hp:'体力 ',block:'守り ',energy:'使える札 ',wind:'来る風：',next:'次の風：',end:'風を受ける',deck:'山札 ',discard:'捨札 ',hint:'札をタップし、風を受けて次の手番へ',reward:'加える札を1枚選ぼう',rhelp:'捨札に入り、山札が尽きたら混ざる。',used:'使用済み',move:'進む ',guard:'守る ',won:'配達できた！',lost:'風に足を止められた',again:'タップでもう一度',damage:'体力が減った：',safe:'風を防いだ',names:['ひと足','雨がさ','そよ風','駆け足','大きな傘','追い風']};

const c=document.querySelector('canvas'),g=c.getContext('2d');let scale=1,ox=0,oy=0;function resize(){const w=Math.max(1,innerWidth),h=Math.max(1,innerHeight),d=Math.min(2,devicePixelRatio||1);c.width=w*d;c.height=h*d;scale=Math.min(w/360,h/640);ox=(w-360*scale)/2;oy=(h-640*scale)/2;g.setTransform(d*scale,0,0,d*scale,d*ox,d*oy)}addEventListener('resize',resize);resize();for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});

let state='title',deck=[],discard=[],hand=[],hp=12,progress=0,turn=1,energy=2,block=0,time=0,age=0,endTime=0,won=false,feedback='',ft=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function drawCard(){if(!deck.length){deck=shuffle(discard.slice());discard=[]}return deck.pop()}
function newTurn(){hand=Array.from({length:3},()=>drawCard());energy=2;block=0;state='play'}
function start(){hp=12;progress=0;turn=1;age=0;discard=[];deck=shuffle([0,0,0,1,1,2]);feedback='';newTurn();signal('start')}
function finish(ok){won=ok;state='end';endTime=time;signal('end',{score:progress});tone(ok?700:120)}
function endTurn(){const damage=Math.max(0,winds[turn-1]-block);hp=Math.max(0,hp-damage);feedback=damage?T.damage+damage:T.safe;ft=2;for(const id of hand)if(id!==null&&id!==undefined)discard.push(id);hand=[];block=0;if(hp<=0||turn>=9){finish(false);return}turn++;if(turn===4||turn===7)state='reward';else newTurn()}
c.addEventListener('pointerdown',e=>{tone(200);if(state==='title'){start();return}if(state==='end'){if(time-endTime>.7)start();return}const x=(e.clientX-ox)/scale,y=(e.clientY-oy)/scale;if(y>=320&&y<=472){const i=Math.floor((x-25)/110);if(i<0||i>2||x>25+i*110+90)return;if(state==='reward'){discard.push(market[i]);tone(600);newTurn();return}if(energy<=0||hand[i]===null||hand[i]===undefined)return;const id=hand[i],card=cards[id];hand[i]=null;discard.push(id);energy--;block+=card.b;progress=Math.min(12,progress+card.m);tone(300+card.m*110);if(progress>=12)finish(true)}else if(state==='play'&&y>=535&&y<=592)endTurn()});
function text(s,x,y,size=18,col='#26464c',max=326){g.fillStyle=col;g.textAlign='center';g.font='600 '+size+'px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif';g.save();g.translate(x,y);const w=g.measureText(s).width;if(w>max)g.scale(max/w,1);g.fillText(s,0,0);g.restore()}
function card(i,id){const x=25+i*110;g.fillStyle=id===null?'#d2d9cb':cards[id].col;g.beginPath();g.roundRect(x,320,90,152,13);g.fill();if(id===null){text(T.used,x+45,399,14,'#768b84',82);return}const v=cards[id];text(T.names[id],x+45,355,17,'#26464c',82);g.strokeStyle='#4d766c';g.lineWidth=3;g.beginPath();g.moveTo(x+22,378);g.lineTo(x+68,378);g.stroke();if(v.m)text(T.move+v.m,x+45,409,15,'#26464c',82);if(v.b)text(T.guard+v.b,x+45,v.m?442:420,15,'#26464c',82)}
function landscape(){g.fillStyle='#bed0b6';g.beginPath();g.moveTo(0,290);for(let x=0;x<=360;x+=20)g.lineTo(x,263+Math.sin(x*.035)*17);g.lineTo(360,310);g.lineTo(0,310);g.fill();g.strokeStyle='#9cae8f';g.lineWidth=3;g.beginPath();g.moveTo(35,270);g.lineTo(325,270);g.stroke();g.fillStyle='#e9d8ac';g.fillRect(306,224,18,46);g.fillStyle='#b67460';g.beginPath();g.moveTo(301,224);g.lineTo(315,210);g.lineTo(329,224);g.fill();const x=35+progress/12*270;g.fillStyle='#456d78';g.beginPath();g.arc(x,257,8,0,7);g.fill();g.fillRect(x-8,264,16,19);g.fillStyle='#efe0b3';g.fillRect(x+5,267,13,9)}
function draw(){g.clearRect(-ox/scale,-oy/scale,c.width/scale,c.height/scale);g.fillStyle='#edf0dc';g.fillRect(0,0,360,640);if(state==='title'){text(T.title,180,107,29);landscape();text(T.a,180,422,16);text(T.b,180,454,16);text(T.c,180,486,16);text(T.start,180,579,21);return}
text(T.progress+progress+'/12',82,35,17);text(T.turn+turn+'/9',280,35,17);text(T.hp+hp+'/12 · '+T.block+block,180,80,17);
if(state==='end'){text(won?T.won:T.lost,180,155,28);landscape();text(T.progress+progress+'/12',180,383,26);text(T.again,180,581,21);return}
text(T.energy+energy+'/2',180,113,15);text(state==='reward'?T.reward:T.wind+winds[turn-1],180,163,state==='reward'?22:25);if(state==='play')text(T.next+(winds[turn]??'—'),180,195,15);landscape();if(state==='reward'){market.forEach((id,i)=>card(i,id));text(T.rhelp,180,527,14)}else{hand.forEach((id,i)=>card(i,id));if(ft>0)text(feedback,180,510,14);g.fillStyle='#50796f';g.beginPath();g.roundRect(30,535,300,57,17);g.fill();text(T.end,180,572,21,'#fff3d7')}
text(T.deck+deck.length+' · '+T.discard+discard.length,180,615,14);if(state==='play'&&age<4)text(T.hint,180,637,12)}
