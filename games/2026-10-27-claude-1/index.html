// ---------- 足あとの生成 ----------
const cr = (a, b, c, d, t) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t * t + (-a + 3 * b - 3 * c + d) * t * t * t);
function buildTrack(def, flip, who) {
  const P = def.pts.map((p) => ({ x: flip ? 360 - p[0] : p[0], y: p[1], pause: p[2] || 0 }));
  const D = [];
  let s = 0;
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    const n = Math.max(2, Math.ceil(Math.hypot(p2.x - p1.x, p2.y - p1.y) / 2));
    for (let k = i === 0 ? 0 : 1; k <= n; k++) {
      const t = k / n;
      const x = cr(p0.x, p1.x, p2.x, p3.x, t), y = cr(p0.y, p1.y, p2.y, p3.y, t);
      if (D.length) { const q = D[D.length - 1]; s += Math.hypot(x - q.x, y - q.y); }
      D.push({ x, y, s, ci: k === 0 ? i : k === n ? i + 1 : -1, seg: k === 0 ? 0 : i });
    }
  }
  const isRun = (seg) => def.runAll || (def.runFrom != null && seg >= def.runFrom);
  let t = def.t0;
  const ctrlS = [];
  for (let j = 0; j < D.length; j++) {
    const d = D[j];
    if (j) t += (d.s - D[j - 1].s) / (isRun(d.seg) ? RUNV : WALKV);
    d.ta = t;
    if (d.ci >= 0) { ctrlS[d.ci] = d.s; if (P[d.ci].pause) t += P[d.ci].pause; }
    d.td = t;
  }
  const at = (ss) => {
    ss = clamp(ss, 0, D[D.length - 1].s);
    let lo = 0, hi = D.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (D[m].s <= ss) lo = m; else hi = m; }
    const a = D[lo], b = D[hi], u = b.s > a.s ? (ss - a.s) / (b.s - a.s) : 0;
    return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u, a: Math.atan2(b.y - a.y, b.x - a.x), t: a.td + (b.ta - a.td) * u, seg: b.seg };
  };
  const type = CH[who].sole, so = SOLE[type];
  const prints = [];
  const bounds = [0];
  P.forEach((p, i) => { if (p.pause && i > 0 && i < P.length - 1) bounds.push(ctrlS[i]); });
  bounds.push(s);
  let side = 1;
  for (let m = 0; m < bounds.length - 1; m++) {
    const a = bounds[m], b = bounds[m + 1];
    const run = isRun(at((a + b) / 2).seg);
    const st = so.stride * PS * (run ? 1.9 : 1);
    for (let ss = a + st * 0.6; ss < b - st * 0.4; ss += st) {
      const q = at(ss);
      side = -side;
      prints.push({ type, run, side, s: ss, a: q.a, t: q.t, cx: q.x, cy: q.y, x: q.x - Math.sin(q.a) * side * so.off * PS, y: q.y + Math.cos(q.a) * side * so.off * PS });
    }
    if (m < bounds.length - 2) {
      const q = at(b);
      for (const sd of [-1, 1]) {
        const off = (type === 'heel' ? 2 : so.off) * PS;
        prints.push({ type, run: false, side: sd, s: b, stand: true, a: q.a, t: q.t, x: q.x - Math.sin(q.a) * sd * off, y: q.y + Math.cos(q.a) * sd * off });
      }
    }
  }
  const sled = [];
  if (def.sledFrom != null) {
    const s0 = ctrlS[def.sledFrom];
    for (let ss = s0 + 12; ss <= s; ss += 3) {
      const p1 = at(ss - 12), p2 = at(ss - 9), q = at(ss);
      const nx = -Math.sin(p2.a), ny = Math.cos(p2.a);
      sled.push({ sled: true, t: q.t, x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, nx, ny });
    }
  }
  return { who, def, P, D, at, prints, sled, total: s, tEnd: D[D.length - 1].td, pauseS: bounds.slice(1, -1) };
}

function segX(a, b, c, d) {
  const r1x = b.x - a.x, r1y = b.y - a.y, r2x = d.x - c.x, r2y = d.y - c.y;
  const den = r1x * r2y - r1y * r2x;
  if (Math.abs(den) < 1e-9) return null;
  const u = ((c.x - a.x) * r2y - (c.y - a.y) * r2x) / den, v = ((c.x - a.x) * r1y - (c.y - a.y) * r1x) / den;
  if (u < 0 || u > 1 || v < 0 || v > 1) return null;
  return { x: a.x + r1x * u, y: a.y + r1y * u, u, v };
}
// 足あとが交わる所では、両方の足あとを確実に重ねる（重なりの順番が手がかりになる）
function nudgeCrossings(tracks) {
  for (let i = 0; i < tracks.length; i++) for (let j = i + 1; j < tracks.length; j++) {
    const A = tracks[i], B = tracks[j];
    const found = [];
    for (let a = 1; a < A.D.length; a++) for (let b = 1; b < B.D.length; b++) {
      const p = segX(A.D[a - 1], A.D[a], B.D[b - 1], B.D[b]);
      if (!p) continue;
      if (found.some((f) => Math.hypot(f.x - p.x, f.y - p.y) < 10)) continue;
      found.push({ x: p.x, y: p.y, sa: A.D[a - 1].s + (A.D[a].s - A.D[a - 1].s) * p.u, sb: B.D[b - 1].s + (B.D[b].s - B.D[b - 1].s) * p.v });
    }

  drawWorld(ctx, cur, 1e9, { x: cur.ev.x, y: cur.ev.y, r: ir / Z + 2 });
  ctx.restore(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.beginPath(); ctx.arc(icx, icy, ir, 0, TAU); ctx.strokeStyle = '#d0453f'; ctx.lineWidth = 3; ctx.stroke();
  pill(LANG === 'ja' ? '証拠' : 'Clue', icx, icy + ir + 2, 12, '#d0453f');
  const tw = icx - ir - 8 - (x + pad);
  let yy = y + 26;
  text(correct ? T.ok : T.ng, x + pad, yy, 26, correct ? '#2f8a4a' : '#b8433a', 'left', '800', tw);
  yy += 32;
  text(T.culprit.replace('{n}', nm(cur.answer)), x + pad, yy, 16, '#1f2f46', 'left', '700', tw);
  yy += 24;
  for (const ln of exLines) { text(ln, x + pad, yy, 14, '#3d4656'); yy += 19; }
  if (clock - stateAt > 0.7) text(T.next, W / 2, y + h - 16, 14, '#6a7383', 'center', '600');
}
function drawResult() {
  ctx.fillStyle = '#1f2f46'; ctx.fillRect(0, 0, W, H);
  drawSnowfall(0.9);
  const cy = H * 0.3;
  text(T.result, W / 2, cy - 70, 18, '#cfe0f5', 'center', '700');
  text(T.of.replace('{s}', solved), W / 2, cy - 20, 40, '#ffffff', 'center', '800', W - 30);
  const rank = T.ranks[solved >= 8 ? 3 : solved >= 6 ? 2 : solved >= 4 ? 1 : 0];
  text(rank, W / 2, cy + 30, 22, '#ffd77a', 'center', '700', W - 30);
  const n = CASES.length, dw = Math.min(36, (W - 40) / n), x0 = W / 2 - (n * dw) / 2;
  for (let i = 0; i < n; i++) {
    const cx = x0 + i * dw + dw / 2, yy = cy + 80;
    const r = dw * 0.4;
    circle(ctx, cx, yy, r, '#fffdf8');
    ctx.save(); ctx.translate(cx, yy); drawItem(ctx, CASES[i].item, r / 11); ctx.restore();
    ctx.beginPath(); ctx.arc(cx, yy, r, 0, TAU); ctx.strokeStyle = results[i] ? '#7fd18b' : '#e07a6a'; ctx.lineWidth = 3; ctx.stroke();
    if (!results[i]) { ctx.strokeStyle = '#e07a6a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(cx - r * 0.7, yy - r * 0.7); ctx.lineTo(cx + r * 0.7, yy + r * 0.7); ctx.stroke(); }
  }
  text(newBest ? T.newBest : `${T.best} ${save.best || solved} / 8`, W / 2, cy + 130, 17, newBest ? '#ffd77a' : '#cfe0f5', 'center', '700');
  if (clock - stateAt > 0.7) text(T.retry, W / 2, H * 0.82, 18, `rgba(255,255,255,${0.6 + 0.4 * Math.sin(clock * 3)})`, 'center', '700');
}
let snowP = null;
function drawSnowfall(a) {
  if (!snowP) { snowP = []; for (let i = 0; i < 70; i++) snowP.push({ x: Math.random(), y: Math.random(), v: 0.02 + Math.random() * 0.04, r: 0.8 + Math.random() * 2 }); }
  ctx.fillStyle = `rgba(255,255,255,${a})`;
  for (const f of snowP) { const x = ((f.x + Math.sin(clock * 0.5 + f.y * 7) * 0.02 + 1) % 1) * W, y = ((f.y + clock * f.v) % 1) * H; ctx.beginPath(); ctx.arc(x, y, f.r, 0, TAU); ctx.fill(); }
}

// タイトル用の小さな庭
let titleCase = null;
function makeTitle() {
  const flip = false;
  const a = buildTrack({ t0: 0, pts: [[-10, 330], [90, 280], [180, 220], [260, 150], [370, 90]] }, flip, 'take');
  const b = buildTrack({ t0: 5, pts: [[60, -10], [120, 90], [190, 210], [230, 330], [250, 430]] }, flip, 'mina');
  const c = buildTrack({ t0: 2, pts: [[370, 380], [280, 360], [200, 400], [150, 430]] }, flip, 'pochi');
  const tracks = [a, b, c]; nudgeCrossings(tracks);
  const stamps = []; for (const t of tracks) stamps.push(...t.prints); stamps.sort((p, q) => p.t - q.t);
  titleCase = { tracks, stamps, props: [{ k: 'tree', x: 40, y: 120, r: 22 }, { k: 'tree', x: 320, y: 250, r: 20 }, { k: 'snowman', x: 300, y: 395 }], snowStop: 0 };
}
function drawTitle() {
  if (!titleCase) makeTitle();
  const s = Math.max(W / 360, H / 420) * 1.0;
  const ox = (W - 360 * s) / 2, oy = (H - 420 * s) / 2 + H * 0.12;
  ctx.setTransform(DPR * s, 0, 0, DPR * s, DPR * ox, DPR * oy);
  drawWorld(ctx, titleCase, 1e9, null);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 虫めがね（交差点を拡大）
  const cross = { x: 186, y: 214 };
  const R = clamp(W * 0.2, 60, 90), Z = s * 3.2;
  const lx = ox + cross.x * s + R * 0.5, ly = oy + cross.y * s - R * 0.9;
  ctx.save(); ctx.beginPath(); ctx.arc(lx, ly, R, 0, TAU); ctx.clip();
  ctx.setTransform(DPR * Z, 0, 0, DPR * Z, DPR * (lx - cross.x * Z), DPR * (ly - cross.y * Z));
  drawWorld(ctx, titleCase, 1e9, { x: cross.x, y: cross.y, r: R / Z + 2 });
  ctx.restore(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.beginPath(); ctx.arc(lx, ly, R, 0, TAU); ctx.strokeStyle = '#3d2f25'; ctx.lineWidth = 6; ctx.stroke(); ctx.strokeStyle = '#c9a36a'; ctx.lineWidth = 2; ctx.stroke();
  ctx.lineCap = 'round'; ctx.strokeStyle = '#5b4636'; ctx.lineWidth = 11; ctx.beginPath();
  ctx.moveTo(lx + Math.cos(0.85) * (R + 2), ly + Math.sin(0.85) * (R + 2)); ctx.lineTo(lx + Math.cos(0.85) * (R + 32), ly + Math.sin(0.85) * (R + 32)); ctx.stroke();
  // 文字
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.45);
  g.addColorStop(0, 'rgba(244,247,251,0.97)'); g.addColorStop(0.75, 'rgba(244,247,251,0.85)'); g.addColorStop(1, 'rgba(244,247,251,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H * 0.45);
  drawSnowfall(0.85);
  text(T.title, W / 2, H * 0.1, LANG === 'ja' ? 44 : 34, '#1f2f46', 'center', '800', W - 30);
  let y = H * 0.18;
  for (const ln of wrap(T.sub1, W - 50, 15)) { text(ln, W / 2, y, 15, '#3d4656', 'center'); y += 21; }
  y += 4;
  text(T.sub2, W / 2, y, 14, '#a35a17', 'center', '600', W - 40); y += 22;
  text(T.sub3, W / 2, y, 13, '#6a7383', 'center');
  fillRR(ctx, W / 2 - 110, H * 0.86 - 24, 220, 48, 24, 'rgba(31,47,70,0.9)');
  text(T.start, W / 2, H * 0.86, 19, `rgba(255,255,255,${0.75 + 0.25 * Math.sin(clock * 3)})`, 'center', '700', 200);
  if (save.best) text(`${T.best} ${save.best} / 8`, W / 2, H * 0.86 + 40, 14, '#3d4656', 'center', '600');
}

// ---------- ループ ----------
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016); last = ts;
  clock += dt;
  if (state === 'replay') {
    const prevNow = (replayT / replayDur) * (cur.tEnd + 0.5);
    replayT += dt;
    const now = (replayT / replayDur) * (cur.tEnd + 0.5);
    // 新しくついた足あとの音
    let n = 0, panSum = 0;
    for (const p of cur.stamps) { if (p.t > now) break; if (p.t > prevNow && !p.sled) { n++; panSum += (p.x - 180) / 180; } }
    if (n) crunch(Math.min(0.09, 0.03 + n * 0.015), panSum / n, 1600);
    if (prevNow < cur.takeT && now >= cur.takeT) { tone(988, 0.12, 'square', 0.05); tone(1319, 0.18, 'square', 0.05, 0.08); }
    if (replayT >= replayDur) finishReplay();
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#dfe8f1'; ctx.fillRect(0, 0, W, H);
  if (state === 'title') drawTitle();
  else if (state === 'result') drawResult();
  else if (cur) {
    drawScene();
    drawHUD(); drawPanel(); drawCards();
    drawLens();
    if (state === 'case') {
      if (clock < hintUntil) pill(T.hint0, W / 2, L.oy + 420 * L.s - 24, 14);
      else if (sel) pill(T.again.replace('{n}', nm(sel)), W / 2, L.cardsY - 18, 14, 'rgba(160,90,23,0.92)');
    }
    if (state === 'verdict') drawVerdict();
  }
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
