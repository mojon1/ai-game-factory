<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>まもれ！ケーキのろうそく</title>
<style>
html, body, canvas, * { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #120c10; }
canvas { display: block; width: 100vw; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
for (const t of ['contextmenu', 'selectstart', 'gesturestart']) addEventListener(t, (e) => e.preventDefault(), { passive: false });
const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const T = {
  ja: {
    title: 'まもれ！ケーキのろうそく',
    how1: '風が吹く前に、矢印が風上を教えてくれる。',
    how2: '指をかざして、風上から火をかばおう。',
    how3: '火の真上に手をのせると、あつくて消える！',
    start: 'タップでスタート',
    hint: '矢印の来る側に指を置いて、火をかばおう',
    hint2: '2本の指で、両手を使える',
    newC: 'ろうそくが1本ふえた！',
    over: 'ぜんぶ消えちゃった…',
    score: 'ひかり',
    best: 'ベスト',
    newBest: 'ベスト更新！',
    time: (s, n) => `${s}秒 まもった ／ さいごは${n}本`,
    again: 'タップでもう一度',
    hot: 'あちっ！',
    out: 'ふっ…',
    gust: 'ビュウ！',
    safe: 'セーフ！',
    comboLost: '連続セーフがとぎれた',
  },
  en: {
    title: 'Shield the Candles',
    how1: 'An arrow warns where the next gust comes from.',
    how2: 'Hold your finger upwind to shelter the flames.',
    how3: 'Covering a flame directly smothers it!',
    start: 'Tap to start',
    hint: 'Put your finger where the arrow comes from',
    hint2: 'Two fingers = two hands',
    newC: 'One more candle!',
    over: 'All the candles went out…',
    score: 'Light',
    best: 'Best',
    newBest: 'New best!',
    time: (s, n) => `Kept them lit ${s}s / ${n} candles at the end`,
    again: 'Tap to play again',
    hot: 'Hot!',
    out: 'puff…',
    gust: 'Whoosh!',
    safe: 'Safe!',
    comboLost: 'Safe streak broken',
  },
}[LANG === 'ja' ? 'ja' : 'en'];

const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };
let best = 0;
addEventListener('message', (e) => { if (e.data && e.data.agf === 'loaded' && e.data.data && typeof e.data.data.best === 'number') best = e.data.data.best; });
try { parent.postMessage({ agf: 'load' }, '*'); } catch (e) {}

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 360, H = 640, DPR = 1;
let cx = 180, cy = 360, R = 140, K = 0.6, CH = 40;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, cv.clientWidth || innerWidth || 360);
  H = Math.max(1, cv.clientHeight || innerHeight || 640);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  R = Math.max(60, Math.min(W * 0.41, H * 0.27));
  cx = W / 2; cy = H * 0.55; K = 0.6; CH = R * 0.3;
}
addEventListener('resize', resize);
resize();

const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
// ground (x, z) in units of R, centred on the cake -> screen
const sx = (gx) => cx + gx * R;
const sy = (gz) => cy + gz * R * K;

// ---------- audio ----------
let AC = null, windGain = null, windFilter = null, windPan = null, master = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.7; master.connect(AC.destination);
    const len = AC.sampleRate * 2;
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { last = last * 0.96 + (Math.random() * 2 - 1) * 0.2; d[i] = last; }
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    windFilter = AC.createBiquadFilter(); windFilter.type = 'bandpass'; windFilter.frequency.value = 500; windFilter.Q.value = 0.8;
    windGain = AC.createGain(); windGain.gain.value = 0;
    windPan = AC.createStereoPanner ? AC.createStereoPanner() : null;
    src.connect(windFilter); windFilter.connect(windGain);
    if (windPan) { windGain.connect(windPan); windPan.connect(master); } else windGain.connect(master);
    src.start();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(freq, dur, type = 'sine', vol = 0.12, when = 0, slide = 0) {
  if (!AC) return;
  try {
    const t0 = AC.currentTime + when;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
function noiseBurst(dur, freq, vol) {
  if (!AC) return;
  try {
    const t0 = AC.currentTime;
    const n = Math.floor(AC.sampleRate * dur);
    const b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = AC.createBufferSource(); s.buffer = b;
    const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq;
    const g = AC.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start(t0);
  } catch (e) {}
}
const MEL = [523, 587, 659, 784, 880, 784, 659, 1047, 988, 880, 784, 1175];
let melI = 0;
function chime() {
  const f = MEL[melI++ % MEL.length];
  tone(f, 0.5, 'triangle', 0.10); tone(f * 2, 0.35, 'sine', 0.04, 0.05);
}

// ---------- state ----------
let scene = 'title';
let candles = [], gusts = [], streaks = [], smoke = [], pops = [];
const hands = new Map(); // pointerId -> {x, z}
let t = 0, score = 0, nextGust = 2.2, nextCandleI = 0, lastDir = null, overAt = 0, isBest = false, maxCandles = 0;
let hintT = 0, hint2Shown = false, hint2T = 0, newCT = 0, sizzleCD = 0, shake = 0;
const ADD_AT = [6, 16, 27, 39, 52, 66, 82, 100, 120, 142];
const COLORS = ['#ff7aa8', '#7ad0ff', '#ffd25a', '#9dea7a', '#c59bff', '#ff9d5c', '#5ce1c9', '#ff6b6b', '#ffe38a', '#8fb3ff', '#f2a7ff'];

function placeCandle() {
  let best = null, bestD = -1;
  for (let i = 0; i < 60; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 0.74;
    const p = { x: Math.cos(a) * r, z: Math.sin(a) * r };
    let md = 9;
    for (const c of candles) md = Math.min(md, Math.hypot(c.x - p.x, c.z - p.z), Math.hypot(c.x - p.x, (c.z - p.z) * K) * 1.25);
    if (md > 0.34) { best = p; break; }
    if (md > bestD) { bestD = md; best = p; }
  }
  const c = { x: best.x, z: best.z, h: 1, out: false, col: COLORS[candles.length % COLORS.length], born: t, exp: 0, lean: 0, leanZ: 0, flick: Math.random() * 10, hot: 0, outAt: 0 };
  candles.push(c);
  maxCandles = Math.max(maxCandles, candles.filter((k) => !k.out).length);
  return c;
}

function startGame() {
  candles = []; gusts = []; streaks = []; smoke = []; pops = [];
  t = 0; score = 0; nextGust = 2.4; nextCandleI = 0; lastDir = null; isBest = false; maxCandles = 0;
  hintT = 5; combo = 0; sparks = []; hint2Shown = false; hint2T = 0; newCT = 0; melI = 0;
  const c = placeCandle(); c.x = 0; c.z = 0.05;
  scene = 'play';
  signal('start');
  chime();
}

function spawnGust(minSep, baseDir) {
  let a;
  for (let i = 0; i < 20; i++) {
    a = Math.random() * Math.PI * 2;
    const ref = baseDir != null ? baseDir : lastDir;
    if (ref == null) break;
    let d = Math.abs(((a - ref + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
    if (d > minSep) break;
  }
  const warn = Math.max(0.95, 1.75 - t * 0.009);
  const dur = 1.1 + Math.random() * 0.8 + Math.min(1.0, t / 90);
  const str = rnd(0.85, 1.15) + Math.min(0.3, t / 300);
  const turn = t > 38 && Math.random() < 0.4 ? (Math.random() < 0.5 ? -1 : 1) * rnd(0.5, 0.9) : 0;
  const g = { a, warn, dur, str, turn, age: 0, stats: new Map(), done: false };
  gusts.push(g);
  return g;
}
// after a gust: reward every flame you kept fully sheltered
let combo = 0;
function judgeGust(g) {
  let safe = 0, hurt = 0;
  for (const [c, st] of g.stats) {
    if (c.out || st.tot < 0.3) continue;
    if (st.hit / st.tot < 0.2) { safe++; } else hurt++;
  }
  if (safe === 0 && hurt === 0) return;
  if (hurt === 0) {
    combo++;
    const bonus = safe * 15 * Math.min(5, combo);
    score += bonus;
    let i = 0;
    for (const [c, st] of g.stats) {
      if (c.out || st.tot < 0.3 || st.hit / st.tot >= 0.2) continue;
      sparkle(c, i++ * 0.06);
    }
    pops.push({ x: 0, z: -1.35, text: (combo > 1 ? `${T.safe} ×${Math.min(5, combo)}` : T.safe) + `  +${bonus}`, age: 0, col: '#ffe48a', big: true });
    const base = 660 * Math.pow(2, Math.min(5, combo - 1) / 12 * 2);
    tone(base, 0.25, 'triangle', 0.09); tone(base * 1.5, 0.35, 'triangle', 0.07, 0.08);
  } else {
    if (combo > 1) pops.push({ x: 0, z: -1.35, text: T.comboLost, age: 0, col: '#c9bfd0', big: true });
    combo = 0;
  }
}
let sparks = [];
function sparkle(c, delay) {
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2, sp = rnd(30, 80);
    sparks.push({ x: sx(c.x), y: sy(c.z) - CH - 12, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, age: -delay, life: rnd(0.5, 0.8) });
  }
}

// wind direction vector (ground), wind travels along d
const gdir = (g) => ({ x: Math.cos(g.a), z: Math.sin(g.a) });
// Is ground point p sheltered from gust direction d by any hand?
const HR = 0.33; // hand shelter half-width (units of R)
function shelteredBy(p, d) {
  for (const h of hands.values()) {
    const vx = h.x - p.x, vz = h.z - p.z;
    const along = -(vx * d.x + vz * d.z); // positive if hand is upwind
    if (along < 0.06 || along > 1.9) continue;
    const perp = Math.abs(vx * d.z - vz * d.x);
    if (perp < HR * (1 - along * 0.12)) return true;
  }
  return false;
}

function gustLevel(g) { // 0..1 blowing strength envelope
  if (g.age < g.warn) return 0;
  const k = g.age - g.warn;
  if (k > g.dur) return 0;
  const att = Math.min(1, k / 0.18), rel = Math.min(1, (g.dur - k) / 0.3);
  return Math.min(att, rel) * g.str;
}

// ---------- input ----------
function toGround(x, y) { return { x: (x - cx) / R, z: (y - cy) / (R * K) }; }
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  if (scene === 'title') { startGame(); hands.set(e.pointerId, toGround(e.clientX, e.clientY)); return; }
  if (scene === 'over') { if (performance.now() - overAt > 700) { startGame(); hands.set(e.pointerId, toGround(e.clientX, e.clientY)); } return; }
  if (hands.size < 2) hands.set(e.pointerId, toGround(e.clientX, e.clientY));
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
}, { passive: false });
cv.addEventListener('pointermove', (e) => {
  if (hands.has(e.pointerId)) hands.set(e.pointerId, toGround(e.clientX, e.clientY));
});
const lift = (e) => { hands.delete(e.pointerId); };
cv.addEventListener('pointerup', lift);
cv.addEventListener('pointercancel', lift);

// ---------- update ----------
function update(dt) {
  if (scene !== 'play') { updateFx(dt); return; }
  t += dt;
  if (hintT > 0) hintT -= dt;
  if (hint2T > 0) hint2T -= dt;
  if (newCT > 0) newCT -= dt;
  if (sizzleCD > 0) sizzleCD -= dt;
  // candles
  if (nextCandleI < ADD_AT.length && t >= ADD_AT[nextCandleI] && !gusts.some((g) => gustLevel(g) > 0)) {
    nextCandleI++;
    const c = placeCandle();
    c.grace = 2.2;
    chime();
    newCT = 1.6;
    pops.push({ x: c.x, z: c.z, text: '+1', age: 0, col: '#ffe9a8' });
    if (!hint2Shown && candles.filter((k) => !k.out).length >= 3) { hint2Shown = true; hint2T = 4; }
  }
  // gusts
  nextGust -= dt;
  if (nextGust <= 0) {
    const g = spawnGust(0.9);
    lastDir = g.a;
    if (t > 52 && Math.random() < Math.min(0.45, 0.2 + (t - 52) / 200)) { const g2 = spawnGust(1.6, g.a); g2.age = -rnd(0, 0.5); }
    nextGust = g.warn + g.dur + Math.max(0.55, 2.0 - t * 0.014) + rnd(0, 0.6);
  }
  for (const g of gusts) { g.age += dt; if (g.age > g.warn) g.a += g.turn * dt; }
  for (const g of gusts) if (!g.done && g.age >= g.warn + g.dur) { g.done = true; judgeGust(g); }
  gusts = gusts.filter((g) => g.age < g.warn + g.dur + 0.1);

  // wind on candles
  let lit = 0;
  for (const c of candles) {
    c.flick += dt * (6 + Math.random() * 4);
    if (c.out) continue;
    let exp = 0, lx = 0, lz = 0;
    for (const g of gusts) {
      const lv = gustLevel(g);
      if (lv <= 0) continue;
      const d = gdir(g);
      const st = g.stats.get(c) || { tot: 0, hit: 0 };
      if (!(c.grace > 0)) st.tot += lv * dt;
      if (!shelteredBy(c, d) && !(c.grace > 0)) { exp += lv; lx += d.x * lv; lz += d.z * lv; st.hit += lv * dt; }
      else { lx += d.x * 0.08; lz += d.z * 0.08; }
      g.stats.set(c, st);
    }
    if (c.grace > 0) c.grace -= dt;
    // smother: hand right on the flame
    let hot = false;
    for (const h of hands.values()) if (Math.hypot(h.x - c.x, h.z - c.z) < 0.15) hot = true;
    c.hot = hot ? c.hot + dt : 0;
    c.exp += (exp - c.exp) * Math.min(1, dt * 10);
    c.lean += (clamp(lx, -1.4, 1.4) - c.lean) * Math.min(1, dt * 8);
    c.leanZ += (clamp(lz, -1.4, 1.4) - c.leanZ) * Math.min(1, dt * 8);
    if (exp > 0) c.h -= 0.66 * exp * dt;
    else if (!hot) c.h = Math.min(1, c.h + 0.09 * dt);
    if (hot) {
      c.h -= 0.9 * dt;
      if (sizzleCD <= 0) { noiseBurst(0.12, 3000, 0.05); sizzleCD = 0.25; pops.push({ x: c.x, z: c.z, text: T.hot, age: 0, col: '#ff8a6a' }); }
    }
    if (c.h <= 0) {
      c.out = true; c.h = 0; c.outAt = t;
      for (let i = 0; i < 10; i++) smoke.push({ x: c.x, z: c.z, y: 0, vx: rnd(-0.08, 0.08) + c.lean * 0.15, vz: c.leanZ * 0.1, vy: rnd(0.5, 1.0), age: 0, life: rnd(1.2, 2.0) });
      tone(392, 0.35, 'sine', 0.09, 0, 0.5); noiseBurst(0.25, 1200, 0.06);
      pops.push({ x: c.x, z: c.z, text: T.out, age: 0, col: '#cfc3d6' });
      shake = 0.25;
    } else lit++;
  }
  score += lit * dt * 10;
  if (lit === 0) {
    scene = 'over'; overAt = performance.now(); hands.clear();
    const s = Math.floor(score);
    isBest = s > best;
    if (isBest) { best = s; try { parent.postMessage({ agf: 'save', data: { best } }, '*'); } catch (e) {} }
    signal('end', { score: s });
    tone(330, 0.6, 'triangle', 0.08); tone(262, 0.9, 'triangle', 0.08, 0.25);
  }

  // streaks
  for (const g of gusts) {
    const lv = gustLevel(g), d = gdir(g);
    const warning = g.age < g.warn;
    const rate = warning ? 10 : 70 * lv;
    let n = rate * dt;
    while (n > 0) {
      if (Math.random() < n) {
        // spawn on the upwind side across a wide band
        const off = rnd(-1.7, 1.7);
        const back = warning ? rnd(1.9, 2.3) : rnd(1.6, 2.4);
        streaks.push({ x: -d.x * back + -d.z * off, z: -d.z * back + d.x * off, g, life: warning ? rnd(0.3, 0.6) : rnd(0.9, 1.4), age: 0, sp: warning ? rnd(0.7, 1.0) : rnd(2.4, 3.4), leaf: warning && Math.random() < 0.5 });
      }
      n -= 1;
    }
  }
  // wind sound
  if (windGain && AC) {
    let lvMax = 0, pan = 0, warnLv = 0;
    for (const g of gusts) {
      const lv = gustLevel(g);
      if (g.age < g.warn) warnLv = Math.max(warnLv, g.age / g.warn);
      if (lv > lvMax) { lvMax = lv; pan = -Math.cos(g.a); }
      else if (lvMax === 0 && g.age < g.warn) pan = -Math.cos(g.a);
    }
    const target = 0.03 * warnLv + 0.35 * lvMax;
    windGain.gain.setTargetAtTime(target, AC.currentTime, 0.06);
    windFilter.frequency.setTargetAtTime(380 + 650 * lvMax + 120 * warnLv, AC.currentTime, 0.08);
    if (windPan) windPan.pan.setTargetAtTime(clamp(pan * 0.7, -1, 1), AC.currentTime, 0.1);
  }
  updateFx(dt);
}
function updateFx(dt) {
  if (shake > 0) shake -= dt;
  for (const s of streaks) {
    const d = gdir(s.g);
    s.x += d.x * s.sp * dt; s.z += d.z * s.sp * dt; s.age += dt;
  }
  streaks = streaks.filter((s) => s.age < s.life);
  if (streaks.length > 500) streaks.splice(0, streaks.length - 500);
  for (const p of smoke) { p.x += p.vx * dt; p.z += p.vz * dt; p.y += p.vy * dt; p.vy *= 0.98; p.age += dt; }
  smoke = smoke.filter((p) => p.age < p.life);
  for (const p of sparks) { p.age += dt; if (p.age > 0) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt; } }
  sparks = sparks.filter((p) => p.age < p.life);
  for (const p of pops) p.age += dt;
  pops = pops.filter((p) => p.age < 1.1);
  if (scene !== 'play' && windGain && AC) windGain.gain.setTargetAtTime(0, AC.currentTime, 0.2);
}

// ---------- draw ----------
function fitText(txt, size, maxW, weight = '700') {
  let s = size;
  ctx.font = `${weight} ${s}px ${FONT}`;
  while (s > 12 && ctx.measureText(txt).width > maxW) { s -= 1; ctx.font = `${weight} ${s}px ${FONT}`; }
  return s;
}
function drawRoom(lit) {
  const glow = clamp(lit / 6, 0.15, 1);
  ctx.fillStyle = '#120c10'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(cx, cy - CH, R * 0.2, cx, cy, Math.max(W, H) * 0.9);
  g.addColorStop(0, `rgba(255,170,90,${0.30 * glow})`);
  g.addColorStop(0.45, `rgba(120,60,50,${0.22 * glow})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // table
  ctx.fillStyle = `rgba(90,52,38,${0.35 + 0.35 * glow})`;
  ctx.beginPath(); ctx.ellipse(cx, cy + R * K * 0.35, R * 1.55, R * K * 1.6, 0, 0, Math.PI * 2); ctx.fill();
}
function drawCake() {
  const side = R * 0.34;
  // plate
  ctx.fillStyle = '#e9e2ea';
  ctx.beginPath(); ctx.ellipse(cx, cy + side + 4, R * 1.18, R * K * 1.18, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#cfc6d3';
  ctx.beginPath(); ctx.ellipse(cx, cy + side + 9, R * 1.18, R * K * 1.18, 0, 0, Math.PI); ctx.fill();
  // side
  const sg = ctx.createLinearGradient(cx - R, 0, cx + R, 0);
  sg.addColorStop(0, '#d98a6a'); sg.addColorStop(0.5, '#f1b090'); sg.addColorStop(1, '#c97858');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx - R, cy + side);
  ctx.ellipse(cx, cy + side, R, R * K, 0, Math.PI, 0, true);
  ctx.lineTo(cx + R, cy); ctx.closePath(); ctx.fill();
  // cream band
  ctx.strokeStyle = '#fff4ec'; ctx.lineWidth = Math.max(3, R * 0.05);
  ctx.beginPath(); ctx.ellipse(cx, cy + side * 0.55, R, R * K, 0, 0, Math.PI); ctx.stroke();
  // top
  const tg = ctx.createRadialGradient(cx - R * 0.3, cy - R * K * 0.4, R * 0.1, cx, cy, R * 1.1);
  tg.addColorStop(0, '#fffaf4'); tg.addColorStop(1, '#f3dfd2');
  ctx.fillStyle = tg;
  ctx.beginPath(); ctx.ellipse(cx, cy, R, R * K, 0, 0, Math.PI * 2); ctx.fill();
  // cream dollops on rim
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2;
    const x = sx(Math.cos(a) * 0.92), y = sy(Math.sin(a) * 0.92);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(x, y, R * 0.075, R * 0.055, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f7d9cf';
    ctx.beginPath(); ctx.ellipse(x, y + R * 0.02, R * 0.06, R * 0.025, 0, 0, Math.PI); ctx.fill();
    if (i % 2 === 0) { ctx.fillStyle = '#e8384f'; ctx.beginPath(); ctx.arc(x, y - R * 0.04, R * 0.035, 0, Math.PI * 2); ctx.fill(); }
  }
}
function drawShelters() {
  // calm zones behind each hand for every active gust
  for (const g of gusts) {
    const blowing = gustLevel(g) > 0;
    const warning = g.age < g.warn;
    if (!blowing && !warning) continue;
    const d = gdir(g);
    for (const h of hands.values()) {
      const px = -d.z, pz = d.x;
      const L = 1.9;
      const pts = [
        [h.x + px * HR, h.z + pz * HR], [h.x - px * HR, h.z - pz * HR],
        [h.x - px * HR * (1 - L * 0.12) + d.x * L, h.z - pz * HR * (1 - L * 0.12) + d.z * L],
        [h.x + px * HR * (1 - L * 0.12) + d.x * L, h.z + pz * HR * (1 - L * 0.12) + d.z * L],
      ];
      const gr = ctx.createLinearGradient(sx(h.x), sy(h.z), sx(h.x + d.x * L), sy(h.z + d.z * L));
      const a = blowing ? 0.22 : 0.10;
      gr.addColorStop(0, `rgba(120,200,255,${a})`); gr.addColorStop(1, 'rgba(120,200,255,0)');
      ctx.fillStyle = gr;
      ctx.beginPath();
      pts.forEach((p, i) => i ? ctx.lineTo(sx(p[0]), sy(p[1])) : ctx.moveTo(sx(p[0]), sy(p[1])));
      ctx.closePath(); ctx.fill();
    }
  }
}
function drawStreaks() {
  ctx.lineCap = 'round';
  for (const s of streaks) {
    const d = gdir(s.g);
    if (shelteredBy(s, d)) continue;
    const k = s.age / s.life;
    const a = Math.sin(k * Math.PI) * (s.leaf ? 0.9 : 0.55);
    const x = sx(s.x), y = sy(s.z) - CH * 0.9;
    if (s.leaf) {
      ctx.fillStyle = `rgba(190,230,140,${a})`;
      ctx.save(); ctx.translate(x, y); ctx.rotate(s.age * 8);
      ctx.beginPath(); ctx.ellipse(0, 0, 5, 2.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    } else {
      const len = 0.22;
      ctx.strokeStyle = `rgba(225,240,255,${a})`;
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(sx(s.x - d.x * len), sy(s.z - d.z * len) - CH * 0.9); ctx.stroke();
    }
  }
}
function drawCandle(c) {
  const x = sx(c.x), y = sy(c.z);
  const w = R * 0.065, h = CH;
  // shadow
  ctx.fillStyle = 'rgba(120,70,60,0.25)';
  ctx.beginPath(); ctx.ellipse(x + 3, y + 2, w * 1.6, w * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  // body
  ctx.fillStyle = c.col;
  ctx.fillRect(x - w, y - h, w * 2, h);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  for (let i = 0; i < 4; i++) { ctx.save(); ctx.beginPath(); ctx.rect(x - w, y - h, w * 2, h); ctx.clip(); ctx.fillRect(x - w, y - h + i * h / 4 + h / 8, w * 2, h / 12); ctx.restore(); }
  ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.fillRect(x + w * 0.3, y - h, w * 0.7, h);
  ctx.fillStyle = c.col;
  ctx.beginPath(); ctx.ellipse(x, y - h, w, w * 0.45, 0, 0, Math.PI * 2); ctx.fill();
  // wick
  ctx.strokeStyle = '#3a2a24'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x, y - h); ctx.lineTo(x, y - h - 5); ctx.stroke();
}
function drawFlame(c) {
  if (c.out) {
    const k = t - c.outAt;
    if (k < 3) { ctx.fillStyle = `rgba(255,110,40,${0.7 * (1 - k / 3)})`; ctx.beginPath(); ctx.arc(sx(c.x), sy(c.z) - CH - 5, 2, 0, Math.PI * 2); ctx.fill(); }
    return;
  }
  const x = sx(c.x), y = sy(c.z) - CH - 5;
  const s = R * 0.11 * (0.45 + 0.65 * c.h) * (1 + Math.sin(c.flick) * 0.06 + (c.exp > 0 ? Math.sin(c.flick * 3.1) * 0.15 : 0));
  // halo
  const hal = ctx.createRadialGradient(x, y - s * 0.8, 0, x, y - s * 0.8, s * 4.2);
  hal.addColorStop(0, `rgba(255,200,110,${0.35 * c.h + 0.1})`);
  hal.addColorStop(1, 'rgba(255,160,80,0)');
  ctx.fillStyle = hal; ctx.beginPath(); ctx.arc(x, y - s * 0.8, s * 4.2, 0, Math.PI * 2); ctx.fill();
  // flame shape, leaning with wind (screen dir)
  const lx = c.lean * s * 1.6 + Math.sin(c.flick * 0.7) * s * 0.08;
  const lz = c.leanZ * s * 0.5;
  const tipX = x + lx, tipY = y - s * 2.3 * (1 - Math.min(0.5, Math.hypot(c.lean, c.leanZ) * 0.3)) + lz;
  const outer = ctx.createLinearGradient(x, y, tipX, tipY);
  outer.addColorStop(0, '#ff7a1a'); outer.addColorStop(0.6, '#ffb83a'); outer.addColorStop(1, 'rgba(255,230,140,0.9)');
  ctx.fillStyle = outer;
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.quadraticCurveTo(x + s * 0.95 + lx * 0.4, y - s * 0.6, x, y + s * 0.15);
  ctx.quadraticCurveTo(x - s * 0.95 + lx * 0.4, y - s * 0.6, tipX, tipY);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,250,220,0.95)';
  ctx.beginPath();
  const ix = x + lx * 0.4, iy = y - s * 1.0 + lz * 0.4;
  ctx.ellipse(ix, iy + s * 0.25, s * 0.32, s * 0.6, Math.atan2(lx, s * 2) * 0.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(90,140,255,0.6)';
  ctx.beginPath(); ctx.ellipse(x, y, s * 0.3, s * 0.18, 0, 0, Math.PI * 2); ctx.fill();
  if (c.grace > 0) { ctx.strokeStyle = `rgba(255,230,140,${0.4 + 0.3 * Math.sin(t * 10)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y - s * 0.6, s * 2.4, 0, Math.PI * 2); ctx.stroke(); }
  // danger ring when weak
  if (c.h < 0.45) {
    ctx.strokeStyle = `rgba(255,90,90,${0.5 + 0.4 * Math.sin(t * 14)})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y - s * 0.6, s * 2.1, 0, Math.PI * 2); ctx.stroke();
  }
  if (c.hot > 0) {
    ctx.strokeStyle = 'rgba(255,80,40,0.9)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y - s * 0.6, s * 2.6, 0, Math.PI * 2); ctx.stroke();
  }
}
function drawHand(h) {
  const x = sx(h.x), y = sy(h.z);
  const hw = HR * R, hh = R * 0.62;
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = 0.62;
  ctx.fillStyle = '#f6c9a8';
  ctx.strokeStyle = '#b97c5c'; ctx.lineWidth = 2;
  // palm (upright) with four fingers
  ctx.beginPath();
  ctx.moveTo(-hw * 0.75, 0);
  ctx.quadraticCurveTo(-hw * 0.95, -hh * 0.35, -hw * 0.8, -hh * 0.55);
  const fw = hw * 1.6 / 4;
  for (let i = 0; i < 4; i++) {
    const fx = -hw * 0.8 + fw * i;
    const top = -hh * (i === 1 || i === 2 ? 1.0 : 0.88);
    ctx.lineTo(fx, top + fw * 0.5);
    ctx.arc(fx + fw / 2, top + fw * 0.5, fw / 2, Math.PI, 0);
  }
  ctx.lineTo(hw * 0.8, -hh * 0.5);
  // thumb
  ctx.quadraticCurveTo(hw * 1.25, -hh * 0.45, hw * 1.15, -hh * 0.22);
  ctx.quadraticCurveTo(hw * 0.95, -hh * 0.1, hw * 0.75, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(0, 4, hw * 0.8, hw * 0.25, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawWarnings() {
  for (const g of gusts) {
    const d = gdir(g);
    // screen direction of the wind
    let dx = d.x, dy = d.z * K; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
    // place indicator where the wind enters: from centre going upwind to screen edge
    const ex = clamp(sx(-d.x * 1.32), 30, W - 30), ey = clamp(sy(-d.z * 1.32) - CH * 0.6, 92, H - 30);
    const warning = g.age < g.warn;
    const lv = gustLevel(g);
    const prog = warning ? g.age / g.warn : 1;
    ctx.fillStyle = 'rgba(20,14,30,0.72)';
    ctx.beginPath(); ctx.arc(ex, ey, 24, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(Math.atan2(dy, dx));
    const pulse = warning ? 0.6 + 0.4 * Math.sin(g.age * 18) : 0.9;
    ctx.globalAlpha = warning ? pulse : Math.min(1, lv);
    ctx.fillStyle = warning ? '#9fdcff' : '#ffffff';
    for (let i = 0; i < 3; i++) {
      const ox = -10 + i * 11;
      ctx.beginPath(); ctx.moveTo(ox + 8, 0); ctx.lineTo(ox - 2, -11); ctx.lineTo(ox + 1, -11); ctx.lineTo(ox + 11, 0); ctx.lineTo(ox + 1, 11); ctx.lineTo(ox - 2, 11); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    if (warning) {
      ctx.strokeStyle = 'rgba(159,220,255,0.85)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ex, ey, 22, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - prog)); ctx.stroke();
    }
  }
}
function drawSmoke() {
  for (const p of smoke) {
    const k = p.age / p.life;
    ctx.fillStyle = `rgba(200,190,205,${0.45 * (1 - k)})`;
    ctx.beginPath(); ctx.arc(sx(p.x), sy(p.z) - CH - 6 - p.y * R * 0.5, 3 + k * 10, 0, Math.PI * 2); ctx.fill();
  }
}
function drawPops() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of pops) {
    const k = p.age / 1.1;
    ctx.globalAlpha = 1 - k;
    if (p.big) { fitText(p.text, 22, W - 20, '800'); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillText(p.text, W / 2 + 2, H * 0.2 + 2 - k * 16); ctx.fillStyle = p.col; ctx.fillText(p.text, W / 2, H * 0.2 - k * 16); continue; }
    ctx.font = `800 16px ${FONT}`;
    ctx.fillStyle = p.col;
    ctx.fillText(p.text, sx(p.x), sy(p.z) - CH - R * 0.35 - k * 24);
  }
  ctx.globalAlpha = 1;
  for (const p of sparks) {
    if (p.age < 0) continue;
    const k = p.age / p.life;
    ctx.fillStyle = `rgba(255,236,150,${1 - k})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.5 * (1 - k) + 1, 0, Math.PI * 2); ctx.fill();
  }
}
function drawHUD(lit) {
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff3e0';
  ctx.font = `600 14px ${FONT}`; ctx.fillText(T.score, 14, 12);
  ctx.font = `800 26px ${FONT}`; ctx.fillText(String(Math.floor(score)), 14, 28);
  ctx.textAlign = 'right';
  ctx.font = `600 14px ${FONT}`; ctx.fillStyle = 'rgba(255,243,224,0.75)';
  ctx.fillText(`${T.best} ${best}`, W - 14, 12);
  // candle icons
  const n = candles.length;
  const iw = Math.min(14, (W * 0.5) / Math.max(1, n));
  for (let i = 0; i < n; i++) {
    const c = candles[i];
    const x = W - 14 - (n - 1 - i) * iw - iw / 2, y = 36;
    ctx.fillStyle = c.out ? 'rgba(160,150,170,0.6)' : c.col;
    ctx.fillRect(x - 2.5, y + 6, 5, 14);
    if (!c.out) { ctx.fillStyle = c.h < 0.45 ? '#ff6a5a' : '#ffc24a'; ctx.beginPath(); ctx.ellipse(x, y + 2, 3, 4.5, 0, 0, Math.PI * 2); ctx.fill(); }
  }
  // bottom hints
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let msg = null, a = 0;
  if (newCT > 0) { msg = T.newC; a = Math.min(1, newCT); }
  else if (hint2T > 0) { msg = T.hint2; a = Math.min(1, hint2T); }
  else if (hintT > 0) { msg = T.hint; a = Math.min(1, hintT); }
  if (msg) {
    ctx.globalAlpha = a;
    const fs = fitText(msg, 15, W - 30, '700');
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    const mw = ctx.measureText(msg).width + 24;
    ctx.fillRect(W / 2 - mw / 2, H - 58, mw, fs + 16);
    ctx.fillStyle = '#fff3e0'; ctx.fillText(msg, W / 2, H - 58 + (fs + 16) / 2);
    ctx.globalAlpha = 1;
  }
}
function drawScene() {
  const lit = candles.filter((c) => !c.out).length;
  ctx.save();
  if (shake > 0) ctx.translate(Math.sin(t * 90) * shake * 6, 0);
  drawRoom(scene === 'title' ? 4 : lit);
  drawCake();
  drawShelters();
  // depth sort candles + hands
  const items = candles.map((c) => ({ z: c.z, c }));
  for (const h of hands.values()) items.push({ z: h.z + 0.01, h });
  items.sort((a, b) => a.z - b.z);
  for (const it of items) { if (it.c) { drawCandle(it.c); drawFlame(it.c); } else drawHand(it.h); }
  drawSmoke();
  drawStreaks();
  ctx.restore();
  drawWarnings();
  drawPops();
}
function titleScreen() {
  if (candles.length === 0 || !candles.demo) {
    candles = []; for (let i = 0; i < 5; i++) placeCandle(); candles.demo = true;
  }
  drawScene();
  ctx.fillStyle = 'rgba(18,12,16,0.45)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff3e0';
  fitText(T.title, 32, W - 30, '800');
  ctx.fillText(T.title, W / 2, H * 0.16);
  ctx.font = `600 15px ${FONT}`;
  const lines = [T.how1, T.how2, T.how3];
  lines.forEach((l, i) => { fitText(l, 15, W - 30, '600'); ctx.fillStyle = i === 2 ? '#ffb0a0' : '#fff3e0'; ctx.fillText(l, W / 2, H * 0.25 + i * 24); });
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 300);
  fitText(T.start, 20, W - 30, '800'); ctx.fillStyle = '#ffd27a';
  ctx.fillText(T.start, W / 2, H * 0.88);
  ctx.globalAlpha = 1;
  if (best > 0) { ctx.font = `600 14px ${FONT}`; ctx.fillStyle = 'rgba(255,243,224,0.7)'; ctx.fillText(`${T.best} ${best}`, W / 2, H * 0.93); }
}
function overScreen() {
  drawScene();
  ctx.fillStyle = 'rgba(10,6,10,0.6)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#e8dcea';
  fitText(T.over, 22, W - 30, '700'); ctx.fillText(T.over, W / 2, H * 0.24);
  ctx.fillStyle = '#ffd27a'; ctx.font = `800 56px ${FONT}`;
  ctx.fillText(String(Math.floor(score)), W / 2, H * 0.36);
  ctx.font = `600 15px ${FONT}`; ctx.fillStyle = '#fff3e0';
  fitText(T.time(Math.floor(t), candles.length), 15, W - 30, '600');
  ctx.fillText(T.time(Math.floor(t), candles.length), W / 2, H * 0.45);
  ctx.font = `700 17px ${FONT}`;
  if (isBest) { ctx.fillStyle = '#ffe07a'; ctx.fillText(T.newBest, W / 2, H * 0.51); }
  else { ctx.fillStyle = 'rgba(255,243,224,0.75)'; ctx.fillText(`${T.best} ${best}`, W / 2, H * 0.51); }
  if (performance.now() - overAt > 700) {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 300);
    fitText(T.again, 20, W - 30, '800'); ctx.fillStyle = '#ffd27a';
    ctx.fillText(T.again, W / 2, H * 0.86);
    ctx.globalAlpha = 1;
  }
}

let lastTs = 0;
function frame(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - (lastTs || ts)) / 1000));
  lastTs = ts;
  if (cv.clientWidth && Math.abs(cv.clientWidth - W) > 0.5) resize();
  update(dt);
  if (scene === 'title') titleScreen();
  else if (scene === 'play') { drawScene(); drawHUD(); }
  else overScreen();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
