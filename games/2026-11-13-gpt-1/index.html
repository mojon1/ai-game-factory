<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>まわりこみ牧羊犬</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overscroll-behavior:none;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:#dfead0;color:#274d43}
#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(#bfd9bd,#e8edcf)}
header{position:absolute;top:4%;left:6%;right:6%;display:flex;justify-content:space-between;font-size:17px;font-weight:700}
#message{position:absolute;top:11%;width:100%;text-align:center;font-size:16px}
canvas{position:absolute;top:18%;left:0;width:100%;height:65%}
#hint{position:absolute;bottom:7%;width:100%;text-align:center;font-size:15px}
#cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7%;background:#e5edd6f5;text-align:center}
#cover.hidden{display:none}
h1{font-size:clamp(25px,7vw,35px);margin:8px 0}
p{font-size:17px;line-height:1.7;white-space:pre-line}
</style>
</head>
<body>
<div id="game">
<header><span id="label"></span><span id="count"></span></header>
<div id="message"></div><canvas id="field"></canvas><div id="hint"></div><div id="cover"></div>
</div>
<script>
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en');
const words={
ja:{title:'まわりこみ牧羊犬',intro:'指で犬を動かそう。\n羊の後ろへ回ると、羊は離れて歩きます。\n6頭を上の囲いへ。',start:'タップでスタート',again:'タップでもう一度',label:'夕方の牧場',count:'帰った羊',hint:'羊の後ろへ、犬をゆっくり動かす',message:'上の囲いへ連れていこう',clear:'みんな、おかえり',time:'かかった時間',seconds:'秒',pen:'入口',welcome:'一頭、おかえり！'},
en:{title:'Around the Flock',intro:'Move the dog with your finger.\nSheep walk away when you get behind them.\nGuide all six into the upper pen.',start:'Tap to start',again:'Tap to play again',label:'Evening pasture',count:'Home',hint:'Move the dog slowly behind the sheep',message:'Guide the flock into the upper pen',clear:'Everyone is home',time:'Time taken',seconds:'s',pen:'Gate',welcome:'One more sheep is home!'}
};
const t=words[LANG==='ja'?'ja':'en'],$=id=>document.getElementById(id);
for(const type of ['contextmenu','selectstart','gesturestart'])addEventListener(type,e=>e.preventDefault(),{passive:false});
const signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};
const canvas=$('field'),ctx=canvas.getContext('2d');
const rocks=[{x:180,y:225,r:27}];
let welcome=0;
let sheep=[],dog={x:180,y:380},target={x:180,y:380},pointer=null,mode='title',last=0,elapsed=0,ended=0,audio=null;
function tone(f){
try{
audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();
const o=audio.createOscillator(),g=audio.createGain();o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*.7,audio.currentTime+.16);g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.21);
}catch{}
}
function cover(title,body,action){$('cover').innerHTML='<h1>'+title+'</h1><p>'+body+'</p><p>'+action+'</p>';$('cover').classList.remove('hidden')}
function start(){
welcome=0;sheep=[[100,250],[145,285],[205,285],[255,245],[85,190],[245,180]].map(([x,y])=>({x,y,vx:0,vy:0,home:false}));
dog={x:180,y:380};target={...dog};pointer=null;elapsed=0;mode='play';$('cover').classList.add('hidden');$('message').textContent=t.message;$('hint').textContent=t.hint;signal('start');tone(360);
}
function finish(){mode='result';ended=performance.now();pointer=null;signal('end');cover(t.clear,t.time+' '+elapsed.toFixed(1)+t.seconds,t.again);tone(720)}
function update(dt){
if(mode!=='play')return;elapsed+=dt;
if(elapsed>5)$('hint').textContent='';
$('message').textContent=elapsed<welcome?t.welcome:t.message;
let dx=target.x-dog.x,dy=target.y-dog.y,d=Math.hypot(dx,dy);
if(d>0){const step=Math.min(d,200*dt);dog.x+=dx/d*step;dog.y+=dy/d*step}
const active=sheep.filter(s=>!s.home);
for(const s of active){
let vx=0,vy=0;
dx=s.x-dog.x;dy=s.y-dog.y;d=Math.hypot(dx,dy);
if(d<110&&d>.1){const speed=20+(110-d)*.45;vx+=dx/d*speed;vy+=dy/d*speed}
for(const other of active){
if(other===s)continue;
const ox=s.x-other.x,oy=s.y-other.y,od=Math.hypot(ox,oy);
if(od<28&&od>.1){vx+=ox/od*(28-od)*1.1;vy+=oy/od*(28-od)*1.1}
}
if(s.y<150&&s.x>90&&s.x<270){const gx=180-s.x,gy=55-s.y,gd=Math.hypot(gx,gy);if(gd>.1){vx+=gx/gd*14;vy+=gy/gd*14}}
s.vx+=(vx-s.vx)*Math.min(1,dt*7);s.vy+=(vy-s.vy)*Math.min(1,dt*7);
s.x+=s.vx*dt;s.y+=s.vy*dt;
for(const r of rocks){
const rx=s.x-r.x,ry=s.y-r.y,rd=Math.hypot(rx,ry),clear=r.r+12;
if(rd<clear&&rd>.1){s.x=r.x+rx/rd*clear;s.y=r.y+ry/rd*clear}
}
s.x=Math.max(18,Math.min(342,s.x));s.y=Math.max(70,Math.min(430,s.y));
if(s.x>90&&s.x<270&&s.y<90){s.home=true;welcome=elapsed+2;tone(500+sheep.filter(s=>s.home).length*35)}
}
if(sheep.every(s=>s.home))finish();
}
function paint(){
const rect=canvas.getBoundingClientRect();if(rect.width<=0||rect.height<=0)return;
const ratio=Math.min(2,devicePixelRatio||1);
if(canvas.width!==Math.round(rect.width*ratio)||canvas.height!==Math.round(rect.height*ratio)){canvas.width=Math.round(rect.width*ratio);canvas.height=Math.round(rect.height*ratio)}
ctx.setTransform(canvas.width/360,0,0,canvas.height/450,0,0);ctx.clearRect(0,0,360,450);
ctx.fillStyle='#9dc39b';ctx.fillRect(12,14,336,425);
ctx.strokeStyle='#759c76';ctx.lineWidth=2;ctx.strokeRect(12,14,336,425);
for(let i=0;i<28;i++){const x=25+(i*67)%310,y=110+(i*47)%310;ctx.strokeStyle='#85ad82';ctx.beginPath();ctx.moveTo(x-3,y);ctx.lineTo(x,y-6);ctx.lineTo(x+3,y);ctx.stroke()}
ctx.fillStyle='#e1c591';ctx.fillRect(87,20,186,65);
ctx.strokeStyle='#805e42';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(85,87);ctx.lineTo(85,20);ctx.lineTo(275,20);ctx.lineTo(275,87);ctx.stroke();
ctx.fillStyle=elapsed<welcome?'#ffe8a5':'#c3e6a5';ctx.fillRect(90,82,180,13);
ctx.fillStyle='#3f5b48';ctx.font='15px system-ui';ctx.textAlign='center';ctx.fillText(t.pen,180,108);
for(const r of rocks){ctx.fillStyle='#82958e';ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,r.r*.8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#afbbb0';ctx.beginPath();ctx.ellipse(r.x-6,r.y-6,12,6,-.3,0,Math.PI*2);ctx.fill()}
sheep.forEach((s,i)=>{
const x=s.home?110+(i%4)*38:s.x,y=s.home?40+Math.floor(i/4)*27:s.y;
if(!s.home){const dx=s.x-dog.x,dy=s.y-dog.y,d=Math.hypot(dx,dy);if(d<110&&d>.1){ctx.strokeStyle='#cf8158';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+dx/d*18,y+dy/d*18);ctx.lineTo(x+dx/d*25,y+dy/d*25);ctx.stroke()}}
ctx.fillStyle='#506c59';ctx.beginPath();ctx.ellipse(x,y+9,12,5,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#fff5d9';ctx.beginPath();ctx.ellipse(x,y,14,11,0,0,Math.PI*2);ctx.fill();
const angle=s.home?-Math.PI/2:Math.atan2(s.vy,s.vx);
ctx.fillStyle='#4c4c42';ctx.beginPath();ctx.ellipse(x+Math.cos(angle)*10,y+Math.sin(angle)*7,6,6,0,0,Math.PI*2);ctx.fill();
});
if(Math.hypot(target.x-dog.x,target.y-dog.y)>4){ctx.strokeStyle='#fff3b5';ctx.lineWidth=2;ctx.setLineDash([3,5]);ctx.beginPath();ctx.moveTo(dog.x,dog.y);ctx.lineTo(target.x,target.y);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(target.x,target.y,5,0,Math.PI*2);ctx.stroke()}
ctx.strokeStyle='#e7efcf88';ctx.lineWidth=1.5;ctx.setLineDash([4,6]);ctx.beginPath();ctx.arc(dog.x,dog.y,110,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
ctx.fillStyle='#3c4b48';ctx.beginPath();ctx.ellipse(dog.x,dog.y,14,10,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#e6d3ad';ctx.beginPath();ctx.arc(dog.x,dog.y-9,8,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#3c4b48';ctx.beginPath();ctx.arc(dog.x-7,dog.y-15,5,0,Math.PI*2);ctx.arc(dog.x+7,dog.y-15,5,0,Math.PI*2);ctx.fill();
$('count').textContent=t.count+' '+sheep.filter(s=>s.home).length+'/6';
}
function setTarget(e){
const rect=canvas.getBoundingClientRect();if(!rect.width||!rect.height)return;
target={x:Math.max(0,Math.min(360,(e.clientX-rect.left)/rect.width*360)),y:Math.max(0,Math.min(450,(e.clientY-rect.top)/rect.height*450))};
}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(mode!=='play'||pointer!==null)return;pointer=e.pointerId;canvas.setPointerCapture(pointer);setTarget(e)});
canvas.addEventListener('pointermove',e=>{if(e.pointerId===pointer)setTarget(e)});
function release(e){if(e.pointerId===pointer)pointer=null}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
$('cover').addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='title'||(mode==='result'&&performance.now()-ended>=700))start()});
function loop(now){const dt=last?Math.min(.05,(now-last)/1000):0;last=now;update(dt);paint();requestAnimationFrame(loop)}
$('label').textContent=t.label;cover(t.title,t.intro,t.start);addEventListener('resize',paint);requestAnimationFrame(loop);
</script>
</body></html>
