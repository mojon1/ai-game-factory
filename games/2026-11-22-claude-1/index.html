// ---------- game flow ----------
function startFloor(newSeed) {
  cfg = FLOORS[floorIdx];

  genFloor(cfg, floorSeed + floorIdx * 977);
  haveKey = !cfg.key; steps = 0; caughtBy = null; queued = null;
  buildLevel(); setCamNow(); updateSeen();
  for (const s of statues) { s.wasVis = visibleTile(s.x, s.y); }
  state = 'play'; hideOv();
  $('floor').textContent = `B${5 - floorIdx}F`;
  $('floorSub').textContent = TX.floorsLeft(5 - floorIdx);
  showHint(floorIdx === 1 ? TX.hintKey : (floorIdx === 0 ? TX.hint : ''));
  updateHud(); drawMini();

}
let hintTimer = 0;

function act(a) {

  if (anim) { queued = a; return; }
  const before = { x: px, y: py, yaw: cam.yaw };
  if (a === 'f') {
    const nx = px + DX[pd], ny = py + DY[pd];
    const st = statueAt(nx, ny);
    if (isWall(nx, ny) || (st && st.awake && st.stone === 0)) { sfx.bump(); startAnim('bump'); return; }
    if (exitT.x === nx && exitT.y === ny && !haveKey) { sfx.locked(); showHint(TX.locked); startAnim('bump'); return; }
    if (st) { st.x = px; st.y = py; sfx.squeeze(); if (!squeezed) { squeezed = true; showHint(TX.squeeze); } }

  } else if (a === 'l') { pd = (pd + 3) % 4; sfx.turn(); }

  else if (a === 'u') { pd = (pd + 2) % 4; sfx.turn(); }
  steps++;
  let targetYaw = before.yaw + (a === 'l' ? Math.PI / 2 : a === 'r' ? -Math.PI / 2 : a === 'u' ? Math.PI : 0);
  startAnim('move', targetYaw);
  if (keyT && !haveKey && px === keyT.x && py === keyT.y) {

function worldTick() {

  let nearest = 99;
  for (const s of order) {
    const vis = visibleTile(s.x, s.y);
    const dd = dist[s.x + s.y * GW];
    if (!s.awake && (vis || dd <= cfg.wake || steps >= cfg.wakeTick + statues.indexOf(s) * 10)) {
      s.awake = true; s.stone = Math.max(s.stone, 3); s.mesh.userData.wake = 1; sfx.wake(Math.max(0.4, 1.2 - dd / 12), relPan(s)); edgeCue(s, 1); if (!vis) { s.wasVis = false; s.stone--; continue; }

      if (isWall(nx, ny) || dist[nx + ny * GW] !== cur - 1) continue;
      if (statues.some(o => o !== s && o.x === nx && o.y === ny)) continue;
      opts.push([nx, ny]);
    }

}

function floorCleared() {

  signal('end', { score: floorIdx + 1 });
  if (floorIdx === 4) {
    state = 'win';
    let sub = '';
    if (runStartFloor === 1) {
      if (!save.best || totalSteps < save.best) { save.best = totalSteps; sub = TX.newBest; } else sub = TX.best(save.best);
    }
    save.floor = 1; doSave();
    showOv(TX.win, TX.winB(totalSteps, caughtCount), sub, TX.again);
  } else {
    state = 'cleared';
    save.floor = floorIdx + 2; doSave();
    showOv(TX.clear(5 - floorIdx), TX.clearB(steps), '', TX.cont);

}

function showOv(t, b, s, c) { $('ovT').textContent = t; $('ovB').innerHTML = b; $('ovS').textContent = s || ''; $('ovC').textContent = c; $('ov').classList.remove('hide'); ovGuard = performance.now() + 700; }

function showTitle() {

  const T = (x) => (x - .5) * c;
  mg.fillStyle = '#9a8468';
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) if (seen[x + y * GW] && !map[y][x]) mg.fillRect(T(x) - .3, T(y) - .3, c + .6, c + .6);
  mg.fillStyle = haveKey ? '#6cc8ff' : '#ff5a3a'; mg.fillRect(T(exitT.x) + c * .1, T(exitT.y) + c * .1, c * .8, c * .8);
  if (keyT && !haveKey) { mg.fillStyle = '#ffc640'; mg.beginPath(); mg.arc(keyT.x * c, keyT.y * c, c * .42, 0, 7); mg.fill(); }
  for (const s of statues) {
    if (!s.seen) continue;
    if (s.stone > 0 || !s.awake) {
      mg.fillStyle = s.awake ? '#e8f2ff' : '#b8b0a4'; mg.beginPath(); mg.arc(s.x * c, s.y * c, c * .45, 0, 7); mg.fill();
      if (s.stone > 0) { mg.strokeStyle = '#9fd0ff'; mg.lineWidth = 2; mg.beginPath(); mg.arc(s.x * c, s.y * c, c * .85, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * s.stone / STONE_MAX); mg.stroke(); }
    } else {
      mg.fillStyle = 'rgba(255,60,40,.55)'; mg.beginPath(); mg.arc(s.lx * c, s.ly * c, c * .45, 0, 7); mg.fill();
    }
  }
  mg.restore();
  // pointers to the stairs / key when off the map window
  const pointTo = (tx, ty, col) => {
    const dx = tx - ppx, dz = ty - ppz; const cs = Math.cos(yaw), sn = Math.sin(yaw);
    const rx = dx * cs - dz * sn, ry = dx * sn + dz * cs; // rotated into screen space
    const sx = rx * c, sy = ry * c + 10; const r = Math.hypot(sx, sy);
    if (r < H - 8) return;
    const k = (H - 7) / r; mg.fillStyle = col; mg.beginPath(); mg.arc(H + sx * k, H + sy * k, 4.5, 0, 7); mg.fill();
  };
  pointTo(exitT.x, exitT.y, haveKey ? '#6cc8ff' : '#ff5a3a');
  if (keyT && !haveKey) pointTo(keyT.x, keyT.y, '#ffc640');
  // player arrow (always pointing up)
  mg.fillStyle = '#ffe9a8'; mg.beginPath(); mg.moveTo(H, H + 10 - c * .8); mg.lineTo(H + c * .55, H + 10 + c * .5); mg.lineTo(H - c * .55, H + 10 + c * .5); mg.closePath(); mg.fill();
  mg.strokeStyle = 'rgba(255,220,170,.35)'; mg.lineWidth = 1.5; mg.beginPath(); mg.arc(H, H, H - 1, 0, 7); mg.stroke();
}

// ---------- input ----------
const bind = (id, a) => { const el = $(id); el.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); initAudio(); el.classList.add('on'); act(a); }); for (const t of ['pointerup', 'pointercancel', 'pointerleave']) el.addEventListener(t, () => el.classList.remove('on')); };
bind('bL', 'l'); bind('bF', 'f'); bind('bR', 'r'); bind('bU', 'u'); bind('bStare', 'w');
$('ov').addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); onOvTap(); });
const swipes = new Map();
canvas.addEventListener('pointerdown', (e) => { initAudio(); swipes.set(e.pointerId, { x: e.clientX, y: e.clientY }); });
const endSwipe = (e, cancel) => {
  const s = swipes.get(e.pointerId); swipes.delete(e.pointerId); if (!s || cancel) return;
  const dx = e.clientX - s.x, dy = e.clientY - s.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) { act('w'); return; }
  if (Math.abs(dx) > Math.abs(dy)) act(dx > 0 ? 'r' : 'l'); else act(dy < 0 ? 'f' : 'u');
};
canvas.addEventListener('pointerup', (e) => endSwipe(e, false));
canvas.addEventListener('pointercancel', (e) => endSwipe(e, true));

// ---------- resize ----------
function resize() {
  const W = innerWidth, H = innerHeight; if (!W || !H) return;
  const padH = $('pad').offsetHeight || 140;
  const vh = Math.max(50, H - padH);
  canvas.style.width = W + 'px'; canvas.style.height = vh + 'px';
  renderer.setSize(W, vh, false);
  const aspect = W / vh;
  const vfov = Math.max(58, Math.min(95, 2 * Math.atan(0.52 / aspect) * 180 / Math.PI));
  camera.fov = vfov; camera.aspect = aspect; camera.updateProjectionMatrix();
  tanH = Math.tan(vfov * Math.PI / 360) * aspect;
  $('hint').style.bottom = (padH + 12) + 'px';
  $('flash').style.height = vh + 'px';
  $('eL').style.height = $('eR').style.height = vh + 'px'; $('eB').style.top = (vh - 70) + 'px';
}
addEventListener('resize', resize);

// ---------- loop ----------
let last = performance.now(), flashT = 0, tAll = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (ts - last) / 1000)); last = ts; tAll += dt;
  if (hintTimer > 0) { hintTimer -= dt; if (hintTimer <= 0) $('hint').style.opacity = 0; }
  if (anim) {
    anim.t += dt / anim.dur; const k = Math.min(1, anim.t);
    if (anim.type === 'bump') {
      const b = Math.sin(k * Math.PI) * 0.12; cam.x = anim.fx + DX[pd] * b; cam.z = anim.fz + DY[pd] * b; cam.yaw = anim.fy;
    } else {
      const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      cam.x = anim.fx + (anim.tx - anim.fx) * e; cam.z = anim.fz + (anim.tz - anim.fz) * e; cam.yaw = anim.fy + (anim.ty - anim.fy) * e;
      if (anim.tx !== anim.fx || anim.tz !== anim.fz) bob += dt * 18;
    }
    if (k >= 1) {
      const ex = anim.exitAfter; anim = null;
      if (ex) { descendT = 0.001; }
      else if (queued && state === 'play') { const q = queued; queued = null; act(q); }
    }
  }
  let camY = 0.5 + Math.sin(bob) * 0.012;
  if (descendT > 0) { descendT += dt; camY += Math.min(0.3, descendT * descendT * 0.8); const f = $('flash'); f.style.background = '#e8f4ff'; f.style.opacity = Math.min(0.92, descendT * 1.3); if (descendT > 0.8 && state === 'exiting') { descendT = 0; floorCleared(); } }
  if (map) {
    camera.position.set(cam.x, camY, cam.z); camera.rotation.y = cam.yaw;
    camera.rotation.x = state === 'caught' ? 0.06 : 0;
    torch.position.set(cam.x - Math.sin(cam.yaw) * 0.12, camY + 0.05, cam.z - Math.cos(cam.yaw) * 0.12);
    torch.intensity = 3.3 + Math.sin(tAll * 13) * 0.18 + Math.sin(tAll * 7.3) * 0.22;
    for (const s of statues) {
      const u = s.mesh.userData;
      const stoneK = s.stone / STONE_MAX;
      u.shown += ((s.stone > 0 || !s.awake ? 1 : 0) - u.shown) * Math.min(1, dt * 8);
      u.wake = Math.max(0, (u.wake || 0) - dt * 1.2);
      u.mat.color.copy(STONE_DARK).lerp(STONE_LIGHT, u.shown * (s.awake ? 0.55 + stoneK * 0.45 : 0.6));
      const gl = s.awake ? u.shown * (0.08 + stoneK * 0.22) : 0.03;
      u.mat.emissive.setRGB(u.flash * 0.6 + gl * 0.7, u.flash * 0.7 + gl * 0.9, u.flash * 0.9 + gl * 1.25);
      u.flash = Math.max(0, u.flash - dt * 2.5);
      const eye = Math.max(1 - u.shown * 0.85, u.wake);
      u.eyeMat.color.setRGB(eye, 0.06 + eye * 0.1, 0.05);
      u.ringMat.opacity = s.stone > 0 ? 0.25 + 0.1 * Math.sin(tAll * 4) : 0;
      if (u.arcStone !== s.stone) { u.arcStone = s.stone; u.arc.geometry.dispose(); u.arc.geometry = new THREE.RingGeometry(0.31, 0.36, 32, 1, Math.PI / 2, Math.PI * 2 * Math.max(0.001, stoneK)); u.arc.visible = s.stone > 0; }
    }
    if (level && level.userData.key) { const k = level.userData.key; k.rotation.y += dt * 1.8; k.position.y = 0.42 + Math.sin(tAll * 2.2) * 0.04; }
    if (level) { const e = level.userData.exit; e.colMat.opacity = 0.2 + Math.sin(tAll * 2.5) * 0.06; }
  }
  for (const k of ['l', 'r', 'b', 't']) { if (edgeV[k] > 0) { edgeV[k] = Math.max(0, edgeV[k] - dt * 1.1); $('e' + k.toUpperCase()).style.opacity = edgeV[k]; } }
  if (map && state !== 'title') drawMini();
  if (flashT > 0) { flashT = Math.max(0, flashT - dt * 1.2); const f = $('flash'); f.style.background = '#a00'; f.style.opacity = flashT * 0.6; }
  else if (descendT === 0 && state === 'play') $('flash').style.opacity = 0;
  renderer.render(scene, camera);
}
let descendT = 0;

// demo scene behind the title
$('floor').textContent = '';
floorIdx = 0; cfg = FLOORS[0]; floorSeed = 12345; genFloor(cfg, floorSeed); haveKey = true; buildLevel(); setCamNow(); updateSeen();
resize(); showTitle();
requestAnimationFrame(frame);
</script>
</body>
