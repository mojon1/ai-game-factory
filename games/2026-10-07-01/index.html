<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ジャングル・キーラビリンス</title>
<style>
  html,body{margin:0;height:100%;background:#0b1a10;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const cv = document.getElementById('c'), g = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize); resize();

  // ---------- 状態 ----------
  let state = 'title', level = 1, score = 0, best = 0, timeLeft = 0;
  let maze, cols, rows, player, keys, door, snakes, collected, needKeys, particles = [], msgT = 0;
  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];

  function makeMaze(c, r) {
    // 穴掘り法（各セルに右・下の壁を持つ）
    const wall = [];
    for (let y = 0; y < r; y++) { wall.push([]); for (let x = 0; x < c; x++) wall[y].push({ r: true, d: true, seen: false }); }
    const st = [[0, 0]]; wall[0][0].seen = true;
    while (st.length) {
      const [x, y] = st[st.length - 1];
      const n = DIRS.map(([dx, dy]) => [x + dx, y + dy]).filter(([a, b]) => a >= 0 && b >= 0 && a < c && b < r && !wall[b][a].seen);
      if (!n.length) { st.pop(); continue; }
      const [nx, ny] = n[(Math.random() * n.length) | 0];
      if (nx > x) wall[y][x].r = false; else if (nx < x) wall[ny][nx].r = false;
      else if (ny > y) wall[y][x].d = false; else wall[ny][nx].d = false;
      wall[ny][nx].seen = true; st.push([nx, ny]);
    }
    // ループを少し追加して遊びやすく
    for (let i = 0; i < c * r * 0.08; i++) {
      const x = (Math.random() * (c - 1)) | 0, y = (Math.random() * (r - 1)) | 0;
      if (Math.random() < 0.5) wall[y][x].r = false; else wall[y][x].d = false;
    }
    return wall;
  }
  function canMove(x, y, dx, dy) {
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) return false;
    if (dx === 1) return !maze[y][x].r;
    if (dx === -1) return !maze[y][nx].r;
    if (dy === 1) return !maze[y][x].d;
    return !maze[ny][x].d;
  }
  function freeCell(avoid) {
    for (let t = 0; t < 500; t++) {
      const x = (Math.random() * cols) | 0, y = (Math.random() * rows) | 0;
      if (avoid.every((p) => Math.abs(p.x - x) + Math.abs(p.y - y) > 3)) return { x, y };
    }
    return { x: cols - 1, y: rows - 1 };
  }
  function startLevel() {
    const aspect = W / H;
    rows = Math.min(14, 6 + level);
    cols = Math.max(rows, Math.round(rows * aspect));
    maze = makeMaze(cols, rows);
    player = { x: 0, y: 0, px: 0, py: 0, moveT: 0 };
    door = { x: cols - 1, y: rows - 1 };
    needKeys = Math.min(5, 2 + Math.floor(level / 2));
    keys = []; const used = [player, door];
    for (let i = 0; i < needKeys; i++) { const k = freeCell(used); keys.push(k); used.push(k); }
    snakes = [];
    for (let i = 0; i < Math.min(4, level - 1); i++) { const s = freeCell(used); s.px = s.x; s.py = s.y; s.dir = 0; s.t = 0; snakes.push(s); used.push(s); }
    collected = 0; timeLeft = 45 + level * 10; msgT = 1.5;
  }
  function newGame() { level = 1; score = 0; state = 'play'; startLevel(); }

  // ---------- 入力 ----------
  const held = {};
  let tapDir = null;
  addEventListener('keydown', (e) => {
    held[e.code] = true;
    if (['Space', 'Enter'].includes(e.code)) { if (state !== 'play') { newGame(); beep(520, 0.1); } }
    if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  });
  addEventListener('keyup', (e) => { held[e.code] = false; });
  cv.addEventListener('pointerdown', (e) => {
    if (state !== 'play') { newGame(); beep(520, 0.1); return; }
    tapDir = dirFromPoint(e.clientX, e.clientY);
  });
  cv.addEventListener('pointermove', (e) => { if (tapDir) tapDir = dirFromPoint(e.clientX, e.clientY); });
  addEventListener('pointerup', () => { tapDir = null; });
  function dirFromPoint(x, y) {
    const v = view(); const cx = v.ox + (player.px + 0.5) * v.s, cy = v.oy + (player.py + 0.5) * v.s;
    const dx = x - cx, dy = y - cy;
    return Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
  }
  function inputDir() {
    if (held.ArrowLeft || held.KeyA) return [-1, 0];
    if (held.ArrowRight || held.KeyD) return [1, 0];
    if (held.ArrowUp || held.KeyW) return [0, -1];
    if (held.ArrowDown || held.KeyS) return [0, 1];
    return tapDir;
  }

  // ---------- 音 ----------
  let ac = null;
  function beep(f, d, type = 'square') {
    try {
      ac ||= new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), v = ac.createGain();
      o.type = type; o.frequency.value = f; v.gain.value = 0.06;
      v.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
      o.connect(v).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }

  // ---------- 更新 ----------
  function burst(x, y, col) {
    for (let i = 0; i < 18; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4, life: 1, col });
  }
  function update(dt) {
    particles = particles.filter((p) => (p.life -= dt * 1.5) > 0);
    particles.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; });
    if (state !== 'play') return;
    msgT -= dt;
    timeLeft -= dt;
    if (timeLeft <= 0) { gameOver(); return; }
    // プレイヤー移動（マス単位・なめらか補間）
    player.moveT -= dt;
    if (player.moveT <= 0) {
      const d = inputDir();
      if (d && canMove(player.x, player.y, d[0], d[1])) { player.x += d[0]; player.y += d[1]; player.moveT = 0.12; }
    }
    player.px += (player.x - player.px) * Math.min(1, dt * 18);
    player.py += (player.y - player.py) * Math.min(1, dt * 18);
    // 鍵
    keys = keys.filter((k) => {
      if (k.x === player.x && k.y === player.y) { collected++; score += 100; burst(k.x + 0.5, k.y + 0.5, '#ffd84a'); beep(880, 0.12, 'triangle'); return false; }
      return true;
    });
    // 扉
    if (collected >= needKeys && player.x === door.x && player.y === door.y) {
      score += 500 + Math.floor(timeLeft) * 10; level++; beep(660, 0.3, 'triangle'); burst(door.x + 0.5, door.y + 0.5, '#7dffb0'); startLevel();
    }
    // ヘビ（迷路をうろつく）
    for (const s of snakes) {
      s.t -= dt;
      if (s.t <= 0) {
        const opts = DIRS.map((d, i) => i).filter((i) => canMove(s.x, s.y, DIRS[i][0], DIRS[i][1]));
        const fwd = opts.filter((i) => i !== (s.dir + 2) % 4);
        // プレイヤーが近いと追いかける
        const near = Math.abs(s.x - player.x) + Math.abs(s.y - player.y) < 5;
        let choice = fwd.length ? fwd[(Math.random() * fwd.length) | 0] : opts[0];
        if (near) {
          const best = opts.slice().sort((a, b) => {
            const da = Math.abs(s.x + DIRS[a][0] - player.x) + Math.abs(s.y + DIRS[a][1] - player.y);
            const db = Math.abs(s.x + DIRS[b][0] - player.x) + Math.abs(s.y + DIRS[b][1] - player.y);
            return da - db;
          })[0];
          if (Math.random() < 0.7) choice = best;
        }
        if (choice !== undefined) { s.dir = choice; s.x += DIRS[choice][0]; s.y += DIRS[choice][1]; }
        s.t = Math.max(0.22, 0.42 - level * 0.02);
      }
      s.px += (s.x - s.px) * Math.min(1, dt * 10);
      s.py += (s.y - s.py) * Math.min(1, dt * 10);
      if (Math.hypot(s.px - player.px, s.py - player.py) < 0.6) { gameOver(); return; }
    }
  }
  function gameOver() { state = 'over'; best = Math.max(best, score); beep(140, 0.5, 'sawtooth'); burst(player.px + 0.5, player.py + 0.5, '#ff6a6a'); }

  // ---------- 描画 ----------
  function view() {
    const top = 44;
    const s = Math.min(W / (cols + 1), (H - top - 10) / (rows + 0.5));
    return { s, ox: (W - cols * s) / 2, oy: top + (H - top - rows * s) / 2 };
  }
  function drawBg(t) {
    const gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, '#0f2b17'); gr.addColorStop(1, '#06120a');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    // 葉っぱの影
    g.globalAlpha = 0.08;
    for (let i = 0; i < 14; i++) {
      const x = (i * 97 + Math.sin(t * 0.3 + i) * 20) % W, y = (i * 61) % H;
      g.fillStyle = '#4fd27a'; g.beginPath(); g.ellipse(x, y, 60, 22, i, 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = 1;
  }
  function drawMaze(t) {
    const v = view(), s = v.s;
    // 床
    g.fillStyle = '#1d3a22'; g.fillRect(v.ox, v.oy, cols * s, rows * s);
    // 壁（茂み）
    g.strokeStyle = '#3f8f4a'; g.lineWidth = Math.max(3, s * 0.18); g.lineCap = 'round';
    g.beginPath();
    g.moveTo(v.ox, v.oy); g.lineTo(v.ox + cols * s, v.oy);
    g.moveTo(v.ox, v.oy); g.lineTo(v.ox, v.oy + rows * s);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const X = v.ox + x * s, Y = v.oy + y * s;
      if (maze[y][x].r) { g.moveTo(X + s, Y); g.lineTo(X + s, Y + s); }
      if (maze[y][x].d) { g.moveTo(X, Y + s); g.lineTo(X + s, Y + s); }
    }
    g.stroke();
    g.strokeStyle = '#6cd47a'; g.lineWidth = Math.max(1, s * 0.05); g.stroke();
    // 扉
    const open = collected >= needKeys;
    const dx = v.ox + door.x * s, dy = v.oy + door.y * s;
    g.fillStyle = open ? '#7dffb0' : '#5b4630';
    g.shadowColor = open ? '#7dffb0' : 'transparent'; g.shadowBlur = open ? 16 + Math.sin(t * 5) * 6 : 0;
    g.fillRect(dx + s * 0.22, dy + s * 0.15, s * 0.56, s * 0.72);
    g.shadowBlur = 0;
    g.fillStyle = '#20140a'; g.font = `${s * 0.4}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(open ? '出' : '🔒', dx + s / 2, dy + s / 2);
    // 鍵
    for (const k of keys) {
      const kx = v.ox + (k.x + 0.5) * s, ky = v.oy + (k.y + 0.5) * s + Math.sin(t * 4 + k.x) * s * 0.06;
      g.shadowColor = '#ffd84a'; g.shadowBlur = 12; g.fillStyle = '#ffd84a';
      g.beginPath(); g.arc(kx - s * 0.1, ky, s * 0.14, 0, 7); g.fill();
      g.fillRect(kx, ky - s * 0.04, s * 0.26, s * 0.08); g.fillRect(kx + s * 0.16, ky, s * 0.06, s * 0.12);
      g.shadowBlur = 0;
    }
    // ヘビ
    for (const sn of snakes) {
      const sx = v.ox + (sn.px + 0.5) * s, sy = v.oy + (sn.py + 0.5) * s;
      g.fillStyle = '#c23b5a';
      for (let i = 3; i >= 0; i--) { g.beginPath(); g.arc(sx - DIRS[sn.dir][0] * i * s * 0.12, sy - DIRS[sn.dir][1] * i * s * 0.12, s * (0.28 - i * 0.04), 0, 7); g.fill(); }
      g.fillStyle = '#fff'; g.beginPath(); g.arc(sx + s * 0.08, sy - s * 0.08, s * 0.06, 0, 7); g.fill();
    }
    // プレイヤー（探検家）
    const px = v.ox + (player.px + 0.5) * s, py = v.oy + (player.py + 0.5) * s;
    g.fillStyle = '#f0c27a'; g.beginPath(); g.arc(px, py, s * 0.3, 0, 7); g.fill();
    g.fillStyle = '#8a5a2b'; g.beginPath(); g.ellipse(px, py - s * 0.16, s * 0.38, s * 0.12, 0, 0, 7); g.fill();
    g.fillRect(px - s * 0.18, py - s * 0.34, s * 0.36, s * 0.18);
    g.fillStyle = '#1b1b1b'; g.fillRect(px - s * 0.12, py + s * 0.02, s * 0.06, s * 0.06); g.fillRect(px + s * 0.06, py + s * 0.02, s * 0.06, s * 0.06);
    // パーティクル
    for (const p of particles) {
      g.globalAlpha = p.life; g.fillStyle = p.col;
      g.fillRect(v.ox + p.x * s - 2, v.oy + p.y * s - 2, 4, 4);
    }
    g.globalAlpha = 1;
  }
  function hud() {
    g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 0, W, 40);
    g.fillStyle = '#e9ffe9'; g.font = 'bold 16px sans-serif'; g.textBaseline = 'middle'; g.textAlign = 'left';
    g.fillText(`ステージ ${level}`, 12, 20);
    g.textAlign = 'center';
    g.fillStyle = '#ffd84a'; g.fillText(`🔑 ${collected} / ${needKeys}`, W / 2 - 70, 20);
    g.fillStyle = timeLeft < 10 ? '#ff7070' : '#e9ffe9'; g.fillText(`⏱ ${Math.ceil(timeLeft)}`, W / 2 + 50, 20);
    g.textAlign = 'right'; g.fillStyle = '#e9ffe9'; g.fillText(`SCORE ${score}`, W - 12, 20);
  }
  function center(lines, sub) {
    g.fillStyle = 'rgba(4,14,8,.72)'; g.fillRect(0, 0, W, H);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    lines.forEach(([txt, size, col], i) => { g.font = `bold ${size}px sans-serif`; g.fillStyle = col; g.fillText(txt, W / 2, H / 2 - 50 + i * (size + 14)); });
    if (sub) { g.font = '15px sans-serif'; g.fillStyle = '#bfe8c4'; g.fillText(sub, W / 2, H - 40); }
  }

  let last = 0;
  function frame(ts) {
    const t = ts / 1000, dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
    update(dt);
    drawBg(t);
    if (state === 'title') {
      if (!maze) { level = 1; startLevel(); }
      drawMaze(t);
      center([['ジャングル・キーラビリンス', Math.min(34, W / 14), '#ffd84a'], ['鍵を全部集めて出口へ！ ヘビに注意', 17, '#e9ffe9'], ['Space / クリック / タップでスタート', 16, '#7dffb0']], '移動: 矢印キー / WASD / 進みたい方向をタップ（長押しで連続移動）');
    } else {
      drawMaze(t); hud();
      if (state === 'play' && msgT > 0) { g.font = 'bold 28px sans-serif'; g.textAlign = 'center'; g.fillStyle = `rgba(255,216,74,${Math.min(1, msgT)})`; g.fillText(`ステージ ${level}`, W / 2, H / 2); }
      if (state === 'over') center([['ゲームオーバー', 34, '#ff7a7a'], [`スコア ${score}（ステージ ${level}）`, 20, '#e9ffe9'], [`ベスト ${best}`, 16, '#ffd84a']], 'Space / タップでもう一度');
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
