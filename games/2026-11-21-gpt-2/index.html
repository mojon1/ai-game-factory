<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overscroll-behavior:none;background:#263c49;color:#fff5db;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}main{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(#42616a,#213440)}header{position:absolute;top:3%;left:6%;right:6%;display:flex;justify-content:space-between;font-size:17px;font-weight:700}#now{position:absolute;top:13%;left:7%;font-size:16px}#now strong{display:inline-block;font-size:32px;margin-left:10px;color:#f4d07f}#next{position:absolute;top:16%;right:7%;font-size:16px}#status{position:absolute;top:23%;width:100%;text-align:center;font-size:15px;color:#c7efd3}#board{position:absolute;top:30%;left:7%;right:7%;height:46%;display:flex;gap:8px}.column{position:relative;width:25%;min-width:44px;min-height:44px;display:flex;flex-direction:column-reverse;gap:5px;padding:5px;border:2px solid #86aca3;border-radius:12px;background:#1c3440}.column:before{content:attr(data-label);position:absolute;top:-23px;left:0;right:0;text-align:center;font-size:13px;color:#e2ecdd;pointer-events:none}.column.full{border-color:#dd8d83}#undo{position:absolute;top:1%;left:42%;width:16%;height:44px;min-width:50px;border:1px solid #b8d3c3;border-radius:10px;background:#bcd8c8;color:#213440;font-size:13px}#undo:disabled{opacity:.35}.column.on{border-color:#ffe09a;box-shadow:0 0 0 2px #ffd480}.tile{height:calc(25% - 4px);display:flex;align-items:center;justify-content:center;border-radius:9px;color:#21313d;font-size:28px;font-weight:800;background:#d8e9dc}.tile.hit{outline:3px solid #fff3a5;transform:scale(.9)}.tile.empty{border:1px dashed #75948b;background:transparent;color:transparent}.tile.ghost{opacity:.45;border:2px solid #ffdf90}#rule{position:absolute;top:80%;width:100%;text-align:center;font-size:14px;white-space:pre-line}#hint{position:absolute;bottom:5%;width:100%;text-align:center;font-size:14px}#cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;background:#203744f2}#cover.hidden{display:none}#cover.result{align-items:flex-end;background:transparent;padding:0}#cover.result>div{background:#203744f5;width:100%;padding:14px 10px}h1{font-size:30px;line-height:1.3;margin:0 0 22px}p{font-size:16px;line-height:1.8;white-space:pre-line}b{display:block;color:#b2e9c9;font-size:18px;margin-top:24px}#cover.result h1{font-size:26px;margin:0}#cover.result p{font-size:15px;line-height:1.3;margin:8px}#cover.result b{font-size:17px;margin-top:12px}
</style></head><body><main><header><span id="score"></span><span id="left"></span></header><button id="undo"></button><div id="now"></div><div id="next"></div><div id="status"></div><div id="board"></div><div id="rule"></div><div id="hint"></div><div id="cover"></div></main><script>
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),T=({ja:{title:'十を待つ落とし棚',intro:'列を選び、離して数字を落とす。\n隣り合う二枚で10なら消える。\n落ちた後も10なら、連鎖！',start:'タップでスタート',again:'タップでもう一度',undo:'戻す',now:'いま',next:'つぎ',left:'残り',score:'点',best:'ベスト',newbest:'ベスト更新！',preview:'予告',noPair:'今は消えない',rule:'上下左右で10 → 消える\n1組目10点、2組目20点…',hint:'押している間は列を選べる。離して落とす。',choose:'どの列へ落とす？',full:'その列は満杯。別の列へ。',pair:'組',chain:'連鎖',end:'36枚を置いた',blocked:'棚がいっぱい',drop:'落とす列'},en:{title:'Ten on the Falling Shelf',intro:'Choose a column; release to drop.\nTouching pairs totaling 10 disappear.\nA new pair after falling starts a chain!',start:'Tap to start',again:'Tap to play again',undo:'Undo',now:'Now',next:'Next',left:'Left',score:'Score',best:'Best',newbest:'New best!',preview:'Preview',noPair:'No pair yet',rule:'Neighboring pairs make 10 → clear\nFirst pair 10, second 20…',hint:'Hold to choose a column. Release to drop.',choose:'Which column gets the next number?',full:'This column is full. Choose another.',pair:'pairs',chain:'chain',end:'All 36 tiles placed',blocked:'The shelf is full',drop:'Drop column'}})[LANG==='ja'?'ja':'en'];
const el=id=>document.getElementById(id),signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};
for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});
let history=[],flash=[],cols=[[],[],[],[]],deck=[],idx=0,score=0,best=0,phase='title',guard=0,pointer=null,chosen=-1,message='',started=0,ac;
function sound(f){try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(.045,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.14);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.14)}catch{}}
function pair(b){for(let y=0;y<4;y++)for(let x=0;x<4;x++){if(b[x][y]==null)continue;if(y<3&&b[x][y+1]!=null&&b[x][y]+b[x][y+1]===10)return[[x,y],[x,y+1]];if(x<3&&b[x+1][y]!=null&&b[x][y]+b[x+1][y]===10)return[[x,y],[x+1,y]]}return null}
function remove(b,p){const sorted=p.slice().sort((a,b)=>b[1]-a[1]);for(const [x,y]of sorted)b[x].splice(y,1)}
async function resolve(){let n=0,p;while(p=pair(cols)){n++;flash=p;message=n+' '+T.chain+': '+cols[p[0][0]][p[0][1]]+' + '+cols[p[1][0]][p[1][1]]+' = 10';render();sound(400+n*130);await new Promise(r=>setTimeout(r,260));remove(cols,p);score+=10*n;flash=[];render();await new Promise(r=>setTimeout(r,100))}return n}
function preview(){if(chosen<0||cols[chosen].length>=4)return null;const b=cols.map(c=>c.slice());b[chosen].push(deck[idx]);let p,first=null,n=0,points=0;while(p=pair(b)){first??=p;remove(b,p);points+=10*++n}return{first,points}}
function render(){const pre=preview();el('undo').textContent=T.undo;el('undo').disabled=phase!=='play'||!history.length;el('score').textContent=T.score+' '+score;el('left').textContent=T.left+' '+(36-idx);el('now').innerHTML=T.now+'<strong>'+(deck[idx]??'—')+'</strong>';el('next').textContent=T.next+' '+deck.slice(idx+1,idx+3).join(' · ');el('status').textContent=chosen>=0&&cols[chosen].length>=4?T.full:pre?(pre.points?T.preview+' +'+pre.points:T.noPair):(message||T.choose);el('rule').textContent=T.rule;el('board').innerHTML=cols.map((b,x)=>'<div class="column '+(chosen===x?'on ':'')+(b.length===4?'full':'')+'" data-label="'+(x+1)+'" data-col="'+x+'" role="button" aria-label="'+T.drop+' '+(x+1)+'">'+Array.from({length:4},(_,y)=>{const v=b[y]??(chosen===x&&y===b.length?deck[idx]:null);return'<div class="tile '+((flash.length?flash:pre?.first||[]).some(p=>p[0]===x&&p[1]===y)?'hit ':'')+(b[y]==null?(v==null?'empty':'ghost'):'')+'" style="'+(v!=null?'background:hsl('+(v*18+25)+' 56% 77%)':'')+'">'+(v??'')+'</div>'}).join('')+'</div>').join('')}
function cover(title,body,last,result=false){el('cover').className=result?'result':'';el('cover').innerHTML='<div><h1>'+title+'</h1><p>'+body+'</p><b>'+last+'</b></div>'}
function start(){history=[];flash=[];cols=[[],[],[],[]];deck=[6,3,4,2,7];let tail=[];for(let i=0;i<16;i++){const v=1+Math.floor(Math.random()*9);tail.push(v,10-v)}for(let i=tail.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[tail[i],tail[j]]=[tail[j],tail[i]]}deck.push(...tail.slice(0,31));idx=0;score=0;chosen=-1;pointer=null;message='';phase='play';started=performance.now();el('cover').className='hidden';el('hint').textContent=T.hint;render();signal('start')}
function end(){phase='end';guard=performance.now()+700;const record=score>best;best=Math.max(best,score);cover(idx>=36?T.end:T.blocked,T.score+' '+score+'\n'+T.best+' '+best+(record?' — '+T.newbest:''),T.again,true);signal('end',{score})}
function colAt(e){const r=el('board').getBoundingClientRect();return Math.max(0,Math.min(3,Math.floor((e.clientX-r.left)/r.width*4)))}
el('board').addEventListener('pointerdown',e=>{if(phase!=='play'||pointer!==null)return;pointer=e.pointerId;chosen=colAt(e);try{el('board').setPointerCapture(e.pointerId)}catch{}render()});
addEventListener('pointermove',e=>{if(e.pointerId===pointer&&phase==='play'){chosen=colAt(e);render()}});
addEventListener('pointerup',async e=>{if(e.pointerId!==pointer)return;pointer=null;if(phase!=='play')return;if(cols[chosen].length>=4){message=T.full;chosen=-1;render();return}history.push({cols:cols.map(b=>b.slice()),idx,score,message});const c=chosen;chosen=-1;phase='busy';cols[c].push(deck[idx++]);const n=await resolve();phase='play';message=n?(n+' '+(n>1?T.chain:T.pair)+' +'+10*n*(n+1)/2):'';sound(n?400+n*130:280);chosen=-1;render();if(idx===36||cols.every(b=>b.length===4))end()});
addEventListener('pointercancel',e=>{if(e.pointerId===pointer){pointer=null;chosen=-1;render()}});
el('undo').addEventListener('pointerdown',()=>{if(phase!=='play'||!history.length)return;const h=history.pop();cols=h.cols;idx=h.idx;score=h.score;message=h.message;pointer=null;chosen=-1;flash=[];render();sound(300)});
el('cover').addEventListener('pointerdown',()=>{if(phase==='title'||phase==='end'&&performance.now()>=guard){sound(330);start()}});
function tick(t){if(t-started>5500)el('hint').textContent='';requestAnimationFrame(tick)}requestAnimationFrame(tick);cover(T.title,T.intro,T.start);
</script></body></html>
