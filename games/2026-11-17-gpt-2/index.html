<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>鐘と斥候</title><style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overscroll-behavior:none;background:#192f3b;color:#f4e9c9;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:radial-gradient(ellipse,#34515a,#192f3b)}header{position:absolute;top:4%;left:6%;right:6%;display:flex;justify-content:space-between;font-size:17px}#status{position:absolute;top:12%;width:100%;text-align:center;font-size:15px}canvas{position:absolute;left:0;top:20%;width:100%;height:55%}#selected{position:absolute;top:74%;width:100%;text-align:center;font-size:15px}#buttons{position:absolute;top:81%;left:8%;width:84%;display:flex;gap:14px}button{flex:1;min-height:50px;border:2px solid #afc4bf;border-radius:12px;background:#294650;color:#f4e9c9;font:700 17px system-ui}button.active{background:#637b78;border-color:#f3dc8f}#hint{position:absolute;bottom:3%;width:100%;text-align:center;font-size:13px}#cover{position:absolute;inset:0;padding:7%;background:#192f3bf2;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}#cover.hidden{display:none}#cover{z-index:1}#undo{position:relative;z-index:2}button:disabled{opacity:.35}h1{font-size:clamp(25px,7vw,35px)}p{font-size:17px;line-height:1.7;white-space:pre-line}
</style></head><body><div id="game"><header><span id="score"></span><span id="turn"></span></header><div id="status"></div><canvas></canvas><div id="selected"></div><div id="buttons"><button id="scout"></button><button id="bell"></button><button id="undo"></button></div><div id="hint"></div><div id="cover"></div></div><script>
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),words={ja:{title:'鐘と斥候',intro:'青い斥候で旗三つを集め、家へ帰る。\n赤い番人は二手ごとに鐘を追う。\n駒を選び、光るマスへ動かそう。',start:'タップでスタート',again:'タップでもう一度',flags:'旗',moves:'手',scout:'斥候',bell:'鐘',guard:'番人',scoutMark:'斥',bellMark:'鐘',guardMark:'番',home:'家',one:'縦横1マス',two:'縦横2マスまで',soon:'次の手で番人が動く',rest:'番人は次の手は休む',hint:'下で駒を選び、行き先をタップ',clear:'三旗を持って帰還！',lost:'番人に見つかった',best:'最短',newBest:'ベスト更新！',undo:'戻す',legend:'橙は危険',returnHome:'斥候を家へ戻そう',invalid:'光るマスを選んでください',danger:'次は鐘が捕まる',caughtScout:'斥候が捕まった',caughtBell:'鐘が捕まった'},en:{title:'Bell and Scout',intro:'Collect three flags with the blue scout.\nReturn home; the guard follows the bell.\nGuard moves every two turns.',start:'Tap to start',again:'Tap to play again',flags:'Flags',moves:'Moves',scout:'Scout',bell:'Bell',guard:'Guard',scoutMark:'S',bellMark:'B',guardMark:'G',home:'Home',one:'1 square, straight',two:'Up to 2 squares, straight',soon:'Guard moves after your next turn',rest:'Guard rests after your next turn',hint:'Choose a piece below, then tap its destination',clear:'Three flags brought home!',lost:'Caught by the guard',best:'Fewest moves',newBest:'New best!',undo:'Undo',legend:'Orange: unsafe',returnHome:'Bring the scout home',invalid:'Choose a highlighted square',danger:'The bell will be caught next',caughtScout:'The scout was caught',caughtBell:'The bell was caught'}};
const t=words[LANG==='ja'?'ja':'en'],$=x=>document.getElementById(x),cv=document.querySelector('canvas'),g=cv.getContext('2d'),cover=$('cover');
const signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};
for(const type of ['contextmenu','selectstart','gesturestart'])addEventListener(type,e=>e.preventDefault(),{passive:false});
let history=[];let mode='title',scout={x:0,y:4},bell={x:4,y:0},guard={x:2,y:2},flags=[],selected='scout',turn=0,ended=0,started=0,best=null,notice='',last=0;
const same=(a,b)=>a.x===b.x&&a.y===b.y,count=()=>flags.filter(f=>f.got).length;
function nextGuard(b=bell){const n={...guard};if(n.x!==b.x)n.x+=Math.sign(b.x-n.x);else if(n.y!==b.y)n.y+=Math.sign(b.y-n.y);return n}
function canMove(p,who=selected){const src=who==='scout'?scout:bell,other=who==='scout'?bell:scout,dist=Math.abs(p.x-src.x)+Math.abs(p.y-src.y);if(p.x<0||p.x>4||p.y<0||p.y>4||!dist||dist>(who==='scout'?1:2)||(p.x!==src.x&&p.y!==src.y)||same(p,other)||same(p,guard))return false;if(dist===2){const mid={x:(src.x+p.x)/2,y:(src.y+p.y)/2};if(same(mid,guard)||same(mid,other))return false}return true}
function overlay(title,body,action){cover.innerHTML='<h1>'+title+'</h1><p>'+body+'</p><p>'+action+'</p>';cover.classList.remove('hidden')}
function start(){scout={x:0,y:4};bell={x:4,y:0};guard={x:2,y:2};flags=[{x:0,y:0,got:false},{x:2,y:0,got:false},{x:1,y:2,got:false}];turn=0;selected='scout';history=[];notice='';mode='play';started=performance.now();cover.classList.add('hidden');signal('start')}
function finish(win){mode='result';ended=performance.now();const improved=win&&(best===null||turn<best);if(win)best=Math.min(best??Infinity,turn);signal('end',{score:count()});overlay(win?t.clear:(same(guard,bell)?t.caughtBell:t.caughtScout),t.flags+' '+count()+'/3\n'+t.moves+' '+turn+(best===null?'':'\n'+t.best+' '+best)+(improved?'\n'+t.newBest:''),t.again)}
function move(p){if(mode!=='play')return;if(!canMove(p)){notice=t.invalid;return}history.push(JSON.parse(JSON.stringify({scout,bell,guard,flags,turn,selected})));if(selected==='scout')scout=p;else bell=p;turn++;notice='';for(const f of flags)if(same(f,scout))f.got=true;if(turn%2===0)guard=nextGuard();if(same(guard,scout)||same(guard,bell)){finish(false);return}if(count()===3&&same(scout,{x:0,y:4}))finish(true)}
function unsafe(p){if(turn%2===0)return false;const n=nextGuard(selected==='bell'?p:bell);return same(n,selected==='scout'?p:scout)||same(n,selected==='bell'?p:bell)}function undo(){if(!history.length||mode==='title'||(mode==='result'&&performance.now()-ended<700))return;const resumed=mode==='result';({scout,bell,guard,flags,turn,selected}=history.pop());mode='play';notice='';cover.classList.add('hidden');if(resumed)signal('start')}$('undo').addEventListener('pointerdown',e=>{e.preventDefault();undo()});
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(mode!=='play')return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*360/r.width,y=(e.clientY-r.top)*360/r.height;move({x:Math.floor((x-30)/60),y:Math.floor((y-20)/60)})});
for(const who of ['scout','bell'])$(who).addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='play'){selected=who;notice=''}});
cover.addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='title'||performance.now()-ended>=700)start()});
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d)}addEventListener('resize',resize);resize();
const center=p=>({x:60+p.x*60,y:50+p.y*60});
function draw(now){g.setTransform(cv.width/360,0,0,cv.height/360,0,0);g.clearRect(0,0,360,360);
for(let y=0;y<5;y++)for(let x=0;x<5;x++){g.fillStyle=(x+y)%2?'#42636a':'#38555e';g.fillRect(30+x*60,20+y*60,58,58);if(mode==='play'&&canMove({x,y})){g.fillStyle=unsafe({x,y})?'#e7a56a88':'#aad8bc66';g.fillRect(35+x*60,25+y*60,48,48)}}
const h=center({x:0,y:4});g.strokeStyle=count()===3?'#fff2ad':'#f6df9f';g.lineWidth=count()===3?5:3;g.strokeRect(h.x-23,h.y-23,46,46);
for(const f of flags)if(!f.got){const p=center(f);g.strokeStyle='#f8dc87';g.lineWidth=3;g.beginPath();g.moveTo(p.x-10,p.y+15);g.lineTo(p.x-10,p.y-16);g.stroke();g.fillStyle='#f8dc87';g.beginPath();g.moveTo(p.x-10,p.y-16);g.lineTo(p.x+14,p.y-7);g.lineTo(p.x-10,p.y+1);g.fill()}
g.fillStyle='#f6df9f';g.font='12px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(t.home,h.x,h.y+19);if(mode==='play'&&turn%2===1){const n=center(nextGuard());g.strokeStyle='#f199a3';g.lineWidth=3;g.strokeRect(n.x-26,n.y-26,52,52)}
for(const [p,color,label,who]of [[scout,'#a9dce5',t.scoutMark,'scout'],[bell,'#f7d98d',t.bellMark,'bell'],[guard,'#df8996',t.guardMark,'guard']]){const q=center(p);g.fillStyle=color;g.beginPath();g.arc(q.x,q.y,19,0,7);g.fill();g.fillStyle='#20353e';g.font='bold 17px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(label,q.x,q.y);if(who===selected){g.strokeStyle='#fff1c2';g.lineWidth=2;g.beginPath();g.arc(q.x,q.y,24,0,7);g.stroke()}}
$('score').textContent=t.flags+' '+count()+'/3';$('turn').textContent=t.moves+' '+turn;$('status').textContent=notice||(turn%2?(same(nextGuard(),bell)?t.danger:t.soon):t.rest);$('status').style.color=turn%2?'#ffb8ac':'#f4e9c9';$('selected').textContent=(selected==='scout'?t.scout+' · '+t.one:t.bell+' · '+t.two)+' · '+t.legend;$('scout').textContent=t.scout;$('bell').textContent=t.bell;$('scout').classList.toggle('active',selected==='scout');$('bell').classList.toggle('active',selected==='bell');$('undo').textContent=t.undo;$('undo').disabled=!history.length;$('undo').style.visibility=mode==='title'?'hidden':'visible';$('hint').textContent=mode==='play'?(count()===3?t.returnHome:now-started<5000?t.hint:''):'';
}
function loop(now){draw(now);requestAnimationFrame(loop)}flags=[{x:0,y:0},{x:2,y:0},{x:1,y:2}];overlay(t.title,t.intro,t.start);requestAnimationFrame(loop);
</script></body></html>
