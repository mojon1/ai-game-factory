for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});const c=document.getElementById('c'),g=c.getContext('2d');let w,h,s,ox,oy,state='title',winter=false,x=0,y=4,item='',traded=false,steps=0,age=0,result=0,msg='',glow=0,audio;const rocks=[11,15,8];const signal=(agf,data={})=>parent.postMessage({agf,...data},'*');function resize(){w=innerWidth||360;h=innerHeight||640;let d=Math.min(2,devicePixelRatio||1);c.width=w*d;c.height=h*d;s=Math.min(w/360,h/640);ox=(w-360*s)/2;oy=(h-640*s)/2;g.setTransform(d*s,0,0,d*s,d*ox,d*oy)}resize();addEventListener('resize',resize);function tone(f){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),v=audio.createGain();o.connect(v);v.connect(audio.destination);o.frequency.value=f;v.gain.setValueAtTime(.035,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.start();o.stop(audio.currentTime+.19)}catch{}}
function visit(){const n=y*5+x;if(n===24&&!traded&&!item){if(!winter){item='fruit';msg=T.gather;tone(700)}else msg=T.leaf}if(n===0){if(winter)msg=T.sleep;else if(item==='fruit'){item='key';traded=true;msg=T.trade;tone(900)}else msg=T.need}if(n===4){if(item==='key'){state='end';result=0;signal('end',{score:steps});tone(1000)}else msg=T.locked}}
function start(){state='play';winter=false;x=0;y=4;item='';traded=false;steps=0;age=0;msg=T.arrive;signal('start')}c.addEventListener('pointerdown',e=>{tone(190);const px=(e.clientX-ox)/s,py=(e.clientY-oy)/s;if(state==='title'){start();return}if(state==='end'){if(result>.7)start();return}if(py>=535&&py<=593&&px>=50&&px<=310){if(x===2){msg=T.stay;return}winter=!winter;glow=.6;msg=winter?T.winter:T.summer;tone(winter?360:620);visit();return}const nx=Math.floor((px-30)/60),ny=Math.floor((py-200)/60);if(nx<0||nx>4||ny<0||ny>4||Math.abs(nx-x)+Math.abs(ny-y)!==1)return;if(rocks.includes(ny*5+nx)){msg=T.rock;return}if(nx===2&&!winter){msg=T.river;return}x=nx;y=ny;steps++;msg='';visit()});
function text(t,xx,yy,n=20,col='#fff2d1'){g.fillStyle=col;g.font='600 '+n+'px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif';g.textAlign='center';g.fillText(t,xx,yy,330)}function box(xx,yy,ww,hh,col){g.fillStyle=col;g.beginPath();g.roundRect(xx,yy,ww,hh,10);g.fill()}function draw(){g.fillStyle=winter?'#203a55':'#163c45';g.fillRect(-ox/s,-oy/s,w/s,h/s);if(state==='title'){text(T.title,180,115,30);text('☀   ⇄   ❄',180,300,55);text(T.a,180,477,18);text(T.b,180,510,18);text(T.c,180,543,17);text(T.start,180,606,22);return}text(steps+' '+T.moves,70,37,18);text(winter?T.winter:T.summer,284,37,20);text(item?T[item]:T.empty,180,87,22);text(T.goal,180,132,16);for(let j=0;j<5;j++)for(let i=0;i<5;i++){let n=j*5+i,xx=60+i*60,yy=230+j*60;box(xx-28,yy-28,56,56,i===2?(winter?'#92cbd9':'#397d9b'):(winter?'#cedbd6':'#6e9e6a'));if(rocks.includes(n))text('▲',xx,yy+10,30,'#52646b');if(i===2)text(winter?'—':'≈',xx,yy+8,27,winter?'#517e9b':'#a4d9db');if(n===0){text(winter?'zZ':'◆',xx,yy+3,25,'#ad653e');text(T.fox,xx,yy+22,12,'#253d3c')}if(n===4){box(xx-9,yy-24,18,37,state==='end'?'#ffda77':'#ece1bd');text(T.tower,xx,yy+23,12,'#253d3c')}if(n===24){text(traded||winter?'Y':'●',xx,yy+2,28,traded||winter?'#765a42':'#c45362');text(T.bush,xx,yy+23,12,'#253d3c')}if(i===x&&j===y){g.fillStyle='#ffe7a0';g.beginPath();g.arc(xx,yy,14,0,Math.PI*2);g.fill();text('•',xx,yy+5,18,'#223d40')}}text(msg,180,521,16);box(50,535,260,58,glow>0?'#b07e5d':'#4b686b');text(T.switch,180,572,21);if(age<4)text(T.hint,180,623,15);if(state==='end'){box(10,270,340,115,'#163c45');text(T.win,180,310,26);text(steps+' '+T.moves,180,342,20);text(T.again,180,373,18)}}let last;function loop(t){const dt=Math.min(.05,last?(t-last)/1000:0);last=t;age+=dt;result+=dt;glow-=dt;draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
