<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>てのひら灯火 / Cupped Flame</title>
<style>
html, body, canvas, * { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; margin: 0; padding: 0; background: #05060c; width: 100%; height: 100%; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
for (const t of ['contextmenu', 'selectstart', 'gesturestart']) addEventListener(t, (e) => e.preventDefault(), { passive: false });
const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };
const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const T = {
  ja: {
    title: 'てのひら灯火',
    how1: '風が来る方へ、指で手をかざして火を守ろう',
    how2: '手を近づけすぎると、火は息がつまる',
    how3: '夜明けまで灯し続けろ',
    start: 'タップでスタート',
    hint: '光る方角から風が来る — そこへ指を置いて手をかざす',
    night: (n) => n + '夜目',
    best: 'ベスト',
    dur: (m) => { const h = Math.floor(m / 60), mm = Math.floor(m % 60); return h > 0 ? h + '時間' + mm + '分' : mm + '分'; },
    out: '火が消えた…',
    lit: '灯した時間',
    blocked: (n) => 'ふせいだ風 ' + n,
    newBest: 'ベスト更新！',
    again: 'タップでもう一度',
    dawn: '夜明け！',
    dawnSub: (n) => n + '夜を越えた',
    nextNight: (n) => n + '夜目 — 風が強くなる',
    choke: '息がつまる！',
    fire: '火', air: '息',
    good: 'ふせいだ！',
    streak: (n) => '最大' + n + '連続',
    windOut: '風に消された',
    chokeOut: '息がつまって消えた',
  },
  en: {
    title: 'Cupped Flame',
    how1: 'Hold your hand where the wind comes from',
    how2: 'Too close, and the flame suffocates',
    how3: 'Keep it lit until dawn',
    start: 'Tap to start',
    hint: 'Wind comes from the glowing side — put your finger there',
    night: (n) => 'Night ' + n,
    best: 'Best',
    dur: (m) => { const h = Math.floor(m / 60), mm = Math.floor(m % 60); return h > 0 ? h + 'h ' + mm + 'm' : mm + 'm'; },
    out: 'The flame went out…',
    lit: 'Time lit',
    blocked: (n) => 'Gusts blocked ' + n,
    newBest: 'New best!',
    again: 'Tap to play again',
    dawn: 'Dawn!',
    dawnSub: (n) => n === 1 ? 'You made it through the night' : 'Survived ' + n + ' nights',
    nextNight: (n) => 'Night ' + n + ' — the wind grows',
    choke: 'Suffocating!',
    fire: 'Fire', air: 'Air',
    good: 'Blocked!',
    streak: (n) => 'best chain ' + n,
    windOut: 'Blown out by the wind',
    chokeOut: 'Smothered by your hand',
  },
}[LANG === 'ja' ? 'ja' : 'en'];
const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';

// ---------- canvas ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 360, H = 640, S = 1, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, window.innerWidth || 360);
  H = Math.max(1, window.innerHeight || 640);
  cv.width = Math.max(1, Math.round(W * DPR));
  cv.height = Math.max(1, Math.round(H * DPR));
  S = Math.max(0.3, Math.min(W / 360, H / 640));
  buildScene();
}
addEventListener('resize', resize);

// ---------- helpers ----------
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
function fitText(txt, maxW, size, weight = '700') {
  let s = size;
  ctx.font = weight + ' ' + s + 'px ' + FONT;
  while (s > 12 && ctx.measureText(txt).width > maxW) { s -= 1; ctx.font = weight + ' ' + s + 'px ' + FONT; }
  return s;
}

// ---------- save ----------
let best = 0, bestNights = 0;
addEventListener('message', (e) => {
  if (e.data && e.data.agf === 'loaded' && e.data.data) {
    best = Math.max(best, e.data.data.best || 0);
    bestNights = Math.max(bestNights, e.data.data.nights || 0);
  }
});
try { parent.postMessage({ agf: 'load' }, '*'); } catch (e) {}
const persist = () => { try { parent.postMessage({ agf: 'save', data: { best, nights: bestNights } }, '*'); } catch (e) {} };

// ---------- audio ----------
let AC = null, master = null, windGain = null, windBP = null, windLP = null, windPan = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
    const len = AC.sampleRate * 2;
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    let b0 = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; b0 = 0.97 * b0 + 0.03 * w; d[i] = w * 0.5 + b0 * 3; }
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    windBP = AC.createBiquadFilter(); windBP.type = 'bandpass'; windBP.frequency.value = 500; windBP.Q.value = 0.8;
    windLP = AC.createBiquadFilter(); windLP.type = 'lowpass'; windLP.frequency.value = 4000;
    windGain = AC.createGain(); windGain.gain.value = 0;
    windPan = AC.createStereoPanner ? AC.createStereoPanner() : null;
    src.connect(windBP); windBP.connect(windLP); windLP.connect(windGain);
    if (windPan) { windGain.connect(windPan); windPan.connect(master); } else windGain.connect(master);
    src.start();
    AC.resume();
  } catch (e) { AC = null; }
}
function tone(f, dur, vol, type = 'sine', when = 0, f2 = 0) {
  if (!AC) return;
  try {
    const t = AC.currentTime + when;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
function noiseBurst(dur, vol, freq, freq2) {
  if (!AC) return;
  try {
    const t = AC.currentTime;
    const len = Math.floor(AC.sampleRate * dur);
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = AC.createBufferSource(); s.buffer = buf;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t);
    f.frequency.exponentialRampToValueAtTime(freq2, t + dur);
    const g = AC.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start(t);
  } catch (e) {}
}
const sfxBell = () => { tone(784, 1.6, 0.06); tone(1176, 1.2, 0.03, 'sine', 0.01); };
const PENTA = [0, 2, 4, 7, 9];
const sfxGood = (n = 1) => { const k = Math.min(n - 1, 14); const f = 523 * Math.pow(2, (PENTA[k % 5] + 12 * Math.floor(k / 5)) / 12); tone(f, 0.35, 0.05, 'triangle'); tone(f * 1.5, 0.4, 0.025, 'sine', 0.05); };
const sfxOut = () => { noiseBurst(0.9, 0.5, 1800, 120); tone(330, 0.9, 0.05, 'sine', 0, 110); };
const sfxDawn = () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, 1.8, 0.05, 'sine', i * 0.16)); };
const sfxStart = () => { tone(440, 0.5, 0.05, 'sine', 0, 880); };
function cricket() {
  if (!AC) return;
  for (let i = 0; i < 3; i++) tone(4300 + Math.random() * 300, 0.04, 0.008, 'sine', i * 0.07);
}

// ---------- scene ----------
let stars = [], grass = [], hills = [];
function buildScene() {
  stars = [];
  for (let i = 0; i < 90; i++) stars.push({ x: Math.random(), y: Math.random() * 0.62, r: Math.random() * 1.3 + 0.3, tw: Math.random() * 6 });
  grass = [];
  const n = Math.ceil(W / (7 * S)) + 4;
  for (let i = 0; i < n; i++) {
    grass.push({ x: (i - 2) * 7 * S + rand(-3, 3) * S, h: rand(14, 42) * S, ph: Math.random() * 6, layer: Math.random() < 0.5 ? 0 : 1 });
  }
  hills = [];
  for (let i = 0; i <= 24; i++) hills.push(Math.sin(i * 0.7) * 0.5 + Math.sin(i * 1.9 + 1) * 0.3 + Math.random() * 0.2);
}

// ---------- state ----------
let state = 'title';
let stateT = 0, now = 0;
let night = 1, clockMin = 0, totalMin = 0, blockedCount = 0, streak = 0, bestStreak = 0, glowBoost = 0;
let L = 1, O2 = 1, chokeT = 0, lastDmg = '';
let gusts = [], nextPatternAt = 0;
let parts = [], smoke = [], floaters = [];
const hand = { x: 0, y: 0, tx: 0, ty: 0, pres: 0, down: false, pid: null };
let leanX = 0, leanY = 0, flick = 0;
let hintT = 0, overT = 0, wasBest = false;
let cricketT = 2, lastHour = -1;
const NIGHT_MIN = 540, MIN_PER_SEC = 7.2; // 21:00 -> 6:00 in 75 s

const FX = () => W / 2;
const FY = () => H * 0.57;

function startGame() {
  state = 'play'; stateT = 0;
  night = 1; clockMin = 0; totalMin = 0; blockedCount = 0; streak = 0; bestStreak = 0; glowBoost = 0;
  L = 1; O2 = 1; chokeT = 0;
  gusts = []; parts = []; smoke = []; floaters = [];
  nextPatternAt = now + 2.2;
  hintT = 5;
  lastHour = 21;
  wasBest = false;
  signal('start');
  sfxStart();
}

function diff(p) {
  const n = night;
  return {
    warn: Math.max(0.7, 1.5 - 0.17 * (n - 1) - 0.15 * p),
    gap: Math.max(0.35, 1.8 - 0.35 * (n - 1) - 0.6 * p),
    str: Math.min(1.35, 0.5 + 0.12 * (n - 1) + 0.2 * p),
  };
}
const A_MIN = -Math.PI - 0.28, A_MAX = 0.28; // allowed source angles (left-low .. over top .. right-low)
function randAngle(avoid) {
  for (let k = 0; k < 20; k++) {
    const a = rand(A_MIN, A_MAX);
    if (avoid === undefined || Math.abs(angDiff(a, avoid)) > 1.25) return a;
  }
  return rand(A_MIN, A_MAX);
}
function schedulePattern() {
  const p = clamp(clockMin / NIGHT_MIN, 0, 1);
  const d = diff(p);
  const opts = [['single', 4]];
  if (night >= 2 || p > 0.18) opts.push(['long', 1.3]);
  if (night >= 2 || p > 0.3) opts.push(['double', 1.8]);
  if (night >= 2 || p > 0.62) opts.push(['swirl', night >= 2 ? 1.3 : 2]);
  if (night >= 3) opts.push(['triple', 1.2]);
  if (night >= 4) opts.push(['feint', 1]);
  let tot = opts.reduce((s, o) => s + o[1], 0), r = Math.random() * tot, kind = 'single';
  for (const o of opts) { r -= o[1]; if (r <= 0) { kind = o[0]; break; } }
  const t0 = now;
  const mk = (a, off, dur, str, w = 0, warn = d.warn) => ({ a0: a, a, w, startAt: t0 + off, warn, dur, str: clamp(str, 0.3, 1.4), expInt: 0, blowT: 0, done: false });
  const list = [];
  const s = () => d.str + rand(-0.08, 0.15);
  if (kind === 'single') {
    list.push(mk(randAngle(), 0, rand(0.8, 1.4), s()));
  } else if (kind === 'long') {
    list.push(mk(randAngle(), 0, rand(3.2, 4.4), s() * 0.75));
  } else if (kind === 'double' || kind === 'triple') {
    let a = randAngle();
    const n = kind === 'double' ? 2 : 3;
    let off = 0;
    for (let i = 0; i < n; i++) {
      const dur = rand(0.7, 1.1);
      list.push(mk(a, off, dur, s()));
      off += d.warn * 0.55 + dur * 0.75;
      a = randAngle(a);
    }
  } else if (kind === 'swirl') {
    let a = rand(-Math.PI * 0.85, -Math.PI * 0.15);
    let w = (Math.random() < 0.5 ? -1 : 1) * rand(0.55, 0.85);
    const dur = rand(2.6, 3.4);
    const end = a + w * (dur + d.warn * 0.5);
    if (end < A_MIN || end > A_MAX) w = -w;
    list.push(mk(a, 0, dur, s() * 0.85, w));
  } else if (kind === 'feint') {
    // a warning that turns into a gust from a different side
    const a = randAngle();
    const g = mk(a, 0, rand(0.8, 1.1), s());
    g.feint = randAngle(a);
    list.push(g);
  }
  let last = 0;
  for (const g of list) { gusts.push(g); last = Math.max(last, g.startAt + g.warn + g.dur); }
  nextPatternAt = last + d.gap * rand(0.75, 1.25);
}

// exposure of the flame to wind coming from angle a (0 = fully shielded, 1 = open)
function handGeom() {
  const dx = hand.x - FX(), dy = hand.y - FY();
  const d = Math.max(1, Math.hypot(dx, dy));
  return { d, phi: Math.atan2(dy, dx) };
}
const HALF = () => 36 * S;
function exposure(a) {
  if (hand.pres < 0.02) return 1;
  const { d, phi } = handGeom();
  const half = Math.atan2(HALF(), d);
  const e = smooth(half * 0.8, half * 1.2, Math.abs(angDiff(a, phi)));
  return 1 - hand.pres * (1 - e);
}

// ---------- input ----------
function pointerPos(e) {
  const r = cv.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  const [x, y] = pointerPos(e);
  if (state === 'title') { startGame(); hand.pid = e.pointerId; setHand(x, y, true); return; }
  if (state === 'over') { if (overT > 0.7) startGame(); return; }
  if (state === 'play' || state === 'dawn') {
    hand.pid = e.pointerId; setHand(x, y, true);
    try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  }
}, { passive: false });
cv.addEventListener('pointermove', (e) => {
  if (hand.pid !== e.pointerId || !hand.down) return;
  const [x, y] = pointerPos(e);
  setHand(x, y, false);
});
const up = (e) => { if (hand.pid === e.pointerId) { hand.down = false; hand.pid = null; } };
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
function setHand(x, y, jump) {
  // the finger is the hand's position; it cannot go into the flame
  const dx = x - FX(), dy = y - (FY() - 6 * S);
  const d = Math.hypot(dx, dy);
  const minD = 26 * S;
  if (d < minD) { const k = minD / Math.max(0.001, d); x = FX() + dx * k; y = FY() - 6 * S + dy * k; }
  hand.tx = x; hand.ty = y;
  if (jump || !hand.down) { if (hand.pres < 0.05) { hand.x = x; hand.y = y; } }
  hand.down = true;
}

// ---------- update ----------
function update(dt) {
  now += dt; stateT += dt;
  // hand
  const k = 1 - Math.pow(0.0005, dt);
  hand.x = lerp(hand.x, hand.tx, k); hand.y = lerp(hand.y, hand.ty, k);
  hand.pres = clamp(hand.pres + (hand.down && (state === 'play' || state === 'dawn') ? 9 : -6) * dt, 0, 1);
  if (hintT > 0) hintT -= dt;

  // crickets
  cricketT -= dt;
  if (cricketT < 0) { cricketT = rand(1.5, 4); if (state !== 'title') cricket(); }

  let windAmt = 0.03, windA = -Math.PI / 2, windExp = 1, lx = 0, ly = 0, gustDmg = 0, warnAmt = 0;

  if (state === 'play') {
    clockMin += dt * MIN_PER_SEC; totalMin += dt * MIN_PER_SEC;
    const hr = Math.floor((21 * 60 + clockMin) / 60);
    if (hr !== lastHour) { lastHour = hr; sfxBell(); }
    if (now >= nextPatternAt) schedulePattern();
    if (clockMin >= NIGHT_MIN) {
      state = 'dawn'; stateT = 0; sfxDawn();
      gusts = [];
      bestNights = Math.max(bestNights, night);
      if (totalMin > best) { best = totalMin; }
      persist();
    }
  }
  if (state === 'dawn' && stateT > 4.2) {
    night++; clockMin = 0; state = 'play'; stateT = 0; lastHour = 21;
    nextPatternAt = now + 1.6; L = 1; O2 = 1;
    floaters.push({ x: FX(), y: H * 0.3, t: 0, txt: T.nextNight(night), c: '#ffd9a0', big: true });
  }

  // gusts
  for (const g of gusts) {
    const t = now - g.startAt;
    if (t < 0) continue;
    if (g.w) g.a = g.a0 + g.w * Math.max(0, t - g.warn * 0.5);
    if (g.feint && t > g.warn * 0.6 && !g.switched) { g.switched = true; g.a0 = g.a = g.feint; }
    const ex = exposure(g.a);
    const dirx = -Math.cos(g.a), diry = -Math.sin(g.a);
    if (g.L0 === undefined && t >= g.warn) g.L0 = L;
    if (t < g.warn) {
      const kk = t / g.warn;
      warnAmt = Math.max(warnAmt, kk);
      spawnWind(g, kk * 0.35, 0.45);
      if (kk * 0.18 * g.str > windAmt) { windAmt = kk * 0.18 * g.str; windA = g.a; windExp = ex; }
      lx += dirx * kk * 0.08 * ex; ly += diry * kk * 0.08 * ex;
    } else if (t < g.warn + g.dur) {
      const tb = t - g.warn;
      const env = Math.min(1, tb / 0.15) * Math.min(1, (g.warn + g.dur - t) / 0.3);
      spawnWind(g, env * 1.2, 1);
      if (state === 'play') {
        gustDmg += g.str * env * ex;
        g.expInt += ex * env * dt; g.blowT += env * dt;
      }
      if (env * 0.55 * g.str > windAmt) { windAmt = env * 0.55 * g.str; windA = g.a; windExp = ex; }
      lx += dirx * env * g.str * (0.12 + 0.9 * ex); ly += diry * env * g.str * (0.12 + 0.9 * ex);
    } else if (!g.done) {
      g.done = true;
      if (state === 'play' && g.blowT > 0.2) {
        const avg = g.expInt / g.blowT;
        if (avg < 0.22 && L > g.L0 - 0.1 && O2 > 0.35) {
          blockedCount++; streak++; bestStreak = Math.max(bestStreak, streak);
          sfxGood(streak);
          glowBoost = 1;
          L = Math.min(1, L + 0.06);
          floaters.push({ x: hand.x, y: hand.y - 30 * S, t: 0, txt: streak >= 2 ? T.good + ' ×' + streak : T.good, c: streak >= 5 ? '#ffd27a' : '#ffe6b0' });
        } else if (avg > 0.5) {
          streak = 0;
        }
      }
    }
  }
  gusts = gusts.filter((g) => !g.done);

  // flame physics
  if (state === 'play' || state === 'dawn') {
    const { d } = handGeom();
    const airR = 64 * S, minD = 26 * S;
    let chok = false;
    if (hand.pres > 0.5 && d < airR) {
      const c = clamp((airR - d) / (airR - minD), 0, 1);
      O2 -= (0.14 + 0.5 * c) * (0.8 + 0.08 * night) * dt;
      chok = true;
    } else O2 += 0.7 * dt;
    O2 = clamp(O2, 0, 1);
    let dmg = 0;
    if (state === 'play') {
      const wd = gustDmg * 1.05;
      const od = O2 < 0.4 ? (0.4 - O2) * 2.2 : 0;
      dmg = wd + od;
      if (wd > 0.05 || od > 0.05) lastDmg = wd >= od ? 'wind' : 'choke';
    }
    chokeT = chok && O2 < 0.6 ? chokeT + dt : 0;
    L = clamp(L - dmg * dt + (dmg < 0.02 ? 0.16 * dt : 0), 0, 1);
    if (state === 'dawn') L = clamp(L + 0.5 * dt, 0, 1);
    if (L <= 0.02 && state === 'play') {
      state = 'out'; stateT = 0; sfxOut();
      for (let i = 0; i < 26; i++) smoke.push({ x: FX() + rand(-3, 3) * S, y: FY() - 10 * S, vx: rand(-8, 8) * S + lx * 30 * S, vy: rand(-40, -18) * S, t: 0, life: rand(1.6, 3), r: rand(3, 6) * S });
    }
  }
  if (state === 'out' && stateT > 1.4) {
    state = 'over'; overT = 0;
    wasBest = totalMin > best - 0.001 && totalMin > 0;
    if (totalMin > best) best = totalMin;
    persist();
    signal('end', { score: Math.floor(totalMin) });
  }
  if (state === 'over') overT += dt;

  // lean / flicker
  ly += (O2 < 0.6 ? 0 : 0);
  leanX = lerp(leanX, clamp(lx * 1.7, -1.6, 1.6), 1 - Math.pow(0.001, dt));
  leanY = lerp(leanY, clamp(ly * 1.7, -1.2, 1.2), 1 - Math.pow(0.001, dt));
  flick = Math.sin(now * 23) * 0.04 + Math.sin(now * 37 + 1) * 0.03 + (Math.random() - 0.5) * 0.05 * (0.3 + windAmt * 3);

  // wind audio
  if (AC && windGain) {
    const t = AC.currentTime;
    const vol = state === 'title' ? 0.03 : clamp(windAmt, 0, 0.9) * 0.9 + 0.025;
    windGain.gain.setTargetAtTime(vol, t, 0.06);
    windBP.frequency.setTargetAtTime(300 + windAmt * 1400, t, 0.08);
    windLP.frequency.setTargetAtTime(500 + 4500 * windExp, t, 0.05);
    if (windPan) windPan.pan.setTargetAtTime(clamp(Math.cos(windA), -1, 1) * 0.85, t, 0.08);
    if (state === 'play' && L > 0.5 && Math.random() < dt * 3) tone(rand(1800, 3200), 0.015, 0.006, 'square');
  }

  // particles
  for (const p of parts) {
    p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (!p.def && hand.pres > 0.3) {
      const { d, phi } = handGeom();
      const pdx = p.x - FX(), pdy = p.y - FY();
      const pd = Math.hypot(pdx, pdy);
      const pa = Math.atan2(pdy, pdx);
      const half = Math.atan2(HALF(), d);
      if (pd < d + 4 * S && pd > d - 26 * S && Math.abs(angDiff(pa, phi)) < half) {
        p.def = true;
        const sgn = angDiff(pa, phi) >= 0 ? 1 : -1;
        const sp = Math.hypot(p.vx, p.vy) * 0.6;
        const ta = phi + sgn * Math.PI / 2;
        p.vx = Math.cos(ta) * sp + Math.cos(phi) * sp * 0.4; p.vy = Math.sin(ta) * sp + Math.sin(phi) * sp * 0.4;
        p.life = Math.min(p.life, p.t + 0.35);
      }
    }
  }
  parts = parts.filter((p) => p.t < p.life);
  for (const s of smoke) { s.t += dt; s.x += s.vx * dt + Math.sin(s.t * 3 + s.r) * 10 * S * dt; s.y += s.vy * dt; s.r += 6 * S * dt; }
  smoke = smoke.filter((s) => s.t < s.life);
  if ((state === 'play' || state === 'dawn') && L < 0.35 && Math.random() < dt * 8) smoke.push({ x: FX(), y: FY() - 24 * S * L, vx: rand(-5, 5) * S, vy: rand(-30, -14) * S, t: 0, life: 1.4, r: 2 * S });
  for (const f of floaters) f.t += dt;
  floaters = floaters.filter((f) => f.t < (f.big ? 2.6 : 1.1));
  windNow = { amt: windAmt, a: windA, lx, warn: warnAmt };
}
let windNow = { amt: 0, a: -Math.PI / 2, lx: 0, warn: 0 };

function spawnWind(g, rate, spd) {
  const n = rate * 60 * (1 / 60) * 1.6 * (0.6 + g.str);
  let cnt = Math.floor(n) + (Math.random() < n % 1 ? 1 : 0);
  const R = Math.hypot(W, H) * 0.6;
  for (let i = 0; i < cnt; i++) {
    const off = rand(-130, 130) * S;
    const ca = Math.cos(g.a), sa = Math.sin(g.a);
    const x = FX() + ca * R - sa * off, y = FY() + sa * R + ca * off;
    const sp = (spd > 0.9 ? rand(520, 760) : rand(240, 360)) * S;
    const leaf = Math.random() < (spd > 0.9 ? 0.1 : 0.16);
    parts.push({ x, y, vx: -ca * sp, vy: -sa * sp, t: 0, life: R / sp * 1.25, len: rand(14, 34) * S * (spd > 0.9 ? 1.4 : 0.8), a: spd > 0.9 ? rand(0.18, 0.38) : rand(0.08, 0.18), def: false, leaf, rot: Math.random() * 6, spin: rand(-12, 12), wob: Math.random() * 6 });
  }
}

// ---------- draw ----------
function sky(t) {
  // t: 0 = night, 1 = dawn
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.75);
  const top = mix([8, 10, 26], [74, 98, 160], t), mid = mix([18, 20, 46], [232, 150, 120], t), low = mix([30, 26, 50], [255, 210, 150], t);
  g.addColorStop(0, rgb(top)); g.addColorStop(0.6, rgb(mid)); g.addColorStop(1, rgb(low));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const fx = FX(), fy = FY();
  let dawnT = 0;
  if (state === 'dawn') dawnT = Math.min(1, stateT / 1.2) * (stateT > 3.2 ? Math.max(0, 1 - (stateT - 3.2) / 1) : 1);
  else if (state === 'play') dawnT = smooth(0.93, 1, clockMin / NIGHT_MIN) * 0.6;
  sky(dawnT);
  // stars
  for (const s of stars) {
    const a = (0.4 + 0.6 * Math.abs(Math.sin(now * 0.8 + s.tw))) * (1 - dawnT);
    ctx.fillStyle = `rgba(255,250,235,${a * 0.8})`;
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r * S, 0, 7); ctx.fill();
  }
  // moon arcs over the night (progress)
  const p = state === 'title' ? 0.3 : clamp(clockMin / NIGHT_MIN, 0, 1);
  const mx = lerp(W * 0.08, W * 0.92, p), my = H * 0.3 - Math.sin(p * Math.PI) * H * 0.18;
  ctx.globalAlpha = 1 - dawnT * 0.8;
  const mg = ctx.createRadialGradient(mx, my, 0, mx, my, 60 * S);
  mg.addColorStop(0, 'rgba(255,245,210,0.35)'); mg.addColorStop(1, 'rgba(255,245,210,0)');
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx, my, 60 * S, 0, 7); ctx.fill();
  ctx.fillStyle = '#f6eccb'; ctx.beginPath(); ctx.arc(mx, my, 13 * S, 0, 7); ctx.fill();
  ctx.fillStyle = rgb(mix([18, 20, 46], [232, 150, 120], dawnT)); ctx.beginPath(); ctx.arc(mx + 6 * S, my - 3 * S, 11 * S, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
  // hills
  const hy = H * 0.68;
  ctx.fillStyle = rgb(mix([14, 14, 30], [70, 60, 80], dawnT));
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let i = 0; i < hills.length; i++) ctx.lineTo(i / (hills.length - 1) * W, hy - 30 * S - hills[i] * 26 * S);
  ctx.lineTo(W, H); ctx.fill();
  // ground
  const gy = fy + 58 * S;
  ctx.fillStyle = rgb(mix([10, 10, 18], [50, 44, 50], dawnT));
  ctx.fillRect(0, gy, W, H - gy);
  // back grass
  drawGrass(0, gy, dawnT);

  // warm light
  const lit = state === 'out' || state === 'over' ? Math.max(0, L) : L;
  glowBoost = Math.max(0, glowBoost - 0.016);
  const glowR = (90 + 170 * lit * (0.55 + 0.45 * O2)) * S * (1 + flick * 0.6 + glowBoost * 0.35);
  if (lit > 0.01) {
    ctx.globalCompositeOperation = 'lighter';
    const gg = ctx.createRadialGradient(fx, fy - 14 * S, 0, fx, fy - 14 * S, glowR);
    const ga = 0.36 * lit;
    gg.addColorStop(0, `rgba(255,170,70,${ga})`); gg.addColorStop(0.4, `rgba(220,110,40,${ga * 0.45})`); gg.addColorStop(1, 'rgba(120,50,20,0)');
    ctx.fillStyle = gg; ctx.fillRect(fx - glowR, fy - 14 * S - glowR, glowR * 2, glowR * 2);
    ctx.globalCompositeOperation = 'source-over';
  }

  // stone + candle
  ctx.fillStyle = '#1d1a20';
  ctx.beginPath(); ctx.ellipse(fx, gy + 2 * S, 56 * S, 16 * S, 0, Math.PI, 0); ctx.lineTo(fx + 56 * S, gy + 8 * S); ctx.lineTo(fx - 56 * S, gy + 8 * S); ctx.fill();
  const stoneLit = ctx.createLinearGradient(fx, gy - 14 * S, fx, gy + 8 * S);
  stoneLit.addColorStop(0, `rgba(255,150,70,${0.35 * lit})`); stoneLit.addColorStop(1, 'rgba(255,150,70,0)');
  ctx.fillStyle = stoneLit;
  ctx.beginPath(); ctx.ellipse(fx, gy + 2 * S, 56 * S, 16 * S, 0, Math.PI, 0); ctx.fill();
  // dish
  ctx.fillStyle = '#5a3a28';
  ctx.beginPath(); ctx.ellipse(fx, gy - 12 * S, 26 * S, 6 * S, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#7a5236'; ctx.beginPath(); ctx.ellipse(fx, gy - 13 * S, 22 * S, 4 * S, 0, 0, 7); ctx.fill();
  // candle body
  const cTop = fy + 6 * S, cw = 11 * S;
  const cg = ctx.createLinearGradient(fx - cw, 0, fx + cw, 0);
  cg.addColorStop(0, '#d9cbb0'); cg.addColorStop(0.5, '#fff4dc'); cg.addColorStop(1, '#bba98a');
  ctx.fillStyle = cg; ctx.fillRect(fx - cw, cTop, cw * 2, gy - 13 * S - cTop);
  ctx.fillStyle = `rgba(255,200,120,${0.5 * lit})`; ctx.fillRect(fx - cw, cTop, cw * 2, 6 * S);
  ctx.fillStyle = '#efe2c4'; ctx.beginPath(); ctx.ellipse(fx, cTop, cw, 3 * S, 0, 0, 7); ctx.fill();
  // wick
  ctx.strokeStyle = '#2a1a10'; ctx.lineWidth = 2 * S;
  ctx.beginPath(); ctx.moveTo(fx, cTop); ctx.lineTo(fx + leanX * 2 * S, cTop - 8 * S); ctx.stroke();
  if (L < 0.05 && (state === 'out' || state === 'over')) {
    ctx.fillStyle = `rgba(255,90,30,${Math.max(0, 0.8 - stateT * 0.3) * (0.6 + 0.4 * Math.sin(now * 20))})`;
    ctx.beginPath(); ctx.arc(fx, cTop - 8 * S, 2 * S, 0, 7); ctx.fill();
  }

  // front grass
  drawGrass(1, gy, dawnT);

  // air ring: inside it the hand smothers the flame
  if (state === 'play' || state === 'dawn') {
    const inside = hand.pres > 0.5 && handGeom().d < 64 * S;
    ctx.setLineDash([4 * S, 6 * S]);
    ctx.strokeStyle = inside ? `rgba(130,180,255,${0.45 + 0.25 * Math.sin(now * 12)})` : 'rgba(255,220,170,0.13)';
    ctx.lineWidth = 1.5 * S;
    ctx.beginPath(); ctx.arc(fx, fy - 6 * S, 64 * S, 0, 7); ctx.stroke();
    ctx.setLineDash([]);
  }
  // warning arcs
  if (state === 'play') {
    for (const g of gusts) {
      const t = now - g.startAt;
      if (t < 0 || t > g.warn + g.dur) continue;
      const blowing = t >= g.warn;
      const kk = blowing ? 1 : t / g.warn;
      const R = 112 * S;
      const pul = 0.6 + 0.4 * Math.sin(now * (blowing ? 18 : 10));
      ctx.strokeStyle = blowing ? `rgba(210,235,255,${0.7 * pul})` : `rgba(190,220,255,${0.3 + 0.6 * kk * pul})`;
      ctx.lineWidth = (blowing ? 7 : 3 + 3 * kk) * S;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(fx, fy - 6 * S, R, g.a - 0.32, g.a + 0.32); ctx.stroke();
      // chevrons pointing in
      for (let i = 0; i < 2; i++) {
        const rr = R + (18 + i * 14 - ((now * (blowing ? 90 : 40)) % 14)) * S;
        const ax = fx + Math.cos(g.a) * rr, ay = fy - 6 * S + Math.sin(g.a) * rr;
        const px = -Math.sin(g.a), py = Math.cos(g.a);
        const ix = -Math.cos(g.a), iy = -Math.sin(g.a);
        ctx.lineWidth = 2.5 * S;
        ctx.beginPath();
        ctx.moveTo(ax + px * 8 * S - ix * 5 * S, ay + py * 8 * S - iy * 5 * S);
        ctx.lineTo(ax + ix * 3 * S, ay + iy * 3 * S);
        ctx.lineTo(ax - px * 8 * S - ix * 5 * S, ay - py * 8 * S - iy * 5 * S);
        ctx.stroke();
      }
    }
  }

  // wind streaks
  ctx.lineCap = 'round';
  for (const pt of parts) {
    const sp = Math.hypot(pt.vx, pt.vy) || 1;
    const fade = Math.min(1, pt.t * 5) * Math.min(1, (pt.life - pt.t) * 4);
    if (pt.leaf) {
      pt.rot += pt.spin / 60;
      const ox = Math.sin(pt.t * 9 + pt.wob) * 6 * S;
      ctx.save(); ctx.translate(pt.x + ox * -pt.vy / sp, pt.y + ox * pt.vx / sp); ctx.rotate(pt.rot);
      ctx.globalAlpha = fade * 0.9;
      ctx.fillStyle = pt.def ? '#c98a44' : '#6b6a3a';
      ctx.beginPath(); ctx.ellipse(0, 0, 5.5 * S, 2.6 * S, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(30,30,10,0.6)'; ctx.lineWidth = 0.8 * S; ctx.beginPath(); ctx.moveTo(-5 * S, 0); ctx.lineTo(5 * S, 0); ctx.stroke();
      ctx.restore(); ctx.globalAlpha = 1;
      continue;
    }
    ctx.strokeStyle = pt.def ? `rgba(255,220,170,${pt.a * fade * 1.4})` : `rgba(215,230,255,${pt.a * fade})`;
    ctx.lineWidth = 1.3 * S;
    ctx.beginPath(); ctx.moveTo(pt.x, pt.y); ctx.lineTo(pt.x - pt.vx / sp * pt.len, pt.y - pt.vy / sp * pt.len); ctx.stroke();
  }

  // flame
  if (L > 0.02 && state !== 'over') drawFlame(fx, cTop - 7 * S);

  // smoke
  for (const s of smoke) {
    const a = 0.35 * (1 - s.t / s.life);
    ctx.fillStyle = `rgba(170,170,180,${a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
  }

  // hand
  if (hand.pres > 0.01) drawHand();

  // choke warning
  if ((state === 'play') && O2 < 0.7 && hand.pres > 0.5) {
    const a = clamp((0.7 - O2) / 0.4, 0, 1);
    ctx.fillStyle = `rgba(150,200,255,${a * (0.7 + 0.3 * Math.sin(now * 14))})`;
    const fs = fitText(T.choke, W * 0.6, 17 * S);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(T.choke, fx, fy + 92 * S);
  }

  // floaters
  for (const f of floaters) {
    const life = f.big ? 2.6 : 1.1;
    const a = Math.min(1, f.t * 6) * Math.min(1, (life - f.t) * 3);
    ctx.fillStyle = f.c; ctx.globalAlpha = a;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    fitText(f.txt, W * 0.86, (f.big ? 22 : 16) * S);
    ctx.fillText(f.txt, f.x, f.y - f.t * (f.big ? 6 : 26) * S);
    ctx.globalAlpha = 1;
  }

  drawHUD(dawnT);
}

function drawGrass(layer, gy, dawnT) {
  const wx = windNow.lx;
  ctx.strokeStyle = layer ? rgb(mix([6, 6, 12], [36, 34, 40], dawnT)) : rgb(mix([16, 18, 26], [60, 56, 62], dawnT));
  ctx.lineWidth = (layer ? 2.4 : 1.8) * S;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (const g of grass) {
    if (g.layer !== layer) continue;
    const base = layer ? gy + 30 * S + (g.h % 12) : gy + 4 * S;
    const h = g.h * (layer ? 1.1 : 0.8);
    const bend = (Math.sin(now * 1.3 + g.ph) * 0.12 + wx * 0.9) * h;
    ctx.moveTo(g.x, base);
    ctx.quadraticCurveTo(g.x + bend * 0.3, base - h * 0.6, g.x + bend, base - h + Math.abs(bend) * 0.3);
  }
  ctx.stroke();
}

function drawFlame(x, y) {
  const life = L;
  const air = O2;
  const h = (16 + 40 * life) * S * (0.45 + 0.55 * air) * (1 + flick);
  const w = (6 + 6 * life) * S * (0.7 + 0.3 * air);
  const tipX = x + leanX * h * 0.9 + Math.sin(now * 9) * 1.5 * S;
  const tipY = y - h * (1 - 0.35 * Math.min(1, Math.abs(leanX))) + Math.max(0, leanY) * h * 0.6;
  const blue = clamp((0.65 - air) / 0.5, 0, 1);
  // outer glow
  ctx.globalCompositeOperation = 'lighter';
  const og = ctx.createRadialGradient(x, y - h * 0.4, 0, x, y - h * 0.4, h * 1.3);
  og.addColorStop(0, `rgba(255,190,90,${0.5 * life})`); og.addColorStop(1, 'rgba(255,120,40,0)');
  ctx.fillStyle = og; ctx.beginPath(); ctx.arc(x, y - h * 0.4, h * 1.3, 0, 7); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  const layers = [
    [1, mix([255, 120, 30], [90, 120, 255], blue), 0.9],
    [0.72, mix([255, 190, 70], [140, 170, 255], blue), 0.95],
    [0.45, mix([255, 248, 220], [220, 235, 255], blue), 1],
  ];
  for (const [k, c, a] of layers) {
    const ww = w * k, tx = lerp(x, tipX, 0.3 + 0.7 * k), ty = lerp(y, tipY, 0.25 + 0.75 * k);
    const by = y + 2 * S;
    ctx.fillStyle = rgb(c, a);
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.bezierCurveTo(lerp(x, tx, 0.5) + ww * 1.2, lerp(by, ty, 0.55), x + ww * 1.05, by - ww * 0.2, x, by);
    ctx.bezierCurveTo(x - ww * 1.05, by - ww * 0.2, lerp(x, tx, 0.5) - ww * 1.2, lerp(by, ty, 0.55), tx, ty);
    ctx.fill();
  }
  // blue base
  ctx.fillStyle = `rgba(80,120,255,${0.55})`;
  ctx.beginPath(); ctx.ellipse(x, y + 1 * S, w * 0.55, w * 0.35, 0, 0, 7); ctx.fill();
}

function drawHand() {
  const fx = FX(), fy = FY() - 6 * S;
  const { d, phi } = handGeom();
  const x = hand.x, y = hand.y;
  const a = hand.pres;
  const half = HALF();
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(phi + Math.PI / 2); // local +y points away from the flame
  ctx.globalAlpha = a;
  // shield coverage hint (a faint warm wedge toward the flame)
  // palm: a cupped crescent facing the flame (concave side toward -y)
  const lit = L;
  const g = ctx.createLinearGradient(0, -12 * S, 0, 16 * S);
  g.addColorStop(0, `rgb(${(120 + 120 * lit) | 0},${(70 + 70 * lit) | 0},${(45 + 30 * lit) | 0})`);
  g.addColorStop(1, '#2a1a18');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-half, -6 * S);
  ctx.quadraticCurveTo(0, 8 * S, half, -6 * S);
  ctx.quadraticCurveTo(half + 4 * S, 6 * S, half * 0.6, 18 * S);
  ctx.quadraticCurveTo(0, 26 * S, -half * 0.6, 18 * S);
  ctx.quadraticCurveTo(-half - 4 * S, 6 * S, -half, -6 * S);
  ctx.fill();
  // fingers along the rim (toward the flame side)
  ctx.fillStyle = g;
  for (let i = 0; i < 4; i++) {
    const t = -0.75 + i * 0.5;
    const fxp = t * half;
    const fyp = -6 * S + (1 - t * t) * 7 * S;
    ctx.beginPath(); ctx.ellipse(fxp, fyp - 4 * S, 6.5 * S, 9 * S, t * 0.35, 0, 7); ctx.fill();
  }
  // thumb
  ctx.beginPath(); ctx.ellipse(-half - 2 * S, 6 * S, 6 * S, 11 * S, 0.6, 0, 7); ctx.fill();
  // rim light from the flame
  ctx.strokeStyle = `rgba(255,190,110,${0.7 * lit})`;
  ctx.lineWidth = 2 * S;
  ctx.beginPath(); ctx.moveTo(-half, -8 * S); ctx.quadraticCurveTo(0, 6 * S, half, -8 * S); ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawHUD(dawnT) {
  if (state === 'title') return drawTitle();
  ctx.textBaseline = 'top';
  // clock (left)
  const mins = 21 * 60 + Math.min(clockMin, NIGHT_MIN);
  const hh = Math.floor(mins / 60) % 24, mm = Math.floor(mins % 60 / 10) * 10;
  const clock = hh + ':' + String(mm).padStart(2, '0');
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffe9c4';
  ctx.font = '700 ' + Math.round(26 * S) + 'px ' + FONT;
  ctx.fillText(clock, 16 * S, 14 * S);
  ctx.font = '600 ' + Math.max(14, Math.round(14 * S)) + 'px ' + FONT;
  ctx.fillStyle = 'rgba(255,233,196,0.8)';
  ctx.fillText(T.night(night) + '  ' + T.dur(totalMin), 16 * S, 46 * S);
  // best (right)
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,233,196,0.75)';
  ctx.font = '600 ' + Math.max(14, Math.round(14 * S)) + 'px ' + FONT;
  ctx.fillText(T.best + ' ' + T.dur(best), W - 16 * S, 18 * S);
  // flame meter (right, under best): little dots of life
  const mw = 84 * S, mx = W - 16 * S - mw, my = 44 * S;
  ctx.font = '600 12px ' + FONT; ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
  ctx.fillStyle = '#ffb455'; ctx.fillText(T.fire, mx - 6, my + 3 * S);
  ctx.fillStyle = '#9cc8ff'; ctx.fillText(T.air, mx - 6, my + 13 * S + 4);
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(mx, my, mw, 6 * S);
  ctx.fillStyle = L > 0.35 ? '#ffb455' : '#ff6a3a'; ctx.fillRect(mx, my, mw * L, 6 * S);
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(mx, my + 10 * S + 4, mw, 5 * S);
  ctx.fillStyle = O2 > 0.45 ? '#9cc8ff' : '#5a7dff'; ctx.fillRect(mx, my + 10 * S + 4, mw * O2, 5 * S);

  if (hintT > 0 && state === 'play') {
    ctx.globalAlpha = Math.min(1, hintT);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffe9c4';
    fitText(T.hint, W - 28 * S, 15 * S, '600');
    ctx.fillText(T.hint, W / 2, H - 34 * S);
    ctx.globalAlpha = 1;
  }
  if (state === 'dawn') {
    const a = Math.min(1, stateT * 2) * Math.min(1, (4.2 - stateT) * 2);
    ctx.globalAlpha = Math.max(0, a);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff3d6';
    fitText(T.dawn, W * 0.8, 44 * S, '800');
    ctx.fillText(T.dawn, W / 2, H * 0.24);
    fitText(T.dawnSub(night), W * 0.85, 18 * S, '600');
    ctx.fillText(T.dawnSub(night), W / 2, H * 0.24 + 40 * S);
    ctx.globalAlpha = 1;
  }
  if (state === 'over') drawOver();
}

function drawTitle() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffe2b0';
  fitText(T.title, W * 0.86, 44 * S, '800');
  ctx.fillText(T.title, W / 2, H * 0.16);
  ctx.fillStyle = 'rgba(255,238,210,0.92)';
  const lines = [T.how1, T.how2, T.how3];
  lines.forEach((l, i) => { fitText(l, W - 32 * S, 15 * S, '600'); ctx.fillText(l, W / 2, H * 0.25 + i * 24 * S); });
  ctx.fillStyle = `rgba(255,226,176,${0.6 + 0.4 * Math.sin(now * 3)})`;
  fitText(T.start, W * 0.8, 20 * S, '700');
  ctx.fillText(T.start, W / 2, H * 0.84);
  if (best > 0) {
    ctx.fillStyle = 'rgba(255,238,210,0.7)';
    fitText(T.best + ' ' + T.dur(best), W * 0.8, 14 * S, '600');
    ctx.fillText(T.best + ' ' + T.dur(best), W / 2, H * 0.84 + 30 * S);
  }
}

function drawOver() {
  const a = Math.min(1, overT * 3);
  ctx.fillStyle = `rgba(4,4,10,${0.55 * a})`; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = a;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffe2b0';
  fitText(T.out, W * 0.86, 28 * S, '800'); ctx.fillText(T.out, W / 2, H * 0.22);
  ctx.fillStyle = 'rgba(255,238,210,0.75)';
  const why = lastDmg === 'choke' ? T.chokeOut : T.windOut;
  fitText(why, W * 0.86, 14 * S, '600'); ctx.fillText(why, W / 2, H * 0.22 + 30 * S);
  ctx.fillStyle = 'rgba(255,238,210,0.85)';
  fitText(T.lit, W * 0.8, 15 * S, '600'); ctx.fillText(T.lit, W / 2, H * 0.36);
  ctx.fillStyle = '#fff3d6';
  fitText(T.dur(totalMin), W * 0.86, 46 * S, '800'); ctx.fillText(T.dur(totalMin), W / 2, H * 0.36 + 38 * S);
  ctx.fillStyle = 'rgba(255,238,210,0.85)';
  const sub = T.night(night) + '   ' + T.blocked(blockedCount) + (bestStreak >= 2 ? '  (' + T.streak(bestStreak) + ')' : '');
  fitText(sub, W * 0.86, 15 * S, '600'); ctx.fillText(sub, W / 2, H * 0.36 + 82 * S);
  ctx.fillStyle = wasBest ? '#ffd27a' : 'rgba(255,238,210,0.7)';
  const bl = wasBest ? T.newBest : T.best + ' ' + T.dur(best);
  fitText(bl, W * 0.8, 17 * S, '700'); ctx.fillText(bl, W / 2, H * 0.36 + 110 * S);
  if (overT > 0.7) {
    ctx.fillStyle = `rgba(255,226,176,${0.6 + 0.4 * Math.sin(now * 3)})`;
    fitText(T.again, W * 0.8, 20 * S, '700'); ctx.fillText(T.again, W / 2, H * 0.86);
  }
  ctx.globalAlpha = 1;
}

// ---------- loop ----------
let lastTs = 0;
function frame(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - (lastTs || ts)) / 1000));
  lastTs = ts;
  if (W !== Math.max(1, window.innerWidth || 360) || H !== Math.max(1, window.innerHeight || 640)) resize();
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
</body>
