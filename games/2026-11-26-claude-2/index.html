<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ねこのなわばり</title>
<style>

html, body { overscroll-behavior: none; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #22382a; }
canvas { display: block; width: 100vw; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const JA = LANG === 'ja';
const T = JA ? {
  title: 'ねこのなわばり',
  how1: 'さかなは いちばん近いねこのもの。',
  how2: '指をすべらせて、たくさんとれる場所を',
  how3: 'さがして ねこをおこう。',
  tap: 'タップでスタート', cont: (n) => `ステージ ${n} から`,
  you: 'あなた', foe: 'あいて', stage: (n) => `ステージ ${n}`,
  yourTurn: 'あなたの番', foeTurn: 'あいての番…', counting: 'いただきます！', lastOne: 'さいごの1ぴき！',
  hint: '指をすべらせて場所をさがし、はなすと おく',
  banner: (n) => `ねこ ${n}ひきずつ`, first0: 'あなたが先', first1: 'あいてが先',
  stray: 'のらねこ', strayNote: 'のらねこの さかなは だれのものでもない',
  bigNote: '金のさかなは 3びきぶん', cucNote: 'きゅうりは −2！ あいてに おしつけよう',
  win: 'かち！', lose: 'まけ…', draw: 'ひきわけ', fishLine: (a, b) => `さかな  ${a} − ${b}`,
  best: (m) => `このステージのベスト差 +${m}`, newBest: 'ベスト更新！',
  next: 'タップで次へ', again: 'タップでもう一度', allClear: '6つの町をせいは！ この先は強いあいて',
  tooClose: 'ちかすぎ！', steal: 'よこどり',
} : {
  title: 'Cat Turf',
  how1: 'Each fish belongs to the nearest cat.',
  how2: 'Slide your finger to find the spot',
  how3: 'that wins the most fish.',
  tap: 'Tap to start', cont: (n) => `From stage ${n}`,
  you: 'You', foe: 'Rival', stage: (n) => `Stage ${n}`,
  yourTurn: 'Your turn', foeTurn: 'Rival\'s turn…', counting: 'Dinner time!', lastOne: 'Last cat!',
  hint: 'Slide to search, release to place',
  banner: (n) => `${n} cats each`, first0: 'You go first', first1: 'Rival goes first',
  stray: 'Stray', strayNote: 'Fish near a stray cat belong to no one',
  bigNote: 'A golden fish counts as 3', cucNote: 'A cucumber is −2! Leave it to your rival',
  win: 'You win!', lose: 'You lose…', draw: 'Draw', fishLine: (a, b) => `Fish  ${a} − ${b}`,
  best: (m) => `Best margin here +${m}`, newBest: 'New best!',
  next: 'Tap to continue', again: 'Tap to play again', allClear: 'All 6 towns cleared! Tougher rivals ahead',
  tooClose: 'Too close!', steal: 'Stolen',
};
const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';
const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };
for (const t of ['contextmenu', 'selectstart', 'gesturestart']) addEventListener(t, (e) => e.preventDefault(), { passive: false });

const cv = document.getElementById('c');
const g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const FW = 300, HUD = 62, BOT = 54, CR = 12, MINSEP = 28, MARGIN = 12;
let FH = 430, S = 1, fx = 0, fy = 0;
function layout() {
  const aw = Math.max(50, W - 12), ah = Math.max(50, H - HUD - BOT - 8);
  S = Math.min(aw / FW, ah / FH);
  fx = (W - FW * S) / 2; fy = HUD + 4 + (ah - FH * S) / 2;
}
function pickFH() {
  const aw = Math.max(50, W - 12), ah = Math.max(50, H - HUD - BOT - 8);
  FH = Math.max(340, Math.min(540, Math.round(FW * ah / aw)));
  layout();
}
function resize() {
  W = innerWidth || 0; H = innerHeight || 0;
  DPR = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(W * DPR)); cv.height = Math.max(1, Math.round(H * DPR));
  if (phase === 'title') { pickFH(); makeDemo(); } else layout();
}

// ---------- 音 ----------
let AC = null, master = null;
function audioInit() {
  try {
    if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination); }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function tone(f, d, type = 'sine', vol = 0.2, when = 0, slide = 0) {
  if (!AC) return;
  try {
    const t = AC.currentTime + when, o = AC.createOscillator(), q = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
    q.gain.setValueAtTime(0.0001, t); q.gain.exponentialRampToValueAtTime(vol, t + 0.012); q.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(q); q.connect(master); o.start(t); o.stop(t + d + 0.03);
  } catch (e) {}
}
function meow(base, vol = 0.2) {
  if (!AC) return;
  try {
    const t = AC.currentTime, o = AC.createOscillator(), q = AC.createGain(), bp = AC.createBiquadFilter();
    o.type = 'sawtooth'; bp.type = 'bandpass'; bp.Q.value = 2.2;
    bp.frequency.setValueAtTime(900, t); bp.frequency.linearRampToValueAtTime(2000, t + 0.12); bp.frequency.linearRampToValueAtTime(1000, t + 0.36);
    o.frequency.setValueAtTime(base, t); o.frequency.linearRampToValueAtTime(base * 1.5, t + 0.1); o.frequency.linearRampToValueAtTime(base * 0.82, t + 0.36);
    q.gain.setValueAtTime(0.0001, t); q.gain.exponentialRampToValueAtTime(vol, t + 0.04); q.gain.setValueAtTime(vol, t + 0.16); q.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    o.connect(bp); bp.connect(q); q.connect(master); o.start(t); o.stop(t + 0.45);
  } catch (e) {}
}
const PENT = [0, 2, 4, 7, 9];
const note = (n) => 392 * Math.pow(2, (PENT[((n % 5) + 5) % 5] + 12 * Math.floor(n / 5)) / 12);

// ---------- 状態 ----------
let phase = 'title';
let stage = 0, saveData = { stage: 0, best: {} };
let cats = [], fish = [], left = [0, 0], turn = 0, base = [0, 0, 0], cnt = [0, 0, 0];
let ghost = null, lastGain = -99, lastSteal = -99, pid = null, ignoreUp = false;
let time = 0, bannerT = 9, hintT = 0, cpuT = 0, cpuTarget = null, countT = 0, countEnd = 0, resT = 0, result = null;
let shake = 0, parts = [], rings = [], floats = [], barV = 0.5, stageTime = 0, placedOnce = false;
const COL = [
  { m: '#ff9a3c', d: '#b85a12', cell: '#ffdcb4', rgb: [255, 138, 42] },
  { m: '#5a9cf0', d: '#2456a6', cell: '#c2dcff', rgb: [52, 128, 226] },
  { m: '#a9a9a9', d: '#666666', cell: '#dedede', rgb: [140, 140, 140] },
];
const rnd = (a, b) => a + Math.random() * (b - a);

function stageDef(i) {
  const b = [
    { n: 2, fish: 15, big: 0, cuc: 0, stray: 0, first: 1, K: 4 },
    { n: 3, fish: 19, big: 3, cuc: 0, stray: 0, first: 1, K: 10 },
    { n: 3, fish: 19, big: 2, cuc: 3, stray: 0, first: 1, K: 20 },
    { n: 3, fish: 21, big: 2, cuc: 2, stray: 1, first: 0, K: 8 },
    { n: 4, fish: 23, big: 3, cuc: 3, stray: 1, first: 0, K: 16 },
    { n: 5, fish: 25, big: 4, cuc: 4, stray: 2, first: 0, K: 26 },
  ];
  if (i < 6) return b[i];
  return { n: 5, fish: 25 + (i % 3) * 2, big: 4, cuc: 4, stray: 1 + (i % 2), first: i % 2, K: 28 + (i - 5) * 8 };
}
function genStage(d) {
  cats = []; fish = [];
  const cl = [], nc = 3 + ((Math.random() * 2) | 0);
  for (let k = 0; k < nc; k++) cl.push({ x: rnd(45, FW - 45), y: rnd(45, FH - 45) });
  let guard = 0;
  while (fish.length < d.fish && guard++ < 5000) {
    let x, y;
    if (Math.random() < 0.72) {
      const c = cl[(Math.random() * nc) | 0], a = Math.random() * 6.283, r = Math.sqrt(Math.random()) * 62;
      x = c.x + Math.cos(a) * r; y = c.y + Math.sin(a) * r;
    } else { x = rnd(MARGIN, FW - MARGIN); y = rnd(MARGIN, FH - MARGIN); }
    if (x < MARGIN || x > FW - MARGIN || y < MARGIN || y > FH - MARGIN) continue;
    if (fish.some((f) => (f.x - x) ** 2 + (f.y - y) ** 2 < 17 * 17)) continue;
    fish.push({ x, y, val: 1, owner: -1, pv: -1, pop: 0, ph: Math.random() * 6.28, c: [250, 250, 250], eaten: false, t0: 0, site: -1, flip: Math.random() < 0.5 ? 1 : -1 });
  }
  for (let k = 0; k < d.big; k++) {
    const c = fish.filter((f) => f.val === 1);
    if (c.length) c[(Math.random() * c.length) | 0].val = 3;
  }
  for (let k = 0; k < (d.cuc || 0); k++) {
    for (let tr = 0; tr < 200; tr++) {
      const c = cl[(Math.random() * nc) | 0], a = Math.random() * 6.283, r = rnd(10, 60);
      const x = c.x + Math.cos(a) * r, y = c.y + Math.sin(a) * r;
      if (x < MARGIN || x > FW - MARGIN || y < MARGIN || y > FH - MARGIN) continue;
      if (fish.some((f) => (f.x - x) ** 2 + (f.y - y) ** 2 < 17 * 17)) continue;
      fish.push({ x, y, val: -2, owner: -1, pv: -1, pop: 0, ph: Math.random() * 6.28, c: [250, 250, 250], eaten: false, t0: 0, site: -1, flip: 1 });
      break;
    }
  }
  for (let s = 0; s < d.stray; s++) {
    for (let tr = 0; tr < 60; tr++) {
      const c = cl[(s + tr) % nc], x = Math.max(MARGIN, Math.min(FW - MARGIN, c.x + rnd(-16, 16))), y = Math.max(MARGIN, Math.min(FH - MARGIN, c.y + rnd(-16, 16)));
      if (cats.every((k) => (k.x - x) ** 2 + (k.y - y) ** 2 > 70 * 70)) { cats.push({ x, y, owner: 2, born: -9, fat: 0 }); break; }
    }
  }
}
function nearest(x, y, sites) {
  let b = -1, bd = 1e18;
  for (let i = 0; i < sites.length; i++) { const s = sites[i], d = (s.x - x) * (s.x - x) + (s.y - y) * (s.y - y); if (d < bd) { bd = d; b = i; } }
  return b;
}
function tally(sites, mark) {
  const t = [0, 0, 0];
  for (const f of fish) {
    if (f.eaten) continue;
    const i = nearest(f.x, f.y, sites), o = i < 0 ? -1 : sites[i].owner;
    if (o >= 0) t[o] += f.val;
    if (mark) { if (f.pv !== o) { f.pv = o; f.pop = 1; } f.site = i; }
  }
  return t;
}
function validPos(x, y) {
  if (x < MARGIN - 0.01 || x > FW - MARGIN + 0.01 || y < MARGIN - 0.01 || y > FH - MARGIN + 0.01) return false;
  return cats.every((k) => (k.x - x) ** 2 + (k.y - y) ** 2 >= MINSEP * MINSEP);
}
function evalPos(x, y, o) {
  const t = tally(cats.concat({ x, y, owner: o }), false);
  let ds = 0; for (const f of fish) ds += Math.hypot(f.x - x, f.y - y);
  return t[o] - t[1 - o] - (ds / Math.max(1, fish.length)) * 0.004 + Math.random() * 0.3;
}
function cpuPick() {
  const d = stageDef(stage); let best = null, bs = -1e9;
  const tryP = (x, y) => { x = Math.max(MARGIN, Math.min(FW - MARGIN, x)); y = Math.max(MARGIN, Math.min(FH - MARGIN, y)); if (!validPos(x, y)) return; const s = evalPos(x, y, 1); if (s > bs) { bs = s; best = { x, y }; } };
  for (let k = 0; k < d.K; k++) tryP(rnd(MARGIN, FW - MARGIN), rnd(MARGIN, FH - MARGIN));
  if (d.K >= 60) for (const f of fish) for (let k = 0; k < 2; k++) tryP(f.x + rnd(-16, 16), f.y + rnd(-16, 16));
  for (let k = 0; !best && k < 400; k++) tryP(rnd(MARGIN, FW - MARGIN), rnd(MARGIN, FH - MARGIN));
  return best || { x: FW / 2, y: FH / 2 };
}
function cellPoly(sites, i) {
  let poly = [[0, 0], [FW, 0], [FW, FH], [0, FH]];
  const a = sites[i];
  for (let j = 0; j < sites.length && poly.length; j++) {
    if (j === i) continue;
    const b = sites[j], nx = b.x - a.x, ny = b.y - a.y, c = (b.x * b.x + b.y * b.y - a.x * a.x - a.y * a.y) / 2, out = [];
    for (let k = 0; k < poly.length; k++) {
      const p = poly[k], q = poly[(k + 1) % poly.length], dp = p[0] * nx + p[1] * ny - c, dq = q[0] * nx + q[1] * ny - c;
      if (dp <= 0) out.push(p);
      if ((dp < 0 && dq > 0) || (dp > 0 && dq < 0)) { const t = dp / (dp - dq); out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]); }
    }
    poly = out;
  }
  return poly;
}

function makeDemo() {
  if (!W || !H) return;
  genStage({ fish: 20, big: 2, cuc: 2, stray: 0 });
  for (let k = 0; k < 4; k++) {
    for (let tr = 0; tr < 50; tr++) { const x = rnd(30, FW - 30), y = rnd(30, FH - 30); if (validPos(x, y) && cats.every((c) => Math.hypot(c.x - x, c.y - y) > 80)) { cats.push({ x, y, owner: k % 2, born: -9, fat: 0 }); break; } }
  }
  tally(cats, true);
}
function startStage() {
  pickFH();
  const d = stageDef(stage);
  genStage(d);
  left = [d.n, d.n]; turn = d.first; ghost = null; pid = null; lastGain = -99; lastSteal = -99;
  base = tally(cats, true); for (const f of fish) f.owner = f.pv;
  cnt = [0, 0, 0]; parts = []; rings = []; floats = []; result = null;
  bannerT = 0; stageTime = 0; hintT = placedOnce ? 9 : 0; barV = 0.5;
  phase = turn === 0 ? 'you' : 'cpu';
  if (phase === 'cpu') { cpuT = -0.9; cpuTarget = cpuPick(); }
  signal('start');
  tone(523, 0.12, 'triangle', 0.15); tone(784, 0.18, 'triangle', 0.15, 0.1);
}
function placeCat(x, y, o) {
  cats.push({ x, y, owner: o, born: time, fat: 0 });
  left[o]--;
  const before = base;
  base = tally(cats, true);
  let got = 0;
  for (const f of fish) {
    if (f.owner !== f.pv) {
      if (f.pv === o) { got += f.val; if (f.val > 0) for (let k = 0; k < 5; k++) { const a = Math.random() * 6.28, v = rnd(20, 60); parts.push({ x: f.x, y: f.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5, col: COL[o].m }); } }
      f.owner = f.pv; f.pop = 1;
    }
  }
  rings.push({ x, y, t: 0, col: COL[o].m });
  shake = 5;
  const stolen = before[1 - o] - base[1 - o];
  const fy0 = y < 60 ? y + 30 : y - 26, dir = y < 60 ? 1 : -1;
  if (got !== 0) floats.push({ x, y: fy0, txt: (got > 0 ? '+' : '−') + Math.abs(got), life: 1.3, col: o === 0 ? '#fff2a8' : '#d6e8ff', dir });
  if (stolen > 0 && o === 0) floats.push({ x, y: fy0 + dir * 22, txt: T.steal + ' ' + stolen, life: 1.5, col: '#ffffff', small: true, dir });
  meow(o === 0 ? 560 : 400, 0.2);
  if (o === 0) { placedOnce = true; hintT = 9; for (let k = 0; k < Math.min(6, got); k++) tone(note(k + 2), 0.14, 'triangle', 0.12, 0.08 + k * 0.05); }
  nextTurn();
}
function nextTurn() {
  const o = 1 - turn;
  if (left[o] > 0) turn = o;
  else if (left[turn] <= 0) { startCount(); return; }
  phase = turn === 0 ? 'you' : 'cpu';
  if (phase === 'cpu') { cpuT = 0; cpuTarget = cpuPick(); }
}
function startCount() {
  phase = 'count'; countT = -0.7; ghost = null;
  tally(cats, true);
  const order = fish.slice().sort((a, b) => a.y - b.y);
  order.forEach((f, i) => { f.t0 = i * 0.075; });
  countEnd = order.length * 0.075 + 0.45;
  cnt = [0, 0, 0];
}
function finish() {
  const a = cnt[0], b = cnt[1], m = a - b;
  const win = m > 0, drawn = m === 0;
  let tot = 0; for (const f of fish) if (f.val > 0) tot += f.val;
  result = { a, b, m, win, drawn, newBest: false, all: false, stars: !win ? 0 : m >= tot * 0.3 ? 3 : m >= tot * 0.15 ? 2 : 1 };
  if (win) {
    const pb = saveData.best[stage] || 0;
    if (m > pb) { saveData.best[stage] = m; result.newBest = pb > 0; }
    result.best = saveData.best[stage];
    if (stage === 5) result.all = true;
    saveData.stage = stage + 1;
    try { parent.postMessage({ agf: 'save', data: saveData }, '*'); } catch (e) {}
    [0, 2, 4, 7].forEach((n, i) => tone(note(n + 3), 0.22, 'triangle', 0.16, i * 0.11));
    meow(620, 0.16);
    for (let i = 0; i < result.stars; i++) tone(1047 * Math.pow(2, i * 2 / 12), 0.16, 'sine', 0.12, 0.3 + i * 0.18);
  } else { tone(330, 0.3, 'triangle', 0.16, 0, 0.7); tone(247, 0.45, 'triangle', 0.16, 0.25, 0.7); }
  phase = 'result'; resT = 0;
  signal('end', { score: a });
}

// ---------- 入力 ----------
function toGhost(px, py) {
  const x = Math.max(MARGIN, Math.min(FW - MARGIN, (px - fx) / S));
  const y = Math.max(MARGIN, Math.min(FH - MARGIN, (py - 46 - fy) / S));
  return { x, y, owner: 0, valid: validPos(x, y) };
}
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault(); audioInit();
  if (phase === 'title') { stage = saveData.stage || 0; ignoreUp = true; startStage(); return; }
  if (phase === 'result') {
    if (resT > 0.7) { if (result && result.win) stage++; ignoreUp = true; startStage(); }
    return;
  }
  if (phase === 'you' && pid === null) {
    pid = e.pointerId; ignoreUp = false; ghost = toGhost(e.clientX, e.clientY); lastGain = -99; lastSteal = -99;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  }
}, { passive: false });
cv.addEventListener('pointermove', (e) => {
  if (e.pointerId !== pid || phase !== 'you' || !ghost) return;
  ghost = toGhost(e.clientX, e.clientY);
}, { passive: false });
function endPointer(e, cancel) {
  if (e.pointerId !== pid) return;
  pid = null;
  const gh = ghost; ghost = null;
  if (ignoreUp || cancel || phase !== 'you' || !gh) return;
  const p = toGhost(e.clientX, e.clientY);
  if (p.valid) placeCat(p.x, p.y, 0);
  else { tone(140, 0.18, 'square', 0.1); floats.push({ x: p.x, y: p.y - 22, txt: T.tooClose, life: 1, col: '#ffd0d0', small: true }); tally(cats, true); }
}
cv.addEventListener('pointerup', (e) => endPointer(e, false));
cv.addEventListener('pointercancel', (e) => endPointer(e, true));

addEventListener('message', (e) => {
  if (e.data && e.data.agf === 'loaded' && e.data.data && typeof e.data.data === 'object') {
    const d = e.data.data;
    saveData = { stage: Math.max(0, d.stage | 0), best: (d.best && typeof d.best === 'object') ? d.best : {} };
  }
});
try { parent.postMessage({ agf: 'load' }, '*'); } catch (e) {}

// ---------- 更新 ----------
function update(dt) {
  time += dt; stageTime += dt; bannerT += dt; hintT += dt;
  shake = Math.max(0, shake - dt * 22);
  for (const f of fish) {
    f.pop = Math.max(0, f.pop - dt * 4);
    const tc = f.pv >= 0 ? COL[f.pv].rgb : [250, 250, 250], k = Math.min(1, dt * 12);
    for (let i = 0; i < 3; i++) f.c[i] += (tc[i] - f.c[i]) * k;
  }
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt; }
  parts = parts.filter((p) => p.life > 0);
  for (const r of rings) r.t += dt; rings = rings.filter((r) => r.t < 0.6);
  for (const f of floats) { f.life -= dt; f.y += dt * 14 * (f.dir || -1); } floats = floats.filter((f) => f.life > 0);

  let disp = base;
  if (phase === 'you') {
    if (ghost) {
      const pt = ghost.valid ? tally(cats.concat(ghost), true) : tally(cats, true);
      const gain = pt[0] - base[0], steal = base[1] - pt[1];
      ghost.gain = gain; ghost.steal = steal;
      if (ghost.valid && (gain !== lastGain || steal !== lastSteal)) {
        if (lastGain > -90) tone(note(Math.max(-4, Math.min(14, gain + steal))), 0.11, 'triangle', 0.11);
        lastGain = gain; lastSteal = steal;
      }
      disp = pt;
    }
  } else if (phase === 'cpu') {
    cpuT += dt;
    if (cpuT >= 0.85) { const p = cpuTarget; cpuTarget = null; placeCat(p.x, p.y, 1); }
  } else if (phase === 'count') {
    countT += dt;
    for (const f of fish) {
      if (f.eaten || countT < f.t0) continue;
      if ((countT - f.t0) / 0.4 >= 1) {
        f.eaten = true;
        const c = cats[f.site];
        if (c && f.val < 0) { cnt[c.owner] += f.val; c.shock = 1; if (c.owner < 2) { tone(c.owner === 0 ? 300 : 220, 0.22, 'square', 0.09, 0, 0.5); floats.push({ x: c.x, y: c.y - 24, txt: '−2', life: 0.9, col: '#c8f0a0' }); } }
        else if (c) { c.fat += f.val; c.gulp = 1; cnt[c.owner] += f.val; if (c.owner < 2) tone(note(cnt[c.owner] % 15 + (c.owner === 0 ? 3 : 0)) * (c.owner === 0 ? 1 : 0.5), 0.09, c.owner === 0 ? 'triangle' : 'sine', 0.13); }
      }
    }

  } else if (phase === 'result') { resT += dt; disp = cnt; }

let dispCounts = [0, 0, 0];

// ---------- 描画 ----------
function fitFont(str, px, maxW, weight = '700') {
  g.font = `${weight} ${px}px ${FONT}`;
  const w = g.measureText(str).width;
  if (w > maxW && w > 0) { px = Math.max(8, px * maxW / w); g.font = `${weight} ${px}px ${FONT}`; }
  return px;
}
function text(str, x, y, px, col, align = 'center', maxW = 9999, weight = '700', stroke = null) {
  fitFont(str, px, maxW, weight);
  g.textAlign = align; g.textBaseline = 'middle';
  if (stroke) { g.lineWidth = Math.max(2, px * 0.22); g.strokeStyle = stroke; g.lineJoin = 'round'; g.strokeText(str, x, y); }
  g.fillStyle = col; g.fillText(str, x, y);
}
function rr(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function drawCat(x, y, r, o, mood = '', alpha = 1) {
  const C = COL[o];
  g.save(); g.translate(x, y); g.globalAlpha = alpha;
  g.fillStyle = 'rgba(0,0,0,0.16)'; g.beginPath(); g.ellipse(0, r * 0.98, r * 0.85, r * 0.26, 0, 0, 6.283); g.fill();
  g.lineJoin = 'round'; g.lineWidth = r * 0.13; g.strokeStyle = C.d;
  for (const sx of [-1, 1]) {
    g.fillStyle = C.m; g.beginPath(); g.moveTo(sx * r * 0.98, -r * 0.15); g.lineTo(sx * r * 0.82, -r * 1.22); g.lineTo(sx * r * 0.12, -r * 0.8); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#ffc9c9'; g.beginPath(); g.moveTo(sx * r * 0.8, -r * 0.5); g.lineTo(sx * r * 0.74, -r * 0.98); g.lineTo(sx * r * 0.4, -r * 0.78); g.closePath(); g.fill();
  }
  g.fillStyle = C.m; g.beginPath(); g.arc(0, 0, r, 0, 6.283); g.fill(); g.stroke();
  g.strokeStyle = C.d; g.lineWidth = r * 0.11; g.lineCap = 'round';
  for (const sx of [-0.28, 0, 0.28]) { g.beginPath(); g.moveTo(sx * r, -r * 0.92); g.lineTo(sx * r, -r * 0.6); g.stroke(); }
  g.fillStyle = '#fff8ee'; g.beginPath(); g.ellipse(0, r * 0.36, r * 0.52, r * 0.38, 0, 0, 6.283); g.fill();
  g.strokeStyle = '#2a1c10'; g.fillStyle = '#2a1c10'; g.lineWidth = r * 0.1;
  const blink = (Math.sin(time * 1.3 + x * 0.1) > 0.985);
  for (const sx of [-1, 1]) {
    const ex = sx * r * 0.42, ey = -r * 0.12;
    if (mood === 'happy' || blink) { g.beginPath(); g.arc(ex, ey + r * 0.06, r * 0.15, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
    else if (mood === 'sad') { g.beginPath(); g.moveTo(ex - sx * r * 0.16, ey + r * 0.08); g.lineTo(ex + sx * r * 0.14, ey - r * 0.06); g.stroke(); }
    else { g.beginPath(); g.arc(ex, ey, r * 0.14, 0, 6.283); g.fill(); }
  }
  g.fillStyle = '#e8748a'; g.beginPath(); g.moveTo(-r * 0.1, r * 0.18); g.lineTo(r * 0.1, r * 0.18); g.lineTo(0, r * 0.3); g.closePath(); g.fill();
  g.lineWidth = r * 0.06; g.strokeStyle = 'rgba(40,28,16,0.55)';
  for (const sx of [-1, 1]) for (const dy of [-0.06, 0.1]) { g.beginPath(); g.moveTo(sx * r * 0.4, r * 0.36); g.lineTo(sx * r * 1.12, r * (0.36 + dy * 2)); g.stroke(); }
  g.restore();
}
function drawFish(f, x, y, sc, alpha = 1) {
  g.save(); g.translate(x, y); g.globalAlpha = alpha;
  if (f.val < 0) {
    g.rotate(-0.6 + Math.sin(time * 2 + f.ph) * 0.08); const k = sc * (1 + f.pop * 0.5); g.scale(k, k);
    g.lineCap = 'round'; g.strokeStyle = '#1f5a22'; g.lineWidth = 8.6; g.beginPath(); g.moveTo(-7, 0); g.quadraticCurveTo(0, 2.4, 7, 0); g.stroke();
    g.strokeStyle = '#4fae45'; g.lineWidth = 6.4; g.beginPath(); g.moveTo(-7, 0); g.quadraticCurveTo(0, 2.4, 7, 0); g.stroke();
    g.fillStyle = '#b9e89a'; for (const q of [-5, -1.5, 2, 5.5]) { g.beginPath(); g.arc(q, 0.4 - Math.abs(q) * 0.05, 0.85, 0, 6.283); g.fill(); }
    g.restore();
    if (f.pv >= 0 && f.pv < 2 && alpha > 0.5) { g.fillStyle = COL[f.pv].m; g.strokeStyle = '#fff'; g.lineWidth = 1.2; g.beginPath(); g.arc(x + 9 * sc, y - 8 * sc, 3.2 * sc, 0, 6.283); g.fill(); g.stroke(); }

  g.fillStyle = `rgb(${f.c[0] | 0},${f.c[1] | 0},${f.c[2] | 0})`;
  g.strokeStyle = f.val > 1 ? '#f2b600' : 'rgba(40,30,20,0.55)'; g.lineWidth = f.val > 1 ? 1.5 : 0.9; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(4.5, 0); g.lineTo(9.5, -4); g.lineTo(9.5, 4); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.ellipse(0, 0, 6.5, 3.9, 0, 0, 6.283); g.fill(); g.stroke();
  g.fillStyle = '#1d1d1d'; g.beginPath(); g.arc(-3.4, -0.8, 0.85, 0, 6.283); g.fill();
  g.restore();
  if (f.val > 1 && alpha > 0.5) {
    const tw = 0.5 + 0.5 * Math.sin(time * 5 + f.ph);
    g.fillStyle = `rgba(255,236,140,${0.5 + tw * 0.5})`;
    const sx = x + 9 * sc, sy = y - 8 * sc, q = (2 + tw * 1.5) * sc;
    g.beginPath(); g.moveTo(sx, sy - q); g.lineTo(sx + q * 0.3, sy - q * 0.3); g.lineTo(sx + q, sy); g.lineTo(sx + q * 0.3, sy + q * 0.3); g.lineTo(sx, sy + q); g.lineTo(sx - q * 0.3, sy + q * 0.3); g.lineTo(sx - q, sy); g.lineTo(sx - q * 0.3, sy - q * 0.3); g.closePath(); g.fill();

}
function catR(c) { return CR * (1 + Math.min(1.1, c.fat * 0.07)) * (1 + (c.gulp || 0) * 0.12); }

function drawField(dim) {
  g.save();
  const sx = shake ? (Math.random() - 0.5) * shake : 0, sy = shake ? (Math.random() - 0.5) * shake : 0;
  g.setTransform(DPR * S, 0, 0, DPR * S, (fx + sx) * DPR, (fy + sy) * DPR);
  rr(0, 0, FW, FH, 10); g.fillStyle = '#f5edd6'; g.fill();
  g.save(); rr(0, 0, FW, FH, 10); g.clip();
  const sites = (ghost && ghost.valid && phase === 'you') ? cats.concat(ghost) : cats;
  const polys = sites.map((s, i) => cellPoly(sites, i));
  for (let i = 0; i < sites.length; i++) {
    const p = polys[i]; if (p.length < 3) continue;
    g.beginPath(); g.moveTo(p[0][0], p[0][1]); for (let k = 1; k < p.length; k++) g.lineTo(p[k][0], p[k][1]); g.closePath();
    g.fillStyle = sites[i] === ghost ? '#ffc98c' : COL[sites[i].owner].cell; g.fill();
  }
  // 地図の点もよう
  g.fillStyle = 'rgba(90,70,40,0.07)';
  for (let yy = 12; yy < FH; yy += 24) for (let xx = 12 + ((yy / 24) % 2) * 12; xx < FW; xx += 24) { g.beginPath(); g.arc(xx, yy, 1.3, 0, 6.283); g.fill(); }
  g.strokeStyle = '#ffffff'; g.lineWidth = 2.6; g.lineJoin = 'round';
  for (let i = 0; i < sites.length; i++) {
    const p = polys[i]; if (p.length < 3) continue;
    g.beginPath(); g.moveTo(p[0][0], p[0][1]); for (let k = 1; k < p.length; k++) g.lineTo(p[k][0], p[k][1]); g.closePath();
    if (sites[i] === ghost) { g.save(); g.strokeStyle = '#ff7a1a'; g.lineWidth = 3; g.setLineDash([7, 5]); g.lineDashOffset = -time * 20; g.stroke(); g.restore(); } else g.stroke();
  }
  for (const r of rings) { const k = r.t / 0.6; g.strokeStyle = r.col; g.globalAlpha = 1 - k; g.lineWidth = 5 * (1 - k) + 1; g.beginPath(); g.arc(r.x, r.y, 14 + k * 90, 0, 6.283); g.stroke(); g.globalAlpha = 1; }
  for (const p of parts) { g.globalAlpha = Math.min(1, p.life * 2.5); g.fillStyle = p.col; g.beginPath(); g.arc(p.x, p.y, 2.4, 0, 6.283); g.fill(); }
  g.globalAlpha = 1;
  g.restore();

  for (const c of cats) {
    const age = time - c.born; let r = catR(c), y = c.y;
    if (age < 0.35) r *= 1 + Math.sin((age / 0.35) * Math.PI) * 0.45;
    const md = c.owner === 0 ? mood0 : c.owner === 1 ? mood1 : '';
    if (md === 'happy') y -= Math.abs(Math.sin(time * 7 + c.x)) * 7;
    if (c.shock) y -= Math.sin(c.shock * Math.PI) * 16;
    drawCat(c.x, y, r, c.owner, md);
    if (c.owner === 2 && !dim) text(T.stray, c.x, c.y + r + 9, Math.max(10.5, 12 / S), '#555', 'center', 80, '700', '#f5edd6');
  }

    const a = Math.min(0.75, (cpuT - 0.1) * 2);

    }

  g.restore();
}

function drawHUD() {
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#1b2e22'; g.fillRect(0, 0, W, HUD);
  const d = dispCounts, prev = phase === 'you' && ghost && ghost.valid;
  drawCat(20, 26, 11, 0);
  text(T.you, 38, 13, 12, '#ffd3a6', 'left', 70, '700');
  text(String(d[0]), 38, 33, 24, '#ffffff', 'left', 60, '900');
  if (prev && ghost.gain > 0) { g.font = `900 24px ${FONT}`; const w = g.measureText(String(d[0])).width; text('+' + ghost.gain, 44 + w, 34, 15, '#ffe36b', 'left', 40, '900'); }
  drawCat(W - 20, 26, 11, 1);
  text(T.foe, W - 38, 13, 12, '#c4dcff', 'right', 70, '700');
  text(String(d[1]), W - 38, 33, 24, '#ffffff', 'right', 60, '900');
  if (prev && ghost.steal > 0) { g.font = `900 24px ${FONT}`; const w = g.measureText(String(d[1])).width; text('−' + ghost.steal, W - 44 - w, 34, 15, '#ffe36b', 'right', 40, '900'); }
  text(T.stage(stage + 1), W / 2, 22, 15, '#e9f3e4', 'center', W - 220, '700');
  // つなひきバー
  const bx = 12, bw = W - 24, by = 47, bh = 9;
  rr(bx, by, bw, bh, 4.5); g.fillStyle = COL[1].m; g.fill();
  g.save(); rr(bx, by, bw, bh, 4.5); g.clip(); g.fillStyle = COL[0].m; g.fillRect(bx, by, bw * barV, bh); g.fillStyle = '#fff'; g.fillRect(bx + bw * barV - 1, by, 2, bh); g.restore();
  g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.moveTo(W / 2, by + bh + 1); g.lineTo(W / 2 - 4, by + bh + 6); g.lineTo(W / 2 + 4, by + bh + 6); g.closePath(); g.fill();
  // 下の帯
  const y0 = H - BOT / 2 - 2;
  drawCat(22, y0, 11, 0, '', left[0] > 0 ? 1 : 0.35); text('×' + left[0], 38, y0 + 1, 17, '#ffffff', 'left', 40, '900');
  drawCat(W - 22, y0, 11, 1, '', left[1] > 0 ? 1 : 0.35); text('×' + left[1], W - 38, y0 + 1, 17, '#ffffff', 'right', 40, '900');
  let msg = '', col = '#ffffff';
  if (phase === 'you') { msg = left[0] === 1 && left[1] === 0 ? T.lastOne : T.yourTurn; col = '#ffd3a6'; }
  else if (phase === 'cpu') { msg = T.foeTurn; col = '#c4dcff'; }
  else if (phase === 'count') msg = T.counting;
  if (msg) text(msg, W / 2, y0 + 1, 16, col, 'center', W - 150, '700');
  if (phase === 'you' && hintT < 6 && !ghost) {
    const a = Math.min(1, hintT * 3, (6 - hintT) * 2);
    g.globalAlpha = a; const hw = Math.min(W - 24, 320);
    rr(W / 2 - hw / 2, H - BOT - 40, hw, 30, 15); g.fillStyle = 'rgba(20,30,22,0.82)'; g.fill();
    text(T.hint, W / 2, H - BOT - 25, 14, '#ffffff', 'center', hw - 20, '700'); g.globalAlpha = 1;
  }
}
function drawBanner() {
  const dur = stage >= 1 && stage <= 3 ? 4.4 : 2.6;
  if (bannerT > dur || phase === 'title') return;
  const d = stageDef(stage), a = Math.min(1, bannerT * 5, (dur - bannerT) * 2.5);
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.globalAlpha = a;
  const extra = stage === 3 ? T.strayNote : stage === 2 ? T.cucNote : stage === 1 ? T.bigNote : '';
  const bw = Math.min(W - 30, 310), bh = extra ? 96 : 72, by = fy + 16;
  rr(W / 2 - bw / 2, by, bw, bh, 14); g.fillStyle = 'rgba(27,46,34,0.9)'; g.fill();
  text(T.stage(stage + 1) + '  ' + T.banner(d.n), W / 2, by + 24, 19, '#ffffff', 'center', bw - 24, '900');
  text(d.first === 0 ? T.first0 : T.first1, W / 2, by + 50, 15, d.first === 0 ? '#ffd3a6' : '#c4dcff', 'center', bw - 24, '700');
  if (extra) text(extra, W / 2, by + 76, 13, '#ffe36b', 'center', bw - 20, '700');

}
function drawResult() {
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const a = Math.min(1, resT * 4), pw = Math.min(W - 28, 320), ph = 132, px = W / 2 - pw / 2, py = fy + FH * S - ph - 6;
  g.globalAlpha = a * 0.9; rr(px, py, pw, ph, 16); g.fillStyle = '#1b2e22'; g.fill();
  g.globalAlpha = a; g.lineWidth = 3; g.strokeStyle = result.win ? '#ff9a3c' : result.drawn ? '#cccccc' : '#5a9cf0'; g.stroke();
  const pop = 1 + Math.max(0, 0.35 - resT) * 1.2;
  const head = result.win ? T.win : result.drawn ? T.draw : T.lose;
  if (result.win) {
    text(head, W / 2 - 8, py + 30, 30 * pop, '#ffcf6b', 'right', pw / 2 - 20, '900');
    for (let i = 0; i < 3; i++) { const on = i < result.stars && resT > 0.25 + i * 0.18; text('★', W / 2 + 22 + i * 30, py + 30, on ? 28 : 24, on ? '#ffd23a' : 'rgba(255,255,255,0.22)', 'center', 40, '900'); }
  } else text(head, W / 2, py + 30, 30 * pop, '#dfe9f5', 'center', pw - 30, '900');
  text(T.fishLine(result.a, result.b), W / 2, py + 64, 18, '#ffffff', 'center', pw - 30, '700');
  if (result.win) text(result.all ? T.allClear : (result.newBest ? T.newBest + '  ' : '') + T.best(result.best), W / 2, py + 87, 13, result.all || result.newBest ? '#ffe36b' : '#bcd6c0', 'center', pw - 20, '700');
  if (resT > 0.7) { g.globalAlpha = 0.6 + 0.4 * Math.sin(time * 5); text(result.win ? T.next : T.again, W / 2, py + ph - 18, 16, '#ffffff', 'center', pw - 24, '700'); }
  g.globalAlpha = 1;
}
function drawTitle() {
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = 'rgba(20,34,25,0.80)'; g.fillRect(0, 0, W, H);
  const cy = H * 0.3;
  drawCat(W / 2 - 62, cy - 78, 26, 0, 'happy'); drawCat(W / 2 + 62, cy - 78, 26, 1);
  g.save(); g.translate(W / 2, cy - 76); g.scale(2.2, 2.2); const ff = { val: 1, pop: 0, ph: 0, c: [255, 255, 255], flip: 1 }; drawFish(ff, 0, 0, 1); g.restore();
  text(T.title, W / 2, cy, 40, '#ffcf6b', 'center', W - 36, '900', '#4a2a10');
  text(T.how1, W / 2, cy + 62, 17, '#ffffff', 'center', W - 32, '700');
  text(T.how2, W / 2, cy + 92, 15, '#dbe8dc', 'center', W - 32, '700');
  text(T.how3, W / 2, cy + 114, 15, '#dbe8dc', 'center', W - 32, '700');
  g.globalAlpha = 0.6 + 0.4 * Math.sin(time * 4);
  text(T.tap, W / 2, H * 0.78, 22, '#ffffff', 'center', W - 40, '900');
  g.globalAlpha = 1;
  if (saveData.stage > 0) text(T.cont(saveData.stage + 1), W / 2, H * 0.78 + 32, 14, '#ffd3a6', 'center', W - 40, '700');
}
function draw() {
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#22382a'; g.fillRect(0, 0, W, H);
  if (!W || !H) return;
  drawField(phase === 'title');
  if (phase === 'title') { drawTitle(); return; }
  drawHUD(); drawBanner();
  if (phase === 'result' && result) drawResult();
}
let lastT = 0;
function frame(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - lastT) / 1000)); lastT = ts;
  try { update(dt); draw(); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize();
requestAnimationFrame((ts) => { lastT = ts; requestAnimationFrame(frame); });
})();
