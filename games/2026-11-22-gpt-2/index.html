<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overscroll-behavior:none;background:#223b48;color:#fff3d8;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}main{width:100vw;height:100dvh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#527078,#1b303e)}header{position:absolute;top:3%;left:6%;right:6%;display:flex;justify-content:space-between;font-size:17px;font-weight:700}#status{position:absolute;top:16%;width:100%;text-align:center;font-size:21px;font-weight:700}#progress{position:absolute;top:24%;width:100%;text-align:center;font-size:16px;color:#b9e4cd}#bells{position:absolute;top:34%;height:39%;left:8%;right:8%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px}.bell{border:3px solid #d9e7ce;border-radius:24px;font:inherit;color:#233744;font-size:16px;min-width:44px;min-height:44px;box-shadow:0 9px 0 #122d3688;transition:filter .1s,transform .1s,box-shadow .1s}.bell span{display:block;font-size:44px;line-height:1.2}.bell.active{filter:brightness(1.5);transform:translateY(-7px);box-shadow:0 0 25px #f7edbd}.bell.error{outline:5px solid #f79898;box-shadow:0 0 25px #f17676;filter:brightness(1.1)}.bell:disabled{color:#233744}#hint{position:absolute;bottom:8%;width:100%;text-align:center;font-size:14px}#cover{position:absolute;inset:0;background:#1e3543f2;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px}#cover.hidden{display:none}h1{font-size:30px;line-height:1.3;margin:0 0 22px}p{font-size:16px;line-height:1.8;white-space:pre-line}b{display:block;font-size:18px;color:#b0e5ca;margin-top:26px}
</style></head><body><main><header><span id="stage"></span><span id="life"></span></header><div id="status"></div><div id="progress"></div><div id="bells"></div><div id="history" style="position:absolute;top:77%;width:100%;text-align:center;font-size:22px;letter-spacing:8px"></div><div id="hint"></div><div id="cover"></div></main><script>
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),T=({ja:{title:'場所をわすれる鈴',intro:'光った鈴を、順に鳴らして返す。\n聞いた後、場所が入れ替わる。\n位置より形を覚えて、五つの歌へ。',start:'タップでスタート',next:'タップで次の歌へ',again:'タップでもう一度',stage:'歌',life:'のこり',listen:'聞く',reply:'同じ順で返そう',ready:'場所が変わる',wrong:'ちがう音。正しいのは',clear:'歌がつながった',all:'五つの歌を返した',lose:'今日はここまで',body:'形と音を組にして覚えよう。',hint:'光る形を覚える。返すときは場所が変わる。',names:['太陽','月','しずく','葉']},en:{title:'Bells Forget Their Places',intro:'Repeat the bells in the order they shine.\nTheir places change after you listen.\nRemember shapes for five melodies.',start:'Tap to start',next:'Tap for the next melody',again:'Tap to play again',stage:'Song',life:'Lives',listen:'Listen',reply:'Repeat the same order',ready:'The places are changing',wrong:'A different note. Expected',clear:'The melody connects',all:'Five melodies returned',lose:'Time to rest',body:'Remember each shape together with its note.',hint:'Remember shapes; their places change for your reply.',names:['Sun','Moon','Drop','Leaf']}})[LANG==='ja'?'ja':'en'];
const el=id=>document.getElementById(id),icons=['☀','☽','💧','🍃'],colors=['#f0cb80','#cbbbe8','#a1d8e8','#abd3a1'],freq=[262,330,392,523],signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};
for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});
let heard=0,played=[],stage=0,lives=3,sequence=[],order=[0,1,2,3],index=0,phase='title',guard=0,active=-1,ac,started=0,token=0;
function sound(i){try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq[i];g.gain.setValueAtTime(.001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.09,ac.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.35);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.36)}catch{}}
function shuffle(){const a=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){el('history').textContent=played.map(i=>icons[i]).join(' ');el('stage').textContent=T.stage+' '+(stage+1)+'/5';el('life').textContent=T.life+' '+lives;el('progress').textContent=((phase==='listen'||phase==='change')?heard:index)+' / '+sequence.length;el('bells').innerHTML=order.map(i=>'<button class="bell '+(active===i?'active ':'')+(phase==='wrong'&&active===i?'error':'')+'" data-tone="'+i+'" style="background:'+colors[i]+'" '+(phase!=='reply'?'disabled':'')+'><span>'+icons[i]+'</span>'+T.names[i]+'</button>').join('')}
function cover(title,body,last){el('cover').className='';el('cover').innerHTML='<div><h1>'+title+'</h1><p>'+body+'</p><b>'+last+'</b></div>'}
function melody(){played=[];sequence=[];for(let i=0;i<stage+3;i++){let n=Math.floor(Math.random()*4);if(i&&n===sequence[i-1])n=(n+1)%4;sequence.push(n)}order=[0,1,2,3];index=0;el('cover').className='hidden';started=performance.now();el('hint').textContent=T.hint;signal('start');listen()}
function listen(){heard=0;played=[];phase='listen';index=0;const own=++token;function note(k){if(own!==token)return;if(k===sequence.length){active=-1;phase='change';el('status').textContent=T.ready;render();setTimeout(()=>{if(own!==token)return;order=shuffle();phase='reply';el('status').textContent=T.reply;render()},600);return}heard=k+1;active=sequence[k];el('status').textContent=T.listen+': '+T.names[active];el('progress').textContent=(k+1)+' / '+sequence.length;sound(active);render();el('progress').textContent=(k+1)+' / '+sequence.length;setTimeout(()=>{if(own!==token)return;active=-1;render();setTimeout(()=>note(k+1),200)},650)}note(0)}
function finish(ok){phase=ok?'clear':'end';token++;active=-1;guard=performance.now()+700;cover(ok?(stage===4?T.all:T.clear):T.lose,ok?'':T.body,ok&&stage<4?T.next:T.again);signal('end');render()}
el('bells').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-tone]');if(!b||phase!=='reply')return;const n=+b.dataset.tone;sound(n);if(n!==sequence[index]){lives--;phase='wrong';active=n;el('status').textContent=T.wrong+' '+T.names[sequence[index]];render();if(!lives){finish(false);return}setTimeout(()=>{active=-1;listen()},1100);return}index++;played.push(n);active=n;if(index===sequence.length)phase='settle';render();if(index===sequence.length){setTimeout(()=>finish(true),250)}else setTimeout(()=>{active=-1;render()},180)});
el('cover').addEventListener('pointerdown',()=>{if(phase==='title'){stage=0;lives=3;sound(0);melody()}else if((phase==='clear'||phase==='end')&&performance.now()>=guard){if(phase==='clear'&&stage<4)stage++;else{stage=0;lives=3}sound(0);melody()}});
function tick(t){if(t-started>6000)el('hint').textContent='';requestAnimationFrame(tick)}requestAnimationFrame(tick);cover(T.title,T.intro,T.start);
</script></body></html>
