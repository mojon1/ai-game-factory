<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>スポン！畑</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#8fd0f0;}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
canvas{display:block;width:100vw;height:100dvh;touch-action:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const T = {
  ja: {
    title: 'スポン！畑',
    how1: '葉っぱをつかんで上へ引っぱる',
    how2: '左右にゆらすと土がゆるむ',
    how3: 'ちぎれる寸前で抜くほど高く飛ぶ！',
    tap: 'タップでスタート',
    hint: '葉をつかんで上へ。左右にゆらすと土がゆるむ',
    total: '合計', best: 'ベスト',
    tear: 'ブチッ…', limp: 'ぬるっ', pop: 'スポン！', big: 'スポーン！！', huge: 'スッポーーン！！！',
    result: '収穫おわり', newBest: 'ベスト更新！', again: 'タップでもう一度',
    torn: 'ちぎれた', names: { carrot: 'にんじん', daikon: 'だいこん', turnip: 'かぶ', potato: 'じゃがいも', giant: 'おおきなかぶ' },
    tense: 'あぶない！'
  },
  en: {
    title: 'SPOON! Farm',
    how1: 'Grab the leaves and pull up',
    how2: 'Wiggle sideways to loosen the soil',
    how3: 'Pull right to the snapping point to launch it high!',
    tap: 'Tap to start',
    hint: 'Grab the leaves, pull up. Wiggle to loosen soil',
    total: 'Total', best: 'Best',
    tear: 'Snap…', limp: 'Plop', pop: 'POP!', big: 'SPOOON!!', huge: 'SPOOOOON!!!',
    result: 'Harvest done', newBest: 'New best!', again: 'Tap to play again',
    torn: 'torn', names: { carrot: 'Carrot', daikon: 'Daikon', turnip: 'Turnip', potato: 'Potatoes', giant: 'Giant turnip' },
    tense: 'Careful!'
  }
}[LANG === 'ja' ? 'ja' : 'en'];
const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';
const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };

// ---------- save ----------
let best = 0;
addEventListener('message', (e) => {
  if (e.data && e.data.agf === 'loaded' && e.data.data && typeof e.data.data.best === 'number') best = Math.max(best, e.data.data.best);
});
try { parent.postMessage({ agf: 'load' }, '*'); } catch (e) {}
const saveBest = () => { try { parent.postMessage({ agf: 'save', data: { best } }, '*'); } catch (e) {} };

// ---------- canvas ----------
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let W = 360, H = 640, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, cv.clientWidth || innerWidth || 360);
  H = Math.max(1, cv.clientHeight || innerHeight || 640);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
addEventListener('resize', resize);
resize();

// ---------- audio ----------
let AC = null, master = null, creak = null, creakGain = null, creakFilt = null, noiseBuf = null;
function initAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      creak = AC.createOscillator(); creak.type = 'sawtooth'; creak.frequency.value = 60;
      creakFilt = AC.createBiquadFilter(); creakFilt.type = 'bandpass'; creakFilt.frequency.value = 400; creakFilt.Q.value = 4;
      creakGain = AC.createGain(); creakGain.gain.value = 0;
      creak.connect(creakFilt); creakFilt.connect(creakGain); creakGain.connect(master);
      creak.start();
    }
    if (AC.state !== 'running') AC.resume();
  } catch (e) { AC = null; }
}
function noise(dur, freq, q, vol, type = 'bandpass') {
  if (!AC) return;
  try {
    const t = AC.currentTime;
    const s = AC.createBufferSource(); s.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
  } catch (e) {}
}
function tone(f0, f1, dur, vol, type = 'sine', delay = 0) {
  if (!AC) return;
  try {
    const t = AC.currentTime + delay;
    const o = AC.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
function setCreak(level, ratio) {
  if (!AC || !creakGain) return;
  const t = AC.currentTime;
  try {
    creakGain.gain.setTargetAtTime(level, t, 0.03);
    creak.frequency.setTargetAtTime(50 + ratio * 170, t, 0.03);
    creakFilt.frequency.setTargetAtTime(300 + ratio * 1500, t, 0.05);
  } catch (e) {}
}
const vib = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

// ---------- vegetables ----------
// S: leaf strength, G: soil grip, Gmin: fully loosened grip, depth: how far it must travel, w: weight factor
const TYPES = {
  carrot: { S: 0.62, G: 0.34, Gmin: 0.14, depth: 0.85, len: 0.24, wid: 0.075, w: 1.0 },
  daikon: { S: 0.92, G: 0.78, Gmin: 0.22, depth: 1.5, len: 0.33, wid: 0.09, w: 1.3 },
  turnip: { S: 0.78, G: 0.98, Gmin: 0.18, depth: 0.7, len: 0.13, wid: 0.13, w: 1.15 },
  potato: { S: 0.85, G: 0.70, Gmin: 0.20, depth: 1.0, len: 0.12, wid: 0.10, w: 1.0 },
  giant:  { S: 1.05, G: 1.25, Gmin: 0.28, depth: 1.1, len: 0.20, wid: 0.21, w: 2.0 },
};
const ORDER = ['carrot', 'carrot', 'turnip', 'daikon', 'carrot', 'potato', 'turnip', 'daikon', 'potato', 'giant'];
const N = ORDER.length;

let state = 'title'; // title | play | result
let stateT = 0, hintT = 0;
let idx = 0, total = 0, results = [];
let veg = null;
let flyers = [], parts = [], popups = [];
let grabbing = false, grabX = 0, grabY = 0, handX = 0, handY = 0, lastHX = 0;
let shake = 0, isNewBest = false, nextT = 0;

function rnd(a, b) { return a + Math.random() * (b - a); }
function makeVeg(type) {
  const b = TYPES[type];
  const v = 1 + rnd(-0.12, 0.12);
  return {
    type, S: b.S * v, G: b.G * rnd(0.92, 1.08), G0: 0, Gmin: b.Gmin, depth: b.depth,
    len: b.len, wid: b.wid, w: b.w,
    prog: 0, tear: 0, ratio: 0, speed: 0, wob: 0, cracks: [], done: false, torn: false, enter: 0,
    seed: Math.random() * 1000
  };
}
function nextVeg() {
  if (idx >= N) { finish(); return; }
  veg = makeVeg(ORDER[idx]);
  veg.G0 = veg.G;
  grabbing = false;
}
function startGame() {
  state = 'play'; stateT = 0; hintT = 0;
  idx = 0; total = 0; results = []; flyers = []; parts = []; popups = [];
  nextVeg();
  signal('start');
}
function finish() {
  state = 'result'; stateT = 0; veg = null;
  isNewBest = total > best + 1e-6;
  if (isNewBest) { best = total; saveBest(); }
  signal('end', { score: Math.round(total * 10) / 10 });
  tone(523, 523, 0.18, 0.15, 'triangle'); tone(659, 659, 0.18, 0.15, 'triangle', 0.15); tone(784, 784, 0.35, 0.15, 'triangle', 0.3);
}

// ---------- geometry ----------
const groundY = () => H * 0.6;
const vegCX = () => W * 0.5;
const U = () => Math.min(W, H * 0.62); // unit size
const pullScale = () => H * 0.32;

function popVeg() {
  const v = veg;
  // launch power: how much pull exceeded the soil grip, relative to the headroom available
  const head = Math.max(0.05, v.S - v.Gmin);
  const n = Math.max(0, Math.min(1.15, v.speed / head));
  const height = Math.round((0.3 + 14 * n * n) * v.w * 10) / 10;
  const name = T.names[v.type];
  let label = n < 0.3 ? T.limp : n < 0.65 ? T.pop : n < 0.9 ? T.big : T.huge;
  total += height;
  results.push({ type: v.type, h: height, torn: false });
  const count = v.type === 'potato' ? 4 : 1;
  for (let i = 0; i < count; i++) {
    flyers.push({
      type: v.type, x: vegCX() + (i - (count - 1) / 2) * U() * 0.07, y: groundY() - v.len * U() * 0.3,
      vy: -(H * (0.6 + 2.6 * n)) * (1 - i * 0.06), vx: rnd(-40, 40) + (i - 1.5) * 25, rot: 0, vr: rnd(-6, 6) * (0.3 + n),
      len: v.len, wid: v.wid, seed: v.seed + i, t: 0, h: height, lbl: i === 0
    });
  }
  for (let i = 0; i < 26 + n * 30; i++) dirt(vegCX() + rnd(-30, 30), groundY(), rnd(-260, 260), rnd(-520, -120) * (0.6 + n));
  popups.push({ text: label, sub: name + ' ' + height.toFixed(1) + 'm', x: W / 2, y: H * 0.36, t: 0, big: n });
  shake = 4 + n * 10;
  tone(220 + n * 300, 80, 0.25, 0.4, 'sine');
  tone(900, 1800 + n * 1500, 0.12 + n * 0.25, 0.08, 'triangle');
  noise(0.3, 600, 0.8, 0.35);
  vib(20 + n * 40);
  v.done = true; nextT = 1.1;
}
function tearVeg() {
  const v = veg;
  results.push({ type: v.type, h: 0, torn: true });
  for (let i = 0; i < 14; i++) parts.push({ x: handX, y: handY, vx: rnd(-200, 200), vy: rnd(-300, 50), t: 0, life: rnd(0.8, 1.4), c: '#3f9a3a', leaf: true, r: rnd(0, 6) });
  popups.push({ text: T.tear, sub: T.names[v.type] + ' — ' + T.torn, x: W / 2, y: H * 0.36, t: 0, big: 0, bad: true });
  noise(0.12, 2600, 1.5, 0.5, 'highpass'); tone(300, 90, 0.2, 0.2, 'square');
  vib([30, 30, 30]);
  v.torn = true; v.done = true; grabbing = false; nextT = 1.2; shake = 6;
}
function dirt(x, y, vx, vy) {
  const cs = ['#6b4423', '#7d5230', '#5a3a1e', '#8a5d36'];
  parts.push({ x, y, vx, vy, t: 0, life: rnd(0.6, 1.2), c: cs[(Math.random() * 4) | 0], r: rnd(2, 5) });
}

// ---------- input ----------
let activeId = null;
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  const x = e.clientX, y = e.clientY;
  if (state === 'title') { startGame(); return; }
  if (state === 'result') { if (stateT > 0.7) startGame(); return; }
  if (state === 'play' && veg && !veg.done && activeId === null) {
    activeId = e.pointerId;
    try { cv.setPointerCapture(e.pointerId); } catch (er) {}
    grabbing = true; grabX = x; grabY = y; handX = x; handY = y; lastHX = x;
    tone(180, 140, 0.06, 0.12, 'triangle');
  }
}, { passive: false });
cv.addEventListener('pointermove', (e) => {
  if (e.pointerId !== activeId || !grabbing) return;
  e.preventDefault();
  handX = e.clientX; handY = e.clientY;
}, { passive: false });
const up = (e) => {
  if (e.pointerId !== activeId) return;
  activeId = null; grabbing = false;
};
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('contextmenu', (e) => e.preventDefault());

// ---------- update ----------
let wiggleSoundT = 0;
function update(dt) {
  stateT += dt; hintT += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (state === 'play' && veg) {
    const v = veg;
    v.enter = Math.min(1, v.enter + dt * 4);
    if (!v.done) {
      let F = 0;
      if (grabbing) {
        F = Math.max(0, (grabY - handY) / pullScale());
        // wiggle loosens soil
        const dx = Math.abs(handX - lastHX);
        lastHX = handX;
        if (dx > 0.5) {
          const loosen = (dx / W) * 0.9 * (F > 0.05 ? 1 : 0.4);
          const before = v.G;
          v.G = Math.max(v.Gmin, v.G - loosen);
          v.wob += dx * 0.02;
          if (before > v.Gmin + 0.001) {
            wiggleSoundT -= dx;
            if (wiggleSoundT <= 0) { noise(0.08, rnd(250, 500), 1.2, 0.18); wiggleSoundT = 22; if (Math.random() < 0.5) dirt(vegCX() + rnd(-40, 40), groundY(), rnd(-80, 80), rnd(-200, -60)); }
            if (Math.random() < loosen * 20 && v.cracks.length < 14) v.cracks.push({ a: rnd(0, Math.PI), l: rnd(0.4, 1), s: rnd(-1, 1) });
          }
        }
        // leaf stress
        if (F > v.S) v.tear += (0.6 + (F - v.S) * 14) * dt;
        else v.tear = Math.max(0, v.tear - dt * 0.8);
        if (v.tear >= 1) { tearVeg(); }
      }
      v.ratio = F / v.S;
      if (!v.done) {
        if (F > v.G) {
          v.speed = F - v.G;
          v.prog += v.speed * 2.2 / v.depth * dt;
          if (Math.random() < v.speed * 0.4) dirt(vegCX() + rnd(-20, 20), groundY(), rnd(-60, 60), rnd(-150, -40));
        } else {
          v.speed = 0;
          if (!grabbing) v.prog = Math.max(0, v.prog - dt * 0.35);
        }
        if (v.prog >= 1) popVeg();
      }
      // creak follows tension
      const r = grabbing && !v.done ? Math.min(1.3, v.ratio) : 0;
      setCreak(r > 0.05 ? 0.02 + 0.13 * Math.min(1, r) * Math.min(1, r) + (v.tear > 0 ? 0.08 : 0) : 0, r);
    } else {
      setCreak(0, 0);
      nextT -= dt;
      if (nextT <= 0) { idx++; nextVeg(); }
    }
    v.wob *= Math.pow(0.02, dt);
  } else setCreak(0, 0);

  const g = H * 1.6;
  for (const f of flyers) {
    f.t += dt;
    f.vy += g * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
    if (f.vy > 0 && !f.landed && f.y > H * 0.86 && f.t > 0.3) { f.landed = true; noise(0.1, 200, 1, 0.25); }
  }
  flyers = flyers.filter((f) => f.y < H + 200 && f.t < 6);
  for (const p of parts) { p.t += dt; p.vy += g * 0.6 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter((p) => p.t < p.life);
  for (const p of popups) p.t += dt;
  popups = popups.filter((p) => p.t < 1.6);
}

// ---------- drawing ----------
function fitText(txt, size, maxW, weight = 700) {
  let s = size;
  cx.font = `${weight} ${s}px ${FONT}`;
  while (s > 12 && cx.measureText(txt).width > maxW) { s -= 1; cx.font = `${weight} ${s}px ${FONT}`; }
  return s;
}
function drawBg() {
  const gy = groundY();
  const sky = cx.createLinearGradient(0, 0, 0, gy);
  sky.addColorStop(0, '#6fbfe8'); sky.addColorStop(1, '#d5f0fb');
  cx.fillStyle = sky; cx.fillRect(0, 0, W, gy);
  // sun
  cx.fillStyle = '#fff3b0'; cx.beginPath(); cx.arc(W * 0.82, H * 0.13, U() * 0.07, 0, 7); cx.fill();
  // far hills
  cx.fillStyle = '#9fd38a';
  cx.beginPath(); cx.moveTo(0, gy);
  for (let x = 0; x <= W; x += 10) cx.lineTo(x, gy - H * 0.05 - Math.sin(x / W * 5 + 1) * H * 0.02);
  cx.lineTo(W, gy); cx.fill();
  // soil
  const soil = cx.createLinearGradient(0, gy, 0, H);
  soil.addColorStop(0, '#7a4d29'); soil.addColorStop(1, '#4a2c15');
  cx.fillStyle = soil; cx.fillRect(0, gy, W, H - gy);
  // soil specks (deterministic)
  cx.fillStyle = 'rgba(40,20,5,0.35)';
  for (let i = 0; i < 60; i++) {
    const sx = (Math.sin(i * 12.9898) * 43758.5453 % 1 + 1) % 1 * W;
    const sy = gy + 8 + (Math.sin(i * 78.233) * 12345.678 % 1 + 1) % 1 * (H - gy - 10);
    cx.fillRect(sx, sy, 3, 2);
  }
  // grass edge
  cx.fillStyle = '#5aa84a'; cx.fillRect(0, gy - 4, W, 6);
  // furrow ridges with tiny sprouts of the queue
  const remain = state === 'play' ? N - idx - 1 : 0;
  for (let i = 0; i < remain; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    const k = Math.floor(i / 2) + 1;
    const x = W / 2 + side * (U() * 0.2 + k * U() * 0.11);
    if (x < 10 || x > W - 10) continue;
    cx.strokeStyle = '#3f8f35'; cx.lineWidth = 2.5;
    for (let j = -1; j <= 1; j++) { cx.beginPath(); cx.moveTo(x, gy); cx.quadraticCurveTo(x + j * 6, gy - 10, x + j * 9, gy - 16); cx.stroke(); }
  }
  // basket
  const bx = W * 0.84, by = H * 0.9, bw = U() * 0.2;
  cx.fillStyle = '#c89048'; cx.beginPath();
  cx.moveTo(bx - bw / 2, by - bw * 0.3); cx.lineTo(bx + bw / 2, by - bw * 0.3); cx.lineTo(bx + bw * 0.38, by + bw * 0.2); cx.lineTo(bx - bw * 0.38, by + bw * 0.2); cx.closePath(); cx.fill();
  cx.strokeStyle = '#8d5f28'; cx.lineWidth = 2;
  for (let i = 1; i < 4; i++) { cx.beginPath(); cx.moveTo(bx - bw / 2 + i * bw / 4, by - bw * 0.3); cx.lineTo(bx - bw * 0.38 + i * bw * 0.19, by + bw * 0.2); cx.stroke(); }
}

function vegBody(type, len, wid, seed) {
  const u = U();
  const L = len * u, R = wid * u;
  // draw with top center at (0,0), extending downwards
  if (type === 'carrot') {
    const gr = cx.createLinearGradient(-R, 0, R, 0);
    gr.addColorStop(0, '#e86a12'); gr.addColorStop(0.5, '#ff9a3c'); gr.addColorStop(1, '#d95a0a');
    cx.fillStyle = gr; cx.beginPath();
    cx.moveTo(-R, 0); cx.quadraticCurveTo(-R * 0.9, L * 0.5, 0, L); cx.quadraticCurveTo(R * 0.9, L * 0.5, R, 0);
    cx.quadraticCurveTo(0, -R * 0.35, -R, 0); cx.fill();
    cx.strokeStyle = 'rgba(140,50,0,0.5)'; cx.lineWidth = 1.5;
    for (let i = 1; i < 5; i++) { const y = L * i / 6; const w = R * (1 - i / 6) * 0.7; cx.beginPath(); cx.moveTo(-w, y); cx.lineTo(-w * 0.3, y + 2); cx.stroke(); cx.beginPath(); cx.moveTo(w * 0.2, y + L / 12); cx.lineTo(w, y + L / 12 - 2); cx.stroke(); }
  } else if (type === 'daikon') {
    const gr = cx.createLinearGradient(-R, 0, R, 0);
    gr.addColorStop(0, '#e6e9e0'); gr.addColorStop(0.5, '#ffffff'); gr.addColorStop(1, '#d9dccf');
    cx.fillStyle = gr; cx.beginPath();
    cx.moveTo(-R, 0); cx.bezierCurveTo(-R * 1.05, L * 0.6, -R * 0.6, L * 0.9, 0, L); cx.bezierCurveTo(R * 0.6, L * 0.9, R * 1.05, L * 0.6, R, 0);
    cx.quadraticCurveTo(0, -R * 0.3, -R, 0); cx.fill();
    cx.fillStyle = 'rgba(150,200,90,0.55)'; cx.beginPath(); cx.ellipse(0, L * 0.1, R * 0.95, L * 0.12, 0, 0, 7); cx.fill();
    cx.strokeStyle = 'rgba(160,160,140,0.6)'; cx.lineWidth = 1;
    for (let i = 2; i < 7; i++) { const y = L * i / 8; cx.beginPath(); cx.moveTo(-R * 0.5, y); cx.lineTo(-R * 0.2, y + 2); cx.stroke(); }
  } else if (type === 'turnip' || type === 'giant') {
    const gr = cx.createRadialGradient(-R * 0.3, R * 0.6, R * 0.1, 0, R, R * 1.2);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.6, '#f2eef5'); gr.addColorStop(1, '#c9a3d6');
    cx.fillStyle = gr; cx.beginPath();
    cx.moveTo(-R * 0.3, 0); cx.bezierCurveTo(-R * 1.3, R * 0.1, -R * 1.2, R * 1.8, 0, L + R * 1.1);
    cx.bezierCurveTo(R * 1.2, R * 1.8, R * 1.3, R * 0.1, R * 0.3, 0); cx.closePath(); cx.fill();
    cx.fillStyle = 'rgba(170,90,190,0.45)'; cx.beginPath(); cx.ellipse(0, R * 0.25, R * 0.9, R * 0.3, 0, 0, 7); cx.fill();
    cx.strokeStyle = '#d8d0c8'; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(0, L + R * 1.1); cx.lineTo(R * 0.1, L + R * 1.6); cx.stroke();
  } else if (type === 'potato') {
    // a stem with potatoes hanging
    cx.strokeStyle = '#c9b28a'; cx.lineWidth = 2;
    const pts = [[-R * 1.2, L * 0.7], [R * 0.2, L * 1.0], [R * 1.3, L * 0.6], [-R * 0.4, L * 1.5]];
    for (const [px, py] of pts) { cx.beginPath(); cx.moveTo(0, 0); cx.quadraticCurveTo(px * 0.3, py * 0.5, px, py); cx.stroke(); }
    for (let i = 0; i < pts.length; i++) {
      const [px, py] = pts[i];
      cx.fillStyle = '#b88a52'; cx.beginPath(); cx.ellipse(px, py, R * 0.62, R * 0.48, i, 0, 7); cx.fill();
      cx.fillStyle = 'rgba(90,60,20,0.6)'; cx.beginPath(); cx.arc(px - R * 0.2, py - R * 0.05, 1.8, 0, 7); cx.arc(px + R * 0.25, py + R * 0.12, 1.6, 0, 7); cx.fill();
    }
  }
}
function singlePotato(R) {
  cx.fillStyle = '#b88a52'; cx.beginPath(); cx.ellipse(0, 0, R * 0.62, R * 0.48, 0, 0, 7); cx.fill();
  cx.fillStyle = 'rgba(90,60,20,0.6)'; cx.beginPath(); cx.arc(-R * 0.2, -R * 0.05, 1.8, 0, 7); cx.arc(R * 0.25, R * 0.12, 1.6, 0, 7); cx.fill();
}
function leafColor(r) {
  // green -> pale yellow -> red-ish as tension rises
  r = Math.max(0, Math.min(1.25, r));
  if (r < 0.7) return `hsl(${110 - r * 15},55%,${38 + r * 6}%)`;
  if (r < 1) { const k = (r - 0.7) / 0.3; return `hsl(${100 - k * 50},${55 + k * 15}%,${42 + k * 12}%)`; }
  const k = Math.min(1, (r - 1) / 0.25); return `hsl(${50 - k * 45},80%,${54 - k * 6}%)`;
}
function drawLeaves(baseX, baseY, tipX, tipY, ratio, tear, type) {
  const n = type === 'carrot' ? 5 : type === 'potato' ? 4 : 4;
  const thick = Math.max(1.5, (type === 'daikon' || type === 'giant' ? 7 : 5) * (1 - Math.min(1, ratio) * 0.55));
  cx.strokeStyle = leafColor(ratio); cx.lineCap = 'round';
  const jitter = tear > 0 ? (Math.random() - 0.5) * 3 * (1 + tear * 3) : 0;
  for (let i = 0; i < n; i++) {
    const o = (i - (n - 1) / 2);
    const sx = baseX + o * 4, ex = tipX + o * 6 * (1 - Math.min(1, ratio) * 0.7) + jitter, ey = tipY + Math.abs(o) * 4;
    cx.lineWidth = thick;
    cx.beginPath(); cx.moveTo(sx, baseY);
    cx.quadraticCurveTo((sx + ex) / 2 + o * 14 * (1 - Math.min(1, ratio)), (baseY + ey) / 2, ex, ey); cx.stroke();
    // little leaflets
    const lx = ex + o * 10, ly = ey - 14;
    cx.fillStyle = leafColor(ratio);
    cx.beginPath(); cx.ellipse(lx, ly, 7 + (1 - Math.min(1, ratio)) * 5, 12, o * 0.4, 0, 7); cx.fill();
  }
}
function drawVeg() {
  if (!veg) return;
  const v = veg, u = U();
  const gy = groundY(), x0 = vegCX();
  if (v.done && !v.torn) return;
  const L = v.len * u, R = v.wid * u;
  const totalTravel = (v.type === 'turnip' || v.type === 'giant') ? L + R * 1.6 : v.type === 'potato' ? L * 1.7 : L;
  const lift = v.prog * totalTravel * 0.55;
  const wob = Math.sin(performance.now() / 40) * Math.min(8, v.wob);
  const topY = gy - lift + (1 - v.enter) * 30;
  // body clipped to below the... draw full body; then soil overlay covers buried part
  cx.save();
  cx.translate(x0 + wob, topY);
  vegBody(v.type, v.len, v.wid, v.seed);
  cx.restore();
  // soil overlay (covers the buried part)
  const soil = cx.createLinearGradient(0, gy, 0, H);
  soil.addColorStop(0, '#7a4d29'); soil.addColorStop(1, '#4a2c15');
  cx.fillStyle = soil; cx.fillRect(0, gy, W, H - gy);
  // loosened mound & cracks
  const loose = 1 - (v.G - v.Gmin) / Math.max(0.01, v.G0 - v.Gmin);
  cx.fillStyle = `rgba(150,100,60,${0.25 + loose * 0.45})`;
  cx.beginPath(); cx.ellipse(x0, gy + 4, R * 1.4 + loose * 30, 10 + loose * 8, 0, 0, 7); cx.fill();
  cx.strokeStyle = 'rgba(30,15,5,0.7)'; cx.lineWidth = 2;
  for (const c of v.cracks) {
    const ang = c.a, l = (R + 25) * c.l;
    cx.beginPath(); cx.moveTo(x0 + Math.cos(ang) * R * 0.8, gy + 3 + Math.sin(ang) * 6);
    cx.lineTo(x0 + Math.cos(ang) * (R * 0.8 + l * 0.5) + c.s * 5, gy + 5 + Math.sin(ang) * 10);
    cx.lineTo(x0 + Math.cos(ang) * (R * 0.8 + l), gy + 6 + Math.sin(ang) * 16);
    cx.stroke();
  }
  // grass line again on both sides
  cx.fillStyle = '#5aa84a'; cx.fillRect(0, gy - 4, x0 - R * 1.4 - loose * 30, 6); cx.fillRect(x0 + R * 1.4 + loose * 30, gy - 4, W, 6);
  // leaves
  if (!v.torn) {
    let tipX = x0 + wob, tipY = topY - u * 0.16;
    if (grabbing) { tipX = handX; tipY = Math.min(handY, topY - 10); }
    drawLeaves(x0 + wob, topY, tipX, tipY, grabbing ? v.ratio : 0, v.tear, v.type);
  } else {
    cx.fillStyle = '#3f9a3a';
    cx.fillRect(x0 - 6 + wob, topY - 8, 12, 8);
  }
}
function drawFlyers() {
  for (const f of flyers) {
    cx.save(); cx.translate(f.x, f.y); cx.rotate(f.rot);
    if (f.type === 'potato') singlePotato(f.wid * U());
    else {
      cx.translate(0, -f.len * U() * 0.5);
      vegBody(f.type, f.len, f.wid, f.seed);
      // leaves stub
      cx.strokeStyle = '#3f9a3a'; cx.lineWidth = 4; cx.lineCap = 'round';
      for (let i = -1; i <= 1; i++) { cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(i * 10, -U() * 0.08); cx.stroke(); }
    }
    cx.restore();
    // altitude marker when off top
    if (f.lbl && f.y < 0) {
      const s = fitText('↑', 18, 40);
      cx.fillStyle = '#fff'; cx.textAlign = 'center'; cx.textBaseline = 'top';
      cx.fillText('↑ ' + f.h.toFixed(1) + 'm', Math.max(40, Math.min(W - 40, f.x)), 56);
    }
  }
}
function drawParts() {
  for (const p of parts) {
    const a = 1 - p.t / p.life;
    cx.globalAlpha = Math.max(0, a);
    cx.fillStyle = p.c;
    if (p.leaf) { cx.beginPath(); cx.ellipse(p.x, p.y, 6, 3, p.t * 8 + p.r, 0, 7); cx.fill(); }
    else cx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
  }
  cx.globalAlpha = 1;
}
function drawPopups() {
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for (const p of popups) {
    const a = p.t < 1.2 ? 1 : 1 - (p.t - 1.2) / 0.4;
    const sc = p.t < 0.15 ? p.t / 0.15 * 1.2 : 1.2 - Math.min(0.2, (p.t - 0.15));
    cx.globalAlpha = Math.max(0, a);
    const size = (30 + p.big * 22) * sc;
    const s = fitText(p.text, size, W - 24, 900);
    cx.lineWidth = 6; cx.strokeStyle = 'rgba(0,0,0,0.35)'; cx.strokeText(p.text, p.x, p.y);
    cx.fillStyle = p.bad ? '#ffd0c0' : p.big > 0.9 ? '#ffe14d' : '#ffffff';
    cx.fillText(p.text, p.x, p.y);
    fitText(p.sub, 20, W - 24, 700);
    cx.lineWidth = 4; cx.strokeText(p.sub, p.x, p.y + s * 0.5 + 18);
    cx.fillStyle = '#fff'; cx.fillText(p.sub, p.x, p.y + s * 0.5 + 18);
  }
  cx.globalAlpha = 1;
}
function drawHUD() {
  cx.textBaseline = 'top';
  cx.fillStyle = 'rgba(0,0,0,0.18)'; cx.fillRect(0, 0, W, 50);
  cx.fillStyle = '#fff';
  cx.textAlign = 'left';
  fitText(T.total + ' ' + total.toFixed(1) + 'm', 20, W * 0.5, 800);
  cx.fillText(T.total + ' ' + total.toFixed(1) + 'm', 12, 8);
  cx.textAlign = 'right';
  const r = Math.min(idx + 1, N) + '/' + N + '   ' + T.best + ' ' + best.toFixed(1) + 'm';
  fitText(r, 15, W * 0.46, 600);
  cx.fillText(r, W - 12, 11);
  // queue dots
  const dw = Math.min(16, (W - 24) / N);
  for (let i = 0; i < N; i++) {
    const x = 12 + i * dw + dw / 2, y = 40;
    const res = results[i];
    cx.fillStyle = res ? (res.torn ? '#d9534f' : '#ffd84d') : i === idx ? '#ffffff' : 'rgba(255,255,255,0.4)';
    cx.beginPath(); cx.arc(x, y, i === idx ? 4 : 3, 0, 7); cx.fill();
  }
  // tension gauge near hand
  if (veg && grabbing && !veg.done) {
    const gx = W - 22, gy = H * 0.2, gh = H * 0.3;
    cx.fillStyle = 'rgba(0,0,0,0.25)'; cx.fillRect(gx - 6, gy, 12, gh);
    const rr = Math.min(1.2, veg.ratio);
    cx.fillStyle = leafColor(rr);
    cx.fillRect(gx - 6, gy + gh - gh * rr / 1.2, 12, gh * rr / 1.2);
    cx.fillStyle = 'rgba(255,255,255,0.9)'; cx.fillRect(gx - 10, gy + gh - gh / 1.2 - 1, 20, 2);
    if (veg.tear > 0.05) {
      cx.textAlign = 'center'; fitText(T.tense, 18, W * 0.5, 800);
      cx.fillStyle = '#ffeded'; cx.lineWidth = 4; cx.strokeStyle = 'rgba(120,0,0,0.5)';
      cx.strokeText(T.tense, W / 2, H * 0.14); cx.fillText(T.tense, W / 2, H * 0.14);
    }
  }
  if (hintT < 4.5 && idx === 0) {
    cx.globalAlpha = Math.min(1, (4.5 - hintT) / 0.6);
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    fitText(T.hint, 16, W - 24, 700);
    cx.fillStyle = 'rgba(0,0,0,0.45)'; cx.fillRect(0, H - 52, W, 40);
    cx.fillStyle = '#fff'; cx.fillText(T.hint, W / 2, H - 32);
    cx.globalAlpha = 1;
  }
}
function drawTitle() {
  cx.fillStyle = 'rgba(0,0,0,0.25)'; cx.fillRect(0, 0, W, H);
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  const bob = Math.sin(performance.now() / 300) * 4;
  fitText(T.title, 54, W - 30, 900);
  cx.lineWidth = 8; cx.strokeStyle = '#5a3a1e'; cx.strokeText(T.title, W / 2, H * 0.2 + bob);
  cx.fillStyle = '#ffb347'; cx.fillText(T.title, W / 2, H * 0.2 + bob);
  cx.fillStyle = '#fff';
  [T.how1, T.how2, T.how3].forEach((s, i) => {
    fitText(s, 17, W - 32, 700);
    cx.lineWidth = 4; cx.strokeStyle = 'rgba(0,0,0,0.4)'; cx.strokeText(s, W / 2, H * 0.32 + i * 28);
    cx.fillText(s, W / 2, H * 0.32 + i * 28);
  });
  const a = 0.6 + 0.4 * Math.sin(performance.now() / 250);
  cx.globalAlpha = a;
  fitText(T.tap, 24, W - 30, 800);
  cx.lineWidth = 5; cx.strokeStyle = 'rgba(0,0,0,0.4)'; cx.strokeText(T.tap, W / 2, H * 0.8);
  cx.fillStyle = '#fff'; cx.fillText(T.tap, W / 2, H * 0.8);
  cx.globalAlpha = 1;
  if (best > 0) { fitText(T.best + ' ' + best.toFixed(1) + 'm', 16, W - 30, 700); cx.fillText(T.best + ' ' + best.toFixed(1) + 'm', W / 2, H * 0.87); }
}
function drawResult() {
  cx.fillStyle = 'rgba(30,18,8,0.6)'; cx.fillRect(0, 0, W, H);
  cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillStyle = '#fff';
  fitText(T.result, 26, W - 30, 800); cx.fillText(T.result, W / 2, H * 0.12);
  const tt = total.toFixed(1) + 'm';
  fitText(tt, 64, W - 30, 900); cx.fillStyle = '#ffe14d'; cx.fillText(tt, W / 2, H * 0.22);
  cx.fillStyle = '#fff';
  const bt = (isNewBest ? T.newBest + '  ' : '') + T.best + ' ' + best.toFixed(1) + 'm';
  fitText(bt, 18, W - 30, 700); cx.fillStyle = isNewBest ? '#ffd84d' : '#fff'; cx.fillText(bt, W / 2, H * 0.3);
  // per veg list
  const top = H * 0.36, rowH = Math.min(30, (H * 0.44) / N);
  for (let i = 0; i < results.length; i++) {
    const r = results[i];
    const y = top + i * rowH + rowH / 2;
    const nm = T.names[r.type];
    cx.textAlign = 'left'; fitText(nm, Math.min(16, rowH * 0.62), W * 0.4, 600);
    cx.fillStyle = '#fff'; cx.fillText(nm, W * 0.1, y);
    // bar
    const bw = W * 0.38 * Math.min(1, r.h / 30);
    cx.fillStyle = r.torn ? '#d9534f' : '#ffd84d'; cx.fillRect(W * 0.45, y - rowH * 0.25, Math.max(3, bw), rowH * 0.5);
    cx.textAlign = 'right'; fitText(r.torn ? T.torn : r.h.toFixed(1) + 'm', Math.min(16, rowH * 0.62), W * 0.2, 700);
    cx.fillStyle = '#fff'; cx.fillText(r.torn ? T.torn : r.h.toFixed(1) + 'm', W * 0.95, y);
  }
  if (stateT > 0.7) {
    cx.textAlign = 'center';
    cx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 250);
    fitText(T.again, 22, W - 30, 800); cx.fillStyle = '#fff'; cx.fillText(T.again, W / 2, H * 0.9);
    cx.globalAlpha = 1;
  }
}
function draw() {
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sx = shake ? (Math.random() - 0.5) * shake : 0, sy = shake ? (Math.random() - 0.5) * shake : 0;
  cx.save(); cx.translate(sx, sy);
  drawBg();
  if (state === 'title') {
    // demo veg in ground
    if (!veg) { veg = makeVeg('carrot'); veg.G0 = veg.G; veg.enter = 1; }
    drawVeg();
  } else if (state === 'play') drawVeg();
  drawFlyers();
  drawParts();
  cx.restore();
  if (state === 'play') { drawPopups(); drawHUD(); }
  else if (state === 'title') drawTitle();
  else if (state === 'result') { drawPopups(); drawResult(); }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (cv.clientWidth !== W || cv.clientHeight !== H) resize();
  try { update(dt); draw(); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
