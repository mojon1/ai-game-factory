<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tide Switch</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b2a;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}</style></head><body><canvas id="sea"></canvas><script>
'use strict';
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en');
const words={ja:{title:'潮目スイッチ',sub:'ふたつの流れ、ひとつのタイミング',help1:'タップで左右の色ゲートを交換。',help2:'光を同じ色へ通して、連続得点！',start:'タップでスタート',score:'得点',time:'秒',best:'ベスト',record:'ベスト更新！',end:'潮が引いた',again:'タップでもう一度',switch:'タップで入れ替え',hint:'光が通る直前に、同じ色へ切り替えよう',chain:'連続',miss:'色ちがい −10',good:'ナイス',perfect:'連続ボーナス'},en:{title:'Tide Switch',sub:'Two currents. One moment.',help1:'Tap to swap the two color gates.',help2:'Match falling lights. Build a streak!',start:'Tap to start',score:'Score',time:'s',best:'Best',record:'New best!',end:'The tide recedes',again:'Tap to play again',switch:'Tap to swap',hint:'Match each light before it reaches the gate',chain:'Streak',miss:'Wrong color −10',good:'Nice',perfect:'Streak bonus'}};
const T=words[LANG]||words.en, c=document.getElementById('sea'),g=c.getContext('2d');
const colors=['#67e8df','#ffc775'];let H=640,scale=1,state='title',score=0,best=0,streak=0,time=0,spawn=0,swapped=0,items=[],particles=[],labels=[],flash=0,endAt=0,newBest=false,last=0,audio;
const signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch(e){}};
function resize(){const w=Math.max(1,innerWidth),h=Math.max(1,innerHeight),d=Math.min(devicePixelRatio||1,3);c.width=Math.round(w*d);c.height=Math.round(h*d);scale=w/360;H=h/scale;g.setTransform(d*scale,0,0,d*scale,0,0)}
addEventListener('resize',resize);resize();
function sound(ok){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),v=audio.createGain();o.type='sine';o.frequency.setValueAtTime(ok?660:170,audio.currentTime);o.frequency.exponentialRampToValueAtTime(ok?990:100,audio.currentTime+.09);v.gain.setValueAtTime(.035,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+.13)}catch(e){}}
function begin(){state='play';score=0;streak=0;time=0;spawn=.5;swapped=0;items=[{lane:0,color:0,y:H*.32},{lane:1,color:1,y:H*.18}];particles=[];labels=[];flash=0;signal('start')}
function finish(){state='end';newBest=score>best;best=Math.max(best,score);endAt=performance.now();signal('end',{score})}
c.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='title'){sound(true);begin()}else if(state==='end'){if(performance.now()-endAt>=700){sound(true);begin()}}else{swapped=1-swapped;flash=.22;sound(true)}});
c.addEventListener('pointermove',e=>e.preventDefault());c.addEventListener('pointerup',e=>e.preventDefault());
function burst(x,y,color,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=30+Math.random()*100;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.65,color})}}
function update(dt){flash=Math.max(0,flash-dt);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}particles=particles.filter(p=>p.t>0);for(const l of labels){l.y-=22*dt;l.t-=dt}labels=labels.filter(l=>l.t>0);if(state!=='play')return;time+=dt;if(time>=45){time=45;finish();return}spawn-=dt;if(spawn<=0){items.push({lane:Math.random()<.5?0:1,color:Math.random()<.5?0:1,y:105});spawn=.92-.34*time/45}const gate=H*.74;for(const p of items){p.y+=(H/640)*(83+time*1.7)*dt;if(p.y>=gate){p.dead=true;const ok=p.color===(p.lane^swapped);if(ok){streak++;const value=10+Math.min(5,Math.floor(streak/4))*5;score+=value;burst(110+140*p.lane,gate,colors[p.color],12);labels.push({x:110+140*p.lane,y:gate-32,text:'+'+value,t:.8,color:colors[p.color]});sound(true)}else{score=Math.max(0,score-10);streak=0;burst(110+140*p.lane,gate,'#ff7991',8);labels.push({x:180,y:gate-42,text:T.miss,t:.9,color:'#ff7991'});sound(false)}}}items=items.filter(p=>!p.dead)}
function text(str,x,y,size,color='#d8f4f6',align='center'){g.fillStyle=color;g.font=`${size}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif`;g.textAlign=align;g.textBaseline='middle';g.fillText(str,x,y,align==='left'||align==='right'?150:330)}
function round(x,y,w,h,r,color){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function orb(x,y,color,r=13){g.shadowColor=color;g.shadowBlur=12;g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();g.shadowBlur=0;g.strokeStyle='#ffffff90';g.lineWidth=2;g.beginPath();if(color===colors[0]){g.moveTo(x-5,y);g.lineTo(x+5,y);g.moveTo(x,y-5);g.lineTo(x,y+5)}else{g.arc(x,y,5,0,Math.PI*2)}g.stroke()}
function draw(){const gate=H*.74;g.clearRect(0,0,360,H);const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#071b2a');bg.addColorStop(1,'#103e4d');g.fillStyle=bg;g.fillRect(0,0,360,H);for(let i=0;i<16;i++){const y=115+i*(H-110)/16;g.strokeStyle='#a4e9ea0b';g.lineWidth=1;g.beginPath();for(let x=0;x<=360;x+=12){const yy=y+Math.sin(x*.028+time*.8+i)*5;x===0?g.moveTo(x,yy):g.lineTo(x,yy)}g.stroke()}
for(let lane=0;lane<2;lane++){const x=110+lane*140;round(x-38,98,76,Math.max(10,gate-98),24,'#ffffff05');g.setLineDash([4,10]);g.strokeStyle='#ffffff12';g.beginPath();g.moveTo(x,105);g.lineTo(x,gate);g.stroke();g.setLineDash([]);const color=colors[lane^swapped];round(x-47,gate-8,94,45,14,color);orb(x,gate+14,'#103040',7);text((lane^swapped)===0?'+':'○',x,gate+13,23,'#103040')}
if(state==='play'){text(T.score+' '+score,20,30,20,'#e7f9f8','left');text(Math.ceil(45-time)+T.time,340,30,20,'#e7f9f8','right');round(20,59,320,4,2,'#ffffff15');round(20,59,320*Math.max(0,1-time/45),4,2,colors[0]);text(T.chain+' '+streak,180,83,14,streak>=4?colors[1]:'#91b5bd');for(const p of items)orb(110+p.lane*140,p.y,colors[p.color]);round(35,H*.87-24,290,53,18,flash>0?'#31717c':'#1d5462');text('⇄  '+T.switch,180,H*.87+2,19);if(time<5)text(T.hint,180,H-24,12,'#aacbd0')}
for(const p of particles){g.globalAlpha=Math.max(0,p.t/.65);g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,3,0,Math.PI*2);g.fill()}g.globalAlpha=1;for(const l of labels){g.globalAlpha=Math.min(1,l.t*3);text(l.text,l.x,l.y,17,l.color)}g.globalAlpha=1;
if(state!=='play'){g.fillStyle='#061823dd';g.fillRect(0,0,360,H);const mid=H*.45;if(state==='title'){text(T.title,180,mid-96,34);text(T.sub,180,mid-52,14,'#91b5bd');orb(119,mid+2,colors[0],18);text('⇄',180,mid+2,30);orb(241,mid+2,colors[1],18);text(T.help1,180,mid+62,16);text(T.help2,180,mid+90,16);round(35,mid+139,290,56,18,'#25606d');text(T.start,180,mid+167,19)}else{text(T.end,180,mid-85,25);text(String(score),180,mid-20,64,colors[0]);text(newBest?T.record:T.best+' '+best,180,mid+42,18,colors[1]);round(35,mid+107,290,56,18,'#25606d');text(T.again,180,mid+135,18)}}}
function loop(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
