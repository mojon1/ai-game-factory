<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>こだまラン / ECHO RUN</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d18;overflow:hidden;overscroll-behavior:none}
  canvas{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none;-webkit-user-select:none;user-select:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  // ---------- 言語 ----------
  const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
  const T = {
    ja: {
      title: 'こだまラン', sub: 'ECHO RUN',
      how1: '指でなぞって ★ を集めよう', how2: '★を取ると、通った道が「こだま」になって動き出す', how3: 'こだまに触れたら終わり',
      tap: 'タップでスタート', hint: '画面のどこでもなぞって動かす', echoes: 'こだま', best: 'ベスト',
      over: 'こだまに触れた！', score: '★', again: 'タップでもう一度', newBest: 'ベスト更新！',
      tip: 'コツ: 短い道で★を取ると、こだまも小さくなる',
    },
    en: {
      title: 'ECHO RUN', sub: 'こだまラン',
      how1: 'Drag to collect ★', how2: 'Each ★ turns the path you ran into a moving "echo"', how3: 'Touch an echo and it is over',
      tap: 'Tap to start', hint: 'Drag anywhere on the screen to move', echoes: 'echoes', best: 'Best',
      over: 'You hit your echo!', score: '★', again: 'Tap to play again', newBest: 'New best!',
      tip: 'Tip: shorter routes make smaller echoes',
    },
  }[LANG === 'en' ? 'en' : 'ja'];
  const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };

  // ---------- 画面 ----------
  const cv = document.getElementById('c'), g = cv.getContext('2d');
  let W = 1, H = 1, DPR = 1;
  const HUD = 54;
  const A = { x: 0, y: 0, w: 1, h: 1 }; // 遊べる範囲
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    A.x = 10; A.y = HUD; A.w = Math.max(1, W - 20); A.h = Math.max(1, H - HUD - 10);
  }
  addEventListener('resize', resize); resize();
  const unit = () => Math.max(1, Math.min(A.w, A.h));
  const R = () => Math.max(8, unit() * 0.03);           // 自機の半径
  const toPx = (p) => ({ x: A.x + p.x * A.w, y: A.y + p.y * A.h });
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  // ---------- 状態 ----------
  const SDT = 1 / 30;          // 道の記録間隔
  const ARM = 1.0;             // こだまが当たり判定を持つまでの時間
  const MAXPATH = 30 * 16;     // 1体のこだまの最大長（16秒）
  let state = 'title', time = 0, overAt = 0;
  let player = { x: 0.5, y: 0.6 }, path = [], echoes = [], star = null;
  let score = 0, best = 0, newBest = false, sampleAcc = 0, playT = 0;
  let particles = [], floaters = [], shake = 0;
  const HUES = [330, 285, 200, 20, 160, 255, 45, 300];

  function spawnStar() {
    const p = toPx(player); let bestPos = null, bestScore = -1;
    for (let i = 0; i < 40; i++) {
      const s = { x: 0.1 + Math.random() * 0.8, y: 0.1 + Math.random() * 0.8 };
      const sp = toPx(s);
      let d = dist(sp, p);
      if (d < unit() * 0.28) continue;
      let clear = Infinity;
      for (const e of echoes) clear = Math.min(clear, minDistToPath(sp, e.pts));
      const sc = Math.min(clear, unit() * 0.25) + Math.min(d, unit() * 0.6) * 0.3;
      if (sc > bestScore) { bestScore = sc; bestPos = s; }
    }
    star = bestPos || { x: 0.5, y: 0.25 };
    star.born = time;
  }
  function minDistToPath(sp, pts) {
    let m = Infinity;
    for (let i = 0; i < pts.length; i += 3) m = Math.min(m, dist(sp, toPx(pts[i])));
    return m;
  }
  function start() {
    state = 'play'; score = 0; newBest = false; playT = 0;
    player = { x: 0.5, y: 0.62 }; path = [{ ...player }]; echoes = []; particles = []; floaters = [];
    spawnStar();
    signal('start');
    beep(520, 0.08, 'triangle', 0.05);
  }
  function die() {
    state = 'over'; overAt = time; shake = 12;
    if (score > best) { best = score; newBest = score > 0; }
    burst(toPx(player), '#ffffff', 40, 2.2);
    signal('end', { score });
    beep(110, 0.5, 'sawtooth', 0.07);
  }

  // こだまの位置（記録した道を往復し続ける）
  function echoPos(e) {
    const n = e.pts.length;
    if (n < 2) return e.pts[0];
    const period = 2 * n - 2, f = (e.t / SDT) % period;
    const i = Math.floor(f), fr = f - i;
    const at = (k) => e.pts[k < n ? k : period - k];
    const a = at(i), b = at((i + 1) % period);
    return { x: a.x + (b.x - a.x) * fr, y: a.y + (b.y - a.y) * fr };
  }

  // ---------- 入力（画面のどこでもなぞって相対移動） ----------
  let drag = null;
  cv.addEventListener('pointerdown', (e) => {
    unlockAudio();
    if (state === 'title' || (state === 'over' && time - overAt > 0.7)) { start(); }
    drag = { x: e.clientX, y: e.clientY, id: e.pointerId };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cv.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id || state !== 'play') { if (drag) { drag.x = e.clientX; drag.y = e.clientY; } return; }
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    player.x = Math.max(0, Math.min(1, player.x + (dx * 1.15) / A.w));
    player.y = Math.max(0, Math.min(1, player.y + (dy * 1.15) / A.h));
  });
  const end = () => { drag = null; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);

  // ---------- 音 ----------
  let ac = null;
  function unlockAudio() {
    try { ac ||= new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {}
  }
  function beep(f, d, type = 'sine', vol = 0.05) {
    if (!ac) return;
    try {
      const o = ac.createOscillator(), v = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, ac.currentTime);
      v.gain.setValueAtTime(vol, ac.currentTime); v.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
      o.connect(v).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }

  // ---------- 演出 ----------
  function burst(p, col, n = 18, sp = 1) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (40 + Math.random() * 160) * sp;
      particles.push({ x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, col });
    }
  }

  // ---------- 更新 ----------
  function update(dt) {
    time += dt;
    shake = Math.max(0, shake - dt * 40);
    particles = particles.filter((p) => (p.life -= dt * 1.6) > 0);
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; }
    floaters = floaters.filter((f) => (f.life -= dt) > 0);
    if (state !== 'play') { for (const e of echoes) e.t += dt * 0.3; return; }
    playT += dt;
    // 道を記録
    sampleAcc += dt;
    while (sampleAcc >= SDT) { sampleAcc -= SDT; path.push({ x: player.x, y: player.y }); if (path.length > MAXPATH) path.shift(); }
    const pp = toPx(player), r = R();
    // こだま
    for (const e of echoes) {
      e.t += dt; e.age += dt;
      if (e.age > ARM && dist(pp, toPx(echoPos(e))) < r * 1.75) { die(); return; }
    }
    // 星
    if (star && dist(pp, toPx(star)) < r * 2.2) {
      score++;
      const sp = toPx(star);
      burst(sp, '#ffd36b', 22);
      floaters.push({ x: sp.x, y: sp.y, text: '+1', life: 0.8 });
      echoes.push({ pts: path.length > 1 ? path.slice() : [{ ...player }, { ...player }], t: 0, age: 0, hue: HUES[echoes.length % HUES.length] });
      path = [{ ...player }];
      beep(660 + Math.min(score, 20) * 30, 0.12, 'triangle', 0.06);
      setTimeout(() => beep(990 + Math.min(score, 20) * 30, 0.1, 'sine', 0.04), 60);
      spawnStar();
    }
  }

  // ---------- 描画 ----------
  function text(s, x, y, size, col, weight = 'bold', align = 'center') {
    g.font = `${weight} ${size}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif`;
    g.fillStyle = col; g.textAlign = align; g.textBaseline = 'middle';
    // はみ出す場合は縮める
    const w = g.measureText(s).width, maxW = W - 28;
    if (w > maxW && align === 'center') { g.font = `${weight} ${Math.max(12, (size * maxW) / w)}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif`; }
    g.fillText(s, x, y);
  }
  function drawBg() {
    const gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, '#0d1222'); gr.addColorStop(1, '#070912');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(120,140,220,0.06)'; g.lineWidth = 1;
    const step = Math.max(24, unit() / 12);
    g.beginPath();
    for (let x = A.x; x <= A.x + A.w; x += step) { g.moveTo(x, A.y); g.lineTo(x, A.y + A.h); }
    for (let y = A.y; y <= A.y + A.h; y += step) { g.moveTo(A.x, y); g.lineTo(A.x + A.w, y); }
    g.stroke();
    g.strokeStyle = 'rgba(140,160,255,0.22)'; g.lineWidth = 1.5;
    g.strokeRect(A.x, A.y, A.w, A.h);
  }
  function drawEcho(e) {
    const col = (a) => `hsla(${e.hue},90%,65%,${a})`;
    // 道の全体（薄く）: どこを動くか読めるように
    g.strokeStyle = col(0.13); g.lineWidth = R() * 0.9; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath();
    e.pts.forEach((p, i) => { const q = toPx(p); i ? g.lineTo(q.x, q.y) : g.moveTo(q.x, q.y); });
    g.stroke();
    // 本体
    const p = toPx(echoPos(e)), armed = e.age > ARM;
    const blink = armed ? 1 : 0.25 + 0.25 * Math.sin(e.age * 30);
    g.save();
    g.shadowColor = col(1); g.shadowBlur = 16;
    g.fillStyle = col(0.9 * blink);
    g.beginPath(); g.arc(p.x, p.y, R() * 0.95, 0, Math.PI * 2); g.fill();
    g.restore();
  }
  function drawStar(t) {
    if (!star) return;
    const p = toPx(star), r = R() * 1.25 * (1 + 0.08 * Math.sin(t * 6)), pop = Math.min(1, (time - star.born) * 5);
    g.save(); g.translate(p.x, p.y); g.rotate(t * 1.2); g.scale(pop, pop);
    g.shadowColor = '#ffd36b'; g.shadowBlur = 18; g.fillStyle = '#ffd36b';
    g.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5, rr = i % 2 ? r * 0.45 : r; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    g.closePath(); g.fill(); g.restore();
  }
  function drawPlayer() {
    // 今の道（次のこだまになる）をうっすら表示
    if (path.length > 1) {
      g.strokeStyle = 'rgba(160,240,255,0.22)'; g.lineWidth = 2; g.setLineDash([4, 6]);
      g.beginPath(); path.forEach((p, i) => { const q = toPx(p); i ? g.lineTo(q.x, q.y) : g.moveTo(q.x, q.y); }); g.stroke(); g.setLineDash([]);
    }
    const p = toPx(player);
    g.save(); g.shadowColor = '#9ff3ff'; g.shadowBlur = 20; g.fillStyle = '#e9fdff';
    g.beginPath(); g.arc(p.x, p.y, R(), 0, Math.PI * 2); g.fill(); g.restore();
  }
  function hud() {
    g.fillStyle = 'rgba(5,7,14,0.6)'; g.fillRect(0, 0, W, HUD - 6);
    text(`${T.score} ${score}`, 16, HUD / 2 - 3, 22, '#ffd36b', 'bold', 'left');
    text(`${T.echoes} ${echoes.length}`, W / 2, HUD / 2 - 3, 14, '#c9b8ff', 'bold');
    text(`${T.best} ${best}`, W - 16, HUD / 2 - 3, 14, '#9aa3c0', 'bold', 'right');
  }
  function overlay(alpha) { g.fillStyle = `rgba(6,8,16,${alpha})`; g.fillRect(0, 0, W, H); }

  function draw(t) {
    g.save();
    if (shake) g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawBg();
    for (const e of echoes) drawEcho(e);
    if (state === 'play') { drawStar(t); drawPlayer(); }
    for (const p of particles) { g.globalAlpha = p.life; g.fillStyle = p.col; g.fillRect(p.x - 2, p.y - 2, 4, 4); }
    g.globalAlpha = 1;
    for (const f of floaters) text(f.text, f.x, f.y - (0.8 - f.life) * 40, 18, `rgba(255,211,107,${f.life})`);
    g.restore();
    hud();
    const s = Math.min(W, 420);
    if (state === 'play' && playT < 3.5 && score === 0) text(T.hint, W / 2, A.y + A.h - 28, 13, `rgba(200,210,240,${Math.min(1, 3.5 - playT)})`, 'normal');
    if (state === 'title') {
      overlay(0.55);
      text(T.title, W / 2, H * 0.3, Math.min(44, s / 8), '#e9fdff');
      text(T.sub, W / 2, H * 0.3 + Math.min(44, s / 8) * 0.95, 13, '#8b93b5', 'normal');
      text(T.how1, W / 2, H * 0.47, 16, '#ffd36b');
      text(T.how2, W / 2, H * 0.47 + 30, 13, '#d6dcf5', 'normal');
      text(T.how3, W / 2, H * 0.47 + 54, 13, '#ff9fc8', 'normal');
      const pulse = 0.6 + 0.4 * Math.sin(t * 4);
      text(T.tap, W / 2, H * 0.72, 18, `rgba(159,243,255,${pulse})`);
    }
    if (state === 'over') {
      overlay(0.62);
      text(T.over, W / 2, H * 0.3, 22, '#ff9fc8');
      text(`${T.score} ${score}`, W / 2, H * 0.42, Math.min(64, s / 6), '#ffd36b');
      text(newBest ? T.newBest : `${T.best} ${best}`, W / 2, H * 0.52, 15, newBest ? '#9ff3ff' : '#9aa3c0');
      text(T.tip, W / 2, H * 0.6, 12.5, '#b9c0dc', 'normal');
      if (time - overAt > 0.7) text(T.again, W / 2, H * 0.72, 17, `rgba(159,243,255,${0.6 + 0.4 * Math.sin(t * 4)})`);
    }
  }

  // タイトル画面の飾り（動くこだま）
  (function demo() {
    const pts = [];
    for (let i = 0; i < 120; i++) { const a = (i / 120) * Math.PI * 2; pts.push({ x: 0.5 + Math.cos(a) * 0.32, y: 0.5 + Math.sin(a * 2) * 0.18 }); }
    echoes.push({ pts, t: 0, age: 9, hue: 300 });
  })();

  let last = 0;
  function frame(ts) {
    const dt = Math.min(0.05, Math.max(0, (ts - last) / 1000 || 0)); last = ts;
    update(dt); draw(ts / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
