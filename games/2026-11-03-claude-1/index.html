<!DOCTYPE html>

<title>湯けむり坂の町 / Steam Hill Town</title>
<style>

#right { text-align: right; min-width: 130px; }
#goal { font-size: 15px; font-weight: 800; }
#bar { width: 130px; height: 8px; border-radius: 4px; background: #0005; margin: 4px 0 0 auto; overflow: hidden; }
#bar { position: relative; }
#barGh { position: absolute; top: 0; height: 100%; width: 0; background: #fff7c8; opacity: .75; animation: blink 0.9s ease-in-out infinite; }
#barIn { height: 100%; width: 0; background: linear-gradient(90deg, #ffd36b, #ff8f5a); transition: width .4s; }
#best { font-size: 14px; margin-top: 4px; opacity: .85; }
#tray { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(#1b223800, #1b2238dd 26%); pointer-events: auto; }
#rule { font-size: 14px; line-height: 1.35; min-height: 38px; padding: 0 4px 6px; text-shadow: 0 1px 2px #000a; display: flex; align-items: flex-end; }
#row { display: flex; gap: 6px; align-items: stretch; }
#pieces { flex: 1; display: flex; gap: 5px; min-width: 0; }
.pc { flex: 1 1 0; min-width: 0; max-width: 72px; height: 58px; border-radius: 12px; border: 2px solid #ffffff33; background: #ffffff18; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; color: #fff; font-weight: 800; font-size: 13px; }
.pc .sw { width: 22px; height: 18px; border-radius: 5px; margin-bottom: 3px; box-shadow: inset 0 -3px 0 #0003; }

.pc.sel { border-color: #ffd36b; background: #ffd36b33; transform: translateY(-3px); }

#hint { position: absolute; left: 0; right: 0; bottom: 140px; text-align: center; font-size: 15px; font-weight: 800; text-shadow: 0 1px 3px #000, 0 0 6px #000a; transition: opacity .6s; opacity: 0; padding: 0 12px; }
.pop { position: absolute; transform: translate(-50%, -50%); font-weight: 900; white-space: nowrap; text-shadow: 0 2px 4px #000c, 0 0 2px #000; pointer-events: none; animation: popup 1.1s ease-out forwards; }
@keyframes popup { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -150%) scale(1); } }
.ov { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; background: radial-gradient(ellipse at 50% 45%, #1d2440bb, #0d1122ee); pointer-events: auto; }
.ov.on { display: flex; }
.ttl { font-size: 44px; font-weight: 900; letter-spacing: .04em; color: #fff0d0; text-shadow: 0 3px 0 #b5502e, 0 0 20px #ffb07a88; line-height: 1.12; }
.sub { font-size: 14px; color: #ffd8a8; margin-top: 8px; letter-spacing: .1em; }
.how { margin-top: 24px; font-size: 15px; line-height: 1.75; color: #fff3df; }
.how b { color: #ffd36b; }
.tap { margin-top: 28px; font-size: 18px; font-weight: 800; color: #fff; animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
.rs-h { font-size: 20px; font-weight: 800; color: #ffd8a8; }
.rs-s { font-size: 64px; font-weight: 900; color: #fff0d0; line-height: 1.1; }
.rs-b { font-size: 16px; margin-top: 4px; }
.rs-new { color: #ffd36b; font-weight: 900; font-size: 20px; margin-top: 6px; }
.rs-t { font-size: 15px; margin-top: 14px; line-height: 1.6; color: #fff3df; }
#packs { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 330px; margin-top: 18px; }
.pk { border-radius: 16px; background: #ffffff1c; border: 2px solid #ffd36b88; padding: 12px 12px 10px; color: #fff; font-family: inherit; text-align: left; }
.pk h3 { margin: 0 0 8px; font-size: 18px; color: #ffe2a8; }
.pk .its { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 15px; font-weight: 700; }
.pk .it { display: flex; align-items: center; gap: 5px; }
.pk .sw { width: 16px; height: 14px; border-radius: 4px; }
.pk:active { background: #ffd36b33; }
</style>

<body>

<canvas id="ov2d"></canvas>
<div id="ui">

    <div><div id="score">0<small></small></div><div id="lv"></div></div>

  </div>
  <div id="hint"></div>
  <div id="tray">
    <div id="rule"></div>
    <div id="row"><div id="pieces"></div><button id="build" class="off"></button></div>
  </div>
  <div id="title" class="ov on">

</div>
<script src="../../lib/three-0.186.1.min.js"></script>
<script>
'use strict';
for (const t of ['contextmenu', 'selectstart', 'gesturestart']) addEventListener(t, (e) => e.preventDefault(), { passive: false });
const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };

const DICT = {
  ja: {
    title: '湯けむり<br>坂の町', sub: 'HOT SPRING HILL TOWN',
    how: '<b>湯元</b>のそばに<b>旅館</b>、旅館のそばに<b>土産屋</b>。<br>海が見える宿は点が高い。<br>目標点に届くと、新しい建物が届く。',
    tap: 'タップでスタート', again: 'タップでもう一度',
    pt: '点', next: (g) => `次の目標 ${g}`, best: (b) => `ベスト ${b}`,
    build: '建てる', hint: 'マスをタップで下見、もう一度タップで建てる',
    names: { spring: '湯元', inn: '旅館', shop: '土産屋', foot: '足湯', pine: '松', pagoda: '五重塔' },
    rules: {
      spring: '湧き出し +1　旅館が2マス以内 +2　湯元が隣 −3　足湯が隣 +1',
      inn: '湯元が2マス以内 +3　海が見える +3（前2マスに高い建物なし）　松が隣 +1',
      shop: '旅館が隣 +2　足湯が隣 +1　土産屋が隣 −2',
      foot: '湯元が隣 +2　土産屋が隣 +1',
      pine: '旅館・五重塔が隣 +2　岩が隣 +1',
      pagoda: '海が見える +5（前3マスふさぐ）　2マス以内の建物 1つ +1',
    },
    view: '眺め', noView: '眺めなし', block: 'ふさぐ',
    lvNames: ['湯の村', '湯の里', '温泉町', '湯けむり町', '温泉郷', '名湯の郷', '天下の名湯'],
    lvUp: (n) => `「${n}」になった！`, pick: '届いた荷物をひとつ選ぶ',
    packs: { a: '湯けむり便', b: 'にぎわい便', c: '宿場便', d: '庭師便', e: '名所便', f: '湯治場便' },
    over: '建物を使いきった', full: '坂いっぱいの温泉郷！', newBest: 'ベスト更新！',
    stat: (n, lv) => `建てた建物 ${n}　町の格「${lv}」`,
    lineView: '旅館は「海が見える」と+3', lineGoal: (g) => `あと ${g} 点で新しい建物が届く`,
  },
  en: {
    title: 'Steam Hill<br>Town', sub: 'HOT SPRING HILLSIDE',
    how: 'Put <b>Inns</b> near <b>Springs</b>, <b>Shops</b> next to Inns.<br>Inns with a sea view score more.<br>Reach the goal to get new buildings.',
    tap: 'Tap to start', again: 'Tap to play again',
    pt: 'pts', next: (g) => `Goal ${g}`, best: (b) => `Best ${b}`,
    build: 'Build', hint: 'Tap a tile to preview, tap again to build',
    names: { spring: 'Spring', inn: 'Inn', shop: 'Shop', foot: 'Footbath', pine: 'Pine', pagoda: 'Pagoda' },
    rules: {
      spring: 'Source +1 · Inn within 2: +2 · Spring next to it: −3 · Footbath next: +1',
      inn: 'Spring within 2: +3 · Sea view: +3 (no tall building 2 tiles ahead) · Pine next: +1',
      shop: 'Inn next to it: +2 · Footbath next: +1 · Shop next: −2',
      foot: 'Spring next to it: +2 · Shop next: +1',
      pine: 'Inn or Pagoda next to it: +2 · Rock next: +1',
      pagoda: 'Sea view: +5 (blocks 3 tiles behind) · Each building within 2: +1',
    },
    view: 'View', noView: 'No view', block: 'Blocks',
    lvNames: ['Spa Village', 'Spa Hamlet', 'Spa Town', 'Steam Town', 'Spa Valley', 'Famous Spa', 'Legendary Spa'],
    lvUp: (n) => `Now a "${n}"!`, pick: 'Pick one delivery',
    packs: { a: 'Steam Crate', b: 'Market Crate', c: 'Lodging Crate', d: 'Garden Crate', e: 'Landmark Crate', f: 'Healing Crate' },
    over: 'Out of buildings', full: 'The whole hill is a spa!', newBest: 'New best!',
    stat: (n, lv) => `Buildings: ${n} · Rank: ${lv}`,
    lineView: 'Inns score +3 with a sea view', lineGoal: (g) => `${g} more pts for new buildings`,
  },
};
const T = DICT[LANG === 'ja' ? 'ja' : 'en'];

// ---------- save ----------
let best = 0;
addEventListener('message', (e) => { if (e.data && e.data.agf === 'loaded' && e.data.data) { best = e.data.data.best || 0; updHud(); } });
try { parent.postMessage({ agf: 'load' }, '*'); } catch (e) {}
const saveBest = () => { try { parent.postMessage({ agf: 'save', data: { best } }, '*'); } catch (e) {} };

// ---------- audio ----------
let AC = null, master = null;
const SCALE = [0, 2, 5, 7, 9, 12, 14, 17, 19, 21, 24, 26, 29];
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
    // waves
    const len = AC.sampleRate * 4, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.2; }
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 650;
    const g = AC.createGain(); g.gain.value = 0.05;
    const lfo = AC.createOscillator(); lfo.frequency.value = 0.13; const lg = AC.createGain(); lg.gain.value = 0.035;
    lfo.connect(lg); lg.connect(g.gain);
    src.connect(lp); lp.connect(g); g.connect(master); src.start(); lfo.start();
  } catch (e) { AC = null; }
}
function pluck(semi, when = 0, vol = 0.16, dur = 1.3) {
  if (!AC) return;
  try {
    const t = AC.currentTime + when, f = 293.66 * Math.pow(2, semi / 12);
    const o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain(), g2 = AC.createGain();
    o.type = 'triangle'; o.frequency.value = f; o2.type = 'sine'; o2.frequency.value = f * 2.01;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(vol * 0.35, t + 0.004); g2.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.4);
    o.connect(g); o2.connect(g2); g.connect(master); g2.connect(master);
    o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  } catch (e) {}
}
function thunk(when = 0, f0 = 180, vol = 0.32) {
  if (!AC) return;
  try {
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 0.45, t + 0.14);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.22);
  } catch (e) {}
}
function tick(score) {
  const i = Math.max(0, Math.min(SCALE.length - 1, score + 2));
  pluck(SCALE[i], 0, score < 0 ? 0.05 : 0.07, 0.35);
}

// ---------- three ----------
const cv = document.getElementById('gl'), ov = document.getElementById('ov2d'), ctx = ov.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x6a5a3a, 1.2); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.6);
sun.position.set(-5, 10, 6); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 7, bottom: -7, near: 1, far: 30 });
sun.shadow.bias = -0.0015;
scene.add(sun); scene.add(sun.target);
scene.fog = new THREE.Fog(0x9fd3f0, 18, 42);

const COLS = 6, ROWS = 8, STEP = 0.32;
const cellPos = (c, r) => new THREE.Vector3(c - (COLS - 1) / 2, r * STEP, (ROWS - 1) / 2 - r);
const MATS = {};
const mat = (hex, o = {}) => { const k = hex + JSON.stringify(o); return MATS[k] || (MATS[k] = new THREE.MeshStandardMaterial({ color: hex, roughness: 0.85, flatShading: true, ...o })); };
const winMat = new THREE.MeshStandardMaterial({ color: 0x5a4a35, emissive: 0xffb760, emissiveIntensity: 0.1, roughness: 0.6 });
const lanternMat = new THREE.MeshStandardMaterial({ color: 0xe0503a, emissive: 0xff6a3a, emissiveIntensity: 0.3, roughness: 0.5 });
const waterMat = new THREE.MeshStandardMaterial({ color: 0x5fd1cf, emissive: 0x1a6b70, emissiveIntensity: 0.4, roughness: 0.25, metalness: 0.1 });
function mesh(geo, m, x = 0, y = 0, z = 0, cast = true) { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = cast; o.receiveShadow = true; return o; }

// terraces
const world = new THREE.Group(); scene.add(world);
const tiles = [], terrs = [];
const tileGeo = new THREE.BoxGeometry(0.94, 0.08, 0.94);
for (let r = 0; r < ROWS; r++) {
  const p = cellPos(0, r);
  const terr = mesh(new THREE.BoxGeometry(COLS + 0.2, 3, 1), mat(r % 2 ? 0x7aa65a : 0x83b062), 0, p.y - 1.5, p.z, false);
  world.add(terr); terr.userData = { r }; terrs.push(terr);
  const wall = mesh(new THREE.BoxGeometry(COLS + 0.22, STEP + 0.02, 0.06), mat(0x8d8578), 0, p.y - STEP / 2, p.z + 0.5, false);
  if (r > 0) world.add(wall);
  for (let c = 0; c < COLS; c++) {
    const q = cellPos(c, r);
    const tm = new THREE.MeshStandardMaterial({ color: 0x9cc677, roughness: 0.95, flatShading: true });
    const t = mesh(tileGeo, tm, q.x, q.y + 0.04, q.z, false);
    t.userData = { c, r, base: new THREE.Color(((c + r) % 2) ? 0x95c171 : 0xa2cb7e) };
    tm.color.copy(t.userData.base);
    world.add(t); tiles.push(t);
  }
}
// sides / back mountains / beach / sea
world.add(mesh(new THREE.BoxGeometry(30, 3, 30), mat(0x6e9a52), 0, (ROWS - 1) * STEP - 1.52, -18.4, false));
const beach = mesh(new THREE.BoxGeometry(COLS + 6, 0.5, 1.0), mat(0xe8d6a8), 0, -0.3, (ROWS - 1) / 2 + 0.95, false); world.add(beach);
for (const [x, z, s, col] of [[-6, -10, 5, 0x5a8a5c], [3, -13, 6.5, 0x4f7d5a], [9, -9, 4.5, 0x5f8f60], [-11, -12, 5.5, 0x557f60], [0, -18, 8, 0x6c8aa0]]) {
  const m = mesh(new THREE.ConeGeometry(s, s * 0.9, 7), mat(col), x, (ROWS - 1) * STEP + s * 0.4, z, false); world.add(m);
}
const mapleCols = [0xd9542c, 0xe8892f, 0xc23a2a, 0xf0b53a, 0x7aa65a];
for (let r = 0; r < ROWS; r++) for (const side of [-1, 1]) {
  const p = cellPos(0, r), x = side * (COLS / 2 + 0.55 + ((r * 7 + (side > 0 ? 3 : 0)) % 3) * 0.12);
  const col = mapleCols[(r * 3 + (side > 0 ? 2 : 0)) % mapleCols.length], s = 0.34 + ((r * 5) % 3) * 0.06;
  world.add(mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.4, 5), mat(0x5a3d2a), x, p.y + 0.2, p.z));
  world.add(mesh(new THREE.IcosahedronGeometry(s, 0), mat(col), x, p.y + 0.42 + s * 0.6, p.z));
}
const boats = [];
for (const [x, z] of [[-2.4, 7.2], [2.9, 9.5]]) {
  const g = new THREE.Group();
  g.add(mesh(new THREE.BoxGeometry(0.7, 0.14, 0.26), mat(0x8a5a36), 0, 0.07, 0));
  g.add(mesh(new THREE.BoxGeometry(0.03, 0.5, 0.03), mat(0x5a3d2a), 0, 0.35, 0));
  g.add(mesh(new THREE.BoxGeometry(0.02, 0.34, 0.3), mat(0xf4ecd8), 0.02, 0.4, 0.02));
  g.position.set(x, -0.45, (ROWS - 1) / 2 + z - 6); world.add(g); boats.push(g);
}
const seaGeo = new THREE.PlaneGeometry(40, 16, 40, 16); seaGeo.rotateX(-Math.PI / 2);
const seaMat = new THREE.MeshStandardMaterial({ color: 0x3f8fc0, roughness: 0.35, metalness: 0.15, flatShading: true });
const sea = new THREE.Mesh(seaGeo, seaMat); sea.position.set(0, -0.45, (ROWS - 1) / 2 + 9.5); sea.receiveShadow = true; world.add(sea);
const seaBase = seaGeo.attributes.position.array.slice();

// ---------- building meshes ----------
const TYPES = ['spring', 'inn', 'shop', 'foot', 'pine', 'pagoda'];
const SW = { spring: '#5fd1cf', inn: '#e8dcc0', shop: '#d0603e', foot: '#b8895a', pine: '#3f7a45', pagoda: '#d9452f' };
const TALL = { inn: 2, pagoda: 3 };
function roof(w, d, h, col) { const g = new THREE.ConeGeometry(Math.SQRT1_2 * 1, 1, 4); g.rotateY(Math.PI / 4); const m = mesh(g, mat(col)); m.scale.set(w, h, d); return m; }
function makeBuilding(type, seed = 0) {
  const g = new THREE.Group();
  if (type === 'spring') {
    const rockM = mat(0x8b8a86);
    for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2; const s = 0.1 + ((seed * 7 + i * 13) % 5) * 0.018; g.add(mesh(new THREE.DodecahedronGeometry(s), rockM, Math.cos(a) * 0.36, 0.06, Math.sin(a) * 0.36)); }
    const w = mesh(new THREE.CylinderGeometry(0.33, 0.33, 0.06, 14), waterMat, 0, 0.05, 0, false); g.add(w);
  } else if (type === 'inn') {
    g.add(mesh(new THREE.BoxGeometry(0.78, 0.42, 0.62), mat(0xeadfc6), 0, 0.21, 0));

    $('rsB').textContent = T.best(best);
    $('rsN').textContent = isBest ? T.newBest : '';
    $('rsT').textContent = T.stat(placed, T.lvNames[Math.min(level, T.lvNames.length) - 1]);
    $('rsTap').textContent = T.again;
    $('result').classList.add('on');
  }, 700);
}

// ---------- input ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(x, y) {
  ndc.set(x / W * 2 - 1, -(y / H) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects([beach, ...terrs], false)[0];
  if (!hit || hit.object === beach) return null;
  const c = Math.round(hit.point.x + (COLS - 1) / 2);
  if (c < 0 || c >= COLS) return null;
  return { c, r: hit.object.userData.r };
}
let downInfo = null;
cv.addEventListener('pointerdown', (e) => {
  initAudio();
  if (phase !== 'play' || !sel) return;
  const cell = pick(e.clientX, e.clientY);
  const onGhost = cell && ghostCell && cell.c === ghostCell.c && cell.r === ghostCell.r && preview;
  downInfo = { id: e.pointerId, onGhost, moved: false };
  if (cell) setGhost(cell);
});
cv.addEventListener('pointermove', (e) => {
  if (!downInfo || downInfo.id !== e.pointerId || phase !== 'play') return;
  const cell = pick(e.clientX, e.clientY);
  if (cell && (!ghostCell || cell.c !== ghostCell.c || cell.r !== ghostCell.r)) { downInfo.moved = true; setGhost(cell); }
});
const up = (e) => {
  if (!downInfo || downInfo.id !== e.pointerId) return;
  const d = downInfo; downInfo = null;
  if (phase === 'play' && d.onGhost && !d.moved && preview) doBuild();
};
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', (e) => { if (downInfo && downInfo.id === e.pointerId) downInfo = null; });
function setGhost(cell) {
  const changed = !ghostCell || cell.c !== ghostCell.c || cell.r !== ghostCell.r;
  ghostCell = cell; updPreview();
  if (changed) { if (preview) tick(preview.total); else thunk(0, 120, 0.06); }
}
$('title').addEventListener('pointerdown', () => { initAudio(); $('title').classList.remove('on'); newGame(); });
$('result').addEventListener('pointerdown', () => { if (performance.now() < overAt + 700) return; $('result').classList.remove('on'); newGame(); });

// ---------- overlay drawing ----------
function drawOverlay(time) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  if (!preview || !ghostCell || phase !== 'play') return;
  const { c, r } = ghostCell;
  const g = toScreen(topOf(c, r, sel));
  ctx.lineCap = 'round'; ctx.font = `900 15px system-ui, -apple-system, "Hiragino Sans", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const dash = (time / 40) % 16;
  for (const p of preview.parts) {
    if (p.self) continue;
    const b = grid[p.r][p.c]; const s = toScreen(topOf(p.c, p.r, b.t));
    ctx.setLineDash([]); ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(g.x, g.y); ctx.lineTo(s.x, s.y); ctx.stroke();
    ctx.strokeStyle = p.v > 0 ? '#b6ff8c' : '#ff8070'; ctx.lineWidth = 4;
    ctx.setLineDash([9, 6]); ctx.lineDashOffset = -dash;
    ctx.beginPath(); ctx.moveTo(g.x, g.y); ctx.lineTo(s.x, s.y); ctx.stroke();
    label((p.v > 0 ? '+' : '') + p.v + (p.block ? ' ' + T.block : ''), s.x, s.y - 12, p.v > 0 ? '#3d7a1f' : '#a8382a');
  }
  ctx.setLineDash([]);
  if (preview.view) {
    const base = toScreen(topOf(c, r, sel));
    if (preview.view.has) {
      const s = toScreen(cellPos(c, -0.75));
      const grd = ctx.createLinearGradient(base.x, base.y, s.x, s.y); grd.addColorStop(0, 'rgba(255,230,120,0.95)'); grd.addColorStop(1, 'rgba(255,230,120,0.2)');
      ctx.strokeStyle = grd; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(s.x, s.y); ctx.stroke();
      label(`${T.view} +${preview.view.v}`, s.x, s.y, '#9a6a00');
    } else {
      const bb = preview.view.blocker; const s = toScreen(topOf(bb.c, bb.r, bb.t));
      ctx.strokeStyle = 'rgba(255,120,100,0.9)'; ctx.lineWidth = 3; ctx.setLineDash([3, 5]);
      ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(s.x, s.y); ctx.stroke(); ctx.setLineDash([]);
      label(T.noView, (base.x + s.x) / 2, (base.y + s.y) / 2, '#a8382a');
    }
  }
  // total badge
  const tot = preview.total, txt = (tot >= 0 ? '+' : '') + tot + (score + tot >= goal ? ' ★' : '');
  ctx.font = `900 24px system-ui, -apple-system, "Hiragino Sans", sans-serif`;
  const w = ctx.measureText(txt).width + 22, y = Math.max(96, g.y - 26) + Math.sin(time / 220) * 2;
  ctx.fillStyle = tot > 0 ? '#fff6cf' : tot < 0 ? '#ffd2c8' : '#ffffff'; ctx.strokeStyle = '#0006'; ctx.lineWidth = 2;
  rr(g.x - w / 2, y - 17, w, 34, 12); ctx.fill(); ctx.stroke();
  ctx.fillStyle = tot > 0 ? '#b05a00' : tot < 0 ? '#b02a1a' : '#666'; ctx.fillText(txt, g.x, y + 1);
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function label(t, x, y, col) {
  ctx.font = `900 14px system-ui, -apple-system, "Hiragino Sans", sans-serif`;
  const w = ctx.measureText(t).width + 12;
  ctx.fillStyle = '#ffffffee'; rr(x - w / 2, y - 11, w, 22, 8); ctx.fill();
  ctx.fillStyle = col; ctx.fillText(t, x, y + 1);
}

// ---------- loop ----------
let lastT = 0, puffClock = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ts - lastT) / 1000 || 0); lastT = ts;
  night += (nightTarget - night) * Math.min(1, dt * 0.8);
  updSky();
  // sea
  const pa = seaGeo.attributes.position.array, tt = ts / 1000;
  for (let i = 0; i < pa.length; i += 3) pa[i + 1] = seaBase[i + 1] + Math.sin(seaBase[i] * 0.9 + tt * 1.3) * 0.05 + Math.sin(seaBase[i + 2] * 1.4 - tt * 1.7) * 0.06;
  seaGeo.attributes.position.needsUpdate = true;
  boats.forEach((b, i) => { b.position.y = -0.42 + Math.sin(tt * 1.4 + i * 2) * 0.04; b.rotation.z = Math.sin(tt * 1.1 + i) * 0.08; b.position.x += dt * 0.05 * (i ? -1 : 1); if (b.position.x > 6) b.position.x = -6; if (b.position.x < -6) b.position.x = 6; });
  // anims
  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i]; a.t += dt / 0.38; const t = Math.min(1, a.t);
    const s = 1 + 2.4 * Math.pow(t - 1, 3) + 1.4 * Math.pow(t - 1, 2);
    a.g.scale.setScalar(Math.max(0.01, s));
    if (t >= 1) { a.g.scale.setScalar(1); anims.splice(i, 1); }
  }
  for (let i = hopping.length - 1; i >= 0; i--) {
    const h = hopping[i]; h.t += dt; const p = cellPos(h.b.c, h.b.r);
    if (h.t > 0) h.b.g.position.y = p.y + 0.08 + Math.sin(Math.min(1, h.t / 0.28) * Math.PI) * 0.16;
    if (h.t >= 0.28) { h.b.g.position.y = p.y + 0.08; hopping.splice(i, 1); }
  }
  // ghost bob
  for (const t of TYPES) if (ghosts[t].visible) { const p = cellPos(ghostCell.c, ghostCell.r); ghosts[t].position.y = p.y + 0.12 + Math.sin(ts / 200) * 0.04; }
  // steam
  puffClock += dt;
  if (buildings && puffClock > 0.12) {
    puffClock = 0;
    for (const b of buildings) if ((b.t === 'spring' || b.t === 'foot') && Math.random() < (b.t === 'spring' ? 0.6 : 0.25)) { const p = cellPos(b.c, b.r); emit(p.x, p.y + 0.18, p.z, b.t === 'spring' ? 1 : 0.6); }
  }
  for (const p of puffs) {
    if (!p.s.visible) continue;
    p.life += dt; const k = p.life / p.max;
    if (k >= 1) { p.s.visible = false; continue; }
    p.s.position.y += dt * 0.42; p.s.position.x += dt * p.vx * (0.6 + Math.sin(tt + p.max) * 0.4);
    const sc = (0.25 + k * 0.85) * p.big; p.s.scale.set(sc, sc, sc);
    p.s.material.opacity = Math.sin(Math.min(1, k * 1.3) * Math.PI) * 0.42 * (1 - night * 0.3);
  }
  renderer.render(scene, camera);
  drawOverlay(ts);
}
resize(); updSky(); updHud();
requestAnimationFrame(frame);
</script>
