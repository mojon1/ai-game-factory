<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ぐるぐる わたあめ屋台</title>
<style>
html, body, canvas, * { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #141a3a; }
canvas { display: block; width: 100vw; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
for (const t of ['contextmenu', 'selectstart', 'gesturestart']) addEventListener(t, (e) => e.preventDefault(), { passive: false });
const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };
const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';

const TXT = {
  ja: {
    title: 'ぐるぐる わたあめ屋台',
    how1: 'ざらめをタップして機械に入れ、',
    how2: '指でぐるぐる回して わたあめを集めよう',
    how3: '点線の大きさ・色の順で「わたす」',
    start: 'タップでスタート',
    hint: '砂糖をタップ → 指でぐるぐる回して集める',
    serve: 'わたす',
    score: 'てん', best: 'ベスト', guest: 'お客',
    fluffy: 'ふわっ', dense: 'ぎゅっ…', tear: 'ちぎれる！', scrape: 'ガリッ！',
    sizes: ['小', '中', '大', '特大'],
    great: 'すばらしい！', good: 'いいね！', ok: 'まあまあ', bad: 'うーん…',
    perfect: 'ぴったり！', quick: 'はやわざ', small: 'ちいさい', big: 'おおきい', order: '色がちがう', hard: 'かたい',
    endTitle: '店じまい', total: 'こよいの売上', newBest: 'ベスト更新！', again: 'タップでもう一度',
    colors: ['ピンク', 'みずいろ', 'レモン', 'メロン'],
    rank: ['見習い', 'わたあめ屋', '名人', '伝説の職人'],
  },
  en: {
    title: 'Cotton Candy Swirl',
    how1: 'Tap a sugar jar to feed the machine,',
    how2: 'then swirl your finger to gather the floss.',
    how3: 'Match the dashed size and color order, then Serve.',
    start: 'Tap to start',
    hint: 'Tap sugar → swirl your finger to gather',
    serve: 'Serve',
    score: 'pts', best: 'Best', guest: 'Guest',
    fluffy: 'Fluffy!', dense: 'Dense…', tear: 'Tearing!', scrape: 'Scrape!',
    sizes: ['S', 'M', 'L', 'XL'],
    great: 'Wonderful!', good: 'Nice!', ok: 'Okay', bad: 'Hmm…',
    perfect: 'Perfect!', quick: 'Quick', small: 'too small', big: 'too big', order: 'wrong colors', hard: 'too dense',
    endTitle: 'Closing Time', total: "Tonight's sales", newBest: 'New best!', again: 'Tap to play again',
    colors: ['Pink', 'Sky', 'Lemon', 'Melon'],
    rank: ['Apprentice', 'Candy Maker', 'Master', 'Legend'],
  },
};
const T = TXT[LANG] || TXT.en;

const COLORS = ['#ff8cc6', '#7fd3ff', '#ffe36a', '#9df08c'];
const COLORS_DEEP = ['#e05a9e', '#3fa6e0', '#e8b92c', '#4fc25a'];
const SIZES = [0.17, 0.22, 0.27, 0.31];
const PLAN = [ // [layers, sizeIdx]
  [1, 0], [1, 1], [2, 1], [1, 2], [2, 2], [3, 2], [2, 3], [3, 3],
];
const NIGHT = PLAN.length;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 360, H = 640, DPR = 1;
let L = {}; // layout

function resize() {
  W = Math.max(1, innerWidth || 360); H = Math.max(1, innerHeight || 640);
  DPR = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const hud = 44;
  const custH = Math.max(96, Math.min(150, H * 0.2));
  const barH = 92;
  const top = hud + custH + 6, bot = H - barH - 6;
  const R = Math.max(40, Math.min(W / 2 - 12, (bot - top) / 2));
  L = { hud, custTop: hud, custH, barH, R, cx: W / 2, cy: (top + bot) / 2, barY: H - barH };
  const n = activeJars();
  const jw = Math.min(70, (W - 140 - 8 * (n - 1)) / n);
  L.jars = [];
  for (let i = 0; i < n; i++) L.jars.push({ x: 14 + i * (jw + 8), y: L.barY + 12, w: jw, h: barH - 24, c: i });
  L.serve = { x: W - 118, y: L.barY + 16, w: 104, h: barH - 32 };
}
addEventListener('resize', resize);

// ---------- audio ----------
let AC = null, hum = null, whoosh = null, grind = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const master = AC.createGain(); master.gain.value = 0.8; master.connect(AC.destination);
    AC.m = master;
    // machine hum
    const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 62;
    const o2 = AC.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 124.5;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260;
    const g = AC.createGain(); g.gain.value = 0;
    o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(master); o.start(); o2.start();
    hum = { g, o, lp };
    const nb = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    AC.noise = nb;
    const mk = (type, f, q) => {
      const s = AC.createBufferSource(); s.buffer = nb; s.loop = true;
      const bp = AC.createBiquadFilter(); bp.type = type; bp.frequency.value = f; bp.Q.value = q;
      const gg = AC.createGain(); gg.gain.value = 0; s.connect(bp); bp.connect(gg); gg.connect(master); s.start();
      return { g: gg, f: bp };
    };
    whoosh = mk('bandpass', 1400, 0.8);
    grind = mk('highpass', 2600, 0.7);
  } catch (e) { AC = null; }
}
function setGain(node, v, tc = 0.06) { if (AC && node) try { node.g.gain.setTargetAtTime(v, AC.currentTime, tc); } catch (e) {} }
function tone(f, dur, type = 'sine', vol = 0.12, delay = 0, slide = 0) {
  if (!AC) return;
  try {
    const t = AC.currentTime + delay;
    const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + dur);
    const g = AC.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(AC.m); o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
function noiseBurst(dur, f0, f1, vol = 0.15) {
  if (!AC) return;
  try {
    const t = AC.currentTime;
    const s = AC.createBufferSource(); s.buffer = AC.noise;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2;
    bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(bp); bp.connect(g); g.connect(AC.m); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  } catch (e) {}
}

// ---------- state ----------
let phase = 'title', phaseT = 0;
let best = 0, total = 0, guestIdx = 0, order = null, results = [];
let spinner = { c: 0, amt: 0, spin: 0 };
let winds = [], guestT = 0, streak = 0, faceDeck = [];
let strands = [], crumbs = [], pops = [], rim = new Float32Array(72 * 4);
let candy = null;
let ptr = { down: false, id: null, x: 0, y: 0, lx: 0, ly: 0, speed: 0, hist: [] };
let hintT = 0, popCD = 0, serveAnim = null, reaction = null;
let audioLevels = { cap: 0, scrape: 0 };
let newBest = false;

addEventListener('message', (e) => {
  if (e.data && e.data.agf === 'loaded' && e.data.data && typeof e.data.data.best === 'number') best = e.data.data.best;
});
signal('load');

function activeJars() { return 3 + (phase !== 'title' && guestIdx >= 4 ? 1 : 0); }
function rnd(a, b) { return a + Math.random() * (b - a); }
let orng = Math.random;
function seeded(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = (orng() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

const FACES = [
  { skin: '#ffd9b8', hair: '#3a2a22', acc: 'bow', accC: '#ff6fa8' },
  { skin: '#f6cfa7', hair: '#cfcfd6', acc: 'glasses', accC: '#333' },
  { skin: '#ffe0c4', hair: '#5b3a1e', acc: 'cap', accC: '#3c7be0' },
  { skin: '#ffffff', hair: '#ffffff', acc: 'fox', accC: '#e33c3c' },
  { skin: '#f3c9a0', hair: '#1d1d2a', acc: 'band', accC: '#ffffff' },
  { skin: '#ffdcc0', hair: '#9a4b2a', acc: 'flower', accC: '#ffd23f' },
  { skin: '#eebd93', hair: '#2b2b2b', acc: 'none', accC: '' },
  { skin: '#ffe4cc', hair: '#e8b04a', acc: 'bow', accC: '#61c0ff' },
];

function makeOrder(i) {
  const [n, si] = PLAN[i];
  const pool = shuffle([0, 1, 2].concat(i >= 4 ? [3] : []));
  if (i >= 4 && !pool.slice(0, n).includes(3) && orng() < 0.6) pool.unshift(3);
  const layers = pool.slice(0, n);
  return { layers, size: SIZES[si], si, face: faceDeck[i % faceDeck.length], enter: 0 };
}
function volForR(r) { const s = (r - 0.05) / 0.055; return s * s; }
function rForVol(v) { return 0.05 + 0.055 * Math.sqrt(Math.max(0, v)); }

function startNight() {
  phase = 'play'; phaseT = 0; total = 0; guestIdx = 0; results = []; newBest = false; streak = 0;
  orng = seeded((Math.random() * 1e9) | 0);
  faceDeck = shuffle(FACES.slice());
  hintT = 5; nextGuest(true);
  signal('start');
}
function nextGuest(first) {
  order = makeOrder(guestIdx);
  order.limit = 14 + 7 * order.layers.length + 4 * order.si; guestT = 0; winds = [];
  candy = { layers: [], vol: 0, amt: 0, fw: 0, x: 0, y: 0, has: false };
  strands = []; spinner.amt = 0; rim.fill(0);
  resize();
  if (!first) noiseBurst(0.3, 600, 300, 0.05);
}

function stickPos() {
  return { x: candy.x, y: candy.y };
}

// ---------- input ----------
function local(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function inRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault(); initAudio();
  const p = local(e);
  if (phase === 'title') { startNight(); return; }
  if (phase === 'end') { if (phaseT > 0.7) startNight(); return; }
  if (phase !== 'play' || serveAnim) return;
  for (const j of L.jars) if (inRect(p, j)) { pour(j.c); return; }
  if (inRect(p, L.serve)) { if (candy.vol > 0.3) serve(); return; }
  const dx = (p.x - L.cx) / L.R, dy = (p.y - L.cy) / L.R;
  if (Math.hypot(dx, dy) < 1.25 && ptr.id === null) {
    ptr.down = true; ptr.id = e.pointerId; ptr.x = ptr.lx = p.x; ptr.y = ptr.ly = p.y; ptr.speed = 0; ptr.hist = [];
    candy.x = p.x; candy.y = p.y; candy.has = true;
    try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  }
}, { passive: false });
cv.addEventListener('pointermove', (e) => {
  if (e.pointerId !== ptr.id) return;
  const p = local(e); ptr.x = p.x; ptr.y = p.y;
}, { passive: false });
const up = (e) => { if (e.pointerId === ptr.id) { ptr.down = false; ptr.id = null; } };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

function pour(c) {
  if (spinner.amt > 0 && spinner.c !== c) spinner.amt = Math.min(spinner.amt, 1.2);
  spinner.c = c; spinner.amt = Math.min(spinner.amt + 8, 16);
  noiseBurst(0.45, 3000, 900, 0.12);
  tone(520 + c * 60, 0.12, 'triangle', 0.05);
  jarBump[c] = 1;
}
const jarBump = [0, 0, 0, 0];

// ---------- evaluation ----------
function mergedLayers() {
  const tot = candy.vol || 1;
  let ls = candy.layers.map((l) => ({ c: l.c, v: l.v }));
  const merge = (arr) => { const o = []; for (const l of arr) { if (o.length && o[o.length - 1].c === l.c) o[o.length - 1].v += l.v; else o.push({ ...l }); } return o; };
  ls = merge(ls);
  ls = merge(ls.filter((l) => l.v / tot >= 0.12));
  return ls;
}
function evaluate() {
  const rc = rForVol(candy.vol);
  const q = rc / order.size, err = Math.abs(q - 1);
  const sizeP = Math.max(0, 1 - Math.max(0, err - 0.04) / 0.3) * 50;
  const ls = mergedLayers().map((l) => l.c);
  const want = order.layers;
  let layerP = 0, mul = 1;
  if (ls.length === want.length && ls.every((c, i) => c === want[i])) layerP = 30;
  else {
    let pre = 0; while (pre < ls.length && pre < want.length && ls[pre] === want[pre]) pre++;
    layerP = Math.round(20 * pre / want.length * (ls.length > want.length ? 0.7 : 1));
    mul = 0.4 + 0.4 * pre / want.length;
  }
  const fl = candy.amt > 0 ? candy.fw / candy.amt : 0.55;
  const fluffP = Math.max(0, Math.min(1, (fl - 0.6) / 0.38)) * 20;
  const sc = Math.round((sizeP + fluffP) * mul + layerP);
  let why = '';
  if (sizeP < 40) why = q < 1 ? T.small : T.big;
  else if (layerP < 30) why = T.order;
  else if (fluffP < 12) why = T.hard;
  return { sc, why, q, fl };
}
function serve() {
  const ev = evaluate();
  ev.bonus = ev.sc >= 40 ? Math.round(15 * Math.max(0, 1 - guestT / order.limit)) : 0;
  const perfect = Math.abs(ev.q - 1) <= 0.04 && !ev.why;
  streak = perfect ? streak + 1 : 0;
  const pb = perfect ? 10 * Math.min(3, streak) : 0;
  ev.sc += ev.bonus + pb;
  results.push(ev.sc); total += ev.sc;
  serveAnim = { t: 0, x0: candy.x, y0: candy.y, ev };
  ptr.down = false; ptr.id = null;
  const base = ev.sc - ev.bonus - pb;
  const label = perfect ? (streak > 1 ? `${T.perfect} ×${streak}` : T.perfect) : base >= 92 ? T.great : base >= 72 ? T.good : base >= 40 ? T.ok : T.bad;
  const extra = [pb ? `${T.perfect} +${pb}` : '', ev.bonus ? `${T.quick} +${ev.bonus}` : ''].filter(Boolean).join(' / ');
  reaction = { label, sc: ev.sc, why: ev.why || extra, t: 0, perfect };
  if (perfect) for (let k = 0; k < 24; k++) { const a = k / 24 * Math.PI * 2; crumbs.push({ x: candy.x, y: candy.y, vx: Math.cos(a) * L.R * 2.2, vy: Math.sin(a) * L.R * 2.2, life: 0.7, c: order.layers[k % order.layers.length], s: 3 }); }
  const notes = base >= 92 ? [784, 988, 1175, 1568] : base >= 72 ? [659, 784, 988] : base >= 40 ? [587, 659] : [392, 330];
  notes.forEach((f, i) => tone(f, 0.35, 'sine', 0.1, 0.08 * i));
}

// ---------- update ----------
function update(dt) {
  phaseT += dt;
  for (let i = 0; i < 4; i++) jarBump[i] = Math.max(0, jarBump[i] - dt * 4);
  spinner.spin += dt * (spinner.amt > 0 ? 14 : 3);
  if (phase !== 'play') { setGain(hum, 0); setGain(whoosh, 0); setGain(grind, 0); return; }
  hintT -= dt; popCD -= dt;
  const R = L.R, cx = L.cx, cy = L.cy;
  if (order.enter < 1) order.enter = Math.min(1, order.enter + dt * 2.5);

  // emit floss
  if (spinner.amt > 0) {
    const rate = 6; // units/s
    const use = Math.min(spinner.amt, rate * dt);
    spinner.amt -= use;
    const n = Math.round(use / 0.035 + Math.random() * 0.5);
    for (let i = 0; i < n; i++) strands.push({ th: Math.random() * Math.PI * 2, r: 0.13, c: spinner.c, a: use / Math.max(1, n), len: rnd(0.4, 1.1), vr: rnd(0.27, 0.36) * (1 + 0.06 * guestIdx), wob: Math.random() * 6 });
  }
  setGain(hum, spinner.amt > 0 ? 0.07 : 0.015, 0.15);
  if (hum) try { hum.o.frequency.setTargetAtTime(spinner.amt > 0 ? 66 : 50, AC.currentTime, 0.3); } catch (e) {}

  // pointer speed (R/s)
  if (ptr.down) {
    // speed over a short window, so uneven touch events don't spike it
    ptr.hist.push({ t: clock, d: Math.hypot(ptr.x - ptr.lx, ptr.y - ptr.ly) / R });
    while (ptr.hist.length > 1 && clock - ptr.hist[0].t > 0.25) ptr.hist.shift();
    const span = Math.max(0.08, clock - ptr.hist[0].t);
    let dist = 0; for (const h of ptr.hist) dist += h.d;
    ptr.speed = dist / span;
    ptr.lx = ptr.x; ptr.ly = ptr.y;
    candy.x = ptr.x; candy.y = ptr.y;
  } else ptr.speed *= Math.max(0, 1 - dt * 6);

  const s = ptr.speed;
  let fluff = s < 0.25 ? 0.55 : s < 1.0 ? 0.55 + (s - 0.25) / 0.75 * 0.45 : s < 5.5 ? 1 : 0.85;
  const tearing = s > 7;
  const rc = rForVol(candy.vol);
  const sx = (candy.x - cx) / R, sy = (candy.y - cy) / R;
  const sd = Math.hypot(sx, sy);
  const active = ptr.down && candy.has;
  let capAmt = 0;

  for (let i = strands.length - 1; i >= 0; i--) {
    const st = strands[i];
    const om = 1.5 * (0.55 + 0.45 * 0.13 / Math.max(0.13, st.r));
    st.th += om * dt;
    st.r += st.vr * dt * (0.8 + 0.4 * Math.sin(st.wob + st.th * 2));
    if (st.r >= 0.985) {
      const bin = (((st.th % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2)) / (Math.PI * 2) * 72 | 0;
      rim[bin * 4 + st.c] += st.a;
      strands.splice(i, 1); continue;
    }
    if (active) {
      const mid = st.th + st.len * 0.5;
      const px = Math.cos(mid) * st.r, py = Math.sin(mid) * st.r;
      if (Math.hypot(px - sx, py - sy) < rc + 0.06) {
        strands.splice(i, 1);
        const keep = tearing ? 0.4 : 1;
        addCandy(st.c, st.a * keep, fluff);
        capAmt += st.a;
        if (winds.length < 80) winds.push({ x: cx + px * R, y: cy + py * R, c: st.c, t: 0 });
        if (tearing && Math.random() < 0.5) crumbs.push({ x: candy.x, y: candy.y, vx: rnd(-1, 1) * R * 1.4, vy: rnd(-1, 1) * R * 1.4, life: 0.6, c: st.c, s: rnd(2, 4) });
      }
    }
  }

  // scraping on spinner / rim
  let scraping = false;
  if (active && candy.vol > 0) {
    const rcN = rForVol(candy.vol);
    if (sd < rcN + 0.12 || sd + rcN > 1.0) {
      scraping = true;
      const loss = Math.min(candy.vol, 2.6 * dt);
      removeCandy(loss);
      // scraped floss gets crushed: the outer layer loses fluffiness
      const top = candy.layers[candy.layers.length - 1];
      if (top) { const d = top.fw * 0.6 * dt; top.fw -= d; candy.fw -= d; }
      if (Math.random() < dt * 30) {
        const ang = Math.atan2(sy, sx) + (sd < rcN + 0.12 ? Math.PI : 0);
        crumbs.push({ x: candy.x + Math.cos(ang) * rcN * R, y: candy.y + Math.sin(ang) * rcN * R, vx: rnd(-1, 1) * R, vy: rnd(-1, 1) * R, life: 0.5, c: topColor(), s: rnd(2, 5) });
      }
      if (popCD <= 0) { addPop(T.scrape, '#ff6b6b'); popCD = 0.8; }
    }
  }
  // feedback pops
  if (active && capAmt > 0 && popCD <= 0) {
    if (tearing) { addPop(T.tear, '#ffb347'); popCD = 0.9; tone(1800, 0.05, 'square', 0.02); }
    else if (fluff >= 0.97 && Math.random() < 0.08) { addPop(T.fluffy, '#ffffff'); popCD = 1.4; }
    else if (fluff < 0.7 && Math.random() < 0.06) { addPop(T.dense, '#c9b8ff'); popCD = 1.4; }
  }
  audioLevels.cap += (Math.min(1, capAmt / Math.max(dt, 0.01) / 4) - audioLevels.cap) * Math.min(1, dt * 8);
  audioLevels.scrape = scraping ? 1 : 0;
  setGain(whoosh, audioLevels.cap * 0.22);
  if (whoosh) try { whoosh.f.frequency.setTargetAtTime(900 + Math.min(4, s) * 500, AC.currentTime, 0.05); } catch (e) {}
  setGain(grind, audioLevels.scrape * 0.07, 0.03);

  for (let i = crumbs.length - 1; i >= 0; i--) {
    const c = crumbs[i]; c.life -= dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= 0.94; c.vy *= 0.94;
    if (c.life <= 0) crumbs.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > 1) pops.splice(i, 1); }

function fluffCircle(x, y, r, seed, bumps, amp) {
  ctx.beginPath();
  const n = bumps;
  for (let i = 0; i <= n; i++) {
    const a = i / n * Math.PI * 2;
    const k = 1 + amp * Math.sin(seed * 1.7 + i * 2.3) * 0.5 + amp * 0.5;
    const a2 = a - Math.PI / n;
    const px = x + Math.cos(a) * r * (1 - amp * 0.3), py = y + Math.sin(a) * r * (1 - amp * 0.3);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.quadraticCurveTo(x + Math.cos(a2) * r * k, y + Math.sin(a2) * r * k, px, py);
  }
  ctx.fill();
}

  ctx.textAlign = 'right'; ctx.font = `600 14px ${FONT}`; ctx.fillStyle = '#cfd3ff';
  ctx.fillText(`${T.best} ${best}`, W - 14, L.hud / 2);
  // guest dots
  const n = NIGHT, dw = 14, x0 = W / 2 - (n - 1) * dw / 2;
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = i < guestIdx ? (results[i] >= 85 ? '#ff7db5' : results[i] >= 65 ? '#ffd36a' : '#9aa0c8') : i === guestIdx ? '#fff' : 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.arc(x0 + i * dw, L.hud / 2, i === guestIdx ? 5 : 4, 0, 7); ctx.fill();
  }
}

function drawTitle(t) {
  drawBackground(t);
  const cx = W / 2, cy = H * 0.42;
  // demo candy
  const r = Math.min(W, H) * 0.24;
  ctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 90; k++) {
    const rr2 = r * (0.5 + (k % 9) / 9 * 0.9), a = t * (1.2 - (k % 9) * 0.06) + k * 0.7;
    ctx.strokeStyle = COLORS[k % 3]; ctx.globalAlpha = 0.35; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(cx, cy, rr2, a, a + 0.5); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = COLORS[1]; fluffCircle(cx, cy, r * 0.62, 3, 18, 0.16);
  ctx.fillStyle = COLORS[0]; fluffCircle(cx, cy, r * 0.42, 7, 14, 0.16);
  ctx.fillStyle = '#c48a4e'; ctx.beginPath(); ctx.arc(cx, cy, 5, 0, 7); ctx.fill();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  fitText(T.title, W - 32, 34, 900);
  ctx.fillText(T.title, cx, H * 0.14);
  ctx.fillStyle = '#e7e9ff';
  for (const [i, s] of [T.how1, T.how2, T.how3].entries()) { fitText(s, W - 36, 16, 600); ctx.fillText(s, cx, H * 0.7 + i * 26); }
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 4);
  ctx.fillStyle = '#ffd36a'; fitText(T.start, W - 40, 22, 800); ctx.fillText(T.start, cx, H * 0.88);
  ctx.globalAlpha = 1;
  if (best > 0) { ctx.fillStyle = '#cfd3ff'; ctx.font = `600 14px ${FONT}`; ctx.fillText(`${T.best} ${best}`, cx, H * 0.94); }
}

function drawEnd(t) {
  drawBackground(t);
  ctx.fillStyle = 'rgba(10,12,30,0.5)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff'; fitText(T.endTitle, W - 40, 30, 900); ctx.fillText(T.endTitle, W / 2, H * 0.16);
  ctx.fillStyle = '#cfd3ff'; ctx.font = `600 16px ${FONT}`; ctx.fillText(T.total, W / 2, H * 0.27);
  ctx.fillStyle = '#ffd36a'; ctx.font = `900 56px ${FONT}`; ctx.fillText(`${total}`, W / 2, H * 0.35);
  const rank = total >= 1000 ? 3 : total >= 860 ? 2 : total >= 680 ? 1 : 0;
  ctx.fillStyle = '#ff9ccc'; fitText(T.rank[rank], W - 40, 24, 800); ctx.fillText(T.rank[rank], W / 2, H * 0.44);
  ctx.fillStyle = newBest ? '#ffd36a' : '#cfd3ff'; ctx.font = `700 16px ${FONT}`;
  ctx.fillText(newBest ? T.newBest : `${T.best} ${best}`, W / 2, H * 0.5);
  // results row
  const n = results.length, cw = Math.min(40, (W - 40) / n);
  for (let i = 0; i < n; i++) {
    const x = W / 2 + (i - (n - 1) / 2) * cw, y = H * 0.6;
    const v = results[i];
    ctx.fillStyle = v >= 85 ? '#ff7db5' : v >= 65 ? '#ffd36a' : '#9aa0c8';
    fluffCircle(x, y, cw * 0.38, i * 5, 10, 0.18);
    ctx.fillStyle = '#fff'; ctx.font = `700 12px ${FONT}`; ctx.fillText(`${v}`, x, y + cw * 0.38 + 14);
  }
  if (phaseT > 0.7) {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 4);
    ctx.fillStyle = '#fff'; fitText(T.again, W - 40, 20, 800); ctx.fillText(T.again, W / 2, H * 0.82);
    ctx.globalAlpha = 1;
  }
}

function drawPlay(t) {
  drawBackground(t);
  drawCustomer(t);
  drawBowl(t);
  // clip to bowl for floss
  ctx.save(); ctx.beginPath(); ctx.arc(L.cx, L.cy, L.R, 0, 7); ctx.clip();
  drawStrands();
  ctx.restore();
  drawSpinner(t);
  if (serveAnim) {
    const k = Math.min(1, serveAnim.t / 0.6), e = k * k * (3 - 2 * k);
    const tx = W * 0.3, ty = L.custTop + L.custH * 0.58 + 30;
    drawCandyAt(serveAnim.x0 + (tx - serveAnim.x0) * e, serveAnim.y0 + (ty - serveAnim.y0) * e, 1 - 0.45 * e, 1);
  } else if (candy.has) {
    drawCandyAt(candy.x, candy.y, 1, 1);
    drawTargetRings(candy.x, candy.y);
  } else {
    // show target ring hint in the band
    const a = Math.PI * 0.75, d = 0.6 * L.R;
    drawTargetRings(L.cx + Math.cos(a) * d, L.cy + Math.sin(a) * d);
  }
  for (const c of crumbs) { ctx.fillStyle = COLORS[c.c]; ctx.globalAlpha = Math.max(0, c.life * 1.6); ctx.beginPath(); ctx.arc(c.x, c.y, c.s, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const p of pops) {
    ctx.globalAlpha = 1 - p.t; ctx.fillStyle = p.color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `800 18px ${FONT}`; ctx.fillText(p.text, p.x, p.y - p.t * 30);
  }
  ctx.globalAlpha = 1;
  drawBar();
  drawHUD();
  if (hintT > 0) {
    ctx.globalAlpha = Math.min(1, hintT);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    const s = fitText(T.hint, W - 40, 16, 700);
    const tw = ctx.measureText(T.hint).width;
    rr(W / 2 - tw / 2 - 12, L.barY - 40, tw + 24, 30, 15); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(T.hint, W / 2, L.barY - 25);
    ctx.globalAlpha = 1;
  }
}

let last = 0, clock = 0;
function frame(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - (last || ts)) / 1000)); last = ts;
  clock += dt;
  if (W < 2 || H < 2) resize();
  try {
    update(dt);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (phase === 'title') drawTitle(clock);
    else if (phase === 'end') drawEnd(clock);
    else drawPlay(clock);
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
