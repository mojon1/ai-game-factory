<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ツイン・ペインター</title>
<style>
  html,body{margin:0;height:100%;background:#05030f;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const cv = document.getElementById('c'), g = cv.getContext('2d');
  let W, H, DPR;
  function resize() {
    DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR; g.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize); resize();

  const COLS = 40, ROWS = 24, TIME = 60;
  let state = 'title', grid, ships, voids, stars, timeLeft = TIME, painted = 0, best = 0, flash = 0, popups = [];
  const starsBg = Array.from({ length: 120 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 1.6 + 0.3, p: Math.random() * 6 }));

  function reset() {
    grid = new Uint8Array(COLS * ROWS); // 0=空 1=シアン 2=マゼンタ
    ships = [
      { x: 6, y: 12, dx: 1, dy: 0, col: '#3ff0ff', id: 1, stun: 0, t: 0, trail: [] },
      { x: COLS - 7, y: 12, dx: -1, dy: 0, col: '#ff4fd8', id: 2, stun: 0, t: 0, trail: [] },
    ];
    voids = [];
    addVoid(); addVoid();
    stars = []; timeLeft = TIME; painted = 0; popups = [];
    state = 'play';
  }
  function addVoid() {
    voids.push({ x: COLS / 2 + (Math.random() - 0.5) * 10, y: 3 + Math.random() * (ROWS - 6), vx: (Math.random() < 0.5 ? -1 : 1) * (4 + Math.random() * 2), vy: (Math.random() < 0.5 ? -1 : 1) * (3 + Math.random() * 2), r: 1.4 });
  }

  // ---------- 入力 ----------
  let want = null;
  const keyDir = { ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0], ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1] };
  addEventListener('keydown', (e) => {
    if (keyDir[e.code]) { want = keyDir[e.code]; e.preventDefault(); }
    if ((e.code === 'Space' || e.code === 'Enter') && state !== 'play') { e.preventDefault(); start(); }
  });
  let drag = null;
  cv.addEventListener('pointerdown', (e) => {
    if (state !== 'play') { start(); return; }
    drag = { x: e.clientX, y: e.clientY, used: false };
  });
  cv.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.hypot(dx, dy) > 24) { want = Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)]; drag = { x: e.clientX, y: e.clientY, used: true }; }
  });
  addEventListener('pointerup', (e) => {
    if (drag && !drag.used && state === 'play') {
      // タップ: シアン機から見た方向へ
      const v = view(), s = ships[0];
      const dx = e.clientX - (v.ox + (s.x + 0.5) * v.s), dy = e.clientY - (v.oy + (s.y + 0.5) * v.s);
      want = Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
    }
    drag = null;
  });
  function start() { reset(); sfx(440, 0.15); }

  let ac;
  function sfx(f, d, type = 'sine', vol = 0.05) {
    try {
      ac ||= new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), gn = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, ac.currentTime); o.frequency.exponentialRampToValueAtTime(f * 1.5, ac.currentTime + d);
      gn.gain.value = vol; gn.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
      o.connect(gn).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }

  // ---------- 更新 ----------
  function paint(x, y, id) {
    if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return;
    grid[y * COLS + x] = id;
  }
  function update(dt) {
    popups = popups.filter((p) => (p.t -= dt) > 0);
    flash = Math.max(0, flash - dt * 3);
    if (state !== 'play') return;
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; state = 'over'; best = Math.max(best, percent()); sfx(220, 0.6, 'triangle', 0.08); return; }
    // 後半は虚無が増える
    if (voids.length < 2 + Math.floor((TIME - timeLeft) / 15)) addVoid();
    // 船の移動（シアン=入力どおり、マゼンタ=左右反転）
    ships.forEach((s, i) => {
      if (want) {
        const dx = i === 0 ? want[0] : -want[0], dy = want[1];
        if (!(dx === -s.dx && dy === -s.dy) || (s.dx === 0 && s.dy === 0)) { s.ndx = dx; s.ndy = dy; }
      }
      if (s.stun > 0) { s.stun -= dt; return; }
      s.t += dt;
      const step = 1 / 11;
      while (s.t >= step) {
        s.t -= step;
        if (s.ndx !== undefined) { s.dx = s.ndx; s.dy = s.ndy; }
        const nx = s.x + s.dx, ny = s.y + s.dy;
        if (nx >= 0 && ny >= 0 && nx < COLS && ny < ROWS) { s.x = nx; s.y = ny; }
        paint(s.x, s.y, s.id);
        s.trail.push({ x: s.x, y: s.y, t: 0.4 });
      }
      s.trail = s.trail.filter((p) => (p.t -= dt) > 0);
    });
    want = null;
    // 虚無（塗りを消しながら跳ね回る）
    for (const v of voids) {
      v.x += v.vx * dt; v.y += v.vy * dt;
      if (v.x < v.r || v.x > COLS - v.r) { v.vx *= -1; v.x = Math.max(v.r, Math.min(COLS - v.r, v.x)); }
      if (v.y < v.r || v.y > ROWS - v.r) { v.vy *= -1; v.y = Math.max(v.r, Math.min(ROWS - v.r, v.y)); }
      for (let yy = Math.floor(v.y - v.r); yy <= v.y + v.r; yy++) for (let xx = Math.floor(v.x - v.r); xx <= v.x + v.r; xx++) {
        if (Math.hypot(xx + 0.5 - v.x, yy + 0.5 - v.y) < v.r) paint(xx, yy, 0);
      }
      for (const s of ships) {
        if (s.stun <= 0 && Math.hypot(s.x + 0.5 - v.x, s.y + 0.5 - v.y) < v.r + 0.5) {
          s.stun = 1.5; flash = 1; sfx(120, 0.3, 'sawtooth', 0.06);
          popups.push({ x: s.x, y: s.y, text: '停止!', col: '#ff6b6b', t: 1 });
          // 周りの塗りを少し失う
          for (let k = 0; k < 14; k++) paint(s.x + ((Math.random() * 7) | 0) - 3, s.y + ((Math.random() * 7) | 0) - 3, 0);
        }
      }
    }
    // 星（取ると周囲をまとめて塗る）
    if (stars.length < 2 && Math.random() < dt * 0.5) stars.push({ x: 2 + ((Math.random() * (COLS - 4)) | 0), y: 2 + ((Math.random() * (ROWS - 4)) | 0), t: 0 });
    stars = stars.filter((st) => {
      st.t += dt;
      for (const s of ships) if (s.x === st.x && s.y === st.y || Math.hypot(s.x - st.x, s.y - st.y) < 1.2) {
        for (let yy = -3; yy <= 3; yy++) for (let xx = -3; xx <= 3; xx++) if (xx * xx + yy * yy <= 10) paint(st.x + xx, st.y + yy, s.id);
        sfx(880, 0.25, 'triangle'); popups.push({ x: st.x, y: st.y, text: 'スターボム!', col: '#ffe066', t: 1 });
        return false;
      }
      return st.t < 9;
    });
    painted = percent();
  }
  function percent() { let n = 0; for (let i = 0; i < grid.length; i++) if (grid[i]) n++; return Math.round((n / grid.length) * 1000) / 10; }
  function rank(p) { return p >= 70 ? 'S' : p >= 55 ? 'A' : p >= 40 ? 'B' : p >= 25 ? 'C' : 'D'; }

  // ---------- 描画 ----------
  function view() {
    const top = 46, s = Math.min((W - 16) / COLS, (H - top - 10) / ROWS);
    return { s, ox: (W - COLS * s) / 2, oy: top + (H - top - 10 - ROWS * s) / 2 };
  }
  function draw(t) {
    g.fillStyle = '#05030f'; g.fillRect(0, 0, W, H);
    for (const st of starsBg) { g.globalAlpha = 0.4 + 0.4 * Math.sin(t * 2 + st.p); g.fillStyle = '#cfd8ff'; g.fillRect(st.x * W, st.y * H, st.s, st.s); }
    g.globalAlpha = 1;
    if (!grid) { grid = new Uint8Array(COLS * ROWS); ships = []; voids = []; stars = []; }
    const v = view(), s = v.s;
    // フィールド
    g.strokeStyle = 'rgba(140,150,255,.25)'; g.lineWidth = 1; g.strokeRect(v.ox - 1, v.oy - 1, COLS * s + 2, ROWS * s + 2);
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const c = grid[y * COLS + x];
      if (!c) continue;
      g.fillStyle = c === 1 ? 'rgba(63,240,255,.55)' : 'rgba(255,79,216,.55)';
      g.fillRect(v.ox + x * s + 0.5, v.oy + y * s + 0.5, s - 1, s - 1);
    }
    // 中心線（鏡の軸）
    g.setLineDash([4, 6]); g.strokeStyle = 'rgba(255,255,255,.15)';
    g.beginPath(); g.moveTo(v.ox + COLS * s / 2, v.oy); g.lineTo(v.ox + COLS * s / 2, v.oy + ROWS * s); g.stroke(); g.setLineDash([]);
    // 星
    for (const st of stars) {
      const cx = v.ox + (st.x + 0.5) * s, cy = v.oy + (st.y + 0.5) * s, r = s * (0.7 + 0.15 * Math.sin(t * 6));
      g.save(); g.translate(cx, cy); g.rotate(t * 2); g.fillStyle = '#ffe066'; g.shadowColor = '#ffe066'; g.shadowBlur = 14;
      g.beginPath(); for (let i = 0; i < 10; i++) { const a = (i / 10) * Math.PI * 2, rr = i % 2 ? r * 0.45 : r; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } g.fill(); g.restore();
    }
    // 虚無
    for (const vd of voids) {
      const cx = v.ox + vd.x * s, cy = v.oy + vd.y * s, r = vd.r * s;
      const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r * 1.6);
      gr.addColorStop(0, '#000'); gr.addColorStop(0.55, '#000'); gr.addColorStop(0.7, 'rgba(160,90,255,.9)'); gr.addColorStop(1, 'rgba(160,90,255,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, r * 1.6, 0, 7); g.fill();
    }
    // 船
    for (const sh of ships) {
      for (const p of sh.trail) { g.globalAlpha = p.t * 1.5; g.fillStyle = sh.col; g.fillRect(v.ox + p.x * s + s * 0.3, v.oy + p.y * s + s * 0.3, s * 0.4, s * 0.4); }
      g.globalAlpha = sh.stun > 0 && Math.floor(t * 10) % 2 ? 0.3 : 1;
      const cx = v.ox + (sh.x + 0.5) * s, cy = v.oy + (sh.y + 0.5) * s, ang = Math.atan2(sh.dy, sh.dx);
      g.save(); g.translate(cx, cy); g.rotate(ang); g.fillStyle = sh.col; g.shadowColor = sh.col; g.shadowBlur = 16;
      g.beginPath(); g.moveTo(s * 0.9, 0); g.lineTo(-s * 0.6, -s * 0.6); g.lineTo(-s * 0.3, 0); g.lineTo(-s * 0.6, s * 0.6); g.closePath(); g.fill();
      g.restore(); g.globalAlpha = 1;
    }
    for (const p of popups) {
      g.globalAlpha = Math.min(1, p.t * 2); g.fillStyle = p.col; g.font = 'bold 15px sans-serif'; g.textAlign = 'center';
      g.fillText(p.text, v.ox + (p.x + 0.5) * s, v.oy + p.y * s - (1 - p.t) * 20);
    }
    g.globalAlpha = 1;
    if (flash) { g.fillStyle = `rgba(255,60,60,${flash * 0.15})`; g.fillRect(0, 0, W, H); }
    // HUD
    g.textBaseline = 'middle'; g.font = 'bold 17px sans-serif';
    g.textAlign = 'left'; g.fillStyle = '#e8e6ff'; g.fillText(`塗り率 ${painted.toFixed(1)}%`, 12, 22);
    const bw = Math.min(200, W * 0.3); g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(W / 2 - bw / 2, 16, bw, 12);
    g.fillStyle = '#3ff0ff'; g.fillRect(W / 2 - bw / 2, 16, (bw * timeLeft) / TIME, 12);
    g.textAlign = 'right'; g.fillStyle = timeLeft < 10 ? '#ff6b6b' : '#e8e6ff'; g.fillText(`残り ${Math.ceil(timeLeft)} 秒`, W - 12, 22);

    if (state !== 'play') {
      g.fillStyle = 'rgba(5,3,15,.75)'; g.fillRect(0, 0, W, H);
      g.textAlign = 'center';
      if (state === 'title') {
        g.font = `bold ${Math.min(38, W / 12)}px sans-serif`; g.fillStyle = '#3ff0ff'; g.fillText('ツイン・ペインター', W / 2, H / 2 - 70);
        g.font = '16px sans-serif'; g.fillStyle = '#e8e6ff';
        g.fillText('2機の宇宙船を同時に操って、60秒で宇宙を塗りつぶせ！', W / 2, H / 2 - 24);
        g.fillStyle = '#ff4fd8'; g.fillText('マゼンタ機は左右が「鏡写し」で動く', W / 2, H / 2 + 4);
        g.fillStyle = '#b9a4ff'; g.fillText('紫の虚無は塗りを消す。ぶつかると停止。★で一気に塗れる', W / 2, H / 2 + 32);
        g.font = 'bold 17px sans-serif'; g.fillStyle = '#ffe066'; g.fillText('Space / クリック / タップでスタート', W / 2, H / 2 + 76);
        g.font = '13px sans-serif'; g.fillStyle = '#9a98c0'; g.fillText('操作: 矢印キー / WASD / スワイプ / タップした方向', W / 2, H - 24);
      } else {
        g.font = 'bold 30px sans-serif'; g.fillStyle = '#e8e6ff'; g.fillText('タイムアップ！', W / 2, H / 2 - 60);
        g.font = 'bold 64px sans-serif'; g.fillStyle = '#ffe066'; g.fillText(rank(painted), W / 2, H / 2 + 4);
        g.font = '18px sans-serif'; g.fillStyle = '#e8e6ff'; g.fillText(`塗り率 ${painted.toFixed(1)}%　ベスト ${best.toFixed(1)}%`, W / 2, H / 2 + 56);
        g.font = '15px sans-serif'; g.fillStyle = '#9a98c0'; g.fillText('Space / タップでもう一度', W / 2, H / 2 + 92);
      }
    }
  }

  let last = 0;
  function frame(ts) {
    const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
    update(dt); draw(ts / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
