const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';
const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };

// ---------- save ----------
let best = 0;
addEventListener('message', (e) => { if (e.data && e.data.agf === 'loaded' && e.data.data) { best = e.data.data.best || 0; } });

// ---------- audio ----------

  else if (g === 2) [523, 659].forEach((f, i) => tone(f, 0.16, 'triangle', 0.18, i * 0.08));

// ---------- canvas ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

addEventListener('resize', resize);

// ---------- rng ----------

const ri = (a, b) => Math.floor(rr(a, b + 1));

// ---------- layout ----------
const L = {};
function computeLayout() {

// ---------- questions ----------
const SLOTS = [['count1'], ['angle', 'length'], ['glassCyl'], ['time'], ['count2'], ['area', 'length'], ['glassOdd'], ['angle', 'time', 'area'], ['count3'], ['countRed']];
let PLAN = SLOTS.map((s) => s[0]);

}
const BEAN_COLORS = [['#c98a3a', '#e8b765'], ['#d8352a', '#f2776a'], ['#2b2522', '#4b403a'], ['#7f9b3c', '#a8c25a']];

    else if (kind === 'count3') { n = ri(110, 210); q.min = 0; q.max = 300; }

    q.type = 'angle'; q.truth = ri(12, 168); q.min = 0; q.max = 180; q.step = 1; q.unit = T.unitDeg; q.text = T.qAngle;
    q.rot = rr(0, Math.PI * 2); q.lenA = rr(0.75, 1); q.lenB = rr(0.75, 1);
  } else if (kind.startsWith('glass')) {
    q.type = 'glass'; q.min = 0; q.max = 100; q.step = 1; q.unit = T.unitPct; q.text = T.qGlass;
    q.shape = kind === 'glassCyl' ? 'cyl' : (rnd() < 0.5 ? 'cone' : 'flask');
    q.h = q.shape === 'cyl' ? rr(0.2, 0.85) : rr(0.35, 0.8);
    q.truth = Math.round(volFrac(q.shape, q.h) * 100);

}
// glass profile: radius at height y (0 bottom..1 top), normalized
function prof(shape, y) {

}

      const nr = Math.min(q.nRed, q.beans.length);
      for (let i = 0; i < q.beans.length; i++) q.beans[idx[i]].red = i < nr;
      q.beans.forEach((b) => { b.col = b.red ? BEAN_COLORS[1] : (rnd() < 0.5 ? BEAN_COLORS[0] : BEAN_COLORS[2]); });
      q.truth = nr;

// ---------- state ----------
let state = 'title', Q = null, qi = 0, total = 0, results = [], tState = 0, stateT = 0, lastT = 0, endAt = 0, newBest = false;
let answerTime = 0; const ANSWER_LIMIT = 14;
let hintShown = 0, dragging = null, lastClickVal = null, floatVal = 0, pressBtn = null, fx = [];
let reveal = null;

function startGame() {

}

}

// ---------- input ----------

cv.addEventListener('pointerdown', (e) => {

  if (state !== 'look') return;

  if (inRect(x, y, L.goX, L.btnY, L.goW, L.btnH)) { pressBtn = 'go'; return; }
  if (inRect(x, y, L.minusX, L.btnY, L.pmW, L.btnH)) { pressBtn = 'minus'; setVal(Q.val - Q.step); return; }
  if (inRect(x, y, L.plusX, L.btnY, L.pmW, L.btnH)) { pressBtn = 'plus'; setVal(Q.val + Q.step); return; }

// ---------- update ----------

    pb(L.goX, L.goW, T.go, pressBtn === 'go', true);
    ctx.globalAlpha = 1;
    if (active) { const p = Math.max(0, 1 - answerTime / ANSWER_LIMIT); ctx.fillStyle = p < 0.3 ? '#e2553a' : '#c9b9a6'; rrect(20, L.panelTop + 8, (W - 40) * p, 4, 2); ctx.fill(); }
  } else if (state === 'reveal' && reveal.done) {
    const r = reveal.r;
    fitText(`${T.truth} ${fmt(q, q.truth)}${q.unit}　${T.you} ${fmt(q, q.val)}${q.unit}`, W / 2, L.btnY + 10, W - 40, 16, '700', 'center', '#5a4a40');
    if (stateT - reveal.doneAt > 0.7) fitText(T.next, W / 2, L.btnY + 42, W - 40, 15, '600', 'center', '#8a7360');
  }
}
function drawGradeAt(x, y) {
  const r = reveal.r, t = stateT - reveal.doneAt;
  const sc = t < 0.25 ? 0.4 + (t / 0.25) * 0.8 : t < 0.4 ? 1.2 - (t - 0.25) / 0.15 * 0.2 : 1;
  const lbl = [T.perfect, T.close, T.ok, T.miss][r.grade];
  const col = ['#f5a623', '#ff7a59', '#2a8fc0', '#8a7360'][r.grade];
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.textBaseline = 'middle';
  ctx.font = `900 34px ${FONT}`; const lw = ctx.measureText(lbl).width;
  ctx.font = `800 24px ${FONT}`; const pw = ctx.measureText(`+${r.s}`).width;
  const tw = lw + 14 + pw, x0 = -tw / 2;
  ctx.textAlign = 'left'; ctx.font = `900 34px ${FONT}`; ctx.fillStyle = col; ctx.fillText(lbl, x0, 0);
  ctx.font = `800 24px ${FONT}`; ctx.fillStyle = '#3b2f2a'; ctx.fillText(`+${r.s}`, x0 + lw + 14, 2);
  ctx.restore();
}
function drawGrade() {
  if (state !== 'reveal' || !reveal.done) return;
  if (reveal.timeout) fitText(T.timeout, W / 2, L.panelTop - 14, 160, 14, '700', 'center', '#e2553a');
}
function drawFx() { for (const f of fx) { ctx.globalAlpha = Math.max(0, 1 - f.t / f.life); ctx.fillStyle = f.c; ctx.fillRect(f.x - f.s / 2, f.y - f.s / 2, f.s, f.s); } ctx.globalAlpha = 1; }

function drawTitle(now) {
  drawBG();
  // decorative beans
  const t = now / 1000;
  for (let i = 0; i < 26; i++) { const x = (i * 97 % W), y = 60 + ((i * 53 + t * 18 * (1 + i % 3)) % (H - 80)); drawBean(x, y, i + t * 0.5, 8, BEAN_COLORS[i % 4], 0.35); }
  ctx.textBaseline = 'middle';
  fitText(T.title, W / 2, H * 0.3, W - 32, 40, '900', 'center', '#3b2f2a');
  fitText(T.sub, W / 2, H * 0.3 + 44, W - 32, 16, '700', 'center', '#e2553a');
  // sample: plate with beans + number line icon
  ctx.fillStyle = '#fffaf0'; ctx.beginPath(); ctx.arc(W / 2, H * 0.52, 52, 0, 6.283); ctx.fill(); ctx.strokeStyle = '#d9c7a8'; ctx.lineWidth = 2; ctx.stroke();
  for (let i = 0; i < 14; i++) { const a = i * 2.4, d = 10 + (i * 7) % 34; drawBean(W / 2 + Math.cos(a) * d, H * 0.52 + Math.sin(a) * d, a, 6, BEAN_COLORS[0]); }
  fitText('?', W / 2 + 62, H * 0.52 - 40, 40, 32, '900', 'center', '#2a8fc0');
  fitText(T.how1, W / 2, H * 0.67, W - 28, 15, '600', 'center', '#5a4a40');
  fitText(T.how2, W / 2, H * 0.67 + 26, W - 28, 15, '600', 'center', '#5a4a40');
  if (best > 0) fitText(`${T.best} ${best}`, W / 2, H * 0.67 + 60, W - 28, 15, '700', 'center', '#8a7360');
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 4);
  fitText(T.tap, W / 2, H * 0.86, W - 28, 20, '800', 'center', '#ff7a59');
  ctx.globalAlpha = 1;
}
function drawEnd(now) {
  drawBG(); ctx.textBaseline = 'middle';
  fitText(T.result, W / 2, H * 0.12, W - 40, 20, '700', 'center', '#8a7360');
  fitText(`${total}`, W / 2, H * 0.22, W - 40, 64, '900', 'center', '#3b2f2a');
  fitText(`/ 1000 ${T.score}`, W / 2, H * 0.22 + 42, W - 40, 15, '600', 'center', '#8a7360');
  fitText(newBest ? T.newBest : `${T.best} ${best}`, W / 2, H * 0.22 + 70, W - 40, 18, '800', 'center', newBest ? '#e2553a' : '#5a4a40');
  const rank = T.ranks[Math.min(4, Math.floor(total / 200))];
  fitText(rank, W / 2, H * 0.22 + 102, W - 40, 22, '800', 'center', '#2a8fc0');
  if (results.length) {
    const avg = results.reduce((a, r) => a + (r.g - r.t) / Math.max(r.t, r.q.step * 5), 0) / results.length;
    const p = Math.round(Math.abs(avg) * 100);
    fitText(p < 5 ? T.tendEven : avg > 0 ? T.tendOver(p) : T.tendUnder(p), W / 2, H * 0.22 + 130, W - 30, 15, '700', 'center', '#5a4a40');
  }
  // list
  const top = H * 0.22 + 152, rowH = Math.min(30, (H * 0.86 - top) / 10);
  results.forEach((r, i) => {
    const y = top + i * rowH + rowH / 2;
    const col = ['#f5a623', '#ff7a59', '#2a8fc0', '#a89786'][r.grade];
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(34, y, 6, 0, 6.283); ctx.fill();
    const name = T.short[r.q.nRed != null ? 'red' : r.q.type];
    fitText(name, 48, y, W * 0.32, 14, '600', 'left', '#5a4a40');
    fitText(`${fmt(r.q, r.g)} → ${fmt(r.q, r.t)}${r.q.unit}`, W - 70, y, W * 0.3, 13, '700', 'right', '#5a4a40');
    fitText(`${r.s}`, W - 22, y, 44, 14, '800', 'right', col);
  });
  if (now - endAt > 700) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(now / 250); fitText(T.again, W / 2, H - 30, W - 40, 18, '800', 'center', '#ff7a59'); ctx.globalAlpha = 1; }
  drawFx();
}
function draw(now) {
  if (state === 'title') { drawTitle(now); return; }
  if (state === 'end') { drawEnd(now); return; }
  drawBG(); drawHUD();
  ctx.textBaseline = 'middle';
  fitText(Q.text, W / 2, L.qy, W - 24, 20, '800', 'center', '#3b2f2a');
  if (Q.type === 'count') drawCount(); else if (Q.type === 'angle') drawAngle(); else if (Q.type === 'glass') drawGlass(); else if (Q.type === 'time') drawTime(); else if (Q.type === 'length') drawLength(); else drawArea();
  drawPanel(); drawGrade(); drawFx();
  if (state === 'look' && qi === 0 && hintShown < 1 && stateT < 6) { ctx.globalAlpha = Math.min(1, (6 - stateT)); fitText(T.hint, W / 2, L.panelTop - 16, W - 20, 14, '700', 'center', '#8a7360'); ctx.globalAlpha = 1; }
}

function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - (lastT || now)) / 1000)); lastT = now;
  computeLayout();
  if (state !== 'title' && state !== 'end') update(dt); else { for (const f of fx) { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 600 * dt; } fx = fx.filter((f) => f.t < f.life); }
  draw(now);
  requestAnimationFrame(frame);
}
computeLayout(); resize();
requestAnimationFrame(frame);
</script>
