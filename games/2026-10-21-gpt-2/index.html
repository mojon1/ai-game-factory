<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>かすめて星花火</title><style>html,body{margin:0;width:100%;height:100dvh;overflow:hidden;background:#14253a;overscroll-behavior:none}*{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}canvas{display:block;width:100vw;height:100dvh}</style><canvas></canvas><script>
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),en=LANG==='en',T=en?{title:'Grazing Fireworks',a:'Drag to move. Skim close to the pink shots.',b:'Five sparks make a firework clear the sky.',c:'Two hits end the night.',start:'Tap to start',score:'Blooms ',lives:'Lives ',charge:'Sparks ',hint:'Drag the blue star · close calls charge it',result:'Your night sky',again:'Tap to play again',burst:'Bloom!',hit:'Ouch! Keep moving'}:{title:'かすめて星花火',a:'指で動く。桃色の弾のそばを通ろう。',b:'火花5つで花火。弾がぜんぶ消える。',c:'2回ぶつかったらおしまい。',start:'タップでスタート',score:'花火 ',lives:'残り ',charge:'火花 ',hint:'指で青い星を動かす・弾の近くで火花',result:'あなたの夜空',again:'タップでもう一度',burst:'ひらいた！',hit:'ぶつかった！離れよう'};
const c=document.querySelector('canvas'),g=c.getContext('2d');let scale=1,ox=0,oy=0;function resize(){const w=Math.max(1,innerWidth),h=Math.max(1,innerHeight),d=Math.min(2,devicePixelRatio||1);c.width=w*d;c.height=h*d;scale=Math.min(w/360,h/640);ox=(w-360*scale)/2;oy=(h-640*scale)/2;g.setTransform(d*scale,0,0,d*scale,d*ox,d*oy)}addEventListener('resize',resize);resize();for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});
const signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};let ac;function tone(f){try{ac??=new AudioContext();ac.resume();const o=ac.createOscillator(),v=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*.65,ac.currentTime+.12);v.gain.setValueAtTime(.035,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.2);o.connect(v).connect(ac.destination);o.start();o.stop(ac.currentTime+.21)}catch{}}
let state='title',time=0,age=0,endTime=0,px=180,py=490,tx=180,ty=490,pointer=null,shots=[],warnings=[],particles=[],charge=0,score=0,lives=2,inv=0,spawn=.4,n=0,note='',nt=0,trail=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function start(){state='play';age=0;px=tx=180;py=ty=490;pointer=null;shots=[];warnings=[];particles=[];charge=score=0;lives=2;inv=0;spawn=.4;n=0;note='';trail=[];signal('start')}
function target(e){tx=clamp((e.clientX-ox)/scale,24,336);ty=clamp((e.clientY-oy)/scale,128,572)}
c.addEventListener('pointerdown',e=>{if(pointer!==null)return;tone(240);if(state==='title'){start();return}if(state==='end'){if(time-endTime>.7)start();return}pointer=e.pointerId;target(e);c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(e.pointerId===pointer&&state==='play')target(e)});function release(e){if(e.pointerId===pointer){pointer=null;tx=px;ty=py}}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);
function firework(){charge=0;score++;shots=[];warnings=[];spawn=.8;note=T.burst;nt=1.4;tone(740);for(let j=0;j<32;j++){const a=j*Math.PI/16;particles.push({x:px,y:py,vx:Math.cos(a)*100,vy:Math.sin(a)*100,life:1.5,color:j%2?'#e8be70':'#8cd4da'})}}
function update(dt){age+=dt;inv=Math.max(0,inv-dt);nt-=dt;const dx=tx-px,dy=ty-py,d=Math.hypot(dx,dy),step=Math.min(d,300*dt);if(d){px+=dx/d*step;py+=dy/d*step}trail.push({x:px,y:py});if(trail.length>20)trail.shift();
spawn-=dt;if(spawn<=0&&warnings.length+shots.length<45){const side=n%4;let x,y;if(side===0){x=75+(n*37)%210;y=112}else if(side===1){x=285-(n*19)%210;y=112}else{x=side===2?18:342;y=200+(n*43)%240}warnings.push({x,y,ax:px,ay:py,left:.75});n++;spawn=Math.max(.4,1-score*.06)}
for(const w of warnings){w.left-=dt;if(w.left<=0){const dx=w.ax-w.x,dy=w.ay-w.y,d=Math.hypot(dx,dy)||1,speed=96+Math.min(55,score*7);shots.push({x:w.x,y:w.y,vx:dx/d*speed,vy:dy/d*speed,grazed:false})}}warnings=warnings.filter(w=>w.left>0);
let burst=false;for(const b of shots){b.x+=b.vx*dt;b.y+=b.vy*dt;const d=Math.hypot(px-b.x,py-b.y);if(d<15&&inv===0){lives--;inv=1.2;shots=[];warnings=[];charge=0;spawn=1;note=T.hit;nt=1.4;tone(100);if(lives<=0){state='end';endTime=time;signal('end',{score})}break}if(d>=15&&d<34&&!b.grazed&&inv===0){b.grazed=true;charge++;tone(400+charge*50);if(charge>=5){burst=true;break}}}if(burst)firework();shots=shots.filter(b=>b.x>-30&&b.x<390&&b.y>80&&b.y<670);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0)}
function text(s,x,y,size=18,col='#edf1de'){g.fillStyle=col;g.textAlign='center';g.font='600 '+size+'px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif';g.save();g.translate(x,y);const w=g.measureText(s).width;if(w>326)g.scale(326/w,1);g.fillText(s,0,0);g.restore()}
function circle(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}function star(x,y,r,col){g.fillStyle=col;g.beginPath();for(let j=0;j<8;j++){const a=j*Math.PI/4-Math.PI/2,rr=j%2?r*.4:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath();g.fill()}
function draw(){g.clearRect(-ox/scale,-oy/scale,c.width/scale,c.height/scale);g.fillStyle='#14253a';g.fillRect(0,0,360,640);for(let j=0;j<30;j++)circle(15+(j*79)%330,70+(j*53)%510,1,'#476078');
if(state==='title'){text(T.title,180,108,29);for(let j=0;j<12;j++){const a=j*Math.PI/6;star(180+Math.cos(a)*65,270+Math.sin(a)*65,5,'#e8be70')}star(180,270,17,'#8cd4da');text(T.a,180,420,16);text(T.b,180,453,16);text(T.c,180,486,16);text(T.start,180,578,21);return}
text(T.score+score,75,35,17);text(T.lives+lives,280,35,17);if(state==='end'){text(T.result,180,157,30);text(T.score+score,180,235,28);for(let j=0;j<16;j++){const a=j*Math.PI/8;star(180+Math.cos(a)*78,365+Math.sin(a)*78,5,'#e8be70')}text(T.again,180,581,21);return}
text(T.charge+charge+'/5',180,76,18);if(nt>0)text(note,180,103,15);
for(const w of warnings){g.strokeStyle='#966785';g.lineWidth=1;g.setLineDash([5,7]);g.beginPath();g.moveTo(w.x,w.y);g.lineTo(w.ax,w.ay);g.stroke();g.setLineDash([]);circle(w.x,w.y,6+(1-w.left/.75)*8,'#a06b8b')}
for(const b of shots){circle(b.x,b.y,7,b.grazed?'#d5b47b':'#ee9aaf');circle(b.x,b.y,2,'#ffe7d9')}
g.strokeStyle='#638f9e';g.lineWidth=2;g.beginPath();trail.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.stroke();g.strokeStyle='#4c7785';g.lineWidth=1;g.beginPath();g.arc(px,py,33,0,7);g.stroke();if(inv===0||Math.floor(time*12)%2===0)star(px,py,11,'#8cd4da');
for(const p of particles){g.globalAlpha=Math.min(1,p.life);circle(p.x,p.y,3,p.color)}g.globalAlpha=1;if(age<4)text(T.hint,180,631,13)}
let last=0;function frame(ts){const dt=Math.min(.033,Math.max(0,(ts-last)/1000));last=ts;time+=dt;if(state==='play')update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
