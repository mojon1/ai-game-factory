<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>半歩のカウンター</title><style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overscroll-behavior:none;background:#22273d;color:#fff2d5;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:radial-gradient(ellipse,#484052,#22273d)}header{position:absolute;top:4%;left:6%;right:6%;display:flex;justify-content:space-between;font-size:17px}#status{position:absolute;top:12%;width:100%;text-align:center;font-size:19px}canvas{position:absolute;top:20%;left:0;width:100%;height:62%}#hint{position:absolute;bottom:6%;width:100%;text-align:center;font-size:14px}#cover{position:absolute;inset:0;padding:7%;background:#22273df2;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}#cover.hidden{display:none}h1{font-size:clamp(25px,7vw,35px)}p{font-size:17px;line-height:1.7;white-space:pre-line}
</style></head><body><div id="game"><header><span id="score"></span><span id="hp"></span></header><div id="status"></div><canvas></canvas><div id="hint"></div><div id="cover"></div></div><script>
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),words={ja:{title:'半歩のカウンター',intro:'赤い側からスワイプでかわす。\n金色の隙にタップで反撃。\n六回の反撃で勝利。三回被弾で負け。',start:'タップでスタート',again:'タップでもう一度',score:'反撃',hp:'体力',charge:'攻撃予告',combo:'二連撃・一発目',second:'二連撃・もう一回かわす',open:'今だ、タップ！',early:'まだ隙がない',hit:'被弾！',win:'一本、勝負あり！',lose:'参りました',best:'ベスト',newBest:'ベスト更新！',hint:'左右スワイプで移動・タップで反撃'},en:{title:'Half-Step Counter',intro:'Swipe away from the red side.\nTap during the golden opening.\nSix counters win; three hits lose.',start:'Tap to start',again:'Tap to play again',score:'Counters',hp:'Health',charge:'Incoming strike',combo:'Double strike: first',second:'Dodge the second strike',open:'Tap now!',early:'No opening yet',hit:'Hit!',win:'A clean finish!',lose:'Defeated',best:'Best',newBest:'New best!',hint:'Swipe to move; tap to counter'}};
const t=words[LANG==='ja'?'ja':'en'],$=x=>document.getElementById(x),cv=document.querySelector('canvas'),g=cv.getContext('2d'),cover=$('cover'),lanes=[100,260];
const signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};
for(const type of ['contextmenu','selectstart','gesturestart'])addEventListener(type,e=>e.preventDefault(),{passive:false});
let swing=0,strikeLane=0,effect='counter',remaining=1,chain=false;let mode='title',lane=0,target=0,hp=3,foe=6,phase='windup',timer=1.35,maxTimer=1.35,started=0,ended=0,last=0,flash=0,message=0,best=0,finger=null,down=null,ac=null;
function sound(f){try{if(!ac)return;const o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f;v.gain.setValueAtTime(.045,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.14);o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+.15)}catch{}}
function unlock(){try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch{}}
function overlay(title,body,action){cover.innerHTML='<h1>'+title+'</h1><p>'+body+'</p><p>'+action+'</p>';cover.classList.remove('hidden')}
function windup(){remaining=(foe===4||foe===2)?2:1;chain=remaining===2;phase='windup';maxTimer=foe>4?1.35:foe>2?1.05:.8;timer=maxTimer;target=lane}
function start(){lane=0;hp=3;foe=6;flash=0;swing=0;message=0;finger=null;windup();mode='play';started=performance.now();cover.classList.add('hidden');signal('start')}
function finish(win){mode='result';ended=performance.now();finger=null;const n=6-foe,improved=n>best;best=Math.max(n,best);signal('end',{score:n});overlay(win?t.win:t.lose,t.score+' '+n+'/6\n'+t.best+' '+best+'\n'+t.hp+' '+hp+'/3'+(improved?'\n'+t.newBest:''),t.again)}
function counter(){if(phase!=='open'){message=.6;return}foe--;effect='counter';sound(420+(6-foe)*40);flash=.3;if(foe<=0){finish(true);return}windup()}
$('game').addEventListener('pointerdown',e=>{e.preventDefault();unlock();if(mode==='title'||(mode==='result'&&performance.now()-ended>=700)){start();return}if(mode!=='play'||finger!==null)return;finger=e.pointerId;down={x:e.clientX,y:e.clientY};try{$('game').setPointerCapture(finger)}catch{}});
$('game').addEventListener('pointerup',e=>{if(e.pointerId!==finger)return;finger=null;if(mode!=='play')return;const dx=e.clientX-down.x;if(Math.abs(dx)>40){lane=dx>0?1:0;sound(180)}else counter()});
$('game').addEventListener('pointercancel',e=>{if(e.pointerId===finger)finger=null});
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d)}addEventListener('resize',resize);resize();
function update(dt){swing=Math.max(0,swing-dt);flash=Math.max(0,flash-dt);message=Math.max(0,message-dt);if(mode!=='play')return;timer-=dt;if(timer>0)return;if(phase==='windup'){swing=.28;strikeLane=target;if(lane===target){hp--;effect='hit';sound(90);flash=.35;if(hp<=0){finish(false);return}}if(remaining>1){remaining--;target=lane;maxTimer=.7;timer=.7;return}phase='open';timer=1.1}else windup()}
function draw(now){g.setTransform(cv.width/360,0,0,cv.height/400,0,0);g.clearRect(0,0,360,400);
g.strokeStyle='#87798e';g.lineWidth=2;g.strokeRect(35,20,290,350);g.beginPath();g.moveTo(180,20);g.lineTo(180,370);g.stroke();
for(let i=0;i<2;i++){g.fillStyle=mode==='play'&&phase==='windup'&&target===i?'#ba5b6877':'#58485d55';g.fillRect(lanes[i]-60,160,120,195)}
const ex=180,ey=94;g.fillStyle='#f2c4a2';g.beginPath();g.arc(ex,ey,27,0,7);g.fill();g.fillStyle=phase==='open'?'#f8d581':'#be6c83';g.fillRect(ex-30,ey+28,60,66);
g.fillStyle='#d8748c';for(const sx of [-1,1]){g.beginPath();g.arc(ex+sx*(phase==='open'?48:36),ey+48,18,0,7);g.fill()}
for(let i=0;i<6;i++){g.fillStyle=i<foe?'#e591a0':'#5f5367';g.fillRect(127+i*18,38,12,8)}
if(mode==='play'&&phase==='windup'){g.strokeStyle='#f3a3af';g.lineWidth=5;g.beginPath();g.arc(lanes[target],260,40,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-timer/maxTimer));g.stroke()}
if(mode==='play'&&phase==='open'){g.fillStyle='#f8d581';g.fillRect(90,187,180*Math.max(0,timer)/1.1,6)}const px=lanes[lane];g.fillStyle='#a9d9dc';g.beginPath();g.arc(px,294,18,0,7);g.fill();g.fillRect(px-22,312,44,40);g.fillStyle='#b8eef1';g.beginPath();g.arc(px-30,321,13,0,7);g.arc(px+30,321,13,0,7);g.fill();
if(swing>0){g.strokeStyle='#d8748c';g.lineWidth=16;g.beginPath();g.moveTo(180,142);g.lineTo(lanes[strikeLane],275);g.stroke();g.fillStyle='#ef99aa';g.beginPath();g.arc(lanes[strikeLane],275,20,0,7);g.fill()}if(flash>0){const fx=effect==='counter'?180:px,fy=effect==='counter'?125:295;g.strokeStyle=effect==='counter'?'#ffe5a6':'#ff8c99';g.lineWidth=5;g.beginPath();g.arc(fx,fy,35+(1-flash/.35)*15,0,7);g.stroke();if(effect==='counter'){g.beginPath();g.moveTo(px,285);g.lineTo(180,150);g.stroke()}}
$('score').textContent=t.score+' '+(6-foe)+'/6';$('hp').textContent=t.hp+' '+hp+'/3';$('status').textContent=mode==='play'?(message>0?t.early:phase==='open'?t.open:chain?(remaining>1?t.combo:t.second):t.charge+' '+(foe>4?1:foe>2?2:3)):'';$('hint').textContent=mode==='play'&&now-started<5000?t.hint:'';
}
function loop(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;update(dt);draw(now);requestAnimationFrame(loop)}
overlay(t.title,t.intro,t.start);requestAnimationFrame(loop);
</script></body></html>
