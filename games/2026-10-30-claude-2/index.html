<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>しゃぼん玉くぐり</title>
<style>

html, body { overscroll-behavior: none; margin: 0; height: 100%; overflow: hidden; background: #bfe6ff; }
canvas { display: block; width: 100vw; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
for (const t of ['contextmenu', 'selectstart', 'gesturestart']) addEventListener(t, (e) => e.preventDefault(), { passive: false });

const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const DICT = {
  ja: {
    title: 'しゃぼん玉くぐり',
    how: ['下の輪を長押しで しゃぼん玉をふくらませる', '指でなでて風を送り、つるした輪をくぐらせよう', '玉にさわると割れる。黒ずんできたら割れる合図'],
    tap: 'タップでスタート', cont: 'つづきから ステージ {n}',
    stage: 'ステージ', soapL: '石けん液',
    passed: 'くぐった！', chain: 'れんぞく！ 石けん液 +{n}',
    touch: 'さわると割れちゃう', over: 'ふくらませすぎ！', short: '石けん液が足りない',
    ground: '草にふれて割れた', thorn: 'とげで割れた', bird: '小鳥にあたった', rim: '輪のふちで割れた', tooBig: '大きすぎて輪を通れない',
    clear: 'ステージクリア！', left: 'のこりの石けん液 {n}', next: 'タップで次へ',
    fail: '石けん液がなくなった…', again: 'タップでもう一度',
    all: 'ぜんぶクリア！', total: 'あつめた星 {n} / {m}', best: 'ベスト {n}', newbest: 'ベスト更新！',
    names: ['はじめの庭', 'よこむきの輪', 'そよ風の日', 'ばらの枝', '小鳥の通り道', 'つむじ風'],
    hints: ['下の輪を長押し → はなす → 玉の下を指でなでて風を送ろう', 'たての輪は、横から風を送って通す', '風が左へ流れている。流れを使おう', '小さな輪は、小さな玉でないと通れない', '小鳥にあたると割れる。すきを見て', '風向きがくるくる変わる'],
  },
  en: {
    title: 'Bubble Through',
    how: ['Hold the wand at the bottom to blow a bubble', 'Stroke the air to make wind and float it through the hoops', "Touching pops it. Dark film means it's about to burst"],
    tap: 'Tap to start', cont: 'Continue: Stage {n}',
    stage: 'Stage', soapL: 'Soap',
    passed: 'Through!', chain: 'Chain! Soap +{n}',
    touch: 'Touching pops it', over: 'Blew too much!', short: 'Not enough soap',
    ground: 'Popped on the grass', thorn: 'Popped on a thorn', bird: 'Hit a bird', rim: 'Popped on the rim', tooBig: 'Too big for that hoop',
    clear: 'Stage clear!', left: 'Soap left {n}', next: 'Tap to continue',
    fail: 'Out of soap…', again: 'Tap to play again',
    all: 'All clear!', total: 'Stars {n} / {m}', best: 'Best {n}', newbest: 'New best!',
    names: ['First Garden', 'Sideways Hoop', 'Breezy Day', 'Rose Branch', 'Bird Lane', 'Whirlwind'],
    hints: ['Hold the wand → let go → stroke below the bubble to push it up', 'Push sideways through upright hoops', 'The breeze drifts left. Ride it', 'Small hoops need small bubbles', 'Birds pop bubbles. Wait for a gap', 'The wind keeps changing direction'],
  },
}[LANG] || null;
const L = DICT;
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';

// ---------- stages: gate [x(0..360), yFrac, angleDeg, halfGap] ----------
const STAGES = [
  { gates: [[180, .56, 0, 56], [115, .32, 0, 54]], wind: 0, gust: 0 },
  { gates: [[95, .56, 90, 48], [265, .42, 0, 46], [175, .22, 15, 46]], wind: 0, gust: 0 },
  { gates: [[275, .52, 90, 46], [95, .40, 0, 44], [235, .20, 0, 44]], wind: -26, gust: 12 },
  { gates: [[80, .40, 90, 30], [255, .24, 0, 46], [150, .64, 0, 42]], wind: 0, gust: 0, thorns: [[[385, .50], [300, .47], [215, .46]]] },
  { gates: [[180, .42, 0, 42], [60, .26, 90, 42], [300, .24, 90, 42]], wind: 0, gust: 0, birds: true },
  { gates: [[180, .60, 40, 42], [275, .37, -25, 38], [115, .15, 0, 36]], wind: 0, gust: 40, swirl: true, thorns: [[[-25, .47], [55, .45], [125, .46]]] },
];
const SOAP0 = 100, MINCOST = 4, RISE = 12;
const cost = (r) => 3 + r * r / 200;

// ---------- layout ----------
let W = 360, H = 640, DPR = 1, S = 1, WW = 360, WH = 640, OX = 0;
let groundY = 600, wandY = 580;
const bg = document.createElement('canvas');
function resize() {
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
  DPR = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.max(1, W * DPR | 0); cv.height = Math.max(1, H * DPR | 0);
  S = Math.max(0.01, Math.min(W / 360, H / 600));
  WW = W / S; WH = H / S; OX = (WW - 360) / 2;
  groundY = WH - 34; wandY = WH - 66;
  gridInit();
  buildBG();
  if (stage) layoutStage();
  if (wand) wand.x = clamp(wand.x, 30, WW - 30);
}

function buildBG() {
  bg.width = cv.width; bg.height = cv.height;
  const g = bg.getContext('2d');
  g.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);
  const sky = g.createLinearGradient(0, 0, 0, WH);
  sky.addColorStop(0, '#7cc6f2'); sky.addColorStop(.6, '#cdeeff'); sky.addColorStop(1, '#f2fbff');
  g.fillStyle = sky; g.fillRect(0, 0, WW, WH);
  const sun = g.createRadialGradient(WW - 60, 70, 4, WW - 60, 70, 140);
  sun.addColorStop(0, 'rgba(255,252,220,.95)'); sun.addColorStop(.18, 'rgba(255,246,200,.55)'); sun.addColorStop(1, 'rgba(255,246,200,0)');
  g.fillStyle = sun; g.fillRect(0, 0, WW, WH);
  g.fillStyle = 'rgba(255,255,255,.75)';
  const cloud = (x, y, s) => { for (const [dx, dy, r] of [[0, 0, 22], [24, -8, 26], [50, 0, 20], [24, 6, 22]]) { g.beginPath(); g.arc(x + dx * s, y + dy * s, r * s, 0, TAU); g.fill(); } };
  cloud(30, WH * .12, 1); cloud(WW * .55, WH * .08, .8); cloud(WW * .18, WH * .3, .6);
  // hills
  g.fillStyle = '#b6e3b0';
  g.beginPath(); g.moveTo(0, groundY - 40);
  for (let x = 0; x <= WW; x += 20) g.lineTo(x, groundY - 46 - Math.sin(x / 70) * 14 - Math.sin(x / 31) * 5);
  g.lineTo(WW, groundY); g.lineTo(0, groundY); g.fill();
  // fence
  g.fillStyle = '#f7efe0'; g.strokeStyle = '#d9c9a8'; g.lineWidth = 1;
  g.fillRect(0, groundY - 30, WW, 5); g.fillRect(0, groundY - 16, WW, 5);
  for (let x = 6; x < WW; x += 22) { g.beginPath(); g.moveTo(x, groundY); g.lineTo(x, groundY - 38); g.lineTo(x + 6, groundY - 44); g.lineTo(x + 12, groundY - 38); g.lineTo(x + 12, groundY); g.closePath(); g.fill(); g.stroke(); }
  // grass
  const gr = g.createLinearGradient(0, groundY - 6, 0, WH);
  gr.addColorStop(0, '#7ccf6a'); gr.addColorStop(1, '#4fa94a');
  g.fillStyle = gr; g.beginPath(); g.moveTo(0, WH);
  for (let x = 0; x <= WW; x += 6) g.lineTo(x, groundY - 2 - ((x * 7) % 11) * .8);
  g.lineTo(WW, WH); g.fill();
  g.strokeStyle = 'rgba(40,120,40,.5)'; g.lineWidth = 1.4;
  for (let x = 3; x < WW; x += 9) { g.beginPath(); g.moveTo(x, groundY + 6); g.quadraticCurveTo(x + 2, groundY - 4, x + 4 + (x % 5) - 2, groundY - 10 - (x % 7)); g.stroke(); }
  // little flowers
  for (let i = 0; i < 9; i++) { const x = (i * 47 + 13) % WW, y = groundY + 8 + (i * 13) % 18; g.fillStyle = ['#fff', '#ffd6e8', '#fff3a8'][i % 3]; for (let k = 0; k < 5; k++) { g.beginPath(); g.arc(x + Math.cos(k * 1.26) * 3, y + Math.sin(k * 1.26) * 3, 2.2, 0, TAU); g.fill(); } g.fillStyle = '#f5b400'; g.beginPath(); g.arc(x, y, 1.6, 0, TAU); g.fill(); }
}

// ---------- air (small fluid grid) ----------
const CELL = 20;
let NX = 2, NY = 2, U, V, U2, V2;
function gridInit() {
  NX = Math.ceil(WW / CELL) + 2; NY = Math.ceil(WH / CELL) + 2;
  U = new Float32Array(NX * NY); V = new Float32Array(NX * NY); U2 = new Float32Array(NX * NY); V2 = new Float32Array(NX * NY);
}
function samp(A, x, y) {
  let gx = x / CELL, gy = y / CELL;
  gx = clamp(gx, 0, NX - 1.001); gy = clamp(gy, 0, NY - 1.001);
  const i = gx | 0, j = gy | 0, fx = gx - i, fy = gy - j, k = j * NX + i;
  return (A[k] * (1 - fx) + A[k + 1] * fx) * (1 - fy) + (A[k + NX] * (1 - fx) + A[k + NX + 1] * fx) * fy;
}
function gridStep(dt) {
  for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
    const k = j * NX + i;
    const x = i * CELL - U[k] * dt, y = j * CELL - V[k] * dt;
    U2[k] = samp(U, x, y); V2[k] = samp(V, x, y);
  }
  const dec = Math.exp(-dt * .9);
  U.fill(0); V.fill(0);
  for (let j = 1; j < NY - 1; j++) for (let i = 1; i < NX - 1; i++) {
    const k = j * NX + i;
    U[k] = (U2[k] * .6 + (U2[k - 1] + U2[k + 1] + U2[k - NX] + U2[k + NX]) * .1) * dec;
    V[k] = (V2[k] * .6 + (V2[k - 1] + V2[k + 1] + V2[k - NX] + V2[k + NX]) * .1) * dec;
  }
}
function inject(x, y, vx, vy, R = 72, k0 = 1) {
  const i0 = Math.max(0, Math.floor((x - R) / CELL)), i1 = Math.min(NX - 1, Math.ceil((x + R) / CELL));
  const j0 = Math.max(0, Math.floor((y - R) / CELL)), j1 = Math.min(NY - 1, Math.ceil((y + R) / CELL));
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const d = Math.hypot(i * CELL - x, j * CELL - y);
    if (d >= R) continue;
    let w = 1 - d / R; w = w * (.4 + .6 * w) * k0;
    const k = j * NX + i;
    U[k] += (vx - U[k]) * w * .35; V[k] += (vy - V[k]) * w * .35;
  }
}
const amb = { x: 0, y: 0 };
function ambient(t) {
  amb.x = 0; amb.y = 0;
  if (!stage) { amb.y = -14; amb.x = Math.sin(t * .3) * 8; return; }
  const s = stage.def;
  amb.x = s.wind * (.75 + .25 * Math.sin(t * .9)) + s.gust * Math.sin(t * .45 + Math.sin(t * .21) * 2);
  if (s.swirl) amb.y = -12 * Math.cos(t * .37);
}

// ---------- audio ----------
let AC = null, master = null, noiseBuf = null, windG = null, blowSrc = null, blowG = null, blowF = null;
function audioInit() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = .55; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const ws = AC.createBufferSource(); ws.buffer = noiseBuf; ws.loop = true;
      const wf = AC.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 500; wf.Q.value = .7;
      windG = AC.createGain(); windG.gain.value = 0;
      ws.connect(wf); wf.connect(windG); windG.connect(master); ws.start();
      windG.f = wf;
    }
    if (AC.state !== 'running') AC.resume();
  } catch (e) {}
}
function tone(f, t0, dur, vol, type = 'sine', f2) {
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .006); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + .02);
  } catch (e) {}
}
function noise(t0, dur, vol, type, freq, q = 1) {
  if (!AC) return;
  try {
    const s = AC.createBufferSource(); s.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = AC.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t0, Math.random()); s.stop(t0 + dur + .02);
  } catch (e) {}
}
function sPop(r) { if (!AC) return; const t = AC.currentTime; const k = clamp(r / 50, .3, 1.3); noise(t, .07, .35 * k + .1, 'highpass', 2600 - k * 900); tone(1500 - k * 500, t, .05, .12, 'triangle', 300); }
function sChime(i) { if (!AC) return; const t = AC.currentTime; const n = [0, 2, 4, 7, 9, 12, 14, 16][i % 8]; const f = 659 * Math.pow(2, n / 12); tone(f, t, 1.4, .16); tone(f * 2, t, .8, .05); tone(f * 3.01, t, .4, .025); }
function sBoing(r) { if (!AC) return; const t = AC.currentTime; tone(340 - r * 2, t, .16, .09, 'sine', 520 - r * 2); }
function sRelease(r) { if (!AC) return; const t = AC.currentTime; tone(520 - r * 3, t, .18, .08, 'sine', 300 - r * 2); }
function sClear() { if (!AC) return; const t = AC.currentTime; [0, 4, 7, 12, 16].forEach((n, i) => tone(523 * Math.pow(2, n / 12), t + i * .11, 1.1, .12)); }
function sFail() { if (!AC) return; const t = AC.currentTime; [7, 4, 0].forEach((n, i) => tone(392 * Math.pow(2, n / 12), t + i * .18, .5, .09, 'triangle')); }
function blowStart() {
  if (!AC) return;
  try {
    blowSrc = AC.createBufferSource(); blowSrc.buffer = noiseBuf; blowSrc.loop = true;
    blowF = AC.createBiquadFilter(); blowF.type = 'bandpass'; blowF.frequency.value = 700; blowF.Q.value = 1.2;
    blowG = AC.createGain(); blowG.gain.value = 0; blowG.gain.setTargetAtTime(.1, AC.currentTime, .05);
    blowSrc.connect(blowF); blowF.connect(blowG); blowG.connect(master); blowSrc.start();
  } catch (e) {}
}
function blowStop() {
  if (!blowSrc) return;
  try { blowG.gain.setTargetAtTime(0, AC.currentTime, .03); blowSrc.stop(AC.currentTime + .2); } catch (e) {}
  blowSrc = null;
}

// ---------- film colour (thin-film interference) ----------
function film(d) {
  const n2d = 2 * 1.33 * d;
  const f = (l) => { const s = Math.sin(Math.PI * n2d / l); return s * s; };
  return [f(650), f(532), f(455)];
}

// ---------- state ----------
let state = 'title', stT = 0, now = 0;
let stage = null, stageIdx = 0, soap = SOAP0, starsArr = [], best = 0;
let bubbles = [], parts = [], texts = [], trails = [], birds = [];
let wand = { x: 180 }, grow = null, growPtr = null;
let hintT = 0, hintText = '', touchTip = false, endTimer = 0, flash = 0;
let save = null;
const fluff = [];
for (let i = 0; i < 46; i++) fluff.push({ x: Math.random() * 400, y: Math.random() * 700, s: rnd(.6, 1.4), vx: 0, vy: 0 });
const deco = [];

addEventListener('message', (e) => {
  if (e.data && e.data.agf === 'loaded' && e.data.data) {
    save = e.data.data;
    stageIdx = clamp(save.stage | 0, 0, STAGES.length - 1);
    starsArr = Array.isArray(save.stars) ? save.stars.slice(0, STAGES.length) : [];
    best = save.best | 0;
  }
});
try { parent.postMessage({ agf: 'load' }, '*'); } catch (e) {}
function persist() { try { parent.postMessage({ agf: 'save', data: { stage: stageIdx, stars: starsArr, best } }, '*'); } catch (e) {} }

function layoutStage() {
  const d = stage.def;
  stage.gates.forEach((g, i) => {
    const [x, yf, ang, half] = d.gates[i];
    g.x = x + OX; g.y = WH * yf; g.a = ang * Math.PI / 180; g.half = half;
    g.cx = Math.cos(g.a); g.cy = Math.sin(g.a);
  });
  stage.thorns = (d.thorns || []).map((pl) => {
    const pts = pl.map(([x, yf]) => [x + OX, WH * yf]);
    const spikes = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
      const len = Math.hypot(bx - ax, by - ay), n = Math.floor(len / 22);
      for (let k = 0; k < n; k++) { const t = (k + .5) / n; spikes.push([ax + (bx - ax) * t, ay + (by - ay) * t, (k % 2 ? 1 : -1)]); }
    }
    return { pts, spikes };
  });
}
function startStage(i) {
  stageIdx = i;
  stage = { def: STAGES[i], gates: STAGES[i].gates.map(() => ({ passed: false, glow: 0 })), thorns: [] };
  layoutStage();
  soap = SOAP0; bubbles = []; parts = []; texts = []; trails = []; birds = []; grow = null; growPtr = null; blowStop();
  U.fill(0); V.fill(0);
  wand.x = clamp(WW / 2, 30, WW - 30);
  hintText = L.hints[i]; hintT = i === 0 ? 7 : 4.5;
  endTimer = 0; birdT = 1.5;
  state = 'play'; stT = 0;
  signal('start');
}
let birdT = 0;

function newBubble(x, y, r) {
  return { x, y, vx: 0, vy: 0, r, life: 1, L: 1, ph: Math.random() * 6, wob: .04, sw: Math.random() * 6, prev: null, chain: 0, oc: null, gone: false };
}
function popBubble(b, why) {
  if (b.gone) return;
  b.gone = true; sPop(b.r);
  const n = 10 + (b.r / 5 | 0);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = rnd(40, 140);
    parts.push({ x: b.x + Math.cos(a) * b.r, y: b.y + Math.sin(a) * b.r, vx: Math.cos(a) * sp + b.vx, vy: Math.sin(a) * sp + b.vy, t: 0, L: rnd(.35, .7), s: rnd(1, 2.4) });
  }
  parts.push({ ring: true, x: b.x, y: b.y, r: b.r, t: 0, L: .25 });
  if (why) texts.push({ x: b.x, y: b.y - b.r - 8, s: why, t: 0, L: 1.5, c: '#5a6b85' });
}

// ---------- input ----------
const ptrs = new Map();
function toW(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / S, y: (e.clientY - r.top) / S }; }
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; t = clamp(t, 0, 1);
  return Math.hypot(px - ax - dx * t, py - ay - dy * t);
}
function fingerTouch(ax, ay, bx, by) {
  for (const b of bubbles) if (!b.gone && segDist(b.x, b.y, ax, ay, bx, by) < b.r * .75) {
    popBubble(b, touchTip ? '' : L.touch); touchTip = true;
  }
}
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault(); audioInit();
  const p = toW(e);
  if (state !== 'play') { onTap(); return; }
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  const nearWand = Math.hypot(p.x - wand.x, (p.y - wandY) * 1.2) < 40 || (Math.abs(p.x - wand.x) < 26 && p.y > wandY);
  if (nearWand && !grow) {
    if (soap < MINCOST + .01) { texts.push({ x: wand.x, y: wandY - 50, s: L.short, t: 0, L: 1.4, c: '#c0504d' }); return; }
    grow = newBubble(wand.x, wandY, 10); grow.growing = true;
    growPtr = e.pointerId;
    ptrs.set(e.pointerId, { kind: 'wand', dx: wand.x - p.x, x0: p.x, y0: p.y, t: e.timeStamp });
    blowStart();
    return;
  }
  ptrs.set(e.pointerId, { kind: 'fan', x: p.x, y: p.y, t: e.timeStamp, sp: 0 });
  fingerTouch(p.x, p.y, p.x, p.y);
  trails.push({ pts: [[p.x, p.y, 0]], id: e.pointerId, t: 0 });
});
cv.addEventListener('pointermove', (e) => {
  const rec = ptrs.get(e.pointerId); if (!rec) return;
  const p = toW(e);
  if (rec.kind === 'wand') {
    // a quick stroke that starts on the wand is a fan, not a blow
    if (grow && grow.r < 17 && Math.hypot(p.x - rec.x0, p.y - rec.y0) > 16) {
      grow = null; growPtr = null; blowStop();

  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, 18) : ctx.rect(x, y, w, h); ctx.fill();
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (bg.width) ctx.drawImage(bg, 0, 0); else { ctx.fillStyle = '#bfe6ff'; ctx.fillRect(0, 0, cv.width, cv.height); }
  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);

  // fluff = visible air
  for (const f of fluff) {
    const sp = Math.hypot(f.vx, f.vy);
    ctx.strokeStyle = `rgba(255,255,255,${clamp(.25 + sp / 250, .25, .85)})`;
    ctx.lineWidth = 1.6 * f.s; ctx.lineCap = 'round';
    const k = clamp(.04 + sp / 3000, .04, .12);
    ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x - f.vx * k - .5, f.y - f.vy * k); ctx.stroke();
  }

  if (state === 'title' || (state === 'all' && !stage)) { for (const b of deco) drawBubble(b); }
  if (stage && state !== 'title') {
    for (const g of stage.gates) drawGate(g, 0);
    drawThorns();
    for (const b of bubbles) drawBubble(b);
    if (grow) drawBubble(grow);
    for (const g of stage.gates) drawGate(g, 1);
    for (const bd of birds) drawBird(bd);
  }
  if (state !== 'title') drawWand();

  // finger trails
  for (const tr of trails) {
    if (tr.pts.length < 2) continue;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 1; i < tr.pts.length; i++) {
      const [x0, y0] = tr.pts[i - 1], [x1, y1, a] = tr.pts[i];
      const al = clamp(1 - a / .35, 0, 1) * (i / tr.pts.length);
      ctx.strokeStyle = `rgba(255,255,255,${(al * .55).toFixed(3)})`; ctx.lineWidth = 3 + i * .25;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
  }
  for (const p of parts) {
    const k = 1 - p.t / p.L;
    if (p.hoop) { const g = p.hoop; ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.a); ctx.strokeStyle = `rgba(255,220,100,${k})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(0, 0, g.half * (1 + p.t), g.half * .3 * (1 + p.t), 0, 0, TAU); ctx.stroke(); ctx.restore(); }
    else if (p.ring) { ctx.strokeStyle = `rgba(255,255,255,${k * .8})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + p.t * 2), 0, TAU); ctx.stroke(); }
    else if (p.puff) { ctx.strokeStyle = `rgba(255,255,255,${(k * .75).toFixed(3)})`; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(p.x, p.y, p.s + (1 - k) * 5, p.t * 6, p.t * 6 + 4.2); ctx.stroke(); }
    else if (p.star) { ctx.fillStyle = `rgba(255,214,90,${k})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.s * k + .5, 0, TAU); ctx.fill(); p.vx *= .97; p.vy *= .97; }
    else { ctx.fillStyle = `rgba(220,240,255,${k * .9})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, TAU); ctx.fill(); }
  }
  for (const t of texts) {
    const k = t.t / t.L;
    ctx.globalAlpha = clamp((1 - k) * 2, 0, 1);
    txtS(t.s, t.x, t.y - k * 18, t.big ? 20 : 15, t.c, 900, 'center', 220);
    ctx.globalAlpha = 1;
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,250,220,${flash * .35})`; ctx.fillRect(0, 0, WW, WH); }

  if (state === 'title') drawTitle();
  else {
    drawHUD();
    if (state === 'clear') drawClear();
    else if (state === 'fail') drawFail();
    else if (state === 'all') drawAll();
  }
}
function drawHUD() {
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(0, 0, WW, 50);
  txt(`${L.stage} ${stageIdx + 1}/${STAGES.length}`, 12, 16, 15, '#2c4a6e', 800, 'left', WW * .45);
  txt(L.names[stageIdx], 12, 36, 13, '#4a6b8e', 600, 'left', WW * .45);
  // gate pips
  const n = stage.gates.length;
  for (let i = 0; i < n; i++) {
    const g = stage.gates[i], x = WW / 2 - (n - 1) * 13 + i * 26 + 10, y = 25;
    ctx.strokeStyle = g.passed ? '#f2b200' : '#ff7aa8'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(x, y, 9, 4, 0, 0, TAU); ctx.stroke();
    if (g.passed) { ctx.fillStyle = 'rgba(255,214,90,.6)'; ctx.fill(); }
  }
  // soap bottle
  const bx = WW - 100, by = 12, bw = 86, bh = 14;
  txt(`${L.soapL} ${Math.ceil(soap)}`, WW - 12, 38, 13, '#2c4a6e', 700, 'right', 100);
  ctx.fillStyle = 'rgba(44,74,110,.15)'; ctx.fillRect(bx, by, bw, bh);
  const c = film(420 + soap * 3);
  ctx.fillStyle = `rgb(${(110 + 145 * c[0]) | 0},${(110 + 145 * c[1]) | 0},${(140 + 115 * c[2]) | 0})`;
  ctx.fillRect(bx, by, bw * clamp(soap / SOAP0, 0, 1), bh);
  if (grow) { const cc = cost(grow.r); ctx.fillStyle = 'rgba(200,70,90,.45)'; const w0 = bw * clamp(soap / SOAP0, 0, 1), w1 = bw * clamp(cc / SOAP0, 0, 1); ctx.fillRect(bx + Math.max(0, w0 - w1), by, Math.min(w0, w1), bh); }
  ctx.strokeStyle = '#2c4a6e'; ctx.lineWidth = 1.5; ctx.strokeRect(bx, by, bw, bh);
  if (hintT > 0 && state === 'play') {
    ctx.globalAlpha = clamp(hintT, 0, 1);
    const y = WH - 17;
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.font = `700 14px ${FONT}`; const w = Math.min(WW - 20, ctx.measureText(hintText).width + 24);
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(WW / 2 - w / 2, y - 15, w, 30, 15) : ctx.rect(WW / 2 - w / 2, y - 15, w, 30); ctx.fill();
    txt(hintText, WW / 2, y, 14, '#2c4a6e', 700, 'center', WW - 36);
    ctx.globalAlpha = 1;
  }
}
function drawTitle() {
  const cy = WH * .36;
  txtS(L.title, WW / 2, cy, 40, '#2a5d9e', 900, 'center', WW - 30);
  for (let i = 0; i < L.how.length; i++) txtS(L.how[i], WW / 2, cy + 56 + i * 26, 14, '#2c4a6e', 700, 'center', WW - 30);
  const k = (Math.sin(now * 3) + 1) / 2;
  ctx.globalAlpha = .6 + k * .4;
  txtS(L.tap, WW / 2, WH * .74, 20, '#d0457a', 800);
  ctx.globalAlpha = 1;
  if (stageIdx > 0 && !(starsArr.length >= STAGES.length && starsArr.every((x) => x))) txtS(fmt(L.cont, { n: stageIdx + 1 }), WW / 2, WH * .74 + 32, 14, '#2c4a6e', 700);
}
function stars(n, y, size = 34) {
  for (let i = 0; i < 3; i++) txt('★', WW / 2 + (i - 1) * size * 1.15, y, size, i < n ? '#f2b200' : 'rgba(44,74,110,.2)', 900);
}
function drawClear() {
  const a = clamp(stT * 3, 0, 1); ctx.globalAlpha = a;
  panel(WH * .3, 210);
  txt(L.clear, WW / 2, WH * .3 + 38, 28, '#2a5d9e', 900);
  stars(stage.result, WH * .3 + 88);
  txt(fmt(L.left, { n: Math.ceil(soap) }), WW / 2, WH * .3 + 134, 15, '#2c4a6e', 700);
  if (stT > .7) txt(L.next, WW / 2, WH * .3 + 178, 17, '#d0457a', 800);
  ctx.globalAlpha = 1;
}
function drawFail() {
  const a = clamp(stT * 3, 0, 1); ctx.globalAlpha = a;
  panel(WH * .32, 170);
  txt(L.fail, WW / 2, WH * .32 + 44, 24, '#5a6b85', 900);
  const left = stage.gates.filter((g) => !g.passed).length;
  txt(`${stage.gates.length - left} / ${stage.gates.length}`, WW / 2, WH * .32 + 88, 22, '#2c4a6e', 800);
  if (stT > .7) txt(L.again, WW / 2, WH * .32 + 136, 17, '#d0457a', 800);
  ctx.globalAlpha = 1;
}
function drawAll() {
  const a = clamp(stT * 3, 0, 1); ctx.globalAlpha = a;
  panel(WH * .28, 230);
  const total = starsArr.reduce((x, y) => x + (y || 0), 0);
  txt(L.all, WW / 2, WH * .28 + 40, 30, '#2a5d9e', 900);
  txt(fmt(L.total, { n: total, m: STAGES.length * 3 }), WW / 2, WH * .28 + 92, 26, '#f2a000', 900);
  txt(stage && stage.newBest ? L.newbest : fmt(L.best, { n: best }), WW / 2, WH * .28 + 134, 16, stage && stage.newBest ? '#d0457a' : '#2c4a6e', 800);
  if (stT > .7) txt(L.again, WW / 2, WH * .28 + 192, 17, '#d0457a', 800);
  ctx.globalAlpha = 1;
}

// ---------- loop ----------
let last = 0;
function frame(ts) {
  const dt = last ? clamp((ts - last) / 1000, 0, .05) : 0;
  last = ts;
  if (dt > .025) { update(dt / 2); update(dt / 2); } else if (dt > 0) update(dt);
  draw();
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
