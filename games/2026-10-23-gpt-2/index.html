<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ふた色の磁石庭</title><style>html,body{margin:0;width:100%;height:100dvh;overflow:hidden;background:#254248;overscroll-behavior:none}*{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}canvas{display:block;width:100vw;height:100dvh}</style><canvas></canvas><script src="../../lib/matter-0.20.0.min.js"></script><script>
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),en=LANG==='en',T=en?{title:'Two-Pole Garden',a:'Drag the large magnets. Tap to flip a pole.',b:'Same signs repel; opposite signs gather.',c:'Keep a pattern when it feels right.',start:'Tap to start',play:'Move a magnet and watch the pattern',hint:'Drag a magnet · tap it to flip + / −',finish:'Keep this pattern',result:'Your magnetic pattern',again:'Tap to play again',legend:'Warm grains + · cool grains −'}:{title:'ふた色の磁石庭',a:'大きな磁石を動かす。タップで極を替える。',b:'同じ符号は離れ、違う符号は集まる。',c:'好きな模様になったら標本にしよう。',start:'タップでスタート',play:'磁石を動かすと、模様が変わる',hint:'磁石を動かす・タップで＋と−を替える',finish:'この模様を標本に',result:'あなたの磁石模様',again:'タップでもう一度',legend:'暖色の粒＋・寒色の粒−'};
const c=document.querySelector('canvas'),g=c.getContext('2d'),{Engine,Bodies,Body,Composite}=Matter;let scale=1,ox=0,oy=0;function resize(){const w=Math.max(1,innerWidth),h=Math.max(1,innerHeight),d=Math.min(2,devicePixelRatio||1);c.width=w*d;c.height=h*d;scale=Math.min(w/360,h/640);ox=(w-360*scale)/2;oy=(h-640*scale)/2;g.setTransform(d*scale,0,0,d*scale,d*ox,d*oy)}addEventListener('resize',resize);resize();for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});
const signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};let ac;function tone(f){try{ac??=new AudioContext();ac.resume();const o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f;v.gain.setValueAtTime(.025,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.2);o.connect(v).connect(ac.destination);o.start();o.stop(ac.currentTime+.21)}catch{}}
let state='title',engine,beads=[],magnets=[],pointer=null,time=0,age=0,ended=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function setup(){engine=Engine.create({gravity:{x:0,y:0}});magnets=[{x:100,y:230,pole:1},{x:260,y:410,pole:-1}];beads=[];for(let j=0;j<36;j++){const b=Bodies.circle(55+j%6*50,183+Math.floor(j/6)*53,5,{restitution:.65,friction:0,frictionAir:.035});b.pole=j%2?1:-1;beads.push(b)}const walls=[Bodies.rectangle(15,330,20,400,{isStatic:true}),Bodies.rectangle(345,330,20,400,{isStatic:true}),Bodies.rectangle(180,135,360,20,{isStatic:true}),Bodies.rectangle(180,525,360,20,{isStatic:true})];Composite.add(engine.world,[...beads,...walls])}
setup();function start(){state='play';age=0;pointer=null;setup();signal('start')}
function point(e){return{x:(e.clientX-ox)/scale,y:(e.clientY-oy)/scale}}
c.addEventListener('pointerdown',e=>{if(pointer)return;tone(180);if(state==='title'){start();return}if(state==='end'){if(time-ended>.7)start();return}const p=point(e);if(p.y>=553&&p.y<=610){state='end';ended=time;signal('end');tone(660);return}const i=magnets.findIndex(m=>Math.hypot(m.x-p.x,m.y-p.y)<33);if(i>=0){pointer={id:e.pointerId,i,start:p,moved:false};c.setPointerCapture(e.pointerId)}});
c.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId||state!=='play')return;const p=point(e),m=magnets[pointer.i];if(Math.hypot(p.x-pointer.start.x,p.y-pointer.start.y)>5)pointer.moved=true;if(pointer.moved){m.x=clamp(p.x,49,311);m.y=clamp(p.y,174,486)}});
function release(e){if(!pointer||pointer.id!==e.pointerId)return;if(!pointer.moved&&e.type!=='pointercancel'){const m=magnets[pointer.i];m.pole*=-1;tone(m.pole>0?400:270)}pointer=null}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);
function update(dt){const n=Math.max(1,Math.ceil(dt*1000/16.67)),step=dt*1000/n;for(let k=0;k<n;k++){for(const b of beads){let fx=0,fy=0;for(const m of magnets){const dx=m.x-b.position.x,dy=m.y-b.position.y,r2=dx*dx+dy*dy+1000,sign=-b.pole*m.pole;fx+=sign*dx*.0018/r2;fy+=sign*dy*.0018/r2}Body.applyForce(b,b.position,{x:fx,y:fy})}if(step>0)Engine.update(engine,step);for(const b of beads)if(b.speed>6)Body.setVelocity(b,{x:b.velocity.x/b.speed*6,y:b.velocity.y/b.speed*6})}}
function text(s,x,y,size=18,col='#294b4c',max=326){g.fillStyle=col;g.textAlign='center';g.font='600 '+size+'px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif';g.save();g.translate(x,y);const w=g.measureText(s).width;if(w>max)g.scale(max/w,1);g.fillText(s,0,0);g.restore()}
function circle(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function magnet(m,i){g.strokeStyle=m.pole>0?'#bd927e':'#7babad';g.lineWidth=1;g.setLineDash([3,8]);g.beginPath();g.arc(m.x,m.y,53,0,7);g.stroke();g.setLineDash([]);circle(m.x,m.y,24,m.pole>0?'#c5806a':'#649da7');text(m.pole>0?'+':'−',m.x,m.y+9,28,'#fff5d8',44);text(i===0?'A':'B',m.x,m.y-31,14)}
function board(){g.fillStyle='#dae2d2';g.beginPath();g.roundRect(25,145,310,370,22);g.fill();for(let j=0;j<20;j++)circle(38+j%5*69,165+Math.floor(j/5)*99,1,'#b7c6b9')}
function draw(){g.clearRect(-ox/scale,-oy/scale,c.width/scale,c.height/scale);g.fillStyle='#eef0de';g.fillRect(0,0,360,640);if(state==='title'){text(T.title,180,103,30);circle(120,267,29,'#c5806a');circle(240,267,29,'#649da7');text('+',120,278,31,'#fff4d5');text('−',240,278,31,'#fff4d5');for(let j=0;j<14;j++)circle(60+j*18,328+Math.sin(j*.65)*15,4,j%2?'#c5806a':'#649da7');text(T.a,180,422,15);text(T.b,180,454,16);text(T.c,180,486,16);text(T.start,180,579,21);return}
text('A '+(magnets[0].pole>0?'+':'−')+'     B '+(magnets[1].pole>0?'+':'−'),180,35,19);text(state==='end'?T.result:T.play,180,103,state==='end'?27:18);board();for(const b of beads){circle(b.position.x,b.position.y,5,b.pole>0?'#bd7965':'#508d9c');g.strokeStyle='#f0eed9';g.lineWidth=1;g.beginPath();g.moveTo(b.position.x-2,b.position.y);g.lineTo(b.position.x+2,b.position.y);if(b.pole>0){g.moveTo(b.position.x,b.position.y-2);g.lineTo(b.position.x,b.position.y+2)}g.stroke()}magnets.forEach(magnet);
if(state==='end'){text(T.again,180,587,21);return}text(T.legend,180,540,13);g.fillStyle='#497a77';g.beginPath();g.roundRect(30,553,300,57,17);g.fill();text(T.finish,180,590,20,'#f6efd7');if(age<4)text(T.hint,180,634,12)}
let last=0;function frame(ts){const dt=Math.min(.033,Math.max(0,(ts-last)/1000));last=ts;time+=dt;if(state==='play'){age+=dt;update(dt)}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
