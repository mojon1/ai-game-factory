<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>雲の皿</title>
<style>
*{box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf1dc;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}canvas{display:block;width:100vw;height:100dvh}
</style>
<canvas id="game"></canvas>
<script src="../../lib/matter-0.20.0.min.js"></script>
<script>
(() => {
'use strict';
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en');
const dict={ja:{title:'雲の皿',sub:'いっぱい載せる？ いま売る？',rules:['指を左右に動かして、果物を受ける。','たくさん載せてまとめて売ると高得点。','重みで傾く皿から、こぼさないように！'],start:'タップでスタート',score:'スコア',time:'残り',next:'次の果物',sell:'まとめて売る',empty:'皿に果物を載せよう',settle:'果物が落ち着くのを待とう',cargo:'皿の上',lost:'こぼれ',hint:'左右になぞって受けよう',sold:'出荷！',bonus:'まとめ売りボーナス',over:'お店じまい',best:'ベスト',newBest:'ベスト更新！',again:'タップでもう一度',total:'出荷した果物',unit:'個',seconds:'秒',auto:'最後の果物も自動で出荷'},en:{title:'Cloud Platter',sub:'One more fruit, or sell now?',rules:['Slide your finger to catch the fruit.','Sell a bigger batch for a bigger bonus.','Keep your tilting platter from spilling!'],start:'Tap to start',score:'SCORE',time:'TIME',next:'NEXT FRUIT',sell:'Sell the batch',empty:'Catch fruit on your platter',settle:'Wait for the fruit to settle',cargo:'ON BOARD',lost:'SPILLED',hint:'Slide left and right to catch',sold:'Sold!',bonus:'Batch bonus',over:'Shop closed',best:'BEST',newBest:'NEW BEST!',again:'Tap to play again',total:'FRUIT SOLD',unit:'fruit',seconds:'s',auto:'Your final batch was sold too'}};
const t=dict[LANG==='ja'?'ja':'en'];document.documentElement.lang=LANG==='ja'?'ja':'en';document.title=t.title;
const {Engine,Bodies,Body,Composite,Constraint}=Matter,c=document.getElementById('game'),g=c.getContext('2d');
let w=360,h=640,state='title',engine,tray,anchor,fruit=[],next={x:180,type:0},target=180,remaining=45,score=0,best=0,sold=0,spilled=0,age=0,spawnIn=1.1,clock=0,endAt=0,last=null,acc=0,pointer=null,toast='',toastTime=0,particles=[],audio,newRecord=false;
const palette=['#eb805d','#e9b949','#b490cb'],signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch(e){}};
function soundInit(){try{audio||=new(window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{})}catch(e){}}
function beep(freq){try{if(!audio)return;const o=audio.createOscillator(),v=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*1.25,audio.currentTime+.1);v.gain.setValueAtTime(.025,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.15);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+.16)}catch(e){}}
function setup(){engine=Engine.create({gravity:{x:0,y:.8},positionIterations:8,velocityIterations:8});const base=Bodies.rectangle(180,470,150,12,{chamfer:{radius:4}}),left=Bodies.rectangle(107,460,8,28,{chamfer:{radius:3}}),right=Bodies.rectangle(253,460,8,28,{chamfer:{radius:3}});tray=Body.create({parts:[base,left,right],friction:.7,frictionAir:.055,restitution:0,density:.002});Body.setPosition(tray,{x:180,y:470});Body.setInertia(tray,tray.inertia*1.6);anchor=Constraint.create({pointA:{x:180,y:470},bodyB:tray,pointB:{x:0,y:0},length:0,stiffness:.9,damping:.2});Composite.add(engine.world,[tray,anchor]);fruit=[];target=180;next={x:180,type:0};acc=0}
function begin(){setup();state='play';remaining=45;score=0;sold=0;spilled=0;age=0;spawnIn=1.1;toast='';toastTime=0;particles=[];pointer=null;signal('start')}
function announce(s){toast=s;toastTime=1.8}
function spawn(){const b=Bodies.circle(next.x,118,15,{friction:.6,frictionAir:.003,restitution:.12,density:.0018});b.kind=next.type;b.readyTime=0;b.touched=false;fruit.push(b);Composite.add(engine.world,b);next={x:40+Math.random()*280,type:Math.floor(Math.random()*3)};spawnIn=3.2-age/45*1.3}
function supported(){const found=new Set([tray.id]);for(let n=0;n<fruit.length+1;n++){let changed=false;for(const p of engine.pairs.list){if(!p.isActive)continue;const a=p.bodyA.parent||p.bodyA,b=p.bodyB.parent||p.bodyB;if(found.has(a.id)&&!found.has(b.id)){found.add(b.id);changed=true}if(found.has(b.id)&&!found.has(a.id)){found.add(a.id);changed=true}}if(!changed)break}return found}
function readyFruit(){return fruit.filter(b=>b.readyTime>=.18&&b.position.y<tray.position.y+24)}
function sell(final=false){const batch=readyFruit();if(!batch.length){if(!final)announce(fruit.length?t.settle:t.empty);return}const gain=batch.length*(10+3*(batch.length-1));score+=gain;sold+=batch.length;for(const b of batch){for(let i=0;i<8;i++)particles.push({x:b.position.x,y:b.position.y,vx:(Math.random()-.5)*90,vy:-25-Math.random()*70,life:.7,color:palette[b.kind]});Composite.remove(engine.world,b)}fruit=fruit.filter(b=>!batch.includes(b));if(!final){announce(`${t.sold} +${gain}`);beep(500+batch.length*70)}}
function finish(){if(state!=='play')return;sell(true);state='end';endAt=clock;pointer=null;newRecord=score>best;best=Math.max(best,score);signal('end',{score})}
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*360,y:(e.clientY-r.top)/r.height*640}}
c.addEventListener('pointerdown',e=>{e.preventDefault();soundInit();if(state==='title'){begin();return}if(state==='end'){if(clock-endAt>=.7)begin();return}const p=pos(e);if(p.x>=44&&p.x<=316&&p.y>=554&&p.y<=619){sell();return}pointer=e.pointerId;try{c.setPointerCapture(pointer)}catch(e){}target=Math.max(82,Math.min(278,p.x))});
c.addEventListener('pointermove',e=>{if(state==='play'&&pointer===e.pointerId){e.preventDefault();target=Math.max(82,Math.min(278,pos(e).x))}});
for(const event of ['pointerup','pointercancel','lostpointercapture'])c.addEventListener(event,e=>{if(pointer===e.pointerId)pointer=null});
function physics(){const dt=1/60;anchor.pointA.x+=(target-anchor.pointA.x)*.16;tray.torque-=tray.angle*.065;Engine.update(engine,1000/60);if(Math.abs(tray.angle)>.52){Body.setAngle(tray,Math.sign(tray.angle)*.52);if(tray.angle*tray.angularVelocity>0)Body.setAngularVelocity(tray,0)}const on=supported();for(const b of fruit){const supportedNow=on.has(b.id)&&b.position.y<tray.position.y+24;b.readyTime=supportedNow?b.readyTime+dt:0;if(supportedNow&&!b.touched){b.touched=true;beep(280+b.kind*100)}if(b.position.y>665||b.position.x< -45||b.position.x>405){Composite.remove(engine.world,b);b.gone=true;spilled++;announce(`${t.lost} +1`);beep(130)}}fruit=fruit.filter(b=>!b.gone)}
function update(dt){clock+=dt;for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}particles=particles.filter(p=>p.life>0);toastTime=Math.max(0,toastTime-dt);if(state!=='play')return;remaining=Math.max(0,remaining-dt);age+=dt;spawnIn-=dt;if(spawnIn<=0)spawn();acc+=dt;while(acc>=1/60){physics();acc-=1/60}if(remaining===0)finish()}
function txt(s,x,y,size=16,color='#284846',weight=500,align='center',max=326){g.fillStyle=color;g.textAlign=align;g.textBaseline='middle';g.font=`${weight} ${size}px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif`;const wide=g.measureText(s).width;if(wide>max)g.font=`${weight} ${Math.max(12,size*max/wide)}px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif`;g.fillText(s,x,y)}
function box(x,y,bw,bh,r,fill,stroke){g.beginPath();g.roundRect(x,y,bw,bh,r);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=1;g.stroke()}}
function cloud(x,y,scale=1){g.save();g.translate(x,y);g.scale(scale,scale);g.fillStyle='#ffffffb8';g.beginPath();g.ellipse(0,5,41,15,0,0,Math.PI*2);g.ellipse(-15,-5,18,16,0,0,Math.PI*2);g.ellipse(10,-11,23,23,0,0,Math.PI*2);g.fill();g.restore()}
function fruitDraw(x,y,a,kind,scale=1,ready=false){g.save();g.translate(x,y);g.rotate(a);g.scale(scale,scale);if(ready){g.strokeStyle='#50896a';g.lineWidth=2;g.beginPath();g.arc(0,0,18,0,Math.PI*2);g.stroke()}g.fillStyle=palette[kind];g.beginPath();g.arc(0,0,15,0,Math.PI*2);g.fill();g.fillStyle='#ffffff70';g.beginPath();g.ellipse(-5,-5,3,5,.6,0,Math.PI*2);g.fill();g.strokeStyle='#435e49';g.lineWidth=2;g.beginPath();g.moveTo(0,-12);g.lineTo(2,-19);g.stroke();g.fillStyle='#5b8c65';g.beginPath();g.ellipse(7,-16,6,3,-.4,0,Math.PI*2);g.fill();g.restore()}
function plate(x,y,a){g.save();g.translate(x,y);g.rotate(a);g.strokeStyle='#617f86';g.lineWidth=7;g.lineJoin='round';g.lineCap='round';g.beginPath();g.moveTo(-74,-17);g.lineTo(-74,3);g.quadraticCurveTo(0,17,74,3);g.lineTo(74,-17);g.stroke();g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.moveTo(-70,-11);g.lineTo(-70,0);g.quadraticCurveTo(0,13,70,0);g.lineTo(70,-11);g.stroke();g.restore()}
function background(){const grad=g.createLinearGradient(0,0,0,640);grad.addColorStop(0,'#d7e6df');grad.addColorStop(1,'#fbf1d4');g.fillStyle=grad;g.fillRect(0,0,360,640);cloud(35+Math.sin(clock*.15)*10,205,.8);cloud(323-Math.sin(clock*.12)*8,315,.65);g.strokeStyle='#adc8bf55';g.lineWidth=1;for(let i=0;i<5;i++){g.beginPath();g.moveTo(18,410+i*22);g.bezierCurveTo(85,380+i*22,210,440+i*22,342,407+i*22);g.stroke()}}
function draw(){g.setTransform(c.width/360,0,0,c.height/640,0,0);background();if(state==='title'){cloud(180,115,1.3);txt(t.title,180,176,40,'#284846',800);txt(t.sub,180,226,17,'#536b59',600);plate(180,329,Math.sin(clock)*.12);fruitDraw(151,300,0,0);fruitDraw(185,299,.1,1);fruitDraw(216,292,-.2,2);t.rules.forEach((s,i)=>txt(s,180,402+i*27,14));box(32,528,296,64,32,'#315c50');txt(t.start,180,560,19,'#fff6de',700);return}
  const on=readyFruit(),cargo=on.length,value=cargo*(10+3*(cargo-1));g.fillStyle='#ffffff70';g.fillRect(0,0,360,83);txt(t.score,18,20,14,'#617168',600,'left');txt(String(score),18,52,29,'#284846',800,'left');txt(`${t.time} ${Math.ceil(remaining)}${t.seconds}`,341,39,20,remaining<=10?'#ae4f44':'#284846',700,'right',160);g.fillStyle='#315c50';g.fillRect(0,80,360*remaining/45,3);
  cloud(next.x,111,.68);fruitDraw(next.x,113,0,next.type,.65);txt(t.next,180,151,12,'#647d72',600);g.setLineDash([3,7]);g.strokeStyle='#75998a50';g.beginPath();g.moveTo(next.x,164);g.lineTo(next.x,420);g.stroke();g.setLineDash([]);
  g.fillStyle='#6e8d8160';g.beginPath();g.ellipse(tray.position.x,516,60,7,0,0,Math.PI*2);g.fill();g.strokeStyle='#93aaa0';g.lineWidth=3;g.beginPath();g.moveTo(tray.position.x,474);g.lineTo(tray.position.x,502);g.stroke();plate(tray.position.x,tray.position.y,tray.angle);g.fillStyle='#92ada0';g.beginPath();g.arc(tray.position.x,502,5,0,Math.PI*2);g.fill();
  for(const b of fruit)fruitDraw(b.position.x,b.position.y,b.angle,b.kind,1,b.readyTime>=.18);for(const p of particles){g.globalAlpha=Math.max(0,p.life/.7);g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,3,0,Math.PI*2);g.fill();g.globalAlpha=1}
  txt(`${t.cargo} ${cargo}`,22,532,14,'#526e61',600,'left',155);txt(`${t.lost} ${spilled}`,338,532,14,'#836654',600,'right',155);box(44,554,272,65,24,cargo?'#315c50':'#638878');txt(t.sell,180,577,18,'#fff6de',700);txt(`+${Math.max(0,value)}${cargo>1?' · '+t.bonus:''}`,180,601,13,'#e8efd8',600);if(toastTime>0)txt(toast,180,189,16,'#315c50',700);if(age<4)txt(t.hint,180,631,13,'#526e61');
  if(state==='end'){g.fillStyle='#edf1dcef';g.fillRect(0,0,360,640);cloud(180,122,1.2);txt(t.over,180,194,27,'#526e61',700);txt(String(score),180,280,68,'#284846',800);txt(newRecord?t.newBest:`${t.best} ${best}`,180,345,19,'#315c50',700);txt(`${t.total} ${sold} ${t.unit}`,180,393,16);txt(`${t.lost} ${spilled} ${t.unit}`,180,424,14,'#836654');txt(t.auto,180,461,13,'#617168');box(32,521,296,66,33,'#315c50');txt(t.again,180,554,18,'#fff6de',700)}
}
function resize(){w=Math.max(1,innerWidth);h=Math.max(1,innerHeight);const d=Math.min(devicePixelRatio||1,2);c.width=Math.round(w*d);c.height=Math.round(h*d);draw()}
setup();addEventListener('resize',resize);resize();requestAnimationFrame(function frame(now){const dt=last===null?0:Math.max(0,Math.min(.05,(now-last)/1000));last=now;update(dt);draw();requestAnimationFrame(frame)});
})();
</script>
</html>
