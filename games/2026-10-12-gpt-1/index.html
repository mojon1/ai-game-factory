<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;overflow:hidden;overscroll-behavior:none;background:#efe4d2}canvas{display:block;width:100vw;height:100dvh}</style></head><body><canvas id="c"></canvas><script>
'use strict';const c=document.getElementById('c'),g=c.getContext('2d');for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});const lang=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),D={ja:{title:'六日間のパン棚',sub:'棚の空きも、コインも有限',r1:'予報を見て3種類のパンを仕込む',r2:'仕入れ2枚 → 販売3枚、棚は6個',r3:'売れ残りは廃棄。6日間の商い',start:'タップでスタート',cash:'コイン',day:'日目',best:'ベスト',forecast:'今日の需要予報',weather:['おだやかな朝','遠足のうわさ','雨の午後','朝市の日','学校帰り','町のお祭り'],names:['山パン','クロワッサン','まるパン'],buy:'仕入れ',open:'開店する',shelf:'棚',hint:'＋で仕入れ、−で返品',cost:'1個2枚で買い、3枚で売る',sold:'売れた',need:'需要',waste:'廃棄',result:'今日の商い',next:'タップで次の日',done:'6日間、おつかれさま',retry:'タップでもう一度',newBest:'ベスト更新！',full:'棚がいっぱい',poor:'コインが足りない'},en:{title:'Six Days of Bread',sub:'Limited shelf, limited coins',r1:'Stock three breads from forecasts',r2:'Buy for 2 → sell for 3; 6 shelf slots',r3:'Leftovers expire. Run the shop 6 days',start:'Tap to start',cash:'Coins',day:'Day',best:'Best',forecast:'Today’s demand forecast',weather:['Quiet morning','A picnic rumor','Rainy afternoon','Market morning','After school','Town festival'],names:['Loaf','Croissant','Round roll'],buy:'Stock',open:'Open shop',shelf:'Shelf',hint:'＋ buys, − returns before opening',cost:'Buy for 2, sell for 3 each',sold:'Sold',need:'Demand',waste:'Waste',result:'Today’s sales',next:'Tap for next day',done:'Six days complete',retry:'Tap to play again',newBest:'New best!',full:'Shelf is full',poor:'Not enough coins'}};const T=D[lang]||D.en;const days=[[[3,3],[2,2],[1,1]],[[0,4],[2,3],[1,3]],[[1,2],[0,4],[2,4]],[[3,5],[0,1],[0,2]],[[0,2],[3,5],[1,2]],[[1,4],[1,4],[1,4]]];let W,H,s,ox,oy,state='title',day=0,cash=12,best=0,stock=[0,0,0],needs=[],sold=[],waste=0,earned=0,elapsed=0,ended=0,notice='',noticeTime=0,ac,record=false;const signal=(agf,data={})=>{try{parent.postMessage({agf,...data},'*')}catch(e){}};addEventListener('message',e=>{if(e.data?.agf==='loaded'){const v=e.data.data;if(Number.isFinite(v?.best)&&v.best>=0)best=Math.max(best,v.best)}});signal('load');function audio(){try{ac||=new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}function tone(f,d=.08){try{if(!ac)return;const o=ac.createOscillator(),a=ac.createGain();o.frequency.value=f;a.gain.setValueAtTime(.05,ac.currentTime);a.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(a).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}function resize(){W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);const d=Math.min(2,devicePixelRatio||1);c.width=W*d;c.height=H*d;s=Math.min(W/360,H/640);ox=(W-360*s)/2;oy=(H-640*s)/2}addEventListener('resize',resize);resize();function begin(){stock=[0,0,0];needs=days[day].map(([a,b])=>a+Math.floor(Math.random()*(b-a+1)));elapsed=0;notice='';state='plan';signal('start')}function open(){sold=stock.map((n,i)=>Math.min(n,needs[i]));earned=sold.reduce((a,b)=>a+b,0)*3;waste=stock.reduce((a,b)=>a+b,0)-sold.reduce((a,b)=>a+b,0);cash+=earned;state='result';ended=0;record=day===5&&cash>best;if(day===5){best=Math.max(best,cash);signal('save',{data:{best}})}signal('end',{score:cash});tone(earned?740:150,.18)}function noticeSet(n){notice=n;noticeTime=1.4}function pointer(e){e.preventDefault();audio();const r=c.getBoundingClientRect(),x=(e.clientX-r.left-ox)/s,y=(e.clientY-r.top-oy)/s;if(state==='title'){day=0;cash=12;begin();return}if(state==='result'){if(ended<.7)return;if(day===5){day=0;cash=12}else day++;begin();return}for(let i=0;i<3;i++){const cx=70+i*110;if(Math.abs(x-cx)<=40&&y>=390&&y<=442){if(stock.reduce((a,b)=>a+b,0)>=6){noticeSet(T.full);return}if(cash<2){noticeSet(T.poor);return}cash-=2;stock[i]++;tone(320+i*80);return}if(Math.abs(x-cx)<=40&&y>=455&&y<=507){if(stock[i]>0){cash+=2;stock[i]--;tone(220)}return}}if(x>=40&&x<=320&&y>=535&&y<=590)open()}c.addEventListener('pointerdown',pointer);c.addEventListener('pointermove',e=>e.preventDefault());c.addEventListener('pointerup',()=>{});c.addEventListener('pointercancel',()=>{});
function text(str,x,y,size=18,color='#533e37',max=320){g.fillStyle=color;g.textAlign='center';g.font=size+'px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif';const w=g.measureText(str).width;if(w>max)g.font=(size*max/w)+'px system-ui';g.fillText(str,x,y)}function box(x,y,w,h,color,r=12){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}function bread(x,y,i){g.save();g.translate(x,y);g.fillStyle=['#cb8b4d','#d9a557','#c39250'][i];if(i===0){g.beginPath();g.roundRect(-30,-20,60,46,14);g.fill();g.strokeStyle='#f8ce83';g.lineWidth=4;for(let k=-17;k<=17;k+=17){g.beginPath();g.moveTo(k-4,-8);g.lineTo(k+4,14);g.stroke()}}else if(i===1){g.beginPath();g.ellipse(0,0,35,20,-.1,0,Math.PI*2);g.fill();g.fillStyle='#f7efdf';g.beginPath();g.ellipse(0,-12,27,16,0,0,Math.PI*2);g.fill();g.strokeStyle='#ad713d';g.lineWidth=3;for(let k=-15;k<=15;k+=15){g.beginPath();g.moveTo(k,0);g.lineTo(k+5,17);g.stroke()}}else{g.beginPath();g.arc(0,2,27,0,Math.PI*2);g.fill();text('×',0,12,28,'#f6d597')}g.restore()}function draw(){g.setTransform(c.width/W,0,0,c.height/H,0,0);g.clearRect(0,0,W,H);g.save();g.translate(ox,oy);g.scale(s,s);g.fillStyle='#efe4d2';g.fillRect(0,0,360,640);if(state==='title'){text(T.title,180,170,29);text(T.sub,180,216,18);for(let i=0;i<3;i++)bread(70+i*110,277,i);text(T.r1,180,345,18);text(T.r2,180,379,18);text(T.r3,180,413,18);text(T.start,180,511,23);text(T.best+' '+best,180,559,16);g.restore();return}text(T.cash+' '+cash,76,35,19);text(lang==='ja'?(day+1)+'/6 '+T.day:T.day+' '+(day+1)+'/6',280,35,18);text(T.weather[day],180,84,24);text(T.forecast,180,122,17);for(let i=0;i<3;i++){const x=70+i*110;box(x-46,150,92,220,'#f7efdf');text(T.names[i],x,180,17,'#533e37',84);text(days[day][i].join('〜'),x,213,21);bread(x,267,i);text(T.buy+' '+stock[i],x,341,19,'#533e37',86);box(x-40,390,80,52,'#75564b');text('＋',x,426,28,'#fff4de');box(x-40,455,80,52,'#c9b7a1');text('−',x,491,28)}text(T.shelf+' '+stock.reduce((a,b)=>a+b,0)+'/6',180,529,17);box(40,543,280,50,'#ad674c');text(T.open,180,576,21,'#fff6de');text(noticeTime>0?notice:elapsed<6?T.hint:T.cost,180,624,15);if(state==='result'){box(18,139,324,463,'#f9f1e3');text(day===5?T.done:T.result,180,186,25);for(let i=0;i<3;i++){bread(65,253+i*67,i);text(T.names[i],150,242+i*67,16,'#533e37',90);text(T.sold+' '+sold[i]+' / '+T.need+' '+needs[i],225,270+i*67,17,'#533e37',205)}text(T.cash+' '+cash+'  (+'+earned+')',180,470,25);text(T.waste+' '+waste,180,505,18);text(day===5?(record?T.newBest:T.best+' '+best):T.cost,180,538,17);text(day===5?T.retry:T.next,180,580,20)}g.restore()}let prev;function frame(now){const dt=Math.min(.05,Math.max(0,(now-(prev??now))/1000));prev=now;elapsed+=dt;if(state==='result')ended+=dt;noticeTime-=dt;draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
