function shape(i){const p=[],spiral=Math.random()<.5,f=1.2+Math.random()*2.4,phase=Math.random()*6;for(let j=0;j<=100;j++){const t=j/100;if(spiral){const a=t*(5+Math.random()*.001)*Math.PI+phase,r=8+45*t;p.push({x:Math.cos(a)*r,y:Math.sin(a)*r})}else p.push({x:Math.sin(t*Math.PI*2*f+phase)*(28+Math.random()*.01),y:210*t-105})}const xs=p.map(a=>a.x),ys=p.map(a=>a.y),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),scale=Math.min(112/(maxx-minx),200/(maxy-miny));return p.map(a=>({x:90+i*180+(a.x-(minx+maxx)/2)*scale,y:320+(a.y-(miny+maxy)/2)*scale}))}function length(p){return p.slice(1).reduce((v,a,i)=>v+Math.hypot(a.x-p[i].x,a.y-p[i].y),0)}function next(){round++;do{ropes=[shape(0),shape(1)];lens=ropes.map(length)}while(Math.abs(lens[0]-lens[1])/Math.max(...lens)<.08||Math.max(...lens)/Math.min(...lens)>1.5);answer=lens[0]>lens[1]?0:1;choice=-1;state='play';age=0}function start(){score=0;round=0;signal('start');next()}
