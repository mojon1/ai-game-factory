<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>かけあわせ花壇</title>
<style>
html, body, canvas, * { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e9f1d8; }
canvas { display: block; width: 100vw; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
for (const t of ['contextmenu', 'selectstart', 'gesturestart']) addEventListener(t, (e) => e.preventDefault(), { passive: false });
const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };
const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';

const T = {
  ja: {
    title: 'かけあわせ花壇',
    how: ['花から花へ指でなぞって、かけあわせ', '季節をすすめると、たねから子どもの花がさく', '注文どおりの花を、注文札へ運んで出荷'],
    tap: 'タップでスタート', garden: '庭', seasons: 'のこり季節', advance: '季節をすすめる ▶', finish: 'おわりにする',
    zukan: '図鑑', bees: 'ハチ', compost: 'たい肥',
    colors: ['白', '桃', '赤', '黄', 'あんず', '橙'], shape: ['丸', 'とがり'], layer: ['一重', '八重'], sep: '・',
    parents: '親', firstGen: 'はじめからある花', newOne: 'はじめて！',
    hints: ['花から花へ指でなぞって受粉させよう', '親に見えない性質が、子どもに出ることも', '八重の花も、どこかにかくれている'],
    noBee: 'ハチがもういない（季節をすすめよう）', same: 'もうかけあわせてある', wrong: 'この注文とはちがう花', done: 'この注文は出荷ずみ',
    overflow: (n) => `場所がなく、たね ${n} こが育たなかった`, shipped: '出荷！',
    clear: (n) => `庭 ${n} クリア！`, allClear: 'ぜんぶの庭がさいた！', left: (n) => `のこり季節 ${n}`,
    fail: '季節がおわった…', failSub: '注文の花がそろわなかった', again: 'タップでもう一度', next: 'タップで次へ',
    from: (n) => `庭 ${n} から`, newRec: (n) => `新しく図鑑に ${n} しゅ`,
  },
  en: {
    title: 'Crossbreed Garden',
    how: ['Trace from flower to flower to cross them', 'Next season, seeds bloom into their children', 'Carry a matching flower to an order card'],
    tap: 'Tap to start', garden: 'Garden', seasons: 'Seasons left', advance: 'Next season ▶', finish: 'Give up',
    zukan: 'Book', bees: 'Bees', compost: 'Compost',
    colors: ['White', 'Pink', 'Red', 'Yellow', 'Apricot', 'Orange'], shape: ['round', 'pointed'], layer: ['single', 'double'], sep: ', ',
    parents: 'Parents', firstGen: 'Original flower', newOne: 'New!',
    hints: ['Trace from one flower to another to pollinate', 'Children can show traits their parents hide', 'Double petals are hiding somewhere too'],
    noBee: 'No bees left (go to next season)', same: 'Already crossed', wrong: 'Not what this order wants', done: 'Order already shipped',
    overflow: (n) => `No room: ${n} seed(s) did not grow`, shipped: 'Shipped!',
    clear: (n) => `Garden ${n} cleared!`, allClear: 'Every garden bloomed!', left: (n) => `${n} season(s) left`,
    fail: 'The seasons ran out…', failSub: 'Some orders were not filled', again: 'Tap to play again', next: 'Tap to continue',
    from: (n) => `From garden ${n}`, newRec: (n) => `${n} new in the book`,
  },
}[LANG === 'ja' ? 'ja' : 'en'];

const HEX = ['#fbf8ef', '#f6a3bd', '#de3349', '#f5d332', '#f9b26a', '#f0741f'];
const DARK = ['#b9b2a0', '#c9617f', '#9b1c2c', '#c49c10', '#cf7d35', '#b54b0c'];

// ---- genetics ----
const G = (a, b, d, f) => ({ a: [...a].map((ch) => +(ch === ch.toUpperCase())), b: [...b].map((ch) => +(ch === ch.toUpperCase())), d: [...d].map((ch) => +(ch === ch.toUpperCase())), f: [...f].map((ch) => +(ch === ch.toUpperCase())) });
const pick = (x) => x[Math.random() < 0.5 ? 0 : 1];
const cross = (p, q) => ({ a: [pick(p.a), pick(q.a)], b: [pick(p.b), pick(q.b)], d: [pick(p.d), pick(q.d)], f: [pick(p.f), pick(q.f)] });
const pheno = (g) => ({ c: (g.b[0] | g.b[1]) * 3 + g.a[0] + g.a[1], round: g.d[0] | g.d[1], single: g.f[0] | g.f[1] });
const keyOf = (p) => p.c * 4 + (p.round ? 0 : 2) + (p.single ? 0 : 1);
const nameOf = (p) => [T.colors[p.c], T.shape[p.round ? 0 : 1], T.layer[p.single ? 0 : 1]].join(T.sep);
const has = (o, k) => o[k] !== undefined;
const matches = (p, o) => (!has(o, 'c') || o.c === p.c) && (!has(o, 'round') || !!o.round === !!p.round) && (!has(o, 'single') || !!o.single === !!p.single);
const orderLabel = (o) => [has(o, 'c') ? T.colors[o.c] : null, has(o, 'round') ? T.shape[o.round ? 0 : 1] : null, has(o, 'single') ? T.layer[o.single ? 0 : 1] : null].filter(Boolean).join(T.sep);
const orderPheno = (o) => ({ c: has(o, 'c') ? o.c : 0, round: has(o, 'round') ? o.round : 1, single: has(o, 'single') ? o.single : 1 });

const STAGES = [
  { seasons: 6, start: [[0, G('AA', 'bb', 'DD', 'FF')], [2, G('aa', 'BB', 'DD', 'FF')], [9, G('aa', 'BB', 'DD', 'FF')], [11, G('AA', 'bb', 'DD', 'FF')]],
    orders: [{ c: 4 }, { c: 1 }, { c: 0 }] },
  { seasons: 7, start: [[0, G('Aa', 'bb', 'Dd', 'FF')], [2, G('aa', 'bb', 'DD', 'FF')], [9, G('AA', 'bb', 'Dd', 'FF')], [11, G('Aa', 'bb', 'Dd', 'FF')]],
    orders: [{ c: 0, round: 0 }, { c: 2, round: 0 }, { c: 1, round: 0 }] },
  { seasons: 9, start: [[0, G('AA', 'Bb', 'DD', 'Ff')], [2, G('aa', 'bb', 'dd', 'Ff')], [9, G('aa', 'Bb', 'Dd', 'FF')], [11, G('Aa', 'bb', 'Dd', 'Ff')]],
    orders: [{ c: 5, single: 0 }, { c: 0, round: 0, single: 0 }, { c: 4, round: 0 }] },
];
const BEDS = 12, MAX_BEES = 3, SEEDS = 3;

// ---- state ----
let scene = 'title', stageIdx = 0, sceneAt = 0;
let beds = [], orders = [], crosses = [], seasonsLeft = 0, anims = [], toasts = [], sparks = [];
let zukan = new Set(), newThisStage = 0, hintUntil = 0, busyUntil = 0;
let drag = null, tip = null, btnDown = false, resultInfo = null;

addEventListener('message', (e) => {
  const d = e.data;
  if (d && d.agf === 'loaded' && d.data && scene === 'title') {
    if (Array.isArray(d.data.zukan)) zukan = new Set(d.data.zukan.filter((k) => Number.isInteger(k) && k >= 0 && k < 24));
    if (Number.isInteger(d.data.stage) && d.data.stage >= 0 && d.data.stage < STAGES.length) stageIdx = d.data.stage;
  }
});
signal('load');
const persist = () => signal('save', { data: { stage: stageIdx, zukan: [...zukan] } });

function discover(p) { const k = keyOf(p); if (zukan.has(k)) return false; zukan.add(k); newThisStage++; return true; }

function startStage() {
  const st = STAGES[stageIdx];
  beds = Array(BEDS).fill(null);
  const now = performance.now();
  for (const [i, g] of st.start) { beds[i] = { g, p: pheno(g), born: now - 1000, parents: null, isNew: false }; discover(beds[i].p); }
  orders = st.orders.map((o) => ({ ...o, done: false, shake: 0 }));
  crosses = []; anims = []; toasts = []; sparks = []; drag = null; tip = null;
  seasonsLeft = st.seasons; newThisStage = 0;
  hintUntil = now + 6000; scene = 'play'; sceneAt = now;
  signal('start');
}

// ---- layout ----
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 360, H = 640, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
addEventListener('resize', resize); resize();

function layout() {
  const hud = 44, ordY = 50, ordH = Math.min(96, Math.max(76, H * 0.13)), bar = 88;
  const gTop = ordY + ordH + 10, gBot = H - bar - 8;
  const cell = Math.max(10, Math.min((W - 20) / 3, (gBot - gTop) / 4));
  const gx = (W - cell * 3) / 2, gy = gTop + Math.max(0, (gBot - gTop - cell * 4) / 2);
  const cards = [0, 1, 2].map((i) => { const cw = (W - 32) / 3; return { x: 8 + i * (cw + 8), y: ordY, w: cw, h: ordH }; });
  const bedRects = []; for (let i = 0; i < BEDS; i++) bedRects.push({ x: gx + (i % 3) * cell, y: gy + Math.floor(i / 3) * cell, w: cell, h: cell });
  const bw = Math.min(170, W * 0.44);
  return { hud, cards, bedRects, cell, bar,
    compost: { x: 10, y: H - bar + 10, w: 74, h: bar - 20 },
    btn: { x: W - bw - 10, y: H - bar + 14, w: bw, h: bar - 28 },
    mid: { x: 94, y: H - bar + 10, w: W - bw - 114, h: bar - 20 } };
}
const inR = (r, x, y) => r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
const center = (r) => [r.x + r.w / 2, r.y + r.h / 2];

// ---- audio ----
let AC = null, master = null, buzz = null;
function audioInit() {
  try {
    if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination); }
    if (AC.state !== 'running') AC.resume();
  } catch (e) { AC = null; }
}
function tone(freq, dur, type = 'sine', vol = 0.15, delay = 0, slide = 0) {
  if (!AC) return;
  try {
    const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t0 + dur);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
const sPop = (c) => { tone(PENTA[c] * 0.75, 0.22, 'sine', 0.14, 0, 1.35); tone(PENTA[c] * 1.5, 0.12, 'triangle', 0.04, 0.02); };
const sNew = () => [0, 2, 4, 5].forEach((n, i) => tone(PENTA[n] * 1.5, 0.25, 'triangle', 0.07, i * 0.07));
const sCross = () => { tone(660, 0.12, 'triangle', 0.09); tone(990, 0.16, 'triangle', 0.06, 0.07); };
const sShip = () => [0, 2, 4, 3, 5].forEach((n, i) => tone(PENTA[n], 0.3, 'triangle', 0.09, i * 0.08));
const sNo = () => { tone(220, 0.18, 'square', 0.04); tone(180, 0.2, 'square', 0.035, 0.08); };
const sSeason = () => { tone(392, 0.4, 'sine', 0.08); tone(587, 0.5, 'sine', 0.06, 0.1); };
const sClear = () => [0, 1, 2, 3, 4, 5].forEach((n, i) => tone(PENTA[n], 0.5, 'triangle', 0.08, i * 0.09));
const sFail = () => [3, 2, 0].forEach((n, i) => tone(PENTA[n] * 0.5, 0.45, 'sine', 0.09, i * 0.18));
function buzzOn() {
  if (!AC || buzz) return;
  try {
    const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain(), lfo = AC.createOscillator(), lg = AC.createGain();
    o.type = 'sawtooth'; o.frequency.value = 170; f.type = 'lowpass'; f.frequency.value = 700; g.gain.value = 0;
    lfo.frequency.value = 23; lg.gain.value = 9; lfo.connect(lg); lg.connect(o.frequency);
    o.connect(f); f.connect(g); g.connect(master); o.start(); lfo.start();
    g.gain.linearRampToValueAtTime(0.03, AC.currentTime + 0.08);
    buzz = { o, g, lfo };
  } catch (e) {}
}
function buzzSpeed(v) { if (buzz) try { buzz.o.frequency.setTargetAtTime(160 + Math.min(120, v * 0.25), AC.currentTime, 0.05); } catch (e) {} }
function buzzOff() {
  if (!buzz) return; const b = buzz; buzz = null;
  try { b.g.gain.setTargetAtTime(0, AC.currentTime, 0.03); b.o.stop(AC.currentTime + 0.2); b.lfo.stop(AC.currentTime + 0.2); } catch (e) {}
}

// ---- helpers ----
function toast(text, color = '#3a4a2a') { toasts.push({ text, color, t: performance.now() }); if (toasts.length > 2) toasts.shift(); }
function burst(x, y, col, n = 14) { const t = performance.now(); for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 110; sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, col, t }); } }
function removeFlower(i) { beds[i] = null; crosses = crosses.filter((c) => c.a !== i && c.b !== i); }

function advanceSeason() {
  const L = layout(), now = performance.now();
  if (seasonsLeft <= 0) { endStage(false); return; }
  sSeason();
  const seeds = [];
  for (const c of crosses) {
    const A = beds[c.a], B = beds[c.b]; if (!A || !B) continue;
    const [ax, ay] = center(L.bedRects[c.a]), [bx, by] = center(L.bedRects[c.b]);
    for (let k = 0; k < SEEDS; k++) seeds.push({ g: cross(A.g, B.g), parents: [A.p, B.p], fx: (ax + bx) / 2, fy: (ay + by) / 2 - L.cell * 0.2 });
  }
  crosses = [];
  const empty = []; for (let i = 0; i < BEDS; i++) if (!beds[i]) empty.push(i);
  for (let i = empty.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [empty[i], empty[j]] = [empty[j], empty[i]]; }
  let lost = 0;
  seeds.forEach((s, k) => {
    if (k >= empty.length) { lost++; return; }
    const bi = empty[k];
    const p = pheno(s.g);
    beds[bi] = { g: s.g, p, born: now + 650 + k * 120, parents: s.parents, isNew: false, pending: true };
    anims.push({ bi, fx: s.fx, fy: s.fy, t0: now + k * 120, dur: 650 });
  });
  seasonsLeft--;
  busyUntil = now + 700 + seeds.length * 120;
  if (lost) setTimeout(() => toast(T.overflow(lost), '#8a5a2a'), 400);
}

function endStage(win) {
  buzzOff(); drag = null;
  scene = 'result'; sceneAt = performance.now();
  resultInfo = { win, stage: stageIdx, left: seasonsLeft, newN: newThisStage, last: win && stageIdx === STAGES.length - 1 };
  signal('end', { score: zukan.size });
  if (win) { sClear(); stageIdx = (stageIdx + 1) % STAGES.length; } else sFail();
  persist();
}

// ---- input ----
let pid = null;
function pos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault(); audioInit();
  if (pid !== null) return;
  const [x, y] = pos(e), now = performance.now();
  if (scene === 'title') { startStage(); return; }
  if (scene === 'result') { if (now - sceneAt > 700) startStage(); return; }
  if (now < busyUntil) return;
  const L = layout();
  if (inR(L.btn, x, y)) { pid = e.pointerId; btnDown = true; return; }
  for (let i = 0; i < BEDS; i++) {
    if (beds[i] && !beds[i].pending && inR(L.bedRects[i], x, y)) {
      pid = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch (er) {}
      drag = { from: i, x, y, sx: x, sy: y, moved: false, lt: now, v: 0 };
      tip = null; return;
    }
  }
}, { passive: false });
cv.addEventListener('pointermove', (e) => {
  if (e.pointerId !== pid || !drag) return;
  const [x, y] = pos(e), now = performance.now();
  const d = Math.hypot(x - drag.x, y - drag.y);
  drag.v = d / Math.max(1, now - drag.lt) * 1000; drag.lt = now;
  drag.x = x; drag.y = y;
  if (!drag.moved && Math.hypot(x - drag.sx, y - drag.sy) > 12) { drag.moved = true; buzzOn(); }
  buzzSpeed(drag.v);
});
function finish(e, cancel) {
  if (e.pointerId !== pid) return;
  pid = null;
  const L = layout(), [x, y] = pos(e);
  if (btnDown) { btnDown = false; if (!cancel && inR(L.btn, x, y) && scene === 'play') advanceSeason(); return; }
  if (!drag) return;
  const d = drag; drag = null; buzzOff();
  if (cancel || scene !== 'play') return;
  const src = beds[d.from]; if (!src) return;
  if (!d.moved) { tip = { i: d.from, t: performance.now() }; sPop(src.p.c); return; }
  for (let i = 0; i < 3; i++) {
    if (inR(L.cards[i], x, y)) {
      const o = orders[i];
      if (o.done) { toast(T.done); sNo(); return; }
      if (!matches(src.p, o)) { o.shake = performance.now(); toast(T.wrong, '#9b2c2c'); sNo(); return; }
      o.done = true; removeFlower(d.from); sShip(); const [cx, cy] = center(L.cards[i]); burst(cx, cy, HEX[src.p.c], 22); toast(T.shipped, '#2d6a2d');
      if (orders.every((q) => q.done)) setTimeout(() => { if (scene === 'play') endStage(true); }, 900);
      return;
    }
  }
  if (inR(L.compost, x, y)) { const [cx, cy] = center(L.compost); burst(cx, cy, '#7a5a3a', 10); removeFlower(d.from); tone(150, 0.2, 'sine', 0.1, 0, 0.6); return; }
  for (let i = 0; i < BEDS; i++) {
    if (i !== d.from && beds[i] && !beds[i].pending && inR(L.bedRects[i], x, y)) {
      if (crosses.some((c) => (c.a === i && c.b === d.from) || (c.b === i && c.a === d.from))) { toast(T.same); sNo(); return; }
      if (crosses.length >= MAX_BEES) { toast(T.noBee, '#8a5a2a'); sNo(); return; }
      crosses.push({ a: d.from, b: i, t: performance.now() }); sCross();
      const [cx, cy] = center(L.bedRects[i]); burst(cx, cy - L.cell * 0.15, '#ffe46b', 10);
      return;
    }
  }
}
cv.addEventListener('pointerup', (e) => finish(e, false));
cv.addEventListener('pointercancel', (e) => finish(e, true));

// ---- drawing ----
function fitFont(text, maxW, size, weight = '') {
  let s = size; ctx.font = `${weight} ${s}px ${FONT}`;
  while (s > 12 && ctx.measureText(text).width > maxW) { s -= 1; ctx.font = `${weight} ${s}px ${FONT}`; }
  return s;
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

function drawBloom(x, y, r, p, rot = 0) {
  const n = 5, col = HEX[p.c], edge = DARK[p.c];
  const layers = p.single ? [[1, 0]] : [[1, 0], [0.68, Math.PI / 5]];
  for (const [sc, off] of layers) {
    for (let k = 0; k < n; k++) {
      const a = rot + off + k * Math.PI * 2 / n - Math.PI / 2;
      ctx.save(); ctx.translate(x, y); ctx.rotate(a);
      ctx.beginPath();
      const L = r * sc, wd = r * sc * (p.round ? 0.48 : 0.3);
      if (p.round) { ctx.ellipse(L * 0.55, 0, L * 0.5, wd, 0, 0, Math.PI * 2); }
      else { ctx.moveTo(0, 0); ctx.quadraticCurveTo(L * 0.45, -wd * 1.4, L * 1.05, 0); ctx.quadraticCurveTo(L * 0.45, wd * 1.4, 0, 0); }
      ctx.fillStyle = col; ctx.fill();
      ctx.lineWidth = Math.max(1, r * 0.05); ctx.strokeStyle = edge; ctx.globalAlpha = 0.55; ctx.stroke(); ctx.globalAlpha = 1;
      ctx.restore();
    }
  }
  ctx.beginPath(); ctx.arc(x, y, r * 0.2, 0, Math.PI * 2); ctx.fillStyle = '#8a5a1c'; ctx.fill();
  ctx.beginPath(); ctx.arc(x - r * 0.05, y - r * 0.05, r * 0.1, 0, Math.PI * 2); ctx.fillStyle = '#d9a23a'; ctx.fill();
}
function drawPlant(x, baseY, size, p, grow, t, idx) {
  const g = Math.max(0, Math.min(1, grow));
  if (g <= 0) return;
  const sway = Math.sin(t / 900 + idx * 1.7) * 0.04;
  const stemH = size * 0.42 * Math.min(1, g * 1.6);
  const topX = x + Math.sin(sway) * stemH, topY = baseY - stemH;
  ctx.strokeStyle = '#4c8a3a'; ctx.lineWidth = Math.max(2, size * 0.045); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, baseY); ctx.quadraticCurveTo(x, baseY - stemH * 0.5, topX, topY); ctx.stroke();
  ctx.fillStyle = '#5ea548';
  for (const s of [-1, 1]) {
    ctx.save(); ctx.translate(x, baseY - stemH * (s < 0 ? 0.35 : 0.5)); ctx.rotate(s * 0.9);
    ctx.beginPath(); ctx.ellipse(0, -size * 0.07 * Math.min(1, g * 2), size * 0.05, size * 0.1 * Math.min(1, g * 2), 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  const bloom = Math.max(0, (g - 0.45) / 0.55);
  if (bloom > 0) {
    const e = 1 - Math.pow(1 - bloom, 3);
    const over = bloom < 1 ? 1 + Math.sin(bloom * Math.PI) * 0.15 : 1;
    drawBloom(topX, topY, size * 0.24 * e * over, p, sway * 2);
  } else {
    ctx.beginPath(); ctx.arc(topX, topY, size * 0.05, 0, Math.PI * 2); ctx.fillStyle = '#6fb04f'; ctx.fill();
  }
}
function drawBee(x, y, s, t) {
  const fl = Math.sin(t / 30) * 0.5 + 0.5;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.strokeStyle = 'rgba(80,80,80,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(-s * 0.25, -s * 0.55, s * 0.35, s * (0.22 + fl * 0.12), -0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(s * 0.25, -s * 0.55, s * 0.35, s * (0.22 + fl * 0.12), 0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 0, s * 0.65, s * 0.45, 0, 0, Math.PI * 2); ctx.fillStyle = '#ffcf33'; ctx.fill();
  ctx.save(); ctx.clip(); ctx.fillStyle = '#2b2118';
  for (const sx of [-0.25, 0.12]) ctx.fillRect(sx * s, -s, s * 0.17, s * 2);
  ctx.restore();
  ctx.beginPath(); ctx.arc(s * 0.62, -s * 0.05, s * 0.22, 0, Math.PI * 2); ctx.fillStyle = '#2b2118'; ctx.fill();
  ctx.restore();
}

function drawPlay(t) {
  const L = layout();
  // background
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#dff0f6'); bg.addColorStop(0.25, '#e7f1d6'); bg.addColorStop(1, '#cfe2b0');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // HUD
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2f3d22'; ctx.textAlign = 'left'; ctx.font = `bold 17px ${FONT}`;
  ctx.fillText(`${T.garden} ${(scene === 'result' ? resultInfo.stage : stageIdx) + 1}/${STAGES.length}`, 12, 24);
  ctx.textAlign = 'right';
  fitFont(`${T.seasons} ${seasonsLeft}`, W * 0.5, 17, 'bold');
  ctx.fillStyle = seasonsLeft <= 1 ? '#b0352a' : '#2f3d22';
  ctx.fillText(`${T.seasons} ${seasonsLeft}`, W - 12, 24);
  // order cards
  orders.forEach((o, i) => {
    const r = L.cards[i];
    let dx = 0; if (o.shake && t - o.shake < 400) dx = Math.sin((t - o.shake) / 25) * 5 * (1 - (t - o.shake) / 400);
    const hover = drag && drag.moved && inR(r, drag.x, drag.y);
    ctx.save(); ctx.translate(dx, 0);
    rr(r.x, r.y, r.w, r.h, 10); ctx.fillStyle = o.done ? '#d7ecc8' : hover ? '#fff7d6' : '#fffdf5'; ctx.fill();
    ctx.lineWidth = hover ? 3 : 1.5; ctx.strokeStyle = o.done ? '#6aa84f' : hover ? '#e0a020' : '#c9b98f'; ctx.stroke();
    const ip = orderPheno(o);
    ctx.globalAlpha = o.done ? 0.45 : 1;
    drawBloom(r.x + r.w / 2, r.y + r.h * 0.38, r.h * 0.24, ip, 0);
    if (!has(o, 'c')) { ctx.fillStyle = '#5a4a2a'; ctx.font = `bold 14px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('?', r.x + r.w / 2, r.y + r.h * 0.38); }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#3a2f1a'; ctx.textAlign = 'center';
    const lab = orderLabel(o); fitFont(lab, r.w - 8, 14, 'bold');
    ctx.fillText(lab, r.x + r.w / 2, r.y + r.h * 0.82);
    if (o.done) { ctx.strokeStyle = '#3f8f2f'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(r.x + r.w * 0.3, r.y + r.h * 0.4); ctx.lineTo(r.x + r.w * 0.45, r.y + r.h * 0.58); ctx.lineTo(r.x + r.w * 0.75, r.y + r.h * 0.2); ctx.stroke(); }
    ctx.restore();
  });
  // beds
  for (let i = 0; i < BEDS; i++) {
    const r = L.bedRects[i], pad = r.w * 0.06;
    rr(r.x + pad, r.y + pad, r.w - pad * 2, r.h - pad * 2, r.w * 0.14);
    const hover = drag && drag.moved && i !== drag.from && beds[i] && !beds[i].pending && inR(r, drag.x, drag.y);
    ctx.fillStyle = hover ? '#a77b52' : '#8d6545'; ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    for (let k = 0; k < 3; k++) { ctx.fillRect(r.x + pad * 2, r.y + r.h * (0.3 + k * 0.2), r.w - pad * 4, 2); }
    if (hover) { ctx.lineWidth = 3; ctx.strokeStyle = '#ffd84a'; rr(r.x + pad, r.y + pad, r.w - pad * 2, r.h - pad * 2, r.w * 0.14); ctx.stroke(); }
  }
  // cross links
  for (const c of crosses) {
    const [ax, ay] = center(L.bedRects[c.a]), [bx, by] = center(L.bedRects[c.b]);
    const yo = -L.cell * 0.2, mx = (ax + bx) / 2, my = (ay + by) / 2 + yo - L.cell * 0.35;
    ctx.setLineDash([5, 6]); ctx.lineDashOffset = -t / 40; ctx.strokeStyle = 'rgba(230,170,20,0.9)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(ax, ay + yo); ctx.quadraticCurveTo(mx, my, bx, by + yo); ctx.stroke(); ctx.setLineDash([]);
    const k = (Math.sin(t / 700 + c.t) + 1) / 2, u = 1 - k;
    const qx = u * u * ax + 2 * u * k * mx + k * k * bx, qy = u * u * (ay + yo) + 2 * u * k * my + k * k * (by + yo);
    drawBee(qx, qy - 6, Math.max(7, L.cell * 0.08), t);
  }
  // plants
  for (let i = 0; i < BEDS; i++) {
    const f = beds[i]; if (!f) continue;
    const r = L.bedRects[i];
    const grow = (t - f.born) / 900;
    if (f.pending && grow >= 0) { f.pending = false; if (discover(f.p)) { f.isNew = true; f.newAt = t; sNew(); } sPop(f.p.c); }
    const lifted = drag && drag.from === i && drag.moved && (inR(L.compost, drag.x, drag.y) || L.cards.some((c) => inR(c, drag.x, drag.y)));
    ctx.globalAlpha = lifted ? 0.3 : 1;
    drawPlant(r.x + r.w / 2, r.y + r.h * 0.86, r.w, f.p, grow, t, i);
    ctx.globalAlpha = 1;
    if (f.isNew && t - f.newAt < 2600) {
      const a = Math.min(1, (2600 - (t - f.newAt)) / 500);
      ctx.globalAlpha = a; ctx.font = `bold 13px ${FONT}`; ctx.textAlign = 'center';
      const w = ctx.measureText(T.newOne).width + 10; rr(r.x + r.w / 2 - w / 2, r.y + 2, w, 18, 9); ctx.fillStyle = '#e8403a'; ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText(T.newOne, r.x + r.w / 2, r.y + 11); ctx.globalAlpha = 1;
    }
  }
  // seed flights
  anims = anims.filter((a) => t < a.t0 + a.dur + 50);
  for (const a of anims) {
    const k = (t - a.t0) / a.dur; if (k < 0 || k > 1) continue;
    const [tx, ty] = center(L.bedRects[a.bi]);
    const x = a.fx + (tx - a.fx) * k, y = a.fy + (ty + L.cell * 0.3 - a.fy) * k - Math.sin(k * Math.PI) * L.cell * 0.6;
    ctx.beginPath(); ctx.ellipse(x, y, 5, 3.5, k * 6, 0, Math.PI * 2); ctx.fillStyle = '#5a3a1c'; ctx.fill();
  }
  // bottom bar
  const by = H - L.bar;
  ctx.fillStyle = 'rgba(120,90,50,0.16)'; ctx.fillRect(0, by, W, L.bar);
  const cp = L.compost, ch = drag && drag.moved && inR(cp, drag.x, drag.y);
  rr(cp.x, cp.y, cp.w, cp.h, 12); ctx.fillStyle = ch ? '#8a6a44' : '#6e5235'; ctx.fill();
  ctx.fillStyle = '#4a3622'; for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(cp.x + cp.w * (0.3 + k * 0.2), cp.y + cp.h * 0.38, cp.w * 0.1, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#fff5e0'; ctx.textAlign = 'center'; fitFont(T.compost, cp.w - 8, 13, 'bold'); ctx.fillText(T.compost, cp.x + cp.w / 2, cp.y + cp.h * 0.75);
  // bees + book
  const m = L.mid;
  for (let k = 0; k < MAX_BEES; k++) {
    const bx = m.x + m.w / 2 + (k - 1) * 30, used = k >= MAX_BEES - crosses.length;
    ctx.globalAlpha = used ? 0.22 : 1; drawBee(bx, m.y + m.h * 0.32, 9, used ? 0 : t + k * 50); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = '#3a4a2a'; ctx.textAlign = 'center';
  const bk = `${T.zukan} ${zukan.size}/24`; fitFont(bk, m.w, 14, 'bold'); ctx.fillText(bk, m.x + m.w / 2, m.y + m.h * 0.8);
  // button
  const b = L.btn, last = seasonsLeft <= 0, busy = t < busyUntil;
  rr(b.x, b.y + (btnDown ? 2 : 0), b.w, b.h, 14); ctx.fillStyle = busy ? '#9fb58f' : last ? '#b0574a' : '#4f9a3f'; ctx.fill();
  ctx.fillStyle = '#fff'; const bl = last ? T.finish : T.advance; fitFont(bl, b.w - 14, 16, 'bold'); ctx.fillText(bl, b.x + b.w / 2, b.y + b.h / 2 + (btnDown ? 2 : 0));
  // drag trail
  if (drag && drag.moved) {
    const src = beds[drag.from];
    const [sx, sy] = center(L.bedRects[drag.from]);
    const carrying = inR(L.compost, drag.x, drag.y) || L.cards.some((c) => inR(c, drag.x, drag.y));
    if (carrying && src) { drawBloom(drag.x, drag.y - 20, L.cell * 0.22, src.p, 0); }
    else {
      ctx.setLineDash([4, 6]); ctx.strokeStyle = 'rgba(240,190,30,0.9)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(sx, sy - L.cell * 0.2); ctx.lineTo(drag.x, drag.y - 24); ctx.stroke(); ctx.setLineDash([]);
      drawBee(drag.x, drag.y - 24, 12, t);
    }
  }
  // tooltip
  if (tip && beds[tip.i] && t - tip.t < 2600) {
    const f = beds[tip.i], r = L.bedRects[tip.i];
    const l1 = nameOf(f.p), l2 = f.parents ? `${T.parents}: ${nameOf(f.parents[0])} × ${nameOf(f.parents[1])}` : T.firstGen;
    ctx.font = `bold 14px ${FONT}`; const w1 = ctx.measureText(l1).width; ctx.font = `12px ${FONT}`; const w2 = ctx.measureText(l2).width;
    const w = Math.min(W - 16, Math.max(w1, w2) + 20), h = 46;
    let x = r.x + r.w / 2 - w / 2; x = Math.max(8, Math.min(W - 8 - w, x)); let y = r.y - h + 6; if (y < L.cards[0].y + L.cards[0].h + 2) y = r.y + r.h - 4;
    rr(x, y, w, h, 10); ctx.fillStyle = 'rgba(40,36,24,0.9)'; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; fitFont(l1, w - 12, 14, 'bold'); ctx.fillText(l1, x + w / 2, y + 15);
    ctx.fillStyle = '#e8e0c8'; fitFont(l2, w - 12, 12); ctx.fillText(l2, x + w / 2, y + 33);
  }
  // sparks
  sparks = sparks.filter((s) => t - s.t < 800);
  for (const s of sparks) { const k = (t - s.t) / 1000; ctx.globalAlpha = 1 - (t - s.t) / 800; ctx.fillStyle = s.col; ctx.beginPath(); ctx.arc(s.x + s.vx * k, s.y + s.vy * k + 120 * k * k, 3.5, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
  // toasts
  toasts = toasts.filter((q) => t - q.t < 2000);
  toasts.forEach((q, k) => {
    const a = Math.min(1, (2000 - (t - q.t)) / 400);
    const y = L.bedRects[0].y + 10 + k * 34;
    ctx.globalAlpha = a; ctx.font = `bold 14px ${FONT}`; const w = Math.min(W - 20, ctx.measureText(q.text).width + 24);
    rr(W / 2 - w / 2, y, w, 28, 14); ctx.fillStyle = 'rgba(255,253,240,0.95)'; ctx.fill(); ctx.strokeStyle = q.color; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = q.color; ctx.textAlign = 'center'; fitFont(q.text, w - 16, 14, 'bold'); ctx.fillText(q.text, W / 2, y + 14); ctx.globalAlpha = 1;
  });
  // hint
  if (t < hintUntil) {
    const a = Math.min(1, (hintUntil - t) / 600), txt = T.hints[scene === 'result' ? resultInfo.stage : stageIdx];
    ctx.globalAlpha = a; ctx.font = `bold 14px ${FONT}`; const w = Math.min(W - 20, ctx.measureText(txt).width + 24);
    rr(W / 2 - w / 2, by - 40, w, 30, 15); ctx.fillStyle = 'rgba(47,61,34,0.88)'; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; fitFont(txt, w - 16, 14, 'bold'); ctx.fillText(txt, W / 2, by - 25); ctx.globalAlpha = 1;
  }
}

function drawTitle(t) {
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#dff0f6'); bg.addColorStop(1, '#cfe2b0');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const demo = [{ c: 2, round: 1, single: 1 }, { c: 4, round: 1, single: 1 }, { c: 3, round: 1, single: 1 }, { c: 0, round: 0, single: 0 }, { c: 1, round: 0, single: 1 }, { c: 5, round: 1, single: 0 }];
  const s = Math.min(W / 3.4, H / 6);
  demo.forEach((p, i) => { const x = W * (0.2 + (i % 3) * 0.3), y = H * 0.66 + Math.floor(i / 3) * s * 0.95; drawPlant(x, y, s, p, 2, t, i); });
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#2f3d22';
  fitFont(T.title, W - 32, 38, 'bold'); ctx.fillText(T.title, W / 2, H * 0.17);
  ctx.fillStyle = '#4a5a3a';
  T.how.forEach((l, i) => { fitFont(l, W - 32, 15); ctx.fillText(l, W / 2, H * 0.28 + i * 26); });
  if (zukan.size > 0 || stageIdx > 0) {
    ctx.fillStyle = '#7a6a3a'; const z = `${T.zukan} ${zukan.size}/24${stageIdx > 0 ? ' ・ ' + T.from(stageIdx + 1) : ''}`; fitFont(z, W - 32, 14); ctx.fillText(z, W / 2, H * 0.28 + 3 * 26 + 6);
  }
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t / 400); ctx.fillStyle = '#2f3d22'; fitFont(T.tap, W - 32, 20, 'bold'); ctx.fillText(T.tap, W / 2, H * 0.47); ctx.globalAlpha = 1;
}

function drawResult(t) {
  drawPlay(t);
  ctx.fillStyle = 'rgba(30,40,20,0.62)'; ctx.fillRect(0, 0, W, H);
  const r = resultInfo; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  const big = r.win ? (r.last ? T.allClear : T.clear(r.stage + 1)) : T.fail;
  fitFont(big, W - 32, 32, 'bold'); ctx.fillText(big, W / 2, H * 0.36);
  ctx.fillStyle = '#f2ecd0';
  const sub = r.win ? T.left(r.left) : T.failSub; fitFont(sub, W - 32, 17); ctx.fillText(sub, W / 2, H * 0.44);
  const z = `${T.zukan} ${zukan.size}/24` + (r.newN ? `（${T.newRec(r.newN)}）` : ''); fitFont(z, W - 32, 16); ctx.fillText(z, W / 2, H * 0.5);
  if (t - sceneAt > 700) { ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.65 + 0.35 * Math.sin(t / 400); const a = r.win ? T.next : T.again; fitFont(a, W - 32, 20, 'bold'); ctx.fillText(a, W / 2, H * 0.62); ctx.globalAlpha = 1; }
}

function frame(t) {
  try {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (scene === 'title') drawTitle(t); else if (scene === 'play') drawPlay(t); else drawResult(t);
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
