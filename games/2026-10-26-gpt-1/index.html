const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),D={ja:{title:'にじいろ境界線',a:'近い旗の色が、その土地の色',b:'青い旗を5本。橙と土地を取り合う',c:'花の土地は3点、同じ距離は白',start:'タップでスタート',you:'青',cpu:'橙',turn:'本目',place:'空いた土地に旗を置こう',wait:'橙が旗を選んでいる…',win:'青の庭が広がった！',lose:'橙の庭が広かった',draw:'同じ広さの庭',again:'タップでもう一度',hint:'花の近くと相手の隙間を狙おう'},en:{title:'Color Borders',a:'The nearest flag colors each plot',b:'Place five blue flags against orange',c:'Flowers score 3; equal distances stay white',start:'Tap to start',you:'Blue',cpu:'Orange',turn:'flag',place:'Place a flag on an empty plot',wait:'Orange is choosing…',win:'Blue has the bigger garden!',lose:'Orange has the bigger garden',draw:'Two equal gardens',again:'Tap to play again',hint:'Try flowers and gaps between orange flags'}},T=D[LANG]||D.en,c=document.querySelector('canvas'),g=c.getContext('2d');let sc=1,ox=0,oy=0,st='title',flags=[],round=0,delay=0,age=0,last=0,run=0,selected=-1,best=0;const flowers=[7,22,28],weight=p=>flowers.includes(p)?3:1,dist=(a,b)=>(a%6-b%6)**2+(Math.floor(a/6)-Math.floor(b/6))**2;const signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};for(const t of['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});

addEventListener('message',e=>{if(e.data?.agf==='loaded'&&Number.isFinite(e.data.data?.best))best=Math.max(best,Math.max(0,Math.min(42,e.data.data.best)))});signal('load');function owners(fs=flags){return Array.from({length:36},(_,p)=>{let d=Infinity,col=0;for(const f of fs){let n=dist(p,f.p);if(n<d){d=n;col=f.col}else if(n===d&&col!==f.col)col=0}return col})}function score(fs=flags){let a=[0,0,0];owners(fs).forEach((v,p)=>a[v]+=weight(p));return a}
