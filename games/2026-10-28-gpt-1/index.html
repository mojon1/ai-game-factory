const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),en=LANG==='en',D={"ja":{"newBest":"ベスト更新！","t0":"連続回収 ","t1":"海へ落ちた","t2":"かえり弾の灯台","t3":"撃った星は、風に乗って戻る。","t4":"下の帯をなぞって、星を受け取ろう。","t5":"番号は帰着先。連続回収で加点。","t6":"タップでスタート","t7":"灯り ","t8":"星弾 ","t9":"次の風 ","t10":"残りの装甲 ","t11":"ここをなぞって回収","t12":"帰着 ","t13":"撃つ ","t14":"完了","t15":"帰着 ","t16":"ボタンで撃つ → 帯で星を回収","t17":"灯台、点灯！","t18":"星弾がなくなった","t19":" 点","t20":"ベスト ","t21":"タップでもう一度"},"en":{"newBest":"New best!","t0":"Catch chain ","t1":"Lost at sea","t2":"Returnshot Lighthouse","t3":"Shoot a star. The wind brings it back.","t4":"Slide along the lower strip to catch it.","t5":"Catch numbers guide you. Chain catches.","t6":"Tap to start","t7":"Light ","t8":"Stars ","t9":"Next wind ","t10":"Armor left ","t11":"SLIDE HERE TO CATCH","t12":"Catch ","t13":"Fire ","t14":"Done","t15":"Catch ","t16":"Fire below → slide to catch","t17":"Lighthouse lit!","t18":"Out of stars","t19":" points","t20":"Best ","t21":"Tap to play again"}},T=k=>D[en?'en':'ja'][k],c=document.getElementById('c'),g=c.getContext('2d');let W=360,H=640,s=1,ox=0,oy=0;
function resize(){W=innerWidth||360;H=innerHeight||640;const d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0);s=Math.min(W/360,H/640);ox=(W-360*s)/2;oy=(H-640*s)/2}addEventListener('resize',resize);resize();

const X=i=>80+i*100;
function start(){mode='play';px=180;ammo=3;shots=[];score=0;streak=0;wave=0;wind=1;started=time;spawn();signal('start')}

function finish(win){mode=win?'win':'lose';ended=time;newBest=score>best;best=Math.max(best,score);signal('save',{data:{best}});signal('end',{score});tone(win?880:160)}

function input(x,y,move){if(mode==='title'){if(!move)start();return}if(mode==='win'||mode==='lose'){if(!move&&time-ended>.7)start();return}if(y>440&&y<545){px=Math.max(35,Math.min(325,x));return}if(!move&&y>550)fire(Math.max(0,Math.min(2,Math.floor((x-30)/100))))}

function update(dt){time+=dt;if(mode!=='play')return;for(const q of shots){q.t+=dt;if(!q.hit&&q.t>=.7){q.hit=true;const f=foes[q.lane];if(f.hp>0){f.hp--;f.hit=time;score+=10;tone(720)}}if(q.t>=2.4){if(Math.abs(px-X(q.dest))<33){ammo++;streak++;score+=Math.min(4,streak)*2;flash=T('t0')+streak+' +'+Math.min(4,streak)*2;tone(960)}else{streak=0;flash=T('t1');tone(170)}flashTime=time}}shots=shots.filter(q=>q.t<2.4);

if(ammo===0&&shots.length===0&&foes.some(f=>f.hp>0))finish(false)}
function rect(x,y,w,h,fill,r=12){g.fillStyle=fill;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}

g.fillStyle='#18384c';g.beginPath();g.moveTo(12,460);g.lineTo(37,260);g.lineTo(63,460);g.fill();rect(23,250,28,22,'#ffdc85',3);g.fillStyle='#ffdd7712';g.beginPath();g.moveTo(37,260);g.lineTo(350,170);g.lineTo(350,310);g.fill();
for(let i=0;i<8;i++){g.strokeStyle='#518b9360';g.beginPath();for(let x=0;x<=360;x+=10){const yy=440+i*20+Math.sin(x/35+time*1.2+i)*3;x?g.lineTo(x,yy):g.moveTo(x,yy)}g.stroke()}
if(mode==='title'){text(T('t2'),180,120,en?23:29);text(T('t3'),180,175,15);text(T('t4'),180,204,14);text(T('t5'),180,231,13,'#ffdc9a');star(180,310,40,'#ffd483');rect(137,416,86,15,'#62d8c9');text(T('t6'),180,550,21);g.restore();return}
text(String(score),20,35,22,'#ffdf9b','left');text(T('t7')+wave+'/3',338,34,16,'#c2e1dc','right');text(T('t8')+ammo+' / 3',180,73,17);
text(T('t9')+(wind>0?'→':'←'),180,105,15,'#a7c9cf');text(T('t10')+foes.reduce((a,f)=>a+f.hp,0),180,133,14,'#adcacb');
for(const f of foes){if(f.hp>0){const x=X(f.lane),y=180+Math.sin(time*2+f.lane)*4;rect(x-28,y-27,56,54,'#855673',16);g.strokeStyle='#e5a0b5';g.lineWidth=2;g.strokeRect(x-18,y-16,36,30);text(f.hp===2?'Ⅱ':'Ⅰ',x,y+8,26,'#f0bfd3')}else star(X(f.lane),180,13,'#7bcbb2')}
for(const q of shots){g.setLineDash([3,6]);g.strokeStyle='#ffe4a150';g.beginPath();g.moveTo(X(q.lane),200);g.lineTo(X(q.dest),490);g.stroke();g.setLineDash([]);g.strokeStyle='#ffdc8a';g.lineWidth=2;g.beginPath();g.ellipse(X(q.dest),486,29,8,0,0,Math.PI*2);g.stroke();text(String(q.dest+1),X(q.dest),472,13,'#ffdc8a');let x,y;if(q.t<.7){const p=q.t/.7;x=q.origin*(1-p)+X(q.lane)*p;y=490-310*p}else{const p=(q.t-.7)/1.7;x=X(q.lane)+(X(q.dest)-X(q.lane))*p;y=180+320*p}star(x,y,10,'#ffe4a1')}
rect(20,466,320,66,'#0a2639');text(T('t11'),180,526,12,'#98c7c4');rect(px-32,486,64,12,'#70e2c9',5);g.fillStyle='#248f96';g.beginPath();g.moveTo(px-30,498);g.lineTo(px+30,498);g.lineTo(px+19,510);g.lineTo(px-19,510);g.fill();
for(const q of shots){g.strokeStyle='#ffd88c';g.lineWidth=2;g.beginPath();g.ellipse(X(q.dest),480,29,8,0,0,Math.PI*2);g.stroke();text(T('t12')+(q.dest+1),X(q.dest),462,12,'#ffe0a1')}for(let i=0;i<3;i++){const active=ammo&&foes[i].hp>0;rect(33+i*100,557,94,62,active?'#315c72':'#263e50');text(foes[i].hp?T('t13')+(i+1):T('t14'),80+i*100,582,16,active?'#e7f2ed':'#8aa5ae');if(foes[i].hp)text(T('t15')+((i+wind+3)%3+1),80+i*100,607,13,'#ffdc9a')}
