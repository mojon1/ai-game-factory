const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),en=LANG==='en',T=en?{title:'A Shadow at Home',a:'Remember the room before the blackout.',b:'Tap the object that changed when light returns.',c:'Find five. Three mistakes invite the shadow.',start:'Tap to start',found:'Found ',mistakes:'Mistakes ',study:'Remember: ',dark:'…',guess:'What changed?',correct:'You found it',wrong:'That was the same…',next:'Tap for the next blackout',dawn:'Morning came',caught:'Someone is here',again:'Tap to play again',hint:'Watch the shapes, colors and small details',names:['Chair','Lamp','Picture','Clock','Books','Plant']}:{title:'留守番の影',a:'灯りが消える前に部屋を覚える。',b:'再点灯で変わった物をタップ。',c:'5回見つけたら朝。3回ミスで影が来る。',start:'タップでスタート',found:'見つけた ',mistakes:'ミス ',study:'覚えて：',dark:'……',guess:'何が変わった？',correct:'見つけた',wrong:'それは、変わっていない……',next:'タップで次の消灯へ',dawn:'朝が来た',caught:'だれかが、そこに',again:'タップでもう一度',hint:'形・色・小さな違いを覚えよう',names:['椅子','ランプ','絵','時計','本','鉢植え']};
const c=document.querySelector('canvas'),g=c.getContext('2d');let scale=1,ox=0,oy=0;function resize(){const w=Math.max(1,innerWidth),h=Math.max(1,innerHeight),d=Math.min(2,devicePixelRatio||1);c.width=w*d;c.height=h*d;scale=Math.min(w/360,h/640);ox=(w-360*scale)/2;oy=(h-640*scale)/2;g.setTransform(d*scale,0,0,d*scale,d*ox,d*oy)}addEventListener('resize',resize);resize();for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});
const signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};let ac;function tone(f,duration=.22){try{ac??=new AudioContext();ac.resume();const o=ac.createOscillator(),v=ac.createGain();o.type='sine';o.frequency.value=f;v.gain.setValueAtTime(.03,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+duration);o.connect(v).connect(ac.destination);o.start();o.stop(ac.currentTime+duration+.01)}catch{}}
let state='title',values=[],changed=0,found=0,errors=0,time=0,phase=0,age=0,ended=0,message='',mt=0;
function round(){values=Array.from({length:6},()=>Math.random()<.5?0:1);changed=Math.floor(Math.random()*6);state='study';phase=0;message='';signal('start')}
function start(){found=errors=0;age=0;round()}
c.addEventListener('pointerdown',e=>{tone(190,.1);if(state==='title'){start();return}if(state==='end'){if(time-ended>.7)start();return}if(state==='between'){if(time-ended>.7)round();return}if(state!=='guess')return;const x=(e.clientX-ox)/scale,y=(e.clientY-oy)/scale,col=x<180?0:1,row=Math.floor((y-165)/125);if(x<25||x>335||row<0||row>2)return;const i=row*2+col;if(i===changed){found++;state=found===5?'end':'between';ended=time;signal('end',{score:found});tone(560,.35)}else{errors++;message=T.wrong;mt=1.4;tone(75,.5);if(errors>=3){state='end';ended=time;signal('end',{score:found})}}});
function text(s,x,y,size=18,col='#e8dcc1',max=326){g.fillStyle=col;g.textAlign='center';g.font='600 '+size+'px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif';g.save();g.translate(x,y);const w=g.measureText(s).width;if(w>max)g.scale(max/w,1);g.fillText(s,0,0);g.restore()}
function line(points,col='#d9c7a1',width=4){g.strokeStyle=col;g.lineWidth=width;g.beginPath();points.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke()}
function circle(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function star(x,y,r,col){g.fillStyle=col;g.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath();g.fill()}
function object(i,v){const x=i%2?265:95,y=210+Math.floor(i/2)*125;g.fillStyle='#303641';g.beginPath();g.roundRect(x-66,y-44,132,105,13);g.fill();if(state==='between'&&i===changed){g.strokeStyle='#a4c8ac';g.lineWidth=3;g.stroke()}g.save();g.translate(x,y);
if(i===0){g.scale(v?-1:1,1);line([[-23,27],[-23,-30],[4,-30],[4,4],[28,4],[28,27]]);line([[-23,4],[28,4]])}
if(i===1){line([[0,-5],[0,28],[-24,28],[24,28]]);g.fillStyle=v?'#bd7d74':'#91b1ad';g.beginPath();g.moveTo(-20,-31);g.lineTo(20,-31);g.lineTo(31,-2);g.lineTo(-31,-2);g.closePath();g.fill()}
if(i===2){g.strokeStyle='#ad9772';g.lineWidth=5;g.strokeRect(-32,-31,64,61);if(v)star(0,0,20,'#e8c687');else{circle(0,0,19,'#d2cfaf');circle(9,-6,17,'#303641')}}
if(i===3){g.strokeStyle='#ad9772';g.lineWidth=4;g.beginPath();g.arc(0,0,29,0,7);g.stroke();line([[0,-22],[0,0],[Math.cos(v?1:-.65)*19,Math.sin(v?1:-.65)*19]],'#d9c7a1',3)}
if(i===4){for(let j=0;j<(v?4:3);j++){g.fillStyle=['#b18a78','#94aaa2','#bfa66f','#899eb9'][j];g.fillRect(-32+j*17,-26,13,52);line([[-29+j*17,-17],[-22+j*17,-17]],'#e8dcc1',2)}}
if(i===5){line([[0,25],[0,-28]],'#94aaa2',3);for(let j=0;j<(v?4:2);j++){const yy=4-j*10,side=j%2?-1:1;g.fillStyle='#9bad82';g.beginPath();g.ellipse(side*13,yy,17,7,-side*.55,0,7);g.fill()}g.fillStyle='#b18a78';g.beginPath();g.moveTo(-23,17);g.lineTo(23,17);g.lineTo(16,37);g.lineTo(-16,37);g.fill()}
g.restore();text(T.names[i],x,y+52,13)}
function draw(){g.clearRect(-ox/scale,-oy/scale,c.width/scale,c.height/scale);g.fillStyle='#1a202c';g.fillRect(0,0,360,640);g.fillStyle='#252b35';g.fillRect(15,143,330,416);g.strokeStyle='#39414c';g.lineWidth=2;g.strokeRect(15,143,330,416);
if(state==='title'){text(T.title,180,100,31);circle(180,275,65,'#10151d');circle(159,270,3,'#b6b5a1');circle(201,270,3,'#b6b5a1');text(T.a,180,421,16);text(T.b,180,453,16);text(T.c,180,485,15);text(T.start,180,580,21);return}

if(state==='end'){const ok=found===5;g.fillStyle=ok?'#b8c7bd':'#10151d';g.fillRect(15,143,330,416);if(!ok){circle(180,400,80,'#090d14');circle(154,388,4,'#bbbba8');circle(206,388,4,'#bbbba8')}else{g.fillStyle='#e8d9a6';g.fillRect(108,240,144,166);line([[180,240],[180,406]],'#849c93',5);line([[108,323],[252,323]],'#849c93',5)}text(ok?T.dawn:T.caught,180,101,29);text(T.again,180,587,21);return}

if(state==='dark'){g.fillStyle='#10151d';g.fillRect(15,143,330,416);circle(159,526,2,'#696d6b');circle(201,526,2,'#696d6b')}else for(let i=0;i<6;i++)object(i,values[i]);

if(state==='between')text(T.next,180,591,20);else if(mt>0)text(message,180,594,15);if(age<4)text(T.hint,180,634,13)}
