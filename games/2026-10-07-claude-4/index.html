<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>スパーン！だるま落とし / Daruma Knockout</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#efe1c6;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../../lib/matter-0.20.0.min.js"></script>
<script src="../../lib/zzfx-1.4.0.min.js"></script>
<script>
'use strict';
const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const DICT = {
  ja: {
    title: 'だるま落とし', pre: 'スパーン！',
    how1: 'ブロックを横にすばやくスワイプして弾き飛ばす',
    how2: 'だるまを倒さず、台まで下ろせばクリア',
    how3: 'ゆっくり打つと、上の段ごとズレる',
    start: 'タップでスタート', hint: 'ブロックを横にすばやくスワイプ！',
    stage: (n) => `ステージ ${n}`, sec: (s) => `${s}秒`,
    clean: 'スパーン！', clear: 'クリア！', crash: 'ガラガラ…', bonusT: '+8秒', penalty: '-5秒',
    timeup: '時間切れ！', best: 'ベスト', newBest: 'ベスト更新！', again: 'タップでもう一度',
    detail: (st, b, c) => `ステージ ${st} まで ・ ${b}段 ・ スパーン ${c}回`,
    ice: '氷', iron: '鉄', rubber: 'ゴム'
  },
  en: {
    title: 'Daruma Knockout', pre: 'THWACK!',
    how1: 'Swipe fast across a block to knock it out',
    how2: 'Lower the daruma to the stand without toppling it',
    how3: 'Hit slowly and the whole stack slides',
    start: 'Tap to start', hint: 'Swipe fast sideways across a block!',
    stage: (n) => `Stage ${n}`, sec: (s) => `${s}s`,
    clean: 'THWACK!', clear: 'Clear!', crash: 'Crash…', bonusT: '+8s', penalty: '-5s',
    timeup: "Time's up!", best: 'BEST', newBest: 'New best!', again: 'Tap to play again',
    detail: (st, b, c) => `Stage ${st} · ${b} blocks · ${c} clean`,
    ice: 'ICE', iron: 'IRON', rubber: 'RUBBER'
  }
};
const TX = DICT[LANG === 'ja' ? 'ja' : 'en'];
const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';
const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };
const { Engine, Bodies, Composite, Body, Query, Events } = Matter;

// ---------- canvas ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 360, H = 640, DPR = 1, S = 1, OX = 0, VH = 640, TY = 490;
function resize() {
  W = window.innerWidth || 0; H = window.innerHeight || 0;
  if (W < 10) W = 360; if (H < 10) H = 640;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  S = Math.min(W / 360, H / 580);
  OX = (W - 360 * S) / 2;
  VH = H / S;
  TY = VH - 150;   // screen y (world units) of the stand top
}
window.addEventListener('resize', resize);
resize();

// ---------- sound (ZzFX) ----------
try { ZZFX.volume = 0.32; } catch (e) {}
const snd = (...p) => { try { zzfx(...p); } catch (e) {} };
const sfx = {
  clack(v) { snd(1, .05, 560 + Math.min(40, v) * 14, 0, .004, .07, 1, 2, 0, 0, 0, 0, 0, .5, 0, 0, 0, .6, .015); },
  clean() { snd(.7, 0, 1320, .01, .05, .28, 0, 1, 0, 0, 660, .06, 0, 0, 0, 0, 0, .8); },
  thud(v) { snd(Math.min(.9, .15 + v * .08), .1, 120, 0, .01, .1, 0, 1, -4, 0, 0, 0, 0, 1.4, 0, 0, 0, .5); },
  crash() { snd(1, .2, 70, .01, .25, .5, 4, 1, -2, 0, 0, 0, 0, 3, 0, .2); },
  clear() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => snd(.55, 0, f, .01, .05, .2, 0, 1.5), i * 90)); },
  tick() { snd(.25, 0, 1700, 0, 0, .03, 0); },
  start() { snd(.5, 0, 660, .01, .03, .12, 0, 1.5); }
};

// ---------- physics world ----------
const CX = 180;            // stand center x
const BW = 96;             // block width
const STAND_W = 104;
const HEAD_W = 66, HEAD_H = 60;
const MAT = {
  wood:   { friction: 0.5,  fs: 0.7, density: 0.002 },
  ice:    { friction: 0.02, fs: 0.03, density: 0.0018 },
  iron:   { friction: 0.5,  fs: 0.7, density: 0.007 },
  rubber: { friction: 1.0,  fs: 1.4, density: 0.0022 }
};
const WOOD_COLS = ['#3d7bd9', '#f2c230', '#3fae6a', '#ef7f2a', '#8a5cc7', '#e0505a'];
let engine, stand, table, head, tower = [], flying = [];

function newEngine() {
  engine = Engine.create({ positionIterations: 12, velocityIterations: 8 });
  engine.gravity.y = 1.3;
  stand = Bodies.rectangle(CX, 40, STAND_W, 80, { isStatic: true, friction: 0.6, label: 'stand' });
  table = Bodies.rectangle(CX, 140, 1600, 120, { isStatic: true, friction: 0.6, label: 'table' });
  Composite.add(engine.world, [stand, table]);
  Events.on(engine, 'collisionStart', onCollide);
}
let lastThud = 0;
function onCollide(e) {
  for (const p of e.pairs) {
    const a = p.bodyA, b = p.bodyB;
    const rv = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
    if (rv > 2.2 && now - lastThud > 0.06) {
      lastThud = now; sfx.thud(rv);
      if (rv > 4) { const px = (a.position.x + b.position.x) / 2, py = Math.max(a.position.y, b.position.y) - 10; dust(px, py, 4); }
    }
  }
}
function stageDef(n) {
  const count = Math.min(7, 2 + n);
  const list = [];
  for (let i = 0; i < count; i++) {
    let m = 'wood';
    if (n === 3 && i === 1) m = 'ice';
    if (n === 4 && i === 1) m = 'iron';
    if (n === 4 && i === 3) m = 'ice';
    if (n >= 5) { const r = Math.random(); m = r < 0.45 ? 'wood' : r < 0.65 ? 'ice' : r < 0.83 ? 'iron' : 'rubber'; }
    const h = (n >= 4 && Math.random() < 0.3) ? 22 : 34;
    list.push({ m, h });
  }
  return list;
}
function buildStage(n) {
  for (const b of [...tower, ...flying]) Composite.remove(engine.world, b);
  if (head) Composite.remove(engine.world, head);
  tower = []; flying = [];
  const def = stageDef(n);
  let y = 0;
  def.forEach((d, i) => {
    const mt = MAT[d.m];
    const b = Bodies.rectangle(CX, y - d.h / 2 - 0.3, BW, d.h, { friction: mt.friction, frictionStatic: mt.fs, density: mt.density, restitution: 0.02, chamfer: { radius: 3 }, label: 'block' });
    b.gw = BW; b.gh = d.h; b.mat = d.m; b.col = WOOD_COLS[(i + n) % WOOD_COLS.length];
    tower.push(b);
    y -= d.h + 0.6;
  });
  head = Bodies.rectangle(CX, y - HEAD_H / 2 - 0.3, HEAD_W, HEAD_H, { friction: 0.6, frictionStatic: 0.8, density: 0.0016, restitution: 0.02, chamfer: { radius: [28, 28, 8, 8] }, label: 'head' });
  Composite.add(engine.world, [...tower, head]);
  stageBlocks = def.length;
}

// ---------- state ----------
let state = 'title', stateT = 0, now = 0, phase = 'act', phaseT = 0;
let stage = 1, score = 0, timeLeft = 40, best = 0, isNewBest = false, knocked = 0, cleanCount = 0, streak = 0;
let stageBlocks = 0, restT = 0, hitInfo = null, slowT = 0, shake = 0, lastTick = 0, playT = 0;
let parts = [], floats = [], strokes = new Map(), trail = [];

function startGame() {
  newEngine();
  stage = 1; score = 0; timeLeft = 40; knocked = 0; cleanCount = 0; streak = 0;
  parts = []; floats = []; trail = []; hitInfo = null; slowT = 0; shake = 0; playT = 0;
  buildStage(stage);
  state = 'play'; stateT = 0; phase = 'act'; phaseT = 0; restT = 0;
  sfx.start();
  signal('start');
}
function endGame() {
  state = 'over'; stateT = 0;
  isNewBest = score > best; if (isNewBest) best = score;
  signal('end', { score });
}

// ---------- input ----------
const toWorld = (e) => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - OX) / S, y: (e.clientY - r.top) / S - TY }; };
function bodyAt(x, y) {
  const hits = Query.point([...tower, head], { x, y });
  return hits[0] || null;
}
function onDown(e) {
  e.preventDefault();
  try { ZZFX.audioContext?.resume(); } catch (er) {}
  if (state === 'title') { startGame(); return; }
  if (state === 'over') { if (stateT > 0.7) startGame(); return; }
  const p = toWorld(e);
  strokes.set(e.pointerId, { pts: [{ x: p.x, y: p.y, t: now }], used: false, prevIn: bodyAt(p.x, p.y) });
  trail.push({ x: p.x, y: p.y, t: now });
}
function onMove(e) {
  const st = strokes.get(e.pointerId);
  if (!st || state !== 'play') return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ev of (evs.length ? evs : [e])) strokeTo(st, toWorld(ev));
}
function onUp(e) { const st = strokes.get(e.pointerId); if (st) { strokeTo(st, toWorld(e)); strokes.delete(e.pointerId); } }
function strokeTo(st, p) {
  const last = st.pts[st.pts.length - 1];
  const dx = p.x - last.x, dy = p.y - last.y, dist = Math.hypot(dx, dy);
  const n = Math.max(1, Math.ceil(dist / 4));
  for (let i = 1; i <= n; i++) {
    const px = last.x + dx * i / n, py = last.y + dy * i / n;
    const inside = phase === 'act' ? bodyAt(px, py) : null;
    if (!st.used && inside && inside !== st.prevIn) {
      // velocity from the samples of the last ~60ms
      let old = st.pts[0];
      for (const q of st.pts) if (now - q.t <= 0.06) { old = q; break; }
      const dt = Math.max(0.016, now - old.t);
      hit(inside, (px - old.x) / dt, (py - old.y) / dt, px, py);
      st.used = true;
    }
    st.prevIn = inside;
  }
  st.pts.push({ x: p.x, y: p.y, t: now });
  while (st.pts.length > 2 && now - st.pts[0].t > 0.2) st.pts.shift();
  trail.push({ x: p.x, y: p.y, t: now });
}
cv.addEventListener('pointerdown', onDown, { passive: false });
cv.addEventListener('pointermove', onMove);
cv.addEventListener('pointerup', onUp);
cv.addEventListener('pointercancel', onUp);
cv.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

function hit(b, vx, vy, px, py) {
  // world units per second -> units per physics step (16.67ms)
  const sx = Math.max(-48, Math.min(48, vx / 60));
  const sy = Math.max(-24, Math.min(24, vy / 60 * 0.6));
  Body.setVelocity(b, { x: sx, y: sy });
  Body.setAngularVelocity(b, (Math.random() - 0.5) * 0.02);
  hitInfo = { body: b, t: now, headX0: head.position.x };
  sfx.clack(Math.abs(sx));
  shake = Math.max(shake, Math.min(0.25, Math.abs(sx) * 0.006));
  if (Math.abs(sx) > 24) slowT = 0.22;
  for (let i = 0; i < 9; i++) {
    const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 140;
    parts.push({ x: px, y: py, vx: Math.cos(a) * v + sx * 6, vy: Math.sin(a) * v, life: 0.45, max: 0.45, size: 2.2 + Math.random() * 2, col: '255,240,200', g: 300 });
  }
}
function dust(x, y, n) {
  for (let i = 0; i < n; i++) parts.push({ x: x + (Math.random() - 0.5) * 40, y, vx: (Math.random() - 0.5) * 80, vy: -Math.random() * 40, life: 0.6, max: 0.6, size: 4 + Math.random() * 4, col: '160,130,95', g: -20, soft: true });
}
function addFloat(x, y, txt, col, size = 18) { floats.push({ x, y, txt, col, size, life: 1.0 }); }

// ---------- update ----------
function update(dt) {
  now += dt; stateT += dt; phaseT += dt;
  shake = Math.max(0, shake - dt);
  trail = trail.filter((p) => now - p.t < 0.14);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; p.vx *= 1 - 2 * dt;
    if (p.soft) p.size += 10 * dt;
  }
  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.life -= dt; f.y -= 30 * dt; if (f.life <= 0) floats.splice(i, 1); }
  if (!engine) return;

  // physics (fixed step, optional slow motion)
  slowT = Math.max(0, slowT - dt);
  engine.timing.timeScale = slowT > 0 ? 0.3 : 1;
  engine._acc = (engine._acc || 0) + dt;
  let steps = 0;
  while (engine._acc >= 1 / 60 && steps < 4) { Engine.update(engine, 1000 / 60); engine._acc -= 1 / 60; steps++; }
  if (steps === 4) engine._acc = 0;

  if (state !== 'play') return;
  playT += dt;
  if (phase !== 'clear') {
    timeLeft -= dt;
    if (timeLeft <= 5 && Math.ceil(timeLeft) !== lastTick && timeLeft > 0) { lastTick = Math.ceil(timeLeft); sfx.tick(); }
    if (timeLeft <= 0) { timeLeft = 0; endGame(); return; }
  }

  // knocked blocks
  for (let i = tower.length - 1; i >= 0; i--) {
    const b = tower[i];
    if (Math.abs(b.position.x - CX) > 64 || b.position.y > 20) {
      tower.splice(i, 1); b.knockedAt = now; flying.push(b);
      knocked++;
      const cleanHit = hitInfo && hitInfo.body === b && now - hitInfo.t < 0.8 &&
        Math.abs(head.position.x - hitInfo.headX0) < 4 && Math.abs(head.angle) < 0.05;
      if (cleanHit) {
        streak++; cleanCount++;
        const pts = 10 + 15 * Math.min(streak, 5);
        score += pts;
        addFloat(head.position.x, head.position.y - 50, `${TX.clean} +${pts}`, '#d8321e', 22);
        sfx.clean();
      } else {
        streak = 0; score += 10;
        addFloat(b.position.x < CX ? CX - 70 : CX + 70, b.position.y - 20, '+10', '#5a3d22', 16);
      }
    }
  }
  for (let i = flying.length - 1; i >= 0; i--) {
    const b = flying[i];
    if (now - b.knockedAt > 2.5 || b.position.y > 400 || Math.abs(b.position.x - CX) > 600) { Composite.remove(engine.world, b); flying.splice(i, 1); }
  }

  if (phase === 'act') {
    // crash?
    if (head.position.y > 10 || Math.abs(head.angle) > 1.15 || Math.abs(head.position.x - CX) > 72) {
      phase = 'crash'; phaseT = 0; streak = 0;
      timeLeft = Math.max(0, timeLeft - 5);
      sfx.crash(); shake = 0.4;
      addFloat(CX, -200, `${TX.crash} ${TX.penalty}`, '#7a2a1a', 22);
      return;
    }
    // clear?
    if (tower.length === 0) {
      if (Math.abs(head.angle) < 0.3 && head.speed < 0.25 && head.position.y < 0) restT += dt; else restT = 0;
      if (restT > 0.35) {
        phase = 'clear'; phaseT = 0;
        const bonus = 30 * stage;
        score += bonus; timeLeft += 8;
        sfx.clear();
        addFloat(CX, -170, `${TX.clear} +${bonus}`, '#2f7d3c', 26);
        addFloat(CX, -135, TX.bonusT, '#2f6aa8', 18);
      }
    }
  } else if (phase === 'crash' && phaseT > 1.3) {
    buildStage(stage); phase = 'act'; phaseT = 0; restT = 0; hitInfo = null;
  } else if (phase === 'clear' && phaseT > 1.2) {
    stage++; buildStage(stage); phase = 'act'; phaseT = 0; restT = 0; hitInfo = null;
  }
}

// ---------- draw ----------
function fitFont(text, size, weight, maxW) {
  let s = size; ctx.font = `${weight} ${s}px ${FONT}`;
  while (s > 10 && ctx.measureText(text).width > maxW) { s--; ctx.font = `${weight} ${s}px ${FONT}`; }
}
function drawText(text, x, y, size, weight, color, align = 'center', maxW = W - 32) {
  fitFont(text, size, weight, maxW);
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(text, x, y);
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#f6ead3'); g.addColorStop(1, '#e9d3ad');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // shoji lattice
  ctx.strokeStyle = 'rgba(150,115,70,0.10)'; ctx.lineWidth = 2;
  const cell = 46 * S;
  for (let x = (W / 2) % cell; x < W; x += cell) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, (TY + 80) * S); ctx.stroke(); }
  for (let y = cell * 0.7; y < (TY + 80) * S; y += cell * 1.4) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
}
function drawStandAndTable() {
  // table
  const tTop = 80;
  const g = ctx.createLinearGradient(0, tTop, 0, tTop + 120);
  g.addColorStop(0, '#9a6a3c'); g.addColorStop(0.08, '#83562d'); g.addColorStop(1, '#5e3b1d');
  ctx.fillStyle = g; ctx.fillRect(-OX / S - 10, tTop, 360 + 2 * OX / S + 20, 400);
  ctx.strokeStyle = 'rgba(40,20,5,0.18)'; ctx.lineWidth = 1.2;
  for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(-OX / S, tTop + 14 + i * 13); ctx.bezierCurveTo(100, tTop + 10 + i * 13, 260, tTop + 20 + i * 13, 360 + OX / S, tTop + 12 + i * 13); ctx.stroke(); }
  // stand (lacquered pedestal)
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(CX, tTop + 2, 70, 8, 0, 0, Math.PI * 2); ctx.fill();
  const sg = ctx.createLinearGradient(CX - STAND_W / 2, 0, CX + STAND_W / 2, 0);
  sg.addColorStop(0, '#2a1a12'); sg.addColorStop(0.4, '#4a2c1c'); sg.addColorStop(1, '#22150e');
  ctx.fillStyle = sg; rr(CX - STAND_W / 2, 0, STAND_W, 80, 4); ctx.fill();
  ctx.fillStyle = '#b8862e'; ctx.fillRect(CX - STAND_W / 2, 0, STAND_W, 4);
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(CX - STAND_W / 2 + 8, 8, 6, 66);
}
function drawBlock(b) {
  const w = b.gw, h = b.gh;
  let alpha = 1;
  if (b.knockedAt) alpha = Math.max(0, 1 - Math.max(0, now - b.knockedAt - 1.8) / 0.7);
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; rr(-w / 2 + 2, -h / 2 + 3, w, h, 4); ctx.fill();
  let base = b.col;
  if (b.mat === 'ice') base = '#9fdcf0';
  if (b.mat === 'iron') base = '#5d636b';
  if (b.mat === 'rubber') base = '#a3433a';
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, shade(base, 0.25)); g.addColorStop(0.5, base); g.addColorStop(1, shade(base, -0.25));
  ctx.fillStyle = g; rr(-w / 2, -h / 2, w, h, 4); ctx.fill();
  ctx.strokeStyle = shade(base, -0.4); ctx.lineWidth = 1.2; ctx.stroke();
  if (b.mat === 'wood') {
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-w / 2 + 6, -h * 0.15); ctx.bezierCurveTo(-10, -h * 0.3, 10, h * 0.05, w / 2 - 6, -h * 0.1); ctx.stroke();
  } else if (b.mat === 'ice') {
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-w / 2 + 10, -h / 2 + 5); ctx.lineTo(-w / 2 + 26, -h / 2 + 5); ctx.moveTo(w / 2 - 30, h / 2 - 6); ctx.lineTo(w / 2 - 12, h / 2 - 6); ctx.stroke();
  } else if (b.mat === 'iron') {
    ctx.fillStyle = '#9aa1a8';
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * (w / 2 - 9), 0, 3, 0, Math.PI * 2); ctx.fill(); }
  } else if (b.mat === 'rubber') {
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2;
    for (let x = -w / 2 + 12; x < w / 2 - 6; x += 12) { ctx.beginPath(); ctx.moveTo(x, -h / 2 + 4); ctx.lineTo(x, h / 2 - 4); ctx.stroke(); }
  }
  if (b.mat !== 'wood' && h >= 30) {
    ctx.font = `800 12px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = b.mat === 'ice' ? 'rgba(30,80,110,0.8)' : 'rgba(255,255,255,0.85)';
    ctx.fillText(TX[b.mat], 0, 1);
  }
  ctx.restore();
}
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = (c) => Math.max(0, Math.min(255, Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k))));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function drawHead(b, mood) {
  ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
  const w = HEAD_W, h = HEAD_H;
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(3, 4, w / 2, h / 2, 0, 0, Math.PI * 2); ctx.fill();
  // body
  const g = ctx.createRadialGradient(-10, -14, 4, 0, 0, w * 0.7);
  g.addColorStop(0, '#f2554a'); g.addColorStop(1, '#b71e16');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, [28, 28, 10, 10]); ctx.fill();
  // gold belly line
  ctx.strokeStyle = '#e8b33c'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, h / 2 - 2, 20, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  // face
  ctx.fillStyle = '#fff6e6';
  ctx.beginPath(); ctx.ellipse(0, -6, 21, 17, 0, 0, Math.PI * 2); ctx.fill();
  // brows
  ctx.strokeStyle = '#1d1d1d'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  const worried = mood === 'worried', sad = mood === 'sad';
  ctx.beginPath();
  ctx.moveTo(-15, -16 + (worried ? 3 : 0)); ctx.quadraticCurveTo(-9, worried ? -18 : -21, -3, -17 - (worried ? 2 : 0));
  ctx.moveTo(15, -16 + (worried ? 3 : 0)); ctx.quadraticCurveTo(9, worried ? -18 : -21, 3, -17 - (worried ? 2 : 0));
  ctx.stroke();
  // eyes
  if (sad) {
    ctx.lineWidth = 2;
    for (const sx of [-9, 9]) { ctx.beginPath(); ctx.moveTo(sx - 3, -11); ctx.lineTo(sx + 3, -5); ctx.moveTo(sx + 3, -11); ctx.lineTo(sx - 3, -5); ctx.stroke(); }
  } else {
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#1d1d1d'; ctx.lineWidth = 1.4;
    for (const sx of [-9, 9]) { ctx.beginPath(); ctx.arc(sx, -8, 5.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = '#1d1d1d';
    const look = worried ? 1.6 : 0;
    for (const sx of [-9, 9]) { ctx.beginPath(); ctx.arc(sx + (sx < 0 ? -look : look), -8 - look, 2.6, 0, Math.PI * 2); ctx.fill(); }
  }
  // mustache & mouth
  ctx.strokeStyle = '#1d1d1d'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-10, 2); ctx.quadraticCurveTo(-4, -1, 0, 2); ctx.quadraticCurveTo(4, -1, 10, 2); ctx.stroke();
  ctx.beginPath(); if (worried || sad) ctx.arc(0, 8, 3, Math.PI * 1.1, Math.PI * 1.9); else ctx.arc(0, 4, 3.5, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  // gold kanji-ish mark on belly
  ctx.fillStyle = '#e8b33c'; ctx.font = `900 11px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(LANG === 'ja' ? '福' : '★', 0, h / 2 - 9);
  ctx.restore();
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground();
  if (!engine) { drawPreview(); }
  const sh = shake > 0 ? (Math.random() - 0.5) * 10 * shake / 0.4 : 0;
  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * (OX + sh), DPR * TY * S);
  if (engine) {
    drawStandAndTable();
    for (const b of flying) drawBlock(b);
    for (const b of tower) drawBlock(b);
    const mood = (state === 'play' && phase === 'crash') ? 'sad' : (Math.abs(head.angle) > 0.12 || head.speed > 2.5) ? 'worried' : 'calm';
    drawHead(head, mood);
  }
  // trail (swipe streak)
  if (trail.length > 1) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 1; i < trail.length; i++) {
      const a = 1 - (now - trail[i].t) / 0.14;
      if (trail[i].t - trail[i - 1].t > 0.05) continue;
      ctx.strokeStyle = `rgba(255,255,255,${0.75 * a})`; ctx.lineWidth = 7 * a + 1;
      ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
    }
  }
  for (const p of parts) {
    ctx.fillStyle = `rgba(${p.col},${(p.soft ? 0.35 : 1) * p.life / p.max})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.life * 2.2);
    ctx.font = `900 ${f.size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,248,235,0.9)'; ctx.strokeText(f.txt, f.x, f.y);
    ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, f.y);
    ctx.globalAlpha = 1;
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (state === 'title') drawTitle();
  else if (state === 'play') drawHUD();
  else drawOver();
}
// title preview tower (static drawing, no physics)
const preview = (() => {
  const list = []; let y = 0;
  for (let i = 0; i < 4; i++) { list.push({ position: { x: CX, y: y - 17 }, angle: 0, gw: BW, gh: 34, mat: 'wood', col: WOOD_COLS[(i + 1) % WOOD_COLS.length] }); y -= 34; }
  return { list, head: { position: { x: CX, y: y - HEAD_H / 2 }, angle: 0, speed: 0 } };
})();
function drawPreview() {
  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * TY * S);
  drawStandAndTable();
  const t = now;
  for (const b of preview.list) drawBlock(b);
  preview.head.angle = Math.sin(t * 2) * 0.03;
  drawHead(preview.head, 'calm');
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function drawHUD() {
  const g = ctx.createLinearGradient(0, 0, 0, 74);
  g.addColorStop(0, 'rgba(90,55,25,0.22)'); g.addColorStop(1, 'rgba(90,55,25,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 74);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left'; ctx.fillStyle = '#3d2614'; ctx.font = `900 28px ${FONT}`;
  ctx.fillText(String(score), 16, 28);
  const t = Math.ceil(timeLeft);
  drawText(TX.sec(t), W - 16, 28, 26, '900', t <= 5 ? '#c4271b' : '#3d2614', 'right', W * 0.4);
  drawText(TX.stage(stage), W / 2, 28, 15, '700', 'rgba(61,38,20,0.75)', 'center', W * 0.3);
  if (streak >= 2) drawText(`${TX.clean} ×${streak}`, 16, 56, 14, '800', '#d8321e', 'left', W * 0.5);
  if (playT < 4.5) {
    const a = Math.min(1, 4.5 - playT);
    ctx.globalAlpha = a;
    const y = H - 34 * S - 8;
    fitFont(TX.hint, 16, '800', W - 48);
    const tw = ctx.measureText(TX.hint).width;
    ctx.fillStyle = 'rgba(40,22,8,0.72)'; rr(W / 2 - tw / 2 - 16, y - 18, tw + 32, 36, 18); ctx.fill();
    drawText(TX.hint, W / 2, y, 16, '800', '#ffe7b0', 'center', W - 48);
    ctx.globalAlpha = 1;
  }
}
function drawTitle() {
  const cx = W / 2;
  drawText(TX.pre, cx, H * 0.11, 22, '900', '#d8321e');
  drawText(TX.title, cx, H * 0.11 + 44, 42, '900', '#3d2614');
  const y0 = H * 0.11 + 96;
  drawText(TX.how1, cx, y0, 15, '700', '#4a2f19');
  drawText(TX.how2, cx, y0 + 26, 14, '600', 'rgba(74,47,25,0.88)');
  drawText(TX.how3, cx, y0 + 50, 14, '600', 'rgba(74,47,25,0.75)');
  const a = 0.55 + 0.45 * Math.sin(now * 3.2);
  const sy = H - 34 * S - 8;
  fitFont(TX.start, 20, '900', W - 48);
  const tw = ctx.measureText(TX.start).width;
  ctx.fillStyle = `rgba(40,22,8,${0.65 * a + 0.15})`; rr(cx - tw / 2 - 20, sy - 21, tw + 40, 42, 21); ctx.fill();
  drawText(TX.start, cx, sy, 20, '900', '#fff3d6', 'center', W - 48);
  if (best > 0) drawText(`${TX.best} ${best}`, cx, y0 + 80, 14, '700', 'rgba(74,47,25,0.7)');
}
function drawOver() {
  ctx.fillStyle = `rgba(40,22,8,${Math.min(0.6, stateT * 1.2)})`; ctx.fillRect(0, 0, W, H);
  const cx = W / 2;
  drawText(TX.timeup, cx, H * 0.24, 22, '800', '#ffe7b0');
  drawText(String(score), cx, H * 0.36, 64, '900', '#fff8ea');
  drawText(TX.detail(stage, knocked, cleanCount), cx, H * 0.36 + 48, 14, '700', 'rgba(255,240,215,0.85)');
  if (isNewBest) drawText(TX.newBest, cx, H * 0.36 + 84, 20, '900', '#ffcf5a');
  else drawText(`${TX.best} ${best}`, cx, H * 0.36 + 84, 17, '800', 'rgba(255,240,215,0.9)');
  if (stateT > 0.7) {
    const a = 0.55 + 0.45 * Math.sin(now * 3.2);
    drawText(TX.again, cx, H * 0.7, 19, '900', `rgba(255,255,255,${a})`);
  }
}

// ---------- loop ----------
let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const t = ts / 1000;
  let dt = last ? t - last : 0.016;
  last = t;
  dt = Math.min(0.05, Math.max(0, dt));
  update(dt);
  draw();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
