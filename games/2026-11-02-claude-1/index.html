<script>

const $ = (id) => document.getElementById(id);

let save = { best: 0, bestStrip: 0 };

// ---------- constants ----------
const CM = 4;             // 1 unit = 4 cm
const W_BREAK = 0.10, W_IDEAL = 0.24, W_SPOT = 0.27, W_THICK = 0.42, W_MAX = 0.7;
const N = 512, TEX_H = 256;
const CY = 0.3, TABLE_Y = -2.3;
const PHI_K = -0.42;      // knife world angle (left of front)
const FRUITS = [

  { rx: 0.95, ry: 0.78, lobe: 0.035, dip: 0.12, point: 0, spots: 2, seed: 22, goal: 200 },
  { rx: 0.98, ry: 0.74, lobe: 0.075, dip: 0.14, point: 0, spots: 4, seed: 33, goal: 210 },
  { rx: 0.80, ry: 1.10, lobe: 0.02, dip: 0.04, point: 0.55, spots: 5, seed: 44, goal: 220 },
  { rx: 0.92, ry: 1.22, lobe: 0.025, dip: 0.05, point: 0.6, spots: 7, seed: 55, goal: 290 },

const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

// ---------- renderer ----------

const camera = new THREE.PerspectiveCamera(48, 0.56, 0.1, 60);

camera.lookAt(0, -0.25, 0);
let VW = 360, VH = 640, pxPerUnit = 94;
function resize() {
  VW = Math.max(1, innerWidth); VH = Math.max(1, innerHeight);
  renderer.setSize(VW, VH, false);
  const asp = VW / VH;
  const vfov = Math.max(46, 2 * Math.atan(0.25 / asp) * 180 / Math.PI);
  camera.fov = vfov; camera.aspect = asp; camera.updateProjectionMatrix();
  pxPerUnit = VH / (2 * 7.8 * Math.tan(vfov * Math.PI / 360));
}
addEventListener('resize', resize); resize();

// background: dusk sky with a persimmon tree
{
  const c = document.createElement('canvas'); c.width = 256; c.height = 512;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#2c2448'); gr.addColorStop(0.35, '#7a4a6a'); gr.addColorStop(0.62, '#e98a5a'); gr.addColorStop(0.8, '#f6c27a'); gr.addColorStop(1, '#5a3a2a');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 512);
  g.fillStyle = 'rgba(60,40,60,.55)';
  g.beginPath(); g.moveTo(0, 360); for (let x = 0; x <= 256; x += 16) g.lineTo(x, 345 - 22 * Math.sin(x / 40) - 10 * Math.sin(x / 13)); g.lineTo(256, 512); g.lineTo(0, 512); g.fill();
  // branches

  const br = (x, y, a, l, w, d) => { if (d > 5 || l < 6) return; const x2 = x + Math.cos(a) * l, y2 = y + Math.sin(a) * l; g.lineWidth = w; g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke(); if (d > 3 && (x2 * 7 + y2 * 3) % 5 < 2.2) { g.fillStyle = '#ff8a2a'; g.beginPath(); g.arc(x2, y2 + 4, 3.4, 0, TAU); g.fill(); } br(x2, y2, a - 0.45, l * 0.72, w * 0.7, d + 1); br(x2, y2, a + 0.38, l * 0.68, w * 0.7, d + 1); };
  br(256, 120, Math.PI + 0.25, 60, 7, 0); br(0, 70, -0.15, 50, 6, 1);

}
scene.add(new THREE.HemisphereLight(0xffe0c0, 0x4a3020, 1.1));
const sun = new THREE.DirectionalLight(0xffd3a0, 2.4); sun.position.set(-3, 5, 5); scene.add(sun);
const rim = new THREE.DirectionalLight(0x9fb4ff, 0.9); rim.position.set(3, 2, -4); scene.add(rim);

// table
{
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#7a4e2c'; g.fillRect(0, 0, 256, 256);
  const r = rng(7);
  for (let i = 0; i < 70; i++) { g.strokeStyle = `rgba(${r() < .5 ? '50,28,12' : '150,100,60'},${0.15 + r() * 0.2})`; g.lineWidth = 1 + r() * 2; g.beginPath(); const y = r() * 256; g.moveTo(0, y); g.bezierCurveTo(80, y + (r() - .5) * 20, 170, y + (r() - .5) * 20, 256, y + (r() - .5) * 10); g.stroke(); }
  for (let i = 1; i < 4; i++) { g.fillStyle = 'rgba(30,15,5,.5)'; g.fillRect(0, i * 64 - 1, 256, 2); }
  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(2, 2);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(14, 10), new THREE.MeshStandardMaterial({ map: tx, roughness: 0.8 }));
  m.rotation.x = -Math.PI / 2; m.position.set(0, TABLE_Y, 1); scene.add(m);
  // newspaper sheet under the peels
  const pc = document.createElement('canvas'); pc.width = 128; pc.height = 128; const pg = pc.getContext('2d');
  pg.fillStyle = '#e8e0cc'; pg.fillRect(0, 0, 128, 128); pg.fillStyle = 'rgba(60,60,60,.35)';
  for (let y = 8; y < 124; y += 6) for (let x = 6; x < 122; x += 3 + (y * x % 5)) if ((x + y) % 7) pg.fillRect(x, y, 2, 3);

  const pm = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 2.6), new THREE.MeshStandardMaterial({ map: ptx, roughness: 0.95 }));

  const sm = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 1.4), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false }));

}
// eaves beam and rope
const EAVE_Y = 2.05;
{
  const beam = new THREE.Mesh(new THREE.BoxGeometry(8, 0.28, 0.4), new THREE.MeshStandardMaterial({ color: 0x3b2618, roughness: 0.9 }));
  beam.position.set(0, EAVE_Y + 0.42, -0.9); scene.add(beam);
}
const SLOT_X = [-1.3, -0.65, 0, 0.65, 1.3];

// ---------- fruit ----------
function makeProfile(f) {
  const M = 400, xs = [], ys = [], ss = [];
  let s = 0, px = 0, py = 0;
  for (let i = 0; i <= M; i++) {
    const t = i / M * Math.PI;
    let x = f.rx * Math.sin(t) * (1 - f.point * Math.pow(t / Math.PI, 3) * 0.6);
    let y = f.ry * Math.cos(t) - f.dip * f.ry * Math.exp(-Math.pow(t / 0.42, 2)) + (f.point ? -f.point * 0.12 * Math.pow(t / Math.PI, 6) : 0);
    if (i) s += Math.hypot(x - px, y - py);
    xs.push(x); ys.push(y); ss.push(s); px = x; py = y;
  }
  const L = s;
  const at = (q) => { // q = arc length
    q = clamp(q, 0, L);
    let lo = 0, hi = M; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ss[m] < q) lo = m; else hi = m; }
    const k = (q - ss[lo]) / Math.max(1e-6, ss[hi] - ss[lo]);
    return { x: xs[lo] + (xs[hi] - xs[lo]) * k, y: ys[lo] + (ys[hi] - ys[lo]) * k, dx: xs[hi] - xs[lo], dy: ys[hi] - ys[lo] };
  };
  const sAtT = (t) => ss[Math.round(t / Math.PI * M)];
  return { L, at, s0: sAtT(0.30), sEnd: sAtT(Math.PI - 0.3) };
}

let F = null; // current fruit state
function buildFruit(idx) {
  const f = FRUITS[idx];
  const P = makeProfile(f);
  const lob = (th) => 1 + f.lobe * Math.cos(4 * th);
  // texture
  const tc = document.createElement('canvas'); tc.width = N; tc.height = TEX_H;
  const g = tc.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, TEX_H);
  gr.addColorStop(0, '#b8481c'); gr.addColorStop(0.18, '#e0602a'); gr.addColorStop(0.6, '#ea6d2c'); gr.addColorStop(1, '#d4521f');
  g.fillStyle = gr; g.fillRect(0, 0, N, TEX_H);
  const r = rng(f.seed);
  for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(${r() < .5 ? '255,170,90' : '150,40,10'},${0.05 + r() * 0.08})`; g.fillRect(r() * N, r() * TEX_H, 1 + r() * 2, 1 + r() * 2); }
  // lobe grooves
  for (let k = 0; k < 4; k++) { g.fillStyle = 'rgba(120,30,8,.10)'; g.fillRect(((k + 0.5) / 4) * N - 3, 0, 6, TEX_H * 0.8); }
  const spots = [];
  for (let i = 0; i < f.spots; i++) {
    const s = P.s0 + 0.6 + r() * (P.sEnd - P.s0 - 0.9), th = r() * TAU, rad = 0.12 + r() * 0.06;
    spots.push({ s, th, rad });
    const rr = P.at(s).x * lob(th);
    const cx = th / TAU * N, cy = s / P.L * TEX_H, ex = rad / Math.max(0.2, rr) / TAU * N, ey = rad / P.L * TEX_H;
    for (const ox of [-N, 0, N]) {
      g.fillStyle = 'rgba(90,40,12,.55)'; g.beginPath(); g.ellipse(cx + ox, cy, ex * 1.25, ey * 1.25, 0, 0, TAU); g.fill();
      for (let q = 0; q < 6; q++) { g.fillStyle = 'rgba(45,20,6,.85)'; g.beginPath(); g.ellipse(cx + ox + (r() - .5) * ex, cy + (r() - .5) * ey, ex * (0.35 + r() * 0.3), ey * (0.35 + r() * 0.3), r() * 3, 0, TAU); g.fill(); }
    }
  }
  const tex = new THREE.CanvasTexture(tc); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  // geometry
  const NT = 96, NS = 72;
  const pos = [], uv = [], idxs = [];
  for (let j = 0; j <= NS; j++) {
    const s = j / NS * P.L, p = P.at(s);
    for (let i = 0; i <= NT; i++) {
      const th = i / NT * TAU, rr = p.x * lob(th);
      pos.push(rr * Math.sin(th), p.y, rr * Math.cos(th)); uv.push(i / NT, 1 - j / NS);
    }
  }
  for (let j = 0; j < NS; j++) for (let i = 0; i < NT; i++) { const a = j * (NT + 1) + i, b = a + NT + 1; idxs.push(a, b, a + 1, b, b + 1, a + 1); }

  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idxs); geo.computeVertexNormals();
  { const n = geo.attributes.normal; for (let j = 0; j <= NS; j++) { const a = j * (NT + 1), b = a + NT; const x = n.getX(a) + n.getX(b), y = n.getY(a) + n.getY(b), z = n.getZ(a) + n.getZ(b), l = Math.hypot(x, y, z) || 1; n.setXYZ(a, x / l, y / l, z / l); n.setXYZ(b, x / l, y / l, z / l); } }

  const mesh = new THREE.Mesh(geo, mat);
  const group = new THREE.Group(); group.add(mesh);
  // calyx
  const top = P.at(0);
  const cal = new THREE.Group();
  const leafM = new THREE.MeshStandardMaterial({ color: 0x5d5426, roughness: 0.85 });
  for (let k = 0; k < 4; k++) {
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), leafM);
    leaf.scale.set(0.34 * f.rx, 0.05, 0.17 * f.rx); leaf.position.set(0.2 * f.rx, 0, 0);
    const hold = new THREE.Group(); hold.add(leaf); hold.rotation.y = k * Math.PI / 2 + 0.6; hold.rotation.z = 0; leaf.rotation.z = 0.12;
    cal.add(hold);
  }
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.05, 0.2, 8), new THREE.MeshStandardMaterial({ color: 0x4a3420, roughness: 0.9 }));
  stem.position.y = 0.1; cal.add(stem);
  const twig = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.4, 6), stem.material);
  twig.rotation.z = Math.PI / 2; twig.position.y = 0.2; cal.add(twig);
  cal.position.y = top.y + 0.02; group.add(cal);
  group.position.set(3.2, CY, 0);
  scene.add(group);
  const B = new Float32Array(N).fill(P.s0);
  F = { idx, f, P, lob, tex, g, group, mesh, B, spots, alpha: 0.6, sk: P.s0 + W_IDEAL, wC: F ? F.wC : 0.24, gotGoal: false, ph: 0, spd: 0, lastCol: -1, strips: 0, longest: 0, done: false, enter: 0, dirty: false };
  F.lastCol = colOf(PHI_K - F.alpha);
  return F;
}
function colOf(th) { return Math.floor(mod(th, TAU) / TAU * N) % N; }
function surf(th, s, out = 0) {
  const p = F.P.at(s), rr = p.x * F.lob(th) + out, ph = th + F.alpha;
  // outward normal from profile tangent
  const tl = Math.hypot(p.dx, p.dy) || 1, nx = p.dy / tl, ny = -p.dx / tl;
  return { x: F.group.position.x + rr * Math.sin(ph), y: F.group.position.y + p.y, z: rr * Math.cos(ph), nr: nx, ny, ph, r: p.x * F.lob(th) };
}

// ---------- knife + guide ----------

// ---------- loop ----------
let lastT = performance.now();
const _dry = new THREE.Color(0.62, 0.42, 0.34), _m = new THREE.Matrix4(), _x = new THREE.Vector3(), _y = new THREE.Vector3(), _zz = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  stateT += dt;
  if (state === 'title') {
    if (!F) { buildFruit(0); F.group.position.x = 0; F.enter = 1; }
    F.alpha -= dt * 0.4; F.group.rotation.y = F.alpha;
  }
  if (F) {
    if (F.enter < 1 && state === 'peel') { F.enter = Math.min(1, F.enter + dt * 1.8); const e = 1 - Math.pow(1 - F.enter, 3); F.group.position.x = 3.2 * (1 - e); F.lastCol = colOf(PHI_K - F.alpha); }
    F.group.rotation.y = F.alpha;
    if (F.dirty) { F.tex.needsUpdate = true; F.dirty = false; }
    if (F.fly) {
      F.fly.t = Math.min(1, F.fly.t + dt * 0.9);
      const e = F.fly.t < 0.5 ? 2 * F.fly.t * F.fly.t : 1 - Math.pow(-2 * F.fly.t + 2, 2) / 2;
      const sc = 1 - 0.68 * e;
      const tx = SLOT_X[F.fly.slot], ty = EAVE_Y - 0.1 - F.f.ry * 0.32;
      F.group.position.set(F.fly.from.x + (tx - F.fly.from.x) * e, F.fly.from.y + (ty - F.fly.from.y) * e + Math.sin(e * Math.PI) * 0.5, -0.6 * e);
      F.group.scale.setScalar(sc);
      F.alpha += dt * 1.2 * (1 - e);
      if (F.fly.t >= 1) {
        // string
        const top = EAVE_Y + 0.3, by = F.group.position.y + (F.f.ry * 0.95 + 0.2) * 0.32;
        const str = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, top - by, 4), new THREE.MeshStandardMaterial({ color: 0xe8dcc0 }));
        str.position.set(tx, (top + by) / 2, -0.6); scene.add(str); hung.push(str);
        hung.push(F.group); F.fly = null; F.hungAt = now;
      }
    }
  }
  if (state === 'final') { // the hanging fruit slowly dry into hoshigaki
    const k = Math.min(1, dt * 0.5);
    for (const h of hung) if (h.isGroup && h.children[0].material.color) { h.children[0].material.color.lerp(_dry, k); h.scale.y += (0.27 - h.scale.y) * k; }
  }
  // knife & guide
  if (state === 'peel' && F && !F.done) {
    const th = PHI_K - F.alpha;
    F.spd += (cutRate / Math.max(dt, 0.016) - F.spd) * Math.min(1, dt * 6);
    if (cutRate <= 0) F.sk += (F.B[colOf(th)] - F.sk) * Math.min(1, dt * 10);
    const kp = surf(th, F.sk, 0.01);
    const p = F.P.at(F.sk), tl = Math.hypot(p.dx, p.dy) || 1;
    const ph = kp.ph, nr = p.dy / tl, ny = -p.dx / tl;
    _zz.set(nr * Math.sin(ph), ny, nr * Math.cos(ph)).normalize();
    _x.set(-Math.cos(ph), 0, Math.sin(ph));
    _x.addScaledVector(_zz, -_x.dot(_zz)).normalize();
    _x.applyAxisAngle(_zz, 0.3);
    _y.crossVectors(_zz, _x);
    _m.makeBasis(_x, _y, _zz); knife.quaternion.setFromRotationMatrix(_m);
    knife.position.set(kp.x, kp.y, kp.z);
    // guide dots on upcoming surface
    const ga = guideGeo.attributes.position.array;
    spotAhead = false;
    for (let i = 0; i < GN; i++) {
      const t2 = th + 0.06 + i * 0.075, c = colOf(t2);
      const sp = surf(t2, Math.min(F.P.sEnd, F.B[c] + F.wC), 0.02);
      ga[i * 3] = sp.x; ga[i * 3 + 1] = sp.y; ga[i * 3 + 2] = sp.z;
    }
    guideGeo.attributes.position.needsUpdate = true;
    for (const s of F.spots) {
      const c = colOf(s.th);
      const dth = mod(s.th - th, TAU);
      if (dth * Math.max(0.3, F.P.at(s.s).x) < 1.7 && s.s + s.rad * 0.8 > F.B[c] && s.s - s.rad * 0.8 < F.B[c] + Math.max(F.wC, W_SPOT) + 0.08) spotAhead = true;
    }
    // gauge
    const w = F.wC, ja = jitterAmp();
    const sp = toScreen(kp);
    const gEl = $('gauge');
    gEl.style.display = F.enter >= 1 ? 'block' : 'none';
    gEl.style.left = clamp(sp.x - 118, 4, VW - 100) + 'px'; gEl.style.top = clamp(sp.y - 14, 70, VH - 60) + 'px';
    gEl.style.setProperty('--br', (spotAhead ? W_SPOT : W_BREAK) / 0.6 * 100 + '%');
    $('mk').style.left = clamp(w / 0.6, 0, 1) * 100 + '%';
    $('jb').style.left = clamp((w - ja) / 0.6, 0, 1) * 100 + '%'; $('jb').style.width = clamp(ja * 2 / 0.6, 0, 1) * 100 + '%';
    const lb = $('glb');
    if (spotAhead) { lb.textContent = T.spot; lb.style.color = '#ffb0a0'; }
    else if (w < W_BREAK) { lb.textContent = T.thin + '!!'; lb.style.color = '#ff9c8c'; }
    else if (w < 0.2) { lb.textContent = T.thin; lb.style.color = '#ffe08a'; }
    else if (w < W_THICK) { lb.textContent = T.ok; lb.style.color = '#c9f5b8'; }
    else { lb.textContent = T.thick; lb.style.color = '#f3e2c4'; }
  }
  // strips
  const pin = active && F ? surf(PHI_K - F.alpha, F.sk, 0.02) : null;
  for (const st of strips) stepStrip(st, dt, st === active ? pin : null);
  // audio cutting
  if (AC && cutG) {
    const rate = cutRate / Math.max(dt, 0.016); cutRate = 0;
    cutG.gain.setTargetAtTime(Math.min(0.22, rate * 0.05), AC.currentTime, 0.04);
    cutF.frequency.setTargetAtTime(1500 + clamp(0.4 - lastW, 0, 0.35) * 9000, AC.currentTime, 0.05);
  }
  if (hintT > 0) { hintT -= dt; if (hintT <= 0) $('hint').style.opacity = 0; }
  if (state === 'peel') updateHud();
  renderer.render(scene, camera);
}
showTitleBest();
requestAnimationFrame(frame);
</script>
