<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Raindrop Bloom</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#152c36;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}</style></head><body><canvas id="garden"></canvas><script>
'use strict';
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en');
const words={ja:{title:'雨つぶ連花',sub:'ひと粒の雨で、庭じゅうに春を',help1:'芽をタップ。4枚になると開花！',help2:'開花すると上下左右にも1枚ずつ。',help3:'雨6粒で、できるだけ連鎖させよう。',start:'タップでスタート',score:'得点',time:'秒',rain:'雨',bed:'庭',hint:'3枚の芽から、連鎖の入口を探そう',chain:'連花',clear:'庭いっぱいに春！',dry:'雨切れ −10',best:'ベスト',record:'ベスト更新！',end:'雨上がり',again:'タップでもう一度',newBed:'次の庭へ',empty:'芽をタップして雨を落とす'},en:{title:'Raindrop Bloom',sub:'One drop can bring spring to the garden',help1:'Tap a bud. Four petals make it bloom!',help2:'A bloom adds one to each adjacent bud.',help3:'Build big chains with six raindrops.',start:'Tap to start',score:'Score',time:'s',rain:'Rain',bed:'Garden',hint:'Look for a three-petal bud to start a chain',chain:'chain',clear:'Spring fills the garden!',dry:'No rain −10',best:'Best',record:'New best!',end:'After the rain',again:'Tap to play again',newBed:'Next garden',empty:'Tap a bud to give it a raindrop'}};
const T=words[LANG]||words.en,c=document.getElementById('garden'),g=c.getContext('2d');let mode='title',cells=[],queue=[],effects=[],labels=[],score=0,best=0,time=0,drops=6,bed=1,chain=0,lastChain=0,anim=false,transition=0,last=0,endAt=0,newBest=false,soundContext;
const X=72,Y=214,GAP=72;const point=i=>({x:X+(i%4)*GAP,y:Y+Math.floor(i/4)*GAP});
const signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch(e){}};
function resize(){const d=Math.min(devicePixelRatio||1,2);c.width=Math.max(1,Math.round(innerWidth*d));c.height=Math.max(1,Math.round(innerHeight*d));g.setTransform(c.width/360,0,0,c.height/640,0,0)}addEventListener('resize',resize);resize();
function tone(freq){try{soundContext=soundContext||new(window.AudioContext||window.webkitAudioContext)();soundContext.resume();const o=soundContext.createOscillator(),v=soundContext.createGain();o.frequency.setValueAtTime(freq,soundContext.currentTime);v.gain.setValueAtTime(.025,soundContext.currentTime);v.gain.exponentialRampToValueAtTime(.001,soundContext.currentTime+.16);o.connect(v);v.connect(soundContext.destination);o.start();o.stop(soundContext.currentTime+.17)}catch(e){}}
function garden(){cells=bed===1?[2,3,2,0,3,3,3,1,1,2,1,3,0,3,2,2]:Array.from({length:16},()=>Math.floor(Math.random()*4));drops=6;queue=[];anim=false;transition=0;lastChain=0;effects=[]}
function begin(){mode='play';score=0;time=0;bed=1;labels=[];garden();signal('start')}
function end(){mode='end';newBest=score>best;best=Math.max(best,score);endAt=performance.now();signal('end',{score})}
function bloom(i){const p=point(i);cells[i]=-1;chain++;score+=5;effects.push({kind:'bloom',x:p.x,y:p.y,t:.65});tone(400+Math.min(chain,12)*45);for(const j of [i%4?i-1:-1,i%4<3?i+1:-1,i>=4?i-4:-1,i<12?i+4:-1])if(j>=0&&cells[j]>=0)queue.push({i:j,at:time+.16,from:i});}
function add(i){if(cells[i]<0)return;cells[i]++;const p=point(i);effects.push({kind:'grow',x:p.x,y:p.y,t:.25});if(cells[i]>=4)bloom(i)}
c.addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='title'){tone(440);begin();return}if(mode==='end'){if(performance.now()-endAt>=700){tone(440);begin()}return}if(anim||transition>0||drops<=0)return;const x=e.clientX/Math.max(1,innerWidth)*360,y=e.clientY/Math.max(1,innerHeight)*640;let i=-1;for(let k=0;k<16;k++){const p=point(k);if(Math.hypot(p.x-x,p.y-y)<33&&cells[k]>=0){i=k;break}}if(i<0)return;drops--;chain=0;anim=true;add(i);tone(280)});c.addEventListener('pointermove',e=>e.preventDefault());c.addEventListener('pointerup',e=>e.preventDefault());
function update(dt){for(const e of effects)e.t-=dt;effects=effects.filter(e=>e.t>0);for(const l of labels){l.t-=dt;l.y-=14*dt}labels=labels.filter(l=>l.t>0);if(mode!=='play')return;time+=dt;if(time>=60){time=60;end();return}if(transition>0){transition-=dt;if(transition<=0){bed++;garden()}return}let work=0;while(queue.length&&queue[0].at<=time&&work++<40){const e=queue.shift();if(e.from!==undefined){const a=point(e.from),b=point(e.i);effects.push({kind:'rain',x:a.x,y:a.y,tx:b.x,ty:b.y,t:.22})}add(e.i)}if(anim&&!queue.length){anim=false;lastChain=chain;if(chain>=3){const bonus=chain*3;score+=bonus;labels.push({x:180,y:493,t:1.3,text:chain+' '+T.chain+'  +'+bonus,color:'#ffe2a2'})}if(cells.every(v=>v<0)){score+=60;labels.push({x:180,y:150,t:1.3,text:T.clear+' +60',color:'#ffe2a2'});transition=1.2}else if(drops===0){score=Math.max(0,score-10);labels.push({x:180,y:150,t:1.3,text:T.dry,color:'#ffadb8'});transition=1.2}}}
function text(s,x,y,size=16,color='#e6f4ed',align='center'){g.fillStyle=color;g.font=`${size}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif`;g.textAlign=align;g.textBaseline='middle';g.fillText(s,x,y,align==='center'?332:150)}
function box(x,y,w,h,color){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,18);g.fill()}
function flower(x,y,n,scale=1){g.save();g.translate(x,y);g.scale(scale,scale);g.strokeStyle='#a1c9ba';g.lineWidth=3;g.beginPath();g.moveTo(0,7);g.lineTo(0,29);g.stroke();g.fillStyle='#5c9d82';g.beginPath();g.ellipse(8,19,10,4,-.4,0,Math.PI*2);g.fill();for(let k=0;k<n;k++){const a=-Math.PI/2+k*Math.PI*2/Math.max(1,n);g.fillStyle=n===3?'#ffcf97':n===2?'#c1cfa7':'#81bdae';g.beginPath();g.ellipse(Math.cos(a)*10,Math.sin(a)*10,7,11,a-Math.PI/2,0,Math.PI*2);g.fill()}g.fillStyle=n===3?'#fff3cd':'#91d7c8';g.beginPath();g.arc(0,0,n?6:10,0,Math.PI*2);g.fill();g.restore()}
function draw(){g.fillStyle='#152c36';g.fillRect(0,0,360,640);for(let i=0;i<16;i++){g.fillStyle='#85bdb311';g.beginPath();g.arc(18+(i*93)%328,90+(i*127)%515,2,0,Math.PI*2);g.fill()}if(mode==='play'){text(T.score+' '+score,18,31,20,'#e6f4ed','left');text(Math.ceil(60-time)+T.time,342,31,20,'#e6f4ed','right');box(18,58,324,4,'#355357');box(18,58,324*(1-time/60),4,'#98dbc9');text(T.bed+' '+bed,180,89,14,'#a3c5c0');text(T.rain+' '+drops+' / 6',180,122,19,'#a9e2de');box(31,174,298,292,'#24403f');for(let i=0;i<16;i++){const p=point(i);box(p.x-32,p.y-32,64,64,cells[i]<0?'#294c44':'#2c504a');if(cells[i]>=0)flower(p.x,p.y-6,cells[i]);else{g.strokeStyle='#527963';g.lineWidth=2;g.beginPath();g.arc(p.x,p.y,12,0,Math.PI*2);g.stroke()}}
for(const e of effects){g.globalAlpha=Math.max(0,e.t/.65);if(e.kind==='rain'){const f=1-e.t/.22;g.fillStyle='#b6f8ed';g.beginPath();g.arc(e.x+(e.tx-e.x)*f,e.y+(e.ty-e.y)*f,4,0,Math.PI*2);g.fill()}else{g.strokeStyle=e.kind==='bloom'?'#ffd7a1':'#b1eadc';g.lineWidth=e.kind==='bloom'?3:2;g.beginPath();g.arc(e.x,e.y,14+(1-e.t/.65)*24,0,Math.PI*2);g.stroke()}}g.globalAlpha=1;if(transition>0)text(T.newBed,180,541,18,'#ffe2a2');else text(anim?chain+' '+T.chain:T.empty,180,541,15,'#b9d3c7');if(time<6)text(T.hint,180,600,13,'#b9d3c7');for(const l of labels){g.globalAlpha=Math.min(1,l.t*3);text(l.text,l.x,l.y,18,l.color)}g.globalAlpha=1}
else if(mode==='title'){text(T.title,180,169,33);text(T.sub,180,215,14,'#adcac3');flower(109,279,3,1.45);text('→',180,280,26,'#a9e2de');flower(250,279,3,1.45);text(T.help1,180,364,15);text(T.help2,180,394,15);text(T.help3,180,424,15);box(35,468,290,56,'#346a61');text(T.start,180,496,18)}else{text(T.end,180,207,27);text(String(score),180,284,65,'#ffd7a1');text(newBest?T.record:T.best+' '+best,180,351,18,'#b6ead4');box(35,424,290,56,'#346a61');text(T.again,180,452,18)}}
function loop(t){const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
