<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Migratory Sluice</title>
<style>
*{box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow:hidden;overscroll-behavior:none;background:#152b43;color:#f6f0d8;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{height:100dvh;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:16px}
header{display:flex;justify-content:space-between;font-size:16px;font-weight:bold}
#weather{text-align:center;font-size:20px}#weather small{display:block;font-size:13px;margin-top:5px}.bird{position:absolute;left:38%;width:24%;height:23px;z-index:1;pointer-events:none;transform:translateY(30%)}#log,#hint{text-align:center;min-height:21px;font-size:14px}
#ponds,#gates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pond{background:#24445d;border-radius:16px;padding:12px 5px;text-align:center;font-size:15px}
.basin{height:min(22dvh,135px);position:relative;background:#1b334c;border-radius:12px;margin:8px;overflow:hidden}
.basin::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(to top,transparent 0 calc(25% - 1px),#b9dfd98c calc(25% - 1px) 25%);pointer-events:none}.water{position:absolute;inset:auto 0 0;background:repeating-linear-gradient(0deg,#468da9 0 21px,#78bfd0 21px 24px);transition:height .2s}
#gates{grid-template-columns:repeat(3,minmax(0,1fr))}
button small{display:block;color:inherit;font-size:13px;margin-top:4px}button{font:inherit;background:#b9dfd9;color:#17334b;border:0;border-radius:12px;min-height:65px;padding:4px;font-size:14px}
#cover{position:absolute;z-index:2;inset:0;background:#152b43f5;display:grid;place-items:center;text-align:center;padding:24px}
h1{font-size:clamp(24px,8vw,36px)}p{line-height:1.7}small{font-size:16px;color:#ffc684}
</style>
<main><header><span id="score"></span><span id="day"></span></header><div id="weather"></div>
<div id="ponds">
 <div class="pond"><b id="west"></b><div class="basin"><div class="water" id="west-water"></div></div><div id="west-target"></div></div>
 <div class="pond"><b id="east"></b><div class="basin"><div class="water" id="east-water"></div></div><div id="east-target"></div></div>
</div><div id="log"></div><div id="gates"><button id="left"></button><button id="stay"></button><button id="right"></button></div><div id="hint"></div></main><div id="cover"></div>
<script>
const language=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en');
const dictionary={
 ja:{title:'渡り鳥の水門',help:'水を左右へ移して、鳥の好む水深に。<br>水門のあと雨や乾燥で両方の水位が変わります。<br>八日間で何羽呼べるかな？',start:'タップでスタート',again:'タップでもう一度',score:'渡り鳥',day:'日',west:'西の池',east:'東の池',need:'希望水位',left:'西へ ←',stay:'移さない',right:'→ 東へ',rain:'雨 +1',sun:'乾燥 −1',cloud:'曇り ±0',hint:'水門を選ぶと一日進みます',visit:'前日の来訪',done:'渡りの季節が終わった',heron:'サギ',duck:'カモ',swan:'ハクチョウ',goose:'ガン',tomorrow:'明日',shortWest:'西',shortEast:'東'},
 en:{title:'Migratory Sluice',help:'Move water between two ponds to attract birds.<br>Rain or drying changes both levels after the gate.<br>How many visitors can you attract in eight days?',start:'Tap to start',again:'Tap to play again',score:'Visitors',day:'Day',west:'West pond',east:'East pond',need:'Preferred depth',left:'← To west',stay:'No transfer',right:'To east →',rain:'Rain +1',sun:'Dry −1',cloud:'Cloud ±0',hint:'Choose a gate to advance one day',visit:'Previous visitors',done:'Migration season ends',heron:'Heron',duck:'Duck',swan:'Swan',goose:'Goose',tomorrow:'Tomorrow',shortWest:'W',shortEast:'E'}
};
const t=dictionary[language]||dictionary.en;
const byId=id=>document.getElementById(id);
const days=[
 {change:0,targets:[3,1]},{change:1,targets:[4,1]},{change:-1,targets:[1,3]},{change:0,targets:[1,3]},
 {change:1,targets:[3,3]},{change:-1,targets:[3,1]},{change:1,targets:[4,2]},{change:-1,targets:[2,2]}
];
const species=['','heron','duck','goose','swan'];
const ponds=['west','east'];
const gates=[['left',1],['stay',0],['right',-1]];
let mode='title',day=0,levels=[2,2],score=0,guard=0,hintTimer,visitors=['—','—'];
const bird='<svg class="bird" viewBox="0 0 40 24" aria-hidden="true"><path fill="#ffe2a3" d="M2 13c8 3 12-1 18-1l3-7q3-5 8-1l7 2-7 3-1 8q-8 10-22 1Z"/></svg>';
function weather(change){return t[change===1?'rain':change===-1?'sun':'cloud']}
const signal=(agf,data={})=>parent.postMessage({agf,...data},'*');
for(const event of ['contextmenu','selectstart','gesturestart'])addEventListener(event,e=>e.preventDefault(),{passive:false});
function overlay(title,body,footer){
 const cover=byId('cover');
 cover.innerHTML='<div><h1>'+title+'</h1><p>'+body+'</p><small>'+footer+'</small></div>';
 cover.style.display='grid';
}
function begin(){
 day=0;levels=[2,2];score=0;visitors=['—','—'];mode='play';
 byId('cover').style.display='none';byId('log').textContent='';byId('hint').textContent=t.hint;
 clearTimeout(hintTimer);hintTimer=setTimeout(()=>byId('hint').textContent='',5000);
 signal('start');draw();
}
function afterGate(transfer){
 const moved=[levels[0]+transfer,levels[1]-transfer];
 if(moved.some(level=>level<0||level>4))return null;
 return moved.map(level=>Math.max(0,Math.min(4,level+days[day].change)));
}
function draw(){
 const forecast=days[day];
 byId('score').textContent=t.score+' '+score;
 byId('day').textContent=t.day+' '+(day+1)+'/8';
 const next=days[day+1];
 byId('weather').innerHTML=weather(forecast.change)+(next?'<small>'+t.tomorrow+' · '+weather(next.change)+' · '+t.shortWest+' '+next.targets[0]+' / '+t.shortEast+' '+next.targets[1]+'</small>':'');
 ponds.forEach((id,i)=>{
  byId(id).textContent=t[id]+' '+levels[i]+'/4';
  const water=byId(id+'-water');
  water.style.height=(levels[i]*25)+'%';
  const basin=water.parentElement;
  basin.querySelector('.bird')?.remove();
  if(visitors[i]!=='—'){
   basin.insertAdjacentHTML('beforeend',bird);
   basin.lastElementChild.style.bottom=Math.min(86,levels[i]*25)+'%';
  }
  const target=forecast.targets[i];
  byId(id+'-target').textContent=t[species[target]]+' · '+t.need+' '+target;
 });
 for(const [id,transfer] of gates){
  const button=byId(id);
  const forecast=afterGate(transfer);
  button.innerHTML=t[id]+'<small>'+(forecast?t.shortWest+' '+forecast[0]+' / '+t.shortEast+' '+forecast[1]:'—')+'</small>';
  button.style.opacity=forecast?'1':'.42';
 }
}
function advance(transfer){
 if(mode!=='play')return;
 const result=afterGate(transfer);
 if(!result)return;
 levels=result;
 visitors=days[day].targets.map((target,i)=>levels[i]===target?t[species[target]]:'—');
 score+=visitors.filter(name=>name!=='—').length;
 byId('log').textContent=t.visit+' · '+visitors.join(' / ');
 if(day===days.length-1){
  draw();mode='end';guard=performance.now()+700;signal('end',{score});
  overlay(t.done,t.score+' '+score,t.again);return;
 }
 day++;draw();
}
for(const [id,transfer] of gates)byId(id).addEventListener('pointerdown',e=>{e.preventDefault();advance(transfer)});
byId('cover').addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(mode==='title'||(mode==='end'&&performance.now()>=guard))begin();
});
overlay(t.title,t.help,t.start);
</script></html>
