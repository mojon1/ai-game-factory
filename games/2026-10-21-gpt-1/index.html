<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>灯り替えの地下室</title><style>html,body{margin:0;width:100%;height:100dvh;overflow:hidden;background:#192c3b;overscroll-behavior:none}*{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}canvas{display:block;width:100vw;height:100dvh}</style><canvas></canvas><script>
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),en=LANG==='en',T=en?{title:'Lantern Cellars',a:'Tap a neighboring tile to move.',b:'Only bridges matching your light are solid.',c:'Switch on pale floors. Two keys open the exit.',start:'Tap to start',keys:'Keys ',floor:'Floor ',fire:'Ember',moon:'Moon',switch:'Switch lantern',hint:'Tap a neighboring floor',need:'Find both keys first',bad:'That bridge needs the other light',white:'Switch on a pale floor',got:'Found a key!',clear:'Cellar crossed',all:'All cellars explored',next:'Tap to continue',again:'Tap to play again',exit:'EXIT'}:{title:'灯り替えの地下室',a:'隣の床をタップして進む。',b:'灯りと同じ色の橋だけ渡れる。',c:'白い床で灯りを替え、鍵2つで出口へ。',start:'タップでスタート',keys:'鍵 ',floor:'地下 ',fire:'火',moon:'月',switch:'灯りを替える',hint:'隣の床をタップして進む',need:'鍵を2つ集めよう',bad:'その橋は灯りが違う',white:'白い床で灯りを替えよう',got:'鍵を見つけた！',clear:'地下室を抜けた',all:'すべての地下室を探索',next:'タップで次へ',again:'タップでもう一度',exit:'出口'};
const maps=[['##E##','#.B.#','#K#K#','#.R.#','##.##','##S##'],['###E#','#K.R#','#.###','#B.K#','##.##','##S##'],['#E###','#B.K#','#.#.#','#KR.#','##.##','##S##']];
const c=document.querySelector('canvas'),g=c.getContext('2d');let scale=1,ox=0,oy=0;function resize(){const w=Math.max(1,innerWidth),h=Math.max(1,innerHeight),d=Math.min(2,devicePixelRatio||1);c.width=w*d;c.height=h*d;scale=Math.min(w/360,h/640);ox=(w-360*scale)/2;oy=(h-640*scale)/2;g.setTransform(d*scale,0,0,d*scale,d*ox,d*oy)}addEventListener('resize',resize);resize();for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});
const signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};let ac;function tone(f){try{ac??=new AudioContext();ac.resume();const o=ac.createOscillator(),v=ac.createGain();o.type='triangle';o.frequency.value=f;v.gain.setValueAtTime(.035,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.13);o.connect(v).connect(ac.destination);o.start();o.stop(ac.currentTime+.14)}catch{}}
let state='title',floor=0,grid=[],px=2,py=5,color=0,keys=0,time=0,age=0,endTime=0,notice='',nt=0,steps=0;
function loadFloor(){grid=maps[floor].map(s=>s.split(''));px=2;py=5;color=floor%2;keys=0;age=0;notice='';state='play';signal('start')}
function tell(s){notice=s;nt=2}
c.addEventListener('pointerdown',e=>{tone(150);if(state==='title'){floor=0;steps=0;loadFloor();return}if(state==='end'){if(time-endTime<.7)return;if(floor===2){floor=0;steps=0}else floor++;loadFloor();return}const x=(e.clientX-ox)/scale,y=(e.clientY-oy)/scale;
if(y>=552&&y<=609){if('RB'.includes(grid[py][px])){tell(T.white);return}color=1-color;tone(color?440:260);return}
const tx=Math.floor((x-30)/60),ty=Math.floor((y-170)/60);if(tx<0||tx>4||ty<0||ty>5||Math.abs(tx-px)+Math.abs(ty-py)!==1)return;const cell=grid[ty][tx];if(cell==='#')return;if((cell==='R'&&color!==0)||(cell==='B'&&color!==1)){tell(T.bad);tone(110);return}if(cell==='E'&&keys<2){tell(T.need);return}px=tx;py=ty;steps++;tone(260+ty*24);if(cell==='K'){keys++;grid[ty][tx]='.';tell(T.got);tone(620)}if(cell==='E'){state='end';endTime=time;signal('end',{score:floor+1});tone(760)}});
function text(s,x,y,size=18,col='#eef0dc',max=326){g.fillStyle=col;g.textAlign='center';g.font='600 '+size+'px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif';g.save();g.translate(x,y);const w=g.measureText(s).width;if(w>max)g.scale(max/w,1);g.fillText(s,0,0);g.restore()}
function key(x,y){g.strokeStyle='#e8bb66';g.lineWidth=4;g.beginPath();g.arc(x-7,y,6,0,7);g.moveTo(x-1,y);g.lineTo(x+13,y);g.lineTo(x+13,y+7);g.moveTo(x+7,y);g.lineTo(x+7,y+5);g.stroke()}
function avatar(x,y){g.fillStyle='#f3e3b4';g.beginPath();g.arc(x,y,11,0,7);g.fill();g.fillStyle=color?'#84cbd7':'#e49b77';g.beginPath();g.arc(x,y+12,9,0,7);g.fill();g.fillStyle='#263849';g.fillRect(x-5,y-2,3,3);g.fillRect(x+2,y-2,3,3)}
function draw(){g.clearRect(-ox/scale,-oy/scale,c.width/scale,c.height/scale);g.fillStyle='#192c3b';g.fillRect(0,0,360,640);
if(state==='title'){text(T.title,180,108,29);g.fillStyle='#dbe4cf';g.fillRect(93,240,54,54);g.fillStyle='#d88864';g.fillRect(153,240,54,54);g.fillStyle='#6dabbc';g.fillRect(213,240,54,54);avatar(120,261);key(240,330);text(T.a,180,421,16);text(T.b,180,453,16);text(T.c,180,485,15);text(T.start,180,578,21);return}
text(T.keys+keys+'/2',75,35,17);text(T.floor+(floor+1)+'/3',280,35,17);text(state==='end'?(floor===2?T.all:T.clear):T.switch+'：'+(color?T.moon:T.fire),180,101,state==='end'?25:20);if(state==='play'&&nt>0)text(notice,180,142,15);
for(let y=0;y<6;y++)for(let x=0;x<5;x++){const k=grid[y][x],cx=60+x*60,cy=200+y*60;if(k==='#'){g.fillStyle='#263b4b';g.beginPath();g.roundRect(cx-27,cy-27,54,54,6);g.fill();continue}g.fillStyle=k==='R'?(color===0?'#d88864':'#694b49'):k==='B'?(color===1?'#6dabbc':'#354f62'):'#dbe4cf';g.beginPath();g.roundRect(cx-27,cy-27,54,54,8);g.fill();if(k==='R'||k==='B'){text(k==='R'?T.fire:T.moon,cx,cy+5,13,k==='R'?'#ffddbf':'#d8f8ff',47);if((k==='R'&&color!==0)||(k==='B'&&color!==1)){g.strokeStyle='#1b2d3b';g.lineWidth=3;g.beginPath();g.moveTo(cx-20,cy+20);g.lineTo(cx+20,cy-20);g.stroke()}}if(k==='K')key(cx,cy);if(k==='E')text(T.exit,cx,cy+5,13,'#29463f',48);if(x===px&&y===py)avatar(cx,cy-5)}
if(state==='play'){g.fillStyle=color?'#467987':'#9d634d';g.beginPath();g.roundRect(30,552,300,57,16);g.fill();text(T.switch,180,588,21);if(age<4)text(T.hint,180,633,13)}else text(floor===2?T.again:T.next,180,586,21)}
let last=0;function frame(ts){const dt=Math.min(.05,Math.max(0,(ts-last)/1000));last=ts;time+=dt;if(state==='play'){age+=dt;nt-=dt}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
