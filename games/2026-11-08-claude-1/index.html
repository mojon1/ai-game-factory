const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);

// ---------- 演出 ----------

let bannerAnim = 0;

// ---------- 配置 ----------

const target = { x: 0, s: 0 };

}
function layDominoes(dt) {

}

// ---------- 波 ----------
function speed() { return 7 + 11 * (1 - Math.exp(-fallen / 600)) + fallen / 500; }

}

// ---------- 流れ ----------

addEventListener('resize', resize); resize();
function updateBestLine() {

}

  $('ovB').textContent = newBest ? TXT.bestNew : `${TXT.best} ${best}`; { const rem = Math.ceil(((curZone + 1) * ZONE_LEN - ds[(n - 1) % MAX]) / 2); $('ovN').innerHTML = TXT.count(fallen, bellsRung) + (curZone < ZONES.length - 1 && rem <= 16 ? '<br>' + TXT.almost(rem) : ''); }

addEventListener('message', (e) => { if (e.data && e.data.agf === 'loaded' && e.data.data) { save = e.data.data; best = save.best || 0; bestZone = save.bestZone || 0; updateBestLine(); } });

addEventListener('pointerdown', (e) => {

  else if (state === 'over') { if (overT < .7) return; start(); }

}, { passive: true });
addEventListener('pointermove', (e) => { if (e.pointerId === finger.id) { finger.x = e.clientX; finger.y = e.clientY; } }, { passive: true });

// ---------- メインループ ----------
let lastT = 0, multShown = 1, titleT = 0;
function frame(ts) {
