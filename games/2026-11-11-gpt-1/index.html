<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>One Breath Bridges</title>
<style>
*{box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow:hidden;overscroll-behavior:none;background:#182f44;color:#fff1cd;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{height:100dvh;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px}
header{width:100%;display:flex;justify-content:space-between;font-size:16px;font-weight:bold}
#scene{display:block;width:100%;height:min(59dvh,390px);border-radius:16px;background:#b6d8d9}
#info,#hint{text-align:center;min-height:22px;font-size:14px}
#pad{font:inherit;width:100%;min-height:72px;background:#e5ba7f;color:#22384b;border:0;border-radius:16px;font-size:19px}
#cover{position:absolute;inset:0;background:#182f44f5;display:grid;place-items:center;text-align:center;padding:24px}
#cover.result{background:linear-gradient(transparent 72%,#182f44 88%);align-items:end;padding:12px 16px 20px}#cover.result h1{font-size:23px;margin:0}#cover.result p{margin:5px}h1{font-size:clamp(24px,8vw,36px)}p{line-height:1.65}small{font-size:16px;color:#e5ba7f}
</style>
<main><header><span id="stage"></span><span id="falls"></span></header><div id="info"></div><canvas id="scene"></canvas><button id="pad"></button><div id="hint"></div></main><div id="cover"></div>
<script>
const lang=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en');
const words={
 ja:{title:'ひと息の渡り台',help:'長押しで距離をため、離してジャンプ。<br>足場に着地し、向こうの旗まで渡ろう。',start:'タップでスタート',again:'タップでもう一度',next:'タップで次へ',stage:'橋',falls:'落下',pad:'押してためる → 離して跳ぶ',hint:'長く押すほど遠くへ跳びます',ready:'次の足場へ',charge:'ためています',distance:'距離',steps:'足場',air:'ジャンプ',land:'着地',fall:'同じ足場からもう一度',done:'向こう岸に着いた',all:'二つの橋を渡った'},
 en:{title:'One Breath Bridges',help:'Hold to charge distance, then release to jump.<br>Land on platforms and reach the flag.',start:'Tap to start',again:'Tap to play again',next:'Tap to continue',stage:'Bridge',falls:'Falls',pad:'Hold to charge · release to jump',hint:'Longer holds make longer jumps',ready:'Aim for the next platform',charge:'Charging',distance:'Range',steps:'Platforms',air:'Jumping',land:'Landed',fall:'Try again from the same platform',done:'Reached the far side',all:'Both bridges crossed'}
};
const t=words[lang]||words.en;
const byId=id=>document.getElementById(id),canvas=byId('scene'),ctx=canvas.getContext('2d');
const maps=[[40,160,290,430],[40,150,310,440,570]];
const gravity=700,jumpVelocity=-280;
let state='title',level=0,index=0,falls=0,x=40,y=250,vx=0,vy=0,last=0,guard=0;
let missedX=null,landedAt=-10000,audio;
let activePointer=null,pressedAt=0,charge=0,hintTimer,lastFall=null;
const signal=(agf,data={})=>parent.postMessage({agf,...data},'*');
for(const event of ['contextmenu','selectstart','gesturestart'])addEventListener(event,e=>e.preventDefault(),{passive:false});
function overlay(title,body,footer){
 const panel=byId('cover');panel.innerHTML='<div><h1>'+title+'</h1><p>'+body+'</p><small>'+footer+'</small></div>';
 panel.classList.toggle('result',state==='end');panel.style.display='grid';
}
function tone(frequency){
 try{audio??=new AudioContext();audio.resume();const oscillator=audio.createOscillator(),gain=audio.createGain();oscillator.type='sine';oscillator.frequency.value=frequency;gain.gain.setValueAtTime(.035,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.15);oscillator.connect(gain).connect(audio.destination);oscillator.start();oscillator.stop(audio.currentTime+.16)}catch{}
}
function resize(){
 const rect=canvas.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);
 canvas.width=Math.max(1,rect.width*d);canvas.height=Math.max(1,rect.height*d);
 ctx.setTransform(canvas.width/320,0,0,canvas.height/340,0,0);
}
addEventListener('resize',resize);
function begin(){
 state='ready';index=0;falls=0;x=maps[level][0];y=250;vx=0;vy=0;activePointer=null;charge=0;lastFall=null;
 byId('cover').style.display='none';byId('info').textContent=t.ready;
 byId('pad').textContent=t.pad;byId('hint').textContent=t.hint;
 clearTimeout(hintTimer);hintTimer=setTimeout(()=>byId('hint').textContent='',5000);
 signal('start');resize();
}
function fall(){
 lastFall={x:missedX??x};falls++;state='ready';x=maps[level][index];y=250;vx=0;vy=0;
 byId('info').textContent=t.fall;
}
function finish(){
 state='end';guard=performance.now()+700;signal('end',{score:falls});
 overlay(level===1?t.all:t.done,t.falls+' '+falls,level===1?t.again:t.next);
}
function frame(now){
 const dt=Math.min(.035,(now-last)/1000||0);last=now;
 if(state==='charge'){
  charge=Math.min(900,now-pressedAt);byId('info').textContent=t.charge+' · '+t.distance+' '+Math.round(Math.max(120,charge)*.2);
 }
 if(state==='air'){
  const previousY=y;
  x+=vx*dt;y+=vy*dt+.5*gravity*dt*dt;vy+=gravity*dt;
  if(vy>0&&previousY<=250&&y>=250){
   const hit=maps[level].findIndex(px=>Math.abs(x-px)<27);
   if(hit<0)missedX=x;
   if(hit>=0){landedAt=now;tone(580);
    index=hit;x=maps[level][hit];y=250;vx=0;vy=0;state='ready';byId('info').textContent=t.land;
    if(index===maps[level].length-1)finish();
   }
  }
  if(y>345)fall();
 }
 draw();requestAnimationFrame(frame);
}
function draw(){
 ctx.fillStyle='#b6d8d9';ctx.fillRect(0,0,320,340);
 ctx.fillStyle='#83b6b6';ctx.beginPath();ctx.moveTo(0,210);ctx.lineTo(85,82);ctx.lineTo(170,210);ctx.lineTo(255,105);ctx.lineTo(320,210);ctx.fill();
 ctx.fillStyle='#5d8d96';ctx.fillRect(0,287,320,53);
 const camera=Math.max(0,x-85);
 ctx.save();ctx.translate(-camera,0);
 if(lastFall){ctx.strokeStyle='#a34c43';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(lastFall.x-6,284);ctx.lineTo(lastFall.x+6,296);ctx.moveTo(lastFall.x+6,284);ctx.lineTo(lastFall.x-6,296);ctx.stroke()}
 if(state==='charge'){const target=x+Math.max(120,charge)*.2;ctx.strokeStyle='#ad7a3d';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(x,264);ctx.lineTo(target,264);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(target,250,5,0,Math.PI*2);ctx.stroke()}
 for(const [i,px] of maps[level].entries()){
  ctx.fillStyle=i===index?'#b98460':'#695d68';ctx.fillRect(px-27,250,54,25);
  ctx.fillStyle='#f4d9a3';ctx.fillRect(px-27,250,54,5);
  if(i===maps[level].length-1){ctx.strokeStyle='#43576b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px,250);ctx.lineTo(px,190);ctx.stroke();ctx.fillStyle='#ae5d53';ctx.fillRect(px,190,21,15)}
 }
 if(performance.now()-landedAt<450){ctx.strokeStyle='#fff0b7';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,250,24,7,0,0,Math.PI*2);ctx.stroke()}
 ctx.fillStyle='#9d4c46';ctx.fillRect(x-8,y-19,16,19);ctx.fillStyle='#f8dfad';ctx.beginPath();ctx.arc(x,y-25,9,0,Math.PI*2);ctx.fill();
 ctx.restore();
 byId('stage').textContent=t.stage+' '+(level+1)+'/2 · '+t.steps+' '+index+'/'+(maps[level].length-1);
 byId('falls').textContent=t.falls+' '+falls;
}
byId('pad').addEventListener('pointerdown',e=>{
 e.preventDefault();if(state!=='ready'||activePointer!==null)return;
 tone(330);activePointer=e.pointerId;pressedAt=performance.now();charge=0;state='charge';byId('pad').setPointerCapture(e.pointerId);
});
byId('pad').addEventListener('pointerup',e=>{
 e.preventDefault();if(e.pointerId!==activePointer)return;
 charge=Math.min(900,performance.now()-pressedAt);activePointer=null;
 missedX=null;tone(430);state='air';vx=Math.max(120,charge)*.25;vy=jumpVelocity;byId('info').textContent=t.air;
});
byId('pad').addEventListener('pointercancel',e=>{if(e.pointerId===activePointer){activePointer=null;state='ready'}});
byId('cover').addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(state==='title')begin();else if(state==='end'&&performance.now()>=guard){level=1-level;begin()}
});
resize();overlay(t.title,t.help,t.start);requestAnimationFrame(frame);
</script></html>
