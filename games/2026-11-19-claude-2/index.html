<script>
'use strict';
for (const t of ['contextmenu', 'selectstart', 'gesturestart']) addEventListener(t, (e) => e.preventDefault(), { passive: false });
const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };

const T = {
  ja: {
    title: 'どすこい！<br>鬼押し土俵',
    how1: 'スワイプで一歩。鬼に当たれば押して前へ出る（押された鬼はその番よろける）。',

    tap: 'タップでスタート', again: 'タップでもう一度', next: 'タップで次へ',

    left: (n) => `残り ${n} 手`,

    yusho: '優勝！', zensho: '全勝優勝！',
    record: (w, l) => `${w} 勝 ${l} 敗`,
    over: '場所終了', reached: (r) => `${r} まで勝ち進んだ`,
    best: (r) => `最高: ${r}`,
    zukan: '決まり手', hakkeyoi: 'はっけよい！', nokotta: 'のこった！',
    matta: (n) => `待った ${n}`,
    wobble: 'びくともしない！もう一押し', danger: 'このままだと押し出される！',
    newKim: '新しい決まり手！',
    two: 'まとめて二人！',
  },
  en: {
    title: 'Oni Sumo<br>Shove!',
    how1: 'Swipe to step. Walk into an oni to shove it and follow through (a shoved oni loses its turn).',
    how2: 'Arrows show each oni\'s next move. Dodge and they run out on their own.',
    how3: 'Push every oni out of the ring within the move limit.',
    tap: 'Tap to start', again: 'Tap to play again', next: 'Tap to continue',
    hint: 'Swipe to move · walk into oni to shove · tap yourself to wait',
    bout: (n) => `Bout ${n} / 8`,
    loss: (n) => `Losses ${n} (3 ends the tournament)`,
    yourTurn: 'Your move', enemyTurn: 'Oni move',
    win: 'Victory!', lose: 'Defeat…', lostBy: { push: 'You were pushed out', time: 'Out of moves' },
    left: (n) => `${n} moves left`,
    turns: (n) => `Won in ${n} moves`,
    retry: 'Retry the same rank',
    yusho: 'Champion!', zensho: 'Perfect Champion!',
    record: (w, l) => `${w} wins ${l} losses`,
    over: 'Tournament over', reached: (r) => `Reached ${r}`,
    best: (r) => `Best: ${r}`,
    zukan: 'Techniques', hakkeyoi: 'Hakkeyoi!', nokotta: 'Nokotta!',
    matta: (n) => `Undo ${n}`,
    wobble: 'It won\'t budge! Push again', danger: 'Stay here and you\'re out!',
    newKim: 'New technique!',
    two: 'Two at once!',
  }
}[LANG === 'ja' ? 'ja' : 'en'];

const RANKS = [
  { ja: '序ノ口', en: 'Jonokuchi', e: 'ss', lim: 12 },
  { ja: '序二段', en: 'Jonidan', e: 'sc', lim: 9 },
  { ja: '三段目', en: 'Sandanme', e: 'ssc', lim: 10 },
  { ja: '幕下', en: 'Makushita', e: 'scc', lim: 8 },
  { ja: '十両', en: 'Juryo', e: 'hss', lim: 13 },
  { ja: '前頭', en: 'Maegashira', e: 'hscc', lim: 10 },
  { ja: '大関', en: 'Ozeki', e: 'hhsc', lim: 13 },
  { ja: '横綱', en: 'Yokozuna', e: 'hhscc', lim: 12 },
];
const rankName = (i) => (LANG === 'ja' ? RANKS[i].ja : RANKS[i].en);
const KIM = {
  tsuki: { ja: '寄り切り', en: 'Yorikiri — drove it out', hj: '押して前へ出る', he: 'shove and follow' },
  densha: { ja: '電車道', en: 'Densha-michi — pushed the whole line', hj: '並んだ鬼をまとめて押す', he: 'push a line of oni' },
  isami: { ja: '勇み足', en: 'Isamiashi — stepped out by itself', hj: '外向きの鬼を俵ぎわへ', he: 'oni facing out at the edge' },
  inashi: { ja: 'いなし', en: 'Inashi — dodged, it charged out', hj: '青鬼の突進をかわす', he: 'dodge a blue charge' },
  nakama: { ja: '仲間割れ', en: 'Friendly fire — oni shoved oni', hj: '鬼に鬼を押させる', he: 'let oni shove oni' },
  utchari: { ja: 'うっちゃり', en: 'Utchari — won at the very edge', hj: '自分が俵ぎわで押し出す', he: 'win from the edge' },
  futari: { ja: '二人出し', en: 'Double ring-out', hj: '1手で2体', he: 'two in one turn' },
};
const KIM_KEYS = Object.keys(KIM);
const kimJ = (k) => KIM[k].ja;
const kimE = (k) => (LANG === 'ja' ? KIM[k].en.split(' — ')[0] : KIM[k].en);

// ---------- save ----------
let save = { z: [], best: -1, yusho: 0 };
addEventListener('message', (e) => {
  if (e.data && e.data.agf === 'loaded' && e.data.data) {
    const d = e.data.data;
    save = { z: Array.isArray(d.z) ? d.z.filter((k) => KIM[k]) : [], best: d.best | 0, yusho: d.yusho | 0 };
    if (mode === 'title') showTitle();
  }
});
try { parent.postMessage({ agf: 'load' }, '*'); } catch (e) {}
const persist = () => { try { parent.postMessage({ agf: 'save', data: save }, '*'); } catch (e) {} };

// ---------- rng ----------
let seed = (Math.random() * 1e9) | 0;
const rng = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

// ---------- rules ----------
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // N E S W
const inRing = (x, y) => { const dx = x - 3, dy = y - 3; return dx * dx + dy * dy <= 10.5; };
const isEdge = (x, y) => DIRS.some(([dx, dy]) => !inRing(x + dx, y + dy));
let S = null;
const at = (St, x, y) => St.ents.find((e) => !e.out && e.x === x && e.y === y);
const foes = (St) => St.ents.filter((e) => e.t !== 'p');
const allOut = (St) => foes(St).every((e) => e.out);

function kimFor(pusher, q, i) {
  if (pusher.t === 'p') { if (isEdge(pusher.x, pusher.y)) return 'utchari'; return i > 0 ? 'densha' : 'tsuki'; }
  return 'nakama';
}

function pushLine(St, sx, sy, d, n, pusher, G, follow) {
  const [dx, dy] = DIRS[d];
  for (let k = 0; k < n; k++) {
    const line = []; let x = sx, y = sy, e;
    while ((e = at(St, x, y))) { line.push(e); x += dx; y += dy; }
    if (!line.length) return;
    if (pusher.t === 'p') {
      const hv = line.filter((q) => q.t === 'h' && !q.stg);
      if (hv.length) {
        hv.forEach((q) => (q.stg = 2));
        G.push({ moves: [{ id: pusher.id, k: 'slap', d }, ...hv.map((q) => ({ id: q.id, k: 'wobble' }))], sfx: 'wobble', shake: 0.06, note: 'wobble' });
        return;
      }
      line.forEach((q) => { if (q.t === 'h') q.stg = 0; });
    }
    const g = { moves: [{ id: pusher.id, k: 'slap', d }], sfx: 'push', shake: 0.1 + 0.04 * line.length, kim: [] };
    for (let i = line.length - 1; i >= 0; i--) {
      const q = line[i]; const nx = q.x + dx, ny = q.y + dy;
      if (!inRing(nx, ny)) {
        q.out = true;
        g.moves.push({ id: q.id, k: 'out', fx: q.x, fy: q.y, tx: nx, ty: ny, d });
        if (q.t === 'p') St.lost = 'push'; else { g.kim.push(kimFor(pusher, q, i)); St.outsThisTurn++; }
        q.x = nx; q.y = ny;
      } else { g.moves.push({ id: q.id, k: 'shove', fx: q.x, fy: q.y, tx: nx, ty: ny }); q.x = nx; q.y = ny; if (q.t !== 'p') q.stun = true; }
    }
    G.push(g);
    if (St.lost) return;
    if (pusher.t === 'p') { // yori: the wrestler follows into the vacated cell
      if (!at(St, sx, sy)) { G.push({ moves: [{ id: 0, k: 'step', fx: pusher.x, fy: pusher.y, tx: sx, ty: sy }], sfx: null }); pusher.x = sx; pusher.y = sy; }
      return;
    }
    if (follow && k < n - 1 && !pusher.out) {
      G.push({ moves: [{ id: pusher.id, k: 'dash', fx: pusher.x, fy: pusher.y, tx: sx, ty: sy }], sfx: null });
      pusher.x = sx; pusher.y = sy; sx += dx; sy += dy;
    }
  }
}

function doPlayer(St, d, G) {
  const p = St.ents[0];
  if (d < 0) { G.push({ moves: [{ id: 0, k: 'shiko' }], sfx: 'shiko', shake: 0.05 }); return true; }
  const [dx, dy] = DIRS[d]; const nx = p.x + dx, ny = p.y + dy;
  if (!inRing(nx, ny)) return false;
  p.face = d;
  if (at(St, nx, ny)) pushLine(St, nx, ny, d, 1, p, G, false);
  else { G.push({ moves: [{ id: 0, k: 'step', fx: p.x, fy: p.y, tx: nx, ty: ny }], sfx: 'step' }); p.x = nx; p.y = ny; }
  return true;
}

function actFoe(St, e, G) {
  if (e.out) return;
  if (e.stg === 2) { e.stg = 1; G.push({ moves: [{ id: e.id, k: 'wobble' }], sfx: null }); return; }
  if (e.stg === 1) e.stg = 0;
  if (e.stun) { e.stun = false; G.push({ moves: [{ id: e.id, k: 'wobble' }], sfx: null }); return; }
  const d = e.dir, [dx, dy] = DIRS[d];
  if (e.t === 'c' && e.mode === 'charge') {
    let x = e.x, y = e.y;
    for (;;) {
      const nx = x + dx, ny = y + dy;
      if (!inRing(nx, ny)) {
        G.push({ moves: [{ id: e.id, k: 'out', fx: e.x, fy: e.y, tx: nx, ty: ny, d }], sfx: 'dash', kim: ['inashi'] });
        e.out = true; e.x = nx; e.y = ny; St.outsThisTurn++; return;
      }
      if (at(St, nx, ny)) break;
      x = nx; y = ny;
    }
    if (x !== e.x || y !== e.y) { G.push({ moves: [{ id: e.id, k: 'dash', fx: e.x, fy: e.y, tx: x, ty: y }], sfx: 'dash' }); e.x = x; e.y = y; }
    pushLine(St, x + dx, y + dy, d, 2, e, G, true);
  } else {
    const nx = e.x + dx, ny = e.y + dy;
    if (!inRing(nx, ny)) { G.push({ moves: [{ id: e.id, k: 'out', fx: e.x, fy: e.y, tx: nx, ty: ny, d }], sfx: 'step', kim: ['isami'] }); e.out = true; e.x = nx; e.y = ny; St.outsThisTurn++; }
    else if (at(St, nx, ny)) pushLine(St, nx, ny, d, 1, e, G, false);
    else { G.push({ moves: [{ id: e.id, k: 'step', fx: e.x, fy: e.y, tx: nx, ty: ny }], sfx: 'step' }); e.x = nx; e.y = ny; }
  }
}

function dirTo(a, b) { if (a.x === b.x) return b.y < a.y ? 0 : 2; return b.x > a.x ? 1 : 3; }
function plan(St) {
  const p = St.ents[0];
  for (const e of foes(St)) {
    if (e.out) continue;
    const opts = [0, 1, 2, 3].filter((d) => inRing(e.x + DIRS[d][0], e.y + DIRS[d][1]));
    if (e.t === 'c') {
      if (e.x === p.x || e.y === p.y) { e.mode = 'charge'; e.dir = dirTo(e, p); continue; }
      e.mode = 'step';
      const ax = Math.abs(p.x - e.x), ay = Math.abs(p.y - e.y);
      const hx = p.x > e.x ? 1 : 3, vy = p.y > e.y ? 2 : 0;
      const c = ax <= ay ? [hx, vy] : [vy, hx];
      e.dir = c.find((d) => opts.includes(d)) ?? opts[0];
    } else {
      e.mode = 'step';
      let best = 1e9, bd = [];
      for (const d of opts) {
        const m = Math.abs(p.x - e.x - DIRS[d][0]) + Math.abs(p.y - e.y - DIRS[d][1]);
        if (m < best) { best = m; bd = [d]; } else if (m === best) bd.push(d);
      }
      e.dir = bd[(rng() * bd.length) | 0];
    }
  }
}

const cloneState = (St) => ({ ...St, ents: St.ents.map((e) => ({ ...e })) });
function simulate(d) {
  const St = cloneState(S); St.outsThisTurn = 0; St.lost = null; const G = [];
  if (!doPlayer(St, d, G)) return { invalid: true };
  if (!St.lost && !allOut(St)) for (const e of foes(St)) { if (St.lost || allOut(St)) break; actFoe(St, e, G); }
  const p = St.ents[0];
  return { lost: !!St.lost, won: !St.lost && allOut(St), px: p.x, py: p.y };
}

// ---------- three.js ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1210);
scene.fog = new THREE.Fog(0x1a1210, 18, 34);
const camera = new THREE.PerspectiveCamera(42, 0.56, 0.1, 80);
const camTarget = new THREE.Vector3(0, 0, 0.35);
let camBase = new THREE.Vector3();
scene.add(new THREE.HemisphereLight(0xfff0d8, 0x2a1a10, 1.1));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.2);
sun.position.set(3.5, 11, 5); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 30 });
scene.add(sun);
const W = (x) => x - 3;

// arena
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshLambertMaterial({ color: 0x6b4a32 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -0.7; floor.receiveShadow = true; scene.add(floor);
const plat = new THREE.Mesh(new THREE.BoxGeometry(8.6, 0.7, 8.6), new THREE.MeshLambertMaterial({ color: 0xb48a5a }));
plat.position.y = -0.35; plat.receiveShadow = true; scene.add(plat);
const plat2 = new THREE.Mesh(new THREE.BoxGeometry(9.6, 0.25, 9.6), new THREE.MeshLambertMaterial({ color: 0x9a7248 }));
plat2.position.y = -0.58; plat2.receiveShadow = true; scene.add(plat2);
const tileGeo = new THREE.PlaneGeometry(0.97, 0.97);
const tileA = new THREE.MeshLambertMaterial({ color: 0xe8cc98 }), tileB = new THREE.MeshLambertMaterial({ color: 0xdfc08a });
const edgeMat = new THREE.MeshLambertMaterial({ color: 0xd9bb84 });
for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) {
  if (!inRing(x, y)) continue;
  const m = new THREE.Mesh(tileGeo, isEdge(x, y) ? edgeMat : ((x + y) % 2 ? tileA : tileB));
  m.rotation.x = -Math.PI / 2; m.position.set(W(x), 0.004, W(y)); m.receiveShadow = true; scene.add(m);
}
// tawara (straw bales) along the ring boundary
const baleMat = new THREE.MeshLambertMaterial({ color: 0xd8c27a });
const baleGeo = new THREE.CylinderGeometry(0.11, 0.11, 1.04, 10);
for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) {
  if (!inRing(x, y)) continue;
  DIRS.forEach(([dx, dy]) => {
    if (inRing(x + dx, y + dy)) return;
    const b = new THREE.Mesh(baleGeo, baleMat);
    b.castShadow = true;
    b.position.set(W(x) + dx * 0.5, 0.09, W(y) + dy * 0.5);
    if (dx) b.rotation.x = Math.PI / 2; else b.rotation.z = Math.PI / 2;
    scene.add(b);
  });
}
// shikiri lines
const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
for (const s of [-1, 1]) { const l = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.06), lineMat); l.rotation.x = -Math.PI / 2; l.position.set(0, 0.008, s * 0.32); scene.add(l); }
// corner tassels (fusa)
[[0x2a5bd7, -1, -1], [0xd73a2a, 1, -1], [0xeeeeee, 1, 1], [0x222222, -1, 1]].forEach(([c, sx, sz]) => {
  const f = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.24, 0.9, 10), new THREE.MeshLambertMaterial({ color: c }));
  f.position.set(sx * 5.1, -0.25, sz * 5.1); f.castShadow = true; scene.add(f);
});

// ---------- characters ----------
const mats = {
  skin: new THREE.MeshLambertMaterial({ color: 0xf0c49c }),
  hair: new THREE.MeshLambertMaterial({ color: 0x1b1612 }),
  mawashi: new THREE.MeshLambertMaterial({ color: 0x23306e }),
  white: new THREE.MeshLambertMaterial({ color: 0xffffff }),
  black: new THREE.MeshBasicMaterial({ color: 0x111111 }),
  horn: new THREE.MeshLambertMaterial({ color: 0xf3e3b0 }),
  tiger: new THREE.MeshLambertMaterial({ color: 0xf0b631 }),
  s: new THREE.MeshLambertMaterial({ color: 0xe0483e }),
  c: new THREE.MeshLambertMaterial({ color: 0x3a7bd5 }),
  h: new THREE.MeshLambertMaterial({ color: 0x8b4fc8 }),
};

    if (g.shake) shakeAmt = Math.max(shakeAmt, g.shake);
    if (g.note === 'wobble') showKima('', T.wobble, 1.0);
    if (g.kim && g.kim.length) {
      const hasOut = g.moves.some((m) => m.k === 'out');
      const k = g.kim[g.kim.length - 1];
      boutKims.push(...g.kim);
      const isNew = g.kim.some((q) => !save.z.includes(q));
      g.kim.forEach((q) => { if (!save.z.includes(q)) save.z.push(q); });
      showKima(kimJ(k) + '！', kimE(k) + (isNew ? ' — ' + T.newKim : ''), 1.3);
      if (isNew) SFX.newk();
      if (hasOut) sleep(250).then(() => cheer(1));
    }
    await sleep(dur * 1000 + 40);
  }
}

async function playerAct(d) {
  if (busy || mode !== 'play') return;
  const snap = snapshot();
  const G = []; S.outsThisTurn = 0; S.lost = null;
  if (!doPlayer(S, d, G)) { SFX.bump(); const v = vmap[0]; tween(0.2, (t) => { v.userData.body.rotation.z = Math.sin(t * Math.PI * 3) * 0.1 * (1 - t); }); return; }
  busy = true; lastSnap = snap; turnCount++; clearIntents(); preview.visible = false; hint.style.opacity = '0';
  for (const e of foes(S)) { const v = vmap[e.id]; if (v.userData.num) v.userData.num.visible = false; }
  updateHud();
  await animate(G);
  if (!S.lost && !allOut(S)) {
    turnInfo.textContent = T.enemyTurn;
    await sleep(120);
    let n = 0;
    const order = foes(S).filter((e) => !e.out);
    for (const e of order) {
      if (S.lost || allOut(S)) break;
      if (e.out) continue;
      n++;
      const G2 = [];
      const v = vmap[e.id]; const nm = v.userData.num; if (nm) { nm.visible = true; tween(0.25, (t) => nm.scale.setScalar(0.36 * (1 + Math.sin(Math.PI * t) * 0.6))); }
      actFoe(S, e, G2);
      await animate(G2);
      if (v.userData.num) v.userData.num.visible = false;
      await sleep(60);
    }
  }
  for (const e of S.ents) e.stun = false;
  if (S.outsThisTurn >= 2) {
    boutKims.push('futari');
    const isNew = !save.z.includes('futari'); if (isNew) save.z.push('futari');
    showKima(kimJ('futari') + '！', T.two + (isNew ? ' — ' + T.newKim : ''), 1.3); cheer(1.6); if (isNew) SFX.newk();
    await sleep(700);
  }
  if (S.lost) return lose();
  if (allOut(S)) return win();
  if (turnCount >= RANKS[bout].lim) { S.lost = 'time'; return lose(); }
  plan(S); showIntents();
  busy = false; turnInfo.textContent = T.yourTurn; updateHud();
}

async function win() {
  mode = 'result'; turnInfo.textContent = ''; wins++; persist();
  SFX.taiko(); setTimeout(() => SFX.taiko(), 180); cheer(2);
  const v = vmap[0]; tween(0.6, (t) => { v.userData.body.position.y = Math.abs(Math.sin(t * Math.PI * 2)) * 0.25; });
  v.rotation.y = 0;
  signal('end', { score: wins });
  await sleep(900);
  const final = bout === 7;
  if (final) { save.yusho++; }
  save.best = Math.max(save.best, final ? 8 : bout + 1); persist();
  const uniq = [...new Set(boutKims)];
  ov.style.display = 'flex';
  if (final) {
    ov.innerHTML = `<h1>${losses ? T.yusho : T.zensho}</h1><p class="big">${T.record(wins, losses)}</p>${zukanHtml()}<div class="tap">${T.again}</div>`;
    mode = 'final';
  } else {
    ov.innerHTML = `<h2>${T.win}</h2><p class="big">${rankName(bout)} — ${T.turns(turnCount)}</p><p>${uniq.map(kimJ).join('・')}</p><p style="margin-top:10px">→ ${rankName(bout + 1)}</p><div class="tap">${T.next}</div>`;
    advance = true;
  }
  ovReadyAt = gtime + 0.7; updateHud();
}

async function lose() {
  mode = 'result'; turnInfo.textContent = ''; losses++; persist();
  SFX.lose(); cheer(0.7);
  signal('end', { score: wins });
  await sleep(900);
  ov.style.display = 'flex';
  if (losses >= 3) {
    ov.innerHTML = `<h2>${T.over}</h2><p class="big">${T.reached(rankName(bout))}</p><p>${T.record(wins, losses)}</p>${zukanHtml()}<div class="tap">${T.again}</div>`;
    mode = 'final';
  } else {
    ov.innerHTML = `<h2>${T.lose}</h2><p class="big">${T.lostBy[S.lost] || T.lostBy.push}</p><p>${'○'.repeat(wins)}${'●'.repeat(losses)}　${T.loss(losses)}</p><p>${T.retry}</p><div class="tap">${T.again}</div>`;
  }
  ovReadyAt = gtime + 0.7; updateHud();
}

// ---------- input ----------
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
function cellAt(cx, cy) {
  const r = canvas.getBoundingClientRect(); if (!r.width || !r.height) return null;
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const o = ray.ray.origin, dv = ray.ray.direction; if (Math.abs(dv.y) < 1e-6) return null;
  const t = (0.0 - o.y) / dv.y; if (t < 0) return null;
  return [Math.round(o.x + dv.x * t + 3), Math.round(o.z + dv.z * t + 3)];
}
let down = null;
function swipeDir(dx, dy) { return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0); }
function setPreview(d) {
  if (d == null || busy || mode !== 'play') { preview.visible = false; return; }
  const p = S.ents[0];
  const nx = p.x + (d < 0 ? 0 : DIRS[d][0]), ny = p.y + (d < 0 ? 0 : DIRS[d][1]);
  if (!inRing(nx, ny)) { preview.visible = false; return; }
  const sim = simulate(d);
  preview.material.color.setHex(sim.won ? 0xffd54a : sim.lost ? 0xff3322 : 0x55ff88);
  preview.position.x = W(nx); preview.position.z = W(ny); preview.visible = true;
}
function tapDir(cx, cy) {
  const c = cellAt(cx, cy); if (!c) return null; const p = S.ents[0];
  const dx = c[0] - p.x, dy = c[1] - p.y;
  if (dx === 0 && dy === 0) return -1;
  if (Math.abs(dx) + Math.abs(dy) === 1) return dx === 1 ? 1 : dx === -1 ? 3 : dy === 1 ? 2 : 0;
  return 'far';
}
canvas.addEventListener('pointerdown', (e) => {
  initAudio();
  if (mode !== 'play') return;
  down = { x: e.clientX, y: e.clientY, id: e.pointerId, dir: null };
  const td = tapDir(e.clientX, e.clientY); if (td !== null && td !== 'far') { down.dir = td; setPreview(td); }
});
canvas.addEventListener('pointermove', (e) => {
  if (!down || e.pointerId !== down.id) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (Math.hypot(dx, dy) > 18) { const d = swipeDir(dx, dy); if (d !== down.dir) { down.dir = d; down.swiped = true; setPreview(d); } }
});
function endPointer(e, cancel) {
  if (!down || e.pointerId !== down.id) return;
  const dd = down; down = null; preview.visible = false;
  if (cancel) return;
  const dx = e.clientX - dd.x, dy = e.clientY - dd.y;
  if (Math.hypot(dx, dy) > 18) { playerAct(swipeDir(dx, dy)); return; }
  const td = tapDir(e.clientX, e.clientY);
  if (td === null) return;
  if (td === 'far') { // tap farther away: step toward it
    const c = cellAt(e.clientX, e.clientY); const p = S.ents[0];
    const ddx = c[0] - p.x, ddy = c[1] - p.y;
    playerAct(Math.abs(ddx) >= Math.abs(ddy) ? (ddx > 0 ? 1 : 3) : (ddy > 0 ? 2 : 0));
    return;
  }
  playerAct(td);
}
canvas.addEventListener('pointerup', (e) => endPointer(e, false));
canvas.addEventListener('pointercancel', (e) => endPointer(e, true));
ov.addEventListener('pointerdown', () => {
  initAudio();
  if (gtime < ovReadyAt) return;
  if (mode === 'title') startBasho();
  else if (mode === 'result') { if (advance) { bout++; advance = false; } startBout(); }
  else if (mode === 'final') showTitle();
});
matta.addEventListener('pointerdown', (e) => {
  e.stopPropagation(); initAudio();
  if (matta.disabled || busy || !lastSnap || mattaLeft <= 0 || mode !== 'play') return;
  mattaLeft--; restoreSnap(lastSnap); lastSnap = null; clack(); showKima(LANG === 'ja' ? '待った！' : 'Matta!', '', 0.8); updateHud();
});

// ---------- resize & loop ----------
function resize() {
  const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const vf = camera.fov * Math.PI / 180;
  const hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  const halfW = 4.25;
  let dist = halfW / Math.tan(hf / 2) + 2.2;
  dist = Math.max(dist, 11);
  const el = 56 * Math.PI / 180;
  camBase.set(camTarget.x, camTarget.y + Math.sin(el) * dist, camTarget.z + Math.cos(el) * dist);
  camera.position.copy(camBase); camera.lookAt(camTarget);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  gtime += dt;
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; const t = Math.min(1, (gtime - tw.s) / tw.dur); try { tw.fn(t); } catch (err) { tweens.splice(i, 1); continue; } if (t >= 1) tweens.splice(i, 1); }
  for (let i = timers.length - 1; i >= 0; i--) if (timers[i].at <= gtime) { const r = timers[i].r; timers.splice(i, 1); r(); }
  for (const p of dust) if (p.life > 0) { p.life -= dt * 1.6; p.v.y -= 3 * dt; p.m.position.addScaledVector(p.v, dt); p.m.material.opacity = Math.max(0, p.life) * 0.8; if (p.life <= 0) p.m.visible = false; }
  // idle breathing / staggered wobble / danger ring
  if (S) for (const e of S.ents) {
    const v = vmap[e.id]; if (!v || e.out) continue;
    const b = v.userData.body;
    if (!tweens.length) {
      const k = 1 + Math.sin(gtime * 3 + e.id) * 0.025; b.scale.set(1, k, 1);
      if (e.stg === 1) b.rotation.z = Math.sin(gtime * 9) * 0.12;
    }
    if (e.t === 'p') {
      const ring = v.userData.ring;
      if (dangerOn && mode === 'play' && !busy) { ring.material.color.setHex(0xff3322); ring.material.opacity = 0.6 + Math.sin(gtime * 10) * 0.35; }
      else { ring.material.color.setHex(0xffd54a); ring.material.opacity = 0.9; }
    }
  }
  if (kimaTimer > 0) { kimaTimer -= dt; if (kimaTimer <= 0) $('kima').style.opacity = '0'; }
  if (hintTimer > 0) { hintTimer -= dt; if (hintTimer <= 0) hint.style.opacity = '0'; }
  if (mode === 'title') { const a = gtime * 0.15; camera.position.set(camTarget.x + Math.sin(a) * 2, camBase.y, camBase.z - (1 - Math.cos(a)) * 0.6); camera.lookAt(camTarget); }
  else {
    shakeAmt *= Math.pow(0.02, dt);
    camera.position.set(camBase.x + (Math.random() - 0.5) * shakeAmt, camBase.y + (Math.random() - 0.5) * shakeAmt, camBase.z);
    camera.lookAt(camTarget);
  }
  renderer.render(scene, camera);
}
showTitle();
requestAnimationFrame(loop);
</script>
