<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>星くくり / Star Gather</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091a24;touch-action:none}body{font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}canvas{display:block;width:100vw;height:100dvh;touch-action:none}
</style>
<canvas aria-label="星くくり / Star Gather"></canvas>
<script>
(() => {
 'use strict';
 const lang=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en');
 document.documentElement.lang=lang==='ja'?'ja':'en';
 const words={ja:{title:'星くくり',sub:'夜のひかりを、ひとまとめ。',line1:'指を置いて、輪を広げる。',line2:'光をまとめて捕まえよう。赤は避けて。',start:'タップでスタート',score:'スコア',time:'残り',best:'ベスト',hint:'指を置く → 引っぱる → 離す',end:'夜明け',again:'タップでもう一度',record:'ベスト更新！',miss:'火種を巻き込んだ！',empty:'もう少し広げてみよう',one:'ひかりを捕まえた',combo:'まとめ取り',limit:'45秒の星あつめ'},en:{title:'Star Gather',sub:'A little circle of night light.',line1:'Touch, then drag to grow a circle.',line2:'Gather lights. Leave the red embers out.',start:'Tap to start',score:'SCORE',time:'LEFT',best:'BEST',hint:'Touch → drag → release',end:'Daybreak',again:'Tap to play again',record:'New best!',miss:'An ember slipped in!',empty:'Try a wider circle',one:'Light gathered',combo:'Together',limit:'45 seconds to gather light'}};
 const t=words[lang==='ja'?'ja':'en'],canvas=document.querySelector('canvas'),g=canvas.getContext('2d');
 const font='system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif';
 let width=360,height=640,mode='title',elapsed=0,endedAt=0,last=null,clock=0,score=0,best=0,record=false,chain=0,selection=null,lights=[],embers=[],bursts=[],notice='',noticeLife=0,shake=0,audio=null;
 const signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};
 const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
 const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
 function resize(){width=Math.max(1,innerWidth);height=Math.max(1,innerHeight);const d=Math.min(devicePixelRatio||1,3);canvas.width=Math.round(width*d);canvas.height=Math.round(height*d);g.setTransform(canvas.width/360,0,0,canvas.height/640,0,0)}
 addEventListener('resize',resize);resize();
 function tone(good,n=1){try{audio||=new (window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),v=audio.createGain();o.type='sine';o.frequency.setValueAtTime(good?440+n*90:170,audio.currentTime);o.frequency.exponentialRampToValueAtTime(good?880:85,audio.currentTime+.12);v.gain.setValueAtTime(.045,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+.2)}catch{}}
 function newLight(){let p;for(let i=0;i<40;i++){p={x:35+Math.random()*290,y:170+Math.random()*355,phase:Math.random()*Math.PI*2};if(embers.every(e=>distance(p,e)>65)&&lights.every(e=>distance(p,e)>35))break}return p}
 function start(){mode='play';elapsed=0;score=0;chain=0;selection=null;bursts=[];notice='';noticeLife=0;shake=0;record=false;embers=[{x:175,y:325,phase:0},{x:290,y:465,phase:2}];lights=[{x:73,y:205,phase:0},{x:126,y:218,phase:1},{x:267,y:188,phase:2},{x:287,y:247,phase:3},{x:60,y:382,phase:4},{x:93,y:439,phase:5},{x:183,y:480,phase:6},{x:239,y:531,phase:7}];signal('start');tone(true,1)}
 function finish(){mode='end';endedAt=clock;selection=null;record=score>best;best=Math.max(best,score);signal('end',{score})}
 function point(e){const b=canvas.getBoundingClientRect();return{x:clamp((e.clientX-b.left)/b.width*360,0,360),y:clamp((e.clientY-b.top)/b.height*640,110,575)}}
 canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='title'){start();return}if(mode==='end'){if(clock-endedAt>=.7)start();return}if(selection)return;const p=point(e);selection={...p,r:22,id:e.pointerId};try{canvas.setPointerCapture(e.pointerId)}catch{}});
 canvas.addEventListener('pointermove',e=>{if(!selection||selection.id!==e.pointerId)return;e.preventDefault();selection.r=clamp(distance(selection,point(e)),22,110)});
 canvas.addEventListener('pointercancel',()=>{selection=null});
 canvas.addEventListener('pointerup',e=>{if(!selection||selection.id!==e.pointerId||mode!=='play')return;const s=selection;selection=null;const hit=embers.some(p=>distance(s,p)<s.r+10);const caught=lights.filter(p=>distance(s,p)<=s.r);
 if(hit){score=Math.max(0,score-15);chain=0;notice=t.miss;shake=.3;tone(false)}
 else if(caught.length){chain=caught.length>=2?Math.min(chain+1,4):0;const value=caught.length*10+(caught.length>=2?caught.length*chain*5:0);score+=value;notice=caught.length>=2?`${t.combo} ×${caught.length}  +${value}`:`${t.one} +10`;tone(true,caught.length);lights=lights.filter(p=>!caught.includes(p));for(const p of caught){bursts.push({x:p.x,y:p.y,life:.8});lights.push(newLight())}}
 else {notice=t.empty;chain=0}noticeLife=1.5;bursts.push({x:s.x,y:s.y,life:.6,r:s.r,bad:hit})});
 function text(str,x,y,size=16,color='#eef5ec',align='center',weight=500,max=320){g.fillStyle=color;g.textAlign=align;g.textBaseline='middle';g.font=`${weight} ${size}px ${font}`;const length=g.measureText(str).width;if(length>max)g.font=`${weight} ${size*max/length}px ${font}`;g.fillText(str,x,y)}
 function circle(x,y,r,fill,stroke){g.beginPath();g.arc(x,y,r,0,Math.PI*2);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=2;g.stroke()}}
 function light(p,time){const pulse=1+Math.sin(time*2+p.phase)*.12;g.save();g.shadowColor='#ffdd80';g.shadowBlur=16;circle(p.x,p.y,7*pulse,'#ffe69d');g.shadowBlur=0;g.strokeStyle='#fff5cd';g.lineWidth=1.5;g.beginPath();g.moveTo(p.x-12,p.y);g.lineTo(p.x+12,p.y);g.moveTo(p.x,p.y-12);g.lineTo(p.x,p.y+12);g.stroke();g.restore()}
 function ember(p){circle(p.x,p.y,19,'#fb786015');circle(p.x,p.y,11,'#fc8167');g.strokeStyle='#542c32';g.lineWidth=2;g.beginPath();g.moveTo(p.x-4,p.y-4);g.lineTo(p.x+4,p.y+4);g.moveTo(p.x+4,p.y-4);g.lineTo(p.x-4,p.y+4);g.stroke()}
 function background(){const bg=g.createLinearGradient(0,0,0,640);bg.addColorStop(0,'#0c202f');bg.addColorStop(1,'#153e43');g.fillStyle=bg;g.fillRect(0,0,360,640);for(let i=0;i<38;i++){const x=(i*83+17)%360,y=(i*137+23)%640;circle(x,y,1,'#bce2df28')}g.strokeStyle='#c2e1d510';g.lineWidth=1;for(let i=0;i<5;i++){g.beginPath();g.ellipse(180,620+i*7,190+i*25,42,0,Math.PI,Math.PI*2);g.stroke()}}
 function draw(){background();g.save();if(shake>0)g.translate(Math.sin(clock*75)*shake*10,0);
 if(mode==='title'){circle(180,198,74,'#f9dc7910','#f4d68b80');for(const p of [{x:146,y:181,phase:0},{x:202,y:158,phase:2},{x:207,y:218,phase:3}])light(p,clock);ember({x:279,y:237});text(t.title,180,320,42,'#ffebae','center',700);text(t.sub,180,369,16,'#bddbd8');text(t.line1,180,426,16);text(t.line2,180,455,14);text(t.start,180,529,21,'#ffe6a1','center',650);text(t.limit,180,574,14,'#8dadb1')}
 else{g.fillStyle='#08182475';g.fillRect(0,0,360,93);text(t.score,22,27,14,'#94b8bd','left',600);text(String(score).padStart(3,'0'),22,60,30,'#ffe6a1','left',700);text(`${t.time}  ${Math.ceil(Math.max(0,45-elapsed))}s`,338,35,18,'#deebe5','right',650);text(`${t.best}  ${best}`,338,65,14,'#94b8bd','right');g.fillStyle='#a9d8bd';g.fillRect(0,90,360*Math.max(0,1-elapsed/45),3);
 for(const p of lights)light(p,clock);for(const p of embers)ember(p);
 if(selection){const bad=embers.some(p=>distance(selection,p)<selection.r+10);circle(selection.x,selection.y,selection.r,bad?'#fb786018':'#ffe69d16',bad?'#fc8167':'#ffe69d');circle(selection.x,selection.y,4,'#ffedbb');g.setLineDash([3,5]);circle(selection.x,selection.y,110,null,'#bddbd825');g.setLineDash([])}
 for(const p of bursts){g.globalAlpha=Math.max(0,p.life);circle(p.x,p.y,p.r?p.r+(1-p.life)*10:10+(1-p.life)*26,null,p.bad?'#fc8167':'#ffe69d');g.globalAlpha=1}
 if(noticeLife>0)text(notice,180,120,17,'#ffe6a1','center',600);if(elapsed<5)text(t.hint,180,590,16,'#d7e8de');
 if(mode==='end'){g.fillStyle='#071924e8';g.fillRect(0,94,360,546);circle(180,238,65,'#f9dc7910','#f4d68b50');text(t.end,180,232,32,'#ffebae','center',700);text(String(score),180,330,66,'#ffe6a1','center',750);text(record?t.record:`${t.best}  ${best}`,180,399,20,'#b6d7c9');text(t.again,180,508,21,'#ffe6a1','center',650);text(t.limit,180,558,14,'#8dadb1')}
 }g.restore()}
 function frame(ms){const dt=last===null?0:clamp((ms-last)/1000,0,.05);last=ms;clock+=dt;if(mode==='play'){elapsed+=dt;noticeLife=Math.max(0,noticeLife-dt);shake=Math.max(0,shake-dt);for(const p of lights){p.x=clamp(p.x+Math.sin(clock*.65+p.phase)*dt*2,20,340);p.y=clamp(p.y+Math.cos(clock*.55+p.phase)*dt*2,145,553)}for(const p of embers){p.x=clamp(p.x+Math.sin(clock*.55+p.phase)*dt*4,25,335);p.y=clamp(p.y+Math.cos(clock*.65+p.phase)*dt*3,155,550)}if(elapsed>=15&&embers.length===2)embers.push({x:190,y:195,phase:4});if(elapsed>=30&&embers.length===3)embers.push({x:53,y:510,phase:5});for(const p of bursts)p.life-=dt;bursts=bursts.filter(p=>p.life>0);if(elapsed>=45)finish()}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script>
</html>
