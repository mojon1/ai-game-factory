<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>One-Stroke Rebound</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102631;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}</style></head><body><canvas id="c"></canvas><script src="../../lib/matter-0.20.0.min.js"></script><script>
'use strict';
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en');
const strings={ja:{title:'ひと筆リバウンド',subtitle:'線ひとつで、光の行き先を変える',help1:'光の下に線を引いて、跳ね返そう。',help2:'線を斜めにすると、星へ飛ばせる。',start:'タップでスタート',score:'得点',time:'秒',combo:'連続',hint:'光の下をなぞる → 斜めの線で星を狙う',fall:'落下 −15',draw:'線は1本。何度でも描き直せる',end:'光の旅、おしまい',best:'ベスト',newBest:'ベスト更新！',again:'タップでもう一度'},en:{title:'One-Stroke Rebound',subtitle:'One line changes where the light goes',help1:'Draw a line below the light to bounce it.',help2:'Tilt your line to aim for the star.',start:'Tap to start',score:'Score',time:'s',combo:'Streak',hint:'Draw below the light → tilt to aim at the star',fall:'Dropped −15',draw:'One line. Redraw it whenever you like.',end:'The journey ends',best:'Best',newBest:'New best!',again:'Tap to play again'}};
const T=strings[LANG]||strings.en,canvas=document.getElementById('c'),g=canvas.getContext('2d');const {Engine,Bodies,Body,Composite,Events}=Matter;
let mode='title',engine,ball,paddle,line={a:{x:65,y:495},b:{x:295,y:495}},stroke=null,score=0,best=0,combo=0,elapsed=0,target={x:95,y:225},targetIndex=0,trail=[],particles=[],notices=[],last=0,overAt=0,record=false,bounce=0,resetGlow=0,audio=null,acc=0;
const signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch(e){}};
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(innerWidth*d));canvas.height=Math.max(1,Math.round(innerHeight*d));g.setTransform(canvas.width/360,0,0,canvas.height/640,0,0)}addEventListener('resize',resize);resize();
function sound(f){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),v=audio.createGain();o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.4,audio.currentTime+.1);v.gain.setValueAtTime(.025,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.14);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+.15)}catch(e){}}
function makeLine(a,b){let dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<25)return false;if(len>230){const k=230/len;b={x:a.x+dx*k,y:a.y+dy*k};dx=b.x-a.x;dy=b.y-a.y;len=230}if(paddle)Composite.remove(engine.world,paddle);line={a:{...a},b:{...b}};paddle=Bodies.rectangle((a.x+b.x)/2,(a.y+b.y)/2,len,10,{isStatic:true,angle:Math.atan2(dy,dx),restitution:1,friction:0,frictionStatic:0,label:'line'});Composite.add(engine.world,paddle);return true}
function burst(x,y,color,n=12){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=30+Math.random()*100;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.7,color})}}
function resetBall(){Body.setPosition(ball,{x:180,y:160});Body.setVelocity(ball,{x:0,y:0});Body.setAngularVelocity(ball,0);trail=[];resetGlow=.7}
function begin(){mode='play';score=0;combo=0;elapsed=0;acc=0;targetIndex=0;target={x:95,y:225};particles=[];notices=[];trail=[];stroke=null;paddle=null;engine=Engine.create();engine.gravity.y=.62;Composite.add(engine.world,[Bodies.rectangle(-12,320,28,900,{isStatic:true,restitution:1,friction:0}),Bodies.rectangle(372,320,28,900,{isStatic:true,restitution:1,friction:0}),Bodies.rectangle(180,76,360,15,{isStatic:true,restitution:1,friction:0})]);ball=Bodies.circle(180,170,11,{restitution:1,friction:0,frictionStatic:0,frictionAir:.0015,label:'light'});Composite.add(engine.world,ball);makeLine({x:65,y:495},{x:295,y:495});Events.on(engine,'collisionStart',e=>{for(const p of e.pairs)if((p.bodyA===ball&&p.bodyB===paddle)||(p.bodyB===ball&&p.bodyA===paddle)){bounce=.3;burst(ball.position.x,ball.position.y,'#74e8d4',8);sound(330)}});signal('start')}
function end(){mode='end';record=score>best;best=Math.max(best,score);overAt=performance.now();stroke=null;signal('end',{score})}
const pos=e=>({x:Math.max(16,Math.min(344,e.clientX/Math.max(1,innerWidth)*360)),y:Math.max(125,Math.min(575,e.clientY/Math.max(1,innerHeight)*640))});
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='title'){sound(400);begin();return}if(mode==='end'){if(performance.now()-overAt>700){sound(400);begin()}return}stroke={id:e.pointerId,a:pos(e),b:pos(e)};try{canvas.setPointerCapture(e.pointerId)}catch(err){}});
canvas.addEventListener('pointermove',e=>{e.preventDefault();if(stroke&&stroke.id===e.pointerId)stroke.b=pos(e)});
canvas.addEventListener('pointerup',e=>{e.preventDefault();if(stroke&&stroke.id===e.pointerId){stroke.b=pos(e);if(makeLine(stroke.a,stroke.b))sound(240);stroke=null}});canvas.addEventListener('pointercancel',()=>stroke=null);
function update(dt){bounce=Math.max(0,bounce-dt);resetGlow=Math.max(0,resetGlow-dt);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(const n of notices){n.y-=24*dt;n.life-=dt}notices=notices.filter(n=>n.life>0);if(mode!=='play')return;elapsed+=dt;if(elapsed>=60){elapsed=60;end();return}acc+=dt;while(acc>=1/120){Engine.update(engine,1000/120);acc-=1/120;if(bounce>.27&&ball.velocity.y<0){const angle=paddle.angle;const vx=Math.max(-9,Math.min(9,Math.sin(angle)*13));Body.setVelocity(ball,{x:vx,y:-Math.sqrt(169-vx*vx)});bounce=.26}const b=ball.position;if(Math.hypot(b.x-target.x,b.y-target.y)<32){combo++;const val=20+Math.min(combo,8)*5;score+=val;burst(target.x,target.y,'#ffd478',22);notices.push({x:target.x,y:target.y,text:'+'+val,life:1,color:'#ffe1a0'});sound(660+combo*25);targetIndex++;target={x:targetIndex%2?270:90,y:[225,285,180,255][targetIndex%4]}}if(b.y>670){score=Math.max(0,score-15);combo=0;notices.push({x:180,y:550,text:T.fall,life:1.1,color:'#ff8e9f'});sound(140);resetBall()}}trail.push({...ball.position});if(trail.length>18)trail.shift()}
function text(s,x,y,size=16,color='#e9f8f3',align='center'){g.fillStyle=color;g.font=`${size}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif`;g.textAlign=align;g.textBaseline='middle';g.fillText(s,x,y,align==='center'?332:152)}
function pill(x,y,w,h,color){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,18);g.fill()}
function star(x,y,r,color){g.fillStyle=color;g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.44:r;const xx=x+Math.cos(a)*rr,yy=y+Math.sin(a)*rr;i?g.lineTo(xx,yy):g.moveTo(xx,yy)}g.closePath();g.fill()}
function segment(l,color,width=8){g.strokeStyle=color;g.lineWidth=width;g.lineCap='round';g.beginPath();g.moveTo(l.a.x,l.a.y);g.lineTo(l.b.x,l.b.y);g.stroke()}
function draw(){g.fillStyle='#102631';g.fillRect(0,0,360,640);for(let i=0;i<24;i++){g.fillStyle='#8fc7c919';g.beginPath();g.arc(25+(i*79)%310,110+(i*131)%460,1.5,0,Math.PI*2);g.fill()}g.strokeStyle='#29424b';g.lineWidth=1;g.beginPath();g.moveTo(16,100);g.lineTo(16,600);g.moveTo(344,100);g.lineTo(344,600);g.stroke();
if(mode==='play'){text(T.score+' '+score,20,30,20,'#e9f8f3','left');text(Math.ceil(60-elapsed)+T.time,340,30,20,'#e9f8f3','right');pill(20,57,320,4,'#38505a');pill(20,57,320*(1-elapsed/60),4,'#74e8d4');text(T.combo+' '+combo,180,83,14,'#ffd478');g.strokeStyle='#ffd47840';g.lineWidth=2;g.beginPath();g.arc(target.x,target.y,28+Math.sin(elapsed*3)*3,0,Math.PI*2);g.stroke();star(target.x,target.y,20,'#ffd478');for(let i=0;i<trail.length;i++){g.fillStyle=`rgba(116,232,212,${i/trail.length*.35})`;g.beginPath();g.arc(trail[i].x,trail[i].y,i/trail.length*8,0,Math.PI*2);g.fill()}segment(line,bounce>0?'#ffffff':'#74e8d4');g.shadowColor='#a0fff0';g.shadowBlur=15;g.fillStyle=resetGlow>0?'#ffffff':'#baffee';g.beginPath();g.arc(ball.position.x,ball.position.y,11,0,Math.PI*2);g.fill();g.shadowBlur=0;if(stroke){g.setLineDash([8,7]);segment(stroke,'#ffffff90',5);g.setLineDash([])}text(elapsed<6?T.hint:T.draw,180,617,12,'#9fbfc3')}
for(const p of particles){g.globalAlpha=Math.max(0,p.life/.7);g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,3,0,Math.PI*2);g.fill()}g.globalAlpha=1;for(const n of notices){g.globalAlpha=Math.min(1,n.life*3);text(n.text,n.x,n.y,20,n.color)}g.globalAlpha=1;
if(mode==='title'){text(T.title,180,180,29);text(T.subtitle,180,222,14,'#9fbfc3');segment({a:{x:100,y:340},b:{x:250,y:300}},'#74e8d4');g.fillStyle='#baffee';g.beginPath();g.arc(170,284,11,0,Math.PI*2);g.fill();star(97,271,18,'#ffd478');text(T.help1,180,389,15);text(T.help2,180,415,15);pill(35,458,290,55,'#2a6970');text(T.start,180,486,18)}else if(mode==='end'){text(T.end,180,211,24);text(String(score),180,286,65,'#74e8d4');text(record?T.newBest:T.best+' '+best,180,350,18,'#ffd478');pill(35,420,290,55,'#2a6970');text(T.again,180,448,18)}}
function loop(t){const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
