<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#122439}canvas{display:block;width:100vw;height:100dvh}</style></head><body><canvas id="c"></canvas><script>
'use strict';const c=document.getElementById('c'),g=c.getContext('2d');for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});const lang=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en');const D={ja:{title:'はねる切手便',sub:'壁ではねる、光の郵便',rule1:'指で狙いを動かし、離して発射',rule2:'5発で切手3枚を集めよう',rule3:'壁で反射！ 全3部屋',start:'タップでスタート',shots:'残り',room:'部屋',stamps:'切手',hint:'指で角度を決めて離す',aim:'狙って、離す',flying:'配達中…',clear:'配達できた！',fail:'切手が残った',next:'タップで次の部屋',retry:'タップでもう一度',done:'すべて配達完了',bounce:'反射'},en:{title:'Bouncing Stamp Mail',sub:'Light mail with ricochets',rule1:'Drag to aim; release to shoot',rule2:'Collect 3 stamps with 5 shots',rule3:'Bounce off walls! 3 rooms',start:'Tap to start',shots:'Shots',room:'Room',stamps:'Stamps',hint:'Drag to aim, then release',aim:'Aim and release',flying:'Delivering…',clear:'Delivered!',fail:'Stamps left behind',next:'Tap for next room',retry:'Tap to play again',done:'All mail delivered',bounce:'Bounces'}};const T=D[lang]||D.en;let W=360,H=640,scale=1,ox=0,oy=0,state='title',room=0,shots=5,targets=[],walls=[],ball=null,aim={x:0,y:-1},finger=null,t=0,ended=0,particles=[],won=false,ac;const signal=type=>{try{parent.postMessage({agf:type},'*')}catch(e){}};function sound(f,d=.08){try{if(!ac)return;const o=ac.createOscillator(),a=ac.createGain();o.type='sine';o.frequency.value=f;a.gain.setValueAtTime(.07,ac.currentTime);a.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(a).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}function audio(){try{ac||=new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}function resize(){const w=Math.max(1,innerWidth),h=Math.max(1,innerHeight),d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;W=w;H=h;scale=Math.min(w/360,h/640);ox=(w-360*scale)/2;oy=(h-640*scale)/2;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function start(){shots=5;t=0;ball=null;finger=null;aim={x:0,y:-1};particles=[];won=false;const layouts=[[[85,185],[275,185],[180,300]],[[70,190],[285,190],[180,360]],[[75,175],[285,300],[90,400]]];targets=layouts[room].map(([x,y],i)=>({x,y,hit:false,i}));walls=room===0?[]:room===1?[{x:115,y:275,w:130,h:18}]:[{x:166,y:205,w:18,h:215}];state='play';signal('start')}function finish(ok){if(state!=='play')return;won=ok;state='result';ended=0;ball=null;finger=null;signal('end');sound(ok?700:140,.25)}function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale}}function point(p){let dx=p.x-180,dy=Math.min(-24,p.y-525),l=Math.hypot(dx,dy);aim={x:dx/l,y:dy/l}}c.addEventListener('pointerdown',e=>{e.preventDefault();audio();if(state==='title'){room=0;start();return}if(state==='result'){if(ended<.7)return;if(won)room=(room+1)%3;start();return}if(ball||finger!==null)return;finger=e.pointerId;c.setPointerCapture(e.pointerId);point(pos(e))});c.addEventListener('pointermove',e=>{if(e.pointerId===finger)point(pos(e))});function release(e){if(e.pointerId!==finger)return;finger=null;if(state!=='play'||ball)return;shots--;ball={x:180,y:525,vx:aim.x*480,vy:aim.y*480,b:0,age:0,trail:[]};sound(320)}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',e=>{if(e.pointerId===finger)finger=null});function move(b,dt,preview=false){const px=b.x,py=b.y;b.x+=b.vx*dt;b.y+=b.vy*dt;let hit=false;if(b.x<32){b.x=64-b.x;b.vx=Math.abs(b.vx);hit=true}if(b.x>328){b.x=656-b.x;b.vx=-Math.abs(b.vx);hit=true}if(b.y<132){b.y=264-b.y;b.vy=Math.abs(b.vy);hit=true}for(const w of walls){if(b.x>w.x-5&&b.x<w.x+w.w+5&&b.y>w.y-5&&b.y<w.y+w.h+5){if(px<=w.x-5||px>=w.x+w.w+5){b.x=px;b.vx*=-1}else{b.y=py;b.vy*=-1}hit=true}}if(hit){b.b++;if(!preview)sound(180+b.b*55,.04)}return hit}function update(dt){if(state==='result'){ended+=dt;return}if(state!=='play')return;t+=dt;for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(!ball)return;ball.age+=dt;for(let k=0;k<3;k++){move(ball,dt/3);for(const q of targets){if(!q.hit&&Math.hypot(ball.x-q.x,ball.y-q.y)<24){q.hit=true;sound(460+targets.filter(z=>z.hit).length*160,.13);for(let j=0;j<14;j++)particles.push({x:q.x,y:q.y,vx:Math.cos(j)*80,vy:Math.sin(j)*80,life:.5});if(targets.every(z=>z.hit)){finish(true);return}}}if(ball.y>550||ball.b>5||ball.age>3.2){ball=null;if(shots===0)finish(false);return}}ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>18)ball.trail.shift()}
function text(s,x,y,size=18,color='#eff3dc'){g.fillStyle=color;g.textAlign='center';g.font=size+'px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif';const w=g.measureText(s).width;if(w>320)g.font=(size*320/w)+'px system-ui';g.fillText(s,x,y)}function line(x1,y1,x2,y2,color,width=2){g.strokeStyle=color;g.lineWidth=width;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}function draw(){g.save();g.translate(ox,oy);g.scale(scale,scale);g.fillStyle='#122439';g.fillRect(0,0,360,640);for(let y=110;y<575;y+=30)line(24,y,336,y,'#20354b',1);if(state==='title'){text(T.title,180,180,30);text(T.sub,180,222,17,'#f3bc73');text(T.rule1,180,320,18);text(T.rule2,180,352,18);text(T.rule3,180,384,18);text(T.start,180,490,22);g.restore();return}text(T.shots+' '+shots,72,35,18);text(T.room+' '+(room+1)+'/3',281,35,18);text(T.stamps+' '+targets.filter(q=>q.hit).length+'/3',180,80,19,'#f3bc73');line(26,126,26,556,'#65adba',5);line(334,126,334,556,'#65adba',5);line(26,126,334,126,'#65adba',5);for(const w of walls){g.fillStyle='#65adba';g.fillRect(w.x,w.y,w.w,w.h)}for(const q of targets){if(q.hit){text('✓',q.x,q.y+6,24,'#54716d');continue}g.save();g.translate(q.x,q.y);g.rotate(Math.sin(t*2+q.i)*.06);g.fillStyle='#f3bc73';g.fillRect(-18,-22,36,44);g.strokeStyle='#725c40';g.lineWidth=2;g.strokeRect(-13,-17,26,34);text('✦',0,7,25,'#122439');g.restore()}for(const p of particles){g.globalAlpha=Math.max(0,p.life*2);g.fillStyle='#f9d492';g.fillRect(p.x,p.y,4,4)}g.globalAlpha=1;if(ball){g.strokeStyle='#e8ebaa';g.lineWidth=3;g.beginPath();ball.trail.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.stroke();g.fillStyle='#fffbd1';g.beginPath();g.arc(ball.x,ball.y,7,0,Math.PI*2);g.fill()}else if(state==='play'){const p={x:180,y:525,vx:aim.x*480,vy:aim.y*480,b:0};g.strokeStyle=finger!==null?'#f5dba1':'#586877';g.lineWidth=2;g.setLineDash([5,7]);g.beginPath();g.moveTo(p.x,p.y);for(let i=0;i<110;i++){move(p,1/120,true);g.lineTo(p.x,p.y);if(p.b>=2||p.y>550)break}g.stroke();g.setLineDash([])}g.fillStyle='#8bd3ce';g.beginPath();g.arc(180,525,16,0,Math.PI*2);g.fill();text(ball?T.flying:T.aim,180,592,18);if(t<5)text(T.hint,180,623,14,'#9eafb5');if(state==='result'){g.fillStyle='#122439ee';g.fillRect(36,232,288,250);text(won?(room===2?T.done:T.clear):T.fail,180,306,27);text(T.stamps+' '+targets.filter(q=>q.hit).length+'/3',180,355,22,'#f3bc73');text(won&&room<2?T.next:T.retry,180,430,20)}g.restore()}let prev;function loop(now){const dt=Math.min(.05,Math.max(0,(now-(prev??now))/1000));prev=now;update(dt);g.setTransform(c.width/W,0,0,c.height/H,0,0);g.clearRect(0,0,W,H);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
