    if (awake) { g.fillStyle = b.st === 'look' ? '#ffe9a0' : '#ff5050'; g.beginPath(); g.arc(X - cs * 0.08, Y - cs * 0.02, cs * 0.05, 0, 6.3); g.arc(X + cs * 0.08, Y - cs * 0.02, cs * 0.05, 0, 6.3); g.fill(); if (b.st === 'look') { g.font = '700 ' + Math.max(14, cs * 0.5) + 'px ' + FONT; g.textAlign = 'center'; g.fillText('?', X, Y - cs * 0.5); } }
    else { g.strokeStyle = '#c9b0ff'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(X - cs * 0.12, Y); g.lineTo(X - cs * 0.04, Y); g.moveTo(X + cs * 0.04, Y); g.lineTo(X + cs * 0.12, Y); g.stroke(); g.fillStyle = '#c9b0ff'; g.font = '700 ' + Math.max(12, cs * 0.36) + 'px ' + FONT; g.textAlign = 'center'; g.fillText('z', X + cs * 0.38, Y - cs * 0.3 - Math.sin(time * 2 + b.ph) * 3); }
    g.globalAlpha = 1;
  }
  // particles
  for (const p of parts) { g.fillStyle = 'hsla(' + p.hue + ',100%,75%,' + (1 - p.t / p.life) + ')'; g.fillRect(SX(p.x) - 2, SY(p.y) - 2, 4, 4); }
  // player
  if (mode !== 'title') {
    const X = SX(P.x), Y = SY(P.y), gr = g.createRadialGradient(X, Y, 0, X, Y, cs * 1.7); gr.addColorStop(0, 'rgba(255,225,160,0.22)'); gr.addColorStop(1, 'rgba(255,225,160,0)'); g.fillStyle = gr; g.fillRect(X - cs * 1.7, Y - cs * 1.7, cs * 3.4, cs * 3.4);
    const bob = P.moving ? Math.sin(time * 16) * cs * 0.04 : 0, sq = 1 + P.sq * 0.3, hide = mode === 'caught' && (modeT * 10 | 0) % 2;
    if (!hide) {
      g.save(); g.translate(X, Y + bob); g.scale(sq, 2 - sq > 0.7 ? 2 - sq : 0.7);
      g.fillStyle = '#ffe2b0'; g.beginPath(); g.arc(0, 0, cs * 0.27, 0, 6.3); g.fill();
      g.fillStyle = '#e8a23a'; g.beginPath(); g.arc(0, -cs * 0.04, cs * 0.28, Math.PI * 1.02, Math.PI * 1.98); g.closePath(); g.fill();
      g.fillStyle = '#fff6c8'; g.beginPath(); g.arc(P.fx * cs * 0.1, -cs * 0.2, cs * 0.07, 0, 6.3); g.fill();
      g.fillStyle = '#3a2a20'; const exx = P.fx * cs * 0.07, eyy = P.fy * cs * 0.05 + cs * 0.04;
      if (P.sq > 0.2) { g.beginPath(); g.arc(exx, eyy + cs * 0.06, cs * 0.08, 0, 6.3); g.fill(); }
      g.beginPath(); g.arc(exx - cs * 0.09, eyy - cs * 0.02, cs * 0.035, 0, 6.3); g.arc(exx + cs * 0.09, eyy - cs * 0.02, cs * 0.035, 0, 6.3); g.fill(); g.restore();
    }
  }
  // floats
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const f of floats) { if (f.t < 0) continue; const a = Math.min(1, (f.life - f.t) / 0.4); g.font = '800 ' + f.size + 'px ' + FONT; g.fillStyle = 'rgba(' + f.col + ',' + a + ')'; const X = Math.max(40, Math.min(W - 40, SX(f.x))); g.fillText(f.txt, X, SY(f.y)); }
  // exit arrow
  if (mode === 'play' && exitSeen) {
    const X = SX(ex), Y = SY(ey);
    if (X < 10 || X > W - 10 || Y < 56 || Y > H - 10) { const cx = W / 2, cy = H * 0.52, an = Math.atan2(Y - cy, X - cx), rr = Math.min(W * 0.42, H * 0.36); g.save(); g.translate(cx + Math.cos(an) * rr, cy + Math.sin(an) * rr); g.rotate(an); g.fillStyle = 'rgba(255,210,90,' + (0.6 + 0.3 * Math.sin(time * 5)) + ')'; g.beginPath(); g.moveTo(12, 0); g.lineTo(-8, -9); g.lineTo(-3, 0); g.lineTo(-8, 9); g.closePath(); g.fill(); g.restore(); }
  }
  if (mode === 'play') for (const b of bats) {
    if (b.st === 'sleep') continue; const X = SX(b.x), Y = SY(b.y);
    if (X < 6 || X > W - 6 || Y < 50 || Y > H - 6) { const cx = W / 2, cy = H * 0.52, an = Math.atan2(Y - cy, X - cx), rr = Math.min(W * 0.44, H * 0.38), pu = 0.6 + 0.4 * Math.sin(time * 12); g.save(); g.translate(cx + Math.cos(an) * rr, cy + Math.sin(an) * rr); g.rotate(an); g.fillStyle = 'rgba(255,80,80,' + pu + ')'; g.beginPath(); g.moveTo(14, 0); g.lineTo(-9, -10); g.lineTo(-4, 0); g.lineTo(-9, 10); g.closePath(); g.fill(); g.restore(); }
  }
  // vignette
  const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);

  // ---------- UI ----------
  if (mode === 'title') {
    g.fillStyle = 'rgba(4,6,11,0.45)'; g.fillRect(0, 0, W, H);
    const pu = 1 + Math.sin(time * 3) * 0.03; g.save(); g.translate(W / 2, H * 0.24); g.scale(pu, pu); text(TX.t1, 0, 0, Math.min(58, W * 0.16), '#eafaff', W - 30, 900); g.restore();
    text(TX.t2, W / 2, H * 0.24 + Math.min(58, W * 0.16) * 0.95, Math.min(34, W * 0.09), '#7fe0ff', W - 30, 800);
    for (let i = 0; i < 3; i++) text(TX.how[i], W / 2, H * 0.5 + i * 30, 15, '#d5e6ee', W - 28, 600);
    g.globalAlpha = 0.6 + 0.4 * Math.sin(time * 4); text(TX.start, W / 2, H * 0.8, 21, '#ffd35a', W - 30, 800); g.globalAlpha = 1;
    if (best !== null) text(TX.best + '  ' + best + ' / ' + TOTAL, W / 2, H * 0.88, 14, '#9fb6c2', W - 30, 600);
    return;
  }
  if (mode !== 'result') {
    g.fillStyle = 'rgba(4,6,11,0.6)'; g.fillRect(0, 0, W, 44);
    drawGem(24, 23, 10, 185, 1); g.textAlign = 'left'; text(gemsGot + ' / ' + TOTAL, 42, 23, 18, '#eafaff', W * 0.4, 800);
    g.textAlign = 'right'; text(TX.floor(fl + 1) + ' / ' + FL.length, W - 14, 23, 16, '#ffd35a', W * 0.45, 700); g.textAlign = 'center';
    const left = gems.filter(q => !q.got).length; text('◆'.repeat(gems.length - left) + '◇'.repeat(left), W / 2, 23, 12, '#7fe0ff', W * 0.3, 600);
  }
  if (mode === 'play' && hintT < 6) { g.globalAlpha = Math.min(1, hintT * 3, (6 - hintT) * 1.5); g.fillStyle = 'rgba(4,6,11,0.65)'; g.fillRect(0, H - 62, W, 40); text(TX.hint[fl], W / 2, H - 42, 15, '#eafaff', W - 20, 700); g.globalAlpha = 1; }
  if (mode === 'caught') { g.fillStyle = 'rgba(160,20,30,' + Math.max(0, 0.45 - modeT * 0.3) + ')'; g.fillRect(0, 0, W, H); text(TX.caught, W / 2, H * 0.3, 38, '#ff8a8a', W - 30, 900); text(lostN > 0 ? TX.lost(lostN) : TX.back, W / 2, H * 0.3 + 44, 17, '#ffd9d9', W - 30, 700); }
  if (mode === 'trans') { const a = modeT < 0.6 ? modeT / 0.6 : Math.max(0, 1 - (modeT - 0.9) / 0.6); g.fillStyle = 'rgba(4,6,11,' + Math.min(1, a) + ')'; g.fillRect(0, 0, W, H); g.globalAlpha = Math.min(1, a); text(TX.floor(fl + (update.loaded ? 1 : 2)), W / 2, H * 0.45, 34, '#ffd35a', W - 30, 900); g.globalAlpha = 1; }
  if (mode === 'bell') { g.globalAlpha = Math.min(1, modeT); text(TX.bell, W / 2, H * 0.2, 28, '#ffd35a', W - 24, 900); g.globalAlpha = 1; }
  if (mode === 'result') {
    g.fillStyle = 'rgba(4,6,11,0.72)'; g.fillRect(0, 0, W, H);
    text(TX.bell, W / 2, H * 0.16, 26, '#ffd35a', W - 24, 900);
    text(TX.gems, W / 2, H * 0.28, 16, '#9fd8ee', W - 30, 600);
    text(gemsGot + ' / ' + TOTAL, W / 2, H * 0.36, 56, '#eafaff', W - 30, 900);
    if (gemsGot === TOTAL) text(TX.all, W / 2, H * 0.44, 17, '#7fe0ff', W - 30, 800);
    text(newBest ? TX.newBest : TX.best + '  ' + best + ' / ' + TOTAL, W / 2, H * 0.5, 18, newBest ? '#ffd35a' : '#9fb6c2', W - 30, 700);
    text(TX.shouts + '  ' + shouts + TX.times, W / 2, H * 0.6, 16, '#d5e6ee', W - 30, 600);
    text(TX.caughtN + '  ' + catches + TX.times, W / 2, H * 0.6 + 28, 16, '#d5e6ee', W - 30, 600);
    if (modeT > 0.7) { g.globalAlpha = 0.6 + 0.4 * Math.sin(time * 4); text(TX.again, W / 2, H * 0.82, 21, '#ffd35a', W - 30, 800); g.globalAlpha = 1; }
  }
}

// ---------- loop ----------
loadFloor(0); mode = 'title';
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - last) / 1000)); last = ts;
  try { update(dt); render(); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
