<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>潮待ちの小径</title>
<style>
*{box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow:hidden;overscroll-behavior:none;background:#142831;color:#fff0d1;font:16px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{position:relative;width:100vw;height:100dvh;background:radial-gradient(ellipse at 50% 44%,#2f4b4e,#142831 77%)}
header{position:absolute;top:4%;left:6%;right:6%;display:flex;justify-content:space-between;font-weight:750}
#message{position:absolute;top:14%;left:5%;width:90%;text-align:center}
#hint{position:absolute;bottom:5%;width:100%;text-align:center;color:#d7cead;font-size:13px}
#cover{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#142831f4;padding:23px}
h1{font-size:clamp(27px,7.5vw,42px);line-height:1.25}p{line-height:1.75;font-size:16px}.emblem{font-size:55px;color:#efbd72}
main{background:radial-gradient(ellipse at 50% 42%,#25515c,#142831 77%)}
#board{position:absolute;top:24%;left:50%;transform:translateX(-50%);width:min(90vw,50dvh,440px);aspect-ratio:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:3px;padding:5px;background:#162e3c;border-radius:13px}
button{font:700 16px system-ui;color:#fff0d1;background:#355965;border:1px solid #82a7a7;border-radius:11px;min-height:44px}
.cell{padding:0;min-height:0;min-width:0;border:0;display:grid;place-items:center;font-size:clamp(16px,5.3vw,25px);background:#778371;color:#fff4cb}
.cell[data-tile="#"]{background:#294550}.cell[data-tile="L"]{background:#987749}.cell[data-tile="H"]{background:#337b92}
.cell.closed:not(.here){opacity:.44}#wait[aria-disabled=true]{opacity:.5}.cell.here{outline:3px solid #f5d07d;outline-offset:-4px;background:#ac8052}
#wait{position:absolute;bottom:11%;left:22%;width:56%}
.cell.openNext{box-shadow:inset 0 0 0 2px #f5d795}.cell.locked{background:#455757;color:#dfbd92}
</style>
<main><header><span id="level"></span><span id="tide"></span></header><div id="message"></div><div id="board"></div><button id="wait"></button><div id="hint"></div><div id="cover"></div></main>
<script>
const words={
 ja:{title:'潮待ちの小径',intro:'一歩ごとに潮が変わる。<br>干潮は砂道、満潮は水路を渡る。<br>貝をすべて集めて出口へ。',start:'タップでスタート',hint:'となりをタップ。足場では潮を待てる',low:'干潮',high:'満潮',stage:'入江',wait:'潮を待つ',practice:'練習 · 旗へ向かおう',go:'貝',neighbor:'となりのマスを選ぼう',blocked:'今の潮では渡れない',stay:'潮を待てるのは足場の上',missing:'先に残りの貝を集めよう',next:'タップで次へ',arrive:'入江を渡った！',finish:'三つの入江を渡った！',again:'タップでもう一度',sand:'砂道',water:'水路',exit:'出口',rock:'岩',dock:'足場'},
 en:{title:'Tidewait Trail',intro:'The tide changes every step.<br>Cross sand at low tide, water at high tide.<br>Collect every shell and reach the exit.',start:'Tap to start',hint:'Tap a neighbor. Wait on a dock.',low:'Low tide',high:'High tide',stage:'Cove',wait:'Wait for tide',practice:'Practice · reach the flag',go:'Shells',neighbor:'Choose an adjacent tile',blocked:'Closed at this tide',stay:'Wait on a dock',missing:'Collect the remaining shells first',next:'Tap to continue',arrive:'Cove crossed!',finish:'All three coves crossed!',again:'Tap to play again',sand:'Sand',water:'Water',exit:'Exit',rock:'Rock',dock:'Dock'}
};
const locale = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const t = words[locale] || words.en;
document.documentElement.lang = locale;
document.title = t.title;
const byId = id => document.getElementById(id);
const cover = byId('cover'), message = byId('message');
const signal = (agf, data={}) => parent.postMessage({agf,...data},'*');
for (const type of ['contextmenu','selectstart','gesturestart']) addEventListener(type, e=>e.preventDefault(), {passive:false});
let audio;
function tone(frequency, duration=.16){
 try {
  audio ||= new AudioContext();
  audio.resume();
  const oscillator=audio.createOscillator(), gain=audio.createGain(), now=audio.currentTime;
  oscillator.frequency.value=frequency;
  gain.gain.setValueAtTime(.04,now);
  gain.gain.exponentialRampToValueAtTime(.001,now+duration);
  oscillator.connect(gain).connect(audio.destination);
  oscillator.start(now); oscillator.stop(now+duration);
 } catch {}
}
let hintTimer;
function showHint(){
 clearTimeout(hintTimer);
 byId('hint').textContent=t.hint;
 hintTimer=setTimeout(()=>byId('hint').textContent='',4400);
}
function showCover(mark,title,copy,action){
 cover.innerHTML='<section><div class="emblem">'+mark+'</div><h1>'+title+'</h1><p>'+copy+'</p><p>'+action+'</p></section>';
 cover.style.display='grid';
}
const levels=[
 ['#####','##E##','#.L##','#S###','#####'],
 ['#####','#KHE#','#.#L#','#SL.#','#####'],
 ['##E##','#H.L#','#K#K#','#L.H#','##S##']
];
const board=byId('board'), wait=byId('wait');
let level=0, grid='', position=0, tide=0, shells=new Set(), total=0, state='title', guard=0;
const adjacent=(a,b)=>Math.abs(a%5-b%5)+Math.abs(Math.floor(a/5)-Math.floor(b/5))===1;
function passable(tile){
 return tile!=='#'&&(tile!=='L'||tide===0)&&(tile!=='H'||tide===1);
}
function render(){
 byId('level').textContent=t.stage+' '+(level+1)+'/3';
 byId('tide').textContent=tide?t.high:t.low;
 message.textContent=total?t.go+' '+shells.size+'/'+total:t.practice;
 wait.setAttribute('aria-disabled',String(['L','H'].includes(grid[position])));
 wait.textContent=t.wait+' · '+(tide?t.low:t.high);
 for(let i=0;i<25;i++){
  const cell=board.children[i],tile=grid[i];
  cell.dataset.tile=tile;
  cell.classList.toggle('here',i===position);
  const locked=tile==='E'&&shells.size!==total;
  cell.classList.toggle('locked',locked);
  cell.classList.toggle('openNext',adjacent(position,i)&&passable(tile)&&!locked);
  cell.classList.toggle('closed',!passable(tile)&&tile!=='#');
  cell.textContent=i===position?'●':tile==='L'?'≋':tile==='H'?'∿':tile==='E'?(locked?'▣':'⚑'):tile==='K'&&!shells.has(i)?'◇':'';
  const labels={L:t.sand,H:t.water,E:t.exit,K:t.go,'#':t.rock};
  cell.setAttribute('aria-label',labels[tile]||t.dock);
 }
}
function loadLevel(){
 grid=levels[level].join('');
 position=grid.indexOf('S');tide=0;shells=new Set();
 total=[...grid].filter(tile=>tile==='K').length;
 state='play';cover.style.display='none';render();showHint();
}
function finishLevel(){
 const complete=level===levels.length-1;
 if(complete)signal('end');
 state='result';guard=performance.now()+700;tone(690,.35);
 showCover('⚑',complete?t.finish:t.arrive,(total?t.go+' '+total+'/'+total:t.practice),complete?t.again:t.next);
}
function changeTide(){
 tide=1-tide;
 render();
 tone(tide?400:530);
}
function go(index){
 if(!adjacent(position,index)){message.textContent=t.neighbor;return;}
 const tile=grid[index];
 if(!passable(tile)){message.textContent=t.blocked;return;}
 if(tile==='E'&&shells.size!==total){message.textContent=t.missing;return;}
 position=index;
 if(tile==='K')shells.add(index);
 changeTide();
 if(tile==='E')finishLevel();
}
for(let i=0;i<25;i++){
 const cell=document.createElement('button');
 cell.className='cell';cell.dataset.index=i;board.append(cell);
}
addEventListener('pointerdown',event=>{
 if(!event.isPrimary)return;
 event.preventDefault();
 if(state==='title'){tone(450);signal('start');loadLevel();return;}
 if(state==='result'){
  if(performance.now()<guard)return;
  level=(level+1)%levels.length;
  if(level===0)signal('start');
  loadLevel();return;
 }
 if(event.target===wait){
  if(['L','H'].includes(grid[position])){message.textContent=t.stay;return;}
  changeTide();return;
 }
 const cell=event.target.closest('.cell');
 if(cell)go(Number(cell.dataset.index));
},{passive:false});
wait.textContent=t.wait;
showCover('≈',t.title,t.intro,t.start);
</script></html>
