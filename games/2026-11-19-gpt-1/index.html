<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;overscroll-behavior:none;width:100%;height:100%;background:#122b3b;color:#eff8ed;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}main{width:100vw;height:100dvh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#2b5060,#102635)}header{position:absolute;top:3%;left:6%;right:6%;display:flex;justify-content:space-between;font-size:17px;font-weight:700}#status{position:absolute;top:10%;width:100%;text-align:center;font-size:16px}#board{position:absolute;top:18%;left:50%;transform:translateX(-50%);width:min(84vw,294px);height:51%;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(7,1fr);gap:3px} .cell{border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#142833;border:2px solid transparent;transition:background .18s,transform .18s;position:relative}.cell.p{border:3px solid #fff;box-shadow:0 0 0 1px #112535}.cell.c{border:3px dashed #152834}#buttons{position:absolute;top:77%;left:5%;right:5%;display:flex;gap:6px}button{flex:1;min-width:44px;height:54px;border-radius:12px;border:3px solid #e9f7ed;color:#152834;font-size:18px;font-weight:800}button:disabled{opacity:.3;border-style:dashed}#legend{position:absolute;top:70%;width:100%;text-align:center;font-size:14px}#hint{position:absolute;bottom:4%;width:100%;text-align:center;font-size:14px}#cover{position:absolute;inset:0;background:#102635ed;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px}#cover h1{font-size:30px;margin:0 0 22px;line-height:1.3}#cover p{font-size:16px;line-height:1.8;white-space:pre-line}#cover b{display:block;margin-top:30px;color:#99e0d4;font-size:18px}#cover.hidden{display:none}
</style></head><body><main><header><span id="score"></span><span id="round"></span></header><div id="status"></div><div id="board"></div><div id="legend"></div><div id="buttons"></div><div id="hint"></div><div id="cover"></div></main><script>
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),T=({ja:{title:'潮目の旗取り',intro:'色を選び、上下左右の島を取る。\n白い旗があなた。黒い旗が相手。\n先に22島、または12手後に多い方。',start:'タップでスタート',again:'タップでもう一度',you:'あなた',cpu:'相手',turn:'手',choose:'上下左右につながる色を選ぼう',thinking:'相手が色を選んでいます',legend:'白枠 ⚑ あなた　／　黒枠 ⚑ 相手',hint:'下の色で、同じ色の島をまとめて取る',win:'海を広げた！',lose:'相手の海が広い',draw:'ふたつの海は同じ広さ',result:'島',best:'ベスト',newbest:'ベスト更新！'},en:{title:'Flags at the Tide',intro:'Choose a color to claim touching islands.\nYou fly white flags; the rival flies black.\nFirst to 22, or lead after 12 turns.',start:'Tap to start',again:'Tap to play again',you:'You',cpu:'Rival',turn:'Turn',choose:'Choose a connected color',thinking:'The rival is choosing a color',legend:'White border ⚑ You / Black border ⚑ Rival',hint:'Colors below claim matching neighboring islands',win:'Your sea is larger!',lose:'The rival owns more sea',draw:'Two seas of equal size',result:'islands',best:'Best',newbest:'New best!'}})[LANG==='ja'?'ja':'en'];
const colors=['#f2aa87','#87d4d6','#b7a6e6','#b7d879','#f2d57c'],icons=['●','◆','✦','▲','■'],el=id=>document.getElementById(id),signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};
for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});
function reachable(i){return own[i]===0&&cells[i]!==pc&&cells[i]!==cc&&neighbors(i).some(j=>own[j]===1)}
let gainText='',cells=[],own=[],pc=0,cc=1,turn=0,best=0,phase='title',guard=0,started=0,ac,seed=1;
function sound(f){try{ac??=new (window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(.055,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.13);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.14)}catch{}}
function neighbors(i){let a=[],x=i%6,y=i/6|0;if(x)a.push(i-1);if(x<5)a.push(i+1);if(y)a.push(i-6);if(y<6)a.push(i+6);return a}
function take(who,col,owners=own,map=cells){let o=owners.slice(),q=[];o.forEach((v,i)=>{if(v===who)q.push(i)});for(let k=0;k<q.length;k++)for(const j of neighbors(q[k]))if(o[j]===0&&map[j]===col){o[j]=who;q.push(j)}return o}
function count(who,o=own){return o.filter(v=>v===who).length}
function show(){el('board').innerHTML=cells.map((c,i)=>'<div class="cell '+(own[i]===1?'p':own[i]===2?'c':'')+'" style="background:'+colors[own[i]===1?pc:own[i]===2?cc:c]+(reachable(i)?';box-shadow:inset 0 0 0 2px #ffffff88':'')+'">'+(own[i]?'⚑':icons[c])+'</div>').join('');el('score').textContent=T.you+' '+count(1)+' : '+count(2);el('round').textContent=T.turn+' '+turn+'/12 · 22⚑';el('status').textContent=phase==='cpu'?T.thinking:(gainText||T.choose);el('legend').textContent=T.legend;el('buttons').innerHTML=colors.map((c,i)=>'<button data-color="'+i+'" style="background:'+c+'" '+(phase!=='play'||i===pc||i===cc?'disabled':'')+'>'+icons[i]+'<small style="display:block;font-size:14px">'+(i===pc||i===cc?'—':'+'+(count(1,take(1,i))-count(1)))+'</small></button>').join('')}
function cover(title,body,last){el('cover').className='';el('cover').innerHTML='<div><h1>'+title+'</h1><p>'+body+'</p><b>'+last+'</b></div>'}
function start(){cells=Array.from({length:42},()=>Math.floor(Math.random()*5));for(let i=0;i<21;i++)cells[41-i]=(cells[i]+1)%5;own=Array(42).fill(0);own[36]=1;own[5]=2;pc=cells[36];cc=cells[5];if(cc===pc)cc=cells[5]=(pc+1)%5;own=take(1,pc);own=take(2,cc);turn=0;gainText='';phase='play';started=performance.now();el('cover').className='hidden';el('hint').textContent=T.hint;show();signal('start')}
function end(){phase='end';guard=performance.now()+700;let a=count(1),b=count(2),record=a>best;best=Math.max(best,a);show();cover(a>b?T.win:a<b?T.lose:T.draw,T.you+' '+a+' : '+b+' '+T.cpu+'\n'+T.best+' '+best+(record?' — '+T.newbest:''),T.again);signal('end',{score:a})}
function move(col){if(phase!=='play'||col===pc||col===cc)return;const before=count(1),other=count(2);pc=col;own=take(1,col);sound(350+count(1)*12);turn++;phase='cpu';show();setTimeout(()=>{if(phase!=='cpu')return;let options=[0,1,2,3,4].filter(c=>c!==pc&&c!==cc);let choice=options.sort((a,b)=>count(2,take(2,b))-count(2,take(2,a)))[0];cc=choice;own=take(2,cc);gainText=T.you+' +'+(count(1)-before)+' / '+T.cpu+' +'+(count(2)-other);phase='play';show();if(turn>=12||count(1)>21||count(2)>21||count(1)+count(2)===42)end()},550)}
el('buttons').addEventListener('pointerdown',e=>{let b=e.target.closest('button');if(b&&!b.disabled)move(+b.dataset.color)});
el('cover').addEventListener('pointerdown',e=>{if(phase==='title'||phase==='end'&&performance.now()>=guard){sound(400);start()}});
function tick(t){if(t-started>4500)el('hint').textContent='';requestAnimationFrame(tick)}requestAnimationFrame(tick);
cover(T.title,T.intro,T.start);
</script></body></html>
