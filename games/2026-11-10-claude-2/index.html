// ---------- sound ----------
let audioOn = false;
const SND = {

  tick: [0.12, 0.4, 1500, , 0.004, 0.008, 4, 0, , , , , , , , , , 0.3],

  lost: [0.5, , 140, 0.02, 0.12, 0.3, 1, 0.6, -2, , , , , , , , , 0.5],
  win: [0.6, , 523, 0.02, 0.25, 0.4, 1, 1.4, , , 262, 0.12, 0.1, , , , , 0.8],

let lastSnd = {};
function snd(name, minGap = 0) {

  const now = performance.now();
  if (minGap && lastSnd[name] && now - lastSnd[name] < minGap) return;
  lastSnd[name] = now;
  try { const p = SND[name].slice(); if (name === 'tick' || name === 'fight') p[2] *= 0.85 + Math.random() * 0.3; zzfx(...p); } catch (e) {}

}

// ---------- canvas ----------
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
const FW = 360, FH = 600, HUD = 50;
let W = 1, H = 1, DPR = 1, S = 1, OX = 0, OY = 0, bgDirty = true;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, window.innerWidth || 1); H = Math.max(1, window.innerHeight || 1);
  cv.width = Math.max(1, Math.round(W * DPR)); cv.height = Math.max(1, Math.round(H * DPR));

}
addEventListener('resize', resize);
resize();

// ---------- stages ----------
const OWN = { N: 0, P: 1, R: 2, Y: 3 };
const COL = { 0: '#7d766b', 1: '#1d1714', 2: '#c33a2b', 3: '#d9a21b' };
const BADGE = { 0: '#9b9384', 1: '#1d1714', 2: '#c33a2b', 3: '#e8b52a' };
const ANTC = { 1: '#17110d', 2: '#b8301f', 3: '#c98d0e' };
// n:[x,y,owner,count,big]
const STAGES = [
  { cpu: 6.0, grace: 6, nests: [[180, 530, 1, 20, 1], [80, 360, 0, 5, 0], [280, 360, 0, 5, 0], [180, 250, 0, 12, 1], [180, 80, 2, 14, 0]], pud: [] },
  { cpu: 4.8, grace: 5, nests: [[180, 535, 1, 18, 1], [55, 430, 0, 5, 0], [305, 430, 0, 5, 0], [55, 175, 0, 8, 0], [305, 175, 0, 8, 0], [180, 70, 2, 20, 1]], pud: [[180, 300, 115, 42]] },
  { cpu: 4.2, grace: 4, nests: [[70, 530, 1, 14, 0], [290, 530, 1, 14, 0], [70, 75, 2, 14, 0], [290, 75, 2, 14, 0], [180, 300, 0, 15, 1], [35, 300, 0, 6, 0], [325, 300, 0, 6, 0], [180, 455, 0, 4, 0], [180, 150, 0, 10, 0]], pud: [[108, 300, 42, 30], [252, 300, 42, 30]] },
  { cpu: 3.6, grace: 4, nests: [[180, 545, 1, 18, 1], [60, 465, 1, 8, 0], [300, 465, 0, 6, 0], [60, 135, 0, 6, 0], [180, 205, 0, 10, 0], [180, 400, 0, 10, 0], [180, 60, 2, 24, 1], [300, 135, 2, 10, 0]], pud: [[55, 300, 100, 26], [305, 300, 100, 26]] },
  { cpu: 3.8, grace: 3, nests: [[50, 550, 1, 20, 0], [180, 300, 0, 20, 1], [55, 300, 0, 5, 0], [180, 470, 0, 5, 0], [300, 520, 0, 8, 0], [180, 140, 0, 8, 0], [310, 60, 2, 25, 1], [55, 60, 2, 12, 0], [310, 320, 2, 12, 0]], pud: [[115, 405, 40, 28], [250, 205, 48, 28]] },
  { cpu: 2.6, grace: 3, nests: [[180, 545, 1, 20, 1], [55, 70, 2, 20, 1], [305, 70, 3, 20, 1], [180, 80, 0, 10, 0], [55, 300, 0, 8, 0], [305, 300, 0, 8, 0], [180, 330, 0, 14, 1], [95, 455, 0, 5, 0], [265, 455, 0, 5, 0], [180, 195, 0, 8, 0]], pud: [[105, 190, 34, 24], [255, 190, 34, 24]] },
];
const SPEED = 54, SPAWN = 0.085;

// ---------- state ----------
let state = 'title', stageIdx = 0, unlocked = 0, best = {}, demo = false;
let camps = [], corpses = [], nests = [], puds = [], ants = [], routes = [], spawners = [], fx = [], paths = [];
let tGame = 0, tStage = 0, cpuTimers = {}, resultAt = 0, result = null, hintT = 0, msg = null;
let drag = null, ended = false;

addEventListener('message', (e) => {
  if (e.data && e.data.agf === 'loaded' && e.data.data) {
    const d = e.data.data;
    unlocked = Math.max(0, Math.min(STAGES.length - 1, d.unlocked | 0));
    best = d.best || {};
    if (state === 'title' && stageIdx !== unlocked) { stageIdx = unlocked; loadStage(stageIdx, true); }
  }
});
try { parent.postMessage({ agf: 'load' }, '*'); } catch (e) {}
function persist() { try { parent.postMessage({ agf: 'save', data: { unlocked, best } }, '*'); } catch (e) {} }

function insidePud(x, y, m = 0) {
  for (const p of puds) { const dx = (x - p.x) / (p.rx + m), dy = (y - p.y) / (p.ry + m); if (dx * dx + dy * dy < 1) return true; }
  return false;
}
function segClear(a, b, m = 0) {
  const d = Math.hypot(b.x - a.x, b.y - a.y), n = Math.max(1, Math.ceil(d / 3));
  for (let i = 1; i <= n; i++) { const t = i / n; if (insidePud(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, m)) return false; }
  return true;
}

function loadStage(i, isDemo) {
  demo = !!isDemo;
  const st = STAGES[i];
  nests = st.nests.map((n, k) => ({ i: k, x: n[0], y: n[1], owner: n[2], n: n[3], big: !!n[4], r: n[4] ? 24 : 17, rate: n[4] ? 1.35 : 0.8, cap: n[4] ? 80 : 45, pulse: 0, flash: 0 }));
  puds = st.pud.map((p) => ({ x: p[0], y: p[1], rx: p[2], ry: p[3] }));
  ants = []; routes = []; spawners = []; fx = []; corpses = []; camps = []; drag = null; msg = null;
  tStage = 0; ended = false; result = null; hintT = demo ? 0 : 6;
  cpuTimers = {}; for (const o of [1, 2, 3]) cpuTimers[o] = st.grace + Math.random() * 1.5;
  computePaths();
  bgDirty = true;
}

// grid A* for CPU routes
function computePaths() {
  const C = 10, GW = Math.ceil(FW / C), GH = Math.ceil(FH / C);
  const blocked = new Uint8Array(GW * GH);
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) blocked[y * GW + x] = insidePud(x * C + C / 2, y * C + C / 2, 9) ? 1 : 0;
  paths = nests.map(() => []);
  for (const a of nests) for (const b of nests) {
    if (a === b) continue;
    let pts;
    if (segClear(a, b, 6)) pts = [{ x: a.x, y: a.y }, { x: b.x, y: b.y }];
    else {
      const sx = Math.min(GW - 1, a.x / C | 0), sy = Math.min(GH - 1, a.y / C | 0), gx = Math.min(GW - 1, b.x / C | 0), gy = Math.min(GH - 1, b.y / C | 0);
      const N = GW * GH, g = new Float32Array(N).fill(1e9), from = new Int32Array(N).fill(-1), closed = new Uint8Array(N);
      const open = [sy * GW + sx]; g[open[0]] = 0;
      const goal = gy * GW + gx;
      const h = (k) => Math.hypot((k % GW) - gx, ((k / GW) | 0) - gy);
      let found = false;
      while (open.length) {
        let bi = 0, bf = 1e9;
        for (let q = 0; q < open.length; q++) { const f = g[open[q]] + h(open[q]); if (f < bf) { bf = f; bi = q; } }
        const k = open[bi]; open[bi] = open[open.length - 1]; open.pop();
        if (k === goal) { found = true; break; }
        if (closed[k]) continue; closed[k] = 1;
        const kx = k % GW, ky = (k / GW) | 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          const nx = kx + dx, ny = ky + dy; if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
          const nk = ny * GW + nx; if (blocked[nk] && nk !== goal) continue;
          const ng = g[k] + (dx && dy ? 1.414 : 1);
          if (ng < g[nk]) { g[nk] = ng; from[nk] = k; open.push(nk); }
        }

      if (!found) { paths[a.i][b.i] = null; continue; }
      const raw = []; for (let k = goal; k !== -1; k = from[k]) raw.push({ x: (k % GW) * C + C / 2, y: ((k / GW) | 0) * C + C / 2 });
      raw.reverse(); raw[0] = { x: a.x, y: a.y }; raw[raw.length - 1] = { x: b.x, y: b.y };
      pts = [raw[0]]; let i = 0;
      while (i < raw.length - 1) { let j = raw.length - 1; while (j > i + 1 && !segClear(raw[i], raw[j], 5)) j--; pts.push(raw[j]); i = j; }

}
function makeRoute(pts, owner, target, proto) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  const r = { pts, cum, len: cum[cum.length - 1], owner, target, alive: 0, alpha: 0, t: 0 };

  return r;
}
function cloneRoute(p, owner, target) { return makeRoute(p.pts, owner, target, false); }
function routeAt(r, s, o) {
  const c = r.cum; let lo = 0, hi = c.length - 1;
  if (s <= 0) { lo = 0; } else if (s >= r.len) { lo = c.length - 2; } else { while (hi - lo > 1) { const m = (lo + hi) >> 1; if (c[m] <= s) lo = m; else hi = m; } }
  lo = Math.max(0, Math.min(c.length - 2, lo));
  const a = r.pts[lo], b = r.pts[lo + 1], sl = c[lo + 1] - c[lo] || 1, t = Math.max(0, Math.min(1, (s - c[lo]) / sl));
  o.x = a.x + (b.x - a.x) * t; o.y = a.y + (b.y - a.y) * t; o.a = Math.atan2(b.y - a.y, b.x - a.x);
  return o;
}

function send(src, route, s0, owner) {
  const k = src.camp ? Math.floor(src.n) : Math.floor(src.n / 2);
  if (k < 1) return 0;
  spawners.push({ nest: src, route, s0, owner, left: k, t: 0 });
  src.pulse = 1;
  return k;
}

// ---------- CPU ----------
function pending() {
  const pend = {}; // pend[owner][nestIndex]
  for (const o of [1, 2, 3]) pend[o] = new Float32Array(nests.length);
  for (const a of ants) if (a.route.target) pend[a.owner][a.route.target.i] += 1;
  for (const sp of spawners) if (sp.route.target) pend[sp.owner][sp.route.target.i] += sp.left;
  return pend;
}
function cpuThink(f) {
  const mine = nests.filter((n) => n.owner === f);
  if (!mine.length) return;
  const pend = pending();
  const enemyInc = (t) => { let s = 0; for (const o of [1, 2, 3]) if (o !== t.owner) s += pend[o][t.i]; return s; };
  // defend
  for (const t of mine) {
    const inc = enemyInc(t) - pend[f][t.i];
    if (inc > t.n + 2 && Math.random() < 0.7) {
      let bs = null, bl = 1e9;
      for (const s of mine) { if (s === t || s.n < 6) continue; const P = paths[s.i][t.i]; if (P && P.len < bl) { bl = P.len; bs = s; } }
      if (bs) { send(bs, cloneRoute(paths[bs.i][t.i], f, t), 0, f); return; }
    }
  }
  let best = null;
  for (const t of nests) {
    if (t.owner === f) continue;
    const opts = [];
    for (const s of mine) { const P = paths[s.i][t.i]; const k = Math.floor(s.n / 2); if (P && k >= 3) opts.push({ s, P, k }); }
    if (!opts.length) continue;
    opts.sort((a, b) => a.P.len - b.P.len);
    let sum = pend[f][t.i], len = 0, used = [];
    for (const o of opts) {
      used.push(o); sum += o.k; len = Math.max(len, o.P.len);
      const time = len / SPEED + o.k * SPAWN;
      const def = t.n + (t.owner ? t.rate * time : 0) + enemyInc(t) * 0.3 - (t.owner === 0 ? 0 : 0);
      if (sum > def + 2) {
        let sc = 1000 / (len + 80) / used.length * (t.big ? 1.35 : 1) * (t.owner === 1 ? 1.25 : 1) * (t.owner === 0 ? 1.1 : 1);
        sc *= 0.85 + Math.random() * 0.3;
        if (!best || sc > best.sc) best = { sc, t, used: used.slice() };
        break;
      }
      if (used.length >= 3) break;
    }
  }
  if (best) { for (const o of best.used) send(o.s, cloneRoute(o.P, f, best.t), 0, f); return; }

  const pressure = Math.min(0.6, Math.max(0, (tStage - 35) / 120));
  for (const s of mine) {
    if (!(s.n >= s.cap * 0.85 || Math.random() < pressure) || s.n < 10) continue;
    let bt = null, bl = 1e9;
    for (const t of nests) { if (t.owner === f || t.owner === 0 && Math.random() < 0.5) continue; const P = paths[s.i][t.i]; if (P && P.len < bl) { bl = P.len; bt = t; } }
    if (bt) { send(s, cloneRoute(paths[s.i][bt.i], f, bt), 0, f); return; }
  }

// ---------- input ----------
function toWorld(e) { return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S }; }
function nestAt(p, pad = 16) { let b = null, bd = 1e9; for (const n of nests.concat(camps)) { const d = Math.hypot(n.x - p.x, n.y - p.y); if (d < n.r + pad && d < bd) { bd = d; b = n; } } return b; }
let activePointer = null, downAt = 0;
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault(); initAudio();
  if (state === 'title') {
    const bx = e.clientX, by = e.clientY, ay = H * 0.82;
    if (Math.abs(by - ay) < 32) {
      if (Math.abs(bx - (W / 2 - 110)) < 30) { stageIdx = Math.max(0, stageIdx - 1); loadStage(stageIdx, true); snd('tick'); return; }
      if (Math.abs(bx - (W / 2 + 110)) < 30) { stageIdx = Math.min(unlocked, stageIdx + 1); loadStage(stageIdx, true); snd('tick'); return; }
    }
    startStage(stageIdx); return;
  }
  if (state === 'result') {
    if (tGame - resultAt < 0.7) return;
    if (result.win) stageIdx = (stageIdx + 1) % STAGES.length;
    startStage(stageIdx); return;
  }
  if (state !== 'play' || activePointer !== null) return;
  const p = toWorld(e), n = nestAt(p, 14);
  if (n && n.owner === 1) {
    activePointer = e.pointerId;
    try { cv.setPointerCapture(e.pointerId); } catch (er) {}
    drag = { src: n, pts: [{ x: n.x, y: n.y }], joins: [], cur: p, blocked: false, len: 0 };
    n.flash = 1;
  }
});
cv.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== activePointer) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) extendDrag(toWorld(ev));
});
function extendDrag(p) {
  p.x = Math.max(4, Math.min(FW - 4, p.x)); p.y = Math.max(4, Math.min(FH - 4, p.y));
  drag.cur = p;
  const last = drag.pts[drag.pts.length - 1];
  const d = Math.hypot(p.x - last.x, p.y - last.y);
  if (d < 6) return;
  if (!segClear(last, p)) { if (!drag.blocked) snd('bad', 300); drag.blocked = true; drag.wasBlocked = true; return; }
  drag.blocked = false;
  drag.pts.push({ x: p.x, y: p.y }); drag.len += d;
  for (const n of nests) {
    if (n.owner !== 1 || n === drag.src || drag.joins.some((j) => j.nest === n)) continue;
    if (Math.hypot(n.x - p.x, n.y - p.y) < n.r) { drag.joins.push({ nest: n, s: drag.len }); n.flash = 1; snd('tick'); }
  }
}
function endDrag(e) {
  if (!drag || e.pointerId !== activePointer) return;
  activePointer = null;
  const dg = drag; drag = null;
  const last = dg.pts[dg.pts.length - 1];
  const t = nestAt(last, 12);
  let tg = t;
  if ((!t || t === dg.src) && dg.len >= 45 && !dg.blocked && camps.filter((c) => c.owner === 1).length < 4) {
    tg = { camp: true, i: -1, x: last.x, y: last.y, r: 11, owner: 1, n: 0, rate: 0, cap: 999, big: false, pulse: 0, flash: 0, armed: false, route: null };
    camps.push(tg);
  } else if (!t || t === dg.src || dg.pts.length < 2) {
    if (dg.blocked || dg.wasBlocked) { msg = { text: TX.water, t: 2.2 }; }
    return;
  }
  const pts = dg.pts.slice();
  if (!tg.camp || tg !== camps[camps.length - 1] || t) pts.push({ x: tg.x, y: tg.y });
  if (pts.length < 2) pts.push({ x: tg.x + 0.1, y: tg.y });
  const r = makeRoute(pts, 1, tg, false);
  if (tg.camp && !tg.route) tg.route = r;
  let k = send(dg.src, r, 0, 1);
  for (const j of dg.joins) if (j.nest !== tg) k += send(j.nest, r, j.s, 1);
  if (k > 0) { snd('send'); fx.push({ type: 'num', x: dg.src.x, y: dg.src.y - dg.src.r - 8, text: '→' + k, t: 0, c: '#fff' }); hintT = Math.min(hintT, 0.6); }
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', (e) => { if (drag && e.pointerId === activePointer) { drag = null; activePointer = null; } });

function startStage(i) {
  stageIdx = i; loadStage(i, false); state = 'play'; signal('start');
}

// ---------- update ----------
const tmp = { x: 0, y: 0, a: 0 };
function update(dt) {
  tGame += dt;
  if (state === 'play' || state === 'title' || (state === 'result')) sim(dt);
}
function sim(dt) {

      cx.strokeStyle = 'rgba(0,0,0,0.4)'; cx.lineWidth = 2; cx.stroke();
      cx.globalAlpha = 1;
    }
  }
}
function drawTitle() {
  cx.fillStyle = 'rgba(25,18,12,0.55)'; cx.fillRect(0, 0, W, H);
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  const ty = H * 0.26;
  fitFont(TX.title, W - 30, 38);
  cx.fillStyle = '#000'; cx.fillText(TX.title, W / 2 + 2, ty + 3);
  cx.fillStyle = '#fff3dc'; cx.fillText(TX.title, W / 2, ty);
  cx.fillStyle = '#fff';
  for (const [i, t] of [TX.how1, TX.how2, TX.how3, TX.how4].entries()) { fitFont(t, W - 36, 16, '600'); cx.fillText(t, W / 2, H * 0.4 + i * 28); }
  const a = 0.55 + 0.45 * Math.sin(tGame * 4);
  cx.globalAlpha = a; fitFont(TX.tap, W - 40, 22); cx.fillStyle = '#ffe9b8'; cx.fillText(TX.tap, W / 2, H * 0.66); cx.globalAlpha = 1;
  // stage select
  const ay = H * 0.82;
  cx.fillStyle = 'rgba(0,0,0,0.45)'; cx.beginPath(); cx.roundRect ? cx.roundRect(W / 2 - 140, ay - 26, 280, 52, 26) : cx.rect(W / 2 - 140, ay - 26, 280, 52); cx.fill();
  cx.font = `bold 18px ${FONT}`; cx.fillStyle = '#fff';
  cx.fillText(TX.stageOf(stageIdx + 1, STAGES.length), W / 2, ay - (best[stageIdx] ? 7 : 0));
  if (best[stageIdx]) { cx.font = `13px ${FONT}`; cx.fillStyle = '#ffe9b8'; cx.fillText(`${TX.best} ${fmt(best[stageIdx])}`, W / 2, ay + 12); }
  cx.font = `bold 24px ${FONT}`;
  cx.fillStyle = stageIdx > 0 ? '#fff' : 'rgba(255,255,255,0.25)'; cx.fillText('◀', W / 2 - 110, ay);
  cx.fillStyle = stageIdx < unlocked ? '#fff' : 'rgba(255,255,255,0.25)'; cx.fillText('▶', W / 2 + 110, ay);
}
function fmt(t) { const s = Math.floor(t); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function drawResult() {
  const k = Math.min(1, (tGame - resultAt) * 3);
  cx.fillStyle = `rgba(20,14,10,${0.6 * k})`; cx.fillRect(0, HUD, W, H - HUD);
  cx.globalAlpha = k; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  const r = result, cy = H * 0.42;
  const head = r.all ? TX.all : r.win ? TX.clear : TX.lose;
  fitFont(head, W - 30, 34); cx.fillStyle = r.win ? '#ffe9b8' : '#ffc4b8'; cx.fillText(head, W / 2, cy - 40);
  if (r.win) {
    cx.font = `bold 30px ${FONT}`; cx.fillStyle = '#fff'; cx.fillText(`${TX.time} ${fmt(r.time)}`, W / 2, cy + 8);
    cx.font = `bold 17px ${FONT}`; cx.fillStyle = r.nb ? '#ffd76a' : '#e8dccb';
    cx.fillText(r.nb ? TX.newBest : `${TX.best} ${fmt(r.best)}`, W / 2, cy + 44);
  }
  if (tGame - resultAt > 0.7) { cx.globalAlpha = k * (0.6 + 0.4 * Math.sin(tGame * 4)); fitFont(r.win ? TX.next : TX.again, W - 40, 20); cx.fillStyle = '#fff'; cx.fillText(r.win ? TX.next : TX.again, W / 2, H * 0.68); }
  cx.globalAlpha = 1;
}

// ---------- loop ----------
let lastT = 0;
function frame(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - (lastT || ts)) / 1000)); lastT = ts;
  if ((window.innerWidth || 1) !== W || (window.innerHeight || 1) !== H) resize();
  update(dt); render();
  requestAnimationFrame(frame);
}
loadStage(0, true);
requestAnimationFrame(frame);
</script>
