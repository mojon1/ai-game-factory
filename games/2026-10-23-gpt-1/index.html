const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),en=LANG==='en',T=en?{title:'Night Wash',a:'Choose a job, then an empty washer.',b:'Advance time to wash and tick deadlines.',c:'Earn as much as possible in eight hours.',start:'Tap to start',sales:'Coins ',hour:'Hour ',lost:'Missed ',done:'Finished ',next:'Next: ',none:'No new jobs',empty:'Empty washer',wait:'Waiting',left:'Wash ',due:'Due ',duration:' hours · ',pay:' coins',go:'Advance one hour',hint:'Choose a basket, then an empty washer',busy:'This washer is busy',closed:'Closed for the night',again:'Tap to play again',names:['Shirts','Coat','Blanket']}:{title:'ぐるぐる夜洗い',a:'洗濯物を選び、空いた洗濯機へ。',b:'時間を進めると、洗濯も期限も1進む。',c:'8時間の売上を増やそう。',start:'タップでスタート',sales:'売上 ',hour:'時間 ',lost:'未達 ',done:'完了 ',next:'次：',none:'新しい依頼なし',empty:'空いている',wait:'受付待ち',left:'残り ',due:'期限 ',duration:'時間・',pay:'枚',go:'1時間進める',hint:'洗濯物を選び、空いた洗濯機をタップ',busy:'その洗濯機は使用中',closed:'今夜の営業終了',again:'タップでもう一度',names:['シャツ','コート','毛布']};
const specs=[{d:1,p:2,due:2,col:'#c8d5ab'},{d:2,p:5,due:3,col:'#a4cbd3'},{d:3,p:8,due:4,col:'#dbb4a1'}],arrivals=[[0,1],[2],[0,1],[0],[2],[1,0],[0],[1]];
const c=document.querySelector('canvas'),g=c.getContext('2d');let scale=1,ox=0,oy=0;function resize(){const w=Math.max(1,innerWidth),h=Math.max(1,innerHeight),d=Math.min(2,devicePixelRatio||1);c.width=w*d;c.height=h*d;scale=Math.min(w/360,h/640);ox=(w-360*scale)/2;oy=(h-640*scale)/2;g.setTransform(d*scale,0,0,d*scale,d*ox,d*oy)}addEventListener('resize',resize);resize();for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});
const signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};let ac;function tone(f){try{ac??=new AudioContext();ac.resume();const o=ac.createOscillator(),v=ac.createGain();o.type='sine';o.frequency.value=f;v.gain.setValueAtTime(.035,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);o.connect(v).connect(ac.destination);o.start();o.stop(ac.currentTime+.19)}catch{}}
let state='title',hour=1,sales=0,lost=0,done=0,queue=[],machines=[],selected=-1,time=0,age=0,ended=0,note='',nt=0;
function arrive(){for(const type of arrivals[hour-1]){const i=queue.indexOf(null);if(i<0){lost++;continue}const s=specs[type];queue[i]={type,left:s.d,due:s.due,p:s.p}}}
function start(){hour=1;sales=lost=done=0;queue=Array(4).fill(null);machines=[null,null];selected=-1;note='';age=0;state='play';arrive();signal('start')}
function tick(){for(let i=0;i<2;i++){const o=machines[i];if(!o)continue;o.left--;o.due--;if(o.left<=0){sales+=o.p;done++;machines[i]=null;tone(620)}else if(o.due<=0){lost++;machines[i]=null;tone(130)}}for(let i=0;i<4;i++)if(queue[i]){queue[i].due--;if(queue[i].due<=0){lost++;queue[i]=null}}selected=-1;if(hour===8){lost+=queue.filter(Boolean).length+machines.filter(Boolean).length;state='end';ended=time;signal('end',{score:sales});return}hour++;arrive()}
c.addEventListener('pointerdown',e=>{tone(240);if(state==='title'){start();return}if(state==='end'){if(time-ended>.7)start();return}const x=(e.clientX-ox)/scale,y=(e.clientY-oy)/scale;
if(y>=155&&y<=310&&x>=20&&x<=340){const i=x<180?0:1;if(machines[i]){note=T.busy;nt=1.5;return}if(selected>=0&&queue[selected]){machines[i]=queue[selected];queue[selected]=null;selected=-1;tone(400)}return}
if(y>=335&&y<=510&&x>=20&&x<=340){const row=y<422?0:1,col=x<180?0:1,i=row*2+col;selected=queue[i]?(selected===i?-1:i):-1;return}if(y>=548&&y<=605)tick()});
function text(s,x,y,size=18,col='#294653',max=326){g.fillStyle=col;g.textAlign='center';g.font='600 '+size+'px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif';g.save();g.translate(x,y);const w=g.measureText(s).width;if(w>max)g.scale(max/w,1);g.fillText(s,0,0);g.restore()}
function box(x,y,w,h,col,r=14){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function washer(i,o,yy=160){const x=i?200:20,cx=x+70;box(x,yy,140,150,'#cbd8d7');g.fillStyle='#35556c';g.beginPath();g.arc(cx,yy+59,42,0,7);g.fill();g.strokeStyle='#8ab6c5';g.lineWidth=5;g.stroke();if(o){g.save();g.translate(cx,yy+59);g.rotate(time*1.8);for(let j=0;j<3;j++){const a=j*Math.PI*2/3;box(Math.cos(a)*17-8,Math.sin(a)*17-7,16,14,specs[o.type].col,4)}g.restore();text(T.names[o.type],cx,yy+117,16,'#294653',132);text(T.left+o.left+' / '+T.due+o.due,cx,yy+139,13,'#294653',132)}else{text(T.empty,cx,yy+122,15,'#496473',132)}}
function draw(){g.clearRect(-ox/scale,-oy/scale,c.width/scale,c.height/scale);g.fillStyle='#eaf0e0';g.fillRect(0,0,360,640);
if(state==='title'){text(T.title,180,103,31);washer(0,{type:0},180);washer(1,{type:2},180);box(20,285,320,60,'#eaf0e0',0);text(T.a,180,422,16);text(T.b,180,454,15);text(T.c,180,486,16);text(T.start,180,579,21);return}
text(T.sales+sales,75,35,17);text(T.hour+hour+'/8',278,35,17);text(T.done+done+' · '+T.lost+lost,180,78,17);
if(state==='end'){text(T.closed,180,159,29);text(T.sales+sales+T.pay,180,253,34);text(T.done+done+' · '+T.lost+lost,180,313,20);washer(0,null,361);washer(1,null,361);text(T.again,180,587,21);return}
const next=hour<8?arrivals[hour].map(n=>T.names[n]).join(' / '):T.none;text(T.next+next,180,123,14);washer(0,machines[0]);washer(1,machines[1]);
for(let i=0;i<4;i++){const x=i%2?190:20,y=i<2?335:429,o=queue[i];box(x,y,150,81,o?specs[o.type].col:'#d5dfd1');if(selected===i){g.strokeStyle='#b78342';g.lineWidth=4;g.stroke()}if(!o){text(T.wait,x+75,y+47,14,'#8a9d98',142);continue}text(T.names[o.type],x+75,y+25,17,'#294653',142);text(o.left+T.duration+o.p+T.pay,x+75,y+48,14,'#294653',142);text(T.due+o.due,x+75,y+69,14,'#294653',142)}
if(nt>0)text(note,180,535,13);box(30,548,300,57,'#48787c');text(T.go,180,585,21,'#f3eed6');if(age<4)text(T.hint,180,633,12)}
let last=0;function frame(ts){const dt=Math.min(.05,Math.max(0,(ts-last)/1000));last=ts;time+=dt;if(state==='play'){age+=dt;nt-=dt}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
