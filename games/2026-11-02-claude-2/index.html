// PHYS-BEGIN
// physics core: cards are thin boxes / cylinders; a slap pushes air out from under the
// landing card, giving each nearby card edge an upward/outward kick (a "gust").
function makePhys(C) {

  const P = { world, cards: [], player: null, pspec: null, gusted: false, power: 0, K: { W: 32, H: 2.0, L: 6 } };
  function samples(sp) {
    const out = [], y = -sp.t / 2;
    if (sp.shape === 'round') { for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; out.push(new C.Vec3(Math.cos(a) * sp.r, y, Math.sin(a) * sp.r)); } }
    else {
      const hw = sp.w / 2, hh = sp.h / 2;
      for (let i = 0; i < 4; i++) { const u = -1 + i * 2 / 3; out.push(new C.Vec3(u * hw, y, -hh), new C.Vec3(u * hw, y, hh)); }
      for (let i = 1; i < 4; i++) { const u = -1 + i * 2 / 4; out.push(new C.Vec3(-hw, y, u * hh), new C.Vec3(hw, y, u * hh)); }
    }

    b.sleepSpeedLimit = 0.12; b.sleepTimeLimit = 0.25;

  }

    const b = body(sp);
    b.position.set(sp.x, (sp.y || 0) + sp.t / 2 + 0.002, sp.z);
    b.quaternion.setFromEuler(sp.tilt || 0, sp.rot || 0, 0, 'YXZ');

  };

  P.gust = () => {
    P.gusted = true;
    const pp = P.player.position, ps = P.pspec, K = P.K;
    const pr = ps.foot, GR = ps.reach, S = P.power * ps.gust;
    P.edgeHit = false;
    for (const c of P.cards) {

      const b = c.body, sp = c.spec; b.wakeUp();
      const cx = b.position.x - pp.x, cz = b.position.z - pp.z, dc = Math.hypot(cx, cz);
      const inner = sp.shape === 'round' ? sp.r * 0.75 : Math.min(sp.w, sp.h) * 0.42;

      for (const c of P.cards) { if (c.gone) continue; const b = c.body; if (b.sleepState !== C.Body.SLEEPING && P.upY(b) < -0.1) b.angularVelocity.scale(0.97, b.angularVelocity); }

    return true;
  };

}

  // distance from the slap point to the nearest card's edge (approx with samples)
  let gap = 1e9, inside = false, heavy = false;
  for (const c of cards) {
    if (c.gone || c.taken) continue;
    const p = c.body.position, dc = Math.hypot(p.x - lastSlap.x, p.z - lastSlap.z);
    const rad = c.spec.shape === 'round' ? c.spec.r : 0.6;
    if (dc < rad * 0.7) inside = true;
    const g = phys.gapTo(c, lastSlap.x, lastSlap.z, PCARD[pcardKey]).gap;
    if (g < gap) { gap = g; heavy = c.spec.mass > 2; }
  }
  return { gap, inside, heavy };
}
function finish(kind) {
  state = 'over'; overAt = performance.now();
  ghost.visible = gustDisk.visible = handMesh.visible = false; $('swap').style.display = 'none';
  const st = STAGES[stageI];
  let h = '', s = '', b = '', isNew = false;
  if (kind === 'win') {
    SND.win();
    let rewardTxt = '';
    if (st.reward && !save.deck.includes(st.reward)) { save.deck.push(st.reward); rewardTxt = D.reward(D.cards[st.reward]) + '<br>' + D.swapHint; }
    if (stageI === STAGES.length - 1) {
      kind = 'all'; h = D.win; s = D.allClear; b = D.total(totalThrows);
      if (!save.best || totalThrows < save.best) { save.best = totalThrows; isNew = true; }
      b += '<br>' + (isNew ? D.newBest : D.best(save.best));
      save.stage = 0; save.total = 0;
    } else {
      h = D.names[stageI]; s = D.win; b = D.got(st.cards.length) + (rewardTxt ? '<br>' + rewardTxt : '');
      save.stage = stageI + 1; save.total = totalThrows;
    }
  } else {
    SND.lose(); h = D.names[stageI]; s = D.lose; b = D.lost;
    totalThrows -= st.throws; save.total = totalThrows;
  }
  overKind = kind; doSave();
  signal('end', { score: kind === 'all' ? totalThrows : stageI + (kind === 'win' ? 1 : 0) });
  setTimeout(() => {
    $('r-h').textContent = h; $('r-s').textContent = s; $('r-b').innerHTML = b; $('r-b').className = 'rs-b' + (isNew ? ' new' : '');
    $('r-tap').textContent = kind === 'win' ? D.next : D.again;
    $('result').classList.add('on'); overAt = performance.now();
  }, 450);
}

// ---------- loop ----------
function resize() {
  const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
  renderer.setSize(w, h, false); camera.aspect = w / h;
  const hf = Math.atan(Math.tan(camera.fov * Math.PI / 360) * camera.aspect);
  camDist = Math.max(10, Math.min(18, (R + 0.45) / Math.tan(hf)));
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
const pitch = 0.98;
let last = performance.now(), chirpT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now; if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  stateT += dt;
  if (hintTimer > 0) { hintTimer -= dt * 1000; if (hintTimer <= 0) $('hint').style.opacity = 0; }
  if (state === 'intro' && stateT > 2.2) { state = 'aim'; banner('', '', '', false); if (stageI === 0) hint(D.hint, 3500); }
  if (phys && (state === 'fly' || state === 'resolve')) {
    phys.step(dt);
    if (state === 'fly') {
      flyT += dt;
      if (!landed && phys.gusted) {
        landed = true; const p = lastSlap.power, sp = PCARD[pcardKey];
        SND.slap(p); SND.gust(p); puff(lastSlap.x, lastSlap.z, p, sp.foot); shake = 0.12 + 0.3 * p;
        ring.position.x = lastSlap.x; ring.position.z = lastSlap.z; ringR = sp.foot + sp.reach * p; ringT = 0;
        const lvl = p < 0.25 ? 0 : p < 0.5 ? 1 : p < 0.8 ? 2 : 3;
        pop(D.slap[lvl], lastSlap.x, 0.6, lastSlap.z, 18 + lvl * 6, '#fff');
        setTimeout(() => { if (cards.some((c) => !c.gone && phys.upY(c.body) < 0.3)) SND.flip(); }, 260);
      }
      if ((landed && flyT > 0.9 && phys.quiet()) || flyT > 4) resolveThrow();
    }
  }
  if (phys) syncMeshes();
  // flying (captured / returning) meshes
  for (let i = fly.length - 1; i >= 0; i--) {
    const f = fly[i]; f.t += dt / 0.7; const k = Math.min(1, f.t), e = k * k * (3 - 2 * k);
    const to = f.back ? new THREE.Vector3(3.6, 0.6, 5.2) : new THREE.Vector3(-2.4, 6, -1.5);
    if (f.back) { f.m.position.copy(f.from); f.m.position.y += e * 1.2; f.m.scale.setScalar(Math.max(0.001, 1 - e)); }
    else { f.m.position.lerpVectors(f.from, to, e); f.m.position.y += Math.sin(k * Math.PI) * 1.5; }
    f.m.rotation.y += dt * 6;
    if (k >= 1) { scene.remove(f.m); fly.splice(i, 1); }
  }
  if (ringT < 1) { ringT += dt / 0.45; const k = Math.min(1, ringT), e = 1 - (1 - k) * (1 - k); ring.scale.setScalar(0.3 + (ringR - 0.3) * e); ring.material.opacity = (1 - k) * 0.9; }
  if (handMesh && handMesh.visible) { handMesh.position.y = 0.55 + Math.sin(now / 300) * 0.04; }
  for (const d of dust) {
    if (d.life <= 0) continue; d.life -= dt * 1.4;
    d.s.position.addScaledVector(d.v, dt); d.v.multiplyScalar(1 - 3 * dt);
    d.s.scale.setScalar(0.3 + (1 - d.life) * 0.9); d.s.material.opacity = Math.max(0, d.life) * 0.55;
    if (d.life <= 0) d.s.visible = false;
  }
  chirpT -= dt; if (chirpT < 0) { chirpT = 0.8 + Math.random() * 1.6; if (state !== 'title') SND.chirp(); }
  shake *= Math.pow(0.002, dt);
  camera.position.set(camTarget.x + (Math.random() - 0.5) * shake, camTarget.y + Math.sin(pitch) * camDist + (Math.random() - 0.5) * shake, camTarget.z + Math.cos(pitch) * camDist);
  camera.lookAt(camTarget);
  renderer.render(scene, camera);
}
showCont();
resetStage(0); state = 'title';
requestAnimationFrame(frame);
</script>
