<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>月まわし</title>
<style>
html, body, canvas, * { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #070a1a; }
canvas { display: block; width: 100vw; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
for (const t of ['contextmenu', 'selectstart', 'gesturestart']) addEventListener(t, (e) => e.preventDefault(), { passive: false });

const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const T = {
  ja: {
    title: '月まわし',
    how1: '指でなぞった向きに「月」を投げる',
    how2: 'うまく惑星を回る軌道にのせれば、',
    how3: '月が勝手にいん石をはじき返してくれる',
    start: 'タップでスタート',
    hint: '指を置いて、なぞった向きにはなす。線が緑なら安定軌道',
    stable: '安定軌道',
    fall: '落ちる',
    escape: '飛んでいく',
    over: 'ほしが こわれた',
    score: 'スコア',
    best: 'ベスト',
    newBest: 'ベスト更新！',
    maxOrbit: 'いちばん長く回った月',
    laps: '周',
    time: '守った時間',
    sec: '秒',
    again: 'タップでもう一度',
    lap: '周',
    lost: 'さよなら',
    crash: 'ぽすっ',
    wave: 'いん石がふえてきた',
  },
  en: {
    title: 'Moon Sling',
    how1: 'Swipe to throw a moon in that direction',
    how2: 'Put it into orbit around the planet',
    how3: 'and it will smash meteors for you',
    start: 'Tap to start',
    hint: 'Touch, swipe, release. A green line means a stable orbit',
    stable: 'Stable orbit',
    fall: 'Falls in',
    escape: 'Flies away',
    over: 'Planet destroyed',
    score: 'Score',
    best: 'Best',
    newBest: 'New best!',
    maxOrbit: 'Longest-lived moon',
    laps: ' laps',
    time: 'Defended',
    sec: 's',
    again: 'Tap to play again',
    lap: ' lap',
    lost: 'bye',
    crash: 'thud',
    wave: 'More meteors incoming',
  },
}[LANG === 'ja' ? 'ja' : 'en'];

const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };
let best = 0;
addEventListener('message', (e) => { if (e.data && e.data.agf === 'loaded' && e.data.data) { best = Math.max(best, e.data.data.best | 0); } });
try { parent.postMessage({ agf: 'load' }, '*'); } catch (e) {}
const saveBest = () => { try { parent.postMessage({ agf: 'save', data: { best } }, '*'); } catch (e) {} };

const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let W = 1, H = 1, DPR = 1;
let S = 1;          // px per world unit
let OX = 0, OY = 0; // planet screen position
const HUD = 56;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, window.innerWidth || 1);
  H = Math.max(1, window.innerHeight || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const avail = Math.max(1, H - HUD - 40);
  S = Math.max(0.2, Math.min(W / 2, avail / 2) / 178);
  OX = W / 2; OY = HUD + 8 + avail / 2;
}
addEventListener('resize', resize);
resize();

// ---------- world ----------
const PR = 22;          // planet radius
const GM = 3.6e6;       // gravity
const MOON_R = 7;
const MAX_MOONS = 6;
const RES_MAX = 4;
const RES_TIME = 2.4;
const LOSE_R = 330;

let stars = [];
function makeStars() {
  stars = [];
  for (let i = 0; i < 120; i++) stars.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.3 + 0.3, tw: Math.random() * 6.28 });
}
makeStars();

let state = 'title'; // title | play | over
let moons = [], rocks = [], parts = [], pops = [];
let score = 0, hp = 3, reserve = RES_MAX, resT = 0, gameT = 0, spawnT = 1.5, overAt = 0, shake = 0, hintT = 0, maxLaps = 0, newBest = false;
let waveMsgT = 0, nextWaveMsg = 30;
let moonSerial = 0;

function reset() {
  moons = []; rocks = []; parts = []; pops = [];
  score = 0; hp = 3; reserve = RES_MAX; resT = 0; gameT = 0; spawnT = 1.6; shake = 0; hintT = 5; maxLaps = 0; newBest = false;
  waveMsgT = 0; nextWaveMsg = 30; moonSerial = 0;
}

// ---------- audio ----------
let AC = null, master = null;
function audioInit() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.32; master.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(freq, dur, type = 'sine', vol = 0.3, slide = 0, delay = 0) {
  if (!AC) return;
  try {
    const t0 = AC.currentTime + delay;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
function noise(dur, vol = 0.3, freq = 800) {
  if (!AC) return;
  try {
    const n = Math.floor(AC.sampleRate * dur);
    const b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) * (1 - i / n);
    const s = AC.createBufferSource(); s.buffer = b;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
    const g = AC.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  } catch (e) {}
}
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5];
const sfx = {
  throw() { tone(260, 0.22, 'sine', 0.18, 2.4); noise(0.12, 0.08, 2400); },
  lap(m) { const f = PENTA[(m.note + Math.min(m.laps, 6)) % PENTA.length]; tone(f, 0.9, 'sine', 0.07); tone(f * 2, 0.5, 'sine', 0.02); },
  hit(mult) { tone(420 * Math.pow(1.12, Math.min(mult, 8)), 0.18, 'triangle', 0.22, 0.6); noise(0.18, 0.2, 1400); },
  crack() { noise(0.25, 0.25, 600); tone(150, 0.25, 'square', 0.06, 0.5); },
  planet() { tone(90, 0.5, 'sawtooth', 0.25, 0.4); noise(0.45, 0.4, 300); },
  lose() { tone(500, 0.35, 'sine', 0.08, 0.4); },
  over() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.6, 'triangle', 0.16, 1, i * 0.18)); },
  start() { [523, 659, 784].forEach((f, i) => tone(f, 0.25, 'sine', 0.12, 1, i * 0.07)); },
};

// ---------- physics ----------
function accel(x, y) {
  const r2 = x * x + y * y, r = Math.sqrt(r2);
  const k = -GM / (r2 * r);
  return [x * k, y * k];
}
function stepBody(b, dt) {
  // velocity Verlet
  const [ax, ay] = accel(b.x, b.y);
  b.x += b.vx * dt + 0.5 * ax * dt * dt;
  b.y += b.vy * dt + 0.5 * ay * dt * dt;
  const [bx, by] = accel(b.x, b.y);
  b.vx += 0.5 * (ax + bx) * dt;
  b.vy += 0.5 * (ay + by) * dt;
}
// predict: returns {pts, fate}
function predict(x, y, vx, vy) {
  const b = { x, y, vx, vy };
  const pts = [];
  const dt = 1 / 120;
  let fate = 'stable';
  for (let i = 0; i < 120 * 7; i++) {
    stepBody(b, dt);
    if (i % 3 === 0 && i < 120 * 1.3) pts.push([b.x, b.y]);
    const r = Math.hypot(b.x, b.y);
    if (r < PR + MOON_R) { fate = 'fall'; break; }
    if (r > LOSE_R) { fate = 'escape'; break; }
  }
  return { pts, fate };
}

// ---------- entities ----------
function addMoon(x, y, vx, vy) {
  moons.push({ x, y, vx, vy, hp: 3, laps: 0, ang: Math.atan2(y, x), sweep: 0, trail: [], note: (moonSerial++ * 2) % PENTA.length, born: gameT, flash: 0 });
}
function spawnRock() {
  const t = gameT;
  const a = Math.random() * Math.PI * 2;
  const R = 250;
  let kind = 'small';
  const rnd = Math.random();
  if (t > 25 && rnd < Math.min(0.28, 0.1 + t * 0.002)) kind = 'big';
  else if (t > 50 && rnd > 1 - Math.min(0.2, (t - 50) * 0.003)) kind = 'comet';
  const speed = (kind === 'comet' ? 1.9 : kind === 'big' ? 0.7 : 1) * Math.min(95, 34 + t * 0.55);
  const off = (Math.random() - 0.5) * 0.22;
  addRock(Math.cos(a) * R, Math.sin(a) * R, kind, speed, a + Math.PI + off);
}
function addRock(x, y, kind, speed, dir) {
  const r = kind === 'big' ? 15 : kind === 'comet' ? 6 : 9;
  const verts = [];
  const n = kind === 'comet' ? 7 : 9;
  for (let i = 0; i < n; i++) verts.push(0.72 + Math.random() * 0.36);
  rocks.push({ x, y, vx: Math.cos(dir) * speed, vy: Math.sin(dir) * speed, r, kind, verts, rot: Math.random() * 6, spin: (Math.random() - 0.5) * 3, hp: kind === 'big' ? 2 : 1 });
}
function burst(x, y, col, n, sp = 90) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = sp * (0.3 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.5, max: 1, col });
  }
}
function pop(x, y, text, col = '#fff', size = 16) { pops.push({ x, y, text, col, size, life: 1.1 }); }

// ---------- input ----------
let drag = null; // {id, x0,y0 (world), x,y (screen)}
function toWorld(px, py) { return [(px - OX) / S, (py - OY) / S]; }
function clampSpawn(wx, wy) {
  const r = Math.hypot(wx, wy), minR = PR + MOON_R + 10;
  if (r < minR) { const k = minR / Math.max(r, 0.001); return [wx * k || minR, wy * k]; }
  const maxR = 172;
  if (r > maxR) { const k = maxR / r; return [wx * k, wy * k]; }
  return [wx, wy];
}
const VK = 3.4;  // drag world-units -> velocity
const VMAX = 470;
function dragVel() {
  if (!drag) return [0, 0];
  const [wx, wy] = toWorld(drag.x, drag.y);
  let dx = (wx - drag.wx) * VK, dy = (wy - drag.wy) * VK;
  const m = Math.hypot(dx, dy);
  if (m > VMAX) { dx *= VMAX / m; dy *= VMAX / m; }
  return [dx, dy];
}

cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  audioInit();
  const now = performance.now() / 1000;
  if (state === 'title') { startGame(); return; }
  if (state === 'over') { if (now - overAt > 0.7) startGame(); return; }
  if (drag) return;
  const [wx, wy] = clampSpawn(...toWorld(e.clientX, e.clientY));
  drag = { id: e.pointerId, wx, wy, x: e.clientX, y: e.clientY, pred: null };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
}, { passive: false });
cv.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.x = e.clientX; drag.y = e.clientY; drag.pred = null;
});
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.id) return;
  const [vx, vy] = dragVel();
  const sp = Math.hypot(vx, vy);
  if (!cancel && state === 'play' && sp > 25) {
    if (reserve > 0 && moons.length < MAX_MOONS) {
      addMoon(drag.wx, drag.wy, vx, vy);
      reserve--;
      sfx.throw();
      hintT = Math.min(hintT, 0.8);
    } else {
      pop(drag.wx, drag.wy - 14, reserve <= 0 ? '…' : 'MAX', '#9ab', 14);
    }
  }
  drag = null;
}
cv.addEventListener('pointerup', (e) => endDrag(e, false));
cv.addEventListener('pointercancel', (e) => endDrag(e, true));

function startGame() {
  reset();
  state = 'play';
  sfx.start();
  signal('start');
}
function gameOver() {
  state = 'over';
  overAt = performance.now() / 1000;
  drag = null;
  for (const m of moons) maxLaps = Math.max(maxLaps, m.laps);
  if (score > best) { best = score; newBest = true; saveBest(); }
  sfx.over();
  signal('end', { score });
}

// ---------- update ----------
function update(dt) {
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; }
  parts = parts.filter((p) => p.life > 0);
  for (const p of pops) { p.life -= dt; p.y -= 22 * dt; }
  pops = pops.filter((p) => p.life > 0);
  shake = Math.max(0, shake - dt * 2.5);
  if (state !== 'play') return;

  gameT += dt;
  hintT -= dt;
  waveMsgT -= dt;
  if (gameT > nextWaveMsg) { waveMsgT = 2.2; nextWaveMsg += 30; }

  // reserve
  if (reserve < RES_MAX) {
    resT += dt;
    if (resT >= RES_TIME) { resT = 0; reserve++; tone(880, 0.12, 'sine', 0.05); }
  } else resT = 0;

  // moons
  const SUB = 4, sdt = dt / SUB;
  for (const m of moons) {
    for (let i = 0; i < SUB; i++) stepBody(m, sdt);
    const a = Math.atan2(m.y, m.x);
    let d = a - m.ang;
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    m.sweep += d; m.ang = a;
    if (Math.abs(m.sweep) >= Math.PI * 2) {
      m.sweep -= Math.sign(m.sweep) * Math.PI * 2;
      m.laps++;
      maxLaps = Math.max(maxLaps, m.laps);
      m.flash = 0.5;
      sfx.lap(m);
    }
    m.flash = Math.max(0, m.flash - dt);
    m.trail.push([m.x, m.y]);
    if (m.trail.length > 46) m.trail.shift();
    const r = Math.hypot(m.x, m.y);
    if (r < PR + MOON_R * 0.6) { m.dead = 'crash'; burst(m.x, m.y, '#cfd8ff', 10, 60); pop(m.x, m.y - 10, T.crash, '#9ab', 13); sfx.lose(); }
    else if (r > LOSE_R) { m.dead = 'lost'; sfx.lose(); }
  }

  // rocks
  spawnT -= dt;
  if (spawnT <= 0) {
    spawnRock();
    spawnT = Math.max(0.5, 2.1 - gameT * 0.018) * (0.75 + Math.random() * 0.5);
  }
  for (const r of rocks) {
    r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.spin * dt;
    const d = Math.hypot(r.x, r.y);
    if (d < PR + r.r * 0.8) {
      r.dead = true;
      hp--; shake = 1;
      burst(r.x, r.y, '#ff8a5c', 22, 130);
      sfx.planet();
      if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}
      if (hp <= 0) { burst(0, 0, '#ffcf6b', 60, 200); gameOver(); }
      continue;
    }
    for (const m of moons) {
      if (m.dead || m.hp <= 0) continue;
      const mr = MOON_R * (0.55 + m.hp * 0.15);
      if (Math.hypot(m.x - r.x, m.y - r.y) < mr + r.r) {
        const mult = 1 + Math.min(m.laps, 9);
        r.hp--;
        m.hp -= r.kind === 'big' ? 1 : 1;
        if (r.hp <= 0) {
          r.dead = true;
          const base = r.kind === 'big' ? 20 : r.kind === 'comet' ? 25 : 10;
          const pts = base * mult;
          score += pts;
          pop(r.x, r.y - 8, mult > 1 ? `+${pts} ×${mult}` : `+${pts}`, mult >= 4 ? '#7ff3ff' : mult >= 2 ? '#ffe27a' : '#fff', mult >= 4 ? 19 : 16);
          burst(r.x, r.y, '#ffd9a8', 14, 110);
          sfx.hit(mult);
          if (r.kind === 'big') {
            const sp = Math.hypot(r.vx, r.vy) * 1.1, base2 = Math.atan2(r.vy, r.vx);
            addRock(r.x, r.y, 'small', sp, base2 + 0.6);
            addRock(r.x, r.y, 'small', sp, base2 - 0.6);
          }
        } else {
          // knocked back a bit
          const nx = (r.x - m.x), ny = (r.y - m.y), nl = Math.hypot(nx, ny) || 1;
          r.x += nx / nl * 8; r.y += ny / nl * 8;
          burst(r.x, r.y, '#c9a27a', 8, 70);
          sfx.crack();
        }
        if (m.hp <= 0) { m.dead = 'broken'; burst(m.x, m.y, '#e8ecff', 16, 100); }
        m.flash = 0.25;
        break;
      }
    }
  }
  rocks = rocks.filter((r) => !r.dead);
  moons = moons.filter((m) => !m.dead);
}

// ---------- draw ----------
function W2S(x, y) { return [OX + x * S, OY + y * S]; }
function text(s, x, y, size, col = '#fff', align = 'center', weight = '700', maxW = W - 24) {
  cx.font = `${weight} ${size}px ${FONT}`;
  let w = cx.measureText(s).width;
  if (w > maxW) { size = Math.max(12, size * maxW / w); cx.font = `${weight} ${size}px ${FONT}`; }
  cx.textAlign = align; cx.textBaseline = 'middle'; cx.fillStyle = col;
  cx.fillText(s, x, y);
}
function drawBG(t) {
  const g = cx.createRadialGradient(OX, OY, 10, OX, OY, Math.max(W, H));
  g.addColorStop(0, '#16204a'); g.addColorStop(0.5, '#0b1030'); g.addColorStop(1, '#05070f');
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  for (const s of stars) {
    cx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 1.3 + s.tw);
    cx.fillStyle = '#dfe6ff';
    cx.fillRect(s.x * W, s.y * H, s.r, s.r);
  }
  cx.globalAlpha = 1;
  // faint guide rings
  cx.strokeStyle = 'rgba(140,170,255,0.06)'; cx.lineWidth = 1;
  for (const rr of [60, 110, 160]) { cx.beginPath(); cx.arc(OX, OY, rr * S, 0, 6.283); cx.stroke(); }
}
function drawPlanet(t) {
  const [x, y] = W2S(0, 0);
  const r = PR * S;
  const glow = cx.createRadialGradient(x, y, r * 0.8, x, y, r * 2.6);
  glow.addColorStop(0, 'rgba(90,170,255,0.35)'); glow.addColorStop(1, 'rgba(90,170,255,0)');
  cx.fillStyle = glow; cx.beginPath(); cx.arc(x, y, r * 2.6, 0, 6.283); cx.fill();
  const g = cx.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.1, x, y, r);
  const hurt = hp <= 1 ? 0.5 + 0.5 * Math.sin(t * 8) : 0;
  g.addColorStop(0, hurt > 0.5 ? '#ffb0a0' : '#9fe2ff'); g.addColorStop(0.6, '#2f7fd8'); g.addColorStop(1, '#173a7a');
  cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r, 0, 6.283); cx.fill();
  // continents
  cx.save(); cx.beginPath(); cx.arc(x, y, r, 0, 6.283); cx.clip();
  cx.fillStyle = 'rgba(110,210,130,0.75)';
  const sp = t * 0.25;
  for (let i = 0; i < 3; i++) {
    const a = sp + i * 2.1;
    const px = x + Math.cos(a) * r * 0.9, py = y + (i - 1) * r * 0.5;
    cx.beginPath(); cx.ellipse(px, py, r * 0.42, r * 0.24, 0.3, 0, 6.283); cx.fill();
  }
  cx.restore();
  // cracks by damage
  if (hp < 3) {
    cx.strokeStyle = 'rgba(255,140,90,0.85)'; cx.lineWidth = Math.max(1, S * 1.2);
    cx.beginPath(); cx.moveTo(x - r * 0.3, y - r * 0.7); cx.lineTo(x, y - r * 0.1); cx.lineTo(x - r * 0.15, y + r * 0.4); cx.stroke();
    if (hp < 2) { cx.beginPath(); cx.moveTo(x + r * 0.6, y - r * 0.2); cx.lineTo(x + r * 0.1, y + r * 0.1); cx.lineTo(x + r * 0.35, y + r * 0.7); cx.stroke(); }
  }
}
function moonColor(m) {
  if (m.laps >= 4) return [127, 243, 255];
  if (m.laps >= 2) return [255, 226, 122];
  if (m.laps >= 1) return [255, 248, 220];
  return [200, 210, 235];
}
function drawMoons() {
  for (const m of moons) {
    const [cr, cg, cb] = moonColor(m);
    // trail
    if (m.trail.length > 1) {
      cx.lineWidth = Math.max(1, 2 * S); cx.lineCap = 'round';
      for (let i = 1; i < m.trail.length; i++) {
        const [ax, ay] = W2S(...m.trail[i - 1]), [bx, by] = W2S(...m.trail[i]);
        cx.strokeStyle = `rgba(${cr},${cg},${cb},${(i / m.trail.length) * 0.45})`;
        cx.beginPath(); cx.moveTo(ax, ay); cx.lineTo(bx, by); cx.stroke();
      }
    }
    const [x, y] = W2S(m.x, m.y);
    const r = MOON_R * (0.55 + m.hp * 0.15) * S;
    if (m.laps >= 1 || m.flash > 0) {
      const gr = r * (2.2 + m.flash * 3);
      const g = cx.createRadialGradient(x, y, r * 0.5, x, y, gr);
      g.addColorStop(0, `rgba(${cr},${cg},${cb},0.45)`); g.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
      cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, gr, 0, 6.283); cx.fill();
    }
    cx.fillStyle = `rgb(${cr},${cg},${cb})`;
    cx.beginPath(); cx.arc(x, y, r, 0, 6.283); cx.fill();
    cx.fillStyle = 'rgba(0,0,30,0.18)';
    cx.beginPath(); cx.arc(x + r * 0.25, y + r * 0.2, r * 0.32, 0, 6.283); cx.fill();
    if (m.laps > 0) text(String(m.laps), x, y - r - 9 * Math.max(0.8, S), 12, `rgba(${cr},${cg},${cb},0.95)`);
  }
}
function drawRocks() {
  for (const r of rocks) {
    const [x, y] = W2S(r.x, r.y);
    const rad = r.r * S;
    if (r.kind === 'comet') {
      const sp = Math.hypot(r.vx, r.vy) || 1;
      const tx = x - r.vx / sp * rad * 5, ty = y - r.vy / sp * rad * 5;
      const g = cx.createLinearGradient(x, y, tx, ty);
      g.addColorStop(0, 'rgba(255,140,200,0.7)'); g.addColorStop(1, 'rgba(255,140,200,0)');
      cx.strokeStyle = g; cx.lineWidth = rad * 1.6; cx.lineCap = 'round';
      cx.beginPath(); cx.moveTo(x, y); cx.lineTo(tx, ty); cx.stroke();
    }
    cx.save(); cx.translate(x, y); cx.rotate(r.rot);
    cx.fillStyle = r.kind === 'big' ? (r.hp > 1 ? '#8a6a52' : '#a57a58') : r.kind === 'comet' ? '#ffb3d9' : '#b08868';
    cx.strokeStyle = 'rgba(0,0,0,0.35)'; cx.lineWidth = 1.5;
    cx.beginPath();
    const n = r.verts.length;
    for (let i = 0; i < n; i++) {
      const a = i / n * 6.283, rr = rad * r.verts[i];
      if (i === 0) cx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); else cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    cx.closePath(); cx.fill(); cx.stroke();
    if (r.kind === 'big' && r.hp === 1) { cx.strokeStyle = 'rgba(40,20,10,0.8)'; cx.beginPath(); cx.moveTo(-rad * 0.5, -rad * 0.3); cx.lineTo(rad * 0.1, 0); cx.lineTo(rad * 0.4, rad * 0.5); cx.stroke(); }
    cx.restore();
    // incoming warning arrow at screen edge
    if (x < 0 || x > W || y < HUD || y > H) {
      const ex = Math.max(14, Math.min(W - 14, x)), ey = Math.max(HUD + 12, Math.min(H - 14, y));
      cx.fillStyle = r.kind === 'comet' ? 'rgba(255,140,200,0.8)' : 'rgba(255,170,110,0.7)';
      cx.beginPath(); cx.arc(ex, ey, r.kind === 'big' ? 6 : 4, 0, 6.283); cx.fill();
    }
  }
}
function drawDrag() {
  if (!drag || state !== 'play') return;
  const [sx, sy] = W2S(drag.wx, drag.wy);
  const [vx, vy] = dragVel();
  const sp = Math.hypot(vx, vy);
  const can = reserve > 0 && moons.length < MAX_MOONS;
  cx.globalAlpha = can ? 1 : 0.4;
  if (sp > 25) {
    if (!drag.pred) drag.pred = predict(drag.wx, drag.wy, vx, vy);
    const { pts, fate } = drag.pred;
    const col = fate === 'stable' ? '#7dffa8' : fate === 'fall' ? '#ff8a7a' : '#ffc46b';
    cx.fillStyle = col;
    pts.forEach(([px, py], i) => {
      const [qx, qy] = W2S(px, py);
      cx.globalAlpha = (can ? 1 : 0.4) * (1 - i / pts.length) * 0.9;
      cx.beginPath(); cx.arc(qx, qy, Math.max(1.5, 2.4 * S), 0, 6.283); cx.fill();
    });
    cx.globalAlpha = can ? 1 : 0.4;
    const label = fate === 'stable' ? T.stable : fate === 'fall' ? T.fall : T.escape;
    const ly = sy < HUD + 50 ? sy + 34 : sy - 28;
    text(label, Math.max(60, Math.min(W - 60, sx)), ly, 14, col);
    // arrow
    cx.strokeStyle = 'rgba(255,255,255,0.5)'; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(sx, sy); cx.lineTo(drag.x, drag.y); cx.stroke();
  }
  cx.strokeStyle = 'rgba(220,230,255,0.9)'; cx.lineWidth = 1.5;
  cx.beginPath(); cx.arc(sx, sy, MOON_R * 0.95 * S, 0, 6.283); cx.stroke();
  cx.globalAlpha = 1;
}
function drawFX() {
  for (const p of parts) {
    const [x, y] = W2S(p.x, p.y);
    cx.globalAlpha = Math.max(0, p.life);
    cx.fillStyle = p.col;
    cx.fillRect(x - 1.5, y - 1.5, 3, 3);
  }
  cx.globalAlpha = 1;
  for (const p of pops) {
    const [x, y] = W2S(p.x, p.y);
    cx.globalAlpha = Math.min(1, p.life * 1.5);
    text(p.text, x, y, p.size, p.col);
  }
  cx.globalAlpha = 1;
}
function drawHUD() {
  cx.fillStyle = 'rgba(5,8,20,0.55)'; cx.fillRect(0, 0, W, HUD);
  text(`${T.score}`, 14, 16, 12, '#9fb0d8', 'left', '600');
  text(String(score), 14, 37, 22, '#fff', 'left', '800', W * 0.4);
  // hearts
  for (let i = 0; i < 3; i++) {
    const hx = W - 20 - i * 22, hy = 18;
    cx.fillStyle = i < hp ? '#5fc0ff' : 'rgba(95,192,255,0.18)';
    cx.beginPath(); cx.arc(hx, hy, 7, 0, 6.283); cx.fill();
  }
  text(`${T.best} ${best}`, W - 12, 40, 14, '#9fb0d8', 'right', '600', W * 0.35);
  // reserve moons
  const n = RES_MAX, bx = W / 2 - (n - 1) * 11;
  for (let i = 0; i < n; i++) {
    const x = bx + i * 22, y = 28;
    cx.strokeStyle = 'rgba(220,230,255,0.4)'; cx.lineWidth = 1.5;
    cx.beginPath(); cx.arc(x, y, 7, 0, 6.283); cx.stroke();
    if (i < reserve) { cx.fillStyle = '#e8ecff'; cx.beginPath(); cx.arc(x, y, 7, 0, 6.283); cx.fill(); }
    else if (i === reserve) { cx.fillStyle = 'rgba(232,236,255,0.6)'; cx.beginPath(); cx.moveTo(x, y); cx.arc(x, y, 7, -Math.PI / 2, -Math.PI / 2 + 6.283 * resT / RES_TIME); cx.closePath(); cx.fill(); }
  }
}
function draw(t) {
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx.save();
  if (shake > 0) cx.translate((Math.random() - 0.5) * shake * 10, (Math.random() - 0.5) * shake * 10);
  drawBG(t);
  if (state === 'title') {
    // demo orbits
    const demo = [[70, 2.2, '#fff8dc'], [115, 4.1, '#ffe27a'], [155, 6.3, '#7ff3ff']];
    for (const [rr, per, col] of demo) {
      const a = t * 6.283 / per;
      cx.strokeStyle = 'rgba(160,190,255,0.12)'; cx.lineWidth = 1;
      cx.beginPath(); cx.arc(OX, OY, rr * S, 0, 6.283); cx.stroke();
      cx.fillStyle = col; cx.beginPath(); cx.arc(OX + Math.cos(a) * rr * S, OY + Math.sin(a) * rr * S, 5 * S + 1, 0, 6.283); cx.fill();
    }
    drawPlanet(t);
    cx.restore();
    cx.fillStyle = 'rgba(5,8,20,0.45)'; cx.fillRect(0, 0, W, H);
    text(T.title, W / 2, H * 0.2, 46, '#fff', 'center', '800');
    text(T.how1, W / 2, H * 0.2 + 52, 15, '#cfe0ff', 'center', '600');
    text(T.how2, W / 2, H * 0.2 + 76, 15, '#cfe0ff', 'center', '600');
    text(T.how3, W / 2, H * 0.2 + 100, 15, '#cfe0ff', 'center', '600');
    cx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 3);
    text(T.start, W / 2, H * 0.82, 20, '#fff', 'center', '700');
    cx.globalAlpha = 1;
    if (best > 0) text(`${T.best} ${best}`, W / 2, H * 0.82 + 34, 14, '#9fb0d8', 'center', '600');
    return;
  }
  drawMoons();
  if (state === 'play' || shake > 0) drawPlanet(t);
  drawRocks();
  drawDrag();
  drawFX();
  cx.restore();
  drawHUD();
  if (state === 'play') {
    if (hintT > 0) { cx.globalAlpha = Math.min(1, hintT); text(T.hint, W / 2, H - 26, 14, '#e8ecff', 'center', '600'); cx.globalAlpha = 1; }
    if (waveMsgT > 0) { cx.globalAlpha = Math.min(1, waveMsgT); text(T.wave, W / 2, HUD + 26, 15, '#ffc46b', 'center', '700'); cx.globalAlpha = 1; }
  }
  if (state === 'over') {
    cx.fillStyle = 'rgba(5,8,20,0.7)'; cx.fillRect(0, 0, W, H);
    const y0 = H * 0.26;
    text(T.over, W / 2, y0, 22, '#ffb0a0', 'center', '700');
    text(String(score), W / 2, y0 + 58, 54, '#fff', 'center', '800');
    if (newBest) text(T.newBest, W / 2, y0 + 104, 18, '#ffe27a', 'center', '800');
    else text(`${T.best} ${best}`, W / 2, y0 + 104, 16, '#9fb0d8', 'center', '600');
    text(`${T.maxOrbit}: ${maxLaps}${T.laps}`, W / 2, y0 + 146, 15, '#cfe0ff', 'center', '600');
    text(`${T.time}: ${Math.floor(gameT)}${T.sec}`, W / 2, y0 + 172, 15, '#cfe0ff', 'center', '600');
    if (performance.now() / 1000 - overAt > 0.7) {
      cx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 3);
      text(T.again, W / 2, H * 0.8, 20, '#fff', 'center', '700');
      cx.globalAlpha = 1;
    }
  }
}

let last = 0;
function frame(ts) {
  const t = ts / 1000;
  const dt = Math.min(0.05, Math.max(0, t - (last || t)));
  last = t;
  if (W < 2 || H < 2) resize();
  update(dt);
  draw(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
