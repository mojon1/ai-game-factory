<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>雨玉の分け板</title><style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overscroll-behavior:none;background:#173740;color:#f5e8bd;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:radial-gradient(ellipse,#3a6770,#173740)}header{position:absolute;top:4%;left:6%;right:6%;display:flex;justify-content:space-between;font-size:17px}#next{position:absolute;top:11%;width:100%;text-align:center;font-size:16px}canvas{position:absolute;top:18%;left:0;width:100%;height:68%}#hint{position:absolute;bottom:4%;width:100%;text-align:center;font-size:14px}#cover{position:absolute;inset:0;padding:7%;background:#173740ef;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}#cover.hidden{display:none}#feedback{position:absolute;top:87%;width:100%;text-align:center;font-size:17px}#meter{position:absolute;top:15%;left:10%;width:80%;height:4px;background:#426b70}#fill{height:100%;background:#eed69d}h1{font-size:clamp(25px,7vw,35px)}p{font-size:17px;line-height:1.7;white-space:pre-line}
</style></head><body><div id="game"><header><span id="score"></span><span id="left"></span></header><div id="next"></div><div id="meter"><div id="fill"></div></div><canvas></canvas><div id="feedback"></div><div id="hint"></div><div id="cover"></div></div><script src="../../lib/matter-0.20.0.min.js"></script><script>
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),words={ja:{title:'雨玉の分け板',intro:'指を左右へ動かして板を傾ける。\n青い丸は左、金のひし形は右へ。\n十個中、八個の正解を目指そう。',start:'タップでスタート',again:'タップでもう一度',score:'正解',left:'残り',next:'次',now:'今',rainbow:'虹の雨あがり！',goal:'目標8個を達成！',more:'目標まであと',blue:'青丸',gold:'金菱',done:'雨あがり',missed:'取り逃し',caught:'正解！',best:'ベスト',newBest:'ベスト更新！',hint:'指を左へ＝左下がり／右へ＝右下がり'},en:{title:'Rain-Marble Board',intro:'Move your finger to tilt the board.\nBlue circles left; gold diamonds right.\nAim to sort eight of ten drops.',start:'Tap to start',again:'Tap to play again',score:'Sorted',left:'Left',next:'Next',now:'Now',rainbow:'A rainbow after rain!',goal:'Eight-drop goal reached!',more:'More for goal:',blue:'Blue',gold:'Gold',done:'After the rain',missed:'Missed',caught:'Sorted!',best:'Best',newBest:'New best!',hint:'Move left to lower left; right to lower right'}};
const t=words[LANG==='ja'?'ja':'en'],$=x=>document.getElementById(x),cv=document.querySelector('canvas'),g=cv.getContext('2d'),cover=$('cover'),{Engine,Bodies,Body,Composite}=Matter;
const engine=Engine.create();engine.gravity.y=1;
const board=Bodies.rectangle(180,220,210,12,{isStatic:true,friction:.015,restitution:.1});Composite.add(engine.world,[board,Bodies.rectangle(6,220,8,440,{isStatic:true,restitution:.15}),Bodies.rectangle(354,220,8,440,{isStatic:true,restitution:.15})]);
const signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};
for(const type of ['contextmenu','selectstart','gesturestart'])addEventListener(type,e=>e.preventDefault(),{passive:false});
let mode='title',balls=[],queue=[],spawned=0,resolved=0,score=0,best=0,angle=0,target=0,time=0,nextDrop=.6,ended=0,started=0,last=0,finger=null,flash=[0,0],feedback='',feedbackTime=0,ac=null;
function sound(f){try{if(!ac)return;const o=ac.createOscillator(),v=ac.createGain();o.type='sine';o.frequency.value=f;v.gain.setValueAtTime(.035,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.17);o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+.18)}catch{}}
function unlock(){try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch{}}
function overlay(title,body,action){cover.innerHTML='<h1>'+title+'</h1><p>'+body+'</p><p>'+action+'</p>';cover.classList.remove('hidden')}
function start(){for(const b of balls)Composite.remove(engine.world,b.body);balls=[];const tail=[0,0,0,1,1,1,1,1];for(let i=tail.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[tail[i],tail[j]]=[tail[j],tail[i]]}queue=[0,0,...tail];spawned=0;resolved=0;score=0;angle=0;target=0;time=0;nextDrop=.6;flash=[0,0];feedback='';feedbackTime=0;finger=null;Body.setAngle(board,0);mode='play';started=performance.now();cover.classList.add('hidden');signal('start')}
function finish(){mode='result';ended=performance.now();finger=null;const improved=score>best;best=Math.max(score,best);signal('end',{score});overlay(score>=8?t.rainbow:t.done,t.score+' '+score+'/10\n'+t.best+' '+best+(improved?'\n'+t.newBest:'')+'\n'+(score>=8?t.goal:t.more+' '+(8-score)),t.again)}
function point(e){const r=cv.getBoundingClientRect();target=Math.max(-.6,Math.min(.6,(e.clientX-r.left-r.width/2)/(r.width/2)*.6))}
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();if(mode!=='play'||finger!==null)return;finger=e.pointerId;point(e);try{cv.setPointerCapture(finger)}catch{}});
cv.addEventListener('pointermove',e=>{if(e.pointerId===finger)point(e)});
for(const type of ['pointerup','pointercancel'])cv.addEventListener(type,e=>{if(e.pointerId===finger)finger=null});
cover.addEventListener('pointerdown',e=>{e.preventDefault();unlock();if(mode==='title'||performance.now()-ended>=700)start()});
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d)}addEventListener('resize',resize);resize();
function update(dt){feedbackTime=Math.max(0,feedbackTime-dt);flash=flash.map(f=>Math.max(0,f-dt));if(mode!=='play')return;time+=dt;angle+=Math.max(-1.8*dt,Math.min(1.8*dt,target-angle));Body.setAngle(board,angle);
if(spawned<10&&time>=nextDrop){const body=Bodies.circle(180+(Math.random()-.5)*30,25,10,{friction:.015,frictionAir:.002,restitution:.25});balls.push({body,type:queue[spawned],born:time});Composite.add(engine.world,body);spawned++;nextDrop+=1.8}
Engine.update(engine,dt*1000);
for(let i=balls.length-1;i>=0;i--){const b=balls[i],p=b.body.position;if(p.y>410||time-b.born>8||p.x< -40||p.x>400){const side=p.x<120?0:p.x>240?1:-1;if(p.y>410&&side===b.type){score++;flash[side]=.6;feedback=t.caught;feedbackTime=.8;sound(500+score*25)}else{feedback=t.missed;feedbackTime=.8;sound(100)}resolved++;Composite.remove(engine.world,b.body);balls.splice(i,1)}}
if(resolved===10)finish()}
function draw(now){g.setTransform(cv.width/360,0,0,cv.height/440,0,0);g.clearRect(0,0,360,440);
g.strokeStyle='#91bdc055';g.lineWidth=3;for(const x of [10,350]){g.beginPath();g.moveTo(x,30);g.lineTo(x,435);g.stroke()}g.strokeStyle='#91bdc044';g.lineWidth=1;for(let i=0;i<14;i++){const x=(i*83)%360,y=(i*47+now*.025)%400;g.beginPath();g.moveTo(x,y);g.lineTo(x-3,y+9);g.stroke()}
g.fillStyle='#a9d3ca';g.beginPath();g.moveTo(168,245);g.lineTo(180,220);g.lineTo(192,245);g.fill();
g.save();g.translate(180,220);g.rotate(angle);g.fillStyle='#d0ab78';g.fillRect(-105,-6,210,12);g.strokeStyle='#eed6a0';g.lineWidth=2;g.strokeRect(-105,-6,210,12);g.restore();
for(let s=0;s<2;s++){const x=s?285:75;g.strokeStyle=s?'#f3d27e':'#8bd5ed';g.lineWidth=5;g.beginPath();g.moveTo(x-60,395);g.lineTo(x-50,430);g.lineTo(x+50,430);g.lineTo(x+60,395);g.stroke();g.fillStyle=s?'#f3d27e':'#8bd5ed';g.font='15px system-ui';g.textAlign='center';g.fillText(s?t.gold:t.blue,x,380);if(flash[s]>0){g.beginPath();g.arc(x,408,20+(1-flash[s]/.6)*30,0,7);g.stroke()}}
for(const b of balls){const p=b.body.position;g.save();g.translate(p.x,p.y);g.rotate(b.body.angle);g.fillStyle=b.type?'#f3d27e':'#8bd5ed';g.beginPath();if(b.type){g.moveTo(0,-12);g.lineTo(12,0);g.lineTo(0,12);g.lineTo(-12,0);g.closePath()}else g.arc(0,0,10,0,7);g.fill();g.restore()}
$('fill').style.width=(spawned<10?Math.max(0,Math.min(1,(nextDrop-time)/(spawned===0?.6:1.8)))*100:0)+'%';$('feedback').textContent=mode==='play'&&feedbackTime>0?feedback:'';$('feedback').style.color=feedback===t.missed?'#ffb0a7':'#e9f1b7';$('score').textContent=t.score+' '+score+'/10';$('left').textContent=t.left+' '+(10-resolved);const incoming=balls.find(b=>b.body.position.y<310);$('next').textContent=t.now+' '+(incoming?(incoming.type?t.gold:t.blue):'—')+' / '+t.next+' '+queue.slice(spawned,spawned+2).map(n=>n?t.gold:t.blue).join(' · ');$('hint').textContent=mode==='play'&&now-started<6000?t.hint:'';
}
function loop(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw(now);requestAnimationFrame(loop)}
overlay(t.title,t.intro,t.start);requestAnimationFrame(loop);
</script></body></html>
