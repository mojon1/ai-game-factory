const WMAX = 8.5;

  if (charRes && (scene === 'judge' || scene === 'charDone')) {
    const shown = Math.round(charRes.shown);
    if (charRes.sc >= 92 && scene === 'charDone') drawHanamaru(paper.x + paper.s * 0.9, paper.y + paper.s * 0.9, paper.s * 0.1, Math.min(1, sceneT / 0.8));
    const y = paper.y + paper.s + 34;
    txt(`${shown}${T.pts}`, W / 2, y, 34, charRes.sc >= 85 ? '#ffb39a' : '#f6ecd9', 'center', '800');
    if (scene === 'charDone') {
      txt(charRes.cm, W / 2, y + 32, 15, '#efe3cf', 'center', '600');
      const ct = charRes.rec && charRes.prev ? T.charRec : `${T.charBest} ${Math.max(charRes.prev, charRes.sc)}`;
      txt(ct, W / 2, y + 54, 13, charRes.rec && charRes.prev ? '#ffcf6b' : '#a8977f', 'center', '600');
      if (sceneT > 0.7) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(now * 3); txt(T.next, W / 2, Math.min(H - 16, y + 84), 16, '#ffcfb8', 'center', '700'); ctx.globalAlpha = 1; }
    }
  } else drawPopups();
  if (hintT > 0 && scene === 'write') { ctx.globalAlpha = Math.min(1, hintT); txt(T.hint, W / 2, H - 18, 14, '#f6ecd9', 'center', '600'); ctx.globalAlpha = 1; }
}
function drawFinal() {
  txt(T.result, W / 2, 34, 18, '#cdbfa8', 'center', '600');
  const n = works.length, cols = Math.min(n, 5), cell = Math.min((W - 24) / cols, 110), gap = 4;
  const rowW = cols * cell, x0 = (W - rowW) / 2, y0 = 60;
  works.forEach((w, i) => {
    const x = x0 + i * cell + gap / 2, s = cell - gap;
    ctx.drawImage(w.img, x, y0, s, s);
    txt(String(w.sc), x + s / 2, y0 + s + 12, 13, w.sc >= 85 ? '#ffb39a' : '#e9dcc6', 'center', '700');
  });
  const ym = y0 + cell + 54;
  const rk = rankOf(total);
  txt(JA ? `${rk}${T.rank}` : rk, W / 2, ym + 10, Math.min(48, W * 0.13), '#ffd2bd', 'center', '800');
  txt(`${T.total} ${total} / 500`, W / 2, ym + 64, 26, '#f6ecd9', 'center', '800');
  txt(newBest ? T.newBest : `${T.best} ${best}`, W / 2, ym + 98, 16, newBest ? '#ffcf6b' : '#cdbfa8', 'center', '700');
  if (newBest || total >= 465) drawHanamaru(W / 2 + Math.min(140, W * 0.4), ym + 64, 20, Math.min(1, sceneT / 0.9));
  const all = Object.keys(CH), got = all.filter((c) => (cbest[c] || 0) >= 92).length;
  const yb = ym + 132;
  txt(`${T.book} ${got} / ${all.length}`, W / 2, yb, 14, '#cdbfa8', 'center', '600');
  const bc = Math.min(24, (W - 24) / 7), bx = W / 2 - bc * 3.5;
  all.forEach((c, i) => {
    const x = bx + (i % 7 + 0.5) * bc, y = yb + 22 + Math.floor(i / 7) * (bc + 4), v = cbest[c] || 0;
    if (v >= 92) { ctx.fillStyle = 'rgba(217,52,31,0.9)'; ctx.beginPath(); ctx.arc(x, y, bc * 0.46, 0, 6.2832); ctx.fill(); }
    txt(c, x, y + 1, Math.round(bc * 0.62), v >= 92 ? '#fff' : v ? '#e9dcc6' : 'rgba(233,220,198,0.28)', 'center', '700');
  });
  if (sceneT > 0.7) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(now * 3); txt(T.again, W / 2, Math.min(H - 20, yb + 22 + 2 * (bc + 4) + 18), 18, '#ffcfb8', 'center', '700'); ctx.globalAlpha = 1; }
}

// ---- ループ
let lastT = performance.now();
function loop(t) {
  const dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000)); lastT = t; now += dt;
  sceneT += dt;
  if (st && pid !== null) holdStroke(performance.now(), dt * 1000);
  if (scene === 'title') { if (!demo) demo = makeDemo(); stepDemo(dt); }
  for (const m of marks) m.t += dt;
  for (const p of popups) p.t += dt;
  if (hintT > 0) hintT -= dt;
  if (scene === 'pause' && sceneT > 0.55) finishChar();
  if (scene === 'judge') {
    guideA = Math.max(0, guideA - dt * 2);
    charRes.shown = Math.min(charRes.sc, charRes.shown + dt * charRes.sc * 1.6);
    if (charRes.shown >= charRes.sc) { scene = 'charDone'; sceneT = 0; knock(); if (charRes.sc >= 92) [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.3, 0.05, 'sine', i * 0.07)); }
  }
  if (scene === 'write' || scene === 'pause') guideA = Math.min(1, guideA + dt * 3);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
