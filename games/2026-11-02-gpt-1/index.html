<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ねっこの水さがし</title><style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overscroll-behavior:none;overflow:hidden;background:#241e30;color:#fff4d9;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}#app{position:relative;width:100vw;height:100dvh;max-width:520px;margin:auto}canvas{width:100%;height:100%;display:block}#hud{position:absolute;top:2%;left:5%;right:5%;display:flex;justify-content:space-between;font-size:16px;font-weight:700}#msg{position:absolute;top:10%;left:4%;right:4%;text-align:center;font-size:14px;min-height:42px}#undo{position:absolute;bottom:3%;left:4%;width:27%;height:48px;border:1px solid #d4bd93;border-radius:22px;background:#4d3940;color:#fff4d9;font:700 14px system-ui}#harvest{position:absolute;bottom:3%;left:35%;width:61%;height:48px;background:#f1c878;color:#332d35;border:0;border-radius:22px;font:700 16px system-ui}#overlay{position:absolute;inset:0;background:#241e30ed;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}h1{font-size:clamp(25px,7.4vw,37px);line-height:1.4;margin:15px 0}p{font-size:15px;line-height:1.7;margin:18px 0}.big{font-size:42px;color:#f8cc6b}.small{color:#ccbba7;font-size:13px}#hint{position:absolute;bottom:13%;width:100%;text-align:center;font-size:13px;pointer-events:none}
</style><div id="app"><canvas id="c"></canvas><div id="hud"></div><div id="msg"></div><div id="hint"></div><button id="undo"></button><button id="harvest"></button><div id="overlay"></div></div><script src="../../lib/anime-4.5.0.min.js"></script><script>
const en=(new URLSearchParams(location.search).get('lang')||navigator.language).startsWith('en'),T=(j,e)=>en?e:j,$=s=>document.querySelector(s),c=$('#c'),g=c.getContext('2d'),hud=$('#hud'),msg=$('#msg'),ov=$('#overlay'),hint=$('#hint'),harvest=$('#harvest'),undo=$('#undo');document.documentElement.lang=en?'en':'ja';
for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});
const signal=(agf,data={})=>{try{parent.postMessage({agf,...data},'*')}catch{}};let audio;function sound(f){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),v=audio.createGain();o.type='sine';o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.3,audio.currentTime+.13);v.gain.setValueAtTime(.055,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.25);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+.26)}catch{}}
let W=360,H=640,S=60,ox=30,oy=140,state='title',best=0,turn=0,sap=7,score=0,endAt=0,cells=[],links=[],burst={v:0},startTime=0,history=[];
const idx=(x,y)=>y*5+x,near=i=>[i%5>0?i-1:-1,i%5<4?i+1:-1,i>=5?i-5:-1,i<25?i+5:-1].filter(v=>v>=0),available=i=>cells[i]&&!cells[i].root&&cells[i].type!=='rock'&&near(i).some(n=>cells[n].root);
function field(){cells=Array.from({length:30},()=>({type:'soil',root:false,born:-1}));for(const i of [6,13,20,24])cells[i].type='rock';for(const i of [11,14,22,25])cells[i].type='water';for(const i of [5,9,12,15,17,19,26,28])cells[i].type='carrot';cells[2].root=true;links=[];turn=0;sap=7;score=0;history=[];}
function resize(){W=$('#app').clientWidth||360;H=$('#app').clientHeight||640;const d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0);S=Math.min(W*.18,H*.105);ox=(W-S*5)/2;oy=H*.23;draw();}addEventListener('resize',resize);
function text(s,x,y,size,color='#fff4d9'){g.fillStyle=color;g.font=`700 ${size}px system-ui`;g.textAlign='center';g.textBaseline='middle';g.fillText(s,x,y)}
function draw(){g.clearRect(0,0,W,H);g.fillStyle='#35283b';g.fillRect(0,0,W,H);g.fillStyle='#73916c';g.fillRect(0,oy-15,W,17);for(let i=0;i<30;i++){const x=ox+(i%5)*S,y=oy+Math.floor(i/5)*S,z=cells[i];if(!z)continue;g.fillStyle=available(i)?'#705747':'#4d3940';g.beginPath();g.roundRect(x+3,y+3,S-6,S-6,10);g.fill();if(z.type==='rock'){text('◆',x+S/2,y+S/2,S*.5,'#97898c')}if(z.type==='water'&&!z.root){g.fillStyle='#7bcde0';g.beginPath();g.ellipse(x+S/2,y+S/2,S*.24,S*.28,0,0,7);g.fill();text('+2',x+S/2,y+S/2,14,'#203d57')}if(z.type==='carrot'){let age=z.root?turn-z.born:0;g.save();g.translate(x+S/2,y+S/2);g.rotate(-.3);g.fillStyle=age>=3?'#ffb35c':'#bc7653';g.beginPath();g.moveTo(-S*.16,-S*.17);g.lineTo(S*.16,-S*.17);g.lineTo(0,S*.26);g.closePath();g.fill();g.strokeStyle='#a1c776';g.lineWidth=3;g.beginPath();g.moveTo(0,-S*.17);g.lineTo(-S*.09,-S*.32);g.moveTo(0,-S*.17);g.lineTo(S*.12,-S*.30);g.stroke();g.restore();if(z.root)text(age>=3?'10':String(3-age),x+S*.8,y+S*.76,14,age>=3?'#ffe88f':'#e9c0a0')}}g.lineWidth=3;g.lineCap='round';g.strokeStyle='#ecd7a0';for(const [j,[a,b]]of links.entries()){const f=j===links.length-1?1-burst.v:1;g.beginPath();g.moveTo(ox+(a%5+.5)*S,oy+(Math.floor(a/5)+.5)*S);g.lineTo(ox+(a%5+.5)*S+(b%5-a%5)*S*f,oy+(Math.floor(a/5)+.5)*S+(Math.floor(b/5)-Math.floor(a/5))*S*f);g.stroke()}for(let i=0;i<30;i++)if(cells[i]?.root){const x=ox+(i%5+.5)*S,y=oy+(Math.floor(i/5)+.5)*S;g.fillStyle='#ffebc3';g.beginPath();g.arc(x,y,4,0,7);g.fill()}text('♧',ox+2.5*S,oy-32,30,'#a8cc78');}
function update(){score=cells.reduce((a,z)=>a+(z.type==='carrot'&&z.root?(turn-z.born>=3?10:4):0),0);hud.innerHTML=`<span>${T('収穫','Harvest')} ${score}</span><span>${T('養分','Sap')} ${sap}　·　${T('ベスト','Best')} ${best}</span>`;undo.textContent=T('一手戻す','Undo');undo.disabled=!history.length;undo.style.opacity=history.length?1:.4;harvest.textContent=T('ここで収穫','Harvest now');draw()}
function start(){field();state='play';ov.style.display='none';harvest.style.display=undo.style.display='block';msg.textContent=T('どの根からでも枝分かれできる','Branch from any part of your roots');hint.textContent=T('1手で養分−1。若い実4点 → 3手後10点','A move costs 1 sap. Young: 4 → ripe: 10 in 3 moves.');startTime=performance.now();signal('start');update()}
function grow(i){if(state!=='play')return;if(!available(i)){msg.textContent=cells[i]?.type==='rock'?T('岩には根を伸ばせない','Roots cannot pass through rock'):T('今ある根の上下左右へ伸ばそう','Grow beside any existing root');sound(100);return}history.push({cells:cells.map(z=>({...z})),links:links.map(z=>[...z]),turn,sap});const from=near(i).find(n=>cells[n].root),z=cells[i];const ripeBefore=cells.filter(q=>q.root&&q.type==='carrot'&&turn-q.born>=3).length;burst.v=1;z.root=true;z.born=++turn;links.push([from,i]);sap--;if(z.type==='water')sap+=3;msg.textContent=z.type==='water'?T('水を吸った！ 費用込みで養分+2','Water found! Net +2 sap'):T('枝を伸ばそう','Keep branching');const ripeNow=cells.filter(q=>q.root&&q.type==='carrot'&&turn-q.born>=3).length;if(ripeNow>ripeBefore)msg.textContent+=T(' ／ 熟した！ +6点',' / Ripe! +6 points');sound(ripeNow>ripeBefore?880:z.type==='water'?650:260);update();anime.animate(burst,{v:0,duration:350,onUpdate:draw});if(sap<=0||!cells.some((_,i)=>available(i)))finish()}
function finish(){if(state!=='play')return;update();state='end';endAt=performance.now();if(score>best){best=score;signal('save',{data:{best}})}signal('end',{score});harvest.style.display=undo.style.display='none';hint.textContent='';ov.style.display='flex';ov.innerHTML=`<div><h1>${T('根から、いただきます','A harvest from below')}</h1><div class="big">${score}</div><p>${T('熟した実','Ripe')} ${cells.filter(z=>z.root&&z.type==='carrot'&&turn-z.born>=3).length} × 10<br>${T('若い実','Young')} ${cells.filter(z=>z.root&&z.type==='carrot'&&turn-z.born<3).length} × 4</p><p>${T('ベスト','Best')} ${best}</p><p>${T('タップでもう一度','Tap to play again')}</p></div>`;sound(780)}
function title(){ov.innerHTML=`<div><div class="big">♧</div><h1>${T('ねっこの水さがし','Roots Seeking Water')}</h1><p>${T('根のとなりをタップして、水とにんじんへ。<br>養分がなくなる前に収穫しよう。','Tap beside roots to reach water and carrots.<br>Harvest before the sap runs out.')}</p><p>${T('タップでスタート','Tap to start')}</p></div>`;harvest.style.display=undo.style.display='none'}
addEventListener('pointerdown',e=>{e.preventDefault();sound(180);if(state==='title'){start();return}if(state==='end'){if(performance.now()-endAt>=700)start();return}if(e.target===undo){const q=history.pop();if(q){({cells,links,turn,sap}=q);burst.v=0;msg.textContent=T('一手戻した。別の枝を試そう','Undone. Try another branch.');sound(330);update()}return}if(e.target===harvest){finish();return}const r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left-ox)/S),y=Math.floor((e.clientY-r.top-oy)/S);if(x>=0&&x<5&&y>=0&&y<6)grow(idx(x,y));},{passive:false});
addEventListener('message',e=>{if(e.data?.agf==='loaded'){best=Math.max(best,Number(e.data.data?.best)||0);if(state==='play')update()}});signal('load');field();title();resize();function frame(){if(state==='play'&&performance.now()-startTime>6500)hint.textContent='';requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
