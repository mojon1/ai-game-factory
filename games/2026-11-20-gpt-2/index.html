<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overscroll-behavior:none;background:#1d414c;color:#fff5d8;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}canvas{width:100vw;height:100dvh;display:block}header{position:absolute;top:3%;left:6%;right:6%;display:flex;justify-content:space-between;font-size:16px;font-weight:700;pointer-events:none}#info{position:absolute;top:10%;width:100%;text-align:center;font-size:15px;pointer-events:none}#hint{position:absolute;bottom:3%;width:100%;text-align:center;font-size:14px;pointer-events:none}#cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;background:#193a47f2}#cover.hidden{display:none}#cover.result{align-items:flex-end;padding:0;background:transparent}#cover.result>div{width:100%;padding:15px 12px;background:#193a47f5}#cover.result h1{font-size:24px;margin:0}#cover.result p{font-size:14px;line-height:1.4;margin:8px}#cover.result b{font-size:17px;margin-top:10px}h1{font-size:30px;line-height:1.3;margin:0 0 22px}p{font-size:16px;line-height:1.8;white-space:pre-line}b{font-size:18px;display:block;color:#b8e5c9;margin-top:28px}
</style></head><body><canvas id="c"></canvas><header><span id="count"></span><span id="current"></span></header><div id="info"></div><div id="hint"></div><div id="cover"></div><script>
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),T=({ja:{title:'流れを読む渡し舟',intro:'下の舵を、指で左右へ動かす。\n川の流れを読んで金の港へ。\n離しても船は進み続ける。',start:'タップでスタート',retry:'タップで同じ川へ',next:'タップで次の川へ',again:'タップでもう一度',count:'渡れた',current:'流れ',ready:'下の舵に触れて出航',go:'岩を避け、金の港を目指す',hint:'舵は船の向き。川の矢印は流される向き。',win:'港へ着いた！',all:'三つの川を渡った',crash:'岩にぶつかった',bank:'岸に流された',miss:'港から外れた',body:'流れに逆らう角度を、早めに作ろう。',rudder:'舵',tips:['岩の手前から、左右に余白を作ろう。','岸へ寄る前に、中央へ舵を戻そう。','岸の直前より前に、港の幅へ入ろう。'],port:'港',strength:['弱','中','強']},en:{title:'Ferry Against the Flow',intro:'Drag the rudder below to steer.\nRead the current and reach the gold port.\nYour boat keeps moving after release.',start:'Tap to start',retry:'Tap to retry this river',next:'Tap for the next river',again:'Tap to play again',count:'Crossed',current:'Flow',ready:'Touch the rudder below to launch',go:'Avoid rocks and reach the gold port',hint:'Rudder sets heading; river arrows show drift.',win:'Reached the port!',all:'Three rivers crossed',crash:'Struck a rock',bank:'Drifted into the bank',miss:'Missed the port',body:'Set an upstream heading before the current.',rudder:'Rudder',tips:['Make room beside a rock before reaching it.','Turn toward the center before nearing the bank.','Enter the port width before reaching the far bank.'],port:'Port',strength:['gentle','steady','strong']}})[LANG==='ja'?'ja':'en'];
const el=id=>document.getElementById(id),c=el('c'),g=c.getContext('2d'),signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};
for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});
let trail=[],trailAt=0,stage=0,phase='title',guard=0,boat={x:180,y:490},angle=0,pointer=null,prev=0,clock=0,started=0,success=false,ac;
const ports=[{x:100,w:96},{x:260,w:82},{x:110,w:74}],rocks=[[[245,300,28]],[[120,330,26],[260,220,24]],[[170,350,27],[90,235,24]]];
function flow(y){const t=Math.max(0,Math.min(1,(y-145)/345));return stage===0?22+13*Math.sin(t*Math.PI):stage===1?-12+47*Math.sin(t*Math.PI):12+32*Math.sin(t*Math.PI*2)}
function sound(f){try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();const o=ac.createOscillator(),a=ac.createGain();o.frequency.value=f;a.gain.setValueAtTime(.045,ac.currentTime);a.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.2);o.connect(a).connect(ac.destination);o.start();o.stop(ac.currentTime+.2)}catch{}}
function resize(){const d=Math.min(devicePixelRatio||1,2);c.width=Math.max(1,Math.round(innerWidth*d));c.height=Math.max(1,Math.round(innerHeight*d))}
addEventListener('resize',resize);resize();
function cover(title,body,next){el('cover').className='';el('cover').innerHTML='<div><h1>'+title+'</h1><p>'+body+'</p><b>'+next+'</b></div>'}
function start(){trail=[];trailAt=0;boat={x:180,y:490};angle=0;pointer=null;phase='ready';started=performance.now();success=false;el('cover').className='hidden';el('count').textContent=T.count+' '+stage+'/3';el('info').textContent=T.ready;el('hint').textContent=T.hint;signal('start')}
function finish(ok,why){phase='end';success=ok;guard=performance.now()+700;pointer=null;el('count').textContent=T.count+' '+(stage+(ok?1:0))+'/3';cover(ok?(stage===2?T.all:T.win):why,ok?'':T.tips[why===T.crash?0:why===T.bank?1:2],ok?(stage===2?T.again:T.next):T.retry);el('cover').className='result';sound(ok?700:180);signal('end')}
function steer(e){angle=(Math.max(24,Math.min(336,e.clientX/Math.max(1,innerWidth)*360))-180)/156*Math.PI/3}
c.addEventListener('pointerdown',e=>{if((phase!=='ready'&&phase!=='play')||pointer!==null||e.clientY/innerHeight<.8)return;pointer=e.pointerId;steer(e);if(phase==='ready'){phase='play';el('info').textContent=T.go;sound(330)}try{c.setPointerCapture(e.pointerId)}catch{}});
addEventListener('pointermove',e=>{if(e.pointerId===pointer&&phase==='play')steer(e)});for(const t of ['pointerup','pointercancel'])addEventListener(t,e=>{if(e.pointerId===pointer)pointer=null});
el('cover').addEventListener('pointerdown',()=>{if(phase==='title'||phase==='end'&&performance.now()>=guard){if(phase==='end'&&success)stage=(stage+1)%3;sound(300);start()}});
function text(s,x,y,size=14,col='#f9edc7'){g.font='600 '+size+'px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif';g.textAlign='center';g.fillStyle=col;g.fillText(s,x,y)}
function draw(){g.setTransform(c.width/360,0,0,c.height/640,0,0);g.fillStyle='#173e4d';g.fillRect(0,0,360,640);g.fillStyle='#538c91';g.fillRect(18,145,324,355);g.fillStyle='#628b72';g.fillRect(0,96,360,49);g.fillRect(0,500,360,28);g.fillStyle='#9da377';g.fillRect(0,138,360,7);g.fillRect(0,500,360,7);
for(let y=185;y<500;y+=62){const f=flow(y),dx=(clock*.001*Math.abs(f)+y)%70;for(let x=30;x<330;x+=70){let xx=x+dx-35;g.strokeStyle='#b0dbd177';g.lineWidth=2;g.beginPath();g.moveTo(xx-10*Math.sign(f),y);g.lineTo(xx+10*Math.sign(f),y);g.lineTo(xx+5*Math.sign(f),y-4);g.moveTo(xx+10*Math.sign(f),y);g.lineTo(xx+5*Math.sign(f),y+4);g.stroke()}}
const port=ports[stage];g.fillStyle='#ebc96f';g.fillRect(port.x-port.w/2,131,port.w,18);g.fillRect(port.x-port.w/2,119,6,30);g.fillRect(port.x+port.w/2-6,119,6,30);text(T.port,port.x,120,14,'#1b3943');
for(const [x,y,r]of rocks[stage]){g.fillStyle='#326473';g.beginPath();g.ellipse(x+4,y+10,r+9,r*.7,0,0,Math.PI*2);g.fill();if(phase==='play'&&Math.hypot(boat.x-x,boat.y-y)<r+65){g.strokeStyle='#f6c98e';g.lineWidth=2;g.setLineDash([4,4]);g.beginPath();g.ellipse(x,y,r+12,r*.72+15,0,0,Math.PI*2);g.stroke();g.setLineDash([])}g.fillStyle='#9faeaa';g.beginPath();g.ellipse(x,y,r,r*.72,0,0,Math.PI*2);g.fill();g.fillStyle='#c8cec0';g.beginPath();g.ellipse(x-5,y-5,r*.5,r*.3,0,0,Math.PI*2);g.fill()}
g.strokeStyle='#d6f4db99';g.lineWidth=2;g.beginPath();trail.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.stroke();if(phase==='end'){g.strokeStyle=success?'#a7ebc1':'#ff9791';g.lineWidth=3;g.beginPath();g.arc(boat.x,boat.y,22,0,Math.PI*2);g.stroke()}if(phase!=='title'){g.save();g.translate(boat.x,boat.y);g.rotate(angle);g.fillStyle='#14364088';g.beginPath();g.ellipse(5,7,12,18,0,0,Math.PI*2);g.fill();g.fillStyle='#f8efcc';g.beginPath();g.moveTo(0,-18);g.quadraticCurveTo(16,-4,10,15);g.lineTo(-10,15);g.quadraticCurveTo(-16,-4,0,-18);g.fill();g.fillStyle='#b36c49';g.fillRect(-6,-1,12,12);g.restore()}
g.strokeStyle='#99c9bd';g.lineWidth=4;g.beginPath();g.moveTo(28,560);g.lineTo(332,560);g.stroke();text('←',30,592,21);text('↑',180,592,21);text('→',330,592,21);text(T.rudder,180,540,14);g.fillStyle='#f5d27c';g.beginPath();g.arc(180+angle/(Math.PI/3)*156,560,14,0,Math.PI*2);g.fill()}
function tick(t){let dt=Math.max(0,Math.min(.05,(t-prev)/1000));prev=t;clock=t;if(phase==='play'){if(t-trailAt>100){trail.push({...boat});if(trail.length>70)trail.shift();trailAt=t}boat.x+=(74*Math.sin(angle)+flow(boat.y))*dt;boat.y-=74*Math.cos(angle)*dt;if(boat.x<28||boat.x>332)finish(false,T.bank);else if(rocks[stage].some(([x,y,r])=>Math.hypot(boat.x-x,boat.y-y)<r+9))finish(false,T.crash);else if(boat.y<=155)finish(Math.abs(boat.x-ports[stage].x)<=ports[stage].w/2-8,T.miss)}
if(t-started>5500)el('hint').textContent='';el('current').textContent=T.current+' '+(flow(boat.y)>=0?'→':'←')+' '+T.strength[Math.abs(flow(boat.y))<15?0:Math.abs(flow(boat.y))<28?1:2];draw();requestAnimationFrame(tick)}
cover(T.title,T.intro,T.start);requestAnimationFrame(tick);
</script></body></html>
