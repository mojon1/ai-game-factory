// ---------- floor generation ----------

// ---------- intents ----------
function planIntents() {
  const reserved = new Set();
  for (const e of enemies) {
    e.intent = null; if (e.dead) continue;
    const mv = TYPES[e.type].move;
    e.zs.visible = false;
    if (mv === 'none') continue;
    if (mv === 'chase2' && e.cd > 0) { e.zs.visible = true; continue; }
    const can = (c, r) => inB(c, r) && (!grid[key(c, r)] || TYPES[e.type].phase) && !enemyAt(c, r) && !itemAt(c, r) && !(c === stairs.c && r === stairs.r) && !reserved.has(key(c, r)) && !(grid[key(c, r)] && pos.c === c && pos.r === r && false);

      for (const d of 'NSEW') { const nc = e.c + DIRS[d][0], nr = e.r + DIRS[d][1]; if (can(nc, nr) && !grid[key(nc, nr)]) opts.push([nc, nr]); }
      if (opts.length) { const o = opts[ri(0, opts.length - 1)]; e.intent = { c: o[0], r: o[1] }; }
    } else {
      const dx = pos.c - e.c, dz = pos.r - e.r;
      const cand = [];
      const sx = Math.sign(dx), sz = Math.sign(dz);
      if (Math.abs(dx) >= Math.abs(dz)) { if (sx) cand.push([e.c + sx, e.r]); if (sz) cand.push([e.c, e.r + sz]); }
      else { if (sz) cand.push([e.c, e.r + sz]); if (sx) cand.push([e.c + sx, e.r]); }
      for (const [c, r] of cand) {
        if (!can(c, r)) continue;
        if (grid[key(c, r)] && !(TYPES[e.type].phase)) continue;
        e.intent = { c, r }; break;
      }
    }
    if (e.intent) reserved.add(key(e.intent.c, e.intent.r));
  }

}
function drawMarkers() {

  dieRing.visible = state === 'play' && enemies.some((e) => !e.dead && e.intent && e.intent.c === pos.c && e.intent.r === pos.r);
  for (const e of enemies) {
    if (e.dead || !e.intent) continue;
    const d = new THREE.Mesh(dangerGeo, dangerMat); d.rotation.x = -Math.PI / 2; d.position.set(cx(e.intent.c), .02 + (grid[key(e.intent.c, e.intent.r)] ? 1 : 0), cz(e.intent.r)); markerGroup.add(d);
    const a = new THREE.Mesh(arrowGeo, arrowMat); a.rotation.x = -Math.PI / 2;
    const dx = e.intent.c - e.c, dz = e.intent.r - e.r;
    a.rotation.z = Math.atan2(-dx, -dz) ;
    a.position.set((cx(e.c) + cx(e.intent.c)) / 2, .04, (cz(e.r) + cz(e.intent.r)) / 2); markerGroup.add(a);
  }

}
function beats(top, e) { return e.exact ? top === e.n : top >= e.n; }
function updatePreviews() {

    const nc = pos.c + DIRS[d][0], nr = pos.r + DIRS[d][1];
    if (state !== 'play' || !inB(nc, nr) || grid[key(nc, nr)]) { sp.visible = false; nbTiles[d].visible = false; continue; }
    sp.visible = true; nbTiles[d].visible = true;
    const top = rollFaces(faces, d).t;

// ---------- actions ----------
function placeDie() { die.position.set(cx(pos.c), DH, cz(pos.r)); }
async function rollAnim(d, back = false) {
  const [ax, sgn] = AXIS[d];

  const sx = cx(pos.c), sz = cz(pos.r);
  const dx = DIRS[d][0], dz = DIRS[d][1];
  const R = DH * Math.SQRT2;
  const qa = new THREE.Quaternion();
  const maxA = back ? Math.PI / 5 : Math.PI / 2;
  const run = (from, to, dur) => tween(dur, (p) => {
    const e = from + (to - from) * (1 - (1 - p) * (1 - p));
    const th = e * maxA;
    qa.setFromAxisAngle(ax, sgn * th);
    die.quaternion.copy(qa).multiply(q0);
    const h = R * Math.cos(Math.PI / 4 + th);
    const k = (DH - h) / (2 * DH) * (back ? 1 : 1);
    die.position.set(sx + dx * k, R * Math.sin(Math.PI / 4 + th), sz + dz * k);

}

async function killEnemy(e, how) {

}
function startGame() {
  score = 0; hearts = 3; floorN = 1; kills = 0; combo = 0;
  pos = { c: 3, r: ROWS - 1 };
  faces = { t: 1, b: 6, n: 2, s: 5, e: 3, w: 4 };
  die.quaternion.identity(); die.scale.setScalar(1); placeDie();
  state = 'play';
  buildFloor(); hud();
  $ov.className = 'hide';
  showHint(T.hint);
  signal('start');
}
let hintTimer = 0;
function showHint(t) { $hint.textContent = t; $hint.style.opacity = '1'; clearTimeout(hintTimer); hintTimer = setTimeout(hideHint, 6000); }
function hideHint() { $hint.style.opacity = '0'; }
function gameOver() {
  state = 'over'; overAt = performance.now(); sfx.over(); dieRing.visible = false;
  updatePreviews();
  const nb = score > save.best;
  if (nb) save.best = score;
  if (floorN > save.bestFloor) save.bestFloor = floorN;
  doSave();
  signal('end', { score });
  setTimeout(() => {
    $ov.className = '';
    $ov.innerHTML = `<h1 style="font-size:34px">${T.over}</h1><div class="sub">${T.reach(floorN)}</div><div class="big">${score}<span style="font-size:20px"> ${T.pt}</span></div>${nb ? `<div class="nb">${T.nb}</div>` : `<div class="best">${T.best(save.best)}</div>`}<div class="tap">${T.again}</div>`;
  }, 500);
}

// ---------- input ----------
let down = null;
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitP = new THREE.Vector3();
wrap.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (!audioOK) { audioOK = true; try { ZZFX.audioContext && ZZFX.audioContext.resume(); } catch (er) {} }
  else { try { ZZFX.audioContext && ZZFX.audioContext.state !== 'running' && ZZFX.audioContext.resume(); } catch (er) {} }
  if (state === 'title') { startGame(); return; }
  if (state === 'over') { if (performance.now() - overAt > 1200) startGame(); return; }
  down = { x: e.clientX, y: e.clientY, id: e.pointerId, used: false };
}, { passive: false });
wrap.addEventListener('pointermove', (e) => {
  if (!down || down.used || e.pointerId !== down.id) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (Math.hypot(dx, dy) > 26) {
    down.used = true;
    tryMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'E' : 'W') : (dy > 0 ? 'S' : 'N'));
  }
});
const endP = (e) => {
  if (!down || e.pointerId !== down.id) return;
  const d = down; down = null;
  if (d.used) return;
  const dx = e.clientX - d.x, dy = e.clientY - d.y;
  if (Math.hypot(dx, dy) > 26) { tryMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'E' : 'W') : (dy > 0 ? 'S' : 'N')); return; }
  if (e.type === 'pointercancel') return;
  // tap → roll toward tapped tile
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(plane, hitP)) return;
  const ddx = hitP.x - cx(pos.c), ddz = hitP.z - cz(pos.r);
  if (Math.abs(ddx) < .5 && Math.abs(ddz) < .5) return;
  tryMove(Math.abs(ddx) > Math.abs(ddz) ? (ddx > 0 ? 'E' : 'W') : (ddz > 0 ? 'S' : 'N'));
};
wrap.addEventListener('pointerup', endP);
wrap.addEventListener('pointercancel', endP);

// ---------- loop ----------
let last = performance.now(), tAll = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; tAll += dt;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt * 1000; const p = Math.min(1, tw.t / tw.dur); tw.upd(p);
    if (p >= 1) { tweens.splice(i, 1); tw.done(); }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i], u = p.userData; u.life -= dt; u.vy -= 12 * dt;
    p.position.x += u.vx * dt; p.position.z += u.vz * dt; p.position.y = Math.max(.04, p.position.y + u.vy * dt);
    p.rotation.x += dt * 6; p.rotation.y += dt * 5; u.m.opacity = Math.max(0, Math.min(1, u.life * 2));
    if (u.life <= 0) { scene.remove(p); parts.splice(i, 1); }
  }
  if (enemies) for (const e of enemies) {
    if (e.dead) continue; e.ph += dt;
    const b = e.mesh.userData.body;
    if (e.type === 'slime') { b.scale.set(1 + Math.sin(e.ph * 4) * .06, .72 - Math.sin(e.ph * 4) * .05, 1 + Math.sin(e.ph * 4) * .06); }
    else if (e.type === 'bat') { b.position.y = .48 + Math.sin(e.ph * 3) * .05; const w = Math.sin(e.ph * 18) * .6; e.mesh.userData.wings[0].rotation.z = w; e.mesh.userData.wings[1].rotation.z = -w; }
    else if (e.type === 'ghost') { b.position.y = .3 + Math.sin(e.ph * 2) * .07; }
    else if (e.type === 'skull') { b.rotation.y = Math.sin(e.ph * 2) * .15; }
    if (e.zs.visible) { e.zs.position.y = .95 + (e.ph % 1.2) * .25; e.zs.material.opacity = 1 - (e.ph % 1.2) / 1.2; }
    // face the die
    const ang = Math.atan2(die.position.x - e.mesh.position.x, die.position.z - e.mesh.position.z);
    e.mesh.rotation.y += (ang - e.mesh.rotation.y) * Math.min(1, dt * 6);
  }
  for (const d of 'NSEW') { const sp = previews[d]; sp.material.opacity = busy ? 0 : .95; nbTiles[d].material.opacity = busy ? 0 : nbTiles[d].material.opacity || .5; if (sp.visible) sp.position.y = (sp.userData.base || .95) + Math.sin(tAll * 4) * .03; }
  if (items) for (const it of items) if (!it.taken) { if (it.kind !== 'potion') it.mesh.rotation.y += dt * 1.5; if (it.kind === 'potion') it.mesh.position.y = .4 + Math.sin(tAll * 3) * .06; }
  blob.position.x = die.position.x; blob.position.z = die.position.z;
  dieRing.position.x = die.position.x; dieRing.position.z = die.position.z; dieRing.material.opacity = busy ? 0 : .55 + Math.sin(tAll * 8) * .3; dieRing.scale.setScalar(1 + Math.sin(tAll * 8) * .05);
  blob.scale.setScalar(1 - (die.position.y - DH) * .8);
  torch.position.set(die.position.x, 2.1, die.position.z + .2);
  torch.intensity = 24 + Math.sin(tAll * 11) * 1.5 + Math.sin(tAll * 7.3) * 1.5;
  dangerMat.opacity = .3 + Math.sin(tAll * 6) * .12;
  stairLight.intensity = 5 + Math.sin(tAll * 2.5) * 1.5;
  shake *= Math.pow(.004, dt);
  placeCam();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
// initial demo board behind title
pos = { c: 3, r: ROWS - 1 }; faces = { t: 1, b: 6, n: 2, s: 5, e: 3, w: 4 }; floorN = 1; placeDie(); buildFloor();
showTitle();
requestAnimationFrame(frame);
</script>
