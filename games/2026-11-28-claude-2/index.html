  st.playing = true; st.t0 = performance.now(); phase = 'play';
  $('title').classList.add('hide'); $('result').classList.add('hide'); $('hud').classList.remove('hide'); $('inv').classList.remove('hide');
  renderInv(); toast(L.first, 4000);
  signal('start');
}

// ---------- input ----------
const ptr = new Map();
let drag = null;
canvas.addEventListener('pointerdown', (e) => {
  initAudio();
  if (phase === 'title') { if (performance.now() - titleAt > 200) start(); return; }
  if (phase === 'result') { if (performance.now() - resultAt > 700) start(); return; }
  if (panelOpen) return;
  ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
  vyaw = vpitch = 0;
  if (ptr.size === 1) drag = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now(), moved: 0 };
  try { canvas.setPointerCapture(e.pointerId); } catch (er) {}
});
canvas.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  const k = 4.2 / Math.max(320, innerWidth), now = performance.now(), edt = Math.max(8, now - (drag.lt || now - 16)) / 1000; drag.lt = now;
  yaw -= dx * k; pitch = Math.max(.2, Math.min(1.1, pitch + dy * k * .8));
  vyaw = vyaw * .6 + (-dx * k / edt) * .4; vpitch = vpitch * .6 + (dy * k * .8 / edt) * .4;
});
function endPtr(e) {
  ptr.delete(e.pointerId);
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (d.moved < 12 && performance.now() - d.t < 600) { vyaw = vpitch = 0; pick(e.clientX, e.clientY); }
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', (e) => { ptr.delete(e.pointerId); if (drag && drag.id === e.pointerId) drag = null; });
// title overlay taps
for (const id of ['title', 'result']) $(id).addEventListener('pointerdown', (e) => { initAudio(); if (phase === 'title') start(); else if (phase === 'result' && performance.now() - resultAt > 700) start(); });
const rc = new THREE.Raycaster(), v2 = new THREE.Vector2();
function effVisible(o) { while (o) { if (!o.visible) return false; if (o.userData.op != null && o.userData.op < .5) return false; o = o.parent; } return true; }
const GENERIC = new Set(['floor', 'wall', 'rug', 'desk', 'shelf', 'easel', 'chair', 'books']);
const hotV = new THREE.Vector3(), hotB = new THREE.Box3();
function hotspots() {
  const L = [[smallKey3d, 'smallKey', 40], [doorKey3d, 'doorKey', 44], [flapPivot, 'flap', 38], [drawer, 'drawer', 34], [lamp, 'lamp', 36], [boxG, 'box', 34],
    [jars.r.g, 'jar_r', 26], [jars.b.g, 'jar_b', 26], [canvasPivot, 'canvas', 30], [knob, 'door', 30], [cat, 'cat', 26]];
  return L.filter(([o]) => o && effVisible(o));
}
function pick(x, y) {
  if (!st.playing) return;
  v2.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  rc.setFromCamera(v2, camera);
  const hits = rc.intersectObjects(scene.children, true);
  let kind = null;
  for (const h of hits) {
    const o = h.object; if (o.userData.dot) continue; if (!effVisible(o)) continue;
    let t = o; while (t && !t.userData.tap) t = t.parent;
    kind = t ? t.userData.tap : null; break;
  }
  if (!kind || GENERIC.has(kind)) {
    // forgiving taps: snap to a nearby important thing
    let bestD = 1e9, bestK = null;
    for (const [o, k, r] of hotspots()) {
      hotB.setFromObject(o); hotB.getCenter(hotV); hotV.project(camera);
      const sx = (hotV.x + 1) / 2 * innerWidth, sy = (1 - hotV.y) / 2 * innerHeight, d = Math.hypot(sx - x, sy - y);
      if (d < r && d < bestD) { bestD = d; bestK = k; }
    }
    if (bestK) kind = bestK;
  }
  if (kind) onTap(kind);
}

// ---------- loop ----------
function resize() {
  const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
  renderer.setSize(w, h, false); camera.aspect = w / h;
  // keep the room in frame on wider screens with the same vertical fov
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (phase === 'title') { yaw += dt * .12; }
  else if (!drag) { vyaw = Math.max(-4, Math.min(4, vyaw)); vpitch = Math.max(-3, Math.min(3, vpitch)); yaw += vyaw * dt; pitch = Math.max(.2, Math.min(1.1, pitch + vpitch * dt)); vyaw *= Math.pow(.0008, dt); vpitch *= Math.pow(.0008, dt); if (Math.abs(vyaw) < .01) vyaw = 0; if (Math.abs(vpitch) < .01) vpitch = 0; }
  // alignment
  let close = 0;
  if (st && phase === 'play') {
    let dy = ((yaw - MAGIC.yaw) % (Math.PI * 2) + Math.PI * 3) % (Math.PI * 2) - Math.PI, dp = pitch - MAGIC.pitch;
    const ang = Math.hypot(dy, dp * .6);
    if (st.dark) {
      close = Math.max(0, 1 - ang / .3);
      if (!drag && ang < .22) { vyaw *= Math.pow(1e-5, dt); vpitch *= Math.pow(1e-5, dt); }
      if (!drag && ang < .085 && ang > .002) { yaw -= dy * Math.min(1, dt * 6); pitch -= dp * Math.min(1, dt * 6); vyaw *= .5; vpitch *= .5; }
      const al = ang < .02;
      if (al && !st.alignedNow) { st.alignedNow = true; play('align'); st.codeSeen = true; banner(L.aligned, L.alignedSub); }
      if (!al && ang > .05) st.alignedNow = false;
    } else st.alignedNow = false;
    if (st.playing) { st.elapsed = (now - st.t0) / 1000; $('time').textContent = fmt(st.elapsed); tick(now); }
  }
  if (shimmer && actx) { try { const tgt = st && st.dark && phase === 'play' ? .05 * close * close : 0; shimmer.g.gain.setTargetAtTime(tgt, actx.currentTime, .08); shimmer.o1.frequency.setTargetAtTime(520 + close * 260, actx.currentTime, .1); shimmer.o2.frequency.setTargetAtTime(523 + close * 262 + (1 - close) * 6, actx.currentTime, .1); } catch (e) {} }
  // dot look
  const dark = st && st.dark;
  const al = st && st.alignedNow;
  dotMat.opacity = dark ? .95 : .07; decoyMat.opacity = dark ? .8 : .07;
  dotMat.color.set(al ? 0xffe27a : 0x9dffcf);
  placeCamera(camera, yaw, pitch);
  // walls
  const wd = wallDot(yaw);
  for (const k in groups) {
    const g = groups[k], tgt = wd[k] > HIDE_T ? 0 : 1, op0 = g.userData.op;
    g.userData.op += (tgt - op0) * Math.min(1, dt * 9);
    if (Math.abs(g.userData.op - tgt) < .01) g.userData.op = tgt;
    const op = g.userData.op;
    if (op !== op0 || !g.userData.init) {
      g.userData.init = true; g.visible = op > .02;
      for (const m of g.userData.mats) { m.opacity = m.userData.baseOp * op; m.transparent = m.userData.baseT || op < .99; m.depthWrite = op > .6; }
    }
  }
  for (const d of dots) d.visible = !d.userData.grp || groups[d.userData.grp].userData.op > .6;
  // lamp light position
  lamp.getWorldPosition(lampLight.position); lampLight.position.y += .4;
  // flavor anims
  if (spinGlobe > 0) { ball.rotation.y += spinGlobe * dt; spinGlobe *= Math.pow(.3, dt); if (spinGlobe < .05) spinGlobe = 0; }
  if (rustle > 0) { plant.rotation.z = Math.sin(now / 50) * .08 * rustle; rustle = Math.max(0, rustle - dt * 1.5); }
  tailPivot.rotation.y = Math.sin(now / 900) * .2 + (wag > 0 ? Math.sin(now / 80) * .5 * wag : 0); if (wag > 0) wag = Math.max(0, wag - dt);
  cb.scale.y = .7 + Math.sin(now / 1300) * .02;
  if (st && !st.rugFlipped && flapPivot) { flapA = .9 + Math.sin(now / 700) * .12 + Math.sin(now / 260) * .04; flapPivot.quaternion.setFromAxisAngle(flapAxis, flapSign * flapA); }
  stepTweens(dt);
  if (toastT && now > toastT) { $('toast').style.opacity = 0; toastT = 0; }
  renderer.render(scene, camera);
}
st = newState(); resetWorld(); titleAt = performance.now();
requestAnimationFrame(frame);
</script>
