<script>

  },

    paw: 'Cat Paw', roll: 'Roller', ele: 'Elephant', next: 'New Wrap',

    allOwned: 'All owned',

    hintRainbow: 'Clear a whole row for a bonus',

    hintJumbo: 'Jumbo bubbles need 3 touches',
    hintGold: 'Pop the whole golden wrap to finish!',

    newSheet: 'New wrap!',

    newBest: 'New best!',
    again: 'Tap to keep playing',

    min: 'm', sec: 's'
  }
}[LANG === 'ja' ? 'ja' : 'en'];

const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };
for (const t of ['contextmenu', 'selectstart', 'gesturestart']) addEventListener(t, (e) => e.preventDefault(), { passive: false });

const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';
const SHEETS = [
  { cols: 6, rows: 8, val: 1, hp: 1, hue: 200, cost: 0 },
  { cols: 4, rows: 5, val: 5, hp: 1, hue: 190, cost: 60 },
  { cols: 6, rows: 8, val: 2, hp: 1, hue: 265, cost: 250, star: 0.09, hint: 'hintStar' },
  { cols: 6, rows: 8, val: 6, hp: 1, hue: 0, cost: 800, rainbow: true, hint: 'hintRainbow' },
  { cols: 5, rows: 7, val: 30, hp: 2, hue: 28, cost: 2500, hint: 'hintTough' },
  { cols: 6, rows: 8, val: 12, hp: 1, hue: 150, cost: 7000, chain: true, hint: 'hintChain' },
  { cols: 3, rows: 4, val: 300, hp: 3, hue: 330, cost: 18000, hint: 'hintJumbo' },
  { cols: 6, rows: 8, val: 60, hp: 1, hue: 45, cost: 60000, gold: true, hint: 'hintGold' }
];
const HELPERS = {
  paw: { base: 15, mul: 1.5 },
  roll: { base: 100, mul: 1.65 },
  ele: { base: 500, mul: 1.75 }
};

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 360, H = 640, DPR = 1;
const L = { hud: 0, album: { x: 0, y: 0, w: 0, h: 0 }, sheet: { x: 0, y: 0, w: 0, h: 0 }, shop: { x: 0, y: 0, w: 0, h: 0 }, btns: [], slots: [] };

// ---- state ----
const S = {
  money: 0, total: 0, popped: 0,
  lv: { paw: 0, roll: 0, ele: 0 },
  unlocked: 1, cleared: [false, false, false, false, false, false, false, false],
  cur: 0, done: false, playTime: 0, bestTime: 0
};
let mode = 'title';
let sheet = null;
let trans = 0;          // >0 while the cleared sheet slides away
let now = 0;
let modeT = 0;
let shake = 0;
let toast = null;       // {text, t}
let hint = null;        // {text, t}
let stampAnim = null;   // {i, t}
let saveTimer = 0;
let loadedSave = null;
let awayGain = 0;
let strokeSeq = 1;
const pointers = new Map();
const parts = [];
const floats = [];
const paws = [];
let roller = null;
let stomp = null;
const timers = { paw: 0, roll: 0, ele: 0 };
const seenHints = new Set();

function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M';
  return n.toLocaleString('en-US');
}
function cost(k) { const h = HELPERS[k]; return Math.ceil(h.base * Math.pow(h.mul, S.lv[k])); }

// ---- layout ----
function layout() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, window.innerWidth || 360);
  H = Math.max(1, window.innerHeight || 640);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  L.hud = 48;
  const ah = Math.max(54, Math.min(64, H * 0.09));
  L.album = { x: 8, y: L.hud, w: W - 16, h: ah };
  const sh = Math.max(140, Math.min(200, H * 0.26));
  L.shop = { x: 8, y: H - sh - 8, w: W - 16, h: sh };
  L.sheet = { x: 10, y: L.album.y + ah + 8, w: W - 20, h: L.shop.y - (L.album.y + ah + 8) - 10 };
  // shop buttons 2x2
  const g = 8, bw = (L.shop.w - g) / 2, bh = (L.shop.h - g) / 2;
  L.btns = [
    { k: 'paw', x: L.shop.x, y: L.shop.y, w: bw, h: bh },
    { k: 'roll', x: L.shop.x + bw + g, y: L.shop.y, w: bw, h: bh },
    { k: 'ele', x: L.shop.x, y: L.shop.y + bh + g, w: bw, h: bh },
    { k: 'next', x: L.shop.x + bw + g, y: L.shop.y + bh + g, w: bw, h: bh }
  ];
  const sw = L.album.w / 8;
  L.slots = [];
  for (let i = 0; i < 8; i++) L.slots.push({ i, x: L.album.x + i * sw, y: L.album.y, w: sw, h: ah });
  if (sheet) placeSheet(sheet);
}
addEventListener('resize', layout);

// ---- sheet ----
function placeSheet(sh) {
  const d = SHEETS[sh.i];
  const R = L.sheet;
  const cell = Math.max(4, Math.min((R.w - 16) / d.cols, (R.h - 16) / d.rows));
  sh.cell = cell;
  sh.r = cell * 0.43;
  sh.gw = cell * d.cols; sh.gh = cell * d.rows;
  sh.gx = R.x + (R.w - sh.gw) / 2; sh.gy = R.y + (R.h - sh.gh) / 2;
  for (const b of sh.b) { b.x = sh.gx + (b.c + 0.5) * cell; b.y = sh.gy + (b.r + 0.5) * cell; }
}
function makeSheet(i) {
  const d = SHEETS[i];
  const sh = { i, b: [], left: d.cols * d.rows, cell: 0, r: 0, gx: 0, gy: 0, gw: 0, gh: 0, enterT: 0 };
  for (let r = 0; r < d.rows; r++) for (let c = 0; c < d.cols; c++) {
    sh.b.push({ c, r, x: 0, y: 0, hp: d.hp, popT: -1, dentT: -1, star: !!(d.star && Math.random() < d.star), hit: 0, wob: Math.random() * 6.28 });
  }
  placeSheet(sh);
  return sh;
}
function bubbleAt(x, y) {
  if (!sheet) return null;
  const c = Math.floor((x - sheet.gx) / sheet.cell), r = Math.floor((y - sheet.gy) / sheet.cell);
  const d = SHEETS[sheet.i];
  if (c < 0 || r < 0 || c >= d.cols || r >= d.rows) return null;
  const b = sheet.b[r * d.cols + c];
  const dx = x - b.x, dy = y - b.y;
  return dx * dx + dy * dy <= (sheet.r * 1.08) ** 2 ? b : null;
}

// ---- audio ----
let AC = null, noiseBuf = null, master = null;
function initAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.7; master.connect(AC.destination);
      const len = Math.floor(AC.sampleRate * 0.08);
      noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
let popBudget = 0, lastBudgetT = 0;
function sPop(size, vol, gold) {
  if (!AC) return;
  // limit how many pops per moment so swipes stay crisp, not noisy
  if (now - lastBudgetT > 0.06) { popBudget = 0; lastBudgetT = now; }
  if (++popBudget > 4) return;
  try {
    const t = AC.currentTime;
    const src = AC.createBufferSource(); src.buffer = noiseBuf;
    src.playbackRate.value = 0.8 + Math.random() * 0.5;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = (2600 + Math.random() * 1400) / Math.sqrt(size);
    bp.Q.value = 1.2;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5 * vol, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05 + 0.03 * size);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t); src.stop(t + 0.15);
    // little body "tok"
    const o = AC.createOscillator(); o.type = 'sine';
    const f0 = (420 + Math.random() * 120) / Math.sqrt(size);
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.45, t + 0.04);
    const g2 = AC.createGain();
    g2.gain.setValueAtTime(0.25 * vol, t);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    o.connect(g2); g2.connect(master); o.start(t); o.stop(t + 0.08);
    if (gold) tone(1568 + Math.random() * 200, 0.08 * vol, 0.25, 'triangle');
  } catch (e) {}
}
function tone(f, v, dur, type = 'sine', delay = 0) {
  if (!AC) return;
  try {
    const t = AC.currentTime + delay;
    const o = AC.createOscillator(); o.type = type; o.frequency.value = f;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function sCreak() { // a dent on a tough bubble
  if (!AC) return;
  try {
    const t = AC.currentTime;
    const src = AC.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = 0.35;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
    const g = AC.createGain(); g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    src.connect(lp); lp.connect(g); g.connect(master); src.start(t); src.stop(t + 0.2);
  } catch (e) {}
}
function sThump() {
  if (!AC) return;
  try {
    const t = AC.currentTime;
    const o = AC.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.25);
    const g = AC.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.32);
  } catch (e) {}
}
function sBuy() { tone(880, 0.12, 0.12, 'triangle'); tone(1320, 0.1, 0.18, 'triangle', 0.07); }
function sStamp() { tone(784, 0.14, 0.25, 'triangle'); tone(988, 0.12, 0.25, 'triangle', 0.09); tone(1175, 0.12, 0.4, 'triangle', 0.18); }
function sFanfare() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.12, 0.35, 'triangle', i * 0.12)); }

// ---- popping ----
function earn(v, x, y, label) {
  S.money += v; S.total += v;
  if (floats.length < 36) floats.push({ x, y, t: now, text: label || ('+' + fmt(v)), big: !!label });
}
function hitBubble(b, src, stroke) {
  if (!sheet || b.popT >= 0 || trans > 0) return;
  if (stroke) { if (b.hit === stroke.id) return; b.hit = stroke.id; }
  const d = SHEETS[sheet.i];
  const size = d.cols <= 3 ? 3 : d.cols <= 4 ? 1.8 : d.cols <= 5 ? 1.2 : 1;
  b.hp -= (src === 'ele') ? b.hp : 1;
  if (b.hp > 0) {
    b.dentT = now; sCreak();
    for (let k = 0; k < 3; k++) parts.push({ x: b.x, y: b.y, vx: (Math.random() - 0.5) * 80, vy: (Math.random() - 0.5) * 80, t: now, life: 0.25, col: 'rgba(255,255,255,0.9)', s: 2 });
    return;
  }
  b.popT = now;
  sheet.left--;
  S.popped++;
  let v = d.val * (b.star ? 25 : 1);
  let label = null;
  if (d.chain && stroke) {
    stroke.chain++;
    const m = 1 + Math.min(stroke.chain - 1, 30) * 0.15;
    v = v * m;
    if (stroke.chain >= 3) label = '+' + fmt(v) + ' ×' + m.toFixed(1);
  }
  earn(v, b.x, b.y - sheet.r * 0.4, label);
  const helper = src === 'paw' || src === 'roll' || src === 'ele';
  sPop(size, helper ? 0.45 : 1, d.gold || b.star);
  if (!helper && navigator.vibrate) { try { navigator.vibrate(6); } catch (e) {} }
  const n = b.star || d.gold ? 10 : 6;
  for (let k = 0; k < n; k++) {
    const a = Math.random() * 6.28, sp = 60 + Math.random() * 120 * Math.sqrt(size);
    parts.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: now, life: 0.35 + Math.random() * 0.2,
      col: (b.star || d.gold) ? 'rgba(255,214,90,1)' : 'rgba(255,255,255,0.95)', s: 2 + Math.random() * 2 * Math.sqrt(size) });
  }
  if (d.rainbow) {
    const row = sheet.b.filter((o) => o.r === b.r);
    if (row.every((o) => o.popT >= 0)) {
      const bonus = d.val * d.cols;
      earn(bonus, sheet.gx + sheet.gw / 2, b.y - sheet.r, T.rowBonus + ' +' + fmt(bonus));
      tone(1046 + b.r * 60, 0.1, 0.2, 'triangle');
    }
  }
  if (sheet.left <= 0) sheetCleared();
}
function sheetCleared() {
  trans = 0.0001;
  const i = sheet.i;
  if (!S.cleared[i]) {
    S.cleared[i] = true;
    stampAnim = { i, t: now };
    setTimeout(sStamp, 250);
    if (S.cleared.every(Boolean) && !S.done) {
      S.done = true;
      setTimeout(() => finish(), 900);
    }
  }
  doSave();
}
function finish() {
  const prevBest = S.bestTime;
  const tm = S.playTime;
  S.newBest = !prevBest || tm < prevBest;
  if (S.newBest) S.bestTime = tm;
  mode = 'done'; modeT = now;
  sFanfare();
  signal('end', { score: Math.floor(S.total) });
  doSave();
}

// ---- helpers (auto poppers) ----
function intact() { return sheet ? sheet.b.filter((b) => b.popT < 0) : []; }
function updateHelpers(dt) {
  if (!sheet || trans > 0) return;
  timers.paw += dt * S.lv.paw * 0.5;
  while (timers.paw >= 1) {
    timers.paw -= 1;
    const c = intact(); if (!c.length) break;
    const b = c[(Math.random() * c.length) | 0];
    paws.push({ x: b.x, y: b.y, t: now, b, done: false });
  }
  for (const p of paws) if (!p.done && now - p.t > 0.18) { p.done = true; hitBubble(p.b, 'paw'); }
  for (let i = paws.length - 1; i >= 0; i--) if (now - paws[i].t > 0.5) paws.splice(i, 1);

  if (!roller) {
    timers.roll += dt * S.lv.roll / 9;
    if (timers.roll >= 1) {
      timers.roll = 0;
      const d = SHEETS[sheet.i];
      let bestR = -1, bestN = 0;
      for (let r = 0; r < d.rows; r++) { const n = sheet.b.filter((b) => b.r === r && b.popT < 0).length; if (n > bestN) { bestN = n; bestR = r; } }
      if (bestR >= 0) roller = { r: bestR, t: now, dir: Math.random() < 0.5 ? 1 : -1 };
    }
  } else {
    const k = (now - roller.t) / 0.6;
    const x = roller.dir > 0 ? sheet.gx - 20 + k * (sheet.gw + 40) : sheet.gx + sheet.gw + 20 - k * (sheet.gw + 40);
    for (const b of sheet.b) if (b.r === roller.r && b.popT < 0 && b.hit !== -7 && Math.abs(b.x - x) < sheet.r) { b.hit = -7; hitBubble(b, 'roll'); }
    if (k >= 1) { for (const b of sheet.b) if (b.hit === -7) b.hit = 0; roller = null; }
  }
  if (!stomp) {
    timers.ele += dt * S.lv.ele / 20;
    if (timers.ele >= 1) {
      timers.ele = 0;
      const c = intact();
      if (c.length) { const b = c[(Math.random() * c.length) | 0]; stomp = { c: b.c, r: b.r, x: b.x, y: b.y, t: now, hit: false }; }
    }
  } else {
    const k = now - stomp.t;
    if (k > 0.35 && !stomp.hit) {
      stomp.hit = true; shake = 0.25; sThump();
      for (const b of sheet.b) if (Math.abs(b.c - stomp.c) <= 1 && Math.abs(b.r - stomp.r) <= 1) hitBubble(b, 'ele');
    }
    if (k > 0.75) stomp = null;
  }
}
function ratePerSec() {
  const i = sheet ? sheet.i : S.cur, d = SHEETS[i];
  const avg = d.val * (d.star ? 1 + d.star * 24 : 1) / d.hp;
  const pops = S.lv.paw * 0.5 + (S.lv.roll / 9) * d.cols + (S.lv.ele / 20) * 9 * d.hp;
  return pops * avg;
}

// ---- save ----
function doSave() {
  try {
    parent.postMessage({ agf: 'save', data: {
      money: S.money, total: S.total, popped: S.popped, lv: S.lv, unlocked: S.unlocked, cleared: S.cleared,
      cur: S.cur, done: S.done, playTime: S.playTime, bestTime: S.bestTime, at: Date.now()
    } }, '*');
  } catch (e) {}
}
addEventListener('message', (e) => {
  if (!e.data || e.data.agf !== 'loaded' || !e.data.data || mode !== 'title') return;
  loadedSave = e.data.data;
  applySave(loadedSave);
});
function applySave(d) {
  try {
    S.money = +d.money || 0; S.total = +d.total || 0; S.popped = +d.popped || 0;
    S.lv = { paw: +d.lv?.paw || 0, roll: +d.lv?.roll || 0, ele: +d.lv?.ele || 0 };
    S.unlocked = Math.max(1, Math.min(8, +d.unlocked || 1));
    S.cleared = Array.isArray(d.cleared) && d.cleared.length === 8 ? d.cleared.map(Boolean) : S.cleared;
    S.cur = Math.max(0, Math.min(S.unlocked - 1, +d.cur || 0));
    S.done = !!d.done; S.playTime = +d.playTime || 0; S.bestTime = +d.bestTime || 0;
    const away = Math.min(3 * 3600, Math.max(0, (Date.now() - (+d.at || Date.now())) / 1000));
    const d0 = SHEETS[S.cur];
    const avg = d0.val * (d0.star ? 1 + d0.star * 24 : 1) / d0.hp;
    const pops = S.lv.paw * 0.5 + (S.lv.roll / 9) * d0.cols + (S.lv.ele / 20) * 9 * d0.hp;
    awayGain = Math.floor(pops * avg * away * 0.5);
  } catch (e) {}
}
try { parent.postMessage({ agf: 'load' }, '*'); } catch (e) {}

// ---- flow ----
function startGame() {
  initAudio();
  mode = 'play'; modeT = now;
  sheet = makeSheet(S.cur); sheet.enterT = now;

  rr(px, py, pw, ph, 20); ctx.fillStyle = '#fffaf0'; ctx.fill();
  for (let k = 0; k < 8; k++) {
    const fake = { x: px + pw / 2 + (k - 3.5) * Math.min(36, (pw - 30) / 8), y: py + 112, popT: -1, hp: SHEETS[k].hp, dentT: -1, star: !!SHEETS[k].star, wob: k, r: 2, c: 0 };
    drawBubble(k, fake, Math.min(14, (pw - 30) / 18), 0);
  }
  ctx.fillStyle = '#c7471e'; ctx.textBaseline = 'middle';
  fitText(T.doneTitle, W / 2, py + 48, pw - 30, 32, '900');
  ctx.fillStyle = '#5a554c';
  fitText(T.doneSub, W / 2, py + 80, pw - 30, 14, '600');
  const mm = Math.floor(S.playTime / 60), ss = Math.floor(S.playTime % 60);
  ctx.fillStyle = '#3d3a35';
  fitText(T.doneTotal + ': ' + fmt(S.popped), W / 2, py + 154, pw - 30, 18, '800');
  fitText(T.doneTime + ': ' + mm + T.min + ' ' + ss + T.sec, W / 2, py + 184, pw - 30, 18, '800');
  ctx.fillStyle = S.newBest ? '#c7471e' : '#7a756c';
  const bm = Math.floor(S.bestTime / 60), bs = Math.floor(S.bestTime % 60);
  fitText(S.newBest ? T.newBest : T.best + ': ' + bm + T.min + ' ' + bs + T.sec, W / 2, py + 212, pw - 30, 15, '700');
  if (now - modeT > 0.7) { ctx.fillStyle = '#c76b1e'; fitText(T.again, W / 2, py + ph - 36, pw - 30, 18, '800'); }
  ctx.globalAlpha = 1;
}

// ---- loop ----
let last = 0;
function frame(ts) {
  const t = ts / 1000;
  const dt = Math.min(0.05, last ? t - last : 0.016);
  last = t; now += dt;
  if (W < 2 || H < 2 || cv.width < 2) layout();
  drawBG();
  if (mode === 'title') {
    drawTitle();
  } else {
    if (mode === 'play') {
      S.playTime += S.done ? 0 : dt;
      updateHelpers(dt);
      saveTimer += dt; if (saveTimer > 5) { saveTimer = 0; doSave(); }
    }
    let sx = 0;
    if (shake > 0) { shake -= dt; sx = (Math.random() - 0.5) * 6 * shake / 0.25; }
    ctx.save(); ctx.translate(sx, 0);
    if (sheet) {
      let ox = 0;
      const ek = (now - sheet.enterT) / 0.35;
      if (ek < 1 && trans === 0) ox = (1 - ek) * (1 - ek) * W;
      if (trans > 0) {
        trans += dt;
        const k = Math.max(0, (trans - 0.45) / 0.4);
        ox = -k * k * W;
        if (trans > 0.85) { trans = 0; sheet = makeSheet(sheet.i); sheet.enterT = now; roller = null; stomp = null; paws.length = 0; }
      }
      ctx.save(); ctx.beginPath(); ctx.rect(0, L.sheet.y - 6, W, L.sheet.h + 12); ctx.clip();
      drawSheet(sheet, ox);
      if (trans === 0) drawHelpers();
      ctx.restore();
    }
    drawFx(dt);
    ctx.restore();
    drawHUD();
    drawAlbum();
    drawShop();
    if (hint && !drawBanner(hint.text, hint.t, L.shop.y - 28, 4)) hint = null;
    if (toast && !drawBanner(toast.text, toast.t, L.sheet.y + 26, 2.6)) toast = null;
    if (mode === 'done') drawDone();
  }
  requestAnimationFrame(frame);
}
layout();
requestAnimationFrame(frame);
</script>
