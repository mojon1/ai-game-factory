  { time: 110, river: { y: .5, x: .68 }, pen: { x: .27, y: .1, gate: 'right', wa2: 1.85, wl2: 90 }, groups: [[.25, .74, 4], [.72, .86, 4], [.5, .66, 2], [.84, .66, 2, 1]], obs: [{ t: 'rock', x: .86, y: .22, r: 12 }] },
  { time: 130, wolf: 1, pen: { x: .5, y: .1, gate: 'down', w: 146, h: 78 }, groups: [[.16, .3, 3], [.85, .3, 3], [.2, .84, 4], [.8, .8, 4], [.52, .6, 2, 1], [.5, .93, 1, 2]], obs: [{ t: 'pond', x: .3, y: .56, r: 32 }, { t: 'rock', x: .74, y: .5, r: 13 }, { t: 'hay', x: .62, y: .78, r: 14 }] }

// ---------- 画面 ----------

// ---------- 状態 ----------

function layout() {
  const st = STAGES[stageIdx]; walls = []; obs = [];
  const p = st.pen, w = p.w || 124, h = p.h || 58;
  let l, r;
  if (p.gate === 'right') { l = 4; r = 4 + w; } else if (p.gate === 'left') { r = LW - 4; l = r - w; } else { const c = clamp(FX(p.x), 60 + w / 2, LW - 60 - w / 2); l = c - w / 2; r = c + w / 2; }
  pen = { l, t: TOPY + 8, r, b: FT + h, gate: p.gate };
  const g = GATE / 2, cx = (l + r) / 2, cy = pen.b - g - 8, sides = { up: [pen.l, pen.t, pen.r, pen.t], down: [pen.l, pen.b, pen.r, pen.b], left: [pen.l, pen.t, pen.l, pen.b], right: [pen.r, pen.t, pen.r, pen.b] };
  for (const k in sides) {
    if (k === 'up') continue;

      if (y1 === y2) { walls.push({ x1, y1, x2: cx - g, y2, t: 0 }, { x1: cx + g, y1, x2, y2, t: 0 }); pen.g1 = { x: cx - g, y: y1 }; pen.g2 = { x: cx + g, y: y1 }; }

    } else walls.push({ x1, y1, x2, y2, t: 0 });
  }
  pen.nx = p.gate === 'left' ? -1 : p.gate === 'right' ? 1 : 0; pen.ny = p.gate === 'up' ? -1 : p.gate === 'down' ? 1 : 0;

  WA = p.wa || 2.25; WL = p.wl || 42; WA2 = p.wa2 || WA; WL2 = p.wl2 || WL;
  pen.a0 = Math.atan2(pen.g2.y - pen.g1.y, pen.g2.x - pen.g1.x); pen.sg = Math.cos(pen.a0) * pen.ny - Math.sin(pen.a0) * pen.nx > 0 ? 1 : -1;
  const A1 = pen.a0 + pen.sg * WA, A2 = pen.a0 + Math.PI - pen.sg * WA2;
  walls.push({ x1: pen.g1.x, y1: pen.g1.y, x2: pen.g1.x + Math.cos(A1) * WL, y2: pen.g1.y + Math.sin(A1) * WL, t: -3, wing: 1 }, { x1: pen.g2.x, y1: pen.g2.y, x2: pen.g2.x + Math.cos(A2) * WL2, y2: pen.g2.y + Math.sin(A2) * WL2, t: -3, wing: 1 });
  pen.gx = (pen.g1.x + pen.g2.x) / 2; pen.gy = (pen.g1.y + pen.g2.y) / 2;
  for (const o of st.obs) obs.push({ t: o.t, x: FX(o.x), y: FY(o.y), r: o.r });
  river = null;
  if (st.river) {
    const y = FY(st.river.y), bx = FX(st.river.x);
    river = { y, bx };
    walls.push({ x1: -40, y1: y, x2: bx - 31, y2: y, t: 13, river: 1 }, { x1: bx + 31, y1: y, x2: LW + 40, y2: y, t: 13, river: 1 });
  }
  buildBg();
}

function resize() {
  W = innerWidth; H = innerHeight;
  if (W < 2 || H < 2) return;
  DPR = Math.min(devicePixelRatio || 1, 2);
  S = Math.min(W / 360, H / 600); LW = W / S; LH = H / S; FT = TOPY + 30; FB = LH - 66;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  layout();
  for (const s of sheep) { if (s.pen) continue; s.x = clamp(s.x, 26, LW - 26); s.y = clamp(s.y, FT, FB); }
}
addEventListener('resize', resize);

function buildBg() {
  if (W < 2 || H < 2) return;
  bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
  const b = bg.getContext('2d'); b.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);
  seed = 777 + stageIdx * 131;
  const gr = b.createLinearGradient(0, 0, 0, LH); gr.addColorStop(0, '#7fbf4d'); gr.addColorStop(1, '#5fa23c');
  b.fillStyle = gr; b.fillRect(0, 0, LW, LH);

    b.strokeStyle = k < .5 ? 'rgba(40,110,30,.35)' : 'rgba(190,235,120,.4)'; b.lineWidth = 1.2;
    b.beginPath(); b.moveTo(x, y); b.lineTo(x - 2, y - 5); b.moveTo(x, y); b.lineTo(x + 2, y - 4.5); b.stroke();
  }
  for (let i = 0; i < LW * LH / 4200; i++) {
    const x = srnd() * LW, y = TOPY + srnd() * (LH - TOPY - 70), c = srnd();
    b.fillStyle = c < .4 ? '#fff' : c < .7 ? '#ffe36b' : '#f6a6c8';
    for (let j = 0; j < 5; j++) { const a = j * 1.2566; b.beginPath(); b.arc(x + Math.cos(a) * 2, y + Math.sin(a) * 2, 1.4, 0, 7); b.fill(); }
    b.fillStyle = '#f2b92c'; b.beginPath(); b.arc(x, y, 1.2, 0, 7); b.fill();
  }

  b.fillStyle = '#d8bd86'; b.fillRect(0, py, LW, LH - py);
  b.fillStyle = 'rgba(120,90,50,.18)';
  for (let i = 0; i < LW / 3; i++) b.fillRect(srnd() * LW, py + 4 + srnd() * (LH - py - 6), 2 + srnd() * 3, 1.5);
  b.fillStyle = '#4f8f33';
  for (let x = -4; x < LW + 8; x += 9) { b.beginPath(); b.arc(x + srnd() * 4, py + 1, 5 + srnd() * 3, 0, 7); b.fill(); }
  // 上の石垣
  b.fillStyle = 'rgba(0,0,0,.18)'; b.fillRect(0, TOPY + 6, LW, 5);
  for (let x = -6; x < LW + 10;) { const w2 = 12 + srnd() * 10; b.fillStyle = srnd() < .5 ? '#9aa0a6' : '#878d94'; rr(b, x, TOPY - 7, w2 - 1.5, 14, 4); b.fill(); b.fillStyle = 'rgba(255,255,255,.22)'; rr(b, x + 2, TOPY - 5, w2 - 6, 4, 2); b.fill(); x += w2; }

    const y = river.y;
    b.fillStyle = '#3f8f3a'; b.fillRect(0, y - 17, LW, 34);

    b.fillStyle = '#b98850'; b.fillRect(river.bx - 31, y - 20, 62, 40);
    b.strokeStyle = '#8a5f30'; b.lineWidth = 1;
    for (let i = 1; i < 8; i++) { b.beginPath(); b.moveTo(river.bx - 31, y - 20 + i * 5); b.lineTo(river.bx + 31, y - 20 + i * 5); b.stroke(); }
    b.fillStyle = '#7a4f24'; b.fillRect(river.bx - 34, y - 21, 5, 42); b.fillRect(river.bx + 29, y - 21, 5, 42);
  }
  // かこいの地面
  b.fillStyle = 'rgba(0,0,0,.12)'; rr(b, pen.l - 3, pen.t - 1, pen.r - pen.l + 6, pen.b - pen.t + 6, 6); b.fill();
  b.fillStyle = '#e3c27a'; rr(b, pen.l - 2, pen.t - 2, pen.r - pen.l + 4, pen.b - pen.t + 4, 5); b.fill();
  b.strokeStyle = 'rgba(160,120,50,.5)'; b.lineWidth = 1;
  for (let i = 0; i < 70; i++) { const x = pen.l + 4 + srnd() * (pen.r - pen.l - 12), y = pen.t + 4 + srnd() * (pen.b - pen.t - 8), a = srnd() * 3; b.beginPath(); b.moveTo(x, y); b.lineTo(x + Math.cos(a) * 7, y + Math.sin(a) * 3); b.stroke(); }
  // 入口の土
  b.fillStyle = 'rgba(200,170,110,.55)';
  const gx = (pen.g1.x + pen.g2.x) / 2 + pen.nx * 16, gy = (pen.g1.y + pen.g2.y) / 2 + pen.ny * 16;
  b.beginPath(); b.ellipse(gx, gy, pen.nx ? 24 : 44, pen.nx ? 44 : 24, 0, 0, 7); b.fill();

  for (const o of obs) {
    if (o.t === 'pond') {
      b.fillStyle = '#4c8a34'; b.beginPath(); b.ellipse(o.x, o.y, o.r + 5, o.r + 3, 0, 0, 7); b.fill();

      b.fillStyle = pg; b.beginPath(); b.ellipse(o.x, o.y, o.r, o.r - 2, 0, 0, 7); b.fill();
      b.fillStyle = '#4fae4a';
      for (let i = 0; i < 3; i++) { const a = srnd() * 6.3, d = srnd() * o.r * .6; b.beginPath(); b.arc(o.x + Math.cos(a) * d, o.y + Math.sin(a) * d, 5, .4, 6); b.lineTo(o.x + Math.cos(a) * d, o.y + Math.sin(a) * d); b.fill(); }

      b.fillStyle = 'rgba(0,0,0,.2)'; b.beginPath(); b.arc(o.x + 2, o.y + 4, o.r, 0, 7); b.fill();
      b.fillStyle = '#e8c453'; b.beginPath(); b.arc(o.x, o.y, o.r, 0, 7); b.fill();

function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

// ---------- 音 ----------
let AC = null, master = null, bgmT = 0, bgmI = 0;

const MEL = [67, 0, 71, 74, 76, 0, 74, 0, 71, 0, 69, 67, 69, 0, 0, 0, 67, 0, 71, 74, 79, 0, 76, 74, 76, 0, 74, 0, 71, 0, 0, 0,
  76, 0, 79, 76, 74, 0, 71, 0, 69, 0, 71, 74, 71, 0, 69, 0, 67, 0, 69, 71, 74, 0, 69, 0, 67, 0, 0, 0, 0, 0, 0, 0];
const BASS = [43, 40, 48, 50, 48, 43, 50, 43];
function initAudio() {
  try {
    if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .6; master.connect(AC.destination); }

    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);

const sfx = {
  baa(p = 1, vol = .09) {

      tr.gain.value = .6; lg2.gain.value = .4; l.connect(lg2); lg2.connect(tr.gain);
      bp.type = 'bandpass'; bp.frequency.value = 1150; bp.Q.value = 1.4;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .05); g.gain.setValueAtTime(vol, t + .28); g.gain.linearRampToValueAtTime(0, t + .5);
      o.connect(bp); bp.connect(tr); tr.connect(g); g.connect(master); o.start(t); l.start(t); o.stop(t + .55); l.stop(t + .55);
    } catch (e) {}

  ctx.fillRect(4 + lg - 1, -8.2, 2.4, 3); ctx.fillRect(4 - lg - 1, 5.2, 2.4, 3); ctx.fillRect(-5 - lg - 1, -8.2, 2.4, 3); ctx.fillRect(-5 + lg - 1, 5.2, 2.4, 3);
  // 毛

  ctx.beginPath(); for (const p of PUFF) { ctx.moveTo(p[0] + p[2] + 1, p[1]); ctx.arc(p[0], p[1], p[2] + 1, 0, 7); } ctx.fill();
  ctx.fillStyle = s.kind === 2 ? '#eadbb8' : '#fdfaf2';
  ctx.beginPath(); for (const p of PUFF) { ctx.moveTo(p[0] + p[2], p[1]); ctx.arc(p[0], p[1], p[2], 0, 7); } ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(-1.5, -1.5, 3.4, 0, 7); ctx.fill();
  ctx.fillStyle = s.kind === 2 ? '#eadbb8' : '#fdfaf2'; ctx.beginPath(); ctx.arc(-10, 0, 2.3, 0, 7); ctx.fill();
  // 頭
  ctx.fillStyle = '#3a3230';
  ctx.beginPath(); ctx.ellipse(7.2, -4.4, 2.6, 1.5, -.5, 0, 7); ctx.ellipse(7.2, 4.4, 2.6, 1.5, .5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(9.6, 0, 4.8, 3.9, 0, 0, 7); ctx.fill();
  if (s.kind === 2) { ctx.strokeStyle = '#c9a25a'; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(7, -5, 3.2, .3, 4.6); ctx.stroke(); ctx.beginPath(); ctx.arc(7, 5, 3.2, -4.6, -.3); ctx.stroke(); }
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(11, -1.9, s.panic > 0 ? 1.5 : 1, 0, 7); ctx.arc(11, 1.9, s.panic > 0 ? 1.5 : 1, 0, 7); ctx.fill();
  ctx.restore();
  if (s.panic > 0) tx('!', s.x, s.y - 18 * k, 16, '#ffdf3a', 'center', 0, 900, '#7a3a00');
}
function drawDog(d, wolfish) {
  const sc = wolfish ? 1.3 : 1.12, run = d.sp > 20;
  ctx.fillStyle = 'rgba(0,30,0,.24)'; ctx.beginPath(); ctx.ellipse(d.x + 1.5, d.y + 4.5, 12 * sc, 7 * sc, d.h, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(d.x, d.y - (run ? Math.abs(Math.sin(d.ph)) * 1.6 : 0)); ctx.rotate(d.h); ctx.scale(sc, sc);
  const body = wolfish ? '#676c78' : '#23201f', lite = wolfish ? '#9ea3ad' : '#fff';
  // しっぽ
  const wag = Math.sin(d.ph * (wolfish ? .5 : 1.4)) * (d.sit || wolfish ? 4 : 2);
  ctx.strokeStyle = body; ctx.lineWidth = wolfish ? 4.6 : 3.4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(-16, wag); ctx.stroke();
  ctx.strokeStyle = lite; ctx.lineWidth = wolfish ? 3.4 : 2.6; ctx.beginPath(); ctx.moveTo(-14.5, wag * .8); ctx.lineTo(-16.5, wag); ctx.stroke();
  // 足
  ctx.fillStyle = wolfish ? '#565a65' : '#fff';
  const lg = run ? Math.sin(d.ph) * 3.2 : 0;
  ctx.fillRect(5 + lg - 1.2, -7.2, 2.6, 3); ctx.fillRect(5 - lg - 1.2, 4.2, 2.6, 3); ctx.fillRect(-6 - lg - 1.2, -7.2, 2.6, 3); ctx.fillRect(-6 + lg - 1.2, 4.2, 2.6, 3);
  ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, 0, 10.5, 5.8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = lite; ctx.beginPath(); ctx.ellipse(5.2, 0, 3, 5.5, 0, 0, 7); ctx.fill();
  if (!wolfish) { ctx.fillStyle = '#e2483d'; ctx.fillRect(7.2, -4.4, 1.8, 8.8); }
  // 頭
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.moveTo(8, -3); ctx.lineTo(7, -8.2); ctx.lineTo(11.5, -4.4); ctx.fill();
  ctx.beginPath(); ctx.moveTo(8, 3); ctx.lineTo(7, 8.2); ctx.lineTo(11.5, 4.4); ctx.fill();
  ctx.beginPath(); ctx.arc(11.5, 0, 5.3, 0, 7); ctx.fill();
  ctx.fillStyle = lite; ctx.beginPath(); ctx.ellipse(15.3, 0, 3.4, 2.5, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(12, 0, 3.6, 1.2, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(18, 0, 1.3, 0, 7); ctx.fill();
  ctx.fillStyle = wolfish ? '#ff4a3a' : '#fff'; ctx.beginPath(); ctx.arc(12.6, -2.7, 1, 0, 7); ctx.arc(12.6, 2.7, 1, 0, 7); ctx.fill();
  ctx.restore();
}
function drawFence() {
  ctx.lineCap = 'round';
  for (const w of walls) {
    if (w.river || w.wing) continue;
    ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(w.x1 + 1.5, w.y1 + 3.5); ctx.lineTo(w.x2 + 1.5, w.y2 + 3.5); ctx.stroke();
    ctx.strokeStyle = '#a8713a'; ctx.lineWidth = 4.5; ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke();
    ctx.strokeStyle = '#d19a58'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(w.x1, w.y1 - 1); ctx.lineTo(w.x2, w.y2 - 1); ctx.stroke();
    const len = Math.hypot(w.x2 - w.x1, w.y2 - w.y1), n = Math.max(1, Math.round(len / 20));
    ctx.fillStyle = '#74491f';
    for (let i = 0; i <= n; i++) { const x = w.x1 + (w.x2 - w.x1) * i / n, y = w.y1 + (w.y2 - w.y1) * i / n; ctx.beginPath(); ctx.arc(x, y, 3.6, 0, 7); ctx.fill(); }
  }
  // とびら
  const a0 = pen.a0, sg = pen.sg, L = GATE / 2 + (WL - GATE / 2) * gateOpen, L2 = GATE / 2 + (WL2 - GATE / 2) * gateOpen;
  const a1 = a0 + sg * gateOpen * WA, a2 = a0 + Math.PI - sg * gateOpen * WA2;
  ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(pen.g1.x + 1.5, pen.g1.y + 3.5); ctx.lineTo(pen.g1.x + Math.cos(a1) * L + 1.5, pen.g1.y + Math.sin(a1) * L + 3.5);
  ctx.moveTo(pen.g2.x + 1.5, pen.g2.y + 3.5); ctx.lineTo(pen.g2.x + Math.cos(a2) * L2 + 1.5, pen.g2.y + Math.sin(a2) * L2 + 3.5); ctx.stroke();
  ctx.strokeStyle = '#e9c98a'; ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.moveTo(pen.g1.x, pen.g1.y); ctx.lineTo(pen.g1.x + Math.cos(a1) * L, pen.g1.y + Math.sin(a1) * L);
  ctx.moveTo(pen.g2.x, pen.g2.y); ctx.lineTo(pen.g2.x + Math.cos(a2) * L2, pen.g2.y + Math.sin(a2) * L2); ctx.stroke();
  ctx.fillStyle = '#5c3814'; ctx.beginPath(); ctx.arc(pen.g1.x, pen.g1.y, 4.4, 0, 7); ctx.arc(pen.g2.x, pen.g2.y, 4.4, 0, 7); ctx.fill();
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (bg) ctx.drawImage(bg, 0, 0);
  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);
  const t = titleT;
  // 水のきらめき
  if (river) {
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    for (let i = 0; i < LW / 40 + 1; i++) { const x = ((i * 47 + t * 26) % (LW + 40)) - 20, y = river.y - 7 + (i % 3) * 7; if (Math.abs(x - river.bx) < 36) continue; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 10, y); ctx.stroke(); }
  }
  for (const o of obs) if (o.t === 'pond') { ctx.strokeStyle = 'rgba(255,255,255,' + (.25 + .2 * Math.sin(t * 2 + o.x)) + ')'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.ellipse(o.x + 6, o.y + 4, o.r * .45, o.r * .2, 0, .2, 2.4); ctx.stroke(); }
  // 入口の矢印
  if (state === 'play' || state === 'title') {
    const gx = (pen.g1.x + pen.g2.x) / 2, gy = (pen.g1.y + pen.g2.y) / 2, off = 26 + Math.sin(t * 4) * 4;
    ctx.save(); ctx.translate(gx + pen.nx * off, gy + pen.ny * off); ctx.rotate(Math.atan2(-pen.ny, -pen.nx));
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-5, -9); ctx.lineTo(-1, 0); ctx.lineTo(-5, 9); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  drawFence();
  // 犬の気配の輪
  if (state === 'play') {
    const R = dog.sit ? 38 : 96, fast = dog.sp > 155 || ringRed > 0;
    ctx.setLineDash([5, 7]); ctx.lineDashOffset = -t * 14; ctx.lineWidth = fast ? 2.4 : 1.6;
    ctx.strokeStyle = fast ? 'rgba(255,70,50,.75)' : 'rgba(255,255,255,.42)';
    ctx.beginPath(); ctx.arc(dog.x, dog.y, R, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    if (fast) { ctx.fillStyle = 'rgba(255,60,40,.07)'; ctx.beginPath(); ctx.arc(dog.x, dog.y, 60, 0, 7); ctx.fill(); }
  }
  // 生き物（奥から）
  const list = sheep.slice(); list.push(dog);
  const wv = STAGES[stageIdx].wolf && (wolf.st === 'stalk' || wolf.st === 'flee') && state !== 'title';
  if (wv) list.push(wolf);
  list.sort((a, b) => a.y - b.y);
  for (const e of list) { if (e === dog) drawDog(dog, false); else if (e === wolf) drawDog(wolf, true); else drawSheep(e); }
  // 粒
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.t === 'txt') { ctx.globalAlpha = Math.min(1, a * 2); tx(p.s, clamp(p.x, 40, LW - 40), p.y, p.size, p.col, 'center', 0, 900, 'rgba(60,40,10,.8)'); }
    else if (p.t === 'ring') { ctx.globalAlpha = a; ctx.strokeStyle = p.col; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size + (1 - a) * 12, (p.size + (1 - a) * 12) * .6, 0, 0, 7); ctx.stroke(); }
    else { ctx.globalAlpha = a; ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (.5 + a * .5), 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  // オオカミの予告
  if (state === 'play' && wolf.st === 'warn') {
    const x = clamp(wolf.x, 22, LW - 22), y = wolf.y, pu = 1 + Math.sin(t * 16) * .15;
    ctx.fillStyle = 'rgba(220,40,30,.9)'; ctx.beginPath(); ctx.arc(x, y, 15 * pu, 0, 7); ctx.fill();
    tx('!', x, y + 1, 20, '#fff', 'center', 0, 900);
  }
  // 夕ぐれ
  const st = STAGES[stageIdx];
  let f = state === 'title' ? 0 : 1 - timeLeft / st.time;
  if (state === 'result' && !res.clear) f = 1.25;
  const a1 = clamp((f - .45) / .4, 0, 1) * .2, a2 = clamp((f - .8) / .2, 0, 1.6) * .3;

  if (a2 > 0) { ctx.fillStyle = `rgba(30,22,80,${a2})`; ctx.fillRect(0, 0, LW, LH); }
  if (f > .8) { for (let i = 0; i < 8; i++) { const x = (Math.sin(i * 12.9 + t * .3) * .5 + .5) * LW, y = TOPY + (Math.sin(i * 7.7 + t * .23) * .5 + .5) * (LH - TOPY - 20); ctx.fillStyle = `rgba(255,250,150,${(.4 + .4 * Math.sin(t * 3 + i * 2)) * clamp((f - .8) * 5, 0, 1)})`; ctx.beginPath(); ctx.arc(x, y, 2, 0, 7); ctx.fill(); } }

  if (state !== 'title') drawHud(f);
  // ヒント
  if (hint.t > 0 && hint.s && state === 'play') {
    const a = Math.min(clamp(hint.t, 0, 1), clamp((hint.max - hint.t) * 4, 0, 1));
    ctx.globalAlpha = Math.max(0, a); ctx.fillStyle = 'rgba(30,50,20,.78)'; rr(ctx, 14, LH - 50, LW - 28, 34, 17); ctx.fill();
    tx(hint.s, LW / 2, LH - 33, 15, '#fff', 'center', LW - 52, 700); ctx.globalAlpha = 1;
  }
  if (banner > 0 && state === 'play') {
    const a = clamp(banner, 0, 1) * clamp((2.2 - banner) * 5, 0, 1); ctx.globalAlpha = a;
    tx(T.stage + ' ' + (stageIdx + 1), LW / 2, LH * .4 - 22, 18, '#fff', 'center', LW - 40, 800, 'rgba(40,70,20,.85)');
    tx(T.names[stageIdx], LW / 2, LH * .4 + 8, 28, '#fff', 'center', LW - 40, 900, 'rgba(40,70,20,.85)'); ctx.globalAlpha = 1;
  }
  if (state === 'title') drawTitle();
  if (state === 'result') drawResult();
}

function drawHud(f) {
  ctx.fillStyle = 'rgba(38,66,28,.86)'; ctx.fillRect(0, 0, LW, TOPY - 6);
  tx(T.stage + ' ' + (stageIdx + 1), 12, 24, 16, '#fff', 'left', 92, 800);
  // 太陽のバー
  const x0 = 112, x1 = LW - 132, y = 23, ff = clamp(f, 0, 1);
  const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, '#8fd0ff'); g.addColorStop(.55, '#ffd27a'); g.addColorStop(.85, '#ff8a4a'); g.addColorStop(1, '#4a3a8a');
  ctx.fillStyle = 'rgba(0,0,0,.3)'; rr(ctx, x0 - 2, y - 6, x1 - x0 + 4, 12, 6); ctx.fill();
  ctx.fillStyle = g; rr(ctx, x0, y - 4, x1 - x0, 8, 4); ctx.fill();
  const sx = x0 + (x1 - x0) * ff, hot = timeLeft <= 10 && state === 'play', pr = hot ? 9 + Math.sin(titleT * 12) * 2 : 8.5;
  ctx.fillStyle = 'rgba(255,220,100,.35)'; ctx.beginPath(); ctx.arc(sx, y, pr + 4, 0, 7); ctx.fill();
  ctx.fillStyle = ff > .8 ? '#ff7a3a' : '#ffd23a'; ctx.beginPath(); ctx.arc(sx, y, pr, 0, 7); ctx.fill();
  const sec = Math.max(0, Math.ceil(timeLeft));
  tx(Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'), LW - 96, 24, 16, hot ? '#ffb09a' : '#fff', 'center', 0, 800);
  // ひつじの数
  const n = pennedN();
  tx(n + '/' + sheep.length, LW - 12, 24, 17, '#fff', 'right', 0, 800);
  const ix = LW - 12 - ctx.measureText(n + '/' + sheep.length).width - 15;
  ctx.fillStyle = '#fdfaf2'; ctx.beginPath(); ctx.arc(ix - 3, 23, 5, 0, 7); ctx.arc(ix + 3, 23, 5, 0, 7); ctx.arc(ix, 19.5, 5, 0, 7); ctx.arc(ix, 26.5, 5, 0, 7); ctx.fill();
  ctx.fillStyle = '#3a3230'; ctx.beginPath(); ctx.ellipse(ix + 7.5, 23, 3.6, 3, 0, 0, 7); ctx.fill();
}

function drawTitle() {
  ctx.fillStyle = 'rgba(30,60,25,.5)'; ctx.fillRect(0, 0, LW, LH);
  const cx = LW / 2, y0 = LH * .2;
  tx(T.t1, cx, y0, 34, '#ffe36b', 'center', LW - 40, 900, 'rgba(40,60,20,.9)');
  tx(T.t2, cx, y0 + 52, 50, '#fff', 'center', LW - 36, 900, 'rgba(40,60,20,.9)');
  ctx.fillStyle = 'rgba(25,45,20,.8)'; rr(ctx, cx - 164, LH * .44, 328, 112, 14); ctx.fill();
  for (let i = 0; i < 3; i++) tx(T.how[i], cx, LH * .44 + 26 + i * 30, 15.5, i === 2 ? '#ffe36b' : '#fff', 'center', 304, 700);
  const tot = save.stars.reduce((a, b) => a + b, 0);
  if (tot > 0) { star(cx - 44, LH * .44 + 140, 10, '#ffd23a', '#a8760a'); tx(T.total + ' ' + tot + ' / 18', cx - 28, LH * .44 + 141, 15, '#fff', 'left', 200, 800, 'rgba(40,60,20,.9)'); }
  ctx.globalAlpha = .6 + .4 * Math.sin(titleT * 4);
  tx(T.tap, cx, LH * .8, 22, '#fff', 'center', LW - 40, 900, 'rgba(40,60,20,.9)'); ctx.globalAlpha = 1;
  if (tot > 0) tx(T.stage + ' ' + (save.cur + 1) + '  ' + T.names[save.cur], cx, LH * .8 + 32, 14, '#e8ffd0', 'center', LW - 40, 700, 'rgba(40,60,20,.9)');
}

function drawResult() {
  const a = clamp(resT * 3, 0, 1), cx = LW / 2, y = LH * .3;
  ctx.fillStyle = `rgba(20,30,40,${.5 * a})`; ctx.fillRect(0, 0, LW, LH);
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(28,48,30,.92)'; rr(ctx, cx - 160, y - 46, 320, 270, 18); ctx.fill();
  if (res.clear) {
    tx(res.all ? T.all : T.clear, cx, y, 30, '#ffe36b', 'center', 290, 900);
    for (let i = 0; i < 3; i++) { const on = i < res.stars, pt = clamp((resT - .25 - i * .22) * 5, 0, 1), sc = on ? (pt < 1 ? pt * 1.3 : 1) : 1; star(cx + (i - 1) * 62, y + 62 - (i === 1 ? 8 : 0), 25 * (on ? sc : 1), on && pt > 0 ? '#ffd23a' : 'rgba(255,255,255,.14)', on && pt > 0 ? '#a8760a' : ''); }
    tx(T.left.replace('{n}', res.left), cx, y + 118, 22, '#fff', 'center', 290, 800);
    tx(res.nb ? T.newBest : T.best.replace('{n}', save.best[stageIdx]), cx, y + 148, 15, res.nb ? '#ffe36b' : '#cfe8c0', 'center', 290, 700);
  } else {
    tx(T.fail, cx, y, 30, '#b9c8ff', 'center', 290, 900);
    tx(T.penned.replace('{a}', res.n).replace('{b}', sheep.length), cx, y + 70, 34, '#fff', 'center', 290, 900);
    tx(T.stage + ' ' + (stageIdx + 1) + '  ' + T.names[stageIdx], cx, y + 122, 15, '#cfe8c0', 'center', 290, 700);
  }
  if (resT > .7) { ctx.globalAlpha = .6 + .4 * Math.sin(titleT * 4); tx(res.clear ? T.next : T.again, cx, y + 194, 20, '#fff', 'center', 290, 900); }
  ctx.globalAlpha = 1;
}

// ---------- 入力 ----------
const toL = (e) => { finger.x = e.clientX / S; finger.y = e.clientY / S; };
addEventListener('pointerdown', (e) => {
  e.preventDefault(); initAudio();
  if (state === 'title') { if (W > 2) startStage(save.cur); return; }
  if (state === 'result') { if (resT > .7) startStage(res.clear ? (stageIdx + 1) % STAGES.length : stageIdx); return; }
  if (state === 'play') { finger.id = e.pointerId; finger.on = true; toL(e); }
}, { passive: false });
addEventListener('pointermove', (e) => { if (finger.on && e.pointerId === finger.id) toL(e); }, { passive: false });
const up = (e) => { if (e.pointerId === finger.id) { finger.on = false; finger.id = null; } };
addEventListener('pointerup', up); addEventListener('pointercancel', up);

// ---------- ループ ----------
let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (W < 2 || H < 2) { resize(); return; }
  const dt = Math.min(.05, Math.max(0, (ts - last) / 1000)); last = ts;
  // 1フレームを細かく分けて進める（すり抜け防止）
  const n = dt > .02 ? 2 : 1;
  for (let i = 0; i < n; i++) update(dt / n);
  bgm();
  draw();
}
function initTitle() {
  stageIdx = 0; layout();
  sheep = [];
  for (let k = 0; k < 7; k++) sheep.push({ x: FX(.15 + rnd() * .7), y: FY(.78 + rnd() * .2), vx: 0, vy: 0, h: rnd() * 6.283, kind: 0, alert: 0, panic: 0, sc: 0, th: dog, pen: false, wa: rnd() * 6.283, gz: rnd() * 3, ph: rnd() * 6, pop: 0, pitch: 1 });
  dog.x = LW / 2; dog.y = LH - 30;
}
resize();
if (W >= 2 && H >= 2) initTitle();
else { const iv = setInterval(() => { resize(); if (W >= 2 && H >= 2) { clearInterval(iv); initTitle(); } }, 50); }
requestAnimationFrame(frame);
</script>
