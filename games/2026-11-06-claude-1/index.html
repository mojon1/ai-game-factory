<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ひと筆ひつじ囲い</title>
<style>

canvas { display: block; width: 100vw; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
for (const t of ['contextmenu', 'selectstart', 'gesturestart']) addEventListener(t, (e) => e.preventDefault(), { passive: false });
const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const DICT = {
  ja: {
    title: 'ひと筆ひつじ囲い',
    how1: 'ふち（花畑）から指でなぞって柵を引こう。',
    how2: 'ひつじのいない場所が、あなたの花畑になる。',

    stage: 'ステージ',
    hint: 'ふちから指でなぞって、向こうのふちまで糸を引こう',
    needEdge: 'ふち（花畑）からなぞりはじめてね',
    snap: 'ぷつん！',
    pen: 'おやすみ囲い！',
    big: 'ごっそり！',
    clear: 'ステージクリア！',
    next: 'タップで次へ',
    over: 'ひつじの勝ち',
    again: 'タップでもう一度',
    score: '点',
    best: 'ベスト',
    newBest: 'ベスト更新！',
    reached: 'ステージ',
    life: '糸 +1',
    black: '黒ひつじは毛糸玉をこわがらない',
    penHint: 'ひつじを小さく囲うと眠ってくれる（ボーナス）',
  },
  en: {
    title: 'Fence the Flock',
    how1: 'Trace a fence from the edge (the flowers).',
    how2: 'Land with no sheep becomes your flower field.',
    how3: 'Sheep fear the yarn ball but nibble the yarn — it snaps!',
    start: 'Tap to start',
    stage: 'Stage',
    hint: 'Trace from an edge across to another edge',
    needEdge: 'Start tracing from the edge (flowers)',
    snap: 'Snap!',
    pen: 'Sleepy pen!',
    big: 'Huge cut!',
    clear: 'Stage clear!',
    next: 'Tap to continue',
    over: 'The sheep win',
    again: 'Tap to play again',
    score: 'pts',
    best: 'Best',
    newBest: 'New best!',
    reached: 'Stage',
    life: 'Yarn +1',
    black: 'Black sheep do not fear the yarn ball',
    penHint: 'Fence a sheep into a tiny pen and it falls asleep (bonus)',
  },
};
const L = DICT[LANG] || DICT.en;
const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';
const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };

let best = 0;
addEventListener('message', (e) => { if (e.data && e.data.agf === 'loaded' && e.data.data) { best = e.data.data.best || 0; } });
try { parent.postMessage({ agf: 'load' }, '*'); } catch (e) {}
const saveBest = () => { try { parent.postMessage({ agf: 'save', data: { best } }, '*'); } catch (e) {} };

// ---------- audio ----------
let AC = null, master = null;
function initAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.45; master.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(f, d, type = 'sine', v = 0.18, delay = 0, slide = 0) {
  if (!AC) return;
  try {
    const t = AC.currentTime + delay;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
let noiseBuf = null;
function noise(d, v = 0.2, freq = 1200, delay = 0) {
  if (!AC) return;
  try {
    if (!noiseBuf) {
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
      const a = noiseBuf.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1;
    }
    const t = AC.currentTime + delay;
    const s = AC.createBufferSource(); s.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
    const g = AC.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d + 0.02);
  } catch (e) {}
}
let lastBaa = 0;
function baa(pitch = 1, v = 0.12, delay = 0) {
  if (!AC) return;
  const now = performance.now();
  if (delay === 0 && now - lastBaa < 350) return;
  lastBaa = now;
  try {
    const t = AC.currentTime + delay, d = 0.5;
    const o = AC.createOscillator(); o.type = 'sawtooth';
    const base = 300 * pitch;
    o.frequency.setValueAtTime(base * 1.05, t);
    o.frequency.linearRampToValueAtTime(base, t + d);
    const lfo = AC.createOscillator(); lfo.frequency.value = 22;
    const lg = AC.createGain(); lg.gain.value = base * 0.06; lfo.connect(lg); lg.connect(o.frequency);
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1000; f.Q.value = 2.2;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.06);
    g.gain.setValueAtTime(v, t + d * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(f); f.connect(g); g.connect(master);
    o.start(t); lfo.start(t); o.stop(t + d + 0.05); lfo.stop(t + d + 0.05);
  } catch (e) {}
}
const PENTA = [0, 2, 4, 7, 9];
const noteHz = (n) => 392 * Math.pow(2, (PENTA[((n % 5) + 5) % 5] + 12 * Math.floor(n / 5)) / 12);
function pluck(n) { tone(noteHz(n), 0.22, 'triangle', 0.09); tone(noteHz(n) * 2, 0.08, 'sine', 0.03); }
function chime(size) {
  const k = Math.min(7, 2 + Math.floor(size / 250));
  for (let i = 0; i < k; i++) { tone(noteHz(i * 2 + 2), 0.5, 'sine', 0.1, i * 0.07); tone(noteHz(i * 2 + 2) * 2, 0.25, 'triangle', 0.03, i * 0.07); }
}
function snapSound() { noise(0.18, 0.35, 2500); tone(180, 0.25, 'square', 0.06, 0, 0.4); }
function fanfare() { [0, 2, 4, 5, 7].forEach((n, i) => tone(noteHz(n + 5), 0.4, 'triangle', 0.1, i * 0.1)); }

// ---------- canvas & layout ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 360, H = 640, DPR = 1;
const GW = 54;      // grid columns incl. border
let GH = 84;        // grid rows (set per stage)
let cell = 6, fx = 0, fy = 0;
const HUD_H = 62, BOT = 34;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, window.innerWidth || 360); H = Math.max(1, window.innerHeight || 640);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  layout();
}
function fieldArea() { return { w: Math.max(50, W - 16), h: Math.max(80, H - HUD_H - BOT) }; }
function layout() {
  const a = fieldArea();
  cell = Math.max(1, Math.min(a.w / GW, a.h / GH));
  fx = (W - GW * cell) / 2; fy = HUD_H + (a.h - GH * cell) / 2;
}
addEventListener('resize', resize);

// ---------- grid ----------
let g = new Uint8Array(GW * GH);
let interior = 1, claimed = 0;
const K = 8; // offscreen px per cell
const fcv = document.createElement('canvas');
const fctx = fcv.getContext('2d');
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) ^ 0x5bd1e995; h = (h ^ (h >>> 13)) * 1274126177; h ^= h >>> 16; return (h >>> 0) / 4294967296; };
const GRASS = ['#9ccf68', '#a3d46e', '#96c962', '#a8d873'];
const SOIL = ['#f4dc95', '#f0d58a', '#f7e2a2', '#eed184'];
const FLOW = ['#ff8fab', '#ffffff', '#c77dff', '#ff6b6b', '#ffd166', '#f8a5c2'];
let seed = 1;
function paintCell(x, y) {
  const i = y * GW + x, h = hash(x + seed, y), px = x * K, py = y * K;
  if (g[i]) {
    fctx.fillStyle = SOIL[(h * 4) | 0];
    fctx.fillRect(px, py, K, K);
    if (h < 0.26) {
      const c = FLOW[(h * 100 | 0) % FLOW.length];
      const cx = px + K * 0.5, cy = py + K * 0.5, r = K * 0.2;
      fctx.fillStyle = '#6fa84a'; fctx.fillRect(cx - 0.5, cy, 1, K * 0.5);
      fctx.fillStyle = c;
      for (let k = 0; k < 5; k++) { const a = k * 1.2566 + h * 9; fctx.beginPath(); fctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, r * 0.85, 0, 6.283); fctx.fill(); }
      fctx.fillStyle = '#ffd23f'; fctx.beginPath(); fctx.arc(cx, cy, r * 0.6, 0, 6.283); fctx.fill();
    } else if (h < 0.4) {
      fctx.fillStyle = '#e4c374'; fctx.fillRect(px + 2, py + 3, 3, 2);
    }
  } else {
    fctx.fillStyle = GRASS[(h * 4) | 0];
    fctx.fillRect(px, py, K, K);
    if (h > 0.86) {
      fctx.strokeStyle = '#7fb64f'; fctx.lineWidth = 1;
      fctx.beginPath(); fctx.moveTo(px + 2, py + 7); fctx.lineTo(px + 3, py + 3); fctx.moveTo(px + 4, py + 7); fctx.lineTo(px + 6, py + 2); fctx.stroke();
    }
  }
}
function paintAll() {
  fcv.width = GW * K; fcv.height = GH * K;
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) paintCell(x, y);
}
const solidAt = (x, y) => {
  const cx = Math.floor(x), cy = Math.floor(y);
  if (cx < 0 || cy < 0 || cx >= GW || cy >= GH) return true;
  return g[cy * GW + cx] !== 0;
};

// ---------- game state ----------
let state = 'title';
let stage = 1, score = 0, lives = 3, pct = 0;
let TARGET = 70;
let sheep = [];
let fences = [];
let pending = []; // {i, t}
let particles = [], floats = [];
let stateT = 0, now = 0, hintT = 0, msg = null;
let shake = 0, newBestFlag = false;

// rope
let rope = null; // {pts:[], tip:{x,y}, path:[], left:false, up:false, len, tick}
let retracting = null; // {pts, t}
let broken = []; // falling pieces
const ROPE_V = 34; // cells/sec

function spawnSheep(n) {
  sheep = [];
  for (let k = 0; k < n; k++) {
    let x, y, tries = 0;
    do { x = 6 + Math.random() * (GW - 12); y = 8 + Math.random() * (GH - 16); tries++; }
    while (tries < 50 && sheep.some((s) => Math.hypot(s.x - x, s.y - y) < 8));
    const a = Math.random() * 6.283;
    const black = stage >= 3 && k === n - 1;
    sheep.push({ x, y, vx: Math.cos(a), vy: Math.sin(a), r: 1.55, black, sleep: false, ph: Math.random() * 6, turn: Math.random() * 2, scared: 0, face: 1 });
  }
}
function baseSpeed(s) { return (8 + stage * 0.9) * (s.black ? 1.3 : 1); }

function newStage() {
  const a = fieldArea();
  GH = Math.max(60, Math.min(120, Math.round(GW * a.h / a.w)));
  layout();
  g = new Uint8Array(GW * GH);
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) if (x < 2 || y < 2 || x >= GW - 2 || y >= GH - 2) g[y * GW + x] = 1;
  interior = (GW - 4) * (GH - 4);
  TARGET = stage === 1 ? 70 : stage === 2 ? 75 : 80; claimed = 0; pct = 0;
  seed = (Math.random() * 1000) | 0;
  fences = []; pending = []; particles = []; floats = []; broken = [];
  rope = null; retracting = null;
  paintAll();
  spawnSheep(Math.min(7, stage + 1));
  hintT = stage <= 3 ? 6 : 0;
}

// ---------- input ----------
function toGrid(e) {
  return { x: (e.clientX - fx) / cell, y: (e.clientY - fy) / cell };
}
function nearestClaimed(p, rad) {
  let bestD = 1e9, bp = null;
  const r = Math.ceil(rad);
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    const cx = Math.floor(p.x) + dx, cy = Math.floor(p.y) + dy;
    if (cx < 0 || cy < 0 || cx >= GW || cy >= GH) continue;
    if (!g[cy * GW + cx]) continue;
    const qx = Math.max(cx, Math.min(cx + 1, p.x)), qy = Math.max(cy, Math.min(cy + 1, p.y));
    const d = Math.hypot(qx - p.x, qy - p.y);
    if (d < bestD && d <= rad) { bestD = d; bp = { x: Math.min(cx + 0.95, Math.max(cx + 0.05, p.x)), y: Math.min(cy + 0.95, Math.max(cy + 0.05, p.y)) }; }
  }
  return bp;
}
let activePointer = null;
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  if (state === 'title') { startGame(); return; }
  if (state === 'clear') { if (stateT > 0.7) { stage++; newStage(); state = 'play'; stateT = 0; signal('start'); } return; }
  if (state === 'over') { if (stateT > 0.7) startGame(); return; }
  if (state !== 'play') return;
  if (rope) return;
  const p = toGrid(e);
  const inside = p.x >= -6 && p.y >= -6 && p.x <= GW + 6 && p.y <= GH + 6;
  if (!inside) return;
  let start;
  if (!solidAt(p.x, p.y)) start = nearestClaimed(p, 3.2);
  else start = { x: Math.min(GW - 0.05, Math.max(0.05, p.x)), y: Math.min(GH - 0.05, Math.max(0.05, p.y)) };
  if (!start) { msg = { text: L.needEdge, t: 1.6 }; tone(220, 0.12, 'sine', 0.06); return; }
  activePointer = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  rope = { pts: [{ x: start.x, y: start.y }], tip: { x: start.x, y: start.y }, path: [], left: false, up: false, len: 0, tick: 0, n: 0 };
  if (!solidAt(p.x, p.y)) rope.path.push({ x: p.x, y: p.y });
  tone(523, 0.08, 'triangle', 0.06);
});
cv.addEventListener('pointermove', (e) => {
  if (!rope || rope.up || e.pointerId !== activePointer) return;
  const p = toGrid(e);
  p.x = Math.min(GW - 0.05, Math.max(0.05, p.x)); p.y = Math.min(GH - 0.05, Math.max(0.05, p.y));
  const last = rope.path.length ? rope.path[rope.path.length - 1] : rope.tip;
  const d = Math.hypot(p.x - last.x, p.y - last.y);
  if (d > 0.35) {
    // subdivide long jumps
    const n = Math.ceil(d / 0.8);
    for (let k = 1; k <= n; k++) rope.path.push({ x: last.x + (p.x - last.x) * k / n, y: last.y + (p.y - last.y) * k / n });
  }
});
function release(e) {
  if (e.pointerId !== activePointer) return;
  activePointer = null;
  if (rope) rope.up = true;
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);

function startGame() {
  stage = 1; score = 0; lives = 3; newBestFlag = false;
  newStage();
  state = 'play'; stateT = 0;
  signal('start');
}

// ---------- rope logic ----------
function stepTip(dt) {
  let remain = ROPE_V * dt;
  while (rope && remain > 0 && rope.path.length) {
    const t = rope.path[0];
    const dx = t.x - rope.tip.x, dy = t.y - rope.tip.y, d = Math.hypot(dx, dy);
    const step = Math.min(remain, d, 0.4);
    if (d < 1e-6) { rope.path.shift(); continue; }
    rope.tip.x += dx / d * step; rope.tip.y += dy / d * step;
    remain -= step;
    if (step >= d - 1e-6) rope.path.shift();
    processTip(step);
  }
  if (rope && rope.up && rope.path.length === 0) {
    // ran out of path in the open: retract
    retracting = { pts: rope.pts.concat([{ x: rope.tip.x, y: rope.tip.y }]), t: 0 };
    rope = null;
    tone(330, 0.15, 'sine', 0.05, 0, 0.6);
  }
}
function processTip(step) {
  const tp = rope.tip;
  const sol = solidAt(tp.x, tp.y);
  if (!rope.left) {
    if (sol) { rope.pts = [{ x: tp.x, y: tp.y }]; }
    else { rope.left = true; rope.pts.push({ x: tp.x, y: tp.y }); }
    return;
  }
  if (sol) { rope.pts.push({ x: tp.x, y: tp.y }); completeRope(); return; }
  const last = rope.pts[rope.pts.length - 1];
  if (Math.hypot(tp.x - last.x, tp.y - last.y) >= 0.5) rope.pts.push({ x: tp.x, y: tp.y });
  rope.len += step; rope.tick += step;
  if (rope.tick > 2.6) { rope.tick = 0; pluck(rope.n++); }
}
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - ax - dx * t, py - ay - dy * t);
}
function checkSnap() {
  if (!rope || !rope.left) return;
  const pts = rope.pts;
  for (const s of sheep) {
    if (s.sleep) continue;
    const lim = s.r + 0.25;
    let hit = Math.hypot(s.x - rope.tip.x, s.y - rope.tip.y) < lim;
    for (let i = 1; !hit && i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      if (Math.abs(s.x - a.x) > 3 && Math.abs(s.x - b.x) > 3 && Math.sign(s.x - a.x) === Math.sign(s.x - b.x)) continue;
      if (segDist(s.x, s.y, a.x, a.y, b.x, b.y) < lim) hit = true;
    }
    if (!hit && pts.length) { const a = pts[pts.length - 1]; if (segDist(s.x, s.y, a.x, a.y, rope.tip.x, rope.tip.y) < lim) hit = true; }
    if (hit) { snapRope(s); return; }
  }
}
function snapRope(s) {
  const pts = rope.pts.concat([{ x: rope.tip.x, y: rope.tip.y }]);
  for (let i = 1; i < pts.length; i += 2) {
    broken.push({ a: pts[i - 1], b: pts[i], vx: (Math.random() - 0.5) * 3, vy: -2 - Math.random() * 3, t: 0 });
  }
  rope = null; activePointer = null;
  lives--;
  shake = 0.35;
  snapSound(); baa(s.black ? 0.75 : 1.15, 0.14, 0.05);
  const sp = gridToPx(s.x, s.y);
  floats.push({ x: sp.x, y: sp.y - 18, text: L.snap + '  -1', t: 0, c: '#ff4d5a', big: true });
  for (let k = 0; k < 12; k++) particles.push({ x: sp.x, y: sp.y, vx: (Math.random() - 0.5) * 160, vy: (Math.random() - 0.8) * 140, life: 0.7, max: 0.7, c: '#ffffff', r: 3 + Math.random() * 3 });
  s.vx *= -1; s.vy *= -1; s.scared = 1;
  if (lives <= 0) { state = 'dying'; stateT = 0; }
}
const gridToPx = (x, y) => ({ x: fx + x * cell, y: fy + y * cell });

function stamp(x, y) {
  for (const ox of [-0.45, 0.45]) for (const oy of [-0.45, 0.45]) {
    const cx = Math.floor(x + ox), cy = Math.floor(y + oy);
    if (cx < 0 || cy < 0 || cx >= GW || cy >= GH) continue;
    const i = cy * GW + cx;
    if (!g[i]) { g[i] = 1; claimed++; pending.push({ i, t: now }); }
  }
}
function completeRope() {
  const pts = rope.pts;
  rope = null; activePointer = null;
  const before = claimed;
  // rasterize fence
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const d = Math.hypot(b.x - a.x, b.y - a.y), n = Math.max(1, Math.ceil(d / 0.25));
    for (let k = 0; k <= n; k++) stamp(a.x + (b.x - a.x) * k / n, a.y + (b.y - a.y) * k / n);
  }
  fences.push(pts);
  // free sheep stuck in stamped cells
  for (const s of sheep) if (!s.sleep && solidAt(s.x, s.y)) unstick(s);
  // flood fill regions from sheep
  const label = new Int32Array(GW * GH).fill(-1);
  const regions = [];
  const stack = [];
  for (const s of sheep) {
    if (s.sleep) continue;
    const si = Math.floor(s.y) * GW + Math.floor(s.x);
    if (g[si]) continue;
    if (label[si] >= 0) { regions[label[si]].sheep.push(s); continue; }
    const id = regions.length;
    const reg = { cells: [], sheep: [s] };
    regions.push(reg);
    label[si] = id; stack.push(si);
    while (stack.length) {
      const c = stack.pop(); reg.cells.push(c);
      const cx = c % GW;
      const nb = [c - 1, c + 1, c - GW, c + GW];
      for (let k = 0; k < 4; k++) {
        const q = nb[k];
        if ((k === 0 && cx === 0) || (k === 1 && cx === GW - 1)) continue;
        if (q < 0 || q >= GW * GH) continue;
        if (g[q] || label[q] >= 0) continue;
        label[q] = id; stack.push(q);
      }
    }
  }
  // compute centroid of fence for ripple
  const mid = pts[(pts.length / 2) | 0];
  let freeCells = 0;
  for (let i = 0; i < GW * GH; i++) {

  broken = broken.filter((b) => b.t < 0.8);
  for (const p of particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt; }
  particles = particles.filter((p) => p.life > 0);
  for (const f of floats) f.t += dt;
  floats = floats.filter((f) => f.t < 1.8);

  if (state === 'clearing' && stateT > 1.1 && pending.length === 0) {
    const over = Math.max(0, Math.floor(pct) - TARGET);
    const bonus = over * 20 * stage;
    score += bonus;
    clearBonusText = bonus ? `+${bonus}` : '';
    if (lives < 5) { lives++; clearBonusText += (clearBonusText ? '  ' : '') + L.life; }
    state = 'clear'; stateT = 0;
    fanfare();
    signal('end', { score });
  }
  if (state === 'dying' && stateT > 1.0) {
    state = 'over'; stateT = 0;
    if (score > best) { best = score; newBestFlag = true; saveBest(); } else newBestFlag = false;
    signal('end', { score });
    tone(330, 0.4, 'triangle', 0.08); tone(262, 0.6, 'triangle', 0.08, 0.3);
  }
}

let lastT = 0;
function frame(t) {
  const dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000 || 0));
  lastT = t;
  try { update(dt); render(); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
resize();
newStage();
requestAnimationFrame((t) => { lastT = t; frame(t); });
</script>
</body>
