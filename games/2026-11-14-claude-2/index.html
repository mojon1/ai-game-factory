<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>スコーン！だるま落とし</title>
<style>
html, body, canvas, * { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f3e6cf; }
canvas { display: block; width: 100vw; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
for (const t of ['contextmenu', 'selectstart', 'gesturestart']) addEventListener(t, (e) => e.preventDefault(), { passive: false });

const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const T = {
  ja: {
    title: 'スコーン！だるま落とし',
    how1: '段を横にすばやくスワイプして打ち抜く',
    how2: 'ゆっくり押すと、ずれた段を戻せる',
    how3: 'だるまを落とさず、最後の1段まで',
    start: 'タップでスタート',
    hint: '段を横にシュッとはらう。ゆっくり押せば位置を直せる',
    score: 'スコア', best: 'ベスト', stage: 'ステージ',
    sweet: 'スコーン！', ok: 'コン', weak: 'ずずっ…', over: '強すぎ！', push: 'そーっと',
    perfect: '全部スコーン！',
    clear: 'ステージクリア！', straight: 'まっすぐボーナス', next: 'タップで次へ',
    over_t: 'だるまが落ちた…', headhit: 'だるまを叩いた！', again: 'タップでもう一度', newbest: 'ベスト更新！',
    reached: 'ステージ', light: '軽い', heavy: '重い',
    combo: 'れんぞく',
  },
  en: {
    title: 'Daruma Knock!',
    how1: 'Swipe fast across a block to knock it out',
    how2: 'Push slowly to slide a shifted block back',
    how3: 'Keep the daruma up to the last block',
    start: 'Tap to start',
    hint: 'Flick across a block. Push slowly to re-align',
    score: 'SCORE', best: 'BEST', stage: 'STAGE',
    sweet: 'THWACK!', ok: 'Tok', weak: 'Scrape…', over: 'Too hard!', push: 'easy…',
    perfect: 'All THWACKs!',
    clear: 'Stage clear!', straight: 'Straight bonus', next: 'Tap to continue',
    over_t: 'The daruma fell…', headhit: 'You hit the daruma!', again: 'Tap to play again', newbest: 'New best!',
    reached: 'Stage', light: 'light', heavy: 'heavy',
    combo: 'combo',
  },
}[LANG === 'ja' ? 'ja' : 'en'];
const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';

const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };

// ---------- save ----------
let best = 0, bestStage = 0;
addEventListener('message', (e) => {
  if (e.data && e.data.agf === 'loaded' && e.data.data) {
    best = Math.max(best, e.data.data.best || 0);
    bestStage = Math.max(bestStage, e.data.data.bestStage || 0);
  }
});
try { parent.postMessage({ agf: 'load' }, '*'); } catch (e) {}
const persist = () => { try { parent.postMessage({ agf: 'save', data: { best, bestStage } }, '*'); } catch (e) {} };

// ---------- canvas ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 360, H = 640, DPR = 1;
let floorY = 520, BW = 150, BH = 46, CX = 180;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, window.innerWidth || 360);
  H = Math.max(1, window.innerHeight || 640);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  layout();
}
function layout() {
  CX = W / 2;
  floorY = H * 0.80;
  BW = Math.min(W * 0.44, 190, H * 0.3);
  let total = 0;
  for (const L of levels) total += L.h;
  if (!levels.length) total = 6;
  BH = Math.max(18, Math.min(54, (floorY - 120) / Math.max(1, total)));
}
addEventListener('resize', resize);

// ---------- block types ----------
// thresholds are in "normalized px/ms" (screen width 360)
const TYPES = {
  normal: { push: 0.4, weak: 0.9, ok: 1.3, over: 3.0, h: 1.0 },
  heavy:  { push: 0.6, weak: 1.5, ok: 2.0, over: 4.4, h: 1.12 },
  light:  { push: 0.25, weak: 0.6, ok: 0.85, over: 1.8, h: 0.78 },
};
// later stages narrow the sweet window a little
function tyOf(L) {
  const b = L.kind === 'head' ? TYPES.normal : TYPES[L.type];
  const f = Math.min(0.5, (stage - 1) * 0.07);
  return { push: b.push, weak: b.weak, ok: b.ok * (1 + f * 0.25), over: b.over * (1 - f * 0.3), h: b.h };
}
const COLORS = ['#d8443a', '#e9a92c', '#3f9a5a', '#2f6fb4', '#8a4fa6', '#e0703a'];

// ---------- state ----------
let levels = [];   // bottom -> top, last is head. x in BW units
let pieces = [];   // flying parts
let parts = [];    // particles
let pops = [];     // text pops
let gauge = null;
let state = 'title';
let stage = 1, score = 0, combo = 0, stageScore = 0, stagePerfect = true;
let stateT = 0, hintT = 0, shake = 0;
let wobAmp = 0, wobPhase = 0;
let resultInfo = null;
let failReason = '';
let rngSeed = 1;

function mkBlock(type, ci) {
  return { kind: 'block', type, color: COLORS[ci % COLORS.length], x: 0, vx: 0, h: TYPES[type].h, drop: 0, dropV: 0 };
}
function buildStage(s) {
  const n = Math.min(9, s === 1 ? 3 : 3 + s);
  const types = [];
  for (let i = 0; i < n; i++) types.push('normal');
  let heavy = s >= 3 ? Math.min(3, Math.floor((s - 1) / 2)) : 0;
  let light = s >= 2 ? Math.min(3, Math.floor(s / 2)) : 0;
  if (s === 2) { light = 1; }
  const idx = [...Array(n).keys()];
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  let p = 0;
  while (heavy-- > 0 && p < n) types[idx[p++]] = 'heavy';
  while (light-- > 0 && p < n) types[idx[p++]] = 'light';
  levels = [{ kind: 'base', x: 0, vx: 0, h: 0.6, drop: 0, dropV: 0 }].concat(types.map((t, i) => mkBlock(t, i + s)));
  levels.push({ kind: 'head', x: 0, vx: 0, h: 1.5, drop: 0, dropV: 0 });
  // slight natural misalignment from later stages
  if (s >= 4) for (const L of levels) if (L.kind !== 'base') L.x = (Math.random() - 0.5) * 0.04 * Math.min(3, s - 3);
  pieces = []; gauge = null; wobAmp = 0; combo = 0; stageScore = 0; stagePerfect = true;
  layout();
}

// ---------- audio ----------
let AC = null, master = null;
function initAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function knock(freq, vol = 0.5, dec = 0.18, bright = 1) {
  if (!AC) return;
  try {
    const t = AC.currentTime;
    for (const [m, a] of [[1, 1], [2.76, 0.35 * bright], [5.4, 0.12 * bright]]) {
      const o = AC.createOscillator(); const g = AC.createGain();
      o.type = 'sine'; o.frequency.value = freq * m;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol * a, t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dec / m * 1.4);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dec * 1.5 + 0.05);
    }
    noiseBurst(0.035, freq * 3, vol * 0.5);
  } catch (e) {}
}
let noiseBuf = null;
function getNoise() {
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}
function noiseBurst(dur, f, vol) {
  if (!AC) return;
  try {
    const t = AC.currentTime;
    const s = AC.createBufferSource(); s.buffer = getNoise();
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 1.2;
    const g = AC.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
  } catch (e) {}
}
let scrape = null;
function scrapeOn(level) {
  if (!AC) return;
  try {
    if (!scrape) {
      const s = AC.createBufferSource(); s.buffer = getNoise(); s.loop = true;
      const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = 2.5;
      const g = AC.createGain(); g.gain.value = 0;
      s.connect(bp); bp.connect(g); g.connect(master); s.start();
      scrape = { s, g, bp };
    }
    scrape.g.gain.setTargetAtTime(Math.min(0.22, level), AC.currentTime, 0.03);
  } catch (e) {}
}
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
function sweetSound(c) {
  const st = PENTA[Math.min(PENTA.length - 1, c)];
  knock(660 * Math.pow(2, st / 12), 0.5, 0.42, 1.3);
}

// ---------- geometry ----------
function levelBaseY(k) { // bottom y of level k (without drop)
  let y = floorY;
  for (let j = 0; j < k; j++) y -= levels[j].h * BH;
  return y;
}
function levelWidth(L) { return L.kind === 'head' ? BW * 0.82 : L.kind === 'base' ? BW * 1.04 : (L.type === 'light' ? BW * 0.96 : BW); }
function wobOff(k) { return Math.sin(wobPhase) * wobAmp * (k + 1) * 0.01 * BW; }
function levelRect(k) {
  const L = levels[k];
  const w = levelWidth(L);
  const yb = levelBaseY(k) - L.drop * BH;
  const cx = CX + L.vx * BW + wobOff(k);
  return { x0: cx - w / 2, x1: cx + w / 2, y0: yb - L.h * BH, y1: yb, cx, w };
}

function jointMargin(k) {
  let m = 0, sx = 0;
  for (let j = k; j < levels.length; j++) {
    const mass = levels[j].kind === 'head' ? 1.6 : (levels[j].type === 'heavy' ? 1.6 : levels[j].type === 'light' ? 0.6 : 1);
    m += mass; sx += mass * levels[j].x;
  }
  const below = levels[k - 1];
  const half = levelWidth(below) / BW / 2 * 0.8; // rounded edges: support ends a bit inside
  const off = sx / m - below.x;
  return { mm: (half - Math.abs(off)) / half, side: Math.sign(off) || 1 };
}
// support check: returns index of first level that loses support, or -1
function margins() {
  let minM = 1, failAt = -1;
  for (let k = 1; k < levels.length; k++) {
    const m = jointMargin(k);
    if (m.mm < minM) minM = m.mm;
    if (m.mm < 0 && failAt < 0) failAt = k;
  }
  return { minM, failAt };
}

// ---------- input ----------
const ptr = { down: false, id: -1, x: 0, y: 0, samples: [], used: false, contact: null };
function velAt(now) {
  const s = ptr.samples;
  if (s.length < 2) return 0;
  const last = s[s.length - 1];
  let ref = s[0];
  for (let i = s.length - 1; i >= 0; i--) { if (last.t - s[i].t >= 45) { ref = s[i]; break; } }
  const dt = Math.max(8, last.t - ref.t);
  return (last.x - ref.x) / dt * (360 / W);
}

cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  if (state === 'title') { startRun(); return; }
  if ((state === 'over' || state === 'clear') && stateT > 0.7) {
    if (state === 'over') startRun(); else nextStage();
    return;
  }
  if (ptr.down && e.pointerId !== ptr.id) return;
  ptr.down = true; ptr.id = e.pointerId; ptr.x = e.clientX; ptr.y = e.clientY;
  ptr.samples = [{ x: e.clientX, y: e.clientY, t: e.timeStamp }];
  ptr.used = false; ptr.contact = null;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
}, { passive: false });

cv.addEventListener('pointermove', (e) => {
  if (!ptr.down || e.pointerId !== ptr.id) return;
  const evs = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
  for (const ev of evs) moveTo(ev.clientX, ev.clientY, ev.timeStamp || e.timeStamp);
}, { passive: false });

function endPtr(e) {
  if (e.pointerId !== ptr.id) return;
  ptr.down = false; ptr.contact = null; ptr.id = -1;
  scrapeOn(0);
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);

function moveTo(x, y, t) {
  const px = ptr.x, py = ptr.y;
  ptr.x = x; ptr.y = y;
  ptr.samples.push({ x, y, t });
  while (ptr.samples.length > 2 && t - ptr.samples[0].t > 120) ptr.samples.shift();
  if (state !== 'play') return;
  if (ptr.contact) { pushMove(px, x, y); return; }
  if (ptr.used) return;
  if (busy()) return;
  // detect crossing an edge
  for (let k = levels.length - 1; k >= 1; k--) {
    const r = levelRect(k);
    let dir = 0, tt = 0;
    if (px < r.x0 && x >= r.x0) { dir = 1; tt = (r.x0 - px) / Math.max(1e-6, x - px); }
    else if (px > r.x1 && x <= r.x1) { dir = -1; tt = (px - r.x1) / Math.max(1e-6, px - x); }
    if (!dir) continue;
    const yy = py + (y - py) * tt;
    if (yy < r.y0 || yy > r.y1) continue;
    const v = Math.abs(velAt(t));
    hit(k, dir, v, yy);
    return;
  }
}

function busy() {
  for (const L of levels) if (L.drop > 0.001) return true;
  return false;
}

function hit(k, dir, v, yy) {
  const L = levels[k];
  const ty = tyOf(L);
  if (v < ty.push) {
    // gentle contact -> push mode
    ptr.contact = { k, dir, moved: 0 };
    ptr.used = true;
    knock(L.kind === 'head' ? 300 : 360, 0.12, 0.08, 0.5);
    addPop(T.push, dir > 0 ? levelRect(k).x0 - 30 : levelRect(k).x1 + 30, levelRect(k).y1 - 4, '#7a5b3a', 15);
    return;
  }
  ptr.used = true;
  if (L.kind === 'head') { headHit(dir, v); return; }
  strike(k, dir, v);
}

function pushMove(px, x, y) {
  const c = ptr.contact;
  if (!c || c.k >= levels.length) { ptr.contact = null; return; }
  const r = levelRect(c.k);
  if (y < r.y0 - BH * 0.8 || y > r.y1 + BH * 0.8) { ptr.contact = null; scrapeOn(0); return; }
  const tcx = CX + levels[c.k].x * BW;
  const edge = c.dir > 0 ? tcx - r.w / 2 : tcx + r.w / 2;
  const over = (x - edge) * c.dir; // how far finger is inside
  if (over <= 0) { scrapeOn(0); return; }
  const v = Math.abs(velAt(performance.now()));
  // if user speeds up into a strike while touching: treat as hit
  const L = levels[c.k];
  const ty = tyOf(L);
  // finger moving fast slips off; each push moves at most a little
  if (v > ty.push * 2.4 || c.moved >= PUSH_MAX) { ptr.contact = null; scrapeOn(0); return; }
  const d = Math.min(over / BW, PUSH_MAX - c.moved) * c.dir;
  c.moved += Math.abs(d);
  L.x += d;
  for (let j = c.k + 1; j < levels.length; j++) levels[j].x += d * 0.82;
  scrapeOn(Math.min(0.2, Math.abs(over) * 0.02 + 0.03));
  const mg = margins();
  if (mg.failAt >= 0) { topple(mg.failAt, T.over_t); }
}

const PUSH_MAX = 0.3;
function strike(k, dir, v) {
  const L = levels[k];
  const ty = tyOf(L);
  let grade, drag, jitter = 0;
  if (v < ty.weak) { grade = 'weak'; drag = 0.2 + (ty.weak - v) / (ty.weak - ty.push) * 0.06; }
  else if (v < ty.ok) { grade = 'ok'; drag = 0.09 - (v - ty.weak) / (ty.ok - ty.weak) * 0.04; }
  else if (v <= ty.over) { grade = 'sweet'; drag = 0.012; }
  else { grade = 'over'; drag = 0.05; jitter = Math.min(0.14, 0.07 + (v - ty.over) * 0.03); }
  // wobble makes things worse
  const wobPenalty = wobAmp * 0.08;
  const r = levelRect(k);
  // fly out
  pieces.push({ kind: 'block', type: L.type, color: L.color, x: r.cx, y: (r.y0 + r.y1) / 2, w: r.w, h: L.h * BH,
    vx: dir * (500 + v * 380) * (W / 360), vy: -60 - v * 40, rot: 0, vr: dir * (2 + v * 1.5), life: 2, fly: true });
  levels.splice(k, 1);
  for (let j = k; j < levels.length; j++) {
    const U = levels[j];
    U.x += dir * drag * (j === k ? 1 : 0.92) + (Math.random() - 0.5) * jitter * 2 + (Math.random() - 0.5) * wobPenalty;
    U.drop += L.h; U.dropV = 0;
  }
  // feedback
  const yMid = (r.y0 + r.y1) / 2;
  showGauge(ty, v, r.cx, r.y0, dir);
  let pts = 0;
  if (grade === 'sweet') {
    combo++;
    pts = 100 * (1 + Math.min(combo - 1, 8) * 0.5);
    sweetSound(combo - 1);
    addPop(T.sweet + (combo > 1 ? ` ×${combo}` : ''), r.cx, r.y0 - 4, '#d13b2b', 28);
    burst(r.cx - dir * r.w * 0.5, yMid, 16, '#fff3c4', dir);
    shake = Math.max(shake, 5);
  } else {
    combo = 0;
    if (grade === 'ok') { pts = 40; stagePerfect = false; knock(420, 0.45, 0.2); addPop(T.ok, r.cx, r.y0 - 4, '#6b4a2a', 22); burst(r.cx - dir * r.w * 0.5, yMid, 8, '#f3dcb0', dir); shake = Math.max(shake, 3); }
    else if (grade === 'weak') { pts = 10; stagePerfect = false; knock(240, 0.35, 0.14, 0.4); noiseBurst(0.25, 500, 0.25); addPop(T.weak, r.cx, r.y0 - 4, '#6b4a2a', 20); shake = Math.max(shake, 2); }
    else { pts = 20; stagePerfect = false; knock(300, 0.6, 0.25, 1.4); noiseBurst(0.12, 2000, 0.4); addPop(T.over, r.cx, r.y0 - 4, '#b03030', 24); burst(r.cx - dir * r.w * 0.5, yMid, 20, '#ffd2a0', dir); shake = Math.max(shake, 10); wobAmp = Math.max(wobAmp, 1.2); }
  }
  pts = Math.round(pts);
  score += pts; stageScore += pts;
  const mg = margins();
  if (mg.failAt >= 0) {
    // let them fall a moment, then topple
    pendingTopple = { at: mg.failAt, t: 0.12 };
  }
}
let pendingTopple = null;

function headHit(dir, v) {
  const k = levels.length - 1;
  knock(200, 0.6, 0.3, 0.6);
  shake = 10;
  failReason = T.headhit;
  topple(k, T.headhit, dir * (2 + v));
}

function topple(fromK, reason, push = 0) {
  if (state !== 'play') return;
  failReason = reason;
  // determine direction: COM offset
  let m = 0, sx = 0;
  for (let j = fromK; j < levels.length; j++) { m++; sx += levels[j].x; }
  const below = fromK > 0 ? levels[fromK - 1].x : 0;
  const dir = push ? Math.sign(push) : (Math.sign(sx / m - below) || 1);
  for (let j = fromK; j < levels.length; j++) {
    const L = levels[j]; const r = levelRect(j);
    pieces.push({ kind: L.kind, type: L.type, color: L.color, x: r.cx, y: (r.y0 + r.y1) / 2, w: r.w, h: L.h * BH,
      vx: dir * (60 + (j - fromK) * 45 + Math.abs(push) * 120) * (W / 360), vy: -40 - Math.abs(push) * 80, rot: 0,
      vr: dir * (1.2 + (j - fromK) * 0.5 + Math.abs(push)), life: 3, fly: false });
  }
  levels.splice(fromK);
  state = 'falling'; stateT = 0;
  ptr.contact = null; scrapeOn(0);
  setTimeout(() => { knock(180, 0.4, 0.2, 0.5); }, 260);
  setTimeout(() => { knock(150, 0.35, 0.2, 0.5); }, 420);
}

function finishRun() {
  state = 'over'; stateT = 0;
  const isBest = score > best;
  if (isBest) best = score;
  bestStage = Math.max(bestStage, stage);
  resultInfo = { score, isBest, stage };
  persist();
  signal('end', { score });
}

function stageClear() {
  state = 'clear'; stateT = 0;
  const head = levels[levels.length - 1];
  const straight = Math.max(0, 1 - Math.abs(head.x - levels[0].x) / 0.4);
  const bonus = Math.round((150 + stage * 50) * straight / 10) * 10;
  const perfect = stagePerfect ? 300 + stage * 100 : 0;
  score += bonus + perfect;
  resultInfo = { bonus, perfect, stageScore: stageScore + bonus + perfect };
  if (score > best) { best = score; }
  bestStage = Math.max(bestStage, stage + 1);
  persist();
  // little jingle
  [0, 4, 7, 12].forEach((s, i) => setTimeout(() => knock(520 * Math.pow(2, s / 12), 0.35, 0.35, 1.2), i * 110));
  burst(CX, levelRect(0).y0, 30, '#ffe08a', 0);
}

function startRun() {
  stage = 1; score = 0; combo = 0;
  buildStage(stage);
  state = 'play'; stateT = 0; hintT = 0;
  signal('start');
}
function nextStage() {
  stage++;
  buildStage(stage);
  state = 'play'; stateT = 0;
}

// ---------- fx ----------
function addPop(text, x, y, color, size) { pops.push({ text, x, y, color, size, t: 0 }); }
function burst(x, y, n, color, dir) {
  for (let i = 0; i < n; i++) {
    const a = dir ? (Math.random() - 0.5) * 1.6 + (dir > 0 ? Math.PI : 0) : Math.random() * Math.PI * 2;
    const sp = 80 + Math.random() * 260;

  ctx.globalAlpha = a;
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const s = fitText(T.start, W - 40, 22, '900');
  ctx.font = `900 ${s}px ${FONT}`;
  ctx.fillText(T.start, W / 2, floorY + (H - floorY) * 0.5);
  ctx.globalAlpha = 1;
}
function drawResult() {
  if (state === 'clear') {
    const lines = [
      { text: T.clear, size: 30, weight: '900', color: '#2f8a45' },
      { text: `${T.straight} +${resultInfo.bonus}`, size: 16 },
      ...(resultInfo.perfect ? [{ text: `${T.perfect} +${resultInfo.perfect}`, size: 18, weight: '900', color: '#d13b2b' }] : []),
      { text: `${T.score} ${score}`, size: 22, weight: '900' },
    ];
    if (stateT > 0.7) lines.push({ text: T.next, size: 16, color: '#8a5a2a' });
    panel(lines, H * 0.12);
  } else if (state === 'over') {
    const lines = [
      { text: failReason || T.over_t, size: 24, weight: '900', color: '#b03030' },
      { text: `${T.score}`, size: 14 },
      { text: String(resultInfo.score), size: 40, weight: '900' },
      { text: resultInfo.isBest ? T.newbest : `${T.best} ${best}`, size: 16, color: resultInfo.isBest ? '#d13b2b' : '#4a2e16' },
      { text: `${T.reached} ${resultInfo.stage}`, size: 15 },
    ];
    if (stateT > 0.7) lines.push({ text: T.again, size: 16, color: '#8a5a2a' });
    panel(lines, H * 0.12);
  }
}

let demoBuilt = false;
function frame(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - (lastT || ts)) / 1000));
  lastT = ts;
  if (state === 'title' && !demoBuilt) { buildStage(1); demoBuilt = true; }
  update(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sx = shake ? (Math.random() - 0.5) * shake : 0, sy = shake ? (Math.random() - 0.5) * shake : 0;
  ctx.save();
  ctx.translate(sx, sy);
  drawBG();
  drawStack();
  drawPieces();
  drawFX();
  ctx.restore();
  if (state === 'title') drawTitle();
  else { drawHUD(); drawHint(); drawMallet(); drawResult(); }
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
