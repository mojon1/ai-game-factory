<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>すべり勇者の地下迷宮</title>
<style>
html, body, canvas, * { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; margin: 0; padding: 0; background: #120e16; overflow: hidden; width: 100vw; height: 100dvh; }
canvas { display: block; width: 100vw; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../../lib/zzfx-1.4.0.min.js"></script>
<script>
'use strict';
for (const t of ['contextmenu', 'selectstart', 'gesturestart']) addEventListener(t, (e) => e.preventDefault(), { passive: false });
const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };
const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const T = {
  ja: {
    title: 'すべり勇者の地下迷宮', t1: 'スワイプすると、止まるまですべる', t2: 'すべった距離が攻撃力。倒すとそのまま突き抜ける',
    t3: '赤いマスで止まると攻撃される。タップで1手待つ', start: 'タップでスタート', floor: '地下{n}階', best: 'ベスト',
    hint: 'スワイプですべる・タップで待つ。指を止めると行き先が見える', clear: '敵をすべて倒した！ 階段へすべりこめ',
    pick: '地下{n}階 突破！ ひとつ選ぶ', over: 'やられた…', reached: '地下{n}階まで', newBest: 'ベスト更新！', again: 'タップでもう一度',
    score: '点', combo: '{n}体抜き！', shield: '盾が防いだ', bonk: 'ドン',
  },
  en: {
    title: 'Slide Knight Dungeon', t1: 'Swipe to slide until you stop', t2: 'Distance = power. Kill it and you slide right through',
    t3: 'Stop on a red tile and you get hit. Tap to wait a turn', start: 'Tap to start', floor: 'Floor B{n}', best: 'Best',
    hint: 'Swipe to slide, tap to wait. Hold mid-swipe to preview', clear: 'All clear! Slide over the stairs',
    pick: 'Floor B{n} cleared! Choose one', over: 'Defeated...', reached: 'Reached floor B{n}', newBest: 'New best!', again: 'Tap to play again',
    score: 'pts', combo: '{n} in one slide!', shield: 'Shield blocked', bonk: 'Bonk',
  }
}[LANG === 'ja' ? 'ja' : 'en'];
const tr = (k, n) => T[k].replace('{n}', n);
const PERKS = [
  { id: 'heart', ja: ['鉄の心臓', '最大HP+1、全回復'], en: ['Iron Heart', 'Max HP +1, full heal'] },
  { id: 'herb', ja: ['薬草', 'HPを2回復'], en: ['Herb', 'Heal 2 HP'] },
  { id: 'boots', ja: ['重いブーツ', '体当たりの攻撃力+1'], en: ['Heavy Boots', 'Hit power +1'] },
  { id: 'bounce', ja: ['はね返り', '敵を倒したすべりは、壁で1度はね返って続く'], en: ['Rebound', 'A slide that kills bounces off a wall once and keeps going'], once: true },
  { id: 'shield', ja: ['木の盾', '各階で最初の1撃を防ぐ'], en: ['Wooden Shield', 'Blocks the first hit on each floor'], once: true },
  { id: 'chain', ja: ['連斬の印', '1回のすべりで2体以上倒すとHP+1'], en: ['Chain Sigil', 'Kill 2+ in one slide: heal 1'], once: true },
  { id: 'quake', ja: ['地ひびき', '3マス以上すべって壁に当たると、周りの敵に1ダメージ'], en: ['Tremor', 'Hit a wall after 3+ tiles: 1 damage around you'], once: true },
  { id: 'gold', ja: ['金の袋', 'コインの点が2倍'], en: ['Gold Pouch', 'Coins score double'], once: true },
];
const ETYPE = {
  slime: { hp: 1, col: '#5fd068', pts: 10 },
  skel: { hp: 2, col: '#e8e4d0', pts: 20 },
  archer: { hp: 1, col: '#b07ae0', pts: 20 },
  bat: { hp: 1, col: '#e0607a', pts: 15 },
  golem: { hp: 4, col: '#9aa0aa', pts: 40 },
};
const COLS = 7, ROWS = 9;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 40, OX = 0, OY = 0;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const top = 64, bottom = 56;
  S = Math.floor(Math.max(10, Math.min((W - 24) / (COLS + 0.6), (H - top - bottom) / (ROWS + 0.9))));
  OX = Math.round((W - S * COLS) / 2);
  OY = Math.round(top + (H - top - bottom - S * ROWS) / 2 + S * 0.35);
}
addEventListener('resize', resize); resize();

// ---------- sound ----------
let audioOk = false;
const snd = (p) => { if (!audioOk || typeof zzfx !== 'function') return; try { zzfx(...p); } catch (e) {} };
const SFX = {
  slide: (n) => snd([0.35, 0.1, 180 + n * 30, 0.01, 0.06, 0.08, 4, 0.6, 8, , , , , 0.5]),
  hit: (p) => snd([0.9, 0.05, 140 + p * 45, 0, 0.03, 0.12, 2, 1.6, -3, , , , , 0.6, , 0.15]),
  kill: (k) => snd([0.8, 0.05, 330 * Math.pow(1.1225, k), 0.01, 0.06, 0.18, 1, 1.4, , , 120, 0.04]),
  coin: () => snd([0.45, 0, 1400, 0, 0.03, 0.12, 0, 1.8, , , 450, 0.05]),
  wall: (m) => snd([0.5 + Math.min(0.4, m * 0.08), 0.05, 70, 0, 0.02, 0.1, 4, 2, , , , , , 1]),
  hurt: () => snd([0.9, 0.1, 220, 0, 0.05, 0.25, 3, 2, -4, , , , , 1.2]),
  stairs: () => snd([0.6, 0, 520, 0.02, 0.2, 0.3, 0, 1.5, , , 260, 0.08, 0.1]),
  open: () => snd([0.6, 0, 660, 0.03, 0.15, 0.35, 0, 1.3, , , 330, 0.1]),
  aim: () => snd([0.25, 0, 900, 0, 0.02, 0.05, 1, 1, 40]),
  arrow: () => snd([0.5, 0.05, 600, 0, 0.02, 0.08, 3, 1, -30]),
  pick: () => snd([0.6, 0, 880, 0.01, 0.1, 0.2, 0, 1.4, , , 440, 0.06]),
  over: () => snd([0.8, 0, 300, 0.05, 0.3, 0.6, 0, 1, -0.8, , -60, 0.15]),
  bounce: () => snd([0.6, 0, 300, 0, 0.04, 0.1, 0, 1, 20]),
};

// ---------- save ----------
let best = 0, bestFloor = 0;
addEventListener('message', (e) => { if (e.data && e.data.agf === 'loaded' && e.data.data) { best = e.data.data.best || 0; bestFloor = e.data.data.bestFloor || 0; } });
try { parent.postMessage({ agf: 'load' }, '*'); } catch (e) {}
const doSave = () => { try { parent.postMessage({ agf: 'save', data: { best, bestFloor } }, '*'); } catch (e) {} };

// ---------- state ----------
let scene = 'title', sceneT = 0, now = 0;
let G = null;
let queue = [], cur = null, curT = 0;
let fx = [], pops = [], shake = 0, flash = 0, banner = null, hintT = 0;
let drag = null;
let perkChoices = [], perkRects = [];
let overInfo = null;
let seed = 1;
const rf = () => { seed = (seed + 0x6D2B79F5) | 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const rnd = (n) => Math.floor(rf() * n);
const inB = (r, c) => r >= 0 && r < ROWS && c >= 0 && c < COLS;
const enemyAt = (r, c, hpMap) => G.enemies.find((e) => e.r === r && e.c === c && (hpMap ? hpMap.get(e) > 0 : e.hp > 0));
const rockAt = (r, c) => !inB(r, c) || G.rock[r][c];
let uid = 1;

function newRun() {
  seed = (Math.random() * 2147483647) | 0;
  G = { mom: 0, floor: 0, hp: 3, maxhp: 3, score: 0, kills: 0, perks: {}, shieldUsed: false };
  nextFloor();
  scene = 'play'; sceneT = 0; hintT = 0;
  signal('start');
}
function cellsFree() {
  const out = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (!G.rock[r][c] && !(r === G.hero.r && c === G.hero.c) && !enemyAt(r, c) && !G.items.find((i) => i.r === r && i.c === c)) out.push([r, c]);
  return out;
}
function connected() {
  const seen = new Set([G.hero.r * COLS + G.hero.c]), st = [[G.hero.r, G.hero.c]];
  let open = 0;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (!G.rock[r][c]) open++;
  while (st.length) {
    const [r, c] = st.pop();
    for (const [dr, dc] of DIRS) { const nr = r + dr, nc = c + dc; if (inB(nr, nc) && !G.rock[nr][nc] && !seen.has(nr * COLS + nc)) { seen.add(nr * COLS + nc); st.push([nr, nc]); } }
  }
  return seen.size === open;
}
const DIRS = [[-1, 0], [1, 0], [0, -1], [0, 1]];
function nextFloor() {
  G.floor++;
  G.shieldUsed = false;
  G.open = false; G.stairs = null; G.turn = 0;
  const f = G.floor;
  const hero = G.hero = { r: ROWS - 1, c: 3 };
  for (let tries = 0; tries < 50; tries++) {
    G.rock = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    const nRock = 5 + rnd(4) + Math.min(3, Math.floor(f / 3));
    for (let i = 0; i < nRock; i++) {
      const r = rnd(ROWS - 1), c = rnd(COLS);
      if (Math.abs(r - hero.r) + Math.abs(c - hero.c) < 2) continue;
      G.rock[r][c] = 1;
    }
    if (connected()) break;
  }
  G.enemies = []; G.items = [];
  const pool = ['slime', 'slime'];
  if (f >= 2) pool.push('skel', 'skel');
  if (f >= 3) pool.push('archer');
  if (f >= 4) pool.push('bat', 'bat');
  if (f >= 5) pool.push('golem');
  if (f >= 7) pool.push('skel', 'archer', 'golem');
  const n = Math.min(10, 2 + Math.floor(f * 0.85) + (f === 1 ? 1 : 0));
  const free = cellsFree().filter(([r, c]) => Math.abs(r - hero.r) + Math.abs(c - hero.c) >= 4);
  for (let i = 0; i < n && free.length; i++) {
    const [r, c] = free.splice(rnd(free.length), 1)[0];
    let type = f === 1 ? 'slime' : pool[rnd(pool.length)];
    if (f <= 2 && i === 0) type = 'skel';
    if (f === 3 && i === 0) type = 'archer';
    if (f === 4 && i === 0) type = 'bat';
    if (f === 5 && i === 0) type = 'golem';
    const d = ETYPE[type];
    G.enemies.push({ id: uid++, type, hp: d.hp, maxhp: d.hp, r, c, x: c, y: r, aim: 0, rest: type === 'golem' ? 1 : 0, flashT: 0, bob: Math.random() * 6, warn: 0, dead: 0 });
  }
  const fc = cellsFree();
  const nCoin = 3 + rnd(3);
  for (let i = 0; i < nCoin && fc.length; i++) { const [r, c] = fc.splice(rnd(fc.length), 1)[0]; G.items.push({ r, c, type: 'coin' }); }
  if (f >= 2 && rf() < 0.45 && fc.length) { const [r, c] = fc.splice(rnd(fc.length), 1)[0]; G.items.push({ r, c, type: 'heart' }); }
  G.hx = hero.c; G.hy = hero.r;
  banner = { text: tr('floor', f), t: 0, d: 1.4 };
  updateWarn();
}

// ---------- slide simulation ----------
function simulate(dr, dc) {
  const P = G.perks;
  const hpMap = new Map(G.enemies.map((e) => [e, e.hp]));
  let r = G.hero.r, c = G.hero.c, m = 0, bounced = false;
  const ev = [];
  const got = new Set();
  let kills = 0, steps = 0;
  for (let guard = 0; guard < 60; guard++) {
    const nr = r + dr, nc = c + dc;
    if (rockAt(nr, nc)) {
      if (P.bounce && !bounced && kills > 0) { bounced = true; dr = -dr; dc = -dc; ev.push({ t: 'bounce', r, c }); continue; }
      ev.push({ t: 'wall', r, c, m, quake: P.quake && m >= 3 });
      break;
    }
    const e = enemyAt(nr, nc, hpMap);
    if (e) {
      const power = Math.max(1, m) + (P.boots || 0);
      const hp = hpMap.get(e);
      if (power >= hp) {
        hpMap.set(e, 0); kills++;
        m = power - hp - (P.boots || 0); if (m < 0) m = 0;
        ev.push({ t: 'hit', e, power, kill: true, k: kills, r: nr, c: nc, over: power - hp, m });
        r = nr; c = nc; steps++;
        pickup(r, c, ev, got);
        if (G.stairs && G.open && r === G.stairs.r && c === G.stairs.c) { ev.push({ t: 'stairs' }); break; }
        continue;
      } else {
        hpMap.set(e, hp - power);
        ev.push({ t: 'hit', e, power, kill: false, r: nr, c: nc });
        break;
      }
    }
    r = nr; c = nc; m++; steps++;
    ev.push({ t: 'move', r, c, m });
    pickup(r, c, ev, got);
    if (G.stairs && G.open && r === G.stairs.r && c === G.stairs.c) { ev.push({ t: 'stairs' }); break; }
  }
  const acted = ev.some((x) => x.t === 'move' || x.t === 'hit');
  return { ev, r, c, kills, acted, hpMap };
}
function pickup(r, c, ev, got) {
  const it = G.items.find((i) => i.r === r && i.c === c && !got.has(i));
  if (it) { got.add(it); ev.push({ t: 'item', it }); }
}

// ---------- turn execution ----------
const Q = (d, start, tick, end) => queue.push({ d, start, tick, end });
function doWait() {
  if (G.open) return;
  G.turn++;
  SFX.aim();
  pop(G.hero.c, G.hero.r - 0.4, '…', '#c8c0e0', 0.8);
  enemyPhase();
}
function doSlide(dr, dc) {
  const sim = simulate(dr, dc);
  if (!sim.acted) { G.hx += dc * 0.15; G.hy += dr * 0.15; return; }
  G.turn++;
  let px = G.hero.c, py = G.hero.r;
  let combo = 0;
  SFX.slide(0);
  for (const e of sim.ev) {
    if (e.t === 'move') {
      const fx0 = px, fy0 = py, tx = e.c, ty = e.r;
      Q(0.05, () => { G.hero.r = e.r; G.hero.c = e.c; G.mom = e.m; trail(fx0, fy0); }, (k) => { G.hx = fx0 + (tx - fx0) * k; G.hy = fy0 + (ty - fy0) * k; });
      px = tx; py = ty;
    } else if (e.t === 'hit') {
      const fx0 = px, fy0 = py, en = e.e;
      if (e.kill) {
        combo = e.k;
        Q(0.05, null, (k) => { G.hx = fx0 + (e.c - fx0) * k * 0.6; G.hy = fy0 + (e.r - fy0) * k * 0.6; });
        Q(0.06 + Math.min(0.08, e.power * 0.015), () => {
          en.hp = 0; en.dead = 0.001; G.kills++;
          const pts = ETYPE[en.type].pts * e.k + e.over * 5;
          G.score += pts; G.mom = e.m;
          SFX.hit(e.power); SFX.kill(e.k);
          shake = Math.min(14, 3 + e.power * 2);
          burst(en.c, en.r, ETYPE[en.type].col, 10 + e.power * 3);
          pop(en.c, en.r - 0.55, e.power + '!', '#ffd85a', 1 + Math.min(1.2, e.power * 0.12));
          pop(en.c + 0.6, en.r - 0.1, '+' + pts, '#fff', 0.65);
        });
        Q(0.05, () => { G.hero.r = e.r; G.hero.c = e.c; }, (k) => { G.hx = fx0 + (e.c - fx0) * (0.6 + 0.4 * k); G.hy = fy0 + (e.r - fy0) * (0.6 + 0.4 * k); });
        px = e.c; py = e.r;
      } else {
        Q(0.06, null, (k) => { const q = k < 0.5 ? k * 2 : 2 - k * 2; G.hx = fx0 + (e.c - fx0) * q * 0.45; G.hy = fy0 + (e.r - fy0) * q * 0.45; });
        Q(0.12, () => {
          en.hp -= e.power; en.flashT = 0.25;
          SFX.hit(e.power); shake = 3 + e.power;
          burst(en.c, en.r, '#fff', 5);
          pop(en.c, en.r - 0.2, e.power + '', '#ffb070', 0.9);
        }, null, () => { G.hx = fx0; G.hy = fy0; });
      }
    } else if (e.t === 'item') {
      Q(0, () => {
        const it = e.it; G.items = G.items.filter((x) => x !== it);
        if (it.type === 'coin') { const v = G.perks.gold ? 10 : 5; G.score += v; SFX.coin(); pop(it.c, it.r, '+' + v, '#ffe07a', 0.7); }
        else { G.hp = Math.min(G.maxhp, G.hp + 1); SFX.pick(); pop(it.c, it.r, '♥+1', '#ff6b8a', 0.8); }
        burst(it.c, it.r, it.type === 'coin' ? '#ffd85a' : '#ff6b8a', 6);
      });
    } else if (e.t === 'bounce') {
      Q(0.06, () => { SFX.bounce(); shake = 4; burst(e.c + 0, e.r, '#9fd8ff', 6); });
    } else if (e.t === 'wall') {
      Q(0.04, () => {
        if (e.m >= 2) { SFX.wall(e.m); shake = Math.max(shake, Math.min(8, e.m)); dust(e.c, e.r); }
        if (e.quake) {
          for (const en of G.enemies) if (en.hp > 0 && Math.abs(en.r - e.r) <= 1 && Math.abs(en.c - e.c) <= 1) {
            en.hp -= 1; en.flashT = 0.25; pop(en.c, en.r - 0.2, '1', '#ffb070', 0.8);
            if (en.hp <= 0) { en.dead = 0.001; G.kills++; G.score += ETYPE[en.type].pts; SFX.kill(0); burst(en.c, en.r, ETYPE[en.type].col, 10); }
          }
          shake = 10;
        }
      });
    } else if (e.t === 'stairs') {
      Q(0.35, () => { SFX.stairs(); G.mom = 0; }, (k) => { heroSink = k; }, () => { heroSink = 0; floorDone(); });
      return;
    }
  }
  Q(0.02, () => {
    G.mom = 0;
    if (combo >= 2) {
      banner = { text: tr('combo', combo), t: 0, d: 1.1, small: true, combo: true };
      if (G.perks.chain && G.hp < G.maxhp) { G.hp++; pop(G.hero.c, G.hero.r - 0.5, '♥+1', '#ff6b8a', 0.8); }
    }
    G.enemies = G.enemies.filter((x) => x.hp > 0 || x.dead > 0);
    if (!G.enemies.some((x) => x.hp > 0)) openStairs(); else enemyPhase();
  });
}
let heroSink = 0;
function trail(x, y) { fx.push({ k: 'trail', x, y, t: 0, d: 0.35 }); }
function burst(x, y, col, n) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = 1.5 + Math.random() * 4; fx.push({ k: 'p', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.5, t: 0, d: 0.4 + Math.random() * 0.35, col }); } }
function dust(x, y) { for (let i = 0; i < 6; i++) { const a = Math.random() * 6.283; fx.push({ k: 'p', x, y: y + 0.3, vx: Math.cos(a) * 1.5, vy: -Math.random() * 1.5, t: 0, d: 0.5, col: '#8a7a70' }); } }
function pop(x, y, text, col, sc) { pops.push({ x, y, text, col, sc, t: 0, d: 0.9 }); }

function openStairs() {
  // choose a cell the hero can slide over
  const direct = new Set();
  for (const [dr, dc] of DIRS) { let r = G.hero.r, c = G.hero.c; while (!rockAt(r + dr, c + dc)) { r += dr; c += dc; direct.add(r * COLS + c); } }
  const reach = direct.size ? direct : slideCover();
  let cand = [...reach].map((k) => [Math.floor(k / COLS), k % COLS]).filter(([r, c]) => !(r === G.hero.r && c === G.hero.c));
  cand.sort((a, b) => (Math.abs(b[0] - G.hero.r) + Math.abs(b[1] - G.hero.c)) - (Math.abs(a[0] - G.hero.r) + Math.abs(a[1] - G.hero.c)));
  cand = cand.slice(0, Math.max(1, Math.ceil(cand.length / 3)));
  const [r, c] = cand[rnd(cand.length)] || [0, 3];
  G.stairs = { r, c }; G.open = true;
  SFX.open();
  const pre = banner && banner.combo ? banner.text + '  ' : '';
  banner = { text: pre + T.clear, t: 0, d: 2.2, small: true };
  burst(c, r, '#9fd8ff', 16);
  for (const e of G.enemies) e.warn = 0;
}
function slideCover() {
  const stops = new Set([G.hero.r * COLS + G.hero.c]), cover = new Set(), st = [[G.hero.r, G.hero.c]];
  while (st.length) {
    const [r0, c0] = st.pop();
    for (const [dr, dc] of DIRS) {
      let r = r0, c = c0;
      while (!rockAt(r + dr, c + dc)) { r += dr; c += dc; cover.add(r * COLS + c); }
      const k = r * COLS + c;
      if (!stops.has(k)) { stops.add(k); st.push([r, c]); }
    }
  }
  return cover;
}
function floorDone() {
  G.score += 50 * G.floor;
  perkChoices = [];
  const avail = PERKS.filter((p) => !(p.once && G.perks[p.id]) && !(p.id === 'herb' && G.hp >= G.maxhp));
  while (perkChoices.length < 3 && avail.length) perkChoices.push(avail.splice(rnd(avail.length), 1)[0]);
  scene = 'perk'; sceneT = 0;
}
function takePerk(p) {
  SFX.pick();
  const P = G.perks;
  if (p.id === 'heart') { G.maxhp++; G.hp = G.maxhp; }

  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(x + S * 0.15, y - h + S * 0.2, S * 0.5, S * 0.08);
}
function drawItem(it) {
  const x = cx(it.c), y = cy(it.r) + Math.sin(now * 3 + it.c) * S * 0.05;
  if (it.type === 'coin') {
    const w = Math.abs(Math.cos(now * 3 + it.r)) * S * 0.18 + S * 0.04;
    ctx.fillStyle = '#ffd34a'; ctx.beginPath(); ctx.ellipse(x, y, w, S * 0.2, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#a87a10'; ctx.lineWidth = 2; ctx.stroke();
  } else drawHeartIcon(x, y, S * 0.5, true);
}
function drawHero(x, y, s, a, t, prev) {
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y);
  const b = Math.sin(t * 6) * s * 0.02;
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(0, s * 0.32, s * 0.3, s * 0.1, 0, 0, 7); ctx.fill();
  // cape
  ctx.fillStyle = '#c0304a'; rr(-s * 0.26, -s * 0.12 + b, s * 0.52, s * 0.42, s * 0.1); ctx.fill();
  // body
  ctx.fillStyle = '#4a7ad8'; rr(-s * 0.22, -s * 0.06 + b, s * 0.44, s * 0.36, s * 0.12); ctx.fill();
  // helmet
  ctx.fillStyle = '#d8dce8'; ctx.beginPath(); ctx.arc(0, -s * 0.18 + b, s * 0.22, 0, 7); ctx.fill();
  ctx.fillStyle = '#1a1a28'; ctx.fillRect(-s * 0.14, -s * 0.2 + b, s * 0.28, s * 0.06);
  ctx.fillStyle = '#ffd34a'; ctx.fillRect(-s * 0.03, -s * 0.44 + b, s * 0.06, s * 0.1);
  // sword
  ctx.fillStyle = '#e8f0ff'; ctx.fillRect(s * 0.24, -s * 0.28 + b, s * 0.06, s * 0.42);
  ctx.fillStyle = '#ffd34a'; ctx.fillRect(s * 0.18, s * 0.1 + b, s * 0.18, s * 0.05);
  ctx.restore();
}
function drawEnemy(e, prev) {
  const s = S, x = cx(e.x), y = cy(e.y);
  ctx.save(); ctx.translate(x, y);
  const t = now + e.bob;
  const fl = e.flashT > 0;
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(0, s * 0.32, s * 0.28, s * 0.09, 0, 0, 7); ctx.fill();
  if (e.dead) { ctx.globalAlpha = Math.max(0, 1 - e.dead); ctx.scale(1 + e.dead, 1 - e.dead * 0.8); }
  const col = fl ? '#fff' : ETYPE[e.type].col;
  if (e.type === 'slime') {
    const sq = Math.sin(t * 5) * 0.06;
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, s * 0.1, s * (0.3 + sq), s * (0.24 - sq), 0, Math.PI, 0); ctx.lineTo(s * (0.3 + sq), s * 0.3); ctx.lineTo(-s * (0.3 + sq), s * 0.3); ctx.fill();
    eyes(0, s * 0.06, s);
  } else if (e.type === 'skel') {
    ctx.fillStyle = fl ? '#fff' : '#cfc8b0'; ctx.fillRect(-s * 0.16, s * 0.02, s * 0.32, s * 0.28);
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, -s * 0.1, s * 0.22, 0, 7); ctx.fill();
    ctx.fillStyle = '#1a1220'; ctx.beginPath(); ctx.arc(-s * 0.08, -s * 0.12, s * 0.06, 0, 7); ctx.arc(s * 0.08, -s * 0.12, s * 0.06, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff5a5a'; ctx.fillRect(-s * 0.09, -s * 0.13, s * 0.03, s * 0.03); ctx.fillRect(s * 0.07, -s * 0.13, s * 0.03, s * 0.03);
  } else if (e.type === 'archer') {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, -s * 0.38); ctx.lineTo(s * 0.26, s * 0.3); ctx.lineTo(-s * 0.26, s * 0.3); ctx.fill();
    ctx.fillStyle = '#1a1220'; ctx.beginPath(); ctx.arc(0, -s * 0.08, s * 0.1, 0, 7); ctx.fill();
    ctx.fillStyle = e.aim ? '#ff4b5c' : '#ffe07a'; ctx.fillRect(-s * 0.06, -s * 0.1, s * 0.04, s * 0.04); ctx.fillRect(s * 0.02, -s * 0.1, s * 0.04, s * 0.04);
    ctx.strokeStyle = '#d8b070'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(s * 0.22, 0, s * 0.2, -1.2, 1.2); ctx.stroke();
  } else if (e.type === 'bat') {
    const w = Math.sin(t * 14) * 0.5 + 0.5;
    ctx.translate(0, -s * 0.12 + Math.sin(t * 4) * s * 0.05);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-s * 0.42, -s * (0.05 + 0.2 * w)); ctx.lineTo(-s * 0.3, s * 0.12); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(s * 0.42, -s * (0.05 + 0.2 * w)); ctx.lineTo(s * 0.3, s * 0.12); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, s * 0.15, 0, 7); ctx.fill();
    eyes(0, -s * 0.02, s * 0.8);
  } else if (e.type === 'golem') {
    ctx.fillStyle = col; rr(-s * 0.36, -s * 0.34, s * 0.72, s * 0.64, s * 0.1); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(-s * 0.36, s * 0.1, s * 0.72, s * 0.2);
    ctx.fillStyle = e.rest ? '#6a5040' : '#ff9a3a'; ctx.fillRect(-s * 0.2, -s * 0.16, s * 0.12, s * 0.07); ctx.fillRect(s * 0.08, -s * 0.16, s * 0.12, s * 0.07);
  }
  ctx.restore();
  if (e.dead) return;
  // hp pips
  if (e.maxhp > 1) {
    const pw = Math.min(s * 0.16, s * 0.7 / e.maxhp), tot = pw * e.maxhp;
    for (let i = 0; i < e.maxhp; i++) { ctx.fillStyle = i < e.hp ? '#ff5a6a' : '#3a2a3a'; ctx.fillRect(x - tot / 2 + i * pw + 1, y - s * 0.5, pw - 2, s * 0.08); }
  }
  if (e.type === 'golem' && e.rest && !e.warn) fitText('z', x + s * 0.3, y - s * 0.38, s, Math.round(s * 0.28), '#c8c0e0', 800);
  if (e.warn) {
    const p = 0.8 + 0.2 * Math.sin(now * 10);
    fitText('!', x + s * 0.32, y - s * 0.36, s, Math.max(14, Math.round(s * 0.42 * p)), '#ff4b5c', 900);
  }
}
function eyes(x, y, s) {
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x - s * 0.09, y, s * 0.07, 0, 7); ctx.arc(x + s * 0.09, y, s * 0.07, 0, 7); ctx.fill();
  ctx.fillStyle = '#1a1220'; ctx.beginPath(); ctx.arc(x - s * 0.08, y + s * 0.01, s * 0.035, 0, 7); ctx.arc(x + s * 0.1, y + s * 0.01, s * 0.035, 0, 7); ctx.fill();
}
function drawPerk() {
  const a = Math.min(1, sceneT * 4);
  ctx.fillStyle = `rgba(10,6,14,${0.82 * a})`; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = a;
  fitText(tr('pick', G.floor), W / 2, H * 0.17, W - 24, 22, '#ffe07a', 800);
  const cw = Math.min(W - 40, 340), ch = Math.min(96, (H * 0.62) / 3 - 12);
  perkRects = [];
  perkChoices.forEach((p, i) => {
    const x = (W - cw) / 2, y = H * 0.25 + i * (ch + 14) + (1 - Math.min(1, sceneT * 3 - i * 0.2)) * 30;
    perkRects.push({ x, y, w: cw, h: ch, p });
    ctx.fillStyle = '#2e2436'; rr(x, y, cw, ch, 14); ctx.fill();
    ctx.strokeStyle = '#ffe07a'; ctx.lineWidth = 2; ctx.stroke();
    const L = LANG === 'ja' ? p.ja : p.en;
    fitText(L[0], x + 18, y + ch * 0.34, cw - 36, 20, '#fff', 800, 'left');
    fitText(L[1], x + 18, y + ch * 0.7, cw - 36, 14, '#c8b8d0', 600, 'left');
  });
  ctx.globalAlpha = 1;
}
function drawOver() {
  const a = Math.min(1, sceneT * 3);
  ctx.fillStyle = `rgba(10,6,14,${0.8 * a})`; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = a;
  fitText(T.over, W / 2, H * 0.24, W - 24, 26, '#ff8a9a', 800);
  fitText(tr('reached', overInfo.floor), W / 2, H * 0.32, W - 24, 20, '#e8dcc8', 700);
  fitText(`${overInfo.score} ${T.score}`, W / 2, H * 0.43, W - 24, 48, '#ffe07a', 900);
  fitText(`${T.best} ${best}`, W / 2, H * 0.52, W - 24, 18, '#c8b8d0', 600);
  if (overInfo.nb) fitText(T.newBest, W / 2, H * 0.58, W - 24, 22, '#9fffb0', 800);
  if (sceneT > 0.7) { ctx.globalAlpha = a * (0.6 + 0.4 * Math.sin(now * 4)); fitText(T.again, W / 2, H * 0.74, W - 24, 20, '#fff', 700); }
  ctx.globalAlpha = 1;
}
