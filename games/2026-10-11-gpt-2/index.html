<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;overflow:hidden;overscroll-behavior:none;width:100%;height:100%;background:#d8e9e6}canvas{display:block;width:100vw;height:100dvh}</style></head><body><canvas id="c"></canvas><script>
'use strict';const c=document.getElementById('c'),g=c.getContext('2d');for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});const lang=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en');const D={ja:{title:'雨やねの花便り',sub:'守って、雨を届けよう',r1:'指で空に屋根をひと筆',r2:'左右の花に雨を6粒ずつ',r3:'猫が4回濡れる前に咲かせよう',start:'タップでスタート',wet:'ぬれ',flower:'花',hint:'線の両端を花の上へ',draw:'描き直すと屋根が入れかわる',clear:'雨から、花が咲いた',fail:'猫がびしょぬれ',retry:'タップでもう一度',water:'水',roof:'屋根は空の色の範囲に'},en:{title:'Rain Roof Letters',sub:'Shelter and deliver the rain',r1:'Draw one roof across the sky',r2:'Send 6 drops to each flower',r3:'Bloom before the cat gets wet 4 times',start:'Tap to start',wet:'Wet',flower:'Flowers',hint:'Put roof ends above the flowers',draw:'A new stroke replaces the roof',clear:'Rain becomes blossoms',fail:'The cat is soaked',retry:'Tap to play again',water:'Water',roof:'Draw inside the sky area'}};const T=D[lang]||D.en;let W,H,s,ox,oy,state='title',roof=[],stroke=[],finger=null,drops=[],water=[0,0],wet=0,t=0,spawn=0,seq=0,ended=0,ac,pops=[];const signal=type=>{try{parent.postMessage({agf:type},'*')}catch(e){}};function audio(){try{ac||=new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}function sound(f,d=.1){try{if(!ac)return;const o=ac.createOscillator(),a=ac.createGain();o.frequency.value=f;a.gain.setValueAtTime(.05,ac.currentTime);a.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(a).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}function resize(){W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);const d=Math.min(2,devicePixelRatio||1);c.width=W*d;c.height=H*d;s=Math.min(W/360,H/640);ox=(W-360*s)/2;oy=(H-640*s)/2}addEventListener('resize',resize);resize();function start(){roof=[];stroke=[];finger=null;drops=[];water=[0,0];wet=0;t=0;spawn=2;seq=0;pops=[];state='play';signal('start')}function finish(ok){if(state!=='play')return;state=ok?'clear':'fail';ended=0;finger=null;stroke=[];signal('end');sound(ok?660:110,.3)}function point(e){const r=c.getBoundingClientRect();return{x:Math.max(40,Math.min(320,(e.clientX-r.left-ox)/s)),y:Math.max(150,Math.min(380,(e.clientY-r.top-oy)/s))}}c.addEventListener('pointerdown',e=>{e.preventDefault();audio();if(state==='title'){start();return}if(state==='clear'||state==='fail'){if(ended>.7)start();return}if(finger!==null)return;finger=e.pointerId;c.setPointerCapture(e.pointerId);stroke=[point(e)]});c.addEventListener('pointermove',e=>{if(e.pointerId!==finger)return;const p=point(e),last=stroke[stroke.length-1];if(Math.hypot(p.x-last.x,p.y-last.y)>5&&stroke.length<160)stroke.push(p)});c.addEventListener('pointerup',e=>{if(e.pointerId!==finger)return;stroke.push(point(e));if(stroke.length>=2&&Math.hypot(stroke[0].x-stroke.at(-1).x,stroke[0].y-stroke.at(-1).y)>20){roof=stroke.map(p=>({...p}));for(const d of drops)if(d.i!==null){d.i=null;d.v=100}}stroke=[];finger=null});c.addEventListener('pointercancel',e=>{if(e.pointerId===finger){finger=null;stroke=[]}});function update(dt){if(state==='clear'||state==='fail'){ended+=dt;return}if(state!=='play')return;t+=dt;spawn-=dt;if(spawn<=0){spawn+=.45;const xs=[100,250,130,220,160,195,115,245];drops.push({x:xs[seq++%xs.length],y:112,v:225,i:null,u:0,dir:1,dead:false})}for(const d of drops){if(d.dead)continue;if(d.i!==null){const a=roof[d.i],b=roof[d.i+1];if(!a||!b){d.i=null;continue}const len=Math.max(1,Math.hypot(b.x-a.x,b.y-a.y));d.u+=d.dir*180*dt/len;if(d.u<0||d.u>1){const ni=d.i+d.dir;if(ni<0||ni>=roof.length-1){const p=d.dir<0?roof[0]:roof.at(-1);d.x=p.x;d.y=p.y+5;d.i=null;d.v=170}else{d.i=ni;d.u=d.dir<0?1:0}}else{d.x=a.x+(b.x-a.x)*d.u;d.y=a.y+(b.y-a.y)*d.u-4}}else{const old=d.y;d.y+=d.v*dt;for(let i=0;i<roof.length-1;i++){const a=roof[i],b=roof[i+1];if(Math.abs(b.x-a.x)<1)continue;const u=(d.x-a.x)/(b.x-a.x),y=a.y+(b.y-a.y)*u;if(u>=0&&u<=1&&old<=y&&d.y>=y){d.i=i;d.u=u;d.y=y-4;d.dir=b.y>a.y?1:b.y<a.y?-1:d.x<180?-1:1;break}}if(d.i===null&&d.y>463&&Math.abs(d.x-180)<30){wet++;d.dead=true;sound(140);pops.push({x:180,y:430,text:'!',life:.6});if(wet>=4){finish(false);return}}if(d.i===null&&d.y>500){d.dead=true;for(let j=0;j<2;j++)if(Math.abs(d.x-[70,290][j])<38){water[j]=Math.min(6,water[j]+1);sound(420+water[j]*60);pops.push({x:[70,290][j],y:445,text:'+1',life:.6})}if(water.every(n=>n>=6)){finish(true);return}}}}drops=drops.filter(d=>!d.dead);for(const p of pops)p.life-=dt;pops=pops.filter(p=>p.life>0)}
function text(str,x,y,size=18,color='#294e59'){g.fillStyle=color;g.textAlign='center';g.font=size+'px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif';const w=g.measureText(str).width;if(w>320)g.font=(size*320/w)+'px system-ui';g.fillText(str,x,y)}function path(ps,color,width){if(!ps.length)return;g.strokeStyle=color;g.lineWidth=width;g.lineJoin='round';g.lineCap='round';g.beginPath();ps.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.stroke()}function flower(x,n){g.strokeStyle='#528c70';g.lineWidth=5;g.beginPath();g.moveTo(x,530);g.lineTo(x,480);g.stroke();g.fillStyle='#72a884';g.beginPath();g.ellipse(x-11,510,13,5,-.6,0,Math.PI*2);g.fill();g.beginPath();g.ellipse(x+11,500,13,5,.6,0,Math.PI*2);g.fill();const r=n>=6?15:5+n;for(let i=0;i<6;i++){g.fillStyle=n>=6?'#f39a91':'#a9bda5';g.beginPath();g.ellipse(x+Math.cos(i*Math.PI/3)*r*.7,480+Math.sin(i*Math.PI/3)*r*.7,r*.6,r*.45,i*Math.PI/3,0,Math.PI*2);g.fill()}g.fillStyle='#f2d082';g.beginPath();g.arc(x,480,n>=6?8:4,0,Math.PI*2);g.fill();text(n+'/6',x,568,19)}function cat(){g.fillStyle=wet?'#a5aaaf':'#d7b399';g.beginPath();g.ellipse(180,503,26,24,0,0,Math.PI*2);g.fill();g.beginPath();g.moveTo(157,485);g.lineTo(155,458);g.lineTo(172,471);g.lineTo(190,471);g.lineTo(205,458);g.lineTo(203,485);g.closePath();g.fill();g.beginPath();g.ellipse(180,484,24,18,0,0,Math.PI*2);g.fill();text(wet?'•  •':'⌣ ⌣',180,485,15);text('ᴥ',180,499,14)}function draw(){g.setTransform(c.width/W,0,0,c.height/H,0,0);g.clearRect(0,0,W,H);g.save();g.translate(ox,oy);g.scale(s,s);g.fillStyle='#d8e9e6';g.fillRect(0,0,360,640);g.fillStyle='#bfd5cf';g.fillRect(0,535,360,105);if(state==='title'){text(T.title,180,180,30);text(T.sub,180,223,18);text(T.r1,180,315,19);text(T.r2,180,349,19);text(T.r3,180,383,18);text(T.start,180,492,23);g.restore();return}text(T.wet+' '+wet+'/4',70,35,18);text(T.flower+' '+water.filter(n=>n>=6).length+'/2',275,35,18);g.fillStyle='#adc4cb';for(const x of [100,170,240]){g.beginPath();g.ellipse(x,100,55,20,0,0,Math.PI*2);g.fill()}g.strokeStyle='#c7dbd6';g.lineWidth=2;g.setLineDash([5,8]);g.strokeRect(40,150,280,230);g.setLineDash([]);flower(70,water[0]);flower(290,water[1]);cat();path(roof,'#795e74',8);path(stroke,'#ac8294',5);for(const p of [roof[0],roof.at(-1)].filter(Boolean)){g.fillStyle='#f4cf80';g.beginPath();g.arc(p.x,p.y,7,0,Math.PI*2);g.fill()}g.strokeStyle='#4b98b6';g.lineWidth=3;for(const d of drops){g.beginPath();g.moveTo(d.x,d.y-5);g.lineTo(d.x,d.y+2);g.stroke()}for(const p of pops)text(p.text,p.x,p.y-(.6-p.life)*30,20);text(t<6?T.hint:T.draw,180,612,16);if(state==='clear'||state==='fail'){g.fillStyle='#e8f1edee';g.fillRect(25,230,310,210);text(state==='clear'?T.clear:T.fail,180,295,26);text(T.water+' '+water[0]+'/6 · '+water[1]+'/6',180,345,21);text(T.retry,180,405,20)}g.restore()}let prev;function frame(now){const dt=Math.min(.05,Math.max(0,(now-(prev??now))/1000));prev=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
