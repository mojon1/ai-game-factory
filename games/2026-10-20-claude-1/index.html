<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>おはじき</title>
<style>
html, body, canvas, * { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #3d4a2e; }
canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
for (const t of ['contextmenu', 'selectstart', 'gesturestart']) addEventListener(t, (e) => e.preventDefault(), { passive: false });
const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };
const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const T = {
  ja: {
    title: 'おはじき',
    how1: '2つの石のあいだに、指で線を引く',
    how2: '片方を引っぱってはじき、もう片方に当てる',
    how3: 'ほかの石に当てる・ちゃぶ台から落ちるとミス',
    tap: 'タップでスタート',
    score: '点', round: (n) => `第${n}局`, best: 'ベスト',
    hintLine: '2つの石のあいだに、指で線を引こう',
    hintAim: '光った石を引っぱって、はなすと はじく',
    pickPair: '線を引いた2つの、どちらかをはじこう',
    needLine: '先に、2つの石のあいだに線を引こう',
    touched: '石にさわっちゃった',
    noPair: '石と石のあいだを通そう',
    take: 'とった！', miss: 'はずれ', other: 'ほかの石に当たった', fell: '落ちた！', bothFell: '落ちたけど、とった',
    reshuffle: 'ジャラッと まき直し',
    clear: (n) => `第${n}局 おわり`, nofoul: 'ノーミス', last: 'のこり1つも もらえる',
    cont: 'タップで次へ', over: 'おしまい', again: 'タップでもう一度', newBest: 'ベスト更新！',
    taken: (n) => `とった石 ${n}こ`,
    combo: (n) => `${n}連続`,
  },
  en: {
    title: 'Ohajiki',
    how1: 'Draw a line between two glass chips',
    how2: 'Pull one back and flick it into the other',
    how3: 'Touching another chip or falling off is a miss',
    tap: 'Tap to start',
    score: 'pts', round: (n) => `Round ${n}`, best: 'Best',
    hintLine: 'Draw a line between two chips',
    hintAim: 'Pull a glowing chip and let go to flick',
    pickPair: 'Flick one of the two you split',
    needLine: 'First draw a line between two chips',
    touched: 'Your finger touched a chip',
    noPair: 'Pass between two chips',
    take: 'Got it!', miss: 'Missed', other: 'Hit another chip', fell: 'Fell off!', bothFell: 'Fell, but you got it',
    reshuffle: 'Scattering again',
    clear: (n) => `Round ${n} done`, nofoul: 'No misses', last: 'You keep the last one too',
    cont: 'Tap to continue', over: 'Game over', again: 'Tap to play again', newBest: 'New best!',
    taken: (n) => `${n} chips taken`,
    combo: (n) => `${n} in a row`,
  },
}[LANG === 'ja' ? 'ja' : 'en'];
const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 360, H = 640, DPR = 1, CX = 180, CY = 340, S = 330;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, cv.clientWidth || innerWidth || 360);
  H = Math.max(1, cv.clientHeight || innerHeight || 640);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const top = 64, bottom = 64;
  const R = Math.max(40, Math.min(W / 2 - 12, (H - top - bottom) / 2));
  S = R * 2; CX = W / 2; CY = top + (H - top - bottom) / 2;
}
addEventListener('resize', resize);
resize();
const px = (x) => CX + x * S, py = (y) => CY + y * S;
const ux = (x) => (x - CX) / S, uy = (y) => (y - CY) / S;

// ---------- sound ----------
let AC = null, master = null;
function audioInit() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    }
    if (AC.state !== 'running') AC.resume();
  } catch (e) { AC = null; }
}
let lastClink = 0;
function clink(v) {
  if (!AC) return;
  const now = AC.currentTime;
  if (now - lastClink < 0.025) return;
  lastClink = now;
  const vol = Math.min(1, v) * 0.35 + 0.04;
  const base = 2300 + Math.random() * 500;
  for (const [m, g, d] of [[1, 1, 0.12], [1.53, 0.6, 0.09], [2.27, 0.4, 0.06], [3.1, 0.2, 0.04]]) {
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = 'sine'; o.frequency.value = base * m;
    gn.gain.setValueAtTime(0, now);
    gn.gain.linearRampToValueAtTime(vol * g, now + 0.002);
    gn.gain.exponentialRampToValueAtTime(0.0001, now + d + v * 0.05);
    o.connect(gn); gn.connect(master); o.start(now); o.stop(now + d + 0.1);
  }
}
function tone(f, t0, dur, vol, type = 'triangle', f2) {
  if (!AC) return;
  const now = AC.currentTime + t0;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, now);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, now + dur);
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(vol, now + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o.connect(g); g.connect(master); o.start(now); o.stop(now + dur + 0.05);
}
const PENTA = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760];
function sTake(streak) { const i = Math.min(PENTA.length - 2, streak - 1); tone(PENTA[i], 0, 0.25, 0.18); tone(PENTA[i + 1] * 1.5, 0.08, 0.35, 0.12); }
function sFoul() { tone(180, 0, 0.28, 0.18, 'sine', 110); }
function sFall() { tone(500, 0, 0.35, 0.12, 'sine', 120); }
function sLine() { tone(1200, 0, 0.12, 0.05, 'sine', 1600); }
function sFlick() { tone(900, 0, 0.05, 0.12, 'square', 300); }
function sClear() { [0, 2, 4, 5, 7].forEach((k, i) => tone(PENTA[k], i * 0.09, 0.4, 0.12)); }
function sScatter(n) { for (let i = 0; i < n; i++) setTimeout(() => clink(0.3 + Math.random() * 0.5), 30 + Math.random() * 380); }

// ---------- game state ----------
const PR = 0.045;          // chip radius (table diameter = 1)
const TABLE_R = 0.5;
const DECEL = 0.85, LIN = 0.55, E = 0.9;
const COLORS = [[96, 200, 230], [240, 130, 170], [250, 210, 90], [130, 210, 140], [180, 140, 230], [110, 150, 240], [250, 160, 100]];
let state = 'title', stateT = 0;
let chips = [], falling = [], flyers = [], sparks = [], popups = [];
let pair = null, shooter = -1, shooterHits = null;
let score = 0, best = 0, round = 1, lives = 3, streak = 0, taken = 0, roundFouls = 0;
let stroke = null, aim = null, activeId = null;
let hint = '', hintT = 0, shownLine = false, shownAim = false;
let msg = '', msgT = 0, msgColor = '#fff', shake = 0;
let roundInfo = [];
let newBest = false;
let uid = 0;

addEventListener('message', (e) => { if (e.data && e.data.agf === 'loaded' && e.data.data && typeof e.data.data.best === 'number') best = Math.max(best, e.data.data.best); });
try { parent.postMessage({ agf: 'load' }, '*'); } catch (e) {}

function mkChip(x, y) {
  const c = COLORS[(Math.random() * COLORS.length) | 0];
  return { id: uid++, x, y, vx: 0, vy: 0, col: c, rot: Math.random() * 6.28, petals: 5 + ((Math.random() * 2) | 0) };
}
function scatter(n) {
  chips = [];
  const spread = Math.max(0.06, 0.13 - round * 0.008);
  let tries = 0;
  while (chips.length < n && tries < 2000) {
    tries++;
    const a = Math.random() * 6.28, d = Math.sqrt(Math.random()) * spread;
    const x = Math.cos(a) * d, y = Math.sin(a) * d;
    if (chips.every((c) => Math.hypot(c.x - x, c.y - y) > PR * 2.05)) chips.push(mkChip(x, y));
  }
  const pow = Math.max(0.35, 0.75 - round * 0.04);
  for (const c of chips) {
    const a = Math.atan2(c.y, c.x) + (Math.random() - 0.5) * 1.2;
    const sp = pow * (0.4 + Math.random() * 0.8);
    c.vx = Math.cos(a) * sp; c.vy = Math.sin(a) * sp;
  }
  sScatter(Math.min(8, n));
  state = 'scatter';
}
function startGame() {
  score = 0; round = 1; lives = 3; streak = 0; taken = 0; newBest = false;
  falling = []; flyers = []; popups = []; sparks = [];
  signal('start');
  startRound();
}
function startRound() {
  roundFouls = 0; pair = null;
  scatter(Math.min(13, 5 + round));
}
function setMsg(t, col = '#fff') { msg = t; msgT = 1.6; msgColor = col; }
function setHint(t) { hint = t; hintT = 4.5; }

// ---------- physics ----------
function step(dt, walls) {
  for (const c of chips) {
    const sp = Math.hypot(c.vx, c.vy);
    if (sp > 0) {
      const ns = Math.max(0, sp - (DECEL + LIN * sp) * dt);
      if (ns < 0.004) { c.vx = 0; c.vy = 0; } else { c.vx *= ns / sp; c.vy *= ns / sp; }
      c.x += c.vx * dt; c.y += c.vy * dt;
      c.rot += sp * dt * 3;
    }
    if (walls) {
      const d = Math.hypot(c.x, c.y), lim = TABLE_R - PR * 1.6;
      if (d > lim) {
        const nx = c.x / d, ny = c.y / d;
        c.x = nx * lim; c.y = ny * lim;
        const vn = c.vx * nx + c.vy * ny;
        if (vn > 0) { c.vx -= 1.6 * vn * nx; c.vy -= 1.6 * vn * ny; }
      }
    }
  }
  for (let i = 0; i < chips.length; i++) for (let j = i + 1; j < chips.length; j++) {
    const a = chips[i], b = chips[j];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d >= PR * 2 || d === 0) continue;
    const nx = dx / d, ny = dy / d, ov = PR * 2 - d;
    a.x -= nx * ov / 2; a.y -= ny * ov / 2; b.x += nx * ov / 2; b.y += ny * ov / 2;
    const vn = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
    if (vn > 0) {
      const jj = (1 + E) * vn / 2;
      a.vx -= jj * nx; a.vy -= jj * ny; b.vx += jj * nx; b.vy += jj * ny;
      if (vn > 0.03) {
        clink(vn * 0.8);
        if (vn > 0.15) sparks.push({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, t: 0, s: Math.min(1, vn) });
      }
      if (state === 'moving' && shooterHits) {
        if (a.id === shooter) shooterHits.add(b.id);
        if (b.id === shooter) shooterHits.add(a.id);
      }
    }
  }
  if (!walls) {
    for (let i = chips.length - 1; i >= 0; i--) {
      const c = chips[i];
      if (Math.hypot(c.x, c.y) > TABLE_R) {
        falling.push({ c, t: 0 });
        chips.splice(i, 1);
        sFall();
      }
    }
  }
}
const allStill = () => chips.every((c) => c.vx === 0 && c.vy === 0);

// ---------- line declare ----------
function segX(a, b, c, d) {
  const r = (b.x - a.x) * (d.y - c.y) - (b.y - a.y) * (d.x - c.x);
  if (Math.abs(r) < 1e-9) return false;
  const t = ((c.x - a.x) * (d.y - c.y) - (c.y - a.y) * (d.x - c.x)) / r;
  const u = ((c.x - a.x) * (b.y - a.y) - (c.y - a.y) * (b.x - a.x)) / r;
  return t >= 0 && t <= 1 && u >= 0 && u <= 1;
}
function distSeg(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l = dx * dx + dy * dy;
  let t = l ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / l : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - a.x - dx * t, p.y - a.y - dy * t);
}
function evalStroke(pts) {
  if (pts.length < 2) return;
  let len = 0;
  for (let k = 1; k < pts.length; k++) len += Math.hypot(pts[k].x - pts[k - 1].x, pts[k].y - pts[k - 1].y);
  if (len < 0.03) return;
  for (const c of chips) for (let k = 1; k < pts.length; k++) {
    if (distSeg(c, pts[k - 1], pts[k]) < PR * 1.1) { setMsg(T.touched, '#ffb0a0'); sFoul(); pair = null; return; }
  }
  let bestP = null, bd = 9;
  for (let i = 0; i < chips.length; i++) for (let j = i + 1; j < chips.length; j++) {
    const a = chips[i], b = chips[j];
    for (let k = 1; k < pts.length; k++) {
      if (segX(pts[k - 1], pts[k], a, b)) {
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < bd) { bd = d; bestP = [a.id, b.id]; }
        break;
      }
    }
  }
  if (!bestP) { setMsg(T.noPair); return; }
  pair = bestP; sLine();
  if (!shownAim) { shownAim = true; setHint(T.hintAim); }
}
const byId = (id) => chips.find((c) => c.id === id);
function canSplitAny() {
  for (let i = 0; i < chips.length; i++) for (let j = i + 1; j < chips.length; j++) {
    if (Math.hypot(chips[i].x - chips[j].x, chips[i].y - chips[j].y) > PR * 2.6) return true;
  }
  return false;
}

// ---------- shot ----------
const MAXL = 0.3;
function fire(c, dx, dy) {
  const L = Math.hypot(dx, dy);
  const p = Math.min(1, L / MAXL);
  const v = 0.08 + 1.55 * p;
  c.vx = dx / L * v; c.vy = dy / L * v;
  shooter = c.id; shooterHits = new Set();
  state = 'moving'; stateT = 0;
  sFlick();
}
function resolve() {
  const target = pair[0] === shooter ? pair[1] : pair[0];
  const sc = byId(shooter);
  const tc = byId(target);
  const hitT = shooterHits.has(target);
  const hitO = [...shooterHits].some((id) => id !== target);
  if (hitT && !hitO && sc) {
    streak++; taken++;
    const pts = 10 * streak;
    score += pts;
    if (tc) {
      chips.splice(chips.indexOf(tc), 1);
      flyers.push({ c: tc, x: tc.x, y: tc.y, t: 0 });
      setMsg(T.take, '#fff6c0');
    } else setMsg(T.bothFell, '#fff6c0');
    popups.push({ x: tc ? tc.x : sc.x, y: tc ? tc.y : sc.y, t: 0, text: `+${pts}` + (streak > 1 ? `  ${T.combo(streak)}` : '') });
    sTake(streak);
  } else {
    lives--; streak = 0; roundFouls++;
    setMsg(!sc ? T.fell : hitO ? T.other : T.miss, '#ffb0a0');
    shake = 0.35; sFoul();
  }
  pair = null; shooter = -1; shooterHits = null;
  if (lives <= 0) return gameOver();
  if (chips.length <= 1) return roundClear();
  if (!canSplitAny()) {
    setMsg(T.reshuffle);
    const pow = 0.5;
    for (const c of chips) { const a = Math.random() * 6.28; c.vx = Math.cos(a) * pow; c.vy = Math.sin(a) * pow; }
    sScatter(4);
    state = 'scatter'; return;
  }
  state = 'ready';
}
function roundClear() {
  roundInfo = [];
  if (chips.length === 1) {
    const c = chips.pop(); flyers.push({ c, x: c.x, y: c.y, t: 0 });
    score += 10; taken++; roundInfo.push(`${T.last}  +10`);
  }
  if (roundFouls === 0) { score += 50; roundInfo.push(`${T.nofoul}  +50`); }
  sClear();
  state = 'roundEnd'; stateT = 0;
}
function gameOver() {
  newBest = score > best;
  if (newBest) { best = score; try { parent.postMessage({ agf: 'save', data: { best } }, '*'); } catch (e) {} }
  signal('end', { score });
  state = 'over'; stateT = 0;
}

// ---------- input ----------
function pt(e) { const r = cv.getBoundingClientRect(); return { x: ux(e.clientX - r.left), y: uy(e.clientY - r.top), sx: e.clientX - r.left, sy: e.clientY - r.top }; }
function nearest(p, list) {
  let bc = null, bd = 9;
  for (const c of list) { const d = Math.hypot(c.x - p.x, c.y - p.y); if (d < bd) { bd = d; bc = c; } }
  return [bc, bd];
}
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  audioInit();
  if (activeId !== null) return;
  const p = pt(e);
  if (state === 'title') { state = 'pending'; startGame(); return; }
  if (state === 'roundEnd' && stateT > 0.7) { round++; startRound(); return; }
  if (state === 'over' && stateT > 0.7) { startGame(); return; }
  if (state !== 'ready') return;
  activeId = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  const grab = Math.max(PR * 1.6, 24 / S);
  if (pair) {
    const [c, d] = nearest(p, pair.map(byId).filter(Boolean));
    if (c && d < grab) { aim = { c, x: p.x, y: p.y }; return; }
  }
  const [c2, d2] = nearest(p, chips);
  if (c2 && d2 < PR * 1.05) { setMsg(pair ? T.pickPair : T.needLine); activeId = null; return; }
  stroke = [p];
});
cv.addEventListener('pointermove', (e) => {
  if (e.pointerId !== activeId) return;
  const p = pt(e);
  if (aim) { aim.x = p.x; aim.y = p.y; }
  else if (stroke) { const l = stroke[stroke.length - 1]; if (Math.hypot(p.x - l.x, p.y - l.y) > 0.004) stroke.push(p); }
});
function up(e, cancel) {
  if (e.pointerId !== activeId) return;
  activeId = null;
  if (aim) {
    const dx = aim.x - aim.c.x, dy = aim.y - aim.c.y;
    if (!cancel && state === 'ready' && Math.hypot(dx, dy) > PR * 1.2 && chips.includes(aim.c)) fire(aim.c, dx, dy);
    aim = null;
  } else if (stroke) {
    const p = pt(e); stroke.push(p);
    if (!cancel) evalStroke(stroke);
    fade = { pts: stroke, t: 0 };
    stroke = null;
  }
}
let fade = null;
cv.addEventListener('pointerup', (e) => up(e, false));
cv.addEventListener('pointercancel', (e) => up(e, true));

// ---------- drawing ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function fitText(t, x, y, size, maxW, weight = '600') {
  let s = size;
  ctx.font = `${weight} ${s}px ${FONT}`;
  while (ctx.measureText(t).width > maxW && s > 12) { s -= 1; ctx.font = `${weight} ${s}px ${FONT}`; }
  ctx.fillText(t, x, y);
}
let grainSeed = [];
for (let i = 0; i < 26; i++) grainSeed.push([Math.random(), Math.random() * 0.6 + 0.2, Math.random() * 6.28]);
function drawFloor() {
  ctx.fillStyle = '#5b6a3f'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 1;
  for (let y = 0; y < H; y += 6) { ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke(); }
  ctx.fillStyle = 'rgba(30,40,20,0.5)'; ctx.fillRect(0, H * 0.5 - 2, W, 4);
}
function drawTable() {
  const R = S / 2;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(CX + 6, CY + 12, R + 4, R + 4, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#5a3418';
  ctx.beginPath(); ctx.arc(CX, CY + 5, R + 2, 0, 6.28); ctx.fill();
  const g = ctx.createRadialGradient(CX - R * 0.3, CY - R * 0.35, R * 0.1, CX, CY, R);
  g.addColorStop(0, '#c98b52'); g.addColorStop(1, '#94582b');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, 6.28); ctx.fill();
  ctx.clip();
  ctx.strokeStyle = 'rgba(80,40,10,0.18)'; ctx.lineWidth = 1.2;
  for (const [o, a, ph] of grainSeed) {
    ctx.beginPath();
    const y0 = CY - R + o * 2 * R;
    for (let x = -R; x <= R; x += 8) { const y = y0 + Math.sin(x / R * 3 + ph) * a * 10; if (x === -R) ctx.moveTo(CX + x, y); else ctx.lineTo(CX + x, y); }
    ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,220,170,0.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(CX, CY, R - 1, 3.6, 5.6); ctx.stroke();
}
function drawChip(c, x, y, s = 1, alpha = 1, glow = false) {
  const r = PR * S * s;
  const [R, G, B] = c.col;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(40,20,5,0.35)';
  ctx.beginPath(); ctx.ellipse(x + r * 0.18, y + r * 0.28, r, r * 0.95, 0, 0, 6.28); ctx.fill();
  if (glow) {
    ctx.fillStyle = 'rgba(255,250,200,0.45)';
    ctx.beginPath(); ctx.arc(x, y, r * 1.45, 0, 6.28); ctx.fill();
  }
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, `rgba(${Math.min(255, R + 90)},${Math.min(255, G + 90)},${Math.min(255, B + 90)},0.95)`);
  g.addColorStop(0.7, `rgba(${R},${G},${B},0.85)`);
  g.addColorStop(1, `rgba(${R * 0.6 | 0},${G * 0.6 | 0},${B * 0.6 | 0},0.95)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.fill();
  ctx.strokeStyle = `rgba(255,255,255,0.35)`; ctx.lineWidth = Math.max(1, r * 0.08);
  ctx.save(); ctx.translate(x, y); ctx.rotate(c.rot);
  for (let k = 0; k < c.petals; k++) {
    ctx.rotate(6.283 / c.petals);
    ctx.beginPath(); ctx.ellipse(0, -r * 0.38, r * 0.16, r * 0.3, 0, 0, 6.28); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath(); ctx.ellipse(x - r * 0.38, y - r * 0.42, r * 0.28, r * 0.14, -0.6, 0, 6.28); ctx.fill();
  ctx.restore();
}
function drawHUD() {
  ctx.fillStyle = 'rgba(20,25,12,0.55)'; ctx.fillRect(0, 0, W, 56);
  ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  ctx.textAlign = 'left'; fitText(`${score} ${T.score}`, 14, 22, 22, W * 0.33, '700');
  ctx.font = `500 14px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,0.8)';
  fitText(T.taken(taken), 14, 44, 14, W * 0.33, '500');
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  fitText(T.round(round), W / 2, 22, 18, W * 0.28, '700');
  if (streak > 1) { ctx.fillStyle = '#ffe28a'; fitText(T.combo(streak), W / 2, 44, 14, W * 0.28, '600'); }
  ctx.textAlign = 'right';
  for (let i = 0; i < 3; i++) {
    const x = W - 20 - i * 24, y = 20;
    ctx.fillStyle = i < lives ? '#7fd6ef' : 'rgba(255,255,255,0.2)';
    ctx.beginPath(); ctx.arc(x, y, 8, 0, 6.28); ctx.fill();
    if (i < lives) { ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(x - 3, y - 3, 2.5, 0, 6.28); ctx.fill(); }
  }
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  fitText(`${T.best} ${best}`, W - 12, 44, 14, W * 0.33, '500');
}
function overlay(lines, sub) {
  ctx.fillStyle = 'rgba(15,18,8,0.62)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let y = H * 0.36;
  for (const [t, size, col] of lines) { ctx.fillStyle = col || '#fff'; fitText(t, W / 2, y, size, W - 32, '700'); y += size * 1.5; }
  if (sub && stateT > 0.7) { ctx.fillStyle = `rgba(255,255,255,${0.6 + 0.4 * Math.sin(stateT * 4)})`; fitText(sub, W / 2, H * 0.78, 18, W - 32, '600'); }
}

let titleChips = [];
for (let i = 0; i < 7; i++) { const a = i / 7 * 6.28; titleChips.push(mkChip(Math.cos(a) * 0.22, Math.sin(a) * 0.22 + 0.05)); }

let last = 0, time = 0;
function frame(ts) {
  const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016);
  last = ts; time += dt; stateT += dt;
  if (msgT > 0) msgT -= dt;
  if (hintT > 0) hintT -= dt;
  if (shake > 0) shake -= dt;

  if (state === 'scatter' || state === 'moving') {
    const n = 6;
    for (let k = 0; k < n; k++) step(dt / n, state === 'scatter');
    if (allStill() && falling.every((f) => f.t > 0.5)) {
      if (state === 'scatter') {
        state = 'ready';
        if (!shownLine) { shownLine = true; setHint(T.hintLine); }
        if (!canSplitAny()) { for (const c of chips) { const a = Math.random() * 6.28; c.vx = Math.cos(a) * 0.5; c.vy = Math.sin(a) * 0.5; } state = 'scatter'; }
      } else resolve();
    }
  }
  for (const f of falling) f.t += dt;
  falling = falling.filter((f) => f.t < 0.8);
  for (const f of flyers) f.t += dt;
  flyers = flyers.filter((f) => f.t < 0.7);
  for (const s of sparks) s.t += dt;
  sparks = sparks.filter((s) => s.t < 0.3);
  for (const p of popups) p.t += dt;
  popups = popups.filter((p) => p.t < 1.2);
  if (fade) { fade.t += dt; if (fade.t > 0.6) fade = null; }

  // draw
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sh = shake > 0 ? (Math.random() - 0.5) * shake * 16 : 0;
  ctx.save(); ctx.translate(sh, 0);
  drawFloor(); drawTable();
  for (const f of falling) {
    const k = f.t / 0.8;
    drawChip(f.c, px(f.c.x * (1 + k * 0.15)), py(f.c.y * (1 + k * 0.15)) + k * k * 40, 1 - k * 0.4, 1 - k);
  }
  if (state === 'title') {
    for (const c of titleChips) { c.rot += dt * 0.3; drawChip(c, px(c.x), py(c.y)); }
  } else {
    if (pair) {
      const a = byId(pair[0]), b = byId(pair[1]);
      if (a && b) {
        ctx.save(); ctx.setLineDash([4, 6]); ctx.strokeStyle = 'rgba(255,250,200,0.7)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(px(a.x), py(a.y)); ctx.lineTo(px(b.x), py(b.y)); ctx.stroke(); ctx.restore();
      }
    }
    for (const c of chips) {
      const g = pair && pair.includes(c.id) && state === 'ready';
      drawChip(c, px(c.x), py(c.y), 1, 1, g && (Math.sin(time * 6) > -0.3));
    }
  }
  for (const s of sparks) {
    const k = s.t / 0.3;
    ctx.strokeStyle = `rgba(255,255,230,${(1 - k) * 0.9})`; ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * 6.28, r0 = 4 + k * 14 * s.s, r1 = r0 + 5;
      ctx.beginPath(); ctx.moveTo(px(s.x) + Math.cos(a) * r0, py(s.y) + Math.sin(a) * r0); ctx.lineTo(px(s.x) + Math.cos(a) * r1, py(s.y) + Math.sin(a) * r1); ctx.stroke();
    }
  }
  // stroke
  const drawStroke = (pts, a) => {
    if (!pts || pts.length < 2) return;
    ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(px(pts[0].x), py(pts[0].y));
    for (const p of pts) ctx.lineTo(px(p.x), py(p.y));
    ctx.stroke();
  };
  if (stroke) drawStroke(stroke, 0.75);
  if (fade) drawStroke(fade.pts, 0.75 * (1 - fade.t / 0.6));
  // aim
  if (aim) {
    const c = aim.c, dx = aim.x - c.x, dy = aim.y - c.y, L = Math.hypot(dx, dy);
    if (L > 0.001) {
      const p = Math.min(1, L / MAXL), nx = dx / L, ny = dy / L;
      const len = PR * 1.4 + p * 0.22;
      const x0 = px(c.x + nx * PR * 1.3), y0 = py(c.y + ny * PR * 1.3), x1 = px(c.x + nx * len), y1 = py(c.y + ny * len);
      const col = p < 0.5 ? `rgb(${120 + p * 260 | 0},230,140)` : `rgb(255,${300 - p * 200 | 0},90)`;
      ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      const ha = Math.atan2(ny, nx);
      ctx.fillStyle = col; ctx.beginPath();
      ctx.moveTo(x1 + Math.cos(ha) * 10, y1 + Math.sin(ha) * 10);
      ctx.lineTo(x1 + Math.cos(ha + 2.4) * 10, y1 + Math.sin(ha + 2.4) * 10);
      ctx.lineTo(x1 + Math.cos(ha - 2.4) * 10, y1 + Math.sin(ha - 2.4) * 10); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(px(c.x), py(c.y), PR * S * 1.3, -1.57, -1.57 + p * 6.28); ctx.stroke();
    }
  }
  for (const f of flyers) {
    const k = f.t / 0.7, e = k * k;
    const x = px(f.x) + (30 - px(f.x)) * e, y = py(f.y) + (44 - py(f.y)) * e - Math.sin(k * 3.14) * 50;
    drawChip(f.c, x, y, 1 - k * 0.5, 1 - k * 0.3);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of popups) {
    const k = p.t / 1.2;
    ctx.fillStyle = `rgba(255,240,150,${1 - k})`;
    fitText(p.text, Math.min(W - 60, Math.max(60, px(p.x))), py(p.y) - 30 - k * 30, 18, W * 0.5, '700');
  }
  ctx.restore();

  if (state === 'title') {
    ctx.fillStyle = 'rgba(15,18,8,0.45)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
    fitText(T.title, W / 2, H * 0.2, 48, W - 32, '800');
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    fitText(T.how1, W / 2, H * 0.68, 16, W - 28, '600');
    fitText(T.how2, W / 2, H * 0.68 + 26, 16, W - 28, '600');
    ctx.fillStyle = 'rgba(255,210,190,0.95)';
    fitText(T.how3, W / 2, H * 0.68 + 52, 14, W - 28, '500');
    ctx.fillStyle = `rgba(255,255,255,${0.6 + 0.4 * Math.sin(time * 4)})`;
    fitText(T.tap, W / 2, H * 0.88, 20, W - 32, '700');
  } else {
    drawHUD();
    if (msgT > 0) {
      ctx.globalAlpha = Math.min(1, msgT * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(W / 2 - Math.min(150, W / 2 - 12), 66, Math.min(300, W - 24), 34, 17); ctx.fill();
      ctx.fillStyle = msgColor; ctx.textAlign = 'center'; fitText(msg, W / 2, 83, 17, Math.min(280, W - 40), '700');
      ctx.globalAlpha = 1;
    }
    if (hintT > 0 && state === 'ready') {
      ctx.globalAlpha = Math.min(1, hintT);
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(12, H - 50, W - 24, 36, 18); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; fitText(hint, W / 2, H - 32, 15, W - 40, '600');
      ctx.globalAlpha = 1;
    }
    if (state === 'roundEnd') overlay([[T.clear(round), 30], ...roundInfo.map((t) => [t, 18, '#ffe28a']), [`${score} ${T.score}`, 26]], T.cont);
    if (state === 'over') overlay([[T.over, 32], [`${score} ${T.score}`, 40], [newBest ? T.newBest : `${T.best} ${best}`, 18, newBest ? '#ffe28a' : '#ddd'], [T.taken(taken), 16, '#ddd']], T.again);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
