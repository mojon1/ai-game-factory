<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;overscroll-behavior:none;width:100%;height:100%;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:#233c43;color:#f7f1df}main{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(#517c81,#294b52 48%,#1c343e)}header{position:absolute;top:3%;left:6%;right:6%;display:flex;justify-content:space-between;font-size:16px;font-weight:700}#info{position:absolute;top:10%;text-align:center;width:100%;font-size:15px;color:#fff1c4}#seats{position:absolute;top:17%;left:5%;right:5%;height:14%;display:flex;gap:6px;padding-bottom:8px;border-bottom:8px solid #b99268}button{font:inherit;min-width:44px;min-height:44px;color:#243a42;border:2px solid #e2d6ae;border-radius:12px;background:#f1e8cb}.seat{position:relative;flex:1;padding:3px;font-size:15px;background:#e6dabb}.seat span,.animal span{display:block;font-size:27px}.seat small{position:absolute;top:-21px;left:0;right:0;color:#e6e8dd;font-size:13px}#clues{position:absolute;top:36%;left:6%;right:6%;font-size:15px;line-height:1.45}#clues div{padding:7px 10px;margin:0 0 6px;background:#17343dc9;border-radius:9px;border-left:3px solid #ead6a0;min-height:32px}#clues div.good{border-color:#91e0bf;background:#244b49}#check:disabled{opacity:.45}#clues div.bad{border-color:#ff8c85;background:#5b3440}#animals{position:absolute;top:73%;left:5%;right:5%;display:flex;gap:6px;height:10%}.animal{flex:1;padding:2px;font-size:13px}.animal.on{outline:4px solid #8de4c6;transform:translateY(-5px)}.animal.used{background:#a5b9ad}#check{position:absolute;top:85%;left:25%;width:50%;height:46px;background:#e7c879;font-weight:700}#hint{position:absolute;bottom:2%;text-align:center;width:100%;font-size:13px}#cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#1e3540f2;text-align:center;padding:22px}#cover.hidden{display:none}#cover.result{align-items:flex-end;padding:0;background:transparent}#cover.result>div{width:100%;padding:20px 15px;background:#1e3540f5}#cover.result h1{font-size:24px;margin:0}#cover.result p{font-size:14px;margin:8px 0;line-height:1.4}#cover.result b{font-size:17px;margin-top:10px}#undo{position:absolute;top:1%;left:42%;width:16%;height:44px;min-width:50px;background:#c5d1b9;font-size:13px}#undo:disabled{opacity:.35}h1{font-size:30px;line-height:1.3;margin:0 0 22px}p{white-space:pre-line;font-size:16px;line-height:1.8}b{display:block;color:#9ce4ca;font-size:18px;margin-top:26px}
</style></head><body><main><header><span id="case"></span><span id="count"></span></header><button id="undo"></button><div id="info"></div><div id="seats"></div><div id="clues"></div><div id="animals"></div><button id="check"></button><div id="hint"></div><div id="cover"></div></main><script>
const LANG=new URLSearchParams(location.search).get('lang')||(/^ja/i.test(navigator.language)?'ja':'en'),T=({ja:{title:'窓辺の席のなぞ',intro:'動物を選び、座る席をタップ。\nすべての手がかりを、満たそう。\n後半は五席。ゆっくり考えて。',start:'タップでスタート',again:'タップでもう一度',next:'タップで次へ',case:'なぞ',placed:'着席',choose:'動物 → 席 の順にタップ',selected:'を座らせる席は？',undo:'戻す',check:'確かめる',missing:'全員を座らせてから確かめよう',wrong:'赤い手がかりを見直そう',clear:'ぴったりの席！',all:'六つのなぞを解いた',body:'手がかりが、ひとつの並びになった。',hint:'同じ席なら外せる。別の席なら入れ替え。',names:['ネコ','イヌ','トリ','ウサギ','キツネ'],rels:['は{b}より左','は{b}のとなり','は{b}のすぐ左','は左右どちらかの端','は端ではない','は{b}のとなりではない','は一番左']},en:{title:'Window-Seat Riddles',intro:'Choose an animal, then tap its seat.\nSatisfy every clue below the window.\nLater, five guests join the puzzle.',start:'Tap to start',again:'Tap to play again',next:'Tap to continue',case:'Riddle',placed:'Seated',choose:'Tap an animal, then a seat',selected:': choose a seat',undo:'Undo',check:'Check seats',missing:'Seat everyone before checking',wrong:'Revisit the clues marked red',clear:'Everyone has a seat!',all:'Six riddles solved',body:'Every clue fits one arrangement.',hint:'Tap its own seat to remove; another seat to swap.',names:['Cat','Dog','Bird','Rabbit','Fox'],rels:[' is left of {b}',' is next to {b}',' is just left of {b}',' sits at either end',' is not at an end',' is not next to {b}',' sits farthest left']}})[LANG==='ja'?'ja':'en'];
const icons=['🐱','🐶','🐦','🐰','🦊'],cases=[{"n":4,"clues":[[6,0,0],[2,1,2],[0,2,3]]},{"n":4,"clues":[[2,0,1],[5,2,3],[5,0,2]]},{"n":5,"clues":[[2,0,4],[1,0,2],[4,3,0],[4,4,0]]},{"n":5,"clues":[[3,1,0],[3,4,0],[5,0,3],[5,0,1],[0,0,4]]},{"n":5,"clues":[[3,3,0],[3,4,0],[5,0,1],[5,0,3],[0,0,1]]},{"n":5,"clues":[[1,0,1],[1,0,4],[1,1,3],[1,2,4],[0,0,2]]}],el=id=>document.getElementById(id),signal=(type,data={})=>{try{parent.postMessage({agf:type,...data},'*')}catch{}};
for(const t of ['contextmenu','selectstart','gesturestart'])addEventListener(t,e=>e.preventDefault(),{passive:false});
let history=[],stage=0,board=[],selected=0,phase='title',guard=0,bad=[],message='',ac,started=0;
function sound(f){try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(.04,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.15);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.16)}catch{}}
function fits(c){const [t,a,b]=c,x=board.indexOf(a),y=board.indexOf(b);return t===0?x<y:t===1?Math.abs(x-y)===1:t===2?x+1===y:t===3?x===0||x===board.length-1:t===4?x>0&&x<board.length-1:t===5?Math.abs(x-y)>1:x===b}
function ready(c){return board.includes(c[1])&&([3,4,6].includes(c[0])||board.includes(c[2]))}
function clue(c){return T.names[c[1]]+T.rels[c[0]].replace('{b}',T.names[c[2]])}
function show(){el('case').textContent=T.case+' '+(stage+1)+'/6';el('count').textContent=T.placed+' '+board.filter(x=>x>=0).length+'/'+board.length;el('info').textContent=message||(selected>=0?T.names[selected]+T.selected:T.choose);el('seats').innerHTML=board.map((a,i)=>'<button class="seat" data-seat="'+i+'"><small>'+(i+1)+'</small><span>'+(a<0?'◌':icons[a])+'</span>'+(a<0?'—':T.names[a])+'</button>').join('');el('animals').innerHTML=Array.from({length:board.length},(_,a)=>'<button class="animal '+(a===selected?'on ':'')+(board.includes(a)?'used':'')+'" data-animal="'+a+'"><span>'+icons[a]+'</span>'+T.names[a]+'</button>').join('');el('clues').innerHTML=cases[stage].clues.map((c,i)=>'<div class="'+(bad.includes(i)?'bad':ready(c)&&fits(c)?'good':'')+'">'+(ready(c)&&fits(c)?'✓ ':'· ')+clue(c)+'</div>').join('');el('check').textContent=T.check;el('check').disabled=board.includes(-1);el('undo').textContent=T.undo;el('undo').disabled=!history.length}
function cover(title,body,next){el('cover').className='';el('cover').innerHTML='<div><h1>'+title+'</h1><p>'+body+'</p><b>'+next+'</b></div>'}
function start(){history=[];board=Array(cases[stage].n).fill(-1);selected=0;bad=[];message='';phase='play';started=performance.now();el('cover').className='hidden';el('hint').textContent=T.hint;show();signal('start')}
el('animals').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(phase!=='play'||!b)return;selected=+b.dataset.animal;message='';show();sound(330)});
el('seats').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(phase!=='play'||!b)return;const i=+b.dataset.seat;if(selected<0){selected=board[i];message='';show();return}history.push({board:board.slice(),selected});if(history.length>50)history.shift();const j=board.indexOf(selected);if(i===j)board[i]=-1;else{if(j>=0)board[j]=board[i];board[i]=selected;if(j<0)selected=Array.from({length:board.length},(_,a)=>a).find(a=>!board.includes(a))??-1}bad=[];message='';show();sound(440+selected*50)});
el('undo').addEventListener('pointerdown',()=>{if(phase!=='play'||!history.length)return;const p=history.pop();board=p.board;selected=p.selected;bad=[];message='';show();sound(300)});
el('check').addEventListener('pointerdown',()=>{if(phase!=='play')return;if(board.includes(-1)){message=T.missing;show();return}bad=cases[stage].clues.flatMap((c,i)=>fits(c)?[]:[i]);if(bad.length){message=T.wrong;sound(170);show()}else{phase='end';guard=performance.now()+700;cover(stage===5?T.all:T.clear,T.body,stage===5?T.again:T.next);el('cover').className='result';sound(700);signal('end')}});
el('cover').addEventListener('pointerdown',()=>{if(phase==='title'||phase==='end'&&performance.now()>=guard){if(phase==='end')stage=(stage+1)%6;sound(300);start()}});
function tick(t){if(t-started>5000)el('hint').textContent='';requestAnimationFrame(tick)}requestAnimationFrame(tick);cover(T.title,T.intro,T.start);
</script></body></html>
