<!doctype html>
<html lang="ja">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>かえってこい！ブーメラン / Come Back, Boomerang!</title>
<style>

canvas { display: block; width: 100vw; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const LANG = new URLSearchParams(location.search).get('lang') || (/^ja/i.test(navigator.language) ? 'ja' : 'en');
const DICT = {
  ja: {
    title: 'かえってこい！', title2: 'ブーメラン',
    how1: 'タップした所へブーメランを投げる',
    how2: 'ドラッグで動く。戻り道でも敵に当たる',
    how3: '戻り道は、きみの立ち位置で決まる',
    start: 'タップでスタート', hint: 'タップで投げる・ドラッグで動く',
    wave: 'ウェーブ', over: 'やられた！', best: 'ベスト', newBest: 'ベスト更新！',
    again: 'タップでもう一度', nice: 'ナイス！', great: 'すごい！', legend: '伝説！', clank: 'カン！', behind: 'うしろ！', heal: '♥ 回復',
    tips: { 2: 'カブトは前が固い。うしろから当てよう', 3: '青い玉は2つにわれる', 4: 'すばやい虫がくる', 5: '大きいのは3回当てる' },
    reached: 'ウェーブ', reached2: 'まで到達'
  },
  en: {
    title: 'Come Back,', title2: 'Boomerang!',
    how1: 'Tap anywhere to throw the boomerang there',
    how2: 'Drag to move. It hits on the way back, too',
    how3: 'Where you stand decides the way back',
    start: 'Tap to start', hint: 'Tap to throw · Drag to move',
    wave: 'WAVE', over: 'Defeated!', best: 'Best', newBest: 'New best!',
    again: 'Tap to play again', nice: 'Nice!', great: 'Great!', legend: 'Legendary!', clank: 'Clank!', behind: 'Behind!', heal: '♥ +1',
    tips: { 2: 'Beetles are armored in front. Hit from behind', 3: 'Blue blobs split in two', 4: 'Fast bugs incoming', 5: 'Big ones take 3 hits' },
    reached: 'Reached wave', reached2: ''
  }
};
const T = DICT[LANG] || DICT.en;
const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';
const signal = (type, data = {}) => { try { parent.postMessage({ agf: type, ...data }, '*'); } catch (e) {} };
for (const t of ['contextmenu', 'selectstart', 'gesturestart']) addEventListener(t, (e) => e.preventDefault(), { passive: false });

// ---------- save ----------
let best = 0, bestWave = 0;
addEventListener('message', (e) => {
  if (e.data && e.data.agf === 'loaded' && e.data.data) {
    best = Math.max(best, e.data.data.best | 0);
    bestWave = Math.max(bestWave, e.data.data.bestWave | 0);
  }
});
try { parent.postMessage({ agf: 'load' }, '*'); } catch (e) {}
const saveData = () => { try { parent.postMessage({ agf: 'save', data: { best, bestWave } }, '*'); } catch (e) {} };

// ---------- canvas ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 360, H = 640, DPR = 1, S = 1, HUD = 52;
function resize() {
  W = Math.max(1, innerWidth || 1); H = Math.max(1, innerHeight || 1);
  DPR = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(W * DPR)); cv.height = Math.max(1, Math.round(H * DPR));
  S = Math.max(0.7, Math.min(W / 360, H / 640, 1.8));
  HUD = Math.round(50 * Math.min(1.3, S));
  if (hero) clampHero();
}
addEventListener('resize', resize);

// ---------- audio ----------
let AC = null, master = null, whGain = null, whFilt = null, noiseBuf = null;
function initAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 1, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      whFilt = AC.createBiquadFilter(); whFilt.type = 'bandpass'; whFilt.frequency.value = 900; whFilt.Q.value = 1.4;
      whGain = AC.createGain(); whGain.gain.value = 0;
      src.connect(whFilt); whFilt.connect(whGain); whGain.connect(master); src.start();
    }
    if (AC.state !== 'running') AC.resume();
  } catch (e) {}
}
function tone(f, dur, type = 'sine', vol = 0.2, slide = 0, delay = 0) {
  if (!AC) return;
  try {
    const t0 = AC.currentTime + delay;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
function noise(dur, freq, vol = 0.2, q = 1) {
  if (!AC) return;
  try {
    const t0 = AC.currentTime;
    const s = AC.createBufferSource(); s.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = AC.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.02);
  } catch (e) {}
}
const SCALE = [0, 2, 4, 7, 9];
function noteFreq(i) { const oct = Math.floor(i / 5), n = SCALE[i % 5] + oct * 12; return 392 * Math.pow(2, n / 12); }
const sHit = (chain) => { const f = noteFreq(Math.min(chain - 1, 14)); tone(f, 0.22, 'triangle', 0.22); tone(f * 2, 0.12, 'sine', 0.07); noise(0.06, 2500, 0.18, 0.8); };
const sBump = () => { tone(180, 0.12, 'triangle', 0.2, 110); noise(0.05, 1200, 0.12); };
const sClank = () => { tone(1900, 0.09, 'square', 0.05); tone(2650, 0.14, 'triangle', 0.08); noise(0.05, 4000, 0.12, 3); };
const sCatch = () => { tone(660, 0.07, 'triangle', 0.12); noise(0.04, 3000, 0.15, 1.5); };
const sThrow = () => { noise(0.18, 700, 0.12, 0.7); };
const sHurt = () => { tone(140, 0.35, 'sawtooth', 0.12, 55); noise(0.2, 300, 0.25); };
const sWave = () => { tone(523, 0.18, 'triangle', 0.12); tone(784, 0.3, 'triangle', 0.12, 0, 0.12); };
const sOver = () => { tone(392, 0.25, 'triangle', 0.15, 0, 0); tone(330, 0.25, 'triangle', 0.15, 0, 0.2); tone(262, 0.5, 'triangle', 0.15, 0, 0.4); };

// ---------- state ----------
let state = 'title', stateT = 0;
let hero = null, boom = null;
let enemies = [], parts = [], pops = [];
let score = 0, wave = 0, queue = [], spawnT = 0, spawnGap = 1, banner = 0, tip = '';
let clearing = false, clearT = 0, freeze = 0, shake = 0, hintT = 0, chain = 0, isNewBest = false, gameTime = 0;
const pointers = new Map();
const tufts = [];
for (let i = 0; i < 80; i++) tufts.push({ x: Math.random(), y: Math.random(), s: 0.6 + Math.random() * 0.8, k: Math.random() });
const flowers = [];
for (let i = 0; i < 18; i++) flowers.push({ x: Math.random(), y: Math.random(), c: ['#fff6d8', '#ffd2e4', '#fff07a'][i % 3] });

function clampHero() {
  hero.x = Math.max(hero.r + 4, Math.min(W - hero.r - 4, hero.x));
  hero.y = Math.max(HUD + hero.r + 6, Math.min(H - hero.r - 6, hero.y));
}

function newGame() {
  hero = { x: W / 2, y: H * 0.78, r: 15 * S, hp: 3, inv: 0, face: -Math.PI / 2, walk: 0 };
  boom = { state: 'hand', x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, t: 0, ang: 0, trail: [], tx: 0, ty: 0 };
  enemies = []; parts = []; pops = [];
  score = 0; chain = 0; clearing = false; freeze = 0; shake = 0; hintT = 5; gameTime = 0;
  pointers.clear();
  startWave(1);
  state = 'play'; stateT = 0;
  signal('start');
}

// ---------- waves ----------
const TYPES = {
  blob:   { r: 15, hp: 1, sp: 32, col: '#7bd36a', dark: '#3f8f3a', pts: 1 },
  beetle: { r: 17, hp: 1, sp: 27, col: '#5b4a8a', dark: '#2e2350', pts: 2 },
  split:  { r: 18, hp: 1, sp: 29, col: '#62b6f0', dark: '#2a6fa8', pts: 1 },
  mini:   { r: 10, hp: 1, sp: 50, col: '#8fd0ff', dark: '#3a85c0', pts: 1 },
  dash:   { r: 11, hp: 1, sp: 62, col: '#ff9a3c', dark: '#b8571a', pts: 1 },
  big:    { r: 25, hp: 3, sp: 20, col: '#c46ad8', dark: '#7a2f8e', pts: 3 }
};
// a wave is a list of groups: { type, n, form }
const FORMS = ['row', 'col', 'vee'];
function makeWave(n) {
  const list = [];
  const cnt = 3 + Math.floor(n * 0.9);
  const size = { blob: [3, 5], beetle: [1, 2 + (n >= 6 ? 1 : 0)], split: [1, 2], dash: [2, 4], big: [1, 1] };
  const g = (type) => { const [a, b] = size[type]; return { type, n: a + ((Math.random() * (b - a + 1)) | 0), form: FORMS[(Math.random() * 3) | 0] }; };
  if (n === 1) { list.push({ type: 'blob', n: 3, form: 'row' }, { type: 'blob', n: 4, form: 'col' }, { type: 'blob', n: 4, form: 'vee' }); return list; }
  if (n === 2) list.push({ type: 'beetle', n: 1, form: 'row' }, { type: 'blob', n: 4, form: 'row' }, { type: 'beetle', n: 2, form: 'row' });
  if (n === 3) list.push({ type: 'split', n: 2, form: 'row' });
  if (n === 4) list.push({ type: 'dash', n: 3, form: 'col' });
  if (n === 5) list.push({ type: 'big', n: 1, form: 'row' });
  const pool = [['blob', 5]];
  if (n >= 2) pool.push(['beetle', n >= 4 ? 3 : 1.5]);
  if (n >= 3) pool.push(['split', 1.6]);
  if (n >= 4) pool.push(['dash', 1.8]);
  if (n >= 5) pool.push(['big', 0.9 + n * 0.08]);
  const tot = pool.reduce((a, p) => a + p[1], 0);
  while (list.length < cnt) {
    let r = Math.random() * tot;
    for (const p of pool) { r -= p[1]; if (r <= 0) { list.push(g(p[0])); break; } }
  }
  const first = n <= 5 ? list.shift() : null;
  for (let i = list.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [list[i], list[j]] = [list[j], list[i]]; }
  if (first) list.unshift(first);
  return list;
}
function spawnGroup(gr) {
  const r = TYPES[gr.type].r * S, gap = r * 2.5;
  const roll = Math.random();
  const side = wave >= 2 && roll < (wave >= 4 ? 0.45 : 0.35);
  const bottom = !side && wave >= 5 && roll < 0.6;
  if (bottom) {
    const width = (gr.n - 1) * gap;
    const cx = r + width / 2 + Math.random() * Math.max(1, W - 2 * r - width);
    for (let i = 0; i < gr.n; i++) {
      const x = gr.form === 'col' ? cx : cx - width / 2 + i * gap;
      const y = H + r + (gr.form === 'col' ? i * gap : 0);
      spawn(gr.type, x, y);
    }
    return;
  }
  if (side) {
    const left = Math.random() < 0.5;
    const x0 = left ? -r : W + r, y0 = HUD + 30 * S + Math.random() * Math.max(10, H * 0.4 - HUD);
    for (let i = 0; i < gr.n; i++) {
      const ox = gr.form === 'row' ? (left ? -1 : 1) * i * gap : 0;
      const oy = gr.form === 'col' ? i * gap : gr.form === 'vee' ? (i % 2 ? 1 : -1) * Math.ceil(i / 2) * gap : 0;
      const e = spawn(gr.type, x0 + ox, y0 + oy); e.born = -i * (gr.form === 'row' ? 0.6 : 0);
    }
    return;
  }
  const width = gr.form === 'row' ? (gr.n - 1) * gap : gr.form === 'vee' ? (gr.n - 1) * gap * 0.6 : 0;
  const cx = r + width / 2 + Math.random() * Math.max(1, W - 2 * r - width);
  for (let i = 0; i < gr.n; i++) {
    let x = cx, y = HUD - r * 0.3;
    if (gr.form === 'row') x = cx - width / 2 + i * gap;
    if (gr.form === 'col') y -= i * gap;
    if (gr.form === 'vee') { x = cx + (i % 2 ? 1 : -1) * Math.ceil(i / 2) * gap * 0.6; y -= Math.ceil(i / 2) * gap * 0.7; }
    const e = spawn(gr.type, x, y); e.born = Math.min(0, (y - HUD) / (e.sp || 1));
  }
}
function startWave(n) {
  wave = n; queue = makeWave(n);
  spawnT = 1.0; spawnGap = Math.max(0.9, 2.5 - n * 0.15);
  banner = 2.2; tip = T.tips[n] || '';
  sWave();
}
function spawn(type, x, y) {
  const d = TYPES[type];
  const mul = Math.min(1.8, 1.2 + (wave - 1) * 0.06);
  const r = d.r * S;
  if (x === undefined) {
    const side = wave >= 4 && Math.random() < 0.3;
    if (side) { x = Math.random() < 0.5 ? -r : W + r; y = HUD + Math.random() * (H * 0.45 - HUD); }
    else { x = r + Math.random() * (W - 2 * r); y = HUD - r * 0.3; }
  }
  const e = { type, x, y, r, hp: d.hp, maxHp: d.hp, sp: d.sp * S * mul, kx: 0, ky: 0, cd: 0, flash: 0, ph: Math.random() * 6, face: Math.PI / 2, born: 0 };
  if (hero) e.face = Math.atan2(hero.y - y, hero.x - x);
  enemies.push(e);
  return e;
}

// ---------- input ----------
function toLocal(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  const p = toLocal(e);
  if (state === 'title') { newGame(); return; }
  if (state === 'over') { if (stateT > 0.7) newGame(); return; }
  let mover = false;
  for (const q of pointers.values()) if (q.moved) mover = true;
  pointers.set(e.pointerId, { x0: p.x, y0: p.y, x: p.x, y: p.y, moved: false, hx: hero.x, hy: hero.y, t: 0, other: mover });
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
}, { passive: false });
cv.addEventListener('pointermove', (e) => {
  const q = pointers.get(e.pointerId); if (!q || state !== 'play') return;
  const p = toLocal(e); q.x = p.x; q.y = p.y;
  if (!q.moved && Math.hypot(p.x - q.x0, p.y - q.y0) > 11 * S) {
    // only one finger moves the hero
    let busy = false;
    for (const [id, o] of pointers) if (id !== e.pointerId && o.moved) busy = true;
    if (!busy) { q.moved = true; q.hx = hero.x - (p.x - q.x0); q.hy = hero.y - (p.y - q.y0); }
  }
  if (q.moved) {
    hero.x = q.hx + (p.x - q.x0); hero.y = q.hy + (p.y - q.y0);
    const bx = hero.x, by = hero.y; clampHero();
    // keep finger offset consistent when clamped
    q.hx += hero.x - bx; q.hy += hero.y - by;
  }
}, { passive: false });
function endPointer(e, cancel) {
  const q = pointers.get(e.pointerId); if (!q) return;
  pointers.delete(e.pointerId);
  if (cancel || state !== 'play') return;
  if (!q.moved && q.t < 0.6) throwAt(q.x, q.y);
}
cv.addEventListener('pointerup', (e) => endPointer(e, false));
cv.addEventListener('pointercancel', (e) => endPointer(e, true));

let pending = null;
function throwAt(x, y) {
  if (boom.state !== 'hand') {
    pending = { x, y, age: 0 };
    return;
  }
  pending = null;
  y = Math.max(HUD + 10, Math.min(H - 10, y)); x = Math.max(10, Math.min(W - 10, x));
  let dx = x - hero.x, dy = y - hero.y, d = Math.hypot(dx, dy);
  const minD = 70 * S;
  if (d < 1) { dx = 0; dy = -1; d = 1; }
  if (d < minD) { x = hero.x + dx / d * minD; y = hero.y + dy / d * minD; d = minD; }
  boom.state = 'out'; boom.t = 0;
  boom.sx = hero.x; boom.sy = hero.y; boom.tx = x; boom.ty = y;
  boom.x = hero.x; boom.y = hero.y; boom.px = boom.x; boom.py = boom.y;
  boom.dist = d; boom.tOut = 0.22 + d / (950 * S);
  boom.trail = [];
  chain = 0;
  hero.face = Math.atan2(dy, dx);
  sThrow();
}

// ---------- helpers ----------
function segDist(ax, ay, bx, by, px, py) {
  const vx = bx - ax, vy = by - ay, l2 = vx * vx + vy * vy;
  let t = l2 > 0 ? ((px - ax) * vx + (py - ay) * vy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + vx * t, cy = ay + vy * t;
  return { d: Math.hypot(px - cx, py - cy), cx, cy };
}
function burst(x, y, col, n, sp, size) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = sp * (0.4 + Math.random() * 0.8);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 0.35 + Math.random() * 0.35, col, size: size * (0.6 + Math.random() * 0.7) });
  }
}
function addPop(x, y, text, col, size) { pops.push({ x, y, text, t: 0, col, size }); }

// ---------- update ----------
function update(dt) {
  stateT += dt;
  for (const q of pointers.values()) q.t += dt;
  // particles always
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(0.05, dt); p.vy *= Math.pow(0.05, dt);
    if (p.t > p.life) parts.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--) { const p = pops[i]; p.t += dt; p.y -= 30 * S * dt; if (p.t > 0.9) pops.splice(i, 1); }
  shake = Math.max(0, shake - dt);
  if (state !== 'play') { if (whGain && AC) whGain.gain.setTargetAtTime(0, AC.currentTime, 0.05); return; }
  if (freeze > 0) { freeze -= dt; return; }
  gameTime += dt;
  hintT -= dt; banner -= dt;
  hero.inv = Math.max(0, hero.inv - dt);
  if (pending) pending.age += dt;

  // waves
  if (queue.length) {
    spawnT -= dt;
    if (spawnT <= 0 || (!enemies.length && spawnT > 0.4)) { spawnGroup(queue.shift()); spawnT = spawnGap * (0.75 + Math.random() * 0.5); }
  } else if (!enemies.length && !clearing) {
    clearing = true; clearT = 1.3;
    if (wave % 3 === 0 && hero.hp < 3) { hero.hp++; addPop(hero.x, hero.y - 30 * S, T.heal, '#ff6b8a', 20); tone(880, 0.3, 'sine', 0.12); }
  }
  if (clearing) { clearT -= dt; if (clearT <= 0) { clearing = false; startWave(wave + 1); } }

  // boomerang
  const b = boom;
  b.ang += dt * 26;
  b.px = b.x; b.py = b.y;
  if (b.state === 'hand') {
    b.x = hero.x; b.y = hero.y;
  } else if (b.state === 'out') {
    b.t += dt;
    const u = Math.min(1, b.t / b.tOut);
    const e = 1 - (1 - u) * (1 - u);
    const dx = b.tx - b.sx, dy = b.ty - b.sy, d = Math.hypot(dx, dy) || 1;
    const nx = -dy / d, ny = dx / d;
    const bend = Math.sin(Math.PI * u) * d * 0.16;
    b.x = b.sx + dx * e + nx * bend; b.y = b.sy + dy * e + ny * bend;
    if (u >= 1) { b.state = 'back'; b.t = 0; b.vx = (b.x - b.px) / Math.max(dt, 0.001) * 0.2; b.vy = (b.y - b.py) / Math.max(dt, 0.001) * 0.2; }
  } else if (b.state === 'back') {
    b.t += dt;
    const dx = hero.x - b.x, dy = hero.y - b.y, d = Math.hypot(dx, dy) || 1;
    const sp = Math.min(860 * S, 120 * S + b.t * 1700 * S);
    const k = Math.min(1, 7 * dt);
    b.vx += (dx / d * sp - b.vx) * k; b.vy += (dy / d * sp - b.vy) * k;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (d < hero.r + 12 * S || b.t > 5) {
      b.state = 'hand'; sCatch();
      burst(hero.x, hero.y, '#fff7c0', 6, 120 * S, 3 * S);
      if (chain >= 3) {
        const bonus = chain * chain * 5;
        score += bonus;
        const word = chain >= 10 ? T.legend : chain >= 6 ? T.great : T.nice;
        addPop(hero.x, hero.y - 36 * S, word + ' +' + bonus, chain >= 6 ? '#ff9a3c' : '#fff07a', chain >= 6 ? 26 : 22);
        tone(1046, 0.25, 'triangle', 0.1, 0, 0.05);
        if (chain >= 6) { tone(1318, 0.3, 'triangle', 0.1, 0, 0.13); tone(1568, 0.45, 'triangle', 0.1, 0, 0.21); burst(hero.x, hero.y, '#ffd04a', 24, 320 * S, 4 * S); }
      }
      if (pending && pending.age < 1.5) { const p = pending; throwAt(p.x, p.y); }
      pending = null;
    }
  }
  if (b.state !== 'hand') {

  const a = titleT * 2.2;
  const bx = cx + Math.cos(a) * rx, by = cy + Math.sin(a) * ry;
  for (let i = 10; i > 0; i--) { const aa = a - i * 0.06; ctx.fillStyle = `rgba(255,240,190,${(10 - i) / 30})`; ctx.beginPath(); ctx.arc(cx + Math.cos(aa) * rx, cy + Math.sin(aa) * ry, (10 - i) * 0.6 * S, 0, 7); ctx.fill(); }
  drawBoomShape(bx, by, titleT * 20, S * 1.5);
  ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
  fitText(T.title, W / 2, H * 0.2, W - 36, Math.round(36 * Math.min(1.3, S)), 900);
  ctx.fillStyle = '#ffcf5a';
  fitText(T.title2, W / 2, H * 0.2 + 46 * Math.min(1.3, S), W - 36, Math.round(46 * Math.min(1.3, S)), 900);
  ctx.restore();
  ctx.fillStyle = '#fff';
  const ls = Math.round(16 * Math.min(1.25, S));
  fitText(T.how1, W / 2, H * 0.66, W - 28, ls, 700);
  fitText(T.how2, W / 2, H * 0.66 + ls * 1.7, W - 28, ls, 700);
  ctx.fillStyle = '#ffe98a';
  fitText(T.how3, W / 2, H * 0.66 + ls * 3.4, W - 28, ls, 700);
  const p = 0.6 + 0.4 * Math.sin(titleT * 4);
  ctx.globalAlpha = p; ctx.fillStyle = '#fff';
  fitText(T.start, W / 2, H * 0.88, W - 40, Math.round(22 * Math.min(1.3, S)), 800);
  ctx.globalAlpha = 1;
  if (best > 0) { ctx.fillStyle = 'rgba(255,255,255,0.85)'; fitText(T.best + ' ' + best, W / 2, H * 0.94, W - 40, 14, 700); }
}
function drawOver() {
  ctx.fillStyle = 'rgba(10,25,15,0.62)'; ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  const k = Math.min(1.3, S);
  fitText(T.over, W / 2, H * 0.28, W - 40, Math.round(30 * k), 900);
  ctx.fillStyle = '#ffcf5a';
  fitText(String(score), W / 2, H * 0.41, W - 40, Math.round(64 * k), 900);
  ctx.fillStyle = '#fff';
  fitText(T.reached + ' ' + wave + (T.reached2 ? ' ' + T.reached2 : ''), W / 2, H * 0.5, W - 40, Math.round(17 * k), 700);
  if (isNewBest) { ctx.fillStyle = '#ff9fb4'; fitText(T.newBest, W / 2, H * 0.57, W - 40, Math.round(22 * k), 800); }
  else { ctx.fillStyle = 'rgba(255,255,255,0.85)'; fitText(T.best + ' ' + best, W / 2, H * 0.57, W - 40, Math.round(18 * k), 700); }
  if (stateT > 0.7) {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(stateT * 4); ctx.fillStyle = '#fff';
    fitText(T.again, W / 2, H * 0.75, W - 40, Math.round(21 * k), 800); ctx.globalAlpha = 1;
  }
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  let ox = 0, oy = 0;
  if (shake > 0) { const m = shake * 18 * S; ox = (Math.random() - 0.5) * m; oy = (Math.random() - 0.5) * m; }
  ctx.save(); ctx.translate(ox, oy);
  drawField();
  if (state !== 'title' && hero) drawPlay();
  ctx.restore();
  if (state !== 'title' && hero) drawHUD();
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  try { update(dt); draw(); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
</body>
