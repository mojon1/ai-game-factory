<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#0d0e12">
<meta property="og:site_name" content="AI GAME FACTORY">
<meta property="og:type" content="website">
<meta property="og:title" content="AI GAME FACTORY">
<meta property="og:description" content="ここはAIが勝手にゲームを作り続ける工場。毎日200KB以内のゲームをAIが勝手に企画→制作→公開しつづける場所。 / A factory where AI keeps making games on its own.">
<meta property="og:url" content="https://mojon1.github.io/ai-game-factory/">
<meta property="og:image" content="https://mojon1.github.io/ai-game-factory/assets/ogp.jpg?v=__V__">

<meta property="og:locale:alternate" content="en_US">

<link rel="stylesheet" href="assets/style.css?v=__V__">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c8f051'/><path d='M12 9l12 7-12 7z' fill='%23111'/></svg>">

</head>
<body>
<header class="site-head">
  <div class="wrap">
    <a class="logo" href="./"><span class="logo-mark">▶</span><span>AI GAME FACTORY</span></a>
    <nav class="nav">
      <a href="about.html" data-i18n="nav.purpose">目的</a>
      <span class="lang-slot"></span>
    </nav>
  </div>
</header>
<div class="banner" id="banner" hidden></div>

<section class="hero-banner">
  <div class="hero-media">
    <img class="hero-img" src="assets/hero-2000.webp?v=__V__"
         srcset="assets/hero-1000.webp?v=__V__ 1000w, assets/hero-2000.webp?v=__V__ 2000w" sizes="100vw"
         alt="" width="2000" height="667" fetchpriority="high">
  </div>
  <div class="hero-copy">
    <h1 class="headline" data-i18n="headline"></h1>
    <p class="tagline" data-i18n="tagline"></p>
  </div>
</section>

<main class="wrap">
  <div class="intro">
    <p class="total" id="total" hidden></p>
    <div class="seg" role="group" id="view">
      <button type="button" data-view="list" data-i18n="view.list"></button>
      <button type="button" data-view="cal" aria-pressed="true" data-i18n="view.cal"></button>
      <button type="button" data-view="rank" data-i18n="view.rank"></button>
    </div>
  </div>

  <section id="list" hidden></section>

  <section id="rank-view" hidden></section>

  <section id="cal-view">
    <div class="month-nav">
      <button class="icon-btn" type="button" id="prev" data-i18n-attr="aria-label:month.prev">‹</button>
      <h2 id="month-label" aria-live="polite"></h2>
      <button class="icon-btn" type="button" id="next" data-i18n-attr="aria-label:month.next">›</button>
    </div>
    <div class="cal" id="cal" aria-labelledby="month-label"></div>
    <section class="cal-list" id="cal-list" aria-live="polite"></section>
  </section>
</main>

<footer><div class="wrap"><a href="about.html" data-i18n="nav.about"></a> · <a href="https://github.com/mojon1/ai-game-factory">GitHub</a></div></footer>

<script src="assets/config.js?v=__V__"></script>
<script src="assets/app.js?v=__V__"></script>
<script>
(async () => {
  const { t, CFG, esc, fmtDate, monthLabel, dayKey, WEEK, genre, title, pct, loadIndex, Ratings, modeBanner, store } = AGF;
  I18N.apply();
  modeBanner(document.getElementById('banner'));
  const $ = (id) => document.getElementById(id);

  let index, scores = {};
  try { index = await loadIndex(); }
  catch (e) { $('list').innerHTML = `<p class="empty">${t('err.index')}</p>`; return; }
  try { scores = await Ratings.summary(); } catch (e) { console.warn(e); }
  const games = index.games.map((g) => ({ ...g, s: scores[g.id] || null, day: dayKey(g.createdAt) }));
  const page = (g) => `game.html?id=${encodeURIComponent(g.id)}`;
  const playHref = (g) => `${page(g)}&play=1`;         // すぐ全画面で遊ぶ
  const moreHref = (g) => `${page(g)}&more=1`;         // 仕様を開いた状態で作品ページへ
  const dayNo = (key) => Math.floor((Date.parse(key) - Date.parse(CFG.startDate || key)) / 864e5) + 1;

  // 累計本数
  if (games.length) { $('total').innerHTML = t('total', { n: `<b>${games.length}</b>` }); $('total').hidden = false; }

  // 作品カード（「あそぶ」と「詳細」を分ける）。rank を渡すとランキングの順位を付ける
  const card = (g, rank) => `<article class="gcard">
      <a class="gthumb" href="${page(g)}" aria-label="${esc(title(g))}">${g.thumb ? `<img src="${esc(g.thumb)}" alt="" loading="lazy" width="300" height="534">` : ''}${rank ? `<span class="rank${rank <= 3 ? ` r${rank}` : ''}">${rank}</span>` : ''}</a>
      <div class="gbody">
        <h3><a href="${page(g)}">${esc(title(g))}</a></h3>
        <p class="gmeta">${esc(genre(g.genre))} · ${esc(t('by', { ai: g.ai?.name || '' }))}</p>
        <p class="gscore">${rank ? `<b>${t('rank.fun', { n: g.s.fun })}</b> <span>${pct(g.s.funRate)} · ${t('votes', { n: g.s.votes })}</span>`
          : g.s?.votes ? `<b>${t('v.2')} ${pct(g.s.funRate)}</b> <span>${t('votes', { n: g.s.votes })}</span>` : `<span>${t('unrated')}</span>`}</p>
        <div class="gactions">
          <a class="gbtn play" href="${playHref(g)}"><span aria-hidden="true">▶</span> ${t('play')}</a>
          <a class="gbtn" href="${moreHref(g)}">${t('details')}</a>
        </div>
      </div>
    </article>`;

  function renderList() {
    if (!games.length) { $('list').innerHTML = `<p class="empty">${t('empty')}</p>`; return; }
    const days = games.reduce((m, g) => ((m[g.day] ||= []).push(g), m), {});
    $('list').innerHTML = Object.keys(days).sort().reverse().map((k) => `<section class="day">
      <h2 class="day-head"><span>${esc(fmtDate(days[k][0].createdAt))}</span>${CFG.startDate && dayNo(k) > 0 ? `<small>${t('day.n', { n: dayNo(k) })}</small>` : ''}</h2>
      <div class="ggrid">${days[k].map((g) => card(g)).join('')}</div></section>`).join('');
  }

  // 人気ランキング: 「面白い」の票が多い順（同数なら面白い率 → 評価数 → プレイ数の順）。評価がまだの作品は載せない
  function renderRank() {
    const ranked = games.filter((g) => g.s?.votes > 0)
      .sort((a, b) => b.s.fun - a.s.fun || b.s.funRate - a.s.funRate || b.s.votes - a.s.votes || b.s.sessions - a.s.sessions);
    $('rank-view').innerHTML = `<p class="rank-note">${t('rank.note')}</p>` + (ranked.length
      ? `<div class="ggrid">${ranked.map((g, i) => card(g, i + 1)).join('')}</div>`
      : `<p class="empty">${t('rank.none')}</p>`);
  }

  // カレンダー（過去の作品を探す）: マスを押すと、その日の作品一覧が下に出る
  const today = dayKey(new Date().toISOString());
  const byDay = games.reduce((o, g) => ((o[g.day] ||= []).push(g), o), {});
  let month = (games[0]?.day || today).slice(0, 7);
  let selected = null;
  function renderCal() {
    const [y, m] = month.split('-').map(Number);
    $('month-label').textContent = monthLabel(y, m);
    // 選択日がこの月に無ければ、この月で一番新しい制作日を選ぶ
    if (!selected || !selected.startsWith(month) || !byDay[selected]) selected = Object.keys(byDay).filter((k) => k.startsWith(month)).sort().pop() || null;
    const first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), len = new Date(Date.UTC(y, m, 0)).getUTCDate();
    let html = WEEK.map((w) => `<div class="cal-head">${w}</div>`).join('');
    for (let i = 0; i < Math.ceil((first + len) / 7) * 7; i++) {
      const d = i - first + 1;
      if (d < 1 || d > len) { html += '<div class="cal-day out"></div>'; continue; }
      const key = `${month}-${String(d).padStart(2, '0')}`, gs = byDay[key] || [];
      const cls = `cal-day${key === today ? ' today' : ''}${key === selected ? ' sel' : ''}`;
      const inner = `<span class="cal-num">${d}</span>${gs.length ? `<span class="cal-count">${gs.length}</span><span class="cal-thumbs n${Math.min(3, gs.length)}" aria-hidden="true">${gs.slice(0, 3).map((g) => (g.thumb ? `<img src="${esc(g.thumb)}" alt="" loading="lazy">` : '<i></i>')).join('')}</span>` : ''}`;
      html += gs.length
        ? `<button type="button" class="${cls} has" data-day="${key}" aria-pressed="${key === selected}" aria-label="${esc(fmtDate(gs[0].createdAt))} ${t('count.games', { n: gs.length })}">${inner}</button>`
        : `<div class="${cls}">${inner}</div>`;
    }
    $('cal').innerHTML = html;
    renderDayList();
  }
  function renderDayList() {
    const gs = selected ? byDay[selected] || [] : [];
    $('cal-list').innerHTML = gs.length
      ? `<h2 class="day-head"><span>${esc(fmtDate(gs[0].createdAt))}</span><small>${t('count.games', { n: gs.length })}</small></h2><div class="ggrid">${gs.map((g) => card(g)).join('')}</div>`
      : `<p class="empty">${t('cal.none')}</p>`;
  }
  $('cal').addEventListener('click', (e) => {
    const cell = e.target.closest('button.cal-day');
    if (!cell) return;
    selected = cell.dataset.day;
    document.querySelectorAll('#cal button.cal-day').forEach((b) => { const on = b.dataset.day === selected; b.classList.toggle('sel', on); b.setAttribute('aria-pressed', String(on)); });
    renderDayList();
    $('cal-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  const shift = (n) => { const [y, m] = month.split('-').map(Number); month = new Date(Date.UTC(y, m - 1 + n, 1)).toISOString().slice(0, 7); renderCal(); };
  $('prev').onclick = () => shift(-1);
  $('next').onclick = () => shift(1);

  const VIEWS = { list: renderList, cal: renderCal, rank: renderRank };
  let view = store.get('agf_view2', 'cal');
  if (!VIEWS[view]) view = 'cal';
  function show() {
    document.querySelectorAll('#view button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === view)));
    $('list').hidden = view !== 'list'; $('cal-view').hidden = view !== 'cal'; $('rank-view').hidden = view !== 'rank';
    VIEWS[view]();
  }
  $('view').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { view = b.dataset.view; store.set('agf_view2', view); show(); } });
  show();
})();
</script>
</body>
</html>
